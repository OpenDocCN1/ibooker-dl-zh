- raw: "In step 3, the relevant items and the user’s query are combined into the prompt.\
    \ This step is meant to provide the model with context for the generation step.\
    \ Essentially, you tell the LLM that you have contextual information that it can\
    \ use to derive its answer. Finally, in step 4, the augmented prompt is used by\
    \ the model to generate the output. The added contextual information should generally\
    \ result in more accurate and relevant responses, assuming that the contextual\
    \ information is indeed relevant and correct. Figure 4-15 illustrates the four\
    \ steps of inference with RAG.\n\n![A diagram of a diagram AI-generated content\
    \ may be incorrect.](assets/ch04_figure_15_1760455018636234.png)\n\n###### \n\n\
    RAG is often used to minimize hallucination, which refers to the tendency of LLMs\
    \ to confidently produce an answer that is actually incorrect. By providing the\
    \ LLM with external information (which you assume to be true), the LLM is less\
    \ likely to “make up” information.\n\n![](assets/ch04_figure_16_1760455018636248.png)\n\
    \n###### \n\n![](assets/ch04_figure_17_1760455018636302.png)\n\n###### \n\n![A\
    \ diagram of a computer process AI-generated content may be incorrect.](assets/ch04_figure_18_1760455018636326.png)\n\
    \n###### \n\n## Agentic RAG\n\nIn vanilla RAG, the vector database can be considered\
    \ the long-term memory of the LLM. However, the LLM is only  *given* information\
    \ that is relevant to the query and has no agency over what is being retrieved.\n\
    \nIn agentic RAG, there is an agent instead of an LLM that can access the external\
    \ database as a tool and have control over which information it retrieves. Agency\
    \ over what is being retrieved is given back to the agent, who typically has access\
    \ to one or more external databases of information. Figure 4-19 illustrates this\
    \ idea of having the agent select from which source to retrieve contextual information\
    \ before deciding whether to generate the answer or to again retrieve additional\
    \ information.\n\n![](assets/ch04_figure_19_1760455018636341.png)\n\n###### \n\
    \nIn single-agent systems, agentic RAG is a router where you have several external\
    \ knowledge sources, and the agent decides which one(s) to use. You are essentially\
    \ adding all these knowledge sources and databases as tools instead of being a\
    \ static step that runs before the LLM generates output. Moreover, such an agentic\
    \ RAG system does not always have to run the agentic RAG based on the query itself.\
    \ As seen in Figure 4-20, it may decide to extract information from one search\
    \ and then run a subsequent search based on that information in another database.\n\
    \n![](assets/ch04_figure_20_1760455018636355.png)\n\n###### \n\nAgentic RAG does\
    \ not limit itself to single-agent systems. In Multi-Agent RAG systems, multiple\
    \ agents have the capabilities to extract information from external sources. Oftentimes,\
    \ you have smaller retrieval agents that are being coordinated by a single agent\
    \ with more capabilities. These smaller retrieval agents are each specialized\
    \ in extracting specific information or working with specific knowledge sources\
    \ (see Figure 4-21). Note that it does not always have to be a vector database\
    \ as an external knowledge source; it can also be a web search or querying some\
    \ API for information (like your Slack or Gmail).\n\n![A diagram of a company\
    \ AI-generated content may be incorrect.](assets/ch04_figure_21_1760455018636389.png)\n\
    \n###### \n\nIn other words, instead of querying the vector database through a\
    \ static step only once, by hooking it as a tool, the agent can dynamically decide\
    \ how many times it needs to query the semantic memory until it has enough context\
    \ to answer a given query. Note how we discussed LLMs in the context of RAG but\
    \ agents in the context of Agentic RAG instead. It demonstrates the agency and\
    \ autonomy in accessing their respective RAG capabilities.\n\nLet’s go over some\
    \ examples of how these agentic RAG systems work through impactful papers and\
    \ implementations in the field.\n\n### A-MEM\n\nAn interesting approach to agentic\
    \ RAG is A-MEM, an agentic memory system derived from the notetaking method known\
    \ as Zettelkasten.^([6](#ch01.html_id121)) Zettelkasten approaches note-taking\
    \ as having three important components, namely atomicity, hypertextual notes,\
    \ and personalization.\n\nAtomicity means that each Zettel (a note) should only\
    \ contain one unit of knowledge, referred to as an atom. This note could, for\
    \ example, contain a brief description of how memory works in agentic systems.\n\
    \nThen, hypertextual notes refer to the idea that all notes refer to each other\
    \ and may explain or expand on each other’s content. For instance, the previously\
    \ created note can be connected to another note that has some information about\
    \ RAG. Since both are memory systems, they are likely to be related. The ideas\
    \ of atomicity and hypertextual notes are illustrated in Figure 4-22. Together,\
    \ they may create an interconnected web of notes, ideas, and may create larger\
    \ topics of interconnected notes.\n\n![](assets/ch04_figure_22_1760455018636414.png)\n\
    \n###### \n\nA-MEM uses this idea of note-taking to agentic memory by creating\
    \ these interconnected notes. In the context of agents, each note contains the\
    \ following information and can be considered a piece of memory:\n\n*   The original\
    \  *interaction* with the environment (i.e., one turn)\n\n*   The *timestamp*\
    \ of the interaction\n\n*   LLM-generated *keywords* that capture key concepts\n\
    \n*   LLM-generated *tags* to categorize the interaction\n\n*   LLM-generated\
    \ *contextual description*\n\nBy focusing on a single unit, namely a single interaction,\
    \ A-MEM adheres to the principle of atomicity.\n\nThen, all pieces of information\
    \ are embedded so that they can be used to later on easily retrieve related information.\
    \ Note that all information, except for the timestamp, is concatenated so that\
    \ a single embedding is created for the entire note/memory (Figure 4-23).\n\n\
    ![](assets/ch04_figure_23_1760455018636435.png)\n\n###### \n\nInterestingly, the\
    \ authors use this generated note embedding as one of the main IDs of the note.\
    \ To link this note to other memories, they run a similarity search between this\
    \ note’s embeddings and all other memories and extract the top-k memories. After\
    \ doing so, the LLM is asked to decide which of these candidate memories should\
    \ be linked to the newly added memory.\n\nAfter the memory is added and linked\
    \ to other memories, the LLM is prompted to update the LLM-generated tags, keywords,\
    \ and description based on the newly added memory. This results in an evolutionary\
    \ approach where newly added memories are linked to older memories, which are\
    \ in turn updated to be in line with the newly added memories. Figure 4-24 illustrates\
    \ this ever-evolving database of notes in the form of memories.\n\n![](assets/ch04_figure_24_1760455018636451.png)\n\
    \n###### \n\nThis agentic RAG system allows the agent to access the A-MEM and\
    \ search for memories that relate to the query. The links that are made between\
    \ notes are used when retrieving relevant information. The agent can choose to\
    \ retrieve all notes that have links to the retrieved note.\n\nWe again see that\
    \ these memory systems mirror aspects of human memory. Many insights from how\
    \ we store and use knowledge often serve as inspiration for the design of agentic\
    \ memory systems.\n\n### Search-o1\n\nA recent approach to agentic RAG is search-o1,\
    \ a method that attempts to retrieve relevant context and put it throughout the\
    \ reasoning traces to enhance the reasoning LLM’s capabilities further.^([7](#ch01.html_id122))\
    \ Instead of autonomously searching for relevant information and using it in the\
    \ prompt of the model, the information can be searched and retrieved *during*\
    \  the LLM’s reasoning process. The Agent is instructed to use the *<|begin\\\
    _search\\_query|>* and *<|end\\_search\\_query|>* tokens to start a search and\
    \ then use the *<|begin\\_search\\_result|>* and *<|end\\_search\\_result|>* tokens\
    \ to indicate what the retrieved information is. Figure 4-25 demonstrates this\
    \ agentic RAG during reasoning.\n\n![](assets/ch04_figure_25_1760455018636466.png)"
  fmt: '

    In step 3, the relevant items and the user’s query are combined into the prompt.
    This step is meant to provide the model with context for the generation step.
    Essentially, you tell the LLM that you have contextual information that it can
    use to derive its answer. Finally, in step 4, the augmented prompt is used by
    the model to generate the output. The added contextual information should generally
    result in more accurate and relevant responses, assuming that the contextual information
    is indeed relevant and correct. Figure 4-15 illustrates the four steps of inference
    with RAG.


    ![A diagram of a diagram AI-generated content may be incorrect.](assets/ch04_figure_15_1760455018636234.png)


    RAG is often used to minimize hallucination, which refers to the tendency of LLMs
    to confidently produce an answer that is actually incorrect. By providing the
    LLM with external information (which you assume to be true), the LLM is less likely
    to “make up” information.


    ![](assets/ch04_figure_16_1760455018636248.png)


    ![](assets/ch04_figure_17_1760455018636302.png)


    ![A diagram of a computer process AI-generated content may be incorrect.](assets/ch04_figure_18_1760455018636326.png)


    ## Agentic RAG


    In vanilla RAG, the vector database can be considered the long-term memory of
    the LLM. However, the LLM is only *given* information that is relevant to the
    query and has no agency over what is being retrieved.


    In agentic RAG, there is an agent instead of an LLM that can access the external
    database as a tool and have control over which information it retrieves. Agency
    over what is being retrieved is given back to the agent, who typically has access
    to one or more external databases of information. Figure 4-19 illustrates this
    idea of having the agent select from which source to retrieve contextual information
    before deciding whether to generate the answer or to again retrieve additional
    information.


    ![](assets/ch04_figure_19_1760455018636341.png)


    In single-agent systems, agentic RAG is a router where you have several external
    knowledge sources, and the agent decides which one(s) to use. You are essentially
    adding all these knowledge sources and databases as tools instead of being a static
    step that runs before the LLM generates output. Moreover, such an agentic RAG
    system does not always have to run the agentic RAG based on the query itself.
    As seen in Figure 4-20, it may decide to extract information from one search and
    then run a subsequent search based on that information in another database.


    ![](assets/ch04_figure_20_1760455018636355.png)


    Agentic RAG does not limit itself to single-agent systems. In Multi-Agent RAG
    systems, multiple agents have the capabilities to extract information from external
    sources. Oftentimes, you have smaller retrieval agents that are being coordinated
    by a single agent with more capabilities. These smaller retrieval agents are each
    specialized in extracting specific information or working with specific knowledge
    sources (see Figure 4-21). Note that it does not always have to be a vector database
    as an external knowledge source; it can also be a web search or querying some
    API for information (like your Slack or Gmail).


    ![A diagram of a company AI-generated content may be incorrect.](assets/ch04_figure_21_1760455018636389.png)


    In other words, instead of querying the vector database through a static step
    only once, by hooking it as a tool, the agent can dynamically decide how many
    times it needs to query the semantic memory until it has enough context to answer
    a given query. Note how we discussed LLMs in the context of RAG but agents in
    the context of Agentic RAG instead. It demonstrates the agency and autonomy in
    accessing their respective RAG capabilities.


    Let’s go over some examples of how these agentic RAG systems work through impactful
    papers and implementations in the field.


    ### A-MEM


    An interesting approach to agentic RAG is A-MEM, an agentic memory system derived
    from the notetaking method known as Zettelkasten.^([6](#ch01.html_id121)) Zettelkasten
    approaches note-taking as having three important components, namely atomicity,
    hypertextual notes, and personalization.


    Atomicity means that each Zettel (a note) should only contain one unit of knowledge,
    referred to as an atom. This note could, for example, contain a brief description
    of how memory works in agentic systems.


    Then, hypertextual notes refer to the idea that all notes refer to each other
    and may explain or expand on each other’s content. For instance, the previously
    created note can be connected to another note that has some information about
    RAG. Since both are memory systems, they are likely to be related. The ideas of
    atomicity and hypertextual notes are illustrated in Figure 4-22. Together, they
    may create an interconnected web of notes, ideas, and may create larger topics
    of interconnected notes.


    ![](assets/ch04_figure_22_1760455018636414.png)


    A-MEM uses this idea of note-taking to agentic memory by creating these interconnected
    notes. In the context of agents, each note contains the following information
    and can be considered a piece of memory:


    * The original *interaction* with the environment (i.e., one turn)

    * The *timestamp* of the interaction

    * LLM-generated *keywords* that capture key concepts

    * LLM-generated *tags* to categorize the interaction

    * LLM-generated *contextual description*


    By focusing on a single unit, namely a single interaction, A-MEM adheres to the
    principle of atomicity.


    Then, all pieces of information are embedded so that they can be used to later
    on easily retrieve related information. Note that all information, except for
    the timestamp, is concatenated so that a single embedding is created for the entire
    note/memory (Figure 4-23).


    ![](assets/ch04_figure_23_1760455018636435.png)


    Interestingly, the authors use this generated note embedding as one of the main
    IDs of the note. To link this note to other memories, they run a similarity search
    between this note’s embeddings and all other memories and extract the top-k memories.
    After doing so, the LLM is asked to decide which of these candidate memories should
    be linked to the newly added memory.


    After the memory is added and linked to other memories, the LLM is prompted to
    update the LLM-generated tags, keywords, and description based on the newly added
    memory. This results in an evolutionary approach where newly added memories are
    linked to older memories, which are in turn updated to be in line with the newly
    added memories. Figure 4-24 illustrates this ever-evolving database of notes in
    the form of memories.


    ![](assets/ch04_figure_24_1760455018636451.png)


    This agentic RAG system allows the agent to access the A-MEM and search for memories
    that relate to the query. The links that are made between notes are used when
    retrieving relevant information. The agent can choose to retrieve all notes that
    have links to the retrieved note.


    We again see that these memory systems mirror aspects of human memory. Many insights
    from how we store and use knowledge often serve as inspiration for the design
    of agentic memory systems.


    ### Search-o1


    A recent approach to agentic RAG is search-o1, a method that attempts to retrieve
    relevant context and put it throughout the reasoning traces to enhance the reasoning
    LLM’s capabilities further.^([7](#ch01.html_id122)) Instead of autonomously searching
    for relevant information and using it in the prompt of the model, the information
    can be searched and retrieved *during* the LLM’s reasoning process. The Agent
    is instructed to use the `<|begin_search_query|>` and `<|end_search_query|>` tokens
    to start a search and then use the `<|begin_search_result|>` and `<|end_search_result|>`
    tokens to indicate what the retrieved information is. Figure 4-25 demonstrates
    this agentic RAG during reasoning.


    ![](assets/ch04_figure_25_1760455018636466.png)


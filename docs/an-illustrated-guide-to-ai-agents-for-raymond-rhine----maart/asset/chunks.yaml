    The authors explored both PPO and GRPO as reinforcement learning algorithms, as
    illustrated in Figure 5-25. Both are, at the time of writing (September 2025),
    two of the most popular methods of reinforcement learning for LLMs, as we will
    explore more in depth in Chapter X. Note that the losses in PPO and GRPO are typically
    calculated over the entire sequence of tokens, including the output of the search
    engine. In Search-R1, the tokens of the search engine’s output were masked (ignored)
    to prevent the model from attempting to control the search engine’s output, which
    were not directly LLM-generated (which can create unexpected dynamics). This is
    called *Loss Masking for Retrieved Tokens*.


    ![A diagram of a process AI-generated content may be incorrect.](assets/ch05_figure_25_1760455020912301.png)


    These kinds of frameworks and methodologies leveraging reinforcement learning
    have become increasingly popular as the reward structure for tool calling is generally
    quite straightforward. It is trivial to check if a tool has been called correctly
    and if the correct arguments have been used (like in ToolRL). Moreover, reinforcement
    learning works well for rewards that are verifiable, like coding and tool calling.
    As such, there has been an increase in models that were trained using reinforcement
    learning and additionally adopted tool-based rewards, like the strong open-source
    Qwen3^([12](#ch02.html_id147)) and GPT-OSS^([13](#ch02.html_id148)) models.


    # Model Context Protocol (MCP)


    In the previous sections, we explored how to connect tools to LLMs, making them
    capable of much more than text generation. Although their ability to then use
    tools is incredible, it is not a free lunch. Imagine you have developed several
    prompts to instruct your LLM on how to use tools. As is typical in this field,
    a new LLM release that you would like to try out, together with all the tools.
    Now imagine it has a new way of calling tools, which means you will have to create
    new integrations for all your tools. This is the NxM problem, where N is the number
    of LLMs and M is the number of tools available. You would have to write custom
    integrations for every LLM/tool combination.


    Model Context Protocol (MCP) solves this problem by standardizing how you would
    connect tools and APIs with different structures to your LLM. It is an open standard
    and framework developed by Anthropic.^([14](#ch02.html_id149)) As a protocol,
    it facilitates two-way communication between tools and LLMs. It is often referred
    to as the “USB-C port of AI” due to its universal nature, allowing for any LLM
    to implement any tool that follows this protocol. Seen in Figure 5-26, instead
    of manually creating connections between LLMs and tools, MCP creates only a single
    connection that can be maintained indefinitely by the tool provider.


    ![](assets/ch05_figure_26_1760455020912315.png)


    By having the MCP server handle the integrations and communicate the tools to
    the LLMs, it becomes N+M connections that need to be maintained instead of NxM
    connections. Moreover, as long as the tool provider has an MCP server, connecting
    the server to your LLM is relatively straightforward, but more on that later!


    The maintenance of the integration, therefore, also moves from the user to the
    tool provider. Without MCP, if the arXiv’s API were to suddenly change drastically,
    then each user would have to adjust their integrations. With MCP, any changes
    to the API would need to be resolved only once by the maintainers of that API.
    Then, the updates can be rolled out to all users without any intervention from
    their side.


    To illustrate this point a bit further, if you were to add tools to your LLM manually,
    all tools would have to be:


    *   manually **tracked** and fed to the LLM,

    *   manually **described** (including its expected JSON schema)

    *   manually **updated** whenever its API changes


    As shown in Figure 5-27, this can be quite the hassle for maintaining your tools.


    ![](assets/ch05_figure_27_1760455020912328.png)


    Thus, MCP not only solves the NxM problem but also the problem of standardization.
    Note that MCP is not the only protocol for standardizing communication, like Agent
    2 Agent (A2A) for standardizing inter-agent communication.^([15](#ch02.html_id150))
    Although there are others, in 2025, it is arguably one of the most popular protocols
    out there.^([16](#ch02.html_id151))


    ## Core Components


    To achieve all these amazing capabilities, MCP consists of four components:


    MCP Server

    : Provides context, tools, and capabilities to the LLMs


    MCP Host

    : Llm application (such as Cursor) that manages connections


    MCP Client

    : Maintains one-to-one connections with MCP servers


    Resources

    : The tools, data, or services that are provided locally or remotely


    The *MCP Host* is any application that uses an LLM to use external tools. Typical
    examples are chat assistants like ChatGPT or Claude and IDE extensions like Cursor
    or GitHub Copilot. This is the “brain” of the MCP flow and makes calls to the
    MCP Servers via the MCP Clients.


    The *MCP Client* maintains connections with the MCP servers. They exist within
    the host and handle the connection management, discovery of tool capabilities,
    request forwarding, etc. Compared to the host, it is a piece of code that handles
    the communication with the MCP Servers, whereas the MCP Host only initiates the
    communication.


    The *MCP Server* is a lightweight program that exposes APIs and tools via the
    MCP standard. These servers often connect to a specific data source or service.
    For instance, an MCP server might connect to all API endpoints of arXiv to search,
    load, and view academic papers.


    To sum up, the **MCP Host** (e.g., GitHub Copilot) contains an **MCP Client**
    that connects to multiple **MCP Servers** (which provide tools, resources, or
    data sources).


    These three components are visualized in Figure 5-28.


    ![](assets/ch05_figure_28_1760455020912341.png)


    ## The MCP Flow


    MCP can be a bit of a mystery, even when showing and describing the core components.
    Instead, let us go through an example of what it would be like to use the MCP
    to discover and call tools. Imagine you want your AI assistant (perhaps GitHub
    Copilot or Claude code) to summarize the 5 latest commits from your repository.
    This flow is numbered in the upcoming Figures so we can accurately track each
    and individual step.


    It would all start with the user’s query: “Summarize the 5 latest commits”. Seen
    in Figure 5-29, this prompt is sent to the MCP Host (1), which asks the MCP Server,
    through the MCP Client, which tools are available (2). The MCP Server is connected
    to the set of tools (GitHub) and returns the list of all available API calls back
    to the MCP Host (3). API calls might include common methodologies like listing
    all commits (`/list_commits`) or creating a pull request (`/create_pr`). Then,
    the initial prompt, together with available tools, is sent to the LLM (4).


    ![A diagram of a software process AI-generated content may be incorrect.](assets/ch05_figure_29_1760455020912355.png)


    Next, the LLM may choose to use any of the tools that were returned (Figure 5-30).
    Since the user’s query is about commits, the LLM decides that it wants the MCP
    server to use the `/list_commits` tool (5). The MCP Client communicates this action
    to the MCP Server (6), which finally executes the command (7). The output of the
    tool usage is returned to the MCP server (8), which communicates it back to the
    MCP Client and Host through the MCP Protocol (9).


    ![](assets/ch05_figure_30_1760455020912368.png)


    When the LLM receives the results (10), it can choose to run another tool or return
    the output to the MCP Host and then to the user. In our example, the LLM decides
    to summarize the 5 latest commits that it received (11) and return the summary
    back to the user (12). See Figure 5-31.


    ![](assets/ch05_figure_31_1760455020912381.png)


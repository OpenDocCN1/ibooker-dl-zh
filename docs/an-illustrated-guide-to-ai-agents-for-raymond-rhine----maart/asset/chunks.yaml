- raw: "In *task planning*, the LLM decides which types of tasks are best suited for\
    \ the given query. Tasks are essentially the categories of models that you can\
    \ find on the HuggingFace Hub. A wide variety of tasks are available, ranging\
    \ from text classification and summarization to image-to-text and object detection.\
    \ In total, there are 24 tasks with potentially millions of models hosted on the\
    \ HuggingFace Hub. The LLM chooses the task(s) and their order through a prompt\
    \ design that consists of specification-based instruction demonstration parsing.\n\
    \nWith specification-based instruction, instructions are provided on the formatting\
    \ of tasks in JSON. It is a description of what we expect the output should be\
    \ rather than an example. A part of the full prompt is provided below that demonstrates\
    \ this specification-based instruction:\n\n```\n\"\"\"\n#1 Task Planning Stage\n\
    The AI assistant performs task parsing on user input, generating a list of tasks\
    \ with the following format: [{\"task\": task,\"id\", task_id, \"dep\":dependency_task_ids,\
    \ \"args\":{\"text\": text, \"image\": URL, \"audio\": URL, \"video\": URL}}].\
    \ \n \nThe \"dep\" field denotes the id of  the previous task which generates\
    \ a new resource upon which the current task relies. \nThe tag \"<resource>-task_id\"\
    \ represents the generated text, image, audio, or video from the dependency task\
    \ with the corresponding task_id. \nThe task must be selected from the following\
    \ options: {{AvailableTaskList}}. \n \nPlease note that there exists a logical\
    \ connection and order between the tasks. \n \nIn case the user input cannot be\
    \ parsed, an empty JSON response should be provided. Here are several cases for\
    \ your reference: {{Demonstrations}}. \n \nTo assist with task planning, the chat\
    \ history is available as {{ChatLogs}}, where you can trace the user-mentioned\
    \ resources and incorporate them into the task planning stage.\n\"\"\"\n```\n\n\
    To better understand this JSON parsing, examples are given of queries and outputs\
    \ through in-context learning, which they named demonstration-based parsing. Illustrated\
    \ in Figure 5-15 is an example of how these examples were structured.\n\n![](assets/ch05_figure_15_1760455020912166.png)\n\
    \n###### \n\n#### Model Selection\n\nAfter selecting the appropriate tasks to\
    \ execute, the models within those specific tasks still need to be chosen. Below\
    \ is the prompt template used for asking the agent to select the best model for\
    \ the given task.\n\n```\n\"\"\"\n#2 Model Selection Stage\nGiven the user request\
    \ and the call command, the AI assistant helps the user to select a suitable model\
    \ from a list of models to process the user request.\n \nThe AI assistant merely\
    \ outputs the model id of the most appropriate model.\n \nThe output must be in\
    \ a strict JSON format:\n{\"id\":\"id\", \"reason\":\"your detail reason for the\
    \ choice\"}. \n \nWe have a list of models for you to choose from {{CandidateModels}}.\
    \ Please select one model from the list.\n\"\"\"\n```\n\nSince each task on the\
    \ Hugging Face Hub can potentially have hundreds of thousands of models, only\
    \ a subset is extracted from the tasks that were selected in the previous step.\
    \ Specifically, the authors used the download count on the Hub as a proxy for\
    \ the model quality and extracted the Top-K models based on that ranking. This\
    \ selection is contained in the `CandidateModels` variable and formatted like\
    \ so:\n\n```\n{\"model_id\": id#1, \"metadata\": info#1, \"description\": model\
    \ description #1} \n{\"model_id\": id#2, \"metadata\": info#2, \"description\"\
    : model description #2} \n...\n{\"model_id\": id#K, \"metadata\": info#K, \"description\"\
    : model description #K}\n```\n\n#### Task Execution\n\nNext, each selected model\
    \ is executed with their relevant arguments. Models are run in parallel if possible.\
    \ For example, if prompted to generate summaries of different PDFs, separate models\
    \ can run in parallel to execute this task. This resource dependency is carefully\
    \ tracked to decide which models can be run in parallel and which models require\
    \ other models to have a completed run.\n\n#### Response Generation\n\nFinally,\
    \ the inputs and outputs of all previous steps are given to the model to generate\
    \ the final response. This includes the user’s input, task planning, model selection,\
    \ and task execution. The prompt details how the agent should parse the results\
    \ and effectively create a summary.\n\n```\n\"\"\"\n# 4 Response Generation Stage\n\
    With the input and the inference results, the AI assistant needs to describe the\
    \ process and results. \n \nThe previous stages can be formed as:\n \n- User Input:\
    \ {{ User Input }}\n- Task Planning: {{ Tasks }}\n- Model Selection: {{ Model\
    \ Assignment }}\n- Task Execution: {{ Predictions }} \n \nYou must first answer\
    \ the user’s request in a straightforward manner. Then describe the task process\
    \ and show your analysis and model inference results to the user in the first\
    \ person. If inference results contain a file path, must tell the user the complete\
    \ file path. If there is nothing in the results, please tell me you can’t make\
    \ it.\n\"\"\"\n```\n\nYou must first answer the user’s request in a straightforward\
    \ manner. Then describe the task process and show your analysis and model inference\
    \ results to the user in the first person. If inference results contain a file\
    \ path, must tell the user the complete file path. If there is nothing in the\
    \ results, please tell me you can’t make it.\n\nNote that this framework used\
    \ older LLMs like Alpaca-7b, Vicuna-7b, and GPT-3.5 to evaluate its performance.\
    \ These models were not specifically trained on tool-calling tasks, but demonstrate\
    \ tool-calling behavior from in-context learning. As such, HuggingGPT is a great\
    \ example of how far you can go with structured prompting and in-context learning.\n\
    \n## Supervised Fine-tuning\n\nAlthough prompting is a straightforward method\
    \ for enabling tool usage, it does require filling up the context window with\
    \ additional instructions. As we explored in the previous chapter, we want to\
    \ prevent filling up the context window, as it might degrade the performance of\
    \ your model. There is also a risk of the model not following instructions through\
    \ prompting if you have too many instructions.\n\nA great alternative is to train\
    \ your model using supervised fine-tuning to distill knowledge and capabilities\
    \ on tool calling into the model itself. This was especially popular in 2023 and\
    \ the beginning of 2024 as it proved to be an effective and relatively cheap method\
    \ for adding tool calling capabilities.\n\n### ToolFormer\n\nAn interesting technique\
    \ to explore supervised fine-tuning for tool calling (including some other tricks)\
    \ is Toolformer, a model trained to decide which APIs to call and how.^([8](#ch02.html_id143))\n\
    \nBefore exploring the training process, let’s first dive into their approach\
    \ to calling a tool. In previous examples, the tool that should be called was\
    \ structured using JSON schemas, and the output of the call was sent back to the\
    \ LLM to process. Toolformer takes a different approach by embedding the call\
    \ and its output in the text it’s generating. It does so by using the `[` and\
    \ `]`  tokens to indicate the start and end of calling a tool. When given a prompt,\
    \ “*What is 5.1 times 7.3?*”, it starts generating tokens until it reaches the\
    \ `[` token (shown in Figure 5-16).\n\n![](assets/ch05_figure_16_1760455020912180.png)\n\
    \n###### \n\nThe `[` token tells the LLM that it should start selecting the tool\
    \ and generate the appropriate parameters following a fixed format (more on this\
    \ later!). It does this until it reaches the → token (Figure 5-17).\n\n![A blue\
    \ squares with white text AI-generated content may be incorrect.](assets/ch05_figure_17_1760455020912194.png)\n\
    \n###### \n\nThe → token tells the LLM that it can now completely stop generating\
    \ tokens will the user or an automated system executes the selected tool. Instead\
    \ of appending the output through the messages structure as we explored before,\
    \ it is added to the previously generated tokens along with the `]` token (shown\
    \ in Figure 5-18).\n\n![](assets/ch05_figure_18_1760455020912207.png)\n\n###### "
  fmt: "\n## HuggingGPT\n\n### Task Planning\n\nIn *task planning*, the LLM decides\
    \ which types of tasks are best suited for the given query. Tasks are essentially\
    \ the categories of models that you can find on the HuggingFace Hub. A wide variety\
    \ of tasks are available, ranging from text classification and summarization to\
    \ image-to-text and object detection. In total, there are 24 tasks with potentially\
    \ millions of models hosted on the HuggingFace Hub. The LLM chooses the task(s)\
    \ and their order through a prompt design that consists of specification-based\
    \ instruction demonstration parsing.\n\nWith specification-based instruction,\
    \ instructions are provided on the formatting of tasks in JSON. It is a description\
    \ of what we expect the output should be rather than an example. A part of the\
    \ full prompt is provided below that demonstrates this specification-based instruction:\n\
    \n```\n\"\"\"\n#1 Task Planning Stage\nThe AI assistant performs task parsing\
    \ on user input, generating a list of tasks with the following format: [{\"task\"\
    : task,\"id\", task_id, \"dep\":dependency_task_ids, \"args\":{\"text\": text,\
    \ \"image\": URL, \"audio\": URL, \"video\": URL}}].\n\nThe \"dep\" field denotes\
    \ the id of  the previous task which generates a new resource upon which the current\
    \ task relies. \nThe tag \"<resource>-task_id\" represents the generated text,\
    \ image, audio, or video from the dependency task with the corresponding task_id.\
    \ \nThe task must be selected from the following options: {{AvailableTaskList}}.\
    \ \n\nPlease note that there exists a logical connection and order between the\
    \ tasks. \n\nIn case the user input cannot be parsed, an empty JSON response should\
    \ be provided. Here are several cases for your reference: {{Demonstrations}}.\
    \ \n\nTo assist with task planning, the chat history is available as {{ChatLogs}},\
    \ where you can trace the user-mentioned resources and incorporate them into the\
    \ task planning stage.\n\"\"\"\n```\n\nTo better understand this JSON parsing,\
    \ examples are given of queries and outputs through in-context learning, which\
    \ they named demonstration-based parsing. Illustrated in Figure 5-15 is an example\
    \ of how these examples were structured.\n\n![](assets/ch05_figure_15_1760455020912166.png)\n\
    \n### Model Selection\n\nAfter selecting the appropriate tasks to execute, the\
    \ models within those specific tasks still need to be chosen. Below is the prompt\
    \ template used for asking the agent to select the best model for the given task.\n\
    \n```\n\"\"\"\n#2 Model Selection Stage\nGiven the user request and the call command,\
    \ the AI assistant helps the user to select a suitable model from a list of models\
    \ to process the user request.\n\nThe AI assistant merely outputs the model id\
    \ of the most appropriate model.\n\nThe output must be in a strict JSON format:\n\
    {\"id\":\"id\", \"reason\":\"your detail reason for the choice\"}. \n\nWe have\
    \ a list of models for you to choose from {{CandidateModels}}. Please select one\
    \ model from the list.\n\"\"\"\n```\n\nSince each task on the Hugging Face Hub\
    \ can potentially have hundreds of thousands of models, only a subset is extracted\
    \ from the tasks that were selected in the previous step. Specifically, the authors\
    \ used the download count on the Hub as a proxy for the model quality and extracted\
    \ the Top-K models based on that ranking. This selection is contained in the `CandidateModels`\
    \ variable and formatted like so:\n\n```\n{\"model_id\": id#1, \"metadata\": info#1,\
    \ \"description\": model description #1} \n{\"model_id\": id#2, \"metadata\":\
    \ info#2, \"description\": model description #2} \n...\n{\"model_id\": id#K, \"\
    metadata\": info#K, \"description\": model description #K}\n```\n\n### Task Execution\n\
    \nNext, each selected model is executed with their relevant arguments. Models\
    \ are run in parallel if possible. For example, if prompted to generate summaries\
    \ of different PDFs, separate models can run in parallel to execute this task.\
    \ This resource dependency is carefully tracked to decide which models can be\
    \ run in parallel and which models require other models to have a completed run.\n\
    \n### Response Generation\n\nFinally, the inputs and outputs of all previous steps\
    \ are given to the model to generate the final response. This includes the user’s\
    \ input, task planning, model selection, and task execution. The prompt details\
    \ how the agent should parse the results and effectively create a summary.\n\n\
    ```\n\"\"\"\n# 4 Response Generation Stage\nWith the input and the inference results,\
    \ the AI assistant needs to describe the process and results. \n\nThe previous\
    \ stages can be formed as:\n\n- User Input: {{ User Input }}\n- Task Planning:\
    \ {{ Tasks }}\n- Model Selection: {{ Model Assignment }}\n- Task Execution: {{\
    \ Predictions }} \n\nYou must first answer the user’s request in a straightforward\
    \ manner. Then describe the task process and show your analysis and model inference\
    \ results to the user in the first person. If inference results contain a file\
    \ path, must tell the user the complete file path. If there is nothing in the\
    \ results, please tell me you can’t make it.\n\"\"\"\n```\n\nYou must first answer\
    \ the user’s request in a straightforward manner. Then describe the task process\
    \ and show your analysis and model inference results to the user in the first\
    \ person. If inference results contain a file path, must tell the user the complete\
    \ file path. If there is nothing in the results, please tell me you can’t make\
    \ it.\n\nNote that this framework used older LLMs like Alpaca-7b, Vicuna-7b, and\
    \ GPT-3.5 to evaluate its performance. These models were not specifically trained\
    \ on tool-calling tasks, but demonstrate tool-calling behavior from in-context\
    \ learning. As such, HuggingGPT is a great example of how far you can go with\
    \ structured prompting and in-context learning.\n\n## Supervised Fine-tuning\n\
    \nAlthough prompting is a straightforward method for enabling tool usage, it does\
    \ require filling up the context window with additional instructions. As we explored\
    \ in the previous chapter, we want to prevent filling up the context window, as\
    \ it might degrade the performance of your model. There is also a risk of the\
    \ model not following instructions through prompting if you have too many instructions.\n\
    \nA great alternative is to train your model using supervised fine-tuning to distill\
    \ knowledge and capabilities on tool calling into the model itself. This was especially\
    \ popular in 2023 and the beginning of 2024 as it proved to be an effective and\
    \ relatively cheap method for adding tool calling capabilities.\n\n### ToolFormer\n\
    \nAn interesting technique to explore supervised fine-tuning for tool calling\
    \ (including some other tricks) is Toolformer, a model trained to decide which\
    \ APIs to call and how.^([8](#ch02.html_id143))\n\nBefore exploring the training\
    \ process, let’s first dive into their approach to calling a tool. In previous\
    \ examples, the tool that should be called was structured using JSON schemas,\
    \ and the output of the call was sent back to the LLM to process. Toolformer takes\
    \ a different approach by embedding the call and its output in the text it’s generating.\
    \ It does so by using the `[` and `]`  tokens to indicate the start and end of\
    \ calling a tool. When given a prompt, “*What is 5.1 times 7.3?*”, it starts generating\
    \ tokens until it reaches the `[` token (shown in Figure 5-16).\n\n![](assets/ch05_figure_16_1760455020912180.png)\n\
    \nThe `[` token tells the LLM that it should start selecting the tool and generate\
    \ the appropriate parameters following a fixed format (more on this later!). It\
    \ does this until it reaches the `→` token (Figure 5-17).\n\n![A blue squares\
    \ with white text AI-generated content may be incorrect.](assets/ch05_figure_17_1760455020912194.png)\n\
    \nThe `→` token tells the LLM that it can now completely stop generating tokens\
    \ will the user or an automated system executes the selected tool. Instead of\
    \ appending the output through the messages structure as we explored before, it\
    \ is added to the previously generated tokens along with the `]` token (shown\
    \ in Figure 5-18).\n\n![](assets/ch05_figure_18_1760455020912207.png)\n"
  trans: "\n\n## HuggingGPT\n\n### 任务规划\n\n在*任务规划*中，LLM 会决定哪些类型的任务最适合给定的查询。从本质上讲，任务就是你在\
    \ HuggingFace Hub 上可以找到的模型类别。可用的任务种类繁多，从文本分类、摘要生成，到图像到文本、目标检测等。总共有 24 类任务，Hub\
    \ 上可能托管着数百万个模型。LLM 通过一种由基于规范的指令（specification-based instruction）和基于演示的解析（demonstration-based\
    \ parsing）构成的提示设计，来选择任务及其执行顺序。\n\n基于规范的指令会说明如何以 JSON 格式表示任务。它描述的是我们对输出格式的期望，而不是一个示例。下面展示了完整提示词的一部分，用来说明这种基于规范的指令：\n\
    \n```\n\"\"\"\n#1 Task Planning Stage\nThe AI assistant performs task parsing\
    \ on user input, generating a list of tasks with the following format: [{\"task\"\
    : task,\"id\", task_id, \"dep\":dependency_task_ids, \"args\":{\"text\": text,\
    \ \"image\": URL, \"audio\": URL, \"video\": URL}}].\n\nThe \"dep\" field denotes\
    \ the id of  the previous task which generates a new resource upon which the current\
    \ task relies. \nThe tag \"<resource>-task_id\" represents the generated text,\
    \ image, audio, or video from the dependency task with the corresponding task_id.\
    \ \nThe task must be selected from the following options: {{AvailableTaskList}}.\
    \ \n\nPlease note that there exists a logical connection and order between the\
    \ tasks. \n\nIn case the user input cannot be parsed, an empty JSON response should\
    \ be provided. Here are several cases for your reference: {{Demonstrations}}.\
    \ \n\nTo assist with task planning, the chat history is available as {{ChatLogs}},\
    \ where you can trace the user-mentioned resources and incorporate them into the\
    \ task planning stage.\n\"\"\"\n```\n\n为了更好地理解这种 JSON 解析，作者通过上下文学习（in-context\
    \ learning）给出了查询和输出的示例，并将其命名为基于演示的解析。图 5-15 展示了这些示例的构造方式。\n\n![](img/ch05_figure_15_1760455020912166.png)\n\
    \n### 模型选择\n\n在选定了要执行的合适任务之后，还需要从这些特定任务中选择模型。下面是为给定任务要求智能体选择最佳模型所用的提示模板：\n\n```\n\
    \"\"\"\n#2 Model Selection Stage\nGiven the user request and the call command,\
    \ the AI assistant helps the user to select a suitable model from a list of models\
    \ to process the user request.\n\nThe AI assistant merely outputs the model id\
    \ of the most appropriate model.\n\nThe output must be in a strict JSON format:\n\
    {\"id\":\"id\", \"reason\":\"your detail reason for the choice\"}. \n\nWe have\
    \ a list of models for you to choose from {{CandidateModels}}. Please select one\
    \ model from the list.\n\"\"\"\n```\n\n由于 Hugging Face Hub 上的每个任务都可能拥有数十万个模型，因此只会从上一步所选的任务中提取一个子集。具体来说，作者将\
    \ Hub 上的下载量作为模型质量的代理指标，并据此提取排名前 K 的模型。这个选择结果包含在 `CandidateModels` 变量中，格式如下：\n\n\
    ```\n{\"model_id\": id#1, \"metadata\": info#1, \"description\": model description\
    \ #1} \n{\"model_id\": id#2, \"metadata\": info#2, \"description\": model description\
    \ #2} \n...\n{\"model_id\": id#K, \"metadata\": info#K, \"description\": model\
    \ description #K}\n```\n\n### 任务执行\n\n接下来，每个被选中的模型都会使用其相关参数执行。如果可能，这些模型会并行运行。例如，如果要求为不同的\
    \ PDF 生成摘要，则可以并行运行多个模型来执行这一任务。这种资源依赖关系会被仔细跟踪，以决定哪些模型可以并行运行，哪些模型需要等待其他模型运行完成。\n\
    \n### 响应生成\n\n最后，所有先前步骤的输入和输出都会提供给模型，以生成最终响应。这包括用户输入、任务规划、模型选择和任务执行。提示词详细说明了智能体应如何解析结果并有效生成摘要。\n\
    \n```\n\"\"\"\n# 4 Response Generation Stage\nWith the input and the inference\
    \ results, the AI assistant needs to describe the process and results. \n\nThe\
    \ previous stages can be formed as:\n\n- User Input: {{ User Input }}\n- Task\
    \ Planning: {{ Tasks }}\n- Model Selection: {{ Model Assignment }}\n- Task Execution:\
    \ {{ Predictions }} \n\nYou must first answer the user’s request in a straightforward\
    \ manner. Then describe the task process and show your analysis and model inference\
    \ results to the user in the first person. If inference results contain a file\
    \ path, must tell the user the complete file path. If there is nothing in the\
    \ results, please tell me you can’t make it.\n\"\"\"\n```\n\n你必须首先直截了当地回应用户的请求。然后以第一人称描述任务过程，并向用户展示你的分析和模型推理结果。如果推理结果中包含文件路径，你必须告诉用户完整的文件路径。如果结果中没有任何内容，请告诉我你无法完成。\n\
    \n请注意，该框架使用了较旧的 LLM（如 Alpaca-7b、Vicuna-7b 和 GPT-3.5）来评估其性能。这些模型并未专门针对工具调用任务进行训练，但通过上下文学习展现出了工具调用行为。因此，HuggingGPT\
    \ 是一个很好的例子，展示了结构化提示和上下文学习能达到怎样的效果。\n\n## 监督微调\n\n尽管提示（prompting）是启用工具调用的直接方法，但它确实需要用额外的指令填满上下文窗口。正如我们在上一章所探讨的，我们希望避免填满上下文窗口，因为这可能会降低模型性能。此外，如果指令过多，模型也有可能无法通过提示来遵循这些指令。\n\
    \n一个很好的替代方案是使用监督微调（supervised fine-tuning）来训练模型，将工具调用的知识和能力蒸馏到模型本身之中。这种方法在 2023\
    \ 年及 2024 年初尤其流行，因为事实证明，它为模型添加工具调用能力既有效又相对廉价。\n\n### ToolFormer\n\n一个有趣的、用于探索工具调用监督微调（并包含其他一些技巧）的技术是\
    \ Toolformer，它是一个经过训练、能决定调用哪些 API 以及如何调用的模型。^(8)\n\n在探讨训练过程之前，我们先深入了解 Toolformer\
    \ 调用工具的方法。在之前的示例中，需要调用的工具是通过 JSON schema 结构化的，调用输出会被发送回 LLM 处理。Toolformer 采用了不同的方法：它将调用及其输出嵌入到正在生成的文本中。具体来说，它使用\
    \ `[` 和 `]` 这两个 token 来表示工具调用的开始和结束。当给定提示词“*5.1 乘以 7.3 等于多少？*”时，它会持续生成 token，直到遇到\
    \ `` token（如图 5-16 所示）。\n\n![\n\n`` token 会告诉 LLM：它应开始选择工具，并按照固定格式生成相应参数（稍后会详细介绍！）。它会一直这样做，直到遇到\
    \ `→` token（图 5-17）。\n\n![一个带有白色文字的蓝色方块；AI 生成的内容可能不正确。\n\n`→` token 告诉 LLM，它现在可以完全停止生成\
    \ token，由用户或自动化系统执行所选工具。与我们之前探讨的通过 messages 结构追加输出的方式不同，这里会将输出与 `]` token 一起添加到先前生成的\
    \ token 之后（如图 5-18 所示）。\n\n![](img/ch05_figure_18_1760455020912207.png)\n\n"

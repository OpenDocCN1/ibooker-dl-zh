- raw: "Even in this simplified example, there is a lot of dynamic behavior between\
    \ and within agents that update, store, and retrieve all kinds of context. Moreover,\
    \ all contexts in this example are texts and can be processed using a standard\
    \ LLM. For certain use cases, however, you might want it to be able to process\
    \ more modalities like images and sound. We will cover multimodal LLMs in more\
    \ detail in Chapters X and X.\n\n## Context Engineering for Multi-Agent Systems\n\
    \nAs we will cover more in-depth in Chapter X, multi-agent systems are where multiple\
    \ agents work together to solve a given problem. Our example of a deep research\
    \ agent used a summarization agent in its system, thereby working together. What\
    \ makes context engineering especially difficult in multi-agent systems is that\
    \ not only the context of the main agents needs to be carefully managed, so do\
    \ the contexts of all other agents in the system. Moreover, the interaction between\
    \ agents is also part of the shared context between those respective agents.\n\
    \nTo manage this complex network of contexts, smaller agents can be used to handle\
    \ some of the context “burden”, as we illustrated in the deep research agent.\
    \ By using a smaller agent with a smaller LLM for specific tasks, part of the\
    \ context can be handled separately, leaving significant compute for the main\
    \ agent (also called the orchestrator agent). What makes these small and/or specialized\
    \ agents great for context engineering is that they can work on smaller and more\
    \ manageable contexts, have clear responsibilities, and are easier to test and\
    \ debug. These systems can be more reliable by separating tasks instead of having\
    \ one agent juggle all kinds of different tasks and contexts.\n\n## Optimizing\
    \ the Context\n\nThroughout this chapter, we covered many different methods and\
    \ techniques for handling the memory and context of LLMs and Agents. Optimizing\
    \ what and how you put into the context is a multi-faceted problem that requires\
    \ an understanding of various parts of your agent’s architecture. Most strategies\
    \ to optimize the context are built upon the main source of context, the memory\
    \ modules of the Agent.\n\nAlthough there are many strategies, let’s explore the\
    \ most common ones.\n\n### Context Tracking and Storage\n\nBefore you give the\
    \ Agent a possible relevant context, it first needs to be tracked and stored somewhere.\
    \ We covered most of it already, as this relates to various forms of memory, and\
    \ in particular episodic memory, which contains the actions the agent has taken\
    \ thus far. Although episodic memory is seen as long-term memory, it is highly\
    \ related to the conversation history of the Agent, which tends to capture the\
    \ actions of the agent.\n\nHowever, tracking the context goes beyond just the\
    \ event traces of the agent. It also involves managing external knowledge sources,\
    \ like a database of your proprietary data, which can serve as additional context.\
    \ To set up these sources of knowledge, you will have to decide beforehand what\
    \ kinds of information you want to track. Although it may seem obvious at first,\
    \ there are many types of information you can track:\n\n*   Agent behavior\n\n\
    \    *   Tool usage by the agent (and any sub-agents)\n\n    *   Tool outputs\
    \ and intermediate results\n\n    *   Interactions between (sub-)agents\n\n  \
    \  *   Internal reasoning steps\n\n    *   Conversation history\n\n    *   Failures/successes\n\
    \n*   User behavior\n\n    *   User intent (explicit requests and goals)\n\n \
    \   *   User feedback (edits, approvals, rejections)\n\n*   Knowledge sources\n\
    \n    *   Snapshots of your proprietary database(s) for reproducibility and auditing\n\
    \n    *   External documents (RAG, APIs, etc.)\n\n    *   Structured artifacts\
    \ like `PLAN.md`, `REQUIREMENTS.md`, etc.\n\n*   System-level\n\n    *   Configuration\
    \ (LLM hyperparameters, available tools, etc.)\n\n    *   Policies (guardrails,\
    \ constraints, etc.)\n\nAll the above are merely examples of what you could possibly\
    \ track. In practice, not everything is going to be useful, and at the same time,\
    \ many other things should be included. As we will explore later on, tracking\
    \ these kinds of contexts and information also helps communicate the user’s intent\
    \ and debug these complex systems.\n\n### Context Selection\n\nAssuming you have\
    \ set up all your databases, the very first thing you can do to optimize the context\
    \ is to have a system in place that selects the right context. As we discussed\
    \ before, RAG is an amazing technique and example for selecting what is relevant.\
    \ Although we have seen variants of RAG that improve on this, we haven’t yet explored\
    \ how we can further improve this selection process.\n\nIn RAG, the input documents\
    \ are typically split into smaller parts, such as sentences or paragraphs, to\
    \ isolate the information they contain and keep it to a single subject. However,\
    \ when you then run a RAG pipeline, you typically get a collection of documents\
    \ in return. For example, if we search a vector database for the “causes of climate\
    \ change,” the system might return documents about greenhouse gases, industrial\
    \ activity, and deforestation. Although those documents might not directly answer\
    \ our question, they are related.\n\nTo improve this process, we can use a re-ranker\
    \ to refine the set of documents that were retrieved. This technique, often a\
    \ language model, takes in both the query and retrieved documents to re-rank the\
    \ retrieved documents based on their relevance to the query and to each other\
    \ (see Figure 4-32). By providing the re-ranker with additional context (all retrieved\
    \ documents), it can operate on far fewer documents than if we were to give it\
    \ the entire database. Moreover, after the results have been re-ranked according\
    \ to their relevance, we can choose to only keep the most relevant documents.\n\
    \n![](assets/ch04_figure_32_1760455018636610.png)\n\n###### \n\nRe-ranking is\
    \ only one of the many ways to select and create the right context. We can also\
    \ structure the output to ensure the responses of the Agent are broken up into\
    \ logical parts and only contain the necessary components. Likewise, we can employ\
    \ business rules that give additional weights to certain pieces of information\
    \ that always provide important context (much like a system prompt).\n\nNote that\
    \ selecting the right context can also mean selecting the right context for the\
    \ right agent. By isolating the context across multiple specialized agents, each\
    \ agent is able to focus on a smaller part of the problem without being overwhelmed\
    \ by the full context.\n\n### Context Compression\n\nThe goal of context engineering\
    \ is to find a balance between what you put in the context and how much. As such,\
    \ compressing the context as much as possible is an important strategy for optimizing\
    \ the context.\n\nA common way to handle compression is what we discussed at the\
    \ beginning of this chapter, using an LLM to create summaries of your conversation\
    \ history. As we explored in Search-o1, we can even compress the output of the\
    \ RAG pipeline using an LLM to summarize the retrieved documents.\n\nAnother method\
    \ of compressing the context is by reducing redundancy. Even with a re-ranker,\
    \ the top 5 most relevant results might all contain very similar documents. Together,\
    \ they are not bigger than the sum of their parts but smaller instead because\
    \ they contain similar information. As such, we do not only want the most relevant\
    \ documents, but in a way that they are still documents that each contain a new\
    \ piece of information.\n\nA common technique to use, whether they are the output\
    \ documents of your RAG pipeline or other pieces of retrieved information, is\
    \ called Maximal Marginal Relevance (MMR).^([17](#ch01.html_id132)) This technique\
    \ uses a precalculated relevance vector and redundancy matrix to balance the diversity\
    \ of documents.\n\nFirst, the similarity between the retrieved document and query\
    \ embeddings is calculated. This results in a *relevance vector* which has a value\
    \ per document to indicate how similar/relevant the given document is to the query\
    \ (see Figure 4-33)."

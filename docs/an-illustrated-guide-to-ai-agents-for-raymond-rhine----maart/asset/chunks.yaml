    \ is shown in Figure 4-30, which shows the results for a typical Need in A Haystack\
    \ test, where the upper right quadrant (needle at the top of the document and\
    \ large context length) shows the degradation of LLMs at higher context lengths.\n\
    \n![A graph with different colored squares AI-generated content may be incorrect.](assets/ch04_figure_30_1760455018636579.png)\n\

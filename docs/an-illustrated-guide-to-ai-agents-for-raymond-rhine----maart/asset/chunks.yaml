  trans: '


    在第 3 步中，相关条目和用户的查询被组合到提示中。这一步旨在为模型提供生成步骤所需的上下文。本质上，你告诉大语言模型（LLM），你有它可用于推导答案的上下文信息。最后，在第
    4 步中，模型使用增强后的提示来生成输出。添加的上下文信息通常应能带来更准确和相关的回答，前提是这些上下文信息确实相关且正确。图 4-15 展示了使用 RAG
    进行推理的四个步骤。


    ![图表示意图 AI 生成内容可能不正确。](img/ch04_figure_15_1760455018636234.png)


    RAG 常用于减少幻觉，幻觉是指 LLM 倾向于自信地产生一个实际上不正确的答案。通过向 LLM 提供外部信息（你假定为真实的信息），LLM 不太可能“编造”信息。


    ![](img/ch04_figure_16_1760455018636248.png)


    ![](img/ch04_figure_17_1760455018636302.png)


    ![计算机过程的图表 AI 生成内容可能不正确。](img/ch04_figure_18_1760455018636326.png)


    ## 代理式 RAG（Agentic RAG）


    在原始 RAG 中，向量数据库可被视为 LLM 的长期记忆。然而，LLM 仅被*给予*与查询相关的信息，而且对检索了什么没有掌控权。


    在代理式 RAG 中，存在一个代理（agent），而不是 LLM，它可以将外部数据库作为工具进行访问，并控制它检索哪些信息。代理恢复了对检索内容的掌控权，并且它通常可以访问一个或多个外部信息数据库。图
    4-19 说明了这种想法：代理先选择从哪个来源检索上下文信息，再决定是生成答案还是再次检索额外信息。


    ![](img/ch04_figure_19_thumb1760455018636341.png)


    在单代理系统中，代理式 RAG 类似于一个路由器，你拥有多个外部知识源，代理决定使用其中哪些。你本质上是在 “工具”列表中添加所有这些知识源和数据库，而不是像静态步骤那样在
    LLM 生成输出前运行。此外，这种代理 RAG 系统不一定每次都需要基于查询本身运行代理 RAG（Agentic RAG）。如图 4-20 所示，系统可能会决定从一次搜索中提取信息，然后基于该信息在另一个数据库中运行后续搜索。


    ![](img/ch04_figure_20_1760455018636355.png)


    代理 RAG 并不局限于单代理系统。在多代理 RAG 系统中，多个代理都具备从外部来源提取信息的能力。通常，你会有一个能力更强的协调代理去协调多个较小的检索代理。这些较小的检索代理各自专门负责提取特定信息，或处理特定的知识源（参见图
    4-21）。请注意，外部知识源并不一定非要是向量数据库，它也可以是网络搜索或查询某些 API 来获取信息（例如你的 Slack 或 Gmail）。


    ![公司的图表 AI 生成内容可能不正确。](img/ch04_figure_21_1760455018636389.png)


    换句话说，通过将向量数据库作为工具挂钩，而不是只通过静态步骤查询一次，代理可以动态地决定需要查询语义记忆多少次，直到它获得足够的上下文来回答给定的查询。请注意，我们在
    RAG 上下文中讨论了 LLM，但在代理式 RAG 的上下文中则讨论代理。这体现了它们访问各自 RAG 能力时的主动性和自主性。


    让我们看一些示例，通过该领域中具有影响力的论文和实现，来了解这些代理 RAG 系统是如何运作的。


    ### A-MEM


    一种有趣的代理 RAG 方法是 A-MEM，这是一个源自于 Zettelkasten 笔记法的代理记忆系统。^(6) Zettelkasten 于将做笔记视为三个重要组成部分：原子性、超文本笔记和个性化。


    原子性意味着每张 Zettel（一张笔记）只能包含一个知识单元，称为原子。例如，这张笔记可以包含代理系统中记忆如何工作的简短描述。


    然后，超文本笔记指的是所有笔记相互引用，并可能解释或扩展彼此的内容。例如，之前创建的笔记可以连接到另一张包含 RAG 相关信息的笔记。由于两者都是记忆系统，它们可能相关。原子性和超文本笔记的概念在图
    4-22 中得到说明。它们一起可以创建一个相互关联的笔记和思想网络，并可能创建更大主题的相互关联笔记。


    ![](img/ch04_figure_22_1760455018636414.png)


    A-MEM 将这种笔记概念应用于代理记忆，通过创建这些相互关联的笔记来实现。在代理情境中，每张笔记包含以下信息，并可被视为一段记忆：


    * 与环境的原始*交互*（即一轮交互）

    * 交互的*时间戳*

    * LLM 生成的*关键词*，用于捕捉关键概念

    * 用于对交互进行分类的、由 LLM 生成的*标签*

    * LLM 生成的*上下文描述*


    通过聚焦于单个单元，即单个交互，A-MEM 遵循了原子性原则。


    然后，所有信息被嵌入，以便稍后可以轻松检索相关信息。请注意，除了时间戳外，所有信息都被拼接起来，以便为整张笔记/记忆创建一个嵌入向量（图 4-23）。


    ![](img/ch04_figure_23_1760455018636435.png)


    有趣的是，作者将该笔记嵌入作为笔记的主要 ID 之一。为了将此笔记与其他记忆关联，他们运行此笔记嵌入和所有其他记忆之间的相似性搜索，并提取前 k 个记忆。之后，LLM
    被请求决定这些候选记忆中哪些应该与新添加的记忆相关联。


    在记忆被添加并链接到其他记忆之后，LLM 会基于新添加的记忆更新 LLM 生成的标签、关键词和描述。结果形成了一种进化式方法，新添加的记忆与较旧的记忆相链接，而后者又被更新以与新实施的记忆保持一致。图
    4-24 说明了这种不断演变的记忆笔记数据库。


    ![](img/ch04_figure_24_1760455018636451.png)


    这种代理 RAG 系统允许代理访问 A-MEM，并搜索与查询相关的记忆。笔记之间建立的链接在检索相关信息时会用到。代理可以选择检索所有与所检索到的笔记有链接的笔记。


    我们再次看到，这些记忆系统回应了人类记忆的某些方面。我们如何存储和使用知识的许多见解，经常为代理记忆系统的设计提供灵感。


    ### Search-o1


    最近的一种代理 RAG 方法是 search-o1，一种尝试在整个推理过程中检索相关上下文并将其嵌入，以进一步增强推理 LLM 能力的方法。^(7) 信息可以在
    LLM 的推理过程*期间*被搜索和检索，而不是自主搜索相关信息并直接将其放入模型的提示中。代理被指示使用`<|begin_search_query|>`和`<|end_search_query|>`标记开始搜索，然后使用`<|begin_search_result|>`和`<|end_search_result|>`标记来表示检索到的信息。图
    4-25 展示了这种在推理过程中进行的代理 RAG。


    ![](img/ch04_figure_25_1760455018636466.png)


    '

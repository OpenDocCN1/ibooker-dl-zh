    \ 等人。《Gemini 1.5：在数百万上下文 token 中解锁多模态理解》*arXiv 预印本 arXiv:2403.05530*（2024 年）。\n\
    \n^(13) Hsieh, Cheng-Ping 等人。《RULER：你的长上下文语言模型的真实上下文大小是多少？》*arXiv 预印本 arXiv:2404.06654*（2024\
    \ 年）。\n\n^(14) Li, Tianle 等人。《长上下文 LLM 难以进行长上下文学习》*arXiv 预印本 arXiv:2404.02060*（2024\
    \ 年）。\n\n^(15) Levy, Mosh、Alon Jacoby 和 Yoav Goldberg。《相同的任务，更多的 token：输入长度对大语言模型推理性能的影响》*arXiv\
    \ 预印本 arXiv:2402.14848*（2024 年）。\n\n^(16) Hong, Kelly、Anton Troynikov 和 Jeff Huber。*上下文腐烂：输入\
    \ token 数量的增加如何影响 LLM 性能*。Chroma，2025 年 7 月。[`research.trychroma.com/context-rot`](https://research.trychroma.com/context-rot?utm_source=chatgpt.com)。\n\
    \n^(17) Carbonell, Jaime 和 Jade Goldstein。《使用 MMR（基于多样性的重排序）重排文档并生成摘要》*第 21 届\
    \ ACM SIGIR 国际信息检索研究与发展年会论文集*（1998 年）。\n\n^(18) Liu, Nelson F. 等人。《迷失在中间：语言模型如何使用长上下文》*arXiv\
    \ 预印本 arXiv:2307.03172*（2023 年）。\n\n^(19) Bennet B. Murdock Jr. 1962 年。《自由回忆的序列位置效应》。《实验心理学杂志》，64(5)：482。\n\
    \n# 第 2 章 工具使用、学习与协议\n\n工具模块是一个非常有趣的模块，它可以增强你的 LLM，并在智能体中产生自主行为。LLM 本身不过是一些接收字符串并输出字符串的函数。虽然这能创造出有趣的聊天机器人，但它们还无法与环境交互。\n\
    \n定义智能体的一个关键特征是其能够自主搜索、选择并利用工具，从而与环境交互并对其施加影响。只要具备足够的能力，智能体甚至可以创建自己的工具集来使用。工具的好处并不局限于与环境交互。正如我们在上一章所讨论的，工具通常用于访问外部知识或记忆。我们甚至可以使用工具访问专门的（大）语言模型，这些模型的能力超出了智能体自身的能力范围，比如多模态大语言模型，或针对特定任务（如编码）专门化的大语言模型。总的来说，工具允许\
    \ LLM 采取行动并与外部环境交互，或者提取数据并使用外部应用程序（参见图 5-1）。\n\n![黑白图标，AI 生成的内容可能不正确。](img/ch05_figure_1_1760455020911943.png)\n\
    \n然而，普通的 LLM 无法搜索网页、使用计算器或安排日程。它们只能表达这样做的意图，却无法付诸行动。没有工具，智能体只能自主*思考*，而不能自主*行动*。\n\
    \n自主性的程度也决定了工具的使用方式。如图 5-2 所示，如果没有自主性而只有固定流程，那么工具可以按预定义的顺序使用。例如，一个研究型智能体可能总是调用\
    \ arXiv 和 Google 等工具来提取结果，随后再对这些结果进行总结。\n\n![计算机程序示意图，AI 生成的内容可能不正确。](img/ch05_figure_2_1760455020911973.png)\n\
    \n相比之下，自主性程度更高的系统允许智能体选择使用哪个工具以及何时使用。如图 5-3 所示，它们仍然是 LLM 调用的序列，但工具的选择由智能体自主决定。\n\
    \n![公司示意图，AI 生成的内容可能不正确。](img/ch05_figure_3_1760455020911990.png)\n\n工具的意义远不止于使用。它们是如何创建的？工具的输出是如何被\
    \ LLM 或智能体处理的？工具是如何被选择的？一个 LLM 能有效处理多少工具？\n\n在本章中，我们不仅会探讨多种类型的工具，还会探讨 LLM 和智能体如何学会使用这些工具，甚至这些工具如何在不同智能体系统中实现标准化。如图\
    \ 5-4 所示，这个模块允许与环境交互。它使下一章——规划要采取的行动——不再只是一个理论练习。毕竟，没有工具，LLM 又如何能自主行动呢？\n\n![记忆工具示意图，AI\
    \ 生成的内容可能不正确。](img/ch05_figure_4_1760455020912000.png)\n\n## 工具使用\n\n工具使用包含的步骤比你想象的要多。它不是从\
    \ LLM 使用工具开始的，而是从实际创建和定义工具、规划要使用哪个工具并最终调用工具开始的。尽管工具使用的步骤可以从许多不同的角度来看（例如^(1)、^(2)和^(3)），我们将探讨以下几个方面：\n\
    \n* 工具创建\n* 工具定义\n* 工具选择\n* 工具调用\n* 输出处理\n\n尽管智能体看起来似乎可以自己做所有事情（在某种程度上它们确实可以），但要真正使用工具，它们还需要用户或开发者的帮助。高层流程如图\
    \ 5-5 所示，该图改编自 OpenAI 的工具调用流程^(4)，其中我们额外关注了工具的创建，并突出显示了单次工具调用所经历的步骤。\n\n![](img/ch05_figure_5_1760455020912016.png)\n\
    \n请注意，每个步骤可能有各种形式和实现方式，其中许多我们将在后面介绍。现在，让我们探讨这些步骤中最常见的工具使用方式，并更详细地研究它们。\n\n###\
    \ 工具创建\n\n虽然工具可以有各种形式，但它们通常是通过 API 或某些内部代码访问的函数。其复杂程度可以根据应用需求而定，可以很复杂，也可以很简单。例如，LLM\
    \ 并不以数学能力著称。让我们创建一个简单的乘法函数，供 LLM 使用。请注意，所有代码示例都只是伪代码，完整示例可以在本书的 GitHub 仓库中找到。\n\
    \n```\ndef multiply(a: float, b: float):\n    \"\"\"\n    Multiply two numbers\n\
    \ \n    Args:\n        a: First number\n        b: Second number\n    \"\"\"\n\
    \    return a*b\n```\n\n如示例所示，这些工具应该带有详尽的文档，因为文档字符串也会被传达给 LLM。一个明显的好处是，这会促使使用者更加注重编写优秀的文档，而这在开发代码时往往不是优先事项。\n\
    \n这个工具可以通过直接调用`multiply(a, b)`来访问，这是 LLM 无法做到的，但自动化系统可以做到。请注意，外部 API 调用也可能调用工具。无论如何，工具通常被视为某种形式的函数，可以通过各种方式调用。在我们的示例中，最直接的方法是将它保存在一个字典中，这样我们就可以通过字符串访问该函数。在这种情况下，我们的*数据库*就是`tools`变量：\n\
    \n```\ntools = {\n  \"multiply\": multiply\n}\n```\n"

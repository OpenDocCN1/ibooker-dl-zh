    # 具有推理能力的代理式 RAG


    通过在推理过程中启用 RAG，模型可以迭代地完善其推理过程，直到对最终结果充满信心。这种动态方法与常规代理式 RAG 不同，因为它可以在单次调用中自主完成，而不是多次迭代调用。


    ## 文档内推理


    简单地将文档嵌入推理轨迹的一个缺点在于，检索到的文档可能相当大，且往往包含无关信息，从而可能扰乱推理流程。为了解决这个问题，作者通过引入“文档内推理”（Reason-in-Documents）模块来扩展推理代理式
    RAG。该模块利用搜索查询、检索到的文档和推理轨迹，尝试将所有信息凝练为聚焦的推理步骤。代理使用同一个推理 LLM 来处理检索到的文档，以与模型特定的推理轨迹保持一致。


    对于常规代理式 RAG，信息只是被传入上下文，而不考虑信息需要*如何*被处理。通过让同一个推理 LLM 进一步处理这些信息，使其适配推理轨迹，可以保持推理轨迹的流畅性。图
    4-26 给出了这个名为 Search-o1 的系统的概览。


    ![搜索引擎示意图（AI 生成内容可能不正确）](img/ch04_figure_26_1760455018636479.png)


    ## 迭代检索


    请注意，这通常用于代理可能需要回答给定查询的长期记忆或外部语义记忆。例如，当给定查询“为什么火烈鸟是粉色的？”时，它会在推理过程中在维基百科中搜索相关信息。它找到的第一条结果提到，这是由它们特定饮食中的特定色素所致。它会在推理过程中利用该信息，直到需要进一步澄清。例如，第二次调用不同的外部数据库（如
    ArXiv）会澄清该特定色素是类胡萝卜素色素，常见于卤虫中。


    这种查询信息并将其压缩到推理过程中的迭代方式，使模型能够在信息被检索时进行推理，而不是在上下文中塞入所有潜在相关信息。


    # 上下文工程


    ## 上下文的形式


    我们已经探讨了可以为代理提供额外上下文的各种类型的记忆，包括语义记忆、工作记忆及其他形式的记忆。然而，我们还能为代理提供更多形式的上下文，例如：


    - **系统提示**：代理的核心上下文和规则，定义其行为方式（程序性记忆）。

    - **对话历史**：既包括用户与助手之间的对话，也包括 LLM 的内部想法（工作记忆）。

    - **过往经验**：存储来自工具使用或用户相关事实的具体事件、动作或观察（情景记忆）。

    - **检索到的信息**：通常存储在向量数据库中、通过类似 RAG 的技术访问的外部信息（语义记忆）。


    然而，这并非一份详尽的清单。随着 LLM 和代理领域的不断成长，我们能给它们的信息来源也在不断增多。因此，我们可以为代理提供各种信息来源，以生成我们想要的答案。如图
    4-27 所示，用户的查询或提示只是 LLM 整个上下文的一个子集。


    ![](img/ch04_figure_27_1760455018636492.png)


    ## 优化上下文


    这个上下文被输入给 LLM，LLM 进而生成一个 token 列表。因此，我们可以将 LLM 视为一个函数：它接收若干 token（上下文），处理它们，并输出
    token。为了优化给定任务的输出 token，我们既可以通过训练或微调来优化 LLM 本身，也可以优化输入，即上下文（图 4-28）。


    ![](img/ch04_figure_28_1760455018636531.png)


    ## 定义上下文工程


    为了优化输出（输出 token）的质量，我们可以通过训练或微调来优化 LLM 本身，也可以优化输入到 LLM 的内容，即上下文。优化输入 token 以产生最佳输出的行为被称为*上下文工程*。形式化地讲，它是为给定任务寻找最佳上下文，以最大化
    LLM 输出的质量。^(8) 如图 4-29 所示，提示工程涉及优化系统/用户提示，而上下文工程旨在优化整个上下文。


    ![软件程序示意图（AI 生成内容可能不正确）](img/ch04_figure_29_1760455018636557.png)


    ## 长上下文基准与局限


    上下文窗口变得越来越大，以至于谷歌的 Gemini 1.5 在 2024 年 2 月已经达到了百万 token 的上下文窗口。^(9) 很自然地会得出这样的结论：上下文工程意味着试图用与手头任务相关的各种信息来填满这个巨大的上下文窗口。此外，由于上下文窗口大到可能容纳整个数据库，RAG
    不再是必需的。


    评估长上下文 LLM 的一个常用基准是 2023 年和 2024 年初的“大海捞针”（Needle In A Haystack, NIAH）测试。^(10)
    该测试相当直接：将一条随机事实（“针”）放置在长上下文窗口（“大海”）中间的某个位置，然后要求模型检索这条陈述。通过在不同位置和不同上下文长度上进行迭代，我们可以衡量
    LLM 在长上下文上的表现。它生成了漂亮的图表，并被大型 LLM 提供商所采用，如 Anthropic 的 Claude 2.1^(11)和谷歌的 Gemini
    1.5^(12)。


    图 4-30 展示了这样一张图表的示例，其中显示了一个典型“大海捞针”测试的结果，右上象限（针位于文档顶部且上下文长度很大）显示了 LLM 在更高上下文长度下的性能下降。


    ![具有不同颜色方块的图表（AI 生成内容可能不正确）](img/ch04_figure_30_1760455018636579.png)


    然而，找到“针”只是一个检索任务，并不能代表更复杂的长上下文理解形式，例如在数十万 token 上进行推理。对于必须考虑多种形式和长度的上下文（如语义记忆和工作记忆）的代理来说，这一点尤其成立。


    此后，其他基准（如 RULER 基准^(13)）被发布，引入了多跳追踪和聚合等新任务，以测试超越简单检索的行为。例如，RULER 论文证明了那些在“大海捞针”测试中表现良好的模型，在应用到
    RULER 基准时，随着上下文长度的增加，性能都出现了显著下降。许多其他研究（例如^(14)和^(15)）也发现了类似的结果，并得出结论：随意填满 LLM
    的上下文窗口会损害性能。有些人甚至称之为“上下文腐烂”（context rot）^(16)，这突显了添加高质量信息的重要性。因此，我们需要精心构建和管理模型的上下文窗口，这也就指向了上下文工程的重要性。


    ## 管理上下文窗口


    成本和延迟是管理上下文窗口的其他原因。理论上，你可以把所有内容都塞进 200 万 token 的上下文长度中，比如整个外部数据库、完整的对话历史、一些额外示例等等。然而，代理的
    LLM 必须处理所有这些 token，这会显著增加延迟。成本也会增加，因为增加上下文长度需要更多的显存（VRAM）。因此，只是把所有东西都倾倒进上下文中，注定会导致失败。


    '

  trans: '


    ![](img/ch04_figure_33_1760455018636624.png)


    其次，同样会计算检索文档之间的相似度，以构建一个相似度矩阵，称为*冗余矩阵*。该矩阵用于丢弃一些与已选文档过于相似的文档（见图 4-34）。


    ![](img/ch04_figure_34_1760455018636650.png)


    然后，相关性向量和冗余矩阵会被迭代使用，以判断哪些检索文档与给定查询足够相似，但又与其他所有检索文档不相似。其中一个重要组成部分是 `λ` 参数，我们可以调整它来决定输出应有多高的多样性（得分越高表示多样性越高）。


    由于尚未选择任何文档，我们首先选择相关性向量中得分最高的文档，即文档 1。然后，将相关性向量乘以 `(1- λ)`，以决定相似性相对于多样性的重要性。从得到的分数（除文档
    1 之外的每个文档各有一个分数）中减去 `λ` 倍的冗余向量。该向量包含冗余矩阵中与已选文档（文档 1）相关的最高得分。如图 4-35 所示，文档 3 作为下一个兼具多样性和相关性的文档被加入。


    ![](img/ch04_figure_35_1760455018636677.png)


    我们继续这个过程，但不再仅与文档 1 比较，而是让冗余向量包含与文档 1 或文档 3 相关的最高相似度得分，取两者中较高者。我们只对下一个文档重复此过程，因为我们希望将最初的
    5 篇文档缩减为总共 3 篇。


    与重排序一样，MMR 只是一种可用于压缩输出的技术示例。我们并非只能让 LLM 直接压缩检索到的文档；也可以使用 MMR 这类技术直接忽略某些文档，因为它们彼此过于相似。同样，还可以使用去重技术移除本质上彼此重复的上下文。


    ### 上下文排序


    上下文的顺序对智能体的性能至关重要。早期关于提示中重要信息位置的研究发现，LLM 往往更关注提示的开头和结尾。^(18) 因此，它们经常会丢失中间部分的信息，这被称为“中间丢失”（Lost
    in the Middle）现象。图 4-36 来自《Lost in the Middle: How Language Models Use Long Contexts》论文的注释图，很好地说明了这一概念。


    ![](img/ch04_figure_36_1760455018636700.png)


    这种关注提示开头和结尾的倾向与人类行为相似。序列位置效应指出，人们通常对一系列条目中的第一项（首因效应）和最后一项（近因效应）记忆最好，而对中间项记忆最差。^(19)
    有趣的是，LLM 的许多行为也表现出与人类相似的倾向。


    ## 上下文即规格说明


    可以说，上下文工程最重要的一点是，它需要思维方式的转变。赋予智能体的上下文可以被视为一种沟通工具，不仅用于与智能体沟通，也用于与你的同事沟通。更具体地说，你提供给智能体的上下文，包括查询、`PLAN.md`、`REQUIREMENTS.md`、代码库等，都是传达你意图的工具。例如，当你让编码智能体完全自主地创建一个
    PR（拉取请求）时，仅仅检查代码本身是否包含所有内容是不够的。初始查询、`PLAN.md` 等也都是 PR 的初始规格说明，同样需要被追踪。


    因此，我们可以将智能体的上下文看作你所实现功能的规格说明。随着智能体变得越来越自主，通过给定的上下文来追踪其行为意图非常重要。如果说提示工程是面向用户的，那么上下文工程则更是一种面向开发者的工具，需要仔细传达智能体为何执行某些任务。这个“为什么”的答案始于用户的意图。


    不妨这样想：我们往往丢弃函数（LLM）的输入，只记录输出，这多么奇怪！这不仅关乎可复现性，也关乎沟通：它能让你理解智能体为什么选择了某些工具、执行了某些操作并产生了某些输出。此外，这种意图的透明性也是调试智能体的绝佳工具。


    作为规格说明的上下文，为特定领域行业带来了巨大潜力。在不同用例和应用之间，你提供给智能体的上下文会有很大差异。例如，医疗保健所需的上下文与法律完全不同。因此，并不存在单一通用的上下文工程框架，而是需要开发者考虑其特定领域的知识来源，例如医疗保健中的患者数据和学术界的研究论文。


    # 总结


    在本章中，我们探讨了为 LLM 和智能体赋予记忆的各种方法。我们首先介绍了短期记忆的各种技术，包括对话历史，以及压缩并保持其可控的方法。短期记忆是在智能系统中实现记忆能力的一个重要但常被低估的组成部分。


    接着，我们探讨了长期记忆，包括 RAG（MemoryBank）和智能体式 RAG（A-MEM 与 Search-o1）等方法。这些方法通常受人类记忆系统启发，可能包含让记忆衰减或判断哪些内容应被视为重要的技术。


    最后，我们将上下文工程作为记忆领域的下一个前沿进行了探索。过去我们自己设计提示词，而现在需要对整个上下文窗口进行仔细考量。我们讨论了上下文为何对智能体如此重要，以及优化上下文的各种方法。


    上下文远不止用户的提示词，它包含之前讨论过的所有记忆形式，甚至可能包含更多内容，如工具。在下一章中，我们将探讨工具作为智能体的重要组成部分，如何进一步增强
    LLM 的能力。此外，我们还将介绍如何调用这些工具以及相关最佳实践。在第 6 章中，我们将介绍智能体的规划与反思能力，其中记忆发挥着重要作用。


    ^(1) Sumers, Theodore, et al. “Cognitive architectures for language agents.” *Transactions
    on Machine Learning Research* (2023).


    ^(2) Zhang, Zeyu, et al. “A survey on the memory mechanism of large language model
    based agents.” *ACM Transactions on Information Systems* (2024).


    ^(3) Hsieh, Cheng-Ping, et al. “RULER: What’s the Real Context Size of Your Long-Context
    Language Models?.” *arXiv preprint arXiv:2404.06654* (2024).


    ^(4) Lewis, Patrick, et al. “Retrieval-augmented generation for knowledge-intensive
    nlp tasks.” *Advances in neural information processing systems* 33 (2020): 9459-9474.


    ^(5) Zhong, Wanjun, et al. “Memorybank: Enhancing large language models with long-term
    memory.” *Proceedings of the AAAI Conference on Artificial Intelligence*. Vol.
    38. No. 17. 2024.


    ^(6) Xu, Wujiang, et al. “A-mem: Agentic memory for llm agents.” *arXiv preprint
    arXiv:2502.12110* (2025).


    ^(7) Li, Xiaoxi, et al. “Search-o1: Agentic search-enhanced large reasoning models.”
    *arXiv preprint arXiv:2501.05366* (2025).


    ^(8) Mei, Lingrui, et al. “A Survey of Context Engineering for Large Language
    Models.” *arXiv preprint arXiv:2507.13334* (2025).



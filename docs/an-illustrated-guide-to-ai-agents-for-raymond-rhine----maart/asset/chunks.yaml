    # 关于作者


    **Maarten Grootendorst** 是 IKNL（荷兰综合癌症组织）的高级临床数据科学家。他拥有组织心理学、临床心理学和数据科学的硕士学位，并利用这些知识向广大受众传播复杂的机器学习概念。通过他的[热门博客](https://newsletter.maartengrootendorst.com/)，他通过解释人工智能的基础知识（通常从心理学角度出发）吸引了数百万读者。他是
    BERTopic、PolyFuzz 和 KeyBERT 等多个依赖大语言模型力量的开源包的作者和维护者。他的包下载量达数百万次，并被全球数据专业人士和组织使用。


    **Jay Alammar** 是 Cohere（率先以 API 形式提供大语言模型服务的提供商）的总监兼工程研究员。在此职位上，他就如何将语言模型应用于实际用例，为企业和开发者社区提供咨询和指导。通过他的[热门
    AI/ML 博客](https://jalammar.github.io/)，Jay 帮助数百万研究人员和工程师直观地理解机器学习工具和概念——从基础（最终出现在
    NumPy 和 pandas 等包的文档中）到前沿（Transformers、BERT、GPT-3、Stable Diffusion）。Jay 还是 Deeplearning.ai
    和 Udacity 上热门机器学习和自然语言处理课程的共同创建者。



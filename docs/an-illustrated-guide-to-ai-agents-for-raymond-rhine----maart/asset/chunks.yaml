- raw: "![](assets/ch04_figure_33_1760455018636624.png)\n\n###### \n\nSecond, the\
    \ similarity between the retrieved documents is likewise calculated to construct\
    \ a similarity matrix called the *redundancy matrix*. This matrix is used to potentially\
    \ discard documents that are too similar to the ones we had already chosen (see\
    \ Figure 4-34).\n\n![](assets/ch04_figure_34_1760455018636650.png)\n\n###### \n\
    \nThen, the relevance vector and redundancy matrix are used iteratively to decide\
    \ which retrieved documents are similar enough to a given query but dissimilar\
    \ to all other retrieved documents. An important component is the λ parameter,\
    \ which we can tweak to decide how diverse the output should be (a higher score\
    \ indicates higher diversity).\n\nSince we haven’t chosen any documents, we start\
    \ by selecting the one with the highest score in the relevance vector, namely\
    \ document 1. Then, we take the relevance vector and multiply it by (1- λ) to\
    \ decide the importance of similarity over diversity. From the resulting scores\
    \ (one for each document other than document 1), we subtract λ times the redundancy\
    \ vector. This vector contains the highest scores in the redundancy matrix that\
    \ relate to the documents we had already chosen (document 1). As demonstrated\
    \ in Figure 4-35, document 3 is added as the next most diverse and relevant document.\n\
    \n![](assets/ch04_figure_35_1760455018636677.png)\n\n###### \n\nWe continue this\
    \ process, but instead of comparing to document 1 only, the redundancy vector\
    \ contains the highest similarity scores that relate to either document 1 or 3,\
    \ whichever is highest. This process is only repeated for the next document, since\
    \ we wanted to bring down our original set of 5 documents to 3 in total.\n\nLike\
    \ re-ranking, MMR is merely an example of a technique that can be used to compress\
    \ the output. We are not limited to using LLMs to directly compress the retrieved\
    \ documents; we can instead use techniques like MMR to simply ignore certain documents\
    \ because they are too similar to each other. Likewise, deduplication techniques\
    \ can be used to remove contexts that are essentially duplicates of one another.\n\
    \n### Context Ordering\n\nThe order of the context is vital to the performance\
    \ of your agent. Early research into the position of important information in\
    \ prompts found that LLMs have a tendency to pay more attention to the beginning\
    \ and end of a prompt.^([18](#ch01.html_id133)) As a result, they often end up\
    \ losing information in the middle, which they call the “lost-in-the-middle” phenomenon.\
    \ Figure 4-36 is an annotated figure from the “Lost in the Middle: How Language\
    \ Models Use Long Contexts” paper that nicely illustrates this concept.\n\n![](assets/ch04_figure_36_1760455018636700.png)\n\
    \n###### \n\nThis tendency to focus on the beginning and end of prompts is similar\
    \ to human behavior. The serial-position effect states that people generally recall\
    \ the first (primacy effect) and last (recency effect) items in a series best,\
    \ whereas the middle items are recalled worst.^([19](#ch01.html_id134)) It is\
    \ interesting to see how much of LLMs’ behavior follows similar human tendencies.\n\
    \n## Context as the Specification\n\nArguably, one of the most important things\
    \ about context engineering is that it requires a shift in mindset. The context\
    \ that is given to the agent can be seen as a tool for communication. Not just\
    \ for the agent, but to the people that you work with. More specifically, the\
    \ context that you give to the agent, including the query, `PLAN.md`, `REQUIREMENTS.md,`\
    \ codebase, etc., all serve as a tool to communicate what your intention is. For\
    \ example, when you allow a coding agent to fully create a PR on its own, it does\
    \ not suffice to go through the code itself to check whether everything is there.\
    \ The initial query, `PLAN.md`, etc., all serve as the initial specification of\
    \ the PR and should be tracked as well.\n\nAs such, we can view the context of\
    \ the agent as the specification of your feature. As agents are becoming more\
    \ autonomous, it is important to track the intention of their behavior through\
    \ the context that is given. Where we would view prompt engineering as user-facing,\
    \ context engineering is a much more developer-oriented tool and requires careful\
    \ communication of why the agent is executing certain tasks. The answer to the\
    \ “why” starts with the user’s intention.\n\nThink about it like this: how strange\
    \ it is that we tend to throw away the input to our function (the LLM) and only\
    \ keep track of the output! Not only for reproducibility, but also for communication,\
    \ it allows you to understand why the agent has chosen certain tools, executions,\
    \ and outputs. Moreover, this transparency of intention also serves as a great\
    \ tool for debugging your agent.\n\nContext, as the specification, brings about\
    \ significant potential for domain-specific industries. The context that you give\
    \ an agent changes drastically between use cases and applications. Health care\
    \ requires a completely different context than law, for instance. As such, there\
    \ is not a single framework for context engineering and instead requires developers\
    \ to consider their domain-specific knowledge sources, like patient data in health\
    \ care and research papers in academia.\n\n# Summary\n\nIn this chapter, we explored\
    \ various methods for giving LLMs and Agents memory. We first covered various\
    \ techniques for short-term memory, including the conversation history and methods\
    \ for compressing it and keeping it manageable. Short-term memory is an important,\
    \ but often underestimated component of enabling memory in intelligent systems.\n\
    \nThen, we explored long-term memory, including methods for RAG (MemoryBank) and\
    \ agentic RAG (A-MEM and Search-o1). These methods are often inspired by human\
    \ memory systems and may include techniques for degrading memory or deciding what’s\
    \ meant to be important.\n\nFinally, we explored context engineering as the next\
    \ frontier in memory. Where we used to engineer our prompts ourselves, the entire\
    \ context window now requires careful consideration. We covered why this context\
    \ is important for agents and various methods for optimizing it.\n\nThe context,\
    \ being much more than just the user’s prompt, contains all previously discussed\
    \ forms of memory and potentially even more, like tools. In the next chapter,\
    \ we will explore how tools can further enhance the capabilities of LLMs as an\
    \ important component of agents. Moreover, we will cover how these tools can be\
    \ called and the best practices for doing so. In Chapter 6, we cover planning\
    \ and reflection capabilities of agents, where memory plays an important role.\n\
    \n^([1](#ch01.html_id116-marker)) Sumers, Theodore, et al. “Cognitive architectures\
    \ for language agents.” *Transactions on Machine Learning Research* (2023).\n\n\
    ^([2](#ch01.html_id117-marker)) Zhang, Zeyu, et al. “A survey on the memory mechanism\
    \ of large language model based agents.” *ACM Transactions on Information Systems*\
    \ (2024).\n\n^([3](#ch01.html_id118-marker)) Hsieh, Cheng-Ping, et al. “RULER:\
    \ What’s the Real Context Size of Your Long-Context Language Models?.” *arXiv\
    \ preprint arXiv:2404.06654* (2024).\n\n^([4](#ch01.html_id119-marker)) Lewis,\
    \ Patrick, et al. “Retrieval-augmented generation for knowledge-intensive nlp\
    \ tasks.” *Advances in neural information processing systems* 33 (2020): 9459-9474.\n\
    \n^([5](#ch01.html_id120-marker)) Zhong, Wanjun, et al. “Memorybank: Enhancing\
    \ large language models with long-term memory.” *Proceedings of the AAAI Conference\
    \ on Artificial Intelligence*. Vol. 38. No. 17. 2024.\n\n^([6](#ch01.html_id121-marker))\
    \ Xu, Wujiang, et al. “A-mem: Agentic memory for llm agents.” *arXiv preprint\
    \ arXiv:2502.12110* (2025).\n\n^([7](#ch01.html_id122-marker)) Li, Xiaoxi, et\
    \ al. “Search-o1: Agentic search-enhanced large reasoning models.” *arXiv preprint\
    \ arXiv:2501.05366* (2025).\n\n^([8](#ch01.html_id123-marker)) Mei, Lingrui, et\
    \ al. “A Survey of Context Engineering for Large Language Models.” *arXiv preprint\
    \ arXiv:2507.13334* (2025)."

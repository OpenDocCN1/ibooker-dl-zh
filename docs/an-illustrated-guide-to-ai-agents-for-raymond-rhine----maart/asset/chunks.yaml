    # About the Authors


    **Maarten Grootendorst** is a senior clinical data scientist at IKNL (Netherlands
    Comprehensive Cancer Organization). He holds master’s degrees in organizational
    psychology, clinical psychology, and data science, which he leverages to communicate
    complex machine learning concepts to a wide audience. With his [popular blogs](https://newsletter.maartengrootendorst.com/),
    he has reached millions of readers by explaining the fundamentals of artificial
    intelligence—often from a psychological point of view. He is the author and maintainer
    of several open source packages that rely on the strength of large language models,
    such as BERTopic, PolyFuzz, and KeyBERT. His packages are downloaded millions
    of times and used by data professionals and organizations worldwide.


    **Jay Alammar** is director and engineering fellow at Cohere (pioneering provider
    of large language models as an API). In this role, he advises and educates enterprises
    and the developer community on using language models for practical use cases.
    Through his popular [AI/ML blog](https://jalammar.github.io/), Jay has helped
    millions of researchers and engineers visually understand machine learning tools
    and concepts from the basic (ending up in the documentation of packages like NumPy
    and pandas) to the cutting-edge (Transformers, BERT, GPT-3, Stable Diffusion).
    Jay is also a cocreator of popular machine learning and natural language processing
    courses on Deeplearning.ai and Udacity.'

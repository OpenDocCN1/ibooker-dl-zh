- raw: "Although creating tools can be a straightforward process, the LLM should be\
    \ taken into account when designing them. It is a similar process to designing\
    \ code for people to use, where you may ask yourself: Does the user understand\
    \ what the tool does? Is it clear what is being returned? Are the variable names\
    \ descriptive? Is there documentation?\n\nThis is especially important for LLMs\
    \ as they often explicitly need to be told what exists, what doesn’t, and what\
    \ the tools are capable of.\n\n## Tool Definition\n\nAfter creating the tool,\
    \ we need to inform the LLM what the tool does; this is called tool definition.\
    \ Without communicating to the LLM which tools exist, what they do, and how they\
    \ are used, the LLM isn’t able to properly use them.\n\nThere are several methods\
    \ by which we can communicate this to the LLM:\n\nLearning\n\n: \n\n(specific)\
    \ tool definition and usage are learned during training\n\nPrompting\n\n: \n\n\
    The tool definition is shared with the LLM through structured prompts.\n\nHow\
    \ to use (specific) tools and when they are needed is often learned during the\
    \ fine-tuning state of an LLM, where the model learns how to follow instructions\
    \ and use tools. This learning stage can be split up into two aspects: we either\
    \ tune the model to *learn* about *specific tools* or learn how to use *tools\
    \ in general*. Learning about specific tools can be costly and limit how many\
    \ tools you can add to the model. Instead, the focus of recent models is typically\
    \ their improved instruction-following capabilities and general tool use. Instead\
    \ of learning about specific tools, they learn to recognize definitions of tools\
    \ in their prompts and dynamically use them.\n\nAs (reasoning) LLMs are becoming\
    \ easier to steer and dynamically learn to use tools, we can share the tool definitions\
    \ through prompts. When you have a small set of tools the LLM should use, you\
    \ can share that through the system prompt:\n\n```\nsystem_prompt = \"\"\"\n...\n\
    \ \n# Tool Definition\nYou can use the following tools:\n \n- multiply(a, b):\
    \ multiplies two numbers\n- divide(a, b): divides a by b\n- add(a, b): adds two\
    \ numbers\n- subtract(a, b): subtracts b from a\n \n# Tool Usage\nWhen you need\
    \ to use them, write: [function_name(value1, value2)]\n...\n\"\"\"\n```\n\nNote\
    \ that the definition here isn’t following a standardized procedure. Frankly,\
    \ this is something we made up on the spot to show you that an LLM can call a\
    \ tool anyway you decide. If it uses “`TOOL(value1, value2)”` or perhaps structure\
    \ it like “`TOOL, value1, value2”` does not matter. The only thing you need is\
    \ a small piece of code that recognizes when a tool is being called. We will cover\
    \ how the LLM actually calls a tool a bit later in this chapter.\n\nAnother method\
    \ of sharing the definition of the tools with the LLM is through structured *function\
    \ calling*. Instead of messing around with the prompts ourselves and optimizing\
    \ how we describe and format each tool, we can define each tool in structured\
    \ schemas instead. These are typically JSON Schema objects that describe the function’s\
    \ name, its description, and its parameters (types, required fields, ranges, etc.).\
    \ An example of such a schema for our multiply tool is the following:\n\n```\n\
    {\n  \"type\": \"function\",\n  \"function\": {\n    \"name\": \"multiply\",\n\
    \    \"description\": \"Multiply two numbers\",\n    \"parameters\": {\n     \
    \ \"type\": \"object\",\n      \"properties\": {\n        \"a\": {\n         \
    \ \"type\": \"number\",\n          \"description\": \"First number\"\n       \
    \ },\n        \"b\": {\n          \"type\": \"number\",\n          \"description\"\
    : \"Second number\"\n        }\n      },\n      \"required\": [\n        \"a\"\
    ,\n        \"b\"\n      ]\n    }\n  }\n}\n```\n\nThese schemas are often passed\
    \ as a separate parameter when using external APIs. OpenAI, for instance, uses\
    \ the `tools` parameter where you can send over the JSON schemas of your tools.^([5](#ch02.html_id140))\
    \ That allows the LLM or even the Agent to treat it as special metadata and process\
    \ it beforehand if necessary.\n\nIn practice, however, these schemas are typically\
    \ processed as if they were “regular” prompts and put into, for example, the system\
    \ prompt:\n\n```\n# Tool JSON Schema put into the system prompt\nsystem_prompt\
    \ = \"\"\"\nYou are a bot that responds to mathematical queries.\n \n# Tools\n\
    \ \nYou may call one or more functions to assist with the user query.\n \nYou\
    \ are provided with function signatures within <tools></tools> XML tags:\n \n\
    <tools>\n{\"type\": \"function\", \"function\": {\"name\": \"multiply\", \"description\"\
    : \"Multiply two numbers\", \"parameters\": {\"type\": \"object\", \"properties\"\
    : {\"a\": {\"type\": \"number\", \"description\": \"First number\"}, \"b\": {\"\
    type\": \"number\", \"description\": \"Second number\"}}, \"required\": [\"a\"\
    , \"b\"]}}}\n</tools>\n \nFor each function call, return a json object with function\
    \ name and arguments within <tool_call></tool_call> XML tags:\n \n<tool_call>\n\
    {\"name\": <function-name>, \"arguments\": <args-json-object>}\n</tool_call>\n\
    \ \n\"\"\"\n```\n\nThis example is using the transformers library to format the\
    \ system prompt. Note that they have provided additional instructions on how to\
    \ identify when a tool is being called by putting the call between XML tags (`<tool_call>`\
    \ and `</tool_call>` respectively).\n\nAlthough we are using structured JSON schemas\
    \ for communication, the LLM still has to interpret how to use the tool and when,\
    \ which makes tool usage a difficult task. Therefore, the more descriptive and\
    \ clear the schema, the more likely the LLM will make the right tool call decisions.\n\
    \nAt this point, the user can finally ask their question. Since they have access\
    \ to the multiply function, let’s keep the query simple: “What is 5.1 times 7.3?”.\
    \ To illustrate how this is going to be processed, we make use of the `messages`\
    \ structure that we explored in the previous chapter. This is visualized in Figure\
    \ 5-6 where the system prompt contains the definition of our tool.\n\n![A close-up\
    \ of a text AI-generated content may be incorrect.](assets/ch05_figure_6_1760455020912031.png)\n\
    \n###### \n\nRegardless of whether you use a JSON schema or describe the tool,\
    \ there are several best practices for defining functions to take into account:\n\
    \nDocument your tool with extensive descriptions of parameters, function names,\
    \ and even examples\n\n: \n\nThis allows your agent to have a better understanding\
    \ of what the tool is capable of.\n\nMinimize the number of tools\n\n: \n\nAlthough\
    \ having many tools expands the capabilities of your agent, it will become much\
    \ more difficult to select and use the appropriate tool.\n\nMinimize the scope\
    \ of a tool\n\n: \n\nComplex tools with many parameters are difficult to use,\
    \ even for individuals, let alone an agent.\n\n## Tool Selection\n\nNow that the\
    \ tools are created and defined, we can start the process of calling the tool.\
    \ The LLM first needs to select the right tool for a given query, which can be\
    \ a difficult task. Especially with potentially dozens of complex tools, the LLM\
    \ doesn’t only need to select the most appropriate one (if one at all) but also\
    \ use it correctly. Although we can share an extensive JSON schema for each tool,\
    \ the LLM needs to be capable enough to actually follow it through. This is where\
    \ reasoning LLMs shine. They can spend any number of tokens “thinking” about which\
    \ tools to use and how to properly use them. Illustrated in Figure 5-7 is the\
    \ reasoning process of LLMs to decide which tool to use and how.\n\n![A diagram\
    \ of a diagram AI-generated content may be incorrect.](assets/ch05_figure_7_1760455020912045.png)\n\
    \n###### "

    Figure 4-4 shows an example of how these different forms of memory can be used
    and interpreted during a single agent’s session.


    ![](assets/ch04_figure_4_1760455018636064.png)


    As briefly mentioned previously, we can also consider the type of memory that
    the model already has, *parametric memory*.^([2](#ch01.html_id117)) Without any
    memory modules, LLMs are trained to a certain extent to retain information. If
    you ask an LLM what the capital of France is, most LLMs will correctly remember
    that it is Paris. The answer is therefore contained within the parameters of the
    model and attempts to retrieve it. Although a relatively new field, it is technically
    possible to instill information into an LLM through supervised fine-tuning. Note
    that this is not a stable method, as we are not entirely sure beforehand which
    information gets retained explicitly and which information is incorrectly reconstructed.


    Although these memory types may differ, they may not always be stored as such.
    Depending on the specific implementation, they could be seen as one big pile of
    information or separated into different databases to be remembered for specific
    tasks and actions.


    # Short-Term Memory


    Short-term memory in Agents is the information it has about recent interactions,
    typically the ongoing conversations with the user or the behavior of the LLM.
    In practice, this is the conversation history of the LLM, which serves as context
    for generating responses. Illustrated in Figure 4-5, they are generally formatted
    as messages demonstrating the differences between system prompts, the user’s query,
    and the LLM’s answer. It is a conversation where the user tells something about
    themselves, namely that they love flamingos.


    ![](assets/ch04_figure_5_1760455018636090.png)


    These messages are updated every time the user or assistant replies and are fed
    back into the LLM as input for the next query, as shown in Figure 4-6. The query
    (“What is my favorite animal?“) does not trigger the LLM to recall the past on
    its own. Rather, it is provided with the entire conversation history, which contains
    the relevant information, namely that the user loves flamingos. In other words,
    the LLM does not truly “remember” past conversations but is instead told what
    the conversation was by explicitly inserting it into the prompt.


    ![](assets/ch04_figure_6_1760455018636110.png)


    Most LLMs have a limited context window, which is the number of tokens that the
    LLM can process both and combine both the input and the output tokens as seen
    in Figure 4-7.


    ![](assets/ch04_figure_7_1760455018636120.png)


    In this example, a short query and answer are given which total 13 tokens out
    of a potential 8,192. Seen in Figure 4-8, there are many potential tokens that
    are left unused and could potentially be filled with additional information or
    reasoning tokens as discussed in Chapter 3.


    ![A row of rectangular objects AI-generated content may be incorrect.](assets/ch04_figure_8_1760455018636134.png)


    However, as the conversation history grows, so do the number of tokens. Eventually,
    and as shown in Figure 4-9, if the conversation history gets too large, it will
    not fit within the context windows. This might cut the answer short or even prevent
    the LLM from processing the prompt at all.


    ![A diagram of a diagram AI-generated content may be incorrect.](assets/ch04_figure_9_1760455018636151.png)


    Moreover, the more information put in the prompt, the more difficult it will be
    for the LLM to attend to everything.^([3](#ch01.html_id118)) As a result, we cannot
    always put the entire conversation history into the prompt of the LLM. Instead,
    there are several techniques we can use to provide the conversation history without
    filling up the context window.


    The first technique for efficient short-term memory is rather straightforward:
    trimming the messages as they grow. Whenever the number of messages grows too
    large for the LLM’s context window to handle, we can decide to simply remove the
    first few interactions until it fits that window. Seen in Figure 4-10, this might
    remove quite a lot of information that may or may not be relevant to future queries.


    ![](assets/ch04_figure_10_1760455018636165.png)


    Instead, a common technique is to employ another LLM to summarize the conversation
    history. After each conversation turn, the same or another LLM will summarize
    it and add it to the full summary of the conversation (Figure 4-11).


    ![](assets/ch04_figure_11_1760455018636179.png)


    As illustrated in Figure 4-12, the created summary will be shown together with
    the query for the LLM to answer. This summary might still fill the context window
    over time as summaries are stacked on one another, but it is much slower than
    filling the context window with the raw conversation history.


    ![A black and blue rectangular object with black text AI-generated content may
    be incorrect.](assets/ch04_figure_12_1760455018636193.png)


    Stacking summaries is not the only method of summarization. Instead of adding
    a summary of the most recent query/answer pair each time, you can instead summarize
    the conversation history of the last 5 conversations. Likewise, you can decide
    to maintain one summary and ask the LLM to update it after each conversation.
    Figure 4-13 illustrates such a method where conservation turns 1 through 5 are
    summarized, but not turn 6.


    ![A black and white math equation AI-generated content may be incorrect.](assets/ch04_figure_13_1760455018636207.png)


    Although it may seem straightforward, maintaining the conversation history can
    be a difficult task and requires understanding what is important: the entire history,
    the recent history, or a summarized variant? For short conversations, maintaining
    the entire history would work, but that might not be the case for long sequences
    of actions.


    # Long-Term Memory


    As the conversation history grows and the actions that an agent has taken, so
    does the need for long-term memory. Long-term memory typically involves maintaining
    one or more external databases that can be queried to extract additional information.
    This can contain information about previous traces or states of the agent (episodic
    memory) or information unrelated to the agent’s behavior but about the context
    of your application instead (semantic memory), like your organization’s documents.


    ## Retrieval-Augmented Generation (RAG)


    Arguably, the most common method for giving your agent, or any LLM for that matter,
    long-term memory is Retrieval-Augmented Generation (RAG).^([4](#ch01.html_id119))
    RAG typically consists of two stages: *ingestion* and *inference*.


    In ingestion, your external data, typically unstructured text, is embedded into
    numerical representations and stored in a database (see Figure 4-14). To create
    these representations, a special variant of an LLM is used, an embedding model.
    This embedding model is trained to create numerical representations such that
    words and phrases with similar meaning will have similar representations. This
    external database can be considered the long-term memory of the LLM, which can
    be queried for relevant information.


    ![](assets/ch04_figure_14_1760455018636221.png)


    Inference with RAG consists of four steps. In step 1, the user’s query is embedded
    using the same model as was used for embedding the external data. In step 2, the
    embedded query is compared to the external database, and the most relevant items
    in the database to the query are extracted.


    Defining relevancy in RAG systems can mean many things. In our example, it means
    the similarity between the query embeddings and the external embeddings. This
    similarity can be defined through the embeddings we created, but hybrid systems
    are also possible where embeddings are combined with traditional Bag-of-Words-like
    approaches.


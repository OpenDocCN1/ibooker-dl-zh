    call, along with the output, is now part of the previously generated tokens. Then,
    the LLM can decide to continue generating tokens if necessary. Figure 5-19 demonstrates
    the end-to-end process of calling the tool, adding the output during generation,
    and giving back an answer.


    ![](assets/ch05_figure_19_1760455020912220.png)


    The input/output of this process is therefore as follows:


    **Input**: “What is 5.1 times 7.3?”


    **Output**: “5.1 * 7.3 is `[Calculator(5.1*7.3)→37.23]` The answer is 37.23.”


    This process of adding the output whilst generating tokens is an important construct
    and is often used in various models. By embedding the output during generation,
    the model uses tools more naturally and generates fluent language. It also lends
    itself quite well for reasoning LLMs, where tools are called during the reasoning
    process instead of having to go back and forth between messages (remember Search-o1
    from the previous chapter?).


    To enable this in-line tool calling behavior in Toolformer, the model needs to
    be fine-tuned first. To do so, the authors carefully generated a dataset with
    many different examples of tool use. For each tool, a few-shot prompt was manually
    created and used to sample outputs. By sampling different outputs (much like the
    sampling with Search against Verifiers we explored in the reasoning chapter),
    the best output could be extracted by filtering on the correctness of the tool
    use, output, and loss decrease. The full process of creating this dataset is shown
    in Figure 5-20.


    ![](assets/ch05_figure_20_1760455020912233.png)


    In other words, the original data was adjusted to include tool calls instead of
    generating the answer by the LLM itself. All inputs were essentially updated to
    contain the appropriate tool.


    Finally, the LLM (GPT-J, a variant of GPT-3) was fine-tuned using this updated
    data using supervised fine-tuning. At the time, this technique showed significant
    improvements over zero-shot performance and competed with larger models. However,
    supervised fine-tuning on this data made generalization difficult. Supervised
    fine-tuning tends to be sensitive to the exact wording and prompt that is being
    used because it attempts to recreate what it is being shown. As we will explore
    next, Reinforcement Learning tends to be a much more stable technique for generalization
    in tool use.


    ## Reinforcement Learning


    As we explored in Chapter 3, reinforcement learning is an excellent method of
    training or fine-tuning to align your model to certain rewardable tasks. Compared
    to supervised fine-tuning, where an LLM trains on fixed examples with the correct
    answer, reinforcement learning relies on trial and error. In reinforcement learning,
    LLMs develop improved reasoning strategies not from being told exactly what to
    do (the mimicking behavior of supervised fine-tuning) but from repeatedly exploring
    feedback signals.


    In the context of reinforcement learning, tool-learning is often integrated into
    the` tokens, then the search engine calling function with `<search></search>`
    where the output is reintegrated with `<information></information>`, and finally,
    the answer through `<answer></answer>` tokens. Note that the reasoning traces
    and the search engine can be interleaved several times.


    ![](assets/ch05_figure_23_1760455020912273.png)


    What makes this template particularly interesting is that the authors focus on
    a single tool, search. The reason for this was the upcoming popularity of DeepResearch,
    a framework where reasoning LLMs are coupled with search engines to create agentic
    systems that allow for in-depth research on various topics. The authors of Search-R1
    created this framework as a strong open-source alternative to the proprietary
    systems out there.


    The result of such a template is, like ToolRL, tool-interleaved reasoning with
    multi-turn search engine calls. We illustrated an example of such a process in
    Figure 5-24. Note that the `<search></search>` tool can be any application, like
    the open-access archive of academic papers arXiv, or a combination of various
    sources.


    ![A screenshot of a chat AI-generated content may be incorrect.](assets/ch05_figure_24_1760455020912287.png)


    The approach of training the algorithm with reinforcement learning is rather straightforward.
    The authors adopted a simplified outcome-based reward function. Rather than creating
    all different kinds of formatting and accuracy rewards (like DeepSeek-R1), only
    accuracy rewards were used (based on the task). Since the underlying model (Qwen-2.5)
    already has strong structural adherence, there was no need for formatting rewards.


    作者同时探索了 PPO 和 GRPO 作为强化学习算法，如图 5-25 所示。在撰写本文时（2025 年 9 月），两者都是 LLM 最流行的两种强化学习方法，我们将在第
    X 章更深入地探讨。请注意，PPO 和 GRPO 中的损失通常是针对整个 token 序列计算的，包括搜索引擎的输出。在 Search-R1 中，搜索引擎输出的
    token 被屏蔽（忽略），以防止模型试图控制搜索引擎的输出——这些输出并非直接由 LLM 生成（这可能会产生意想不到的动态）。这被称为*检索 Token
    的损失屏蔽*。


    ![一个过程的示意图，AI 生成的内容可能不正确。](img/ch05_figure_25_1760455020912301.png)


    这类利用强化学习的框架和方法论变得越来越流行，因为工具调用的奖励结构通常非常简单直接。检查工具是否被正确调用以及是否使用了正确的参数（如 ToolRL 中那样）是轻而易举的。此外，强化学习对于可验证的奖励效果很好，比如编码和工具调用。因此，使用强化学习训练并额外采用基于工具的奖励的模型越来越多，比如强大的开源
    Qwen3^(12)和 GPT-OSS^(13)模型。


    # 模型上下文协议（MCP）


    在前面的章节中，我们探讨了如何将工具连接到 LLM，使它们能够做的事情远不止文本生成。尽管它们使用工具的能力令人惊叹，但这并非免费的午餐。想象一下，你已经开发了几个提示词来指导你的
    LLM 如何使用工具。正如该领域的常态，一个新的 LLM 版本发布了，你想连同所有工具一起试用。现在想象一下，它有一种新的工具调用方式，这意味着你必须为所有工具创建新的集成。这就是
    NxM 问题，其中 N 是 LLM 的数量，M 是可用工具的数量。你将不得不为每一个 LLM/工具组合编写自定义集成。


    模型上下文协议（MCP）通过标准化如何将不同结构的工具和 API 连接到你的 LLM 来解决这个问题。它是由 Anthropic 开发的一个开放标准和框架。^(14)作为一种协议，它促进了工具和
    LLM 之间的双向通信。由于其中立性，它常被称为“AI 的 USB-C 端口”，允许任何 LLM 实现遵循该协议的任何工具。如图 5-26 所示，MCP 无需手动创建
    LLM 和工具之间的连接，而是只需创建一个可以由工具提供方无限期维护的单一连接。


    ![](img/ch05_figure_26_1760455020912315.png)


    通过让 MCP 服务器处理集成并通过 MCP 标准向 LLM 传达工具，需要维护的连接从 NxM 个变成了 N+M 个。此外，只要工具提供方有 MCP 服务器，将服务器连接到你的
    LLM 就相对简单，但稍后会详细讨论！


    因此，集成的维护工作也从用户转移到了工具提供方。如果没有 MCP，如果 arXiv 的 API 突然发生剧烈变化，那么每个用户都必须调整他们的集成。有了 MCP，API
    的任何更改只需由该 API 的维护者解决一次。然后，更新就可以在用户不做任何干预的情况下推送给所有用户。


    为了进一步说明这一点，如果你手动向 LLM 添加工具，所有工具都必须：


    *   手动**跟踪**并馈送给 LLM，

    *   手动**描述**（包括预期的 JSON 模式）

    *   每当其 API 更改时手动**更新**


    如图 5-27 所示，这可能会给工具维护带来相当大的麻烦。


    ![](img/ch05_figure_27_1760455020912328.png)


    因此，MCP 不仅解决了 NxM 问题，还解决了标准化问题。请注意，MCP 并不是唯一用于标准化通信的协议，例如用于标准化代理间通信的 Agent 2 Agent（A2A）。^(15)虽然还有其他协议，但在
    2025 年，它可以说是其中最流行的协议之一。^(16)


    ## 核心组件


    为了实现所有这些强大的功能，MCP 由四个组件组成：


    MCP 服务器

    : 为 LLM 提供上下文、工具和能力


    MCP 主机

    : 管理连接的 LLM 应用程序（如 Cursor）


    MCP 客户端

    : 与 MCP 服务器保持一对一的连接


    资源

    : 本地或远程提供的工具、数据或服务


    *MCP 主机*是任何使用 LLM 来使用外部工具的应用程序。典型的例子包括 ChatGPT 或 Claude 等聊天助手，以及 Cursor 或 GitHub
    Copilot 等 IDE 扩展。这是 MCP 流程的“大脑”，通过 MCP 客户端调用 MCP 服务器。


    *MCP 客户端*维护与 MCP 服务器的连接。它们存在于主机内部，处理连接管理、工具能力发现、请求转发等。与主机相比，它是处理与 MCP 服务器通信的一段代码，而
    MCP 主机仅发起通信。


    *MCP 服务器*是一个轻量级程序，通过 MCP 标准公开 API 和工具。这些服务器通常连接到特定的数据源或服务。例如，一个 MCP 服务器可能连接到 arXiv
    的所有 API 端点，以搜索、加载和查看学术论文。


    总而言之，**MCP 主机**（例如 GitHub Copilot）包含一个**MCP 客户端**，该客户端连接到多个**MCP 服务器**（这些服务器提供工具、资源或数据源）。


    这三个组件如图 5-28 所示。


    ![](img/ch05_figure_28_1760455020912341.png)


    ## MCP 流程


    即使展示了并描述了核心组件，MCP 可能仍然有些神秘。相反，让我们通过一个示例来看看使用 MCP 发现和调用工具会是什么样子。假设你希望你的 AI 助手（也许是
    GitHub Copilot 或 Claude Code）总结你代码库中最近的 5 次提交。这个流程在接下来的图表中已编号，以便我们能够准确地追踪每一步。


    一切始于用户的查询：“总结最近的 5 次提交”。如图 5-29 所示，这个提示词被发送到 MCP 主机（1），主机通过 MCP 客户端询问 MCP 服务器有哪些可用工具（2）。MCP
    服务器连接到一组工具（GitHub），并将所有可用 API 调用的列表返回给 MCP 主机（3）。API 调用可能包括常见的方法，如列出所有提交（`/list_commits`）或创建拉取请求（`/create_pr`）。然后，初始提示词连同可用工具一起发送给
    LLM（4）。


    ![一个软件过程的示意图，AI 生成的内容可能不正确。](img/ch05_figure_29_1760455020912355.png)


    接下来，LLM 可以选择使用返回的任何工具（图 5-30）。由于用户的查询是关于提交的，LLM 决定让 MCP 服务器使用`/list_commits`工具（5）。MCP
    客户端将此操作传达给 MCP 服务器（6），后者最终执行该命令（7）。工具使用的输出返回给 MCP 服务器（8），再通过 MCP 协议传递回 MCP 客户端和主机（9）。


    ![](img/ch05_figure_30_1760455020912368.png)


    当 LLM 收到结果（10）时，它可以选择运行另一个工具，或者将输出返回给 MCP 主机，再由主机转交给用户。在我们的示例中，LLM 决定总结收到的最近 5
    次提交（11），并将总结返回给用户（12）。见图 5-31。


    ![](img/ch05_figure_31_1760455020912381.png)


    '

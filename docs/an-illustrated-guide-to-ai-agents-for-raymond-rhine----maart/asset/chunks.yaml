    \ the entire database. Moreover, after the results have been re-ranked according\
    \ to their relevance, we can choose to only keep the most relevant documents.\n\
    \n![](assets/ch04_figure_32_1760455018636610.png)\n\nRe-ranking is only one of\
    \ the many ways to select and create the right context. We can also structure\
    \ the output to ensure the responses of the Agent are broken up into logical parts\
    \ and only contain the necessary components. Likewise, we can employ business\
    \ rules that give additional weights to certain pieces of information that always\
    \ provide important context (much like a system prompt).\n\nNote that selecting\
    \ the right context can also mean selecting the right context for the right agent.\
    \ By isolating the context across multiple specialized agents, each agent is able\
    \ to focus on a smaller part of the problem without being overwhelmed by the full\
    \ context.\n\n### Context Compression\n\nThe goal of context engineering is to\
    \ find a balance between what you put in the context and how much. As such, compressing\
    \ the context as much as possible is an important strategy for optimizing the\
    \ context.\n\nA common way to handle compression is what we discussed at the beginning\
    \ of this chapter, using an LLM to create summaries of your conversation history.\
    \ As we explored in Search-o1, we can even compress the output of the RAG pipeline\
    \ using an LLM to summarize the retrieved documents.\n\nAnother method of compressing\
    \ the context is by reducing redundancy. Even with a re-ranker, the top 5 most\
    \ relevant results might all contain very similar documents. Together, they are\
    \ not bigger than the sum of their parts but smaller instead because they contain\
    \ similar information. As such, we do not only want the most relevant documents,\
    \ but in a way that they are still documents that each contain a new piece of\
    \ information.\n\nA common technique to use, whether they are the output documents\
    \ of your RAG pipeline or other pieces of retrieved information, is called Maximal\
    \ Marginal Relevance (MMR).^([17](#ch01.html_id132)) This technique uses a precalculated\
    \ relevance vector and redundancy matrix to balance the diversity of documents.\n\
    \nFirst, the similarity between the retrieved document and query embeddings is\
    \ calculated. This results in a *relevance vector* which has a value per document\
    \ to indicate how similar/relevant the given document is to the query (see Figure\
    \ 4-33).\n"
  trans: "\n即使在这个简化的示例中，智能体之间及其内部也存在大量动态行为，它们会更新、存储和检索各种上下文。此外，本示例中的所有上下文都是文本，可以使用标准\
    \ LLM 进行处理。然而，对于某些用例，您可能希望它能够处理更多模态，例如图像和声音。我们将在第 X 章和第 X 章中更详细地介绍多模态 LLM。\n\n\
    ## 多智能体系统的上下文工程\n\n正如我们将在第 X 章中深入介绍的那样，多智能体系统是指多个智能体协同解决给定问题的系统。我们的深度研究智能体示例在其系统中使用了一个摘要智能体，从而实现了协同工作。在多智能体系统中，上下文工程特别困难的原因在于，不仅需要仔细管理主智能体的上下文，系统中所有其他智能体的上下文也需要如此管理。此外，智能体之间的交互也是这些相应智能体之间共享上下文的一部分。\n\
    \n为了管理这个复杂的上下文网络，可以使用较小的智能体来处理部分上下文“负担”，正如我们在深度研究智能体中所展示的那样。通过使用配备较小 LLM 的较小智能体来处理特定任务，部分上下文可以单独处理，从而为主智能体（也称为编排智能体）节省大量计算资源。这些小型和/或专业化智能体之所以非常适合上下文工程，是因为它们可以处理更小、更易于管理的上下文，具有明确的职责，并且更易于测试和调试。这类系统通过分离任务而非让一个智能体同时处理各种不同任务和上下文，可以变得更可靠。\n\
    \n## 优化上下文\n\n在本章中，我们介绍了许多处理 LLM 和智能体记忆与上下文的不同方法和技巧。优化上下文中放入的内容和方式是一个多方面的复杂问题，需要理解智能体架构的各个部分。大多数优化上下文的策略都建立在上下文的主要来源之上，即智能体的记忆模块。\n\
    \n尽管策略众多，让我们探讨最常见的几种。\n\n### 上下文跟踪与存储\n\n在向智能体提供可能相关的上下文之前，首先需要将其跟踪并存储在某个地方。我们已经介绍了大部分相关内容，因为这涉及多种形式的记忆，特别是情景记忆，它包含了智能体迄今所采取的行动。尽管情景记忆被视为长期记忆，但它与智能体的对话历史高度相关，而对话历史往往捕捉了智能体的行动。\n\
    \n然而，跟踪上下文不仅仅限于智能体的事件痕迹。它还涉及管理外部知识源，例如您的专有数据库，这些可以作为额外的上下文。要建立这些知识源，您必须事先决定要跟踪哪些类型的信息。尽管乍看之下可能显而易见，但您可以跟踪的信息类型有很多：\n\
    \n*   智能体行为\n    *   智能体（及任何子智能体）的工具使用情况\n    *   工具输出和中间结果\n    *   （子）智能体之间的交互\n\
    \    *   内部推理步骤\n    *   对话历史\n    *   失败/成功情况\n*   用户行为\n    *   用户意图（显式请求和目标）\n\
    \    *   用户反馈（编辑、批准、拒绝）\n*   知识源\n    *   专有数据库的快照（用于可复现性和审计）\n    *   外部文档（RAG、API\
    \ 等）\n    *   结构化工件，如 `PLAN.md`、`REQUIREMENTS.md` 等\n*   系统级\n    *   配置（LLM 超参数、可用工具等）\n\
    \    *   策略（护栏、约束等）\n\n以上所有内容仅仅是您可能跟踪的示例。在实践中，并非所有内容都有用，同时，许多其他内容也应当包含在内。正如我们稍后将探讨的那样，跟踪这些类型的上下文和信息，也有助于传达用户意图并调试这些复杂系统。\n\
    \n### 上下文选择\n\n假设您已经建立了所有数据库，优化上下文的第一件事就是建立一个能够选择正确上下文的系统。如前所述，RAG 是一种非常出色的技术，也是选择相关内容的示例。尽管我们已经看到了改进\
    \ RAG 的各种变体，但尚未探讨如何进一步改进这一选择过程。\n\n在 RAG 中，输入文档通常被拆分为更小的部分，例如句子或段落，以隔离其中包含的信息，并将其保持为单一主题。然而，当您随后运行\
    \ RAG 流水线时，通常会得到一组文档作为返回结果。例如，如果我们搜索向量数据库中的“气候变化的原因”，系统可能会返回关于温室气体、工业活动和森林砍伐的文档。尽管这些文档可能无法直接回答我们的问题，但它们具有相关性。\n\
    \n为了改进这一过程，我们可以使用重排序器来优化检索到的文档集。这种技术（通常是语言模型）同时接收查询和检索到的文档，根据它们与查询的相关性以及彼此之间的相关性对检索到的文档重新排序（见图\
    \ 4-32）。通过为重排序器提供额外的上下文（所有检索到的文档），它的处理文档数量将远远少于我们给它整个数据库的情况。此外，在根据相关性对结果进行重新排序之后，我们可以选择只保留最相关的文档。\n\
    \n![](img/ch04_figure_32_1760455018636610.png)\n\n重排序仅是选择并创建正确上下文的众多方法之一。我们还可以结构化输出，以确保智能体的响应被分解为逻辑部分，并且只包含必要的组件。同样，我们可以采用业务规则，为某些始终提供重要上下文的信息赋予额外权重（很像系统提示）。\n\
    \n请注意，选择正确的上下文也可能意味着为正确的智能体选择正确的上下文。通过在多个专门化智能体之间隔离上下文，每个智能体都能专注于问题的较小部分，而不会被完整上下文所淹没。\n\
    \n### 上下文压缩\n\n上下文工程的目标是在上下文中放入什么内容以及放入多少之间找到平衡。因此，尽可能压缩上下文是优化上下文的重要策略。\n\n一种常见的压缩处理方式是我们在本章开头讨论过的，即使用\
    \ LLM 创建对话历史的摘要。正如我们在 Search-o1 中所探讨的那样，我们甚至可以使用 LLM 压缩 RAG 流水线的输出，以总结检索到的文档。\n\
    \n另一种压缩上下文的方法是减少冗余。即使使用重排序器，排名前 5 的最相关结果也可能包含非常相似的文档。它们合在一起，并不是各部分之和大于整体，而是由于包含相似信息而小于整体。因此，我们不仅需要最相关的文档，而且还需要它们各自包含新信息的文档。\n\
    \n一种常用技术，无论是用于 RAG 流水线的输出文档还是其他检索信息，被称为最大边际相关性（MMR）。^(17) 该技术使用预先计算的相关性向量和冗余矩阵来平衡文档的多样性。\n\
    \n首先，计算检索文档与查询嵌入之间的相似度。这会产生一个*相关性向量*，其中每个文档都有一个值，用于指示该文档与查询的相似度/相关性（见图 4-33）。\n"

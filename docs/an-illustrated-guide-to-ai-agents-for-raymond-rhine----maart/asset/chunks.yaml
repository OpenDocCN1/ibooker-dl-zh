    `]`词元告诉 LLM 工具已执行完毕，并且工具调用连同其输出现在已成为之前生成的词元的一部分。然后，如有必要，LLM 可以决定继续生成词元。图 5-19
    演示了调用工具、在生成过程中添加输出并给出回答的端到端流程。


    ![](img/ch05_figure_19_1760455020912220.png)


    因此，该过程的输入/输出如下：


    **输入**：“5.1 乘以 7.3 等于多少？”


    **输出**：“5.1 * 7.3 是`[Calculator(5.1*7.3)→37.23]`，答案是 37.23。”


    在生成词元的同时添加输出的这种过程是一个重要机制，常被各种模型采用。通过在生成过程中嵌入输出，模型能够更自然地使用工具，并生成流畅的语言。这种方法也非常适合推理型
    LLM——在推理过程中调用工具，而不必在消息之间来回切换（还记得上一章的 Search-o1 吗？）。


    为了在 Toolformer 中启用这种内联工具调用行为，需要先对模型进行微调。为此，作者精心生成了一个包含大量不同工具使用示例的数据集。针对每个工具，作者手动创建了少样本提示（few-shot
    prompt），并用来采样输出。通过采样不同的输出（很像我们在推理章节中探讨的 Search against Verifiers 采样方式），可以根据工具使用的正确性、输出情况以及损失下降程度进行过滤，从而提取出最佳输出。创建该数据集的完整过程如图
    5-20 所示。


    ![](img/ch05_figure_20_1760455020912233.png)


    换句话说，原始数据经过调整，加入了工具调用，而不是由 LLM 自行生成答案。所有输入基本上都经过更新，融入了相应的工具。


    最后，使用监督微调在这份更新后的数据上对 LLM（GPT-J，GPT-3 的一个变体）进行了微调。当时，这项技术相比零样本性能有了显著提升，甚至可与更大的模型一较高下。然而，在这份数据上进行监督微调使得泛化变得困难。监督微调往往对所使用的确切措辞和提示非常敏感，因为它试图复现所展示的内容。正如我们接下来将探讨的，强化学习往往是实现工具使用中泛化的一种更稳定的技术。


    ## 强化学习


    正如我们在第 3 章中探讨的，强化学习是一种出色的训练或微调方法，可以让模型对齐到某些可奖励的任务。与 LLM 在带有正确答案的固定示例上进行训练的监督微调相比，强化学习依靠的是试错。在强化学习中，LLM
    并非通过被告知确切该做什么（即监督微调的模仿行为）来发展改进的推理策略，而是通过反复探索反馈信号。


    在强化学习的背景下，工具学习通常被整合到`词元中，然后通过`<search></search>`调用搜索引擎函数，其输出通过`<information></information>`重新整合，最后通过`<answer></answer>`词元给出答案。请注意，推理轨迹和搜索引擎可以交替进行多次。


    ![](img/ch05_figure_23_1760455020912273.png)


    这个模板特别有趣之处在于，作者只专注于单一工具——搜索。原因是 DeepResearch 即将流行起来，该框架将推理 LLM 与搜索引擎相结合，创建出能够在各种主题上进行深入研究的智能体系统。Search-R1
    的作者创建了这个框架，作为现有专有系统的一个强大开源替代方案。


    与 ToolRL 一样，这种模板产生的结果是工具交错的推理，以及多轮搜索引擎调用。我们在图 5-24 中展示了这样一个过程的示例。请注意，`<search></search>`工具可以是任何应用程序，例如学术论文的开放获取存档
    arXiv，或各种来源的组合。


    ![AI 生成的聊天内容截图，内容可能不正确。](img/ch05_figure_24_1760455020912287.png)


    使用强化学习来训练该算法的方法相当直接。作者采用了简化的基于结果的奖励函数。作者没有构建各种不同类型的格式和准确性奖励（如 DeepSeek-R1 那样），而是仅使用了（基于任务的）准确性奖励。由于底层模型（Qwen-2.5）已经具有很强的结构遵循能力，因此无需格式奖励。



    ## 第 1 章 记忆


    在所有为增强 LLM 添加的模块中，记忆是将 LLM 转变为智能体的关键组成部分。LLM 本身是健忘的实体；它们不记得过去的对话，也无法访问自己已执行的所有操作。如果你在本地加载一个
    LLM，并让它记住你的名字，它做不到——除非你明确地赋予它记忆。相比之下，你与托管 LLM（如 ChatGPT 和 Claude）的交互并非普通的 LLM。确切地说，它们是配备了记忆和工具等模块的增强
    LLM。图 4-1 很好地说明了这种健忘性，因为它展示了你与普通 LLM 可能进行的交互。因此，LLM 是无状态的，信息不会在多次调用之间持续保留。


    ![](img/ch04_figure_1_1760455018635952.png)


    多年来，人们对智能体的各方面投入了大量关注，例如工具使用、推理 LLM 和多智能体协作。每方面本身都十分重要，但不要低估记忆的重要性。没有记忆，个人助理智能体无法记住过去的对话；没有记忆，编码智能体无法理解你的整个代码库；没有记忆，智能体会忘记自己已经执行过的动作并不断重复。


    记忆可能很难定义。从狭义上讲，它涉及智能体执行过程中的所有历史信息。然而，在本章中，我们采取更广泛的视角。记忆不仅涉及智能体过去的所有行为，还涉及超出智能体与环境交互范围的外部信息。编码智能体的记忆不仅包含它为了修复你的缺陷（bug）所采取的操作，还包含你托管（在线的）文档和问题（issue）页面。


    记忆不仅仅是记住信息的行为，也包括存储新生成的信息。同样，常常需要决定存储哪些信息、如何存储，以及记住哪些信息。所有这些方法和选择都会对智能体的行为产生重要影响。如图
    4-2 所示，更新和使用记忆是一个迭代过程，需要谨慎处理中间信息。


    ![](img/ch04_figure_2_1760455018635988.png)


    记忆让智能体能够记住过去的错误和失败经历，从而在未来处理类似任务时更加高效。因此，记忆使智能体能够随着记住更多经验而学习和进化。通过与环境交互并存储反馈，智能体会从以往的经验中学习。因此，记忆是特定于应用（application-specific）的，实现不仅可以决定记住*什么*，还可以决定*如何*去记住。


    在本章中，我们将探索多种类型的记忆模块，从短期记忆和长期记忆到外部记忆模块，并通过（智能体式）检索增强生成等方法加以介绍。如图 4-3 所示，记忆构成了 LLM
    的基础。毕竟，如果 LLM 总是忘记如何使用工具或制定计划，它又怎能做到这些呢？


    ![一种记忆处理模型的图示。AI 生成的内容可能不正确。](img/ch04_figure_3_1760455018636036.png)


    ### 记忆的类型


    LLM 的记忆往往遵循人类的记忆类型，因为我们试图创建的智能体常常以人类行为为模型。人类记忆的形式有很多，这里不再一一列举，《语言智能体的认知架构》（“Cognitive
    Architectures for Language Agents”）论文描述了我们在智能体中经常看到的四种外部记忆，即短期工作记忆和长期记忆：情景记忆、语义记忆和程序记忆。^(1)


    **工作记忆**是一种短期记忆，通常被定义为一个容量有限的系统，临时保存我们用于决策和推理等任务所需的信息。对于 LLM 而言，它通常是在 LLM 调用之间持久保存的数据。更具体地说，就是存储在记忆中并不断反馈给
    LLM 的聊天历史。


    长期记忆有三种形式：


    - **情景记忆**：涉及记住个人过去的特定事件和经历（例如，你的上一个生日聚会）。对智能体而言，这通常涉及智能体迄今为止所采取的特定行动及其结果。

    - **语义记忆**：涉及记住关于世界的知识（例如，法国的首都）。对智能体而言，这可能涉及查询外部数据库，如维基百科或你正在使用的代码库。

    - **程序记忆**：涉及记住做事情的模式（例如，用 Python 编写代码）。对智能体而言，这可以是隐藏在其参数中的信息（也称为参数记忆），也可以是跨调用持续存在的系统提示（system
    prompt）。



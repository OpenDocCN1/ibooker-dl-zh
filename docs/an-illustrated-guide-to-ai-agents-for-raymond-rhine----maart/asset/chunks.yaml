    ## Chapter 1. Memory


    Among all the added modules to the augmented LLM, memory is a key component needed
    to go from an LLM to an Agent. By themselves, LLMs are forgetful entities; they
    do not remember past conversations, nor do they have access to all actions they
    have taken. If you were to locally load up an LLM and ask it to remember your
    name, it can’t–not without explicitly giving it memory. In contrast, the interactions
    that you might have with hosted LLMs, like ChatGPT and Claude, are not regular
    LLMs. Rather, they are LLMs augmented with modules like memory and tools. Figure
    4-1 illustrates this forgetfulness well, as it demonstrates the interaction you
    might have with a regular LLM. As such, LLMs are stateless, and information is
    not persisted across calls.


    ![](assets/ch04_figure_1_1760455018635952.png)


    Over the years, there has been significant attention to aspects of agents like
    tool usage, reasoning LLMs, and multi-agent collaboration. Each is quite important
    by itself, but don’t underestimate the importance of memory. Without memory, a
    personal assistant agent wouldn’t be able to remember past conversations. Without
    memory, a coding agent wouldn’t understand your entire codebase. Without memory,
    an Agent would forget that it has already taken a given action and keep on repeating
    it.


    Memory can be quite difficult to define. From a narrow view, it relates to all
    historical information during the execution of an Agent. In this chapter, however,
    we take a broader perspective. Memory relates not only to all past actions of
    an Agent, but also external information beyond the agent-environment interactions.
    A coding agent’s memory would not only consist of the actions it has taken to
    fix your bugs, but also your hosted documentation and issues pages.


    Memory is not only the act of remembering information but also storing newly generated
    information. Likewise, often a choice has to be made on which information to store
    and how, and which information to remember. All these methodologies and choices
    have important implications on the Agent’s behavior. As shown in Figure 4-2, updating
    and using memory is an iterative process that requires careful handling of intermediate
    information.


    ![](assets/ch04_figure_2_1760455018635988.png)


    Memory allows the agent to remember past errors and failed experiences, so it
    can be more effective for handling similar tasks in the future. As such, memory
    enables Agents to learn and evolve as they remember more experiences. By interacting
    with the environment and storing the feedback, Agents learn from their previous
    experiences. Memory is, therefore, application-specific, and implementations may
    not only decide *what* to remember but also *how* it is remembered.


    Throughout this chapter, we will explore many types of memory modules, ranging
    from short-term and long-term memory to external memory modules, through methods
    like (agentic) retrieval-augmented generation. Seen in Figure 4-3, it forms the
    foundation of the LLM. After all, how would an LLM be able to use tools or create
    plans if it keeps forgetting them?


    ![A diagram of a memory processing model AI-generated content may be incorrect.](assets/ch04_figure_3_1760455018636036.png)


    ### Types of Memory


    Memory for LLMs tends to follow human memory types, as the agents that we attempt
    to create are often modeled after human behavior. Instead of going through all
    forms of human memory types, which there are many, the “Cognitive Architectures
    for Language Agents” paper describes four types of external memory that we often
    see back in Agents, namely short-term working memory and long-term memories: episodic,
    semantic, and procedural memory.^([1](#ch01.html_id116))


    **Working memory** is a type of short-term memory that is typically defined as
    a system with limited capacity that temporarily holds information that we need
    for things like decision-making and reasoning. For LLMs, it is typically data
    that persists across LLM calls. More specifically, it is the chat history of the
    LLM that is being stored in memory and continuously fed back to the LLM.


    For long-term memory, there are three forms described:


    - **Episodic memory**: Involves remembering specific events and experiences from
    one’s past (e.g., your last birthday party). For agents, this typically involves
    specific actions the agent has taken thus far and their outcomes.

    - **Semantic memory**: Involves remembering knowledge about the world (e.g., the
    capital of France). For agents, this may involve querying an external database
    like Wikipedia or the codebase that you are working on.

    - **Procedural memory**: Involves remembering patterns of how to do things (e.g.,
    writing code in Python). For agents, this can be information hidden in its parameters
    (also called parametric memory) or the system prompt, which persists across calls.


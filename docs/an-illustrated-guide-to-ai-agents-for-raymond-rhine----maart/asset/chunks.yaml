    这些步骤之所以如此特别，是因为 LLM 能够发现现有工具、选择使用哪一个，并且无需过多考虑已弃用的 API 功能。


    请注意，LLM 仍然需要具备工具调用能力。每当它想要执行某个工具时，都应遵循 MCP 协议，该协议采用类似 JSON 的结构。这种结构遵循[JSON-RPC
    2.0 规范](https://www.jsonrpc.org/specification)，同样由 MCP 客户端传递，而 MCP 客户端充当 LLM 与协议之间的中间人。


    # 小结


    在本章中，我们探讨了工具调用如何使 LLM 具备与世界交互的能力。我们首先介绍了工具调用的基础知识，以及 LLM 在实践中如何调用工具。我们了解到，作为文本到文本的实体，LLM
    仅传达调用工具的意图。实际调用工具的行为要么由用户自己完成，要么由自动化该过程的外部软件完成。调用工具的流程包括工具创建、定义、选择、调用和输出处理。


    然后，我们探讨了让 LLM 学习这些工具调用能力的三种方法。第一种是上下文学习，你可以在提示词中定义工具的模式和定义，供 LLM 遵循。我们将 HuggingGPT
    作为上下文学习实现工具调用的优秀示例进行了介绍。第二种是监督微调，即对 LLM 进行特定工具调用能力的微调。我们将 ToolFormer 作为最早使用监督微调进行工具调用的成功尝试之一进行了介绍。最后，我们介绍了强化学习，这是灌输工具调用能力最突出的技术之一。其中值得一提的是
    ToolRL 和 Search-R1，它们都采用了 GRPO，这是 DeepSeek-R1 中使用的一种流行的强化学习算法。


    在本章的最后，我们介绍了工具调用领域最令人兴奋的内容之一——模型上下文协议（MCP）。我们探讨了 MCP 如何将工具的使用标准化，从而无需自定义解决方案即可广泛使用工具。



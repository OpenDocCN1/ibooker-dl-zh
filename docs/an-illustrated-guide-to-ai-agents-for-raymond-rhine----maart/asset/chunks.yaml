- raw: 'What makes these sets of steps so special is that LLM can discover tools that
    exist, choose which one to use, and does not have to think much about deprecated
    API functionalities.


    Note that the LLM should still have tool-calling capabilities. Whenever it wants
    to execute a given tool, it should follow the MCP protocol, which follows a JSON-like
    structure. This structure, following the [JSON-RPC 2.0 Specification](https://www.jsonrpc.org/specification),
    is also communicated by the MCP Client, which serves as the middleman between
    the LLM and the protocol.


    # Summary


    In this chapter, we explored how tool calling makes LLMs have the capabilities
    to interact with the world. We first covered the fundamentals of tool calling
    and how LLMs call tools in practice. We saw that as text-to-text entities, LLMs
    merely communicate the intent to call a tool. The act of actually calling the
    tool falls either to the user themselves or to external software that automates
    this process. The flow of calling a tool involved the tool creation, definition,
    selection, calling, and output processing.


    Then, we explored three methods of having LLMs learn those tool-calling capabilities.
    First was in-context learning, where you can define the tool’s schemas and definition
    in the prompt for the LLM to follow. We covered HuggingGPT as a great example
    of in-context learning to enable tool calling. Second was supervised fine-tuning,
    where an LLM is fine-tuned on specific tool-calling capabilities. We covered ToolFormer
    as one of the first successful attempts to use supervised fine-tuning for tool
    calling. Lastly, we covered reinforcement learning as one of the most prominent
    techniques for instilling tool-calling capabilities. Of note were ToolRL and Search-R1,
    which both adopt GRPO, a popular reinforcement learning algorithm used in DeepSeek-R1.


    We ended the chapter with one of the most exciting things in the realm of tool
    calling, the Model Context Protocol (MCP). We explored how MCP standardizes the
    usage of tools, which led to the widespread usage of tools without the need for
    custom solutions.



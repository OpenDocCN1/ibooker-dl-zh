    \ Bennet B. Murdock Jr. 1962. The serial position effect of free recall. Journal\
    \ of experimental psychology, 64(5):482.\n\n# Chapter 2. Tool Usage, Learning,\
    \ and Protocols\n\nThe tool module is such an interesting module for augmenting\
    \ your LLM and generating autonomous behavior in agents. By themselves, LLMs are\
    \ nothing more than functions that take in some string and output some string.\
    \ Although that creates interesting chatbots, they cannot yet interact with their\
    \ environment.\n\nA key trait that defines an agent is its ability to autonomously\
    \ search for, select, and utilize tools, allowing it to interact with and influence\
    \ its environment. With enough capabilities, agents can even create their own\
    \ set of tools to use. The benefit of tools is not contained to interaction with\
    \ the environment. Tools are typically used to access external knowledge or memories,\
    \ as we discussed in the previous chapter. We can even use tools to access specialized\
    \ (L)LMs that have capabilities that extend beyond what the agent is capable of,\
    \ like multimodal LLMs or LLMs specialized for certain tasks (like coding). Generally,\
    \ tools allow an LLM to take action and interact with the external environment\
    \ or extract data and use external applications (see Figure 5-1).\n\n![A black\
    \ and white icons AI-generated content may be incorrect.](assets/ch05_figure_1_1760455020911943.png)\n\
    \n###### \n\nHowever, regular LLMs cannot search the web, use a calculator, or\
    \ schedule appointments. They can only communicate the intention of doing so,\
    \ without being able to act upon it. Without tools, agents can only *think* autonomously\
    \ and not *act* autonomously.\n\nThe degree of autonomy also decides how tools\
    \ are being used. As shown in Figure 5-2, if there is no autonomy but a fixed\
    \ flow, then tools can be used in a predefined order. For instance, a research\
    \ agent might always call tools like arXiv and Google to extract results, which\
    \ are subsequently summarized.\n\n![A diagram of a computer program AI-generated\
    \ content may be incorrect.](assets/ch05_figure_2_1760455020911973.png)\n\n######\
    \ \n\nIn contrast, systems with larger degrees of autonomy allow Agents to choose\
    \ which tool to use and when. Illustrated in Figure 5-3, they are still sequences\
    \ of LLM calls but with autonomous selection of tools decided by the Agent.\n\n\
    ![A diagram of a company AI-generated content may be incorrect.](assets/ch05_figure_3_1760455020911990.png)\n\
    \n###### \n\nTools are about much more than merely using them. How are they created?\
    \ How is the output of a tool processed by the LLM or Agent? How are tools selected?\
    \ How many tools can an LLM effectively handle?\n\nThroughout this chapter, we\
    \ will not only explore several types of tools but also how LLMs and agents learn\
    \ how to use them and even how these tools can be standardized across different\
    \ agentic systems. As shown in Figure 5-4, this is the module that allows interaction\
    \ with the environment. It makes the next chapter, planning out actions to take,\
    \ more than a theoretical exercise. After all, how could an LLM act autonomously\
    \ without tools?\n\n![A diagram of a diagram of a memory tool AI-generated content\
    \ may be incorrect.](assets/ch05_figure_4_1760455020912000.png)\n\n###### \n\n\
    # Tool Usage\n\nTool usage consists of more steps than you might expect. It does\
    \ not start with an LLM using a tool, but actually creating and defining the tools,\
    \ planning which tool to use instead, and eventually calling them. Although the\
    \ steps in tool usage can be seen from many different perspectives (e.g.,^([1](#ch02.html_id136)),^([2](#ch02.html_id137)),\
    \ and ^([3](#ch02.html_id138))), we explore the following:\n\n*   Tool Creation\n\
    \n*   Tool Definition\n\n*   Tool Selection\n\n*   Tool Calling\n\n*   Output\
    \ Processing\n\nAlthough Agents might seem like they can do everything themselves\
    \ (which they can to a certain degree), they require help from the user or developer\
    \ to actually use the tools. The high-level process is shown in Figure 5-5, which\
    \ is an adaptation of OpenAI’s tool calling flow^([4](#ch02.html_id139)), where\
    \ we additionally focus on creating the tool and highlight the steps a single\
    \ tool call takes.\n\n![](assets/ch05_figure_5_1760455020912016.png)\n\n######\
    \ \n\nNote that each step may have various forms and implementations, many of\
    \ which we will cover later on. For now, let’s explore the most common way tool\
    \ usage happens in these steps and explore them in more detail.\n\n## Tool Creation\n\
    \nAlthough tools can come in various forms, they are typically functions that\
    \ can be accessed through either an API or some internal code. This can be as\
    \ complex or minimal as is required for your application. LLMs, for instance,\
    \ are not known for their mathematical capabilities. Let’s create a simple function\
    \ for multiplying two values that the LLM can use. Note that all coding examples\
    \ are meant as pseudo-code, and the full examples can be found in the book’s GitHub\
    \ repository.\n\n```\ndef multiply(a: float, b: float):\n    \"\"\"\n    Multiply\
    \ two numbers\n \n    Args:\n        a: First number\n        b: Second number\n\
    \    \"\"\"\n    return a*b\n```\n\nThese tools should be heavily documented,\
    \ as shown in the example, because the docstrings will also be communicated to\
    \ the LLM. A clear benefit is that it motivates users to focus more on writing\
    \ great documentation, which is often not a priority when developing code.\n\n\
    This tool can be accessed by directly calling `multiply(a, b)`, which is something\
    \ the LLM cannot do, but can be done by an automated system. Note that external\
    \ API calls may also call tools. Either way, a tool is generally considered to\
    \ be some form of function that can be called in various ways. In our example,\
    \ the most straightforward method would be to save it in a dictionary so that\
    \ we can access the function by a string. In this case, our *database* is the\
    \ `tools` variable:\n\n```\ntools = {\n  \"multiply\": multiply\n}\n```"

  trans: "\n\n尽管创建工具可能是一个直接了当的过程，但在设计工具时仍应考虑到 LLM。这与设计供人使用的代码类似，你可能会问自己：用户是否理解该工具的作用？返回的内容是否清晰？变量名是否具有描述性？是否有文档？\n\
    \n这对 LLM 尤为重要，因为它们通常需要明确被告知存在什么、不存在什么，以及工具能够做什么。\n\n## 工具定义\n\n创建工具之后，我们需要告知 LLM\
    \ 该工具的功能，这被称为工具定义。如果不向 LLM 传达存在哪些工具、它们的功能以及使用方式，LLM 将无法正确使用它们。\n\n有几种方法可以将这些信息传达给\
    \ LLM：\n\n- **学习**：在训练过程中学习工具的（具体）定义和用法\n- **提示**：通过结构化提示将工具定义分享给 LLM\n\n如何使用（特定）工具以及何时需要它们，通常是在\
    \ LLM 的微调阶段学习的，模型在这一阶段学习如何遵循指令和使用工具。这个学习阶段可以分为两个方面：要么调整模型以*学习*有关*特定工具*的知识，要么学习如何使用*通用工具*。学习特定工具可能成本高昂，并且会限制你可以添加到模型中的工具数量。相反，近期模型的关注点通常是其改进的指令遵循能力和通用工具使用能力。它们不是学习特定工具，而是学习识别提示中的工具定义并动态地使用它们。\n\
    \n随着（推理）LLM 变得更易于引导并动态学习使用工具，我们可以通过提示来分享工具定义。当你有一小组工具需要 LLM 使用时，你可以通过系统提示来分享：\n\
    \n```\nsystem_prompt = \"\"\"\n...\n \n# Tool Definition\nYou can use the following\
    \ tools:\n \n- multiply(a, b): multiplies two numbers\n- divide(a, b): divides\
    \ a by b\n- add(a, b): adds two numbers\n- subtract(a, b): subtracts b from a\n\
    \ \n# Tool Usage\nWhen you need to use them, write: [function_name(value1, value2)]\n\
    ...\n\"\"\"\n```\n\n请注意，这里的定义并没有遵循标准化的流程。坦率地说，这是我们临时编造的内容，目的是向你展示 LLM 可以按照你决定的任何方式调用工具。它使用\
    \ `TOOL(value1, value2)` 还是将其结构化为 `TOOL, value1, value2` 都无关紧要。你唯一需要的是一小段能够识别工具何时被调用的代码。我们将在本章稍后部分介绍\
    \ LLM 实际如何调用工具。\n\n另一种与 LLM 分享工具定义的方法是通过结构化的*函数调用*。与其我们自己费心处理提示词并优化每个工具的描述和格式，不如在结构化模式中定义每个工具。这些通常是\
    \ JSON Schema 对象，描述函数的名称、描述及其参数（类型、必填字段、范围等）。我们的 `multiply` 工具的此类模式示例如下：\n\n```\n\
    {\n  \"type\": \"function\",\n  \"function\": {\n    \"name\": \"multiply\",\n\
    \    \"description\": \"Multiply two numbers\",\n    \"parameters\": {\n     \
    \ \"type\": \"object\",\n      \"properties\": {\n        \"a\": {\n         \
    \ \"type\": \"number\",\n          \"description\": \"First number\"\n       \
    \ },\n        \"b\": {\n          \"type\": \"number\",\n          \"description\"\
    : \"Second number\"\n        }\n      },\n      \"required\": [\n        \"a\"\
    ,\n        \"b\"\n      ]\n    }\n  }\n}\n```\n\n在使用外部 API 时，这些模式通常作为单独的参数传递。例如，OpenAI\
    \ 使用 `tools` 参数，你可以在其中发送工具的 JSON 模式。^(5) 这允许 LLM 甚至 Agent 将其视为特殊元数据，并在必要时预先处理。\n\
    \n然而，在实践中，这些模式通常被当作“常规”提示来处理，并放入例如系统提示中：\n\n```\n# Tool JSON Schema put into the\
    \ system prompt\nsystem_prompt = \"\"\"\nYou are a bot that responds to mathematical\
    \ queries.\n \n# Tools\n \nYou may call one or more functions to assist with the\
    \ user query.\n \nYou are provided with function signatures within <tools></tools>\
    \ XML tags:\n \n<tools>\n{\"type\": \"function\", \"function\": {\"name\": \"\
    multiply\", \"description\": \"Multiply two numbers\", \"parameters\": {\"type\"\
    : \"object\", \"properties\": {\"a\": {\"type\": \"number\", \"description\":\
    \ \"First number\"}, \"b\": {\"type\": \"number\", \"description\": \"Second number\"\
    }}, \"required\": [\"a\", \"b\"]}}}\n</tools>\n \nFor each function call, return\
    \ a json object with function name and arguments within <tool_call></tool_call>\
    \ XML tags:\n \n<tool_call>\n{\"name\": <function-name>, \"arguments\": <args-json-object>}\n\
    </tool_call>\n \n\"\"\"\n```\n\n此示例使用 transformers 库来格式化系统提示。请注意，他们额外提供了如何识别工具何时被调用的说明：将调用放在\
    \ XML 标签（分别为 `<tool_call>` 和 `</tool_call>`）之间。\n\n尽管我们使用结构化的 JSON 模式进行通信，但 LLM\
    \ 仍然需要解释如何使用工具以及何时使用，这使得工具使用成为一项艰巨的任务。因此，模式描述得越详细、越清晰，LLM 就越有可能做出正确的工具调用决策。\n\n\
    此时，用户终于可以提问了。由于他们可以使用 `multiply` 函数，让我们保持查询简单：“5.1 乘以 7.3 等于多少？”。为了说明这将如何处理，我们使用了上一章探讨过的\
    \ `messages` 结构。这在图 5-6 中进行了可视化，其中系统提示包含我们工具的定义。\n\n![文字的特写，AI 生成的内容可能不正确。](img/ch05_figure_6_1760455020912031.png)\n\
    \n无论你是使用 JSON 模式还是描述工具，定义函数时都需要考虑以下几个最佳实践：\n\n- **为你的工具编写包含参数、函数名甚至示例的详尽文档**：这能让你的智能体更好地理解工具的能力。\n\
    - **尽量减少工具数量**：虽然拥有许多工具会扩展智能体的能力，但选择和调用合适的工具会变得更加困难。\n- **尽量缩小工具的范围**：参数众多的复杂工具难以使用，即使对个人来说也是如此，更不用说智能体了。\n\
    \n## 工具选择\n\n既然工具已经创建并定义完毕，我们就可以开始调用工具的过程。LLM 首先需要为给定的查询选择合适的工具，这可能是一项艰巨的任务。尤其是当潜在存在数十个复杂工具时，LLM\
    \ 不仅需要选择最合适的工具（如果有的话），还需要正确使用它。虽然我们可以为每个工具分享详尽的 JSON 模式，但 LLM 需要足够的能力才能真正遵循它。这正是推理型\
    \ LLM 的闪光之处。它们可以花费任意数量的 token 来“思考”使用哪些工具以及如何正确使用它们。图 5-7 展示了 LLM 决定使用哪个工具以及如何使用的推理过程。\n\
    \n![图表的示意图，AI 生成的内容可能不正确。](img/ch05_figure_7_1760455020912045.png)\n\n"

- raw: "The `]` token tells the LLM that the tool has been executed and that the tool\
    \ call, along with the output, is now part of the previously generated tokens.\
    \ Then, the LLM can decide to continue generating tokens if necessary. Figure\
    \ 5-19 demonstrates the end-to-end process of calling the tool, adding the output\
    \ during generation, and giving back an answer.\n\n![](assets/ch05_figure_19_1760455020912220.png)\n\
    \n###### \n\nThe input/output of this process is therefore as follows:\n\nInput\n\
    \n: \n\n“What is 5.1 times 7.3?”\n\nOutput\n\n: \n\n“5.1 \\* 7.3 is \\[Calculator(5.1\\\
    *7.3)→37.23\\] The answer is 37.23.”\n\nThis process of adding the output whilst\
    \ generating tokens is an important construct and is often used in various models.\
    \ By embedding the output during generation, the model uses tools more naturally\
    \ and generates fluent language. It also lends itself quite well for reasoning\
    \ LLMs, where tools are called during the reasoning process instead of having\
    \ to go back and forth between messages (remember Search-o1 from the previous\
    \ chapter?).\n\nTo enable this in-line tool calling behavior in Toolformer, the\
    \ model needs to be fine-tuned first. To do so, the authors carefully generated\
    \ a dataset with many different examples of tool use. For each tool, a few-shot\
    \ prompt was manually created and used to sample outputs. By sampling different\
    \ outputs (much like the sampling with Search against Verifiers we explored in\
    \ the reasoning chapter), the best output could be extracted by filtering on the\
    \ correctness of the tool use, output, and loss decrease. The full process of\
    \ creating this dataset is shown in Figure 5-20.\n\n![](assets/ch05_figure_20_1760455020912233.png)\n\
    \n###### \n\nIn other words, the original data was adjusted to include tool calls\
    \ instead of generating the answer by the LLM itself. All inputs were essentially\
    \ updated to contain the appropriate tool.\n\nFinally, the LLM (GPT-J, a variant\
    \ of GPT-3) was fine-tuned using this updated data using supervised fine-tuning.\
    \ At the time, this technique showed significant improvements over zero-shot performance\
    \ and competed with larger models. However, supervised fine-tuning on this data\
    \ made generalization difficult. Supervised fine-tuning tends to be sensitive\
    \ to the exact wording and prompt that is being used because it attempts to recreate\
    \ what it is being shown. As we will explore next, Reinforcement Learning tends\
    \ to be a much more stable technique for generalization in tool use.\n\n## Reinforcement\
    \ Learning\n\nAs we explored in Chapter 3, reinforcement learning is an excellent\
    \ method of training or fine-tuning to align your model to certain rewardable\
    \ tasks. Compared to supervised fine-tuning, where an LLM trains on fixed examples\
    \ with the correct answer, reinforcement learning relies on trial and error. In\
    \ reinforcement learning, LLMs develop improved reasoning strategies not from\
    \ being told exactly what to do (the mimicking behavior of supervised fine-tuning)\
    \ but from repeatedly exploring feedback signals.\n\nIn the context of reinforcement\
    \ learning, tool-learning is often integrated into the thinking process of models\
    \ that support advanced reasoning. This is called Tool-Integrated Reasoning (TIR),\
    \ which involves incorporating tools into the reasoning traces of an LLM. Figure\
    \ 5-21 illustrates this process of calling a tool *during* reasoning and continuing\
    \ the reasoning process after receiving the output.\n\n![](assets/ch05_figure_21_1760455020912246.png)\n\
    \n###### \n\nNote that such a TIR trajectory might involve multiple tool invocations,\
    \ where the final answer is determined by all these intermediate tool calls and\
    \ outputs.\n\nAlthough we will delve more deeply into reinforcement learning in\
    \ Chapter X, let’s explore how it can be used to enable tool learning and Tool-Integrated\
    \ Reasoning.\n\n## ToolRL\n\nA recent example showcasing how reinforcement learning\
    \ can be used to enable TIR is ToolRL.^([9](#ch02.html_id144)) This framework\
    \ uses GRPO, which we briefly covered in DeepSeek-R1’s training procedure in Chapter\
    \ 3. To differentiate between stages of thinking, tool calling, and answering\
    \ the query, they used the `<thinking></thinking>`, `<tool_call></tool_call>`,\
    \ and `<answer></answer>` tokens, respectively.\n\nCompared to DeepSeek-R1, their\
    \ usage of rewards in GRPO is quite straightforward. Two rewards are defined to\
    \ enable tool usage:\n\nCorrectness\n\n: \n\nIs a tool called correctly?\n\n*\
    \   Scores are given based on whether the correct tool names and parameters were\
    \ used.\n\nFormat\n\n: \n\nIs the appropriate format used?\n\n*   A positive reward\
    \ is given if all required fields appear in the correct order.\n\nTo train the\
    \ model, 4,000 samples of tool-integrated reasoning traces were sampled from various\
    \ datasets and used for fine-tuning various Qwen2.5 models^([10](#ch02.html_id145)).\
    \ Figure 5-22 illustrates how GRPO was used to fine-tune these models.\n\n![](assets/ch05_figure_22_1760455020912260.png)\n\
    \n###### \n\nInterestingly, the authors also experimented with length rewards\
    \ to encourage longer reasoning traces but found that longer traces do not consistently\
    \ improve task performance and may even harm smaller models. Long reasoning traces\
    \ might therefore not be ideal for tool use tasks.\n\nNote that GRPO is a very\
    \ flexible framework and allows you to develop the rewards that are best suited\
    \ for a given use case. As such, this strategy of using tool-based rewards in\
    \ GRPO can also be used for non-reasoning models by simply removing or updating\
    \ the format reward.\n\n## Search-R1\n\nTo further explore what reinforcement\
    \ learning is capable of, let’s take a closer look at Search-R1, an efficient\
    \ reinforcement learning framework for integrating search as a tool into an LLM’s\
    \ reasoning process.^([11](#ch02.html_id146)) In this framework, the LLM learns\
    \ to generate one or more search queries during step-by-step reasoning autonomously.\n\
    \nThe framework starts with specifying how the model should interleave reasoning\
    \ with the search engine call. As illustrated in Figure 5-23, the prompt template\
    \ is structured into three parts. First, the reasoning traces are created with\
    \ `<think></think>` tokens, then the search engine calling function with `<search></search>`\
    \ where the output is reintegrated with `<information></information>`, and finally,\
    \ the answer through `<answer></answer>` tokens. Note that the reasoning traces\
    \ and the search engine can be interleaved several times.\n\n![](assets/ch05_figure_23_1760455020912273.png)\n\
    \n###### \n\nWhat makes this template particularly interesting is that the authors\
    \ focus on a single tool, search. The reason for this was the upcoming popularity\
    \ of DeepResearch, a framework where reasoning LLMs are coupled with search engines\
    \ to create agentic systems that allow for in-depth research on various topics.\
    \ The authors of Search-R1 created this framework as a strong open-source alternative\
    \ to the proprietary systems out there.\n\nThe result of such a template is, like\
    \ ToolRL, tool-interleaved reasoning with multi-turn search engine calls. We illustrated\
    \ an example of such a process in Figure 5-24. Note that the `<search></search>`\
    \ tool can be any application, like the open***\\-***access archive of academic\
    \ papers arXiv, or a combination of various sources.\n\n![A screenshot of a chat\
    \ AI-generated content may be incorrect.](assets/ch05_figure_24_1760455020912287.png)\n\
    \n###### \n\nThe approach of training the algorithm with reinforcement learning\
    \ is rather straightforward. The authors adopted a simplified outcome-based reward\
    \ function. Rather than creating all different kinds of formatting and accuracy\
    \ rewards (like DeepSeek-R1), only accuracy rewards were used (based on the task).\
    \ Since the underlying model (Qwen-2.5) already has strong structural adherence,\
    \ there was no need for formatting rewards."

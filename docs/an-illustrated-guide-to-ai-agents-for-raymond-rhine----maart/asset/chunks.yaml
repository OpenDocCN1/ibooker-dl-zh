    # Agentic RAG with Reasoning


    By enabling RAG during reasoning, the model can iteratively refine its reasoning
    process until it is confident in the final result. This dynamic approach is different
    from regular agentic RAG because it can be done autonomously within a single call
    rather than iterating over calls.


    ## Reason-in-Documents


    A downside to simply embedding documents within the reasoning traces is that the
    retrieved documents can be quite large and often contain irrelevant information
    and may therefore disrupt the reasoning flow. To solve this issue, the authors
    extend the reasoning agentic RAG by incorporating a Reason-in-Documents module.
    Using the search query, retrieved documents, and reasoning trace, this module
    attempts to condense all information into focused reasoning steps. The agent’s
    same reasoning LLM is used to process the retrieved documents to align with the
    model’s specific reasoning traces.


    With regular agentic RAG, information is just passed to the context without taking
    into account *how* the information needs to be processed. By enabling the same
    reasoning LLM to further process that information such that it fits within the
    reasoning traces, the flow of the traces can be kept intact. An overview of this
    system, called Search-o1, is given in Figure 4-26.


    ![A diagram of a search engine AI-generated content may be incorrect.](assets/ch04_figure_26_1760455018636479.png)


    ## Iterative Retrieval


    Note that this is typically used for long-term memory or external semantic memory
    that the agent might need to answer a given query. For instance, when given the
    query “Why are flamingos pink?“, it will search for relevant information in Wikipedia
    during its reasoning process. The first result it finds mentions that it is due
    to specific pigments in their specific diet. It will use that information during
    its reasoning until it needs further clarification. For instance, a second call
    to a different external database (e.g., ArXiv) will clarify that the specific
    pigments are carotenoid pigments, which are commonly found in brine shrimp.


    This iterative process of querying information and compressing it within its reasoning
    process allows the model to reason about information when it is retrieved rather
    than stuffing all potential relevant information in the context.


    # Context Engineering


    ## Forms of Context


    We have explored various types of memory that we can use to provide additional
    context to the Agent, including semantic memory, working memory, and other forms
    of memory. However, there might be more forms of context that we could give to
    the Agent, like:


    - **System prompt**: The core context and rules for the agent, which define how
    it should behave (procedural memory).

    - **Conversation history**: Both the conversation between the user and assistant,
    but also the LLM’s internal thoughts (working memory).

    - **Past experiences**: Storing specific events, actions, or observations from
    tool use or user-related facts (episodic memory).

    - **Retrieved information**: External information that is typically stored in
    a vector database and accessed through RAG-like techniques (semantic memory).


    This is not an exhaustive list, however. As the fields of LLMs and Agents grow,
    so do the sources of information that we could give to them. As such, we can provide
    the Agent with all kinds of information sources to produce the answer that we
    want. As illustrated in Figure 4-27, the user’s query or prompt is a subset of
    the LLM’s entire context.


    ![](assets/ch04_figure_27_1760455018636492.png)


    ## Optimizing the Context


    This context is given to the LLM, which in turn produces a list of tokens. As
    such, we can view an LLM as a function that takes several tokens (context), processes
    them, and outputs tokens. To optimize the output tokens for a given task, we can
    either optimize the LLM itself by training or fine-tuning it, or we can optimize
    the input, namely the context (Figure 4-28).


    ![](assets/ch04_figure_28_1760455018636531.png)


    ## Defining Context Engineering


    To optimize the quality of the output (the output tokens), we can either optimize
    the LLM itself by training or fine-tuning it, or we can optimize what goes into
    the LLM, namely, the context. The act of optimizing input tokens so they produce
    the best possible output is called *context engineering*. Formally, it is finding
    the best context such that it maximizes the quality of the LLM’s output for a
    given task.^([8](#ch01.html_id123)) As illustrated in Figure 4-29, where prompt
    engineering involves optimizing the system/user prompts, context engineering aims
    to optimize the entire context.


    ![A diagram of a software program AI-generated content may be incorrect.](assets/ch04_figure_29_1760455018636557.png)


    ## Long-Context Benchmarks and Limitations


    Context windows have grown larger, to the point where Google’s Gemini 1.5 already
    reached a context window of a million tokens in February 2024.^([9](#ch01.html_id124))
    It would be natural to conclude that context engineering means attempting to fill
    up this humongous context window with all kinds of information that relates to
    the task at hand. Moreover, there would be no more need for RAG since the context
    window is large enough to potentially hold your entire database.


    A common benchmark for evaluating long-context LLMs in 2023 and the beginning
    of 2024 was the Needle In A Haystack (NIAH) test.^([10](#ch01.html_id125)) The
    test is rather straightforward; a random fact (needle) is placed somewhere in
    the middle of a long context window (haystack), and the model is asked to retrieve
    this statement. By iterating over different places and context lengths, we can
    measure how well LLMs perform over long contexts. It produced nicely looking visuals
    and was used by large LLM providers, like Anthropic’s Claude 2.1^([11](#ch01.html_id126))
    and Google’s Gemini 1.5^([12](#ch01.html_id127)).


    An example of such a visual is shown in Figure 4-30, which shows the results for
    a typical Needle In A Haystack test, where the upper right quadrant (needle at
    the top of the document and large context length) shows the degradation of LLMs
    at higher context lengths.


    ![A graph with different colored squares AI-generated content may be incorrect.](assets/ch04_figure_30_1760455018636579.png)


    However, finding the needle is merely a retrieval task and is not indicative of
    more complex forms of long-context understanding, such as reasoning over hundreds
    of thousands of tokens. This holds especially true for agents that have to take
    into account many forms and lengths of context, like semantic and working memory.


    Other benchmarks, like the RULER benchmark^([13](#ch01.html_id128)), have since
    been released that introduce new tasks like multi-hop tracing and aggregation
    to test behaviors beyond simple retrieval. The RULER paper, for instance, demonstrated
    models that performed well on the Needle In A Haystack test, all showed significant
    performance drops as the context length increased when applied to the RULER benchmark.
    Many others (e.g., ^([14](#ch01.html_id129)) and ^([15](#ch01.html_id130))) found
    similar results and concluded that arbitrarily filling up the context window of
    LLMs would hurt performance. Some even called it “context rot”^([16](#ch01.html_id131)),
    showcasing the importance of adding quality information. As such, there is a need
    to carefully construct and manage the model’s context window, thereby pointing
    to the importance of context engineering.


    ## Managing the Context Window


    Cost and latency are other reasons for managing the context window. You could
    theoretically stuff everything in a 2-million token context length, like your
    entire external database, the full conversation history, some additional examples,
    etc. However, the Agent’s LLM has to process all these tokens, which significantly
    reduces latency. Costs also increase, considering more VRAM is needed when you
    increase the context length. Just dumping everything in the context is, therefore,
    a recipe for failure.


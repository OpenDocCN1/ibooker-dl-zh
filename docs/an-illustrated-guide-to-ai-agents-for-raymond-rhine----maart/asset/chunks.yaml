- raw: "With context engineering, we aim to optimize the model’s context window with\
    \ the right information, at the right place, and in the right format. It is the\
    \ act of giving the LLM the appropriate context without overwhelming it. As such,\
    \ and as shown in Figure 4-31, it is not about filling up the context window,\
    \ but strategically choosing and placing information. Going back to our “LLM is\
    \ a function” analogy, it is about optimizing the list of input tokens so that\
    \ it produces the best possible output tokens.\n\n![](assets/ch04_figure_31_1760455018636596.png)\n\
    \n###### \n\nYou do not want too much or too irrelevant information as the costs\
    \ of compute go up and the performance goes down. Likewise, if you give the LLM\
    \ too little context and in an inefficient form, it will operate without having\
    \ a good understanding of the context. It is a careful balance of providing just\
    \ enough relevant information to the LLM to have it perform optimally. In other\
    \ words, context engineering is much of an architectural problem that needs to\
    \ be solved with lots of moving parts, like efficiently tracking, storing, and\
    \ retrieving all existing and created information.\n\nTo help with context engineering,\
    \ existing techniques for handling memory that focus on efficiency can be used.\
    \ MemoryBank, for instance, dynamically adjusts the importance of memories and\
    \ only keeps those that are truly important for the conversation history. Likewise,\
    \ Search-o1 compresses the retrieved context and only gives back the relevant\
    \ components without any noise. These dynamic memory techniques are exceptionally\
    \ useful for context engineering as the information flows grow more complex.\n\
    \n## What is inside the context?\n\nWe touched on it briefly before, but what\
    \ exactly is inside the context? Let’s illustrate a full context with an example\
    \ and make it as concrete as possible. Imagine you ask an agent to perform deep\
    \ research on reasoning LLMs and provide you with an overview of common techniques\
    \ that are used in the field. We are going to be using the `messages` format to\
    \ illustrate how the input to the LLM is continuously updated with the appropriate\
    \ context.\n\nBefore starting with the example, let’s explore the template for\
    \ the system prompt first:\n\n```\n# Creating the system prompt\nSYSTEM_PROMPT\
    \ = \"\"\"\nYou are a helpful research assistant. Your goal is to provide in-depth\
    \ analyses on complex AI-related topics.\n \n<INSTRUCTIONS>\n* Create a plan for\
    \ the user's query\n* Provide the necessary context\n* If you lack information,\
    \ you can ask clarifying questions to the user\n* Prioritize clarity of content.\n\
    * Make sure to use the current date to decide what is currently SOTA.\n</INSTRUCTIONS>\n\
    \ \n<TOOLS>\n{information_about_tools}\n</TOOLS>\n \n<DATE>\n{current_date}\n\
    </DATE>\n \n<USER_QUERY>\n{user_query}\n</USER_QUERY>\n \nBased on the provided\
    \ context, start making a plan to research this and check with the user for revisions.\n\
    \"\"\"\n \n```\n\nNote how the system prompt contains various XML tags to indicate\
    \ what kind of information they contain. However, information seems to be missing,\
    \ like the current data, information about tools, and the user’s query. Other\
    \ than the user’s query, this information needs to be first retrieved from an\
    \ external source. After doing so, the system prompt is generated with all kinds\
    \ of context and passed to the Agent’s LLM, which can be formatted as the following\
    \ message.\n\n```\n# 1. Create a plan\nmessages = [{\"role\": \"system\", \"content\"\
    : SYSTEM_PROMPT}]\n```\n\nThe LLM will generate a response with a short plan to\
    \ research reasoning LLMs for the user to validate. Note that we will discuss\
    \ planning and reflection in more detail in Chapter X. Let’s assume the interaction\
    \ goes as follows:\n\n```\n# 2. Reflect on the plan\nmessages = [\n  {\n    \"\
    role\": \"system\", \"content\": SYSTEM_PROMPT},\n  {\n    \"role\": \"assistant\"\
    , \n    \"content\": \"\"\"\nHere is my plan to research reasoning LLMs:\n* Query\
    \ the ArXiv database for the 10 most recent papers on reasoning LLMs\n* Summarize\
    \ the abstracts\n* Combine the summarizations for an overview\n\"\"\"\n  },\n\
    \  {\n    \"role\": \"user\", \"content\": \"Search for surveys instead.\"\n \
    \ }\n]\n \n```\n\nThe LLM suggested extracting the 10 most recent papers, which\
    \ the user found to be inefficient and asked to search for surveys instead. Now\
    \ that the Agent has executed its first task, namely creating a plan using its\
    \ LLM, this information can be stored externally so it can be retrieved later\
    \ on if necessary.\n\nThe plan is updated accordingly and kept in a special `PLAN.md`\
    \ file that the Agent can update if necessary. Before it goes on and searches\
    \ the ArXiv database, the current conversation history is cropped to only contain\
    \ the `SYSTEM_PROMPT` and `PLAN.md`. This cropping can be a step executed by the\
    \ Agent, but for the sake of simplicity, let’s assume that after the user provided\
    \ feedback, a simple script is always run that crops out this interaction. Thus,\
    \ we are left with:\n\n```\n# 3. Crop context\nmessages = [\n  {\"role\": \"system\"\
    , \"content\": SYSTEM_PROMPT},\n  {\"role\": \"assistant\", \"content\": PLAN.md},\n\
    ]\n \n \n```\n\nThe context is kept to a minimum because there is no need for\
    \ the LLM to see both the old and new plans.\n\nNext, the Agent uses a tool (`search_arxiv`)\
    \ to search for recent surveys on reasoning LLMs and extract the abstracts (`ABSTRACTS`).\n\
    \n```\n# 4. Search on ArXiv\nmessages = [\n  {\"role\": \"system\", \"content\"\
    : SYSTEM_PROMPT},\n  {\"role\": \"assistant\", \"content\": PLAN.md},\n  {\n \
    \   \"role\": \"assistant\", \"content\": \"<think>Let's search on ArXiv\"\n \
    \   \"tool_call\": {\n      \"name\": \"search_arxiv\",\n      \"arguments\":\
    \ { \"search_term\": \"reasoning LLMs survey\" }\n   },\n  {\n    \"role\": \"\
    tool\",\n    \"tool_call_id\": \"search_arxiv\",\n    \"content\": ABSTRACTS\n\
    \  },\n]\n \n```\n\nAfter the Agent has retrieved the abstracts, it decides to\
    \ use another Agent to summarize the results.\n\n```\n# 5. Call the summarization\
    \ agent with the abstracts\nmessages = [\n  {\"role\": \"system\", \"content\"\
    : SYSTEM_PROMPT},\n  {\"role\": \"assistant\", \"content\": PLAN.md},\n  {\n \
    \   \"role\": \"assistant\", \"content\": \"<think>Let's search on ArXiv\"\n \
    \   \"tool_call\": {\n      \"name\": \"search_arxiv\",\n      \"arguments\":\
    \ { \"search_term\": \"reasoning LLMs survey\" }\n   },\n  {\n    \"role\": \"\
    tool\",\n    \"tool_call_id\": \"search_arxiv\",\n    \"content\": ABSTRACTS\n\
    \  },\n  {\n    \"role\": \"tool\",\n    \"tool_call_id\": \"run_summarization_agent\"\
    ,\n    \"content\": ABSTRACTS\n  },\n]\n```\n\nThe summarization agent only needs\
    \ to summarize the papers, so no other context is needed other than those papers\
    \ to generate the summaries (`SUMMARIES`). As such, the messages of the summary\
    \ agent that is created by `run_summarization_agent` could look like this:\n\n\
    ```\n# 5a. Run the summarization agent\nmessages_summary_agent = [\n  {\"role\"\
    : \"system\", \"content\": \"You are a summarization expert.\"},\n  {\"role\"\
    : \"user\", \"content\": \"Summarize these papers: PAPERS\"},\n]\n```\n\nThe resulting\
    \ summaries (`SUMMARIES`) are passed back to the original Agent to parse and create\
    \ a nice overview for the user.\n\n```\n# 6. Process summaries with the orchestrator\
    \ (the original agent)\nmessages = [\n  {\"role\": \"system\", \"content\": SYSTEM_PROMPT},\n\
    \  {\"role\": \"assistant\", \"content\": UPDATED_PLAN},\n  {\"role\": \"assistant\"\
    , \"content\": \"I retrieved these summaries: SUMMARIES.\"},\n  {\"role\": \"\
    assistant\", \"content\": \"<think>Next, parsing summaries.</think>\"},\n]\n```\n\
    \nNote how this final messages variable contains a small part of the conversation\
    \ history. Only the most relevant pieces of information are kept, and any irrelevant\
    \ traces (like the full traces of the summarization agent) are not added to the\
    \ context. During the entire process, the context is carefully managed by either\
    \ the Agent itself or through external software."
  fmt: "\nWith context engineering, we aim to optimize the model’s context window\
    \ with the right information, at the right place, and in the right format. It\
    \ is the act of giving the LLM the appropriate context without overwhelming it.\
    \ As such, and as shown in Figure 4-31, it is not about filling up the context\
    \ window, but strategically choosing and placing information. Going back to our\
    \ “LLM is a function” analogy, it is about optimizing the list of input tokens\
    \ so that it produces the best possible output tokens.\n\n![](assets/ch04_figure_31_1760455018636596.png)\n\
    \nYou do not want too much or too irrelevant information as the costs of compute\
    \ go up and the performance goes down. Likewise, if you give the LLM too little\
    \ context and in an inefficient form, it will operate without having a good understanding\
    \ of the context. It is a careful balance of providing just enough relevant information\
    \ to the LLM to have it perform optimally. In other words, context engineering\
    \ is much of an architectural problem that needs to be solved with lots of moving\
    \ parts, like efficiently tracking, storing, and retrieving all existing and created\
    \ information.\n\nTo help with context engineering, existing techniques for handling\
    \ memory that focus on efficiency can be used. MemoryBank, for instance, dynamically\
    \ adjusts the importance of memories and only keeps those that are truly important\
    \ for the conversation history. Likewise, Search-o1 compresses the retrieved context\
    \ and only gives back the relevant components without any noise. These dynamic\
    \ memory techniques are exceptionally useful for context engineering as the information\
    \ flows grow more complex.\n\n## What is inside the context?\n\nWe touched on\
    \ it briefly before, but what exactly is inside the context? Let’s illustrate\
    \ a full context with an example and make it as concrete as possible. Imagine\
    \ you ask an agent to perform deep research on reasoning LLMs and provide you\
    \ with an overview of common techniques that are used in the field. We are going\
    \ to be using the `messages` format to illustrate how the input to the LLM is\
    \ continuously updated with the appropriate context.\n\nBefore starting with the\
    \ example, let’s explore the template for the system prompt first:\n\n```\n# Creating\
    \ the system prompt\nSYSTEM_PROMPT = \"\"\"\nYou are a helpful research assistant.\
    \ Your goal is to provide in-depth analyses on complex AI-related topics.\n \n\
    <INSTRUCTIONS>\n* Create a plan for the user's query\n* Provide the necessary\
    \ context\n* If you lack information, you can ask clarifying questions to the\
    \ user\n* Prioritize clarity of content.\n* Make sure to use the current date\
    \ to decide what is currently SOTA.\n</INSTRUCTIONS>\n \n<TOOLS>\n{information_about_tools}\n\
    </TOOLS>\n \n<DATE>\n{current_date}\n</DATE>\n \n<USER_QUERY>\n{user_query}\n\
    </USER_QUERY>\n \nBased on the provided context, start making a plan to research\
    \ this and check with the user for revisions.\n\"\"\"\n \n```\n\nNote how the\
    \ system prompt contains various XML tags to indicate what kind of information\
    \ they contain. However, information seems to be missing, like the current data,\
    \ information about tools, and the user’s query. Other than the user’s query,\
    \ this information needs to be first retrieved from an external source. After\
    \ doing so, the system prompt is generated with all kinds of context and passed\
    \ to the Agent’s LLM, which can be formatted as the following message.\n\n```\n\
    # 1. Create a plan\nmessages = [{\"role\": \"system\", \"content\": SYSTEM_PROMPT}]\n\
    ```\n\nThe LLM will generate a response with a short plan to research reasoning\
    \ LLMs for the user to validate. Note that we will discuss planning and reflection\
    \ in more detail in Chapter X. Let’s assume the interaction goes as follows:\n\
    \n```\n# 2. Reflect on the plan\nmessages = [\n  {\n    \"role\": \"system\",\
    \ \"content\": SYSTEM_PROMPT},\n  {\n    \"role\": \"assistant\", \n    \"content\"\
    : \"\"\"\nHere is my plan to research reasoning LLMs:\n* Query the ArXiv database\
    \ for the 10 most recent papers on reasoning LLMs\n* Summarize the abstracts\n\
    * Combine the summarizations for an overview\n\"\"\"\n  },\n  {\n    \"role\"\
    : \"user\", \"content\": \"Search for surveys instead.\"\n  }\n]\n \n```\n\nThe\
    \ LLM suggested extracting the 10 most recent papers, which the user found to\
    \ be inefficient and asked to search for surveys instead. Now that the Agent has\
    \ executed its first task, namely creating a plan using its LLM, this information\
    \ can be stored externally so it can be retrieved later on if necessary.\n\nThe\
    \ plan is updated accordingly and kept in a special `PLAN.md` file that the Agent\
    \ can update if necessary. Before it goes on and searches the ArXiv database,\
    \ the current conversation history is cropped to only contain the `SYSTEM_PROMPT`\
    \ and `PLAN.md`. This cropping can be a step executed by the Agent, but for the\
    \ sake of simplicity, let’s assume that after the user provided feedback, a simple\
    \ script is always run that crops out this interaction. Thus, we are left with:\n\
    \n```\n# 3. Crop context\nmessages = [\n  {\"role\": \"system\", \"content\":\
    \ SYSTEM_PROMPT},\n  {\"role\": \"assistant\", \"content\": PLAN.md},\n]\n \n\
    \ \n```\n\nThe context is kept to a minimum because there is no need for the LLM\
    \ to see both the old and new plans.\n\nNext, the Agent uses a tool (`search_arxiv`)\
    \ to search for recent surveys on reasoning LLMs and extract the abstracts (`ABSTRACTS`).\n\
    \n```\n# 4. Search on ArXiv\nmessages = [\n  {\"role\": \"system\", \"content\"\
    : SYSTEM_PROMPT},\n  {\"role\": \"assistant\", \"content\": PLAN.md},\n  {\n \
    \   \"role\": \"assistant\", \"content\": \"\"},\n]\n```\n\nNote how this final\
    \ `messages` variable contains a small part of the conversation history. Only\
    \ the most relevant pieces of information are kept, and any irrelevant traces\
    \ (like the full traces of the summarization agent) are not added to the context.\
    \ During the entire process, the context is carefully managed by either the Agent\
    \ itself or through external software.\n"
  trans: "\n\n通过上下文工程，我们的目标是以正确的信息、在正确的位置、以正确的格式来优化模型的上下文窗口。它是在不给 LLM 带来过重负担的前提下，为其提供适当上下文的行为。因此，如图\
    \ 4-31 所示，关键不在于填满上下文窗口，而在于策略性地选择和放置信息。回到我们“LLM 是一个函数”的类比，这实际上是在优化输入词元列表，以便生成尽可能优质的输出词元。\n\
    \n![](img/ch04_figure_31_1760455018636596.png)\n\n你不希望信息过多或过于无关，因为计算成本会上升，性能会下降。同样，如果你给\
    \ LLM 的上下文过少，且形式低效，它就会在对上下文缺乏充分理解的情况下运行。这是一个需要精心平衡的过程：为 LLM 提供恰到好处的相关信息，使其达到最优性能。换句话说，上下文工程在很大程度上是一个架构问题，需要通过大量相互关联的环节来解决，比如高效地跟踪、存储和检索所有已有及新建的信息。\n\
    \n为了辅助上下文工程，可以运用现有的注重效率的记忆处理技术。例如，MemoryBank 会动态调整记忆的重要性，只保留那些对对话历史真正重要的内容。同样，Search-o1\
    \ 会对检索到的上下文进行压缩，只返回相关部分，不带任何噪声。随着信息流变得越来越复杂，这些动态记忆技术对上下文工程尤其有用。\n\n## 上下文中包含什么？\n\
    \n我们之前简要提到过，但上下文中究竟包含什么呢？让我们用一个示例来说明完整的上下文，并尽可能具体化。假设你让一个智能体对推理型 LLM 进行深度研究，并要求它向你概述该领域常用的技术。我们将使用\
    \ `messages` 格式来展示 LLM 的输入是如何随适当上下文持续更新的。\n\n在开始示例之前，先来看一下系统提示词的模板：\n\n```\n#\
    \ Creating the system prompt\nSYSTEM_PROMPT = \"\"\"\nYou are a helpful research\
    \ assistant. Your goal is to provide in-depth analyses on complex AI-related topics.\n\
    \ \n<INSTRUCTIONS>\n* Create a plan for the user's query\n* Provide the necessary\
    \ context\n* If you lack information, you can ask clarifying questions to the\
    \ user\n* Prioritize clarity of content.\n* Make sure to use the current date\
    \ to decide what is currently SOTA.\n</INSTRUCTIONS>\n \n<TOOLS>\n{information_about_tools}\n\
    </TOOLS>\n \n<DATE>\n{current_date}\n</DATE>\n \n<USER_QUERY>\n{user_query}\n\
    </USER_QUERY>\n \nBased on the provided context, start making a plan to research\
    \ this and check with the user for revisions.\n\"\"\"\n \n```\n\n请注意，系统提示词中包含各种\
    \ XML 标签，用以标示所含信息的类型。但其中似乎缺少一些信息，比如当前日期、工具信息以及用户查询。除用户查询外，这些信息都需要先从外部来源获取。获取之后，系统提示词便会在各种上下文的加持下生成，并传递给智能体的\
    \ LLM，其格式可以是下面的消息。\n\n```\n# 1. Create a plan\nmessages = [{\"role\": \"system\"\
    , \"content\": SYSTEM_PROMPT}]\n```\n\nLLM 将生成一个简短的研究计划作为回应，用于研究推理型 LLM，供用户验证。请注意，我们将在第\
    \ X 章更详细地讨论规划与反思。我们假设交互过程如下：\n\n```\n# 2. Reflect on the plan\nmessages = [\n\
    \  {\n    \"role\": \"system\", \"content\": SYSTEM_PROMPT},\n  {\n    \"role\"\
    : \"assistant\", \n    \"content\": \"\"\"\nHere is my plan to research reasoning\
    \ LLMs:\n* Query the ArXiv database for the 10 most recent papers on reasoning\
    \ LLMs\n* Summarize the abstracts\n* Combine the summarizations for an overview\n\
    \"\"\"\n  },\n  {\n    \"role\": \"user\", \"content\": \"Search for surveys instead.\"\
    \n  }\n]\n \n```\n\nLLM 建议提取 10 篇最新论文，但用户认为这种方式效率不高，要求改为搜索综述。既然智能体已经执行了它的第一项任务，即利用其\
    \ LLM 制定计划，这些信息就可以存储在外部，以便日后必要时重新取用。\n\n计划会相应更新，并保存在一个专用的 `PLAN.md` 文件中，智能体在必要时可对其进行更新。在继续搜索\
    \ ArXiv 数据库之前，当前对话历史会被裁剪，只保留 `SYSTEM_PROMPT` 和 `PLAN.md`。这种裁剪可以由智能体自己执行，但为了简单起见，我们假设在用户给出反馈后，总会运行一个简单脚本来裁剪掉这段交互。于是，我们得到：\n\
    \n```\n# 3. Crop context\nmessages = [\n  {\"role\": \"system\", \"content\":\
    \ SYSTEM_PROMPT},\n  {\"role\": \"assistant\", \"content\": PLAN.md},\n]\n \n\
    \ \n```\n\n上下文被保持在最小范围，因为 LLM 没有必要同时看到新旧两份计划。\n\n接下来，智能体使用一个工具（`search_arxiv`）搜索关于推理型\
    \ LLM 的最新综述，并提取摘要（`ABSTRACTS`）。\n\n```\n# 4. Search on ArXiv\nmessages = [\n \
    \ {\"role\": \"system\", \"content\": SYSTEM_PROMPT},\n  {\"role\": \"assistant\"\
    , \"content\": PLAN.md},\n  {\n    \"role\": \"assistant\", \"content\": \"\"\
    },\n]\n```\n\n请注意，这个最终的 `messages` 变量只包含一小部分对话历史。只有最相关的信息会被保留，任何无关的痕迹（比如摘要生成代理的完整痕迹）都不会被加入上下文。在整个过程中，上下文都受到精心管理，要么由智能体自身完成，要么通过外部软件实现。\n\
    \n"

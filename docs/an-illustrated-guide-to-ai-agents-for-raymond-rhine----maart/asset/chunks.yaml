- raw: "Note that discovering the tools that exist or might be relevant becomes more\
    \ important when the number of tools increases. As we discussed in the previous\
    \ chapter, even when you have a large context window, filling it up to the brim\
    \ with tool JSON schemas is bound to decrease the LLM’s performance. As with context\
    \ engineering, the process of discovering tools might be helped with methodologies\
    \ like RAG, where you store all tool schemas in a separate database for the LLM\
    \ to discover. Illustrated in Figure 5-8 is this idea of using a vector database\
    \ to discover which tools are most relevant to a user’s query.\n\n![](assets/ch05_figure_8_1760455020912059.png)\n\
    \n###### \n\nNote that the planning capabilities of LLMs are vital to having a\
    \ good selection. For simple queries, like “What is 1+1?”, the selection of tools\
    \ is not going to be a challenge. However, when planning a vacation, a multi-step\
    \ process is going to be needed where the agent first needs to plan out its behavior.\
    \ This planning (and reflection) behavior is going to be discussed in the next\
    \ chapter in more detail.\n\n## Tool Calling\n\nNext, when the LLM ends its thinking\
    \ process, it can start creating the tool call. It will output a string, and if\
    \ the LLM is capable enough, correctly format the tool call with the given arguments.\
    \ This is illustrated in Figure 5-9 with the system prompt that we defined in\
    \ the “Tool Definition” section. Note that this is a correctly formatted answer\
    \ with the `<tool_call>` and `</tool_call>` tags together with the arguments and\
    \ function call that can be parsed as JSON.\n\n![](assets/ch05_figure_9_1760455020912083.png)\n\
    \n###### \n\nHowever, this answer is merely a string and will not execute the\
    \ tool. In fact, you can view this output as merely the intention of the LLM to\
    \ call a tool. Without any help from the user or additional software, nothing\
    \ will happen. We will have to write a small piece of code that will extract the\
    \ JSON call and execute it.\n\nFor this, we use regex (`re`) to extract the tool\
    \ call from within its `<tool_call>` tags, convert it to JSON, and finally call\
    \ it using our `tools` dictionary:\n\n```\nimport re\n \n# LLM's output\noutput\
    \ = \"\"\"\n<tool_call>\n{\"name\": \"multiply\", \"arguments\": {\"a\": 5.1,\
    \ \"b\": 7.3}}\n</tool_call>\n\"\"\"\n \n# Get tool call\nmatch = re.search(r\"\
    <tool_call>\\s*(\\{.*?\\})\\s*</tool_call>\", output, re.DOTALL)\ntool_call =\
    \ json.loads(match.group(1))\n \n# Calling the tool\nname = tool_call[\"name\"\
    ]\narguments = tool_call[\"arguments\"]\ntool_output = tools[name](**arguments)\n\
    ```\n\nNote that all we have to do is extract the name and arguments from the\
    \ JSON generated by the LLM. Then, we can call the tool with `tools[name](**arguments)`\
    \ and generate our output (`tool_output`). This means that actually calling the\
    \ tool is not executed by the LLM but by a system that we created. You can fully\
    \ automate this process by wrapping it in a function that automatically extracts\
    \ the JSON and then subsequently calls the tool.\n\n## Tool Output Processing\n\
    \nWe still need to do something with the output of the tool call. In our example,\
    \ the LLM ends with a tool call, which we process and call ourselves. To feed\
    \ the output back into the LLM, we can use the `messages` structure that we explored\
    \ in the previous chapter. Specifically, we can add messages with two roles:\n\
    \n*   `assistant` — The assistant calls the multiply tool.\n\n*   `tool` - The\
    \ output of the tool is returned.\n\nBy updating the messages to include this\
    \ additional information, we are essentially informing the LLM that these steps\
    \ were taken. Calling the tool was done outside of the LLM’s view, and it therefore\
    \ has no knowledge of what actually happened. As such, we pretend as if the LLM\
    \ executed the tool whilst that was actually done by the user or an automated\
    \ system. These updated messages are illustrated in Figure 5-10.\n\n![](assets/ch05_figure_10_1760455020912097.png)\n\
    \n###### \n\nFinally, we can feed these messages back into the LLM to create our\
    \ final answer. Although the tool has given us the appropriate output, the LLM\
    \ might want to combine answers or present them in a nicer way. This process,\
    \ along with the updated output, is presented in Figure 5-11.\n\n![](assets/ch05_figure_11_1760455020912112.png)\n\
    \n###### \n\nWith the many steps an LLM has to correctly follow to call the appropriate\
    \ tool, it requires the LLM to be an effective orchestrator, which is very dependent\
    \ upon the model’s reasoning capabilities and overall reliability.\n\n# Tool Learning\n\
    \nInstilling tool-calling capabilities into LLMs can be a difficult task, especially\
    \ when it has not been trained to do so. Learning tools can be achieved through\
    \ various methodologies. In this section, we will explore the three most common\
    \ categories of tool learning, namely in-context learning, supervised fine-tuning,\
    \ and reinforcement learning.\n\n## In-context Learning\n\n*In-context learning*,\
    \ the ability of LLMs to learn from a few examples in their context^([6](#ch02.html_id141)),\
    \ is an exceptionally useful technique to enable new behavior in LLMs without\
    \ the need to fine-tune them. As we covered in Chapter 3, it is also known as\
    \ *few-shot prompting* or *few-shot learning*, where you provide several examples\
    \ to the LLM to learn from. Specifically, it is a prompt engineering technique\
    \ where you give some examples of the behavior that you want the LLM to repeat.\
    \ In our case, and as illustrated in Figure 5-12, we want the LLM to output the\
    \ tool call in a specific format by following the examples we created ourselves.\n\
    \n![](assets/ch05_figure_12_1760455020912126.png)\n\n###### \n\nIn-context learning\
    \ is especially helpful when leveraging the `messages` structure that we explored\
    \ before. Remember when we pretended the assistant called a tool by adding it\
    \ to the messages? We can apply the same concept and act as if the model were\
    \ called tools before. As shown in Figure 5-13, we can create our messages in\
    \ such a way that the model thinks it has already used some of the tools before.\
    \ So when it subsequently gets a query, it has examples of how the tools should\
    \ be called and what kinds of output can be expected.\n\n![A screenshot of a computer\
    \ program AI-generated content may be incorrect.](assets/ch05_figure_13_1760455020912140.png)\n\
    \n###### \n\nSince LLMs are great at pattern recognition, providing these example\
    \ tool calls helps them follow the structure of the tool call we had in mind.\
    \ Note that in-context learning improves as the LLM becomes more capable. More\
    \ performant models tend to better follow instructions and examples.\n\n### HuggingGPT\n\
    \nA great example of how far you can get by using in-context learning is HuggingGPT,\
    \ an agentic framework that uses an LLM orchestrator to decide which tools are\
    \ used to solve a given problem.^([7](#ch02.html_id142)) Interestingly, the tools\
    \ are actually models themselves on the HuggingFace platform. The underlying idea\
    \ is that the LLM could act as an orchestrator to manage existing AI models on\
    \ the HuggingFace Hub to solve whatever problem it encounters.\n\nTheir pipeline\
    \ revolves around proper prompt engineering and in-context learning to enable\
    \ this orchestrator framework. It consists of four steps:\n\nTask Planning\n\n\
    : \n\nExtract the intention of the user’s query and decompose it into solvable\
    \ tasks\n\nModel Selection\n\n: \n\nFrom the extracted tasks, select the appropriate\
    \ model from HuggingFace’s model hub\n\nTask Execution\n\n: \n\nCall the selected\
    \ models as tools.\n\nResponse Generation\n\n: \n\nIntegrate the output of tools\
    \ and generate a response\n\nThese steps are visualized in Figure 5-14.\n\n![A\
    \ diagram of a user flow AI-generated content may be incorrect.](assets/ch05_figure_14_1760455020912153.png)\n\
    \n###### \n\n#### Task Planning"

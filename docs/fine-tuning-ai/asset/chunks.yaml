    If, instead of full fine-tuning, you were to do a LoRA at FP16, it would look
    like Table 3-2:


    | Component || Memory (approximate) |


    | --- | --- |


    | Model Weights (FP16) || 14Gb |


    | --- | --- |


    | LoRA Adapter Weights || 0.14Gb |


    | Gradients (FP16) || 0.14Gb |


    | Optimizer States (FP32) || 0.56Gb |


    | Activations || 2Gb |


    | Total || 17Gb |


    Now we’re in the territory of a consumer grade GPU, like an RTX 4090 with 24Gb
    of VRAM, which costs about 1/10th of the A100.


    Finally, if we look at QLoRA (we’ll explore it in detail in Chapter X), we can
    see that it gets even smaller (Table 3-3):


    | Component || Memory (approximate) |


    | --- | --- |


    | Model Weights (4-Bit Quantized) || 3.5Gb |


    | --- | --- |


    | LoRA Adapter Weights || 0.14Gb |


    | Gradients (FP16) || 0.14Gb |


    | Optimizer States (FP32) || 0.56Gb |


    | Activations || 2Gb |


    | Total || 7Gb |


    This will fit in only 8Gb of VRAM. GPUs with 8Gb of will typically cost 1/10th
    of a 24GB Variant like the RTX 4090 mentioned above. I’ve seen them in stores
    for $100-$200. Much more manageable, and also available on the free tier of Google
    Colab—with the T4 GPU that has 16Gb VRAM.


    This was just for a 7B model. Use Table 3-4 to explore what you would need for
    other common sizes:


    | Size || Full FT (FP16) || LoRA (FP16) || QLoRA(4-bit) |


    | --- | --- | --- | --- |


    | 3B || ~36Gb (A100 40Gb) || ~8 Gb (RTX 3060) || ~4Gb (RTX 3060) |


    | --- | --- | --- | --- |


    | 7B || ~86Gb (A100 80Gb) || ~17Gb (RTX 4090) || ~7Gb (T4/ RTX 4070) |


    | 13B || ~160Gb (multi GPU) || ~ 32Gb (A100 40Gb) || ~12Gb (RTX 4080) |


    | 70B || ~800Gb (multi node) || ~160Gb (multi GPU) || ~40Gb (A100 40Gb) |


    Here’s a comparison of each of these (Table 3-5):


    | Component || FP16 Full Tune || LoRA (1% Rank) || QLoRA (4-bit) |


    | --- | --- | --- | --- |


    | Model weights || 14 GB || 14 GB || 3.5 GB |


    | --- | --- | --- | --- |


    | Gradients || 14 GB || 0.14 GB || 0.14 GB |


    | Optimizer states || 56 GB || 0.56 GB || 0.56 GB |


    | Total (approx) || 84+ GB || ~17 GB || ~7 GB |


    The takeaway: to get started on fine tuning without taking on excessive GPU expense,
    work with LoRA or QLora. It’s a sweet spot, it’s highly effective, and it’s accessible
    on consumer hardware!


    ## Understanding GPUs


    In the previous section, I noted a lot about GPUs with names like RTX, A100, and
    so on. If you aren’t familiar with them, don’t worry! But let’s take a quick look
    at the variety of GPUs that are out there, and which ones to consider.


    ### Consumer GPUs


    I’ll define consumer grade GPUs as ones that are readily available to purchase
    in retail, and which use standard card interfaces in PCs to use. The flagship
    of these at time of writing is the NVIDIA RTX 4090 with 24Gb of VRAM. Their MSRP
    is about $1400, but they can often be found on secondary markets selling for much
    more because of rarity! With one of these LoRA or QLoRA on 7B models is a snap.
    And while it’s a lot of money, consider that it’s more powerful than the data
    center dedicated GPUs of just a few years ago. Failing that, the previous generation
    RTX 3090, with 24Gb is also perfectly serviceable, and usually can be found at
    a significant discount. Ultimately, the amount of VRAM is the better indicator
    for you of performance. While 40x0 class machines have better performance metrics,
    if they don’t have 24Gb, you’ll be limited.


    AMD also provide excellent devices that are unlocked by the ROCm platform. The
    Radeon RX 7900 XTX has 24Gb VRam and competitive specs to the RTX 4090 generally
    available at a steep discount from its NVidia counterpart. However, the fine tuning
    ecosystem for AMD-based chips isn’t as mature as for NVidia. Technologies like
    Flash Attention, bitsandbytes, and parts of the Hugging Face stack were built
    to be NVidia first. This puts you at a significant disadvantage.


    If you’re on a Mac with *Apple Silicon* (M-series chips), you have an interesting
    option that’s worth understanding. Apple’s unified memory architecture means the
    GPU and CPU share the same RAM, so the need for dedicated VRAM on other systems
    goes away. This is ultimately because the CPU and the GPU are the same chip—as
    opposed to the GPU being on a card that’s plugged into the motherboard.


    When a framework reports available “VRAM,” it’s reporting your system RAM—and
    that can be substantial. An M4 Max with 128 GB of unified memory technically has
    more “VRAM” than an A100.


    The catch is throughput. Apple’s GPU cores are very capable but not as numerous
    or as fast for matrix operations as NVIDIA’s data center GPUs. A training run
    that takes 1 hour on an A100 might take 4-6 hours on an M4 Max. The memory is
    there, but the compute takes longer to chew through it. And, similar to working
    with any other non-Nvidia chip, the ecosystem that has grown around NVidia is
    a significant moat, so you may have compatibility issues.


    ### Data center GPUs


    The NVIDIA A100 is the industry standard for many AI workloads, including fine-tuning.


    It’s not often clear when using it in hosted environments like Google Colab, but
    it comes in 40 GB and 80 GB variants, with the 80 GB version being the more common
    offering on cloud platforms, but you should check before use if you need more
    than 40GB before you pay for it!


    An A100 can handle LoRA on 70B models and full fine-tuning on models up to about
    7B. Its memory bandwidth (2 TB/s on the 80 GB version) means it doesn’t just have
    more VRAM—it moves data through the GPU faster, which translates to much shorter
    training times.


    The NVIDIA H100 is the current flagship. I don’t know why they choose these names,
    with the ‘A’ looking very similar to the ‘H’ in many fonts. So be sure when you’re
    selecting which one you’re getting! It’s faster than the A100 in every dimension—more
    memory bandwidth, better tensor core performance, support for FP8 precision—and
    cloud providers charge a premium for it. For most fine-tuning workloads covered
    in this book, an A100 is more than sufficient, and the cost savings are meaningful.


    Newer options like the NVIDIA L4 (24 GB) and L40S (48 GB) are showing up on cloud
    platforms as cost-effective mid-tier options. The L4 in particular is positioned
    as a fine-tuning and inference GPU, and its pricing on platforms like Google Cloud
    makes it attractive for sustained workloads.


    Indeed, when you look at Google Colab, you can see the GPUs available for you
    to use. Please note that this list can change over time—and the ones available
    at time of writing are shown in [Figure 3-1](#ch03.html_ch03_figure_1_1772730612412203).


    ![A screenshot of a computer program AI-generated content may be incorrect.](assets/ch03_figure_1_1772730612412203.png)


    ###### Figure 3-1. Data Center GPUs in Google Colab


    As you can see, the H100 and the A100 are available, as are L4 and T4. There’s
    also a switch for ‘High-RAM,’ where for machines like the A100 that have different
    VRAM configurations you can switch between the two.


    Once you start an instance, there’s a small ‘RAM/DISK’ button at the top right,
    and selecting that will give you your current machine specs ([Figure 3-2](#ch03.html_ch03_figure_2_1772730612412233)).


    ![A screenshot of a computer AI-generated content may be incorrect.](assets/ch03_figure_2_1772730612412233.png)


    ###### Figure 3-2. System Specs for a T4 High Ram


    In this case I selected a T4 with High Ram, and you can see that the GPU VRam
    available is 15.0Gb. Good for LoRA or QLora on smaller models, but not much else.
    Still—it’s cheap, at 1.41 units per hour, where 100 units cost me $10, so about
    14 cents per hour to use. This is a great alternative to paying hundreds, or thousands
    for your own GPU that would take many hours before it pays for itself!


    ### Distributed training with multiple GPUs'

- raw: '1.  *Understand the user’s intent*. For example, if the agent is designed
    to help with restaurant selection, and the user says they would like to eat *okonomiyaki*,
    the agent will be smart enough to understand that this is a branch of Japanese
    cuisine. The user doesn’t need to specify this.


    2.  *Make a plan* *using available tools.* If the agent knows that its tools are
    Google Search, Map Search, and Browse websites, it can make a plan to search for
    Japanese restaurants near the current location. For each of these, it can then
    browse their web sites to find their menus. It can then search the menus for *okonomiyaki*.


    3.  *Execute the plan using the tools.* It then follows the plan, using LLMs as
    appropriate—for example, generating code to call the Map Search APIs, or parsing
    downloaded HTML to find the desired dish


    4.  *Reflect on the results.* After it’s done all this, it should then match its
    results with the user’s requirements. Did it find restaurants serving this dish?
    Or just generic Japanese ones. Stuff like that. If it did, great, it can move
    onto step 5—the solution. Otherwise, it’ll have to go back to steps 1 and 2.


    5.  *The Solution*. Present the solution to the user, and possibly flow to other
    agents, such as one that can handle making a reservation at the desired restaurant!


    This workflow, with a dedicated chain of thought, is the simplest DNA of an agent.
    But when it comes to token usage, you can see that it can use significantly more
    tokens than a simple prompt->result like you saw in the earlier section. That
    $1000 a day that we speculated about earlier will more likely be close to $5000
    a day when using an agentic workflow like this.


    No wonder companies are investing billions of dollars in data centers!


    ### Another hidden cost: The instruction tax


    There’s also a more subtle inefficiency here. The Generalist model doesn’t understand
    anything about your specific task until you tell it. To make it useful, you have
    to paste your rules, formatting guides, and how to handle edge cases into the
    System Prompt on *every single request*!


    “You are an expert at understanding a variety of dishes and where to find them.
    Understand the user’s request, and map it to one or more popular cuisines. If
    there isn’t a direct match, find other restaurant types that might serve this
    dish. Output your results as JSON structured in this way {...}”


    You’re paying to send this instruction manual, and all of its tokens, to the server
    over and over again. It’s extremely wasteful.


    And, Context Window Pollution is something to consider. Research has shown that
    as you stuff the context window with instructions, the model’s performance will
    degrade (the ‘Lost in the Middle’ phenomenon). I’ve seen so many examples where
    strict instructions (usually in ALL CAPS for emphasis) have to be entered to get
    the model to pay attention to a particular part of the prompt. And this, of course,
    consumes more tokens.


    Fine-tuning moves these instructions from the Context Window (which you pay for)
    into the Model Weights (which are permanent). The model doesn’t need to be told
    how to behave, it’s already baked in.


    # The Latency Killer


    Costs are a business problem. Latency is a user experience problem. And if your
    users have a poor experience, they won’t pay the costs!


    Consider a massive Foundation Model with hundreds of billions of parameters. The
    physics of inference on this model is inescapable. Even with state of the art
    GPUs, moving terabytes of weights through memory takes time and power. An important
    metric: Time to First Token (TTFT) can sit anywhere from 500ms to several seconds.
    The next metric, Tokens Per Second (TPS), then measures how frequently tokens
    appear after the first one.


    Think of this as you build a chatbot. If it takes 500ms to produce the first token
    (TTFT) and then 50 tokens per second (TPS) your user experience will be fine.
    Your tolerance to higher TTFT and less TPS is probably okay—because you are used
    to people thinking before they respond.


    But what about other scenarios? For example coding with intelligent autocomplete.
    Developers typically need suggestions *quickly*. If the TTFT is very high, they
    can probably just type it quicker themselves. Or with *voice* applications? If
    there’s a multi-second lag, then conversations might feel broken. As such, depending
    on your application type, the quality of response is important.


    And moving tokens through a behemoth is slower due to the size of the model. Faster,
    better, machines, with dedicated hardware are at best a patch for this problem.


    And, of course, if that machine is shared with millions of other customers, you
    face the possibility of different TTFT and TPS, because your query just has to
    get in line alongside others.


    It’s not a good look if your Enterprise customer’s dashboard is slow, because
    your system is competing with high schoolers using ChatGPT to write their essays!


    Thus, if you consider an on-premise model that’s fine tuned to the specific need,
    you’ll see that it’s generally smaller—so it doesn’t need the dedicated high cost
    hardware to manage synching the model across many machines. There’s less latency—no
    round tripping to the cloud or getting in line behind other models. You can scale
    your hardware investments to your needs. And, of course, you can tune the model
    yourself to optimize it for your particular workload.


    I’ve seen applications that were sluggish and brittle on a hosted model, but they
    become instant and snappy when moved to a local model. The problem then shifts
    from mitigating failures due to others hosting the model, towards adding business
    value by fine tuning the local one. Ultimately this adds to the value of your
    business, instead of flowing operating expenses to a third party.


    # The Data Firewall


    If cost and latency weren’t enough to make you rethink, the Enterprise sales cycle,
    and necessary compliance when working with them should!


    True story: I once sat in on a potential investment on a very hot startup that
    was pitching AI to solve a common problem in hospitals. It used computer vision
    with vision language models. I can’t go into the specifics, of course, but ultimately
    it would save hospitals a lot of time and money, as well as helping them improve
    quality of care. But, being vision-based, it involved putting cameras in common
    places, including the hospital ward.


    Given the requirements for *flexibility*, where one day they might want to be
    able to spot a particular issue, but another day they might want to see something
    different, the idea of vision language models (VLM) was appealing. One can train
    a non-transformer based model for computer vision, but then it becomes static.
    It’s good at spotting X or Y, but if you then want to see Z, you need a whole
    new model. With a VLM, it’s just a prompt. “What’s in this picture?” or “Tell
    me if you see violation (X) in this image” etc.


    The startup demonstrated how they would do this. The demo was amazing. It did
    everything that the customers thought hospitals would need. There was a lot of
    excitement. Then, someone asked about the architecture. The VLM was a hosted giant
    model.


    “Wait,” the CISO asked. “You’re sending images to <Company Name>?”


    The CEO of the startup nodded slowly. “Yes,” she replied. She then held up documents
    showing how <Company Name> manages privacy, guarantees anonymity, and everything
    else to ensure that their system had integrity.


    But that wasn’t enough. They would have to go to the hospital with a ‘trust me
    bro’ attitude around a very large third party, who themselves weren’t at the table.


    Naturally, despite the optimism, the deal died at that table. Hospitals aren’t
    nearly as secure as they might be as a result.


    And that’s a good thing.'

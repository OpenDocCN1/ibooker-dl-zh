    这超出了任何单个消费级 GPU 所能承受的容量。即使是性能强大的 80GB A100——机器学习领域的超级主力，在不进行激进优化的情况下也会举步维艰。在撰写本文时，这些
    GPU 每块约 14,000 美元。


    如果换一种做法，不进行全量微调，而是使用 FP16 精度做 LoRA，结果将如表 3-2 所示：


    | 组件 | 内存（约） |

    | --- | --- |

    | 模型权重 (FP16) | 14Gb |

    | LoRA 适配器权重 | 0.14Gb |

    | 梯度 (FP16) | 0.14Gb |

    | 优化器状态 (FP32) | 0.56Gb |

    | 激活值 | 2Gb |

    | 总计 | 17Gb |


    这样我们就进入了消费级 GPU 的领域，比如拥有 24Gb 显存的 RTX 4090，其价格约为 A100 的 1/10。


    最后，如果我们看一下 QLoRA（我们将在第 X 章详细探讨），会发现它甚至更小（表 3-3）：


    | 组件 | 内存（约） |

    | --- | --- |

    | 模型权重（4 位量化） | 3.5Gb |

    | LoRA 适配器权重 | 0.14Gb |

    | 梯度 (FP16) | 0.14Gb |

    | 优化器状态 (FP32) | 0.56Gb |

    | 激活值 | 2Gb |

    | 总计 | 7Gb |


    这只需要 8Gb 显存就能装下。拥有 8Gb 显存的 GPU 通常价格是上述 RTX 4090 等 24GB 型号的 1/10。我见过它们在商店里卖 100
    到 200 美元。这样更易于接受，而且在 Google Colab 的免费版上也能使用——那里提供拥有 16Gb 显存的 T4 GPU。


    以上只是针对 7B 模型的情况。使用表 3-4 来了解其他常见参数规模下你需要什么：


    | 参数量 | 全量微调 (FP16) | LoRA (FP16) | QLoRA(4-bit) |

    | --- | --- | --- | --- |

    | 3B | ~36Gb (A100 40Gb) | ~8 Gb (RTX 3060) | ~4Gb (RTX 3060) |

    | 7B | ~86Gb (A100 80Gb) | ~17Gb (RTX 4090) | ~7Gb (T4/ RTX 4070) |

    | 13B | ~160Gb (多 GPU) | ~ 32Gb (A100 40Gb) | ~12Gb (RTX 4080) |

    | 70B | ~800Gb (多节点) | ~160Gb (多 GPU) | ~40Gb (A100 40Gb) |


    以下是所有这些方法的对比（表 3-5）：


    | 组件 | FP16 全量微调 | LoRA (1% 秩) | QLoRA (4-bit) |

    | --- | --- | --- | --- |

    | 模型权重 | 14 GB | 14 GB | 3.5 GB |

    | 梯度 | 14 GB | 0.14 GB | 0.14 GB |

    | 优化器状态 | 56 GB | 0.56 GB | 0.56 GB |

    | 总计（约） | 84+ GB | ~17 GB | ~7 GB |


    要点是：要想开始微调而无需承担过高的 GPU 费用，请使用 LoRA 或 QLoRA。这是一个甜点区间，非常高效，而且在消费级硬件上就能运行！


    ## 了解 GPU


    在上一节中，我提到了很多 GPU 名称，如 RTX、A100 等。如果你不熟悉它们，别担心！让我们快速了解一下市面上各种 GPU，以及应该考虑哪些型号。


    ### 消费级 GPU


    我把消费级 GPU 定义为可以轻松在零售渠道购买、并使用 PC 标准扩展卡接口的 GPU。在撰写本文时，其中的旗舰产品是拥有 24Gb 显存的 NVIDIA
    RTX 4090。其建议零售价约为 1400 美元，但由于稀缺性，它们在二手市场上往往售价更高！有了这样一张卡，在 7B 模型上运行 LoRA 或 QLoRA
    简直是小菜一碟。虽然这要花不少钱，但请记住，它比几年前的数据中心专用 GPU 还要强大。如果不行，上一代的 RTX 3090 同样拥有 24Gb 显存，也完全够用，而且通常能以相当大的折扣买到。归根结底，显存大小对你来说才是更好的性能指标。虽然
    40x0 系列显卡有更好的性能参数，但如果它们没有 24Gb 显存，你仍会受到限制。


    AMD 也提供了出色的设备，可通过 ROCm 平台释放全部性能。Radeon RX 7900 XTX 拥有 24Gb 显存，规格上与 RTX 4090 有竞争力，而且通常比
    NVIDIA 同类产品便宜得多。然而，基于 AMD 芯片的微调生态系统不如 NVIDIA 成熟。像 Flash Attention、`bitsandbytes`
    以及 Hugging Face 技术栈的某些部分都是为 NVIDIA 优先构建的。这让你处于明显劣势。


    如果你使用的是搭载 *Apple Silicon*（M 系列芯片）的 Mac，那么你有一个值得了解的有趣选择。Apple 的统一内存架构使得 GPU 和 CPU
    共享同一内存，因此其他系统上对专用显存的需求就消失了。这归根结底是因为 CPU 和 GPU 是同一颗芯片——而不是像独立显卡那样插在主板上。


    当框架报告可用“VRAM”时，它报告的是你的系统内存——而系统内存可能相当大。配备 128 GB 统一内存的 M4 Max 从技术上讲比 A100 拥有更多的“VRAM”。


    问题在于吞吐量。Apple 的 GPU 核心能力很强，但数量上不如 NVIDIA 的数据中心 GPU 多，矩阵运算速度也不如它们。在 A100 上需要 1
    小时的训练，在 M4 Max 上可能需要 4-6 小时。内存是够了，但算力需要更长的时间来处理数据。与使用其他任何非 NVIDIA 芯片类似，围绕 NVIDIA
    发展起来的生态系统是一道巨大的护城河，因此你可能会遇到兼容性问题。


    ### 数据中心 GPU


    NVIDIA A100 是许多 AI 工作负载（包括微调）的行业标准。


    在 Google Colab 等托管环境中使用时，这一点往往并不明确，但 A100 有 40 GB 和 80 GB 两种版本，其中 80 GB 版本在云平台上更常见；如果你需要超过
    40GB 的显存，务必在付费前确认清楚！


    A100 可以处理 70B 模型的 LoRA 微调，以及高达约 7B 模型的全量微调。它的内存带宽（80 GB 版本为 2 TB/s）意味着它不仅拥有更多显存——还能更快地在
    GPU 中传输数据，这直接转化为更短的训练时间。


    NVIDIA H100 是当前的旗舰产品。我不知道他们为什么选这些名字，在许多字体中“A”和“H”看起来非常相似。所以在选择时一定要确认你选的是哪一款！它在每个维度上都比
    A100 更快——更高的内存带宽、更好的张量核心性能、支持 FP8 精度——因此云提供商会为它收取高昂溢价。对于本书涵盖的大多数微调工作负载，A100 已经绰绰有余，而且节省的成本相当可观。


    像 NVIDIA L4（24 GB）和 L40S（48 GB）这样的新款 GPU 正作为高性价比的中端选项出现在云平台上。L4 尤其被定位为微调和推理 GPU，它在
    Google Cloud 等平台上的定价使其对持续工作负载很有吸引力。


    事实上，当你查看 Google Colab 时，就能看到可供你使用的 GPU。请注意，这个列表会随着时间而改变——在撰写本文时可用的 GPU 如图 3-1
    所示。


    ![计算机程序的屏幕截图 AI 生成的内容可能不正确。](img/ch03_figure_1_1772730612412203.png)


    ###### 图 3-1. Google Colab 中的数据中心 GPU


    如你所见，H100 和 A100 都可用，L4 和 T4 也可用。还有一个“High-RAM”开关，对于像 A100 这样具有不同显存配置的机器，你可以在两种配置之间切换。


    启动实例后，右上角有一个小的“RAM/DISK”按钮，点击它会显示你当前的机器规格（图 3-2）。


    ![计算机程序的屏幕截图 AI 生成的内容可能不正确。](img/ch03_figure_2_1772730612412233.png)


    ###### 图 3-2. T4 High Ram 的系统规格


    在这里我选择了配备 High Ram 的 T4，可以看到可用的 GPU 显存为 15.0Gb。它适合在较小的模型上运行 LoRA 或 QLoRA，但除此之外用途有限。不过，它很便宜，每小时
    1.41 units，而 100 units 需要我花 10 美元，所以使用成本约为每小时 14 美分。相比花几百甚至几千美元购买自己的 GPU（要跑很多小时才能回本），这是一个很棒的选择！


    ### 使用多 GPU 进行分布式训练

    '

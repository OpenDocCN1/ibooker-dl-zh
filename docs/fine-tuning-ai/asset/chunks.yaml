  trans: '

    总有一天——也许不是在这本书里，但希望是在你微调生涯的某个时刻——你会发现单个 GPU 已经不够用了。


    也许你需要训练一个 70B 的模型，即便使用 QLoRA，也无法塞进一张显卡。也许你有生产环境的上线期限，需要更快地训练。又或者，新的模型创新已经发展到远超当前可轻易获得的显存容量。这时你可以组合多个
    GPU 并聚合它们的显存，但这会带来额外开销。


    解决这个问题有两种使用多个 GPU 的基本策略：


    *数据并行*会将*完整*的模型复制到*每个* GPU 上，然后将每个训练批次拆分到各个 GPU。每个 GPU 独立处理自己那份批次数据，计算梯度，然后在更新模型之前对各
    GPU 的梯度进行平均。*模型*必须能够装进每一个单独的 GPU，但训练速度更快，因为你实际上是在用 GPU 的数量乘以你的批次吞吐量。所以，就显存大小而言，你必须考虑模型占用的空间，并且这个空间会在每个
    GPU 上被复制，消耗数倍于可用显存量。其余可用的显存空间将用于其他一切，而且这些通常可以被共享。


    *模型并行*（有时根据具体方法也被称为张量并行或流水线并行）会将*模型*本身拆分到多个 GPU 上。不同的层——甚至是同一层的不同部分——会驻留在不同的显卡上。这让你能够训练那些大到无法放入任何单个
    GPU 的模型。它设置起来更复杂，且有显著的通信开销，但这是在有限硬件上处理真正大型模型的唯一方法。


    坦白说，你通常不得不使用模型并行，因为尽管数据并行更有利于加速训练，但模型在不同 GPU 间的复制意味着，优化器权重之类的东西会变得非常难以管理，而且会消耗大量额外显存。


    幸运的是，HuggingFace 的 `accelerate` 库让处理这个问题变得非常容易上手。


    你可以通过调用以下代码来启动它：


    ```

    accelerate config

    ```


    它会引导你完成一个交互式设置，你可以指定你的 GPU 系统——你有多少张卡、想要哪种并行方式，以及如何使用精度。一旦你完成了配置，就可以用如下代码开始训练：


    ```

    accelerate launch train.py

    ```


    这将使用该配置，并按照你的指定将训练负载分布到可用的 GPU 上。


    话虽如此，对于本书涉及的模型和技术，我将重点介绍如何搭配 LoRA 和 QLoRA 使用一块低显存 GPU。


    多 GPU 对加速来说“锦上添花”，或者当你处理更大的模型时也很有用，但它并不是具备能力的前提条件。如果你能使用多个 GPU（比如通过一个带有 4× A100
    的云实例），`accelerate` 可以让你轻松地利用它们。如果你没有，好消息是，在技能提升的道路上你不会被落下！


    # 软件栈


    既然你已经了解了硬件需求，选择软件栈可能会容易一些。在本节中，我们将讨论整个技术栈，从操作系统开始。


    ## 选择你的操作系统


    归根结底，你需要的是一个支持你硬件的操作系统！或者，如果你选择基于云的硬件，你至少需要了解云服务提供商提供给你的软件栈。


    ### 使用 Linux


    默认选择通常都是某种形式的 Linux。如果你要搭建自己的机器，Ubuntu 是最好的发行版，因为它的支持最好。例如，NVIDIA 驱动和 CUDA 对 Ubuntu
    有一流的支持，而且你看到的几乎所有教程、Docker 镜像或云模板，都默认你在使用它。


    如果你对 Linux 不熟悉，我建议你使用 Ubuntu 的 LTS（长期支持）版本来搭建 Linux 机器。在撰写本文时，这个版本是 Ubuntu 22.04
    LTS。


    ### 使用 Windows


    说实话，Windows 确实是个有趣的操作系统！它曾是 Web 和服务器业务的中坚力量，但由于 LAMP（Linux、Apache、PHP、MySQL）技术栈，它在某种程度上被基于
    Linux 的系统抢了风头。随着云计算的演进，这种趋势还在加速。在桌面端，Windows 仍然相当流行，但随着运行 MacOS 的苹果台式机和笔记本电脑的普及，这种流行度已经大幅下降。


    为此，微软推出了 WSL2（适用于 Linux 的 Windows 子系统 2），它出乎意料地好用。WSL2 运行真正的 Linux 内核，并且原生支持 CUDA
    直通，Windows 的 NVIDIA 驱动会直接共享给 WSL2 环境，这意味着你无需在 WSL 内单独安装它们。鉴于 Windows 仍然是*游戏*领域主要的桌面操作系统，NVIDIA
    会继续将 Windows 作为一流系统来支持。


    这并非一个*糟糕*的选择，如果你已经在使用 Windows，它值得考虑。但直接使用 Linux 而不是“子系统”，可能会引入更少的复杂性。


    ### 使用 macOS


    对于使用 Apple Silicon 的 macOS 用户来说，情况在不断发展。PyTorch 的 MPS 后端可以用于基础训练，而 MLX（[`opensource.apple.com/projects/mlx/`](https://opensource.apple.com/projects/mlx/)）提供了更原生的体验。Apple
    显然在机器学习上投入了大量资源，并且正在构建与之匹配的软件栈。


    主要限制在于生态广度：像 `bitsandbytes` 这样的库对 macOS 的支持有限，而且大多数故障排查资源都假设你使用 NVIDIA 硬件。


    我的主力系统是一台 Mac Mini，我用它完成许多机器学习任务，但要微调除最小模型以外的任何模型，就会有点吃力了。话虽如此，能用主力系统干活，而不必专门去搭建一台机器，还是很棒的。所以，如果你和我一样是
    Mac 用户——先*别*急着去买一台带 NVIDIA GPU 的 Linux 机器。你也许用 Mac 就能做很多事了！


    而当它算力不足时，把 Mac 当作云 GPU 的瘦客户端是一种可行的前进方式——SSH 登录到云实例，在那里运行你的训练。或者，当然也可以在浏览器中使用 Colab
    之类的工具。


    ## 你的编程环境


    我们先从编程语言说起。虽然有很多成熟度各异的选项，但你真正应该从它开始的只有一个——那就是 Python。对于所有机器学习和微调任务，Python 在库方面拥有最好的支持，而且有着庞大的支持生态。很难想象不先用
    Python 就能在机器学习和微调方面有所成效。之后，你可能会开始考虑底层效率，希望比 Python 这样的高级解释型语言更贴近硬件来运行代码，但不要被这些分心！先用
    Python 打好基础。


    这也有一个缺点。由于生态如此多样，版本支持存在巨大的漂移，不仅是 Python 的版本，还有像 CUDA 这样的相邻技术。为了解决这个问题，理解虚拟环境是一个重要的前提。


    主要有两种方式：`Conda` 或 `Venv`。


    `Conda` 是更全面的选择。`Conda` 不仅管理 Python 包，还管理系统级的依赖，比如 CUDA 工具包版本。这意味着你可以有一个 CUDA
    11.8 的环境，另一个 CUDA 12.1 的环境，并在它们之间无缝切换。对于初学者，或者任何希望 CUDA 管理自动化的人来说，我建议投入时间和精力去学习
    `Conda`！


    `Venv`（配合 `pip`）是一个轻量得多的选择。如果 CUDA 已经安装在系统层面，它就能很好地工作，设置更快，也相当容易管理。我个人喜欢多个 `Venv`
    设置带来的掌控感，尤其是在 Mac 上工作时，我不需要担心 CUDA，这让我的机器学习生活轻松很多！

    '

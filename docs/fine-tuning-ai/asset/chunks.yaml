  trans: '

    需要记住的一点是，环境有很多选择，尤其是 GPU——AMD 和 ROCm、或者 Apple 和 Metal 都是 NVIDIA 和 CUDA 的有力竞争者。在本书中，我大体上会遵循最常用的路径（NVIDIA
    和 CUDA）。


    # GPU：你的第一个决策


    现代语言模型通常基于 Transformer 或 Transformer 衍生架构构建——这些架构主要依赖矩阵乘法。模型的单次前向传播会涉及数千次大规模矩阵运算。我们在第
    2 章中看到了如何将权重矩阵与输入向量相乘、跨 token 序列计算注意力分数，并通过前馈层投影数值。


    CPU 是为顺序逻辑设计的——分支决策、路由控制流和线程输出。通常它拥有少数几个非常强大的核心，每个核心都能非常非常快地完成一件事。


    另一方面，GPU 可以拥有成千上万个较小的核心。例如，一块 NVIDIA A100 就有近 7000 个核心！它们被设计用于同时对大量数据执行相同的操作。尽管
    GPU 是为图形而设计的（这就是 GPU 中的“G”！），但它也完美契合了 AI 对矩阵乘法的渴求。GPU 的架构使你能够*并行*执行数千次这样的操作。


    结果是，AI 工作负载在 GPU 上的速度比在 CPU 上快若干个数量级。因此 GPU 是不可或缺的。如果你没有 GPU 也不用担心——许多云平台按小时提供
    GPU 访问权限，或者 Google Colab 等工具可以免费提供 GPU 使用权。我们稍后会讨论这些。


    ## VRAM：一个统御一切的指标


    既然 GPU 不可或缺，我们现在需要了解 GPU 可用的内存，也就是 VRAM，即显存（Video RAM）。为什么叫 Video？嗯——这也是视频游戏和
    GPU 的遗留产物。在我们的场景中，它与视频或游戏毫无关系，但重点是它是 GPU *直接*访问的内存。许多计算机有主板和 CPU，带有 RAM，然后有一块独立的
    GPU 卡作为插件设备。由于 GPU 需要处理数字，这些数字必须放在内存中——而通过卡槽在系统 RAM 之间来回传输会拖慢速度。显而易见的解决方案——给 GPU
    卡配备自己的专用内存。这就是 VRAM。


    这是一个硬约束，决定了你能和不能有效微调什么。如果你的模型、梯度、优化器状态、激活值和其他开销的总占用超过了可用 VRAM，训练充其量会非常缓慢（因为需要跨显卡接口和主板进行大量内存交换），最糟糕的情况则是直接崩溃。我的经验是：如果放不下
    VRAM，就别费劲了——否则你会自找一大堆麻烦。


    一个缺点是：VRAM 非常昂贵。想找到 VRAM 超过 32Gb 的 GPU 而不破产几家公司是很罕见的。解决方案是*分布式*训练，让多个 GPU 协同工作，*共享*它们的
    VRAM。2 块各有 32Gb 的 GPU 比 1 块 64Gb 的 GPU 便宜得多。


    现在我们更深入了解一下 VRAM 需求，看看它如何以及将会如何影响你的决策。


    ### 计算 7B 模型的 VRAM 需求


    要微调一个 7B 模型，我们需要计算训练过程中会使用多少 VRAM，而这要从*模型权重*开始。因为有 70 亿个权重，它们的影响立竿见影。首先需要弄清楚的是，根据精度它们占用多少存储。你会在技术文档中看到多种精度方法，但最常见的四种是：


    * `FP32`：(32 位浮点) - 每个参数 4 字节，因此 28B 字节

    * `FP16`：(16 位浮点) - 每个参数 2 字节，因此 14B 字节

    * `INT8`：(8 位量化) - 每个参数 1 字节，因此 7B 字节

    * `INT4`：(4 位量化) - 每个参数 0.5 字节，因此 3.5B 字节


    其他研究领域也在探索不同精度级别——例如 `FP8` 正变得越来越流行，还有更小型的例如 2 位编码。你可能已经猜到，内存占用越低，精度就越低，但我们常常发现，对于语言模型这类任务，你其实并不需要
    32 位精度。想想看，在预测下一个 token 时，99.0000234023523% 的准确率相比 99.00002% 的准确率并不会带来任何增益！


    所以最终这是一个权衡取舍，但微调者通常会从 `FP16` 开始，一开始就占用 14B 字节。你可以尝试 `INT8` 和 `INT4`，如果你的内存受限，我强烈建议至少先试试这些。


    接下来是*梯度*。虽然本书不会深入讨论机器学习过程，但其中一个重要部分叫做*反向传播*，为了调整参数（也就是定义上的“学习”），算法会计算一个梯度，用来指示应该向哪个*方向*调整参数。简单来说，就是“向上”或“向下”，以及“调整多少”。每个梯度与其对应参数的大小*相同*。上面的计算依然成立，实际上使内存需求翻倍。因此，在
    16 位精度下，你需要 14B 字节用于参数，另外 14B 字节用于梯度。


    **注意**


    一种名为 *LoRA* 的微调技术（我们将在第 X 章探讨）不会使用*全部*参数，只会使用其中极小一部分。例如，如果它只使用 1% 的参数，那么参数只需 0.14B，梯度也只需
    0.14B。这非常少，在仅有 8Gb 内存的 GPU 上都能完成！因此，你就能明白为什么它如此受欢迎！


    机器学习和微调的必要组成部分之一是使用*优化器*。微调中非常常见的一种是 Adam。优化器的目标是计算我们上面提到的梯度——确定参数需要移动的方向和量，以使其工作更有效（也就是“学习”）。Adam
    优化器需要每个参数额外*两个*值——一个运行均值和一个运行方差。这些值必须*高度*精确，因此无论权重如何编码，它们通常都以 `FP32` 存储。因此，每个可训练参数占用
    8 字节。所以，对一个 7B 模型进行完整微调，单单优化器就需要额外 56Gb！同样，如果使用 LoRA，这可能只占其中的 1%，即 0.56GB，更容易接受了！


    在存储方面经常被忽视的机器学习组成部分之一是*激活值*，即每一层的输出会被存储下来，以便在反向传播中用于计算梯度。这里的内存取决于模型架构，例如批次大小、序列长度等。对于一个批次大小为
    1、序列长度为 2048 个 token 的 7B 模型，激活值可能消耗 2-4Gb。同样，这在很大程度上取决于模型架构，但它会随批次大小线性扩展，这一点很重要，因此批次大小为
    2 时占用会翻倍，以此类推。所以在微调时，内存需求可能会限制你的批次大小。内存越小，你就只能使用最小的批次（1）；内存越大，你就能使用更多批次。这也是 VRAM
    重要的另一个原因——因为通过批处理，单次传递中能移动的数据越多，你的训练或再训练就会越快！


    现在把这些数字加起来。


    对于 `FP16` 下的完整微调（表 3-1）：


    | 组件 | 内存（约） |

    | --- | --- |

    | 模型权重（FP16） | 14Gb |

    | 梯度（FP16） | 14Gb |

    | 优化器状态（FP32） | 56Gb |

    | 激活值 | 2Gb |

    | 总计 | 84Gb |

    '

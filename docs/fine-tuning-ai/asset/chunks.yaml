  trans: "\n```\n==================================================\nSTEP 1: GPU Check\n\
    ==================================================\nGPU: NVIDIA A100-SXM4-40GB\n\
    VRAM: 42.4 GB\n \n==================================================\nSTEP 2:\
    \ Loading model in 4-bit\n==================================================\n\
    ...\nModel loaded: TinyLlama/TinyLlama-1.1B-Chat-v1.0\nModel memory footprint:\
    \ 0.75 GB\n \n==================================================\nSTEP 3: Running\
    \ inference\n==================================================\nPrompt: The capital\
    \ of France is\nResponse: The capital of France is Paris.\nWhat is the capital\
    \ of France? Paris.\n \n==================================================\nSTEP\
    \ 4: Applying LoRA adapter\n==================================================\n\
    trainable params: 1,126,400 || all params: 1,101,174,784 || trainable%: 0.1023\n\
    \ \n==================================================\nSTEP 5: Single training\
    \ step\n==================================================\nLoss: 3.4863\nGradient\
    \ computed successfully!\n \n==================================================\n\
    ALL CHECKS PASSED—Your environment is ready!\n==================================================\n\
    ```\n\n如果你没有得到这些结果，以下是一些常见错误：\n\n*   `CUDA is Not available` - 你安装的是仅支持 CPU 的\
    \ PyTorch。在 Colab 中通常不会这样，当然，除非你选择了 CPU 后端！\n\n*   `RuntimeError: CUDA out of\
    \ memory` - 提供的代码会下载一个小于 1GB 的微型模型。如果你遇到这个错误，要么是你的 GPU 显存太小，要么更有可能是另一个模型已加载并占用了大部分内存，且在此次运行前未被清理！\n\
    \n*   `bitsandbytes` 库是针对你的 CUDA 安装版本编译的。我见过很多由于它与 CUDA 工具包版本不匹配而导致的编译错误。请仔细检查你的版本！\n\
    \n*   模型下载失败。HuggingFace API 提供了分片下载的良好可视化界面。请留意这些信息以检查是否有失败。模型会下载到一个隐藏的缓存目录（`~/.cache/huggingface/`）——如果这里空间不足，你可能会遇到问题。\n\
    \n# 实验跟踪\n\n除了目录组织之外，你还需要一种方式来跟踪每次训练运行中发生的情况。第 1,000 步时的损失是多少？学习率如何衰减？模型在哪一步开始过拟合？这些问题仅靠日志文件几乎无法回答，但使用合适的实验跟踪器则轻而易举。\n\
    \n## 权重与偏差（wandb）\n\n我们之前见过权重与偏差（wandb），这是大多数机器学习社区进行实验跟踪的标准工具。个人使用免费，易于与你的代码集成，并提供一个\
    \ Web 仪表板，你可以在其中可视化损失曲线、并排比较多次运行，并注释你的结果。\n\n设置起来很简单：\n\n```\n# Create a free\
    \ account at wandb.ai, then\nwandb login\n# Paste your API key when prompted\n\
    ```\n\n认证后，`transformers` 库会提供一个 API 让你自动登录 wandb。你也可以在训练参数中显式配置它：\n\n```\nfrom\
    \ transformers import TrainingArguments\n \ntraining_args = TrainingArguments(\n\
    \    output_dir=\"./outputs/checkpoints\",\n    report_to=\"wandb\",\n    run_name=\"\
    ...\",\n    # ... other arguments\n)\n```\n\n每次训练运行都会变成一个仪表板，显示损失曲线、学习率调度、梯度范数和\
    \ GPU 内存使用情况。你可以随着训练进行实时跟踪，这在情况不妙时便于手动提前停止。\n\n## TensorBoard\n\nTensorBoard 是\
    \ TensorFlow 生态系统的一部分，是一个完全在本地运行的开源替代方案，并且可以轻松用于 Colab 等环境。\n\n```\npip install\
    \ tensorboard\n \n# In your TrainingArguments:\n# report_to=\"tensorboard\"\n\
    \ \n# After training, launch the viewer:\ntensorboard --logdir ./logs\n```\n\n\
    即使你不使用这些工具，我也强烈建议你保留一个简单的实验日志——哪怕是电子表格或记事本——记录每次运行的日期、模型名称、数据集版本、关键超参数（LoRA 秩、学习率、epoch\
    \ 数）、最终训练损失和评估分数。\n\n当你运行了三十次实验并需要找到最好的那次时，你会感激这种纪律。你还会发现，它会让你养成根据这个表格或记事本中的条目来命名检查点的习惯，之后也更容易找到它们！\n\
    \n# 云与按需付费\n\n在上一节中，我使用 Colab 作为模型环境，后端为 A100。如果你不想管理 GPU 的所有权*或*构建自己的环境，这是一个非常好的选择，主机为你代劳。这是按需付费意义重大的一个很好的例子。\n\
    \n*Kaggle Notebooks* 提供了与 Colab 类似的体验。它们通常提供免费 GPU 访问（我最近看到有 T4 和 P100 可用），每周配额为\
    \ 30 小时。这真的很大方。界面与 Colab 类似，尽管更像普通的 notebook。另一个好处是数据集——许多已经托管在 Kaggle 上，因此集成更容易一些。\n\
    \n*Lambda Labs* 则采用了不同的方向。你得到的不是 notebook，而是一台通过 SSH 访问的完整 Linux 机器。\n\n他们提供 A100\
    \ 和 H100 实例，并且可以自由安装你自己的软件、管理你自己的文件，并完全控制环境。\n\n如果你想深入研究底层软件栈，又不希望一切都由托管方完全管理，这真的很有用，感觉更像是云中你自己的机器。\n\
    \n*RunPod* 是一个有趣的替代方案，作为一个 GPU 市场运营，提供“社区云”（更便宜、可靠性较低）和“安全云”（更贵、更可靠）选项。他们以更低的价格提供抢占式/可中断实例——但代价是你的实例可能会被其他人抢占——这对于长时间训练运行来说并不理想。一个好处是\
    \ ML 软件栈通常是预装的，这有助于缩短你的设置时间。\n\n另一个有趣的选项是 [Vast.ai](http://vast.ai)，它有点像 GPU 租赁领域的\
    \ Uber。在这里，个人 GPU 所有者可以出租他们的硬件！当然，可靠性和安全性可能会有所不同。\n\n此外，还有 *Digital Ocean*，它是一项云服务，提供由\
    \ ROCm 驱动的 AMD 芯片。\n\n# 本地还是云端——如何决定\n\n虽然每种情况都不同，但我通常会遵循以下框架来帮助我决定在哪里以及如何进行模型的任何调整或微调。\n\
    \n你现在已经了解了硬件选项和软件栈。剩下的问题是：我在哪里运行它？答案取决于你的具体情况，没有放之四海而皆准的正确选择。这里有一个决策框架可以帮助你思考。\n\
    \n第一个问题很简单：你是否有 16 GB 或更多显存的 GPU？如果有，你的本地机器可以处理高达 7B 参数模型的 QLoRA（16 GB 情况下）。显存越多，模型越大。这涵盖了我们在本书中要做的大部分内容。如果没有，云是你的主要选择。\n\
    \n然后我会问你：这是一次性的实验还是持续的工作？如果你正在学习这本书，并计划将微调模型作为日常工作的常规部分，那么投资一块本地 GPU 会在几个月内收回成本。如果这是一次性的探索，云让你无需长期承诺即可使用，而且通常投入要低得多。\n\
    \n你是否有数据主权要求？一些组织——尤其是医疗、金融和政府——对数据可以在哪里处理有严格规定。如果你的训练数据不能离开你的场所，那么本地训练（或私有云部署）是强制性的。这是支持本地硬件的最有力论据之一：你的数据永远不会离开你的大楼。\n"

    # 第 1 章：从通才到专才


    蜜月期已结束。


    和我一样，你可能已经使用大语言模型（LLM）作为后端构建了原型。当你以提示（prompt）形式表达的复杂查询返回完美而连贯的响应时，你会感受到最初的兴奋。“惊喜与愉悦”的设计是一个理想的目标，而
    LLM 的响应达到了这一目标。有那么一刻，你觉得软件的未来是无限的，提示（prompting）是新的编程语言。你只需要巧妙的提示。


    自从 ChatGPT 普及了 LLM 以来，我们一直处于*通才*的时代。我们惊叹于那些在整个人类互联网及更广泛数据上训练过的大型语言模型。它们无所不能，从创作俳句诗歌到优化
    RUST 函数。它们是技术奇迹。


    但如果你想交付一个*真正的*产品呢？在使用这些模型时，你常常会发现，尽管最初很兴奋，但由于各种原因，它们可能是错误的工作工具。虽然它的押韵能力令人印象深刻，但在查询你遗留的
    SQL 数据库时，你确实希望它不要幻觉出不存在的表！


    这就是正在出现的“API 之墙”。那是一道无形的屏障，将酷炫的黑客松演示与盈利业务分开，也将成功的初创公司与只博眼球的初创公司分开。突破这堵墙需要面对一些残酷的现实：可能压垮你的规模成本、不可预测的延迟，当然，还有当你提到将与第三方共享客户数据时，你的首席信息安全官（CISO）脸上的惊恐表情。


    这本书归根结底是关于突破这堵墙。它是关于从*租用*智能转向*拥有*智能。它将让你用敏捷、超能力的专才取代庞大的通才：经过微调的 AI，它比任何万亿参数巨头都更了解你的业务。


    你将拆解“提示工程”范式。在本章中，我们将看看那种杀死了许多 AI 初创公司的残酷“单位经济学”。我们将看到为什么一个在单个 GPU 上运行的小型开源模型能够——而且应该——在*你的*特定领域击败世界上最聪明的
    AI。


    ## 租用智能的成本


    每个项目都始于天真。你获得一个 API 密钥，然后开始编码。你精心构建了一个经过大量实验打磨的系统提示。它有效。你部署到测试版。


    然后你看着成本。你的眼睛睁大了。你想象那会是什么样子。它们睁得更大！


    ### 令牌税


    在原型阶段，推理成本感觉可以忽略不计。每次请求几分之一美分基本上是免费的。但是当你从“聊天”转向自动化时，数学计算就对你不利了。


    大多数提供商按令牌收费（大约 0.75 个单词）。对于高端推理模型，你可能需要为每 1,000 个输入令牌支付 0.01 到 0.03 美元。


    让我们用一个场景来推演一下。设想一个“法律合同分析器”应用。你的用户上传文档，你的应用会提取合同中潜在问题或风险的摘要。


    架构可能如图 1-1 所示。


    ![一个蓝色矩形，带有蓝色齿轮和白色文字，AI 生成的内容可能不正确。](img/ch01_figure_1_1772730610555180.png)


    **图 1-1.** 一个基于 LLM 的法律合同分析器的简单架构


    你的输入是提示加上合同。一份典型的合同——包含大量法律术语——大约有 15,000 个令牌。你的系统提示是你精心设计的，包含大量指令以避免幻觉，并精确地按照系统其余部分所需的结构来组织输出——可能以
    JSON 或其他结构化文件的形式。这会消耗令牌。当然，你的输出还会产生更多令牌。


    因此，输入 17,000 个令牌，输出 1,000 个令牌。按照上述成本计算，每份文档可能花费 20 美分。如果你有 1,000 个用户，每人每天分析 5
    份文档，那就是每天 1,000 美元，或每年 365,000 美元。


    这只是运营该系统所需花费的资金。而在这一切结束时，你什么都*不拥有*。你是在*租用*智能。如果你向用户收取月费——比如说每月 20 美元，他们很快就会变成净亏损。你的利润率风险非常高。


    ### 智能体倍增器


    现在考虑智能体的影响。自 2024 年中期以来，它们一直是科技行业的宠儿，而且理由充分——它们是一种优秀的设计模式，通过超越仅仅获取问题答案的方式，最大限度地发挥
    LLM 的作用。我通常喜欢认为智能体遵循图 1-2 所示的模式。


    ![](img/ch01_figure_2_1772730610555218.png)


    **图 1-2.** 智能体工作流


    最终，这里的目标是遵循以下步骤：


    '

- raw: 'Often reasoning is just the model ‘talking to itself’. It looks at the user’s
    query, then looks at its answer, and then uses that to try to drive a better answer.
    Larger models generally show better multi-step reasoning, but architectural choices,
    particularly in smaller models also matter greatly. MoE models like Mixtral can
    route different reasoning steps through different experts, potentially improving
    complex reasoning, and giving you a generalized overview of the solution. While
    this is usually a ‘plus'', it’s not always necessarily the case. For example,
    a single step through the code expert for a code solution, may work better than
    multiple steps through other experts! For tasks requiring deep reasoning (mathematical
    proofs, complex analysis), you may need a larger model or accept multiple inference
    calls with chain-of-thought prompting where, instead of relying on the model to
    internally reason, you can just prompt it again (and again, and again) to force
    it to reason. This can be very difficult to fine tune, so manage your expectations
    accordingly!


    ## Context Windows and the ‘Lost in the Middle’ problem


    Just because a model has a large context window doesn’t mean it uses long contexts
    effectively. “Lost in the middle” is a known phenomenon where models attend strongly
    to the beginning and end of the context but miss information in the middle. This
    can be particularly dangerous in the case of a sliding window to drive longer
    contexts. When fine tuning in particular, you should test the base model’s ability
    to recall information from various positions in the document to see if it has
    this problem, before committing to the significant investment of fine tuning it!


    # Summary


    As you can see, deciding which model to use relies on a variety of factors. Personally,
    I like to use the following questions, in no particular order of priority.


    1.  What tokenizer does the model use? Will it encode *my* data accurately and
    meaningfully?


    2.  How large is the context window? How large is it in reality, and how large
    is it because of neat tricks in the KV cache? Does the context window meet the
    expected demands of my users?


    3.  How big is the model? Will it fit into the available memory I have in order
    to host it where I want? Can it be quantized? What will the impact of quantizing
    be?


    4.  If I am retraining, what are the memory constraints of my training system?
    Will it work with the number of parameters, the context window size, and the memory
    available to me?


    Also note the following findings:


    1.  When it comes to Attention Type, models that use GQA generally offer high
    inference efficiency, but MQA offers much better efficiency as a cost of quality


    2.  Dense models like Llama and Mistral are usually easier to fine-tune. MoE models
    offer more capacity but are more difficult to change.


    3.  Tokenizer efficiency can have a huge impact on the time it takes to retrain
    or fine tune a model


    4.  The Conext window size should accommodate your longest training examples and
    expected inference inputs.


    5.  Typically Base Models are better to give you the control you want over the
    final behavior, but if your scenario is an instruction-based one (like chat,)
    you might be better off using an instruction tuned variant of the model.


    6.  Hardware. Remember that *training* takes significantly more resources than
    inference. Make sure that your model isn’t just suited to your end users inference
    needs, but also that you can think about the training needs and costs, which can
    be significant!


    The number of models available to you is growing all the time. But I think these
    questions give you a great starting point!


    Understanding these architectural foundations will serve you throughout your fine-tuning
    journey. In the next chapter, we’ll translate this theoretical knowledge into
    practical hardware and software setup—the fine-tuner’s workshop where you’ll start
    building your expert models.


    # Chapter 3. The Fine-Tuner’s Workshop


    Have you ever tried to build furniture with the wrong tools? Thankfully the Ikea’s
    of the world include the necessary allen keys and screwdrivers. But before they
    started providing those, you usually, at best, ended up with a wobbly desk. And
    that’s *after* fighting with your equipment before you actually built anything.


    Fine tuning a model is no different. The right hardware and software setup is
    everything, and the perfect investment to prevent frustrating long nights full
    of cryptic error messages.


    In this chapter, we’ll talk about that workbench. The search space for the correct
    hardware is near infinite, so I’ll be opinionated about what I think is a good
    set to begin with! You don’t have to go with my suggestions, of course, but I
    *will* be using them through all the examples in this book.


    # Why Setup Matters


    When you run inference on a model, feed a prompt and get a response, you’re doing
    relatively lightweight work. The model’s weights sit in memory, data flows through
    the network and causes a bunch of calculations. The tensors get collapsed into
    output tokens that get decoded into words. A decent laptop can handle inference
    on a 7B sized model.


    But fine tuning is fundamentally different. You’re not just running data through
    the model—you’re updating the parameters within the model itself. So, every training
    step requires you not just to store the weights and biases, but also the gradients—the
    direction each weight should move to get your desired goals. Additionally the
    optimizer keeps states, which is momentum and variance history that is tracked
    for every parameter. Some optimizers like Adam may have double the storage than
    the weights and biases.


    A rough calculation is that a 7B parameter with 16-bit precision takes about 14Gb
    of memory. But there’s much more to it than just the parameters—Add the gradients,
    optimizer states, activations, etc and you’re pushing 70-80Gb, which is way beyond
    consumer GPUs at reasonable price points, likely setting you back five figures
    for a workstation. You’ll see that calculation in more detail later in this chapter.


    If you’ve tried doing anything with fine tuning models you’ve probably seen a
    ‘Cuda Out of Memory’ message. It worked yesterday when you did inference, but
    now you’re asking a lot more of that memory!


    So, if you get nothing else from this chapter, please realize that measuring the
    size of the model is just the first step in understanding your needs for tuning
    that model.


    After memory, the next important thing to consider is your software environment.
    For fine tuning, the ecosystem is constantly evolving, but consider it to sit
    at the intersection of PyTorch, CUDA, Hugging Face, and quantization tools. Each
    has their own version requirements and interdependencies. For example, version
    mismatching between CUDA and PyTorch will often give you a silent failure—your
    code works, but it doesn’t take advantage of the GPU exploding the time it takes
    to do anything! A mismatch between bitsandbytes and your CUDA version can give
    you a load failure or a compilation error that sends you down a Stack Overflow
    rabbit hole or a very long conversation with your LLM of choice.


    ###### Note


    *Vibe coding* is awesome, but it is prone to issues like this. Training sets used
    to train models to understand and generate code don’t have errors like this—they’re
    based on reference implementations that just work. So the code the LLM spits out
    might be factually correct, but they still have problems because your environment
    isn’t correctly set up for it. And when you ask the LLM to fix the problem, it
    will likely try to fix the code, but the code wasn’t broken to begin with! The
    bottom line: You have to understand your environment, and you have to ensure that
    it works!


    The good news: These problems aren’t insurmountable. When you know what to look
    for, you’ll know how to solve them. This chapter will give you the map to that
    hidden treasure.'

  trans: '


    通常，推理只是模型在“自言自语”。它查看用户的查询，再看自己的答案，然后利用这些信息尝试得出更好的答案。更大的模型通常表现出更好的多步推理能力，但架构选择，尤其是在较小的模型中，也至关重要。像
    Mixtral 这样的 MoE 模型可以将不同的推理步骤路由到不同的专家，从而可能改善复杂推理，并为你提供解决方案的全面概述。虽然这通常是一个“加分项”，但并非总是如此。例如，对于代码解决方案，仅通过代码专家一步执行，可能比通过其他专家多步执行效果更好！对于需要深度推理的任务（数学证明、复杂分析），你可能需要更大的模型，或者接受多次推理调用配合思维链提示，而不是依赖模型内部推理，你可以反复提示它（一次又一次）来强制它进行推理。这可能很难进行微调，所以请相应地管理你的期望！


    ## 上下文窗口与“中间迷失”问题


    仅仅因为模型具有较大的上下文窗口，并不意味着它能有效利用长上下文。“中间迷失”是一种已知现象，即模型强烈关注上下文的开头和结尾，却遗漏了中间的信息。在通过滑动窗口驱动更长上下文的情况下，这可能尤其危险。尤其是在微调时，你应该测试基础模型从文档中不同位置回忆信息的能力，以确定它是否存在这个问题，然后再投入大量资源进行微调！


    # 总结


    如你所见，决定使用哪种模型取决于多种因素。就我个人而言，我喜欢按以下问题来考虑，但优先级不分先后。


    1. 模型使用什么分词器？它能否准确而有意义地编码*我*的数据？


    2. 上下文窗口有多大？实际大小是多少？其中有多少是因为 KV 缓存中的巧妙技巧而显得大的？上下文窗口是否满足我用户的预期需求？


    3. 模型有多大？它能适配我可用的内存，以便在我想要的地方部署吗？能否进行量化？量化会产生什么影响？


    4. 如果我进行重新训练，我的训练系统的内存限制是什么？它能满足参数数量、上下文窗口大小和我可用内存的要求吗？


    另请注意以下发现：


    1. 在注意力类型方面，使用 GQA 的模型通常提供较高的推理效率，但 MQA 以牺牲质量为代价提供了更高的效率。


    2. 像 Llama 和 Mistral 这样的稠密模型通常更容易微调。MoE 模型提供更大的容量，但更难修改。


    3. 分词器效率会对模型重新训练或微调所需的时间产生巨大影响。


    4. 上下文窗口大小应能容纳你最长的训练示例和预期的推理输入。


    5. 通常，基础模型能让你更好地控制最终行为，但如果你的场景是基于指令的（如聊天），那么使用模型的指令调优变体可能更好。


    6. 硬件。请记住，*训练*消耗的资源远多于推理。确保你的模型不仅适合最终用户的推理需求，而且你还需要考虑训练需求和成本，这些可能非常可观！


    可供你选择的模型数量一直在增长。但我认为这些问题为你提供了一个很好的起点！


    理解这些架构基础将贯穿你的微调之旅。在下一章中，我们将把这些理论知识转化为实际的硬件和软件设置——微调者的工作坊，你将在那里开始构建你的专家模型。


    # 第 3 章 微调者的工作坊


    你有没有试过用错误的工具组装家具？幸运的是，世界各地的宜家都附带了必要的内六角扳手和螺丝刀。但在他们提供这些工具之前，你通常最多只能得到一张摇摇晃晃的桌子。而且那还是在与工具搏斗一番*之后*、真正动手组装之前的结果。


    微调模型也是如此。正确的硬件和软件设置就是一切，是避免那些充满晦涩错误信息的令人沮丧的长夜的最佳投资。


    在本章中，我们将讨论这个工作台。正确硬件的搜索空间几乎是无限的，所以我会就我认为适合起步的一套配置发表个人见解！当然，你不必采纳我的建议，但我*会*在本书的所有示例中使用它们。


    ## 为什么设置很重要


    当你对模型执行推理时，输入提示并得到响应，你完成的是相对轻量的工作。模型的权重驻留在内存中，数据通过网络流经并触发一系列计算。张量被压缩成输出词元，再解码为单词。一台不错的笔记本电脑就能处理
    7B 规模模型的推理。


    但微调则完全不同。你不仅仅是在让数据通过模型——而是在更新模型内部的参数。因此，每一步训练不仅需要你存储权重和偏置，还需要存储梯度——每个权重为达到预期目标而应移动的方向。此外，优化器还会维护状态，即针对每个参数跟踪的动量和方差历史。像`Adam`这样的优化器占用的存储空间可能是权重和偏置的两倍。


    粗略计算一下，一个 7B 参数、16 位精度的模型大约需要 14 GB 内存。但这不仅仅是参数的问题——再加上梯度、优化器状态、激活等，你会推高到 70–80
    GB，这远超价格合理的消费级 GPU 的承受范围，一台工作站可能就要花费五位数。稍后在本章中，你会看到更详细的计算。


    如果你尝试过任何微调模型的操作，可能见过“Cuda Out of Memory”消息。昨天你做推理时还好好的，但现在你对内存的需求大大增加了！


    所以，即使你从本章中什么也没学到，也请明白：衡量模型大小只是了解调优该模型需求的第一步。


    在内存之后，下一个重要的考虑因素是你的软件环境。对于微调，生态系统在不断演变，但可以将其视为位于 PyTorch、CUDA、Hugging Face 和量化工具的交叉点。每个都有各自的版本要求和相互依赖关系。例如，CUDA
    和 PyTorch 之间的版本不匹配通常会给你一个静默的失败——你的代码能运行，但它无法利用 GPU，导致执行任何操作的时间急剧增加！bitsandbytes
    与你的 CUDA 版本不匹配可能会导致加载失败或编译错误，让你陷入 Stack Overflow 的兔子洞，或与你选择的 LLM 进行一场非常漫长的对话。


    > **注意：** *氛围编程*固然很棒，但它容易出现这类问题。用于训练模型理解和生成代码的训练集不会有这样的错误——它们基于开箱即用的参考实现。因此，LLM
    给出的代码可能在事实上是正确的，但仍然存在问题，因为你的环境没有正确配置。而当你要求 LLM 修复问题时，它很可能会尝试修复代码，但代码从一开始就没有坏！归根结底：你必须了解自己的环境，并且必须确保它能正常工作！


    好消息是：这些问题并非不可克服。当你知道该寻找什么时，你就知道如何解决它们。本章将为你提供通往那笔隐藏财富的地图。


    '

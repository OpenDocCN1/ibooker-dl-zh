- raw: "```\n==================================================\nSTEP 1: GPU Check\n\
    ==================================================\nGPU: NVIDIA A100-SXM4-40GB\n\
    VRAM: 42.4 GB\n \n==================================================\nSTEP 2:\
    \ Loading model in 4-bit\n==================================================\n\
    ...\nModel loaded: TinyLlama/TinyLlama-1.1B-Chat-v1.0\nModel memory footprint:\
    \ 0.75 GB\n \n==================================================\nSTEP 3: Running\
    \ inference\n==================================================\nPrompt: The capital\
    \ of France is\nResponse: The capital of France is Paris.\nWhat is the capital\
    \ of France? Paris.\n \n==================================================\nSTEP\
    \ 4: Applying LoRA adapter\n==================================================\n\
    trainable params: 1,126,400 || all params: 1,101,174,784 || trainable%: 0.1023\n\
    \ \n==================================================\nSTEP 5: Single training\
    \ step\n==================================================\nLoss: 3.4863\nGradient\
    \ computed successfully!\n \n==================================================\n\
    ALL CHECKS PASSED—Your environment is ready!\n==================================================\n\
    ```\n\nIf you don’t get these results, these are some common errors:\n\n*   “CUDA\
    \ is Not available” - You have a CPU-only PyTorch. That’s not the case in Colab,\
    \ unless, of course, you select a CPU backend!\n\n*   “RuntimeError: CUDA out\
    \ of memory” - The provided code downloads a tiny model of less than 1Gb. If you’re\
    \ getting this error you either have a tiny GPU, or, more likely another model\
    \ loaded and ate most of the memory and wasn’t cleared before this run!\n\n* \
    \  The ‘bitsandbytes’ library is compiled against your CUDA installation. I’ve\
    \ seen lots of compilation errors because of mismatches between it and the CUDA\
    \ toolkit. Check your versions carefully!\n\n*   Model Download failures. The\
    \ HuggingFace APIs provide a nice visualization of the fragmented download. Keep\
    \ an eye on these to check for any failure. Models get downloaded to a hidden\
    \ cache directory (~/.cache/huggingface/)—and if there isn’t sufficient space\
    \ here, you can have problems.\n\n## Experiment Tracking\n\nBeyond directory organization,\
    \ you need a way to track what happened during each training run. What was the\
    \ loss at step 1,000? How did the learning rate decay? At which step did the model\
    \ start overfitting? These questions are nearly impossible to answer from log\
    \ files alone, but trivial with a proper experiment tracker.\n\n### Weights and\
    \ Biases (wandb)\n\nWe previously saw Weights & Biases (wandb), and this is the\
    \ standard tool for experiment tracking for most of the ML community. It’s free\
    \ for individual use, integrates easily with your code, and provides a web dashboard\
    \ where you can visualize loss curves, compare runs side by side, and annotate\
    \ your results.\n\nSetting it up is straightforward:\n\n```\n# Create a free account\
    \ at wandb.ai, then\nwandb login\n# Paste your API key when prompted\n```\n\n\
    Once authenticated, the transformers library gives you an API to automatically\
    \ log into wandb. You can also configure it explicitly in your training arguments:\n\
    \n```\nfrom transformers import TrainingArguments\n \ntraining_args = TrainingArguments(\n\
    \    output_dir=\"./outputs/checkpoints\",\n    report_to=\"wandb\",\n    run_name=\"\
    ...\",\n    # ... other arguments\n)\n```\n\nEvery training run becomes a dashboard\
    \ showing loss curves, learning rate schedules, gradient norms, and GPU memory\
    \ usage. You can track them in real time as training progresses, which is useful\
    \ for a manual early stop if things aren’t going well!\n\n### TensorBoard\n\n\
    Part of the TensorFlow ecosystem, is an open source alternative that runs entirely\
    \ locally, and can easily be used in environments like Colab.\n\n```\npip install\
    \ tensorboard\n \n# In your TrainingArguments:\n# report_to=\"tensorboard\"\n\
    \ \n# After training, launch the viewer:\ntensorboard --logdir ./logs\n```\n\n\
    Even if you don’t use these tools, I strongly recommend that you keep a simple\
    \ experiment log—even a spreadsheet or notepad—that records the date, model name,\
    \ dataset version, key hyperparameters (LoRA rank, learning rate, epochs), final\
    \ training loss, and evaluation score for each run.\n\nWhen you’ve run thirty\
    \ experiments and need to find the best one, you’ll be grateful for this discipline.\
    \ You’ll also find that it gets you into a routine of naming your checkpoints\
    \ according to entries in this sheet or notepad, making them easier to find later,\
    \ too!\n\n# Cloud and Pay-as-You-Go\n\nIn the previous section, I used Colab as\
    \ the environment for the model with an A100 backend. It’s a really good option\
    \ if you don’t want to manage ownership of a GPU *or* build your own environment,\
    \ the host does that for you. It’s a great example of Pay-as-you-Go making sense.\n\
    \nBut Colab isn’t the only option, of course. I’d like to introduce some others\
    \ so you can see what’s available.\n\n*Kaggle Notebooks* offer a similar experience\
    \ to Colab. They typically have free GPU access (I have recently seen T4 and P100\
    \ available) that have a 30-hour-per-week quota. That’s really generous. The interface\
    \ is similar to Colab, albeit a little more vanilla notebook. One added bonus\
    \ is for datasets—many are hosted on Kaggle already, so the integration is a little\
    \ easier.\n\n*Lambda Labs* takes it in a different direction. Instead of a notebook,\
    \ you get a full Linux machine via SSH.\n\nThey offer A100 and H100 instances\
    \ and a carte blanche to install your own software, manage your own files, and\
    \ have complete control over the environment.\n\nIt’s really useful if you want\
    \ to poke around in the underlying software stack and not have it fully managed\
    \ for you, and feels more like your own machine in the cloud.\n\n*RunPod* is an\
    \ interesting alternative, operating as a GPU marketplace with both “Community\
    \ Cloud” (cheaper, less reliable) and “Secure Cloud” (more expensive, more reliable)\
    \ options. They offer spot/interruptible instances at lower prices—but the tradeoff\
    \ is that your instance might be pre-empted by others—which is not ideal for long\
    \ training runs. One nice thing is that ML software stacks are usually preinstalled\
    \ which helps your setup time.\n\nAnother interesting option is [Vast.ai](http://vast.ai),\
    \ which is kind of like the Uber of GPU rental. It’s where individual GPU owners\
    \ can rent out their hardware! Of course reliability and security can vary.\n\n\
    Amd also offers *Digital Ocean*, a cloud service with ROCm powered AMD chips available\
    \ to use.\n\n# Local or Cloud—How to Decide\n\nWhile every situation is different,\
    \ I generally follow the following framework to help me decide where and how to\
    \ do any tuning or fine-tuning of a model.\n\nYou now understand the hardware\
    \ options and the software stack. The remaining question is: where do I run this?\
    \ The answer depends on your specific situation, and there’s no universally right\
    \ choice. Here’s a decision framework to help you think through it.\n\nThe first\
    \ question is simple: Do you have a GPU with 16 GB or more of VRAM? If yes, your\
    \ local machine can handle QLoRA on models up to 7B (with 16 GB). More VRAM, bigger\
    \ models. This covers most of what we’ll do in this book. If no, cloud is your\
    \ primary option.\n\nThen I would ask you: Is this a one-time experiment or ongoing\
    \ work? If you’re working through this book and plan to fine-tune models as part\
    \ of your regular work, investing in a local GPU pays for itself within a few\
    \ months. If this is a one-off exploration, cloud gives you access without commitment,\
    \ and typically with much lower outlay.\n\nDo you have data sovereignty requirements?\
    \ Some organizations—particularly in healthcare, finance, and government—have\
    \ strict rules about where data can be processed. If your training data can’t\
    \ leave your premises, local training (or a private cloud deployment) is mandatory.\
    \ This is one of the strongest arguments for local hardware: your data never leaves\
    \ your building."

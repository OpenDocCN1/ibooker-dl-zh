- raw: 'One thing to keep in mind is that there are many options for the environment,
    not least the GPU—AMD and ROCm, or Apple and Metal are valid competitors to NVidia
    and CUDA. For the most part, in this book, I’ll follow the most common path (NVidia
    and CUDA).


    # The GPU: Your First Decision


    Modern language models are typically built on transformer, or transformer-derivative
    architecture– these function primarily using matrix multiplications. A single
    forward pass through a model will involve many thousands of large matrix operations.
    We saw in [Chapter 2](#ch02.html_ch02_model_architectures_the_dna_of_ai_1772730611468542)
    how we multiply weight matrices against input vectors, computing attention scores
    across sequences of tokens, and projecting values through feed forward layers.


    A CPU is designed for sequential logic–branching decisions, routing control flow,
    and threading output. Generally it has a handful of very powerful cores, each
    of which can do one thing very very fast.


    A GPU, on the other hand, can have many thousands of smaller cores. For example,
    an NVidia A100 has almost 7,000 of them! And they are designed to do the same
    operation on many pieces of data simultaneously. Despite being designed for graphics
    (that’s the ‘G’ in GPU!), this also perfectly suits AI’s hunger for matrix multiplication.
    The architecture of the GPU allows you to do thousands of them *in parallel*.


    The result is that AI workloads can be orders of magnitude faster on a GPU than
    on a CPU. So they’re not optional. Don’t worry if you don’t own them—many cloud
    platforms offer access to GPUs by-the-hour, or tools like Google’s Colab will
    give you GPU access for free. We’ll explore those later.


    ## VRAM: One Number to Rule Them All


    Given that GPUs aren’t optional, we now have to explore the memory that’s available
    to the GPU, and that’s VRAM, or Video RAM. Why Video? Well—it’s another holdover
    from video games and GPUs. In our case it has nothing to do with video or games,
    but the important point is that it’s the memory that is *directly* accessible
    to the GPU. Many computers have a motherboard and a CPU with RAM, and then a card
    with the GPU on it as a separate plug-in device. As the GPU needs to work with
    numbers, those numbers have to be in memory—and transferring to and from the system
    RAM through the card slot slows things down. The obvious solution—give the GPU
    Card its own dedicated memory. And that’s VRAM.


    It is a hard constraint that determines what you can and cannot fine-tune effectively.
    If the combined footprint of your model, gradients, optimizer states, activations
    and other overhead exceeds the available VRAM, training will at best be very slow
    (because of all the memory swapping across the card interface and the motherboard),
    or at worst crash completely. My experience has been that if it doesn’t fit in
    VRAM, don’t bother—you’ll be setting yourself up for a world of pain.


    A drawback: VRAM is very expensive. It’s rare to find GPUs with more than 32Gb
    of VRAM without breaking several banks. The solution is *distributed* training,
    where multiple GPUs work in tandem *sharing* their VRAM. 2 GPUs with 32Gb each
    are a lot cheaper than 1 GPU with 64Gb.


    Let’s now get a little deeper into VRAM requirements and take a look at how it
    can and will impact your decisions.


    ### Calculating VRAM requirements for a 7B model


    To fine tune a 7B model, we need to calculate how much VRAM we will use during
    training, and this will start with the *model weights*. As there are 7 billion
    of them, they’ll have an immediate impact. The first thing we need to figure out
    is how much they store based on their precision. You’ll see several methods of
    precision in technical documentation, but the most common four are:


    *   FP32: (32-bit Floating point) - 4 bytes per parameter, so 28B Bytes


    *   FP16: (16-bit Floating point) - 2 bytes per parameter, so 14B Bytes


    *   INT8: (8-bit quantized) - 1 byte per parameter, so 7B Bytes


    *   INT4: (4-bit quantized) - 0.5 bytes per parameter, so 3.5B Bytes


    There are other areas in research looking at different levels of precisions—FP8
    is becoming popular, for example, as are much smaller ones like 2-bit encoding.
    As you can probably guess, the lower the memory, the lower the precision, but
    often we have discovered for tasks like language models, you really don’t need
    32-bit precision. Think about it, when predicting the next token, you don’t gain
    anything from being 99.0000234023523% accurate as opposed to 99.00002% accurate!


    So ultimately there’s a tradeoff, but fine tuners will typically begin with FP16,
    costing 14B bytes off the bat. You can experiment with INT8 and INT4, which I
    would definitely recommend at least to begin with, if you’re hitting memory constraints.


    Next up is the *gradients*. While this book won’t go into depth on the Machine
    Learning process, an important part of it is called *backpropagation*, where,
    in order to adjust parameters, and by definition ‘learn’, the algorithm has a
    gradient that it calculates for the *direction* in which it should adjust a parameter.
    In simplistic terms, that means ‘up’ or ‘down’ and by ‘how much’. Each gradient
    is the *same size* as its associated parameter. The calculations above hold true,
    effectively doubling the amount of memory. So at 16 bit precision, you need 14B
    Bytes for the parameters, and another 14B Bytes for the gradients.


    ###### Note


    A fine-tuning technique called *LoRA* which we will explore in Chapter X doesn’t
    use *all* the parameters, just a very small subset of them. So for example, if
    it only uses 1% of the parameters, that’s 0.14B for the parameters and another
    0.14B for the gradients. That’s very little, and possible to do on a GPU with
    only 8Gb of memory! As a result, you can see why it’s very popular!


    A necessary part of Machine Learning and fine-tuning is to use an *Optimizer*.
    A very common one in fine-tuning is called Adam. The goal of the optimizer is
    to compute the gradients we mentioned above—determining direction and quantity
    that parameters need to move in in order to become more effective at their job
    (aka ‘learning’). The Adam optimizer needs *two* additional values per parameter—a
    running mean, and a running variance. These need to be *highly* accurate, so they
    are typically stored in FP32 regardless of how the weights are encoded. As a result,
    they take up 8 bytes per trainable parameter. So, for a full fine tune of a 7B
    model, that’s 56Gb extra just for the optimizer! Again, if using LoRA, this might
    be 1% of that, or 0.56GB, much more palatable!


    One part of Machine Learning that is often forgotten about storage-wise is *Activations*,**
    where the output of each layer is stored, so it can be used in the backward pass
    to compute the gradients. The memory here depends on the model architecture for
    things like batch size, sequence length etc. For a 7B model with a batch size
    of 1, and a sequence of 2048 tokens, the activations might consume 2-4Gb. Again
    it depends very much on the model architecture, but it’s important to note that
    it will scale linearly with batch size, so that will double for a batch size of
    2 and so on. So when it comes to fine tuning, the memory requirements might constrain
    your batch sizes. Less memory, and you can only do the smallest batch (1), more
    memory and you can do more batches. Another reason why VRAM is important—because
    the more data you can move in a single pass by batching it, the faster your training
    or retraining will move!


    So let’s add these numbers up.


    For full fine tuning at FP16 (Table 3-1):


    | Component || Memory (approximate) |


    | --- | --- |


    | Model Weights (FP16) || 14Gb |


    | --- | --- |


    | Gradients (FP16) || 14Gb |


    | Optimizer States (FP32) || 56Gb |


    | Activations || 2Gb |


    | Total || 84Gb |'

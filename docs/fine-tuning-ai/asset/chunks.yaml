- raw: "Whichever you choose—you will of course need to run Python within it, and\
    \ with that, you’ll also need PyTorch. The next step would be to install PyTorch\
    \ with GPU support, so if you are using an NVidia chip and need CUDA, you have\
    \ to *really* pay attention. I have found that this is the step where most environmental\
    \ problems begin—so keep a close eye on the details.\n\nThe PyTorch foundation\
    \ has done a great job in simplifying this if you start at: [*https://pytorch.org/get-started/locally/*](https://pytorch.org/get-started/locally/),\
    \ but it’s still easy to make a mistake.\n\nYou can see this in [Figure 3-3](#ch03.html_ch03_figure_3_1772730612412252).\n\
    \n![A screen shot of a computer AI-generated content may be incorrect.](assets/ch03_figure_3_1772730612412252.png)\n\
    \n###### Figure 3-3. Starting with PyTorch\n\nNote that, by default, when you\
    \ click ‘Linux’ as your machine type, PyTorch will have the CPU type loaded. That’s\
    \ all very well, but if you’re using a GPU, then PyTorch will effectively ignore\
    \ it! So, you have to look at the Compute Platform column, and *before* you start\
    \ with PyTorch make sure you are using the *exact* version that is listed. Intra-version\
    \ compatibility often leads to problems, and I have found that CUDA releases in\
    \ particular may be later than supported ones. The old adage of ‘use the latest\
    \ version,’ which is typically good advice may not apply here. For example, at\
    \ time of writing, the Compute Platform supports CUDA 12.6, 12.8 and 13.0, but\
    \ the *latest* CUDA is 13.1. While it’s great to have the latest drivers for the\
    \ best support of your machine should you be using it also for gaming or other\
    \ activities, I strongly recommend you *strictly* follow the platform that PyTorch\
    \ supports. In this case, you would use 13.0.\n\nOnce you’ve installed it, you’re\
    \ still not oout of the woods! I would encourage double checking that it’s working\
    \ as recommended with code like this:\n\n```\nimport torch\nprint(f\"PyTorch version:\
    \ {torch.__version__}\")\nprint(f\"CUDA available: {torch.cuda.is_available()}\"\
    )\nif torch.cuda.is_available():\n    print(f\"GPU: {torch.cuda.get_device_name(0)}\"\
    )\n    print(f\"VRAM: {torch.cuda.get_device_properties(0).total_mem / 1e9:.1f}\
    \ GB\")\n```\n\nIf the CUDA available line prints ‘false’, something went wrong.\
    \ You might have CUDA installed, and there’s a mismatch with the PyTorch version,\
    \ or you accidentally installed the CPU version of PyTorch. I hold my hand up\
    \ as guilty there—did it too many times!\n\nAnother thing you can investigate\
    \ is the version that your machine or environment is using by issuing the nvidia-smi\
    \ command. Make sure it matches the one for which you selected a PyTorch environment.\
    \ If it doesn’t get new drivers that match one of the options, clean your system,\
    \ and start again!\n\nIt’s a lot of hassle up front, but it can save you a world\
    \ of hurt down the line.\n\n## The Core Library Stack\n\nNow that we have PyTorch\
    \ verified, and it’s working with the GPU, you’ll next install the libraries you’ll\
    \ use throughout this book. Each serves a specific role, and understanding what\
    \ each one does will help you understand and debug issues later.\n\n*PyTorch*,\
    \ of course, is the deep learning framework everything else is built on. It provides\
    \ the tensor operations, automatic differentiation (autograd), and GPU acceleration\
    \ that power model training. You installed this in the previous step. Check out\
    \ my O’Reilly book “AI and Machine Learning for Coders in PyTorch” if you want\
    \ to learn more.\n\n*Hugging Face Transformers* is the library that provides access\
    \ to thousands of pre-trained models through a consistent API. When you write\
    \ code like \\`AutoModelForCausalLM.from\\_pretrained(“meta-llama/Llama-3.2-3B”)\\\
    `, where models are specified with a namespace, Transformers downloads the model\
    \ architecture and weights from the Hugging Face Hub and turns them into PyTorch\
    \ model that’s ready to use. It handles the differences between architectures—Llama,\
    \ Mistral, Gemma, Phi, Qwen—behind a unified interface, so your training code\
    \ doesn’t need to change when you switch models.\n\n*Hugging Face PEFT* (Parameter-Efficient\
    \ Fine-Tuning) implements the adapter methods that make fine-tuning practical\
    \ on consumer hardware. LoRA, QLoRA, and other techniques are all provided through\
    \ PEFT. When you apply a LoRA adapter to a model, PEFT injects small trainable\
    \ matrices into the model’s layers while freezing the original weights. We’ll\
    \ explore PEFT in depth in Chapter X.\n\n*BitsAndBytes* is the quantization library\
    \ that enables QLoRA specifically. As we saw earlier in this Chapter, in order\
    \ to work on smaller grade GPUs, quantization is necessary, and bitsandbytes is\
    \ your friend for this. It provides 4-bit and 8-bit quantization for model weights,\
    \ allowing you to load a 14 GB model into 3.5 GB of VRAM. It’s developed by Tim\
    \ Dettmers and is tightly integrated with Hugging Face Transformers—you can load\
    \ a model in 4-bit precision with a single argument: \\`load\\_in\\_4bit=True\\\
    `. This library, at time of writing, is *highly* optimized for NVidia. Support\
    \ for other environments (Mac and AMD) is being added all the time, but you may\
    \ hit walls here if you aren’t using an NVidia/CUDA stack.\n\n*TRL* (Transformer\
    \ Reinforcement Learning) provides high-level training APIs. Its \\`SFTTrainer\\\
    ` (Supervised Fine-Tuning Trainer) wraps PyTorch’s training loop with sensible\
    \ defaults for fine-tuning language models. It handles data collation, gradient\
    \ accumulation, logging, checkpointing, and evaluation. TRL also provides \\`DPOTrainer\\\
    ` for direct preference optimization, which we’ll cover in Chapter X.\n\n*Hugging\
    \ Face Accelerate* manages the details of running training across different hardware\
    \ configurations. It handles mixed-precision training (using FP16 or BF16 to speed\
    \ up computation), device placement (making sure tensors end up on the right GPU),\
    \ and distributed training (splitting work across multiple GPUs). In most cases,\
    \ you won’t interact with Accelerate directly—TRL uses it behind the scenes—but\
    \ it’s there if you need to customize your training setup.\n\n*Hugging Face Datasets*\
    \ provides efficient data loading. It uses memory-mapped files and a framework\
    \ called Apache Arrow under the hood, giving you the means to work with datasets\
    \ much larger than your RAM. It integrates with the Hugging Face Hub, so loading\
    \ a public dataset is a one-liner: \\`load\\_dataset(“tatsu-lab/alpaca”)\\`.\n\
    \n*Weights & Biases (wandb)* is an experiment tracking platform. Every training\
    \ run generates metrics—loss curves, learning rates, gradient norms—and you need\
    \ somewhere to store and visualize them. Wandb integrates with TRL’s \\`SFTTrainer\\\
    ` with a single configuration parameter, and its free tier is generous enough\
    \ for individual practitioners.\n\nAll of these can be installed with a single\
    \ pip command:\n\n```\npip install transformers peft bitsandbytes trl accelerate\
    \ datasets \n            wandb sentencepiece protobuf\n```\n\nThe eagle-eyed among\
    \ you might have spotted `sentencepiece` and `protobuf` at the end. These are\
    \ tokenizer dependencies that some models require. Including them pre-emptively\
    \ so you don’t hit a confusing error when you use those models, and wonder if\
    \ there was something missing in your stack!\n\nYou can test this with the code\
    \ I’ve provided in the GitHub as a notebook called Chapter3.ipynb.\n\nWhen run\
    \ on colab with an A100 NVidia GPU, you should see output like this. Note that\
    \ inference worked, as did a very simple fine-tune using LoRA"
  fmt: "\n## Installing PyTorch with GPU Support\n\nWhichever you choose—you will\
    \ of course need to run Python within it, and with that, you’ll also need PyTorch.\
    \ The next step would be to install PyTorch with GPU support, so if you are using\
    \ an NVidia chip and need CUDA, you have to *really* pay attention. I have found\

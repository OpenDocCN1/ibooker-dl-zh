- raw: "At least until now. Now there’s an alternative path forward. I hope that the\
    \ startup has moved into the space of local VLMs so they can get to the best of\
    \ both worlds. If you’re them, and you’re reading this, please reach out and let\
    \ me know!\n\n## The Metadata Leak\n\nThe above story is an example of where the\
    \ *data* that belongs to the customer was a showstopper when designing a product\
    \ that shares it with a third party.\n\nBut it’s not just the data or the prompt\
    \ content that can be a risk. It’s also the metadata. Do note that an API provider,\
    \ even if they don’t look at or leak your data, still knows who you are, when\
    \ you send requests, how big the requests are, and what you might be working on.\n\
    \nIn high-stakes businesses like financial investment, a leak about the things\
    \ you are researching can tip the hands of your competition. For example, in businesses\
    \ that are considering mergers and acquisition (M & A), if it leaked that Company\
    \ A is spending a lot of time looking at the fundamentals of Company B, it could\
    \ be inferred that they’re considering acquiring them. Knowledge of this could\
    \ lead third parties to purchase shares in B and drive up the eventual acquisition\
    \ price. This can easily become a new form of ‘insider trading.\n\n## Compliance\
    \ Issues\n\nFrameworks like GDPR can also make this much stickier. If a user demands\
    \ their data to be deleted, you can remove it from your infrastructure—but what\
    \ if you used it to prompt a third party model? How can you guarantee that it’s\
    \ deleted from their servers?\n\nWhen you own the model, you have full provenance.\
    \ You can show exactly what data you used to fine tune. You can keep logs of all\
    \ data that’s passed into your model for inference—and delete as necessary. You\
    \ can retrain from a clean dataset if you need to.\n\nUltimately—you have control.\n\
    \n## Model Drift\n\nI’ve personally been very surprised by how many times I’ve\
    \ spoken with companies that had a ‘It worked yesterday, it fails today’ problem.\
    \ They didn’t understand why. And the explanation was simple: API providers update\
    \ their models constantly. So, all the effort that goes into prompt engineering—in\
    \ particular injecting commands into the context window—can evaporate overnight.\
    \ The only solution—to re-engineer the prompts and hope the vendor doesn’t introduce\
    \ breaking changes to *your* prompt-- isn’t exactly the most inspiring!\n\nBut,\
    \ of course, owning your own fine-tuned model creates that static artifact that\
    \ you control. It won’t change unless you want it to. And if you do change it,\
    \ you still hold the older versions, so you can introduce regression and gradually\
    \ update your apps that use it!\n\n# The Specialist Revolution\n\nFor a long time\
    \ Scaling Laws were the vectors that pointed to a better future. Bigger—more data,\
    \ more layers, more transformers, more parameters was always better. The direction\
    \ of innovation followed this.\n\nOnce models reached a certain size, it became\
    \ infeasible to host them yourself, and you had to depend on the giants with the\
    \ billion dollar data centers to host them for you, and you pay by the token.\n\
    \nBut that’s no longer strictly true. We are well into the transition towards\
    \ a bifurcation with the era of LLMs being small enough to self-host, licenses\

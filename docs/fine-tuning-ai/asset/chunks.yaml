    Are you training models larger than 13B parameters? For 70B models, even QLoRA
    needs roughly 40 GB of VRAM—beyond any consumer GPU. You need an A100 (cloud)
    or a multi-GPU setup. For models up to 13B, a single RTX 4090 with QLoRA is likely
    enough.


    The approach that most practitioners settle into is a hybrid workflow: develop
    and debug locally (or on free Colab) with a small model and a subset of data,
    then run the full training job on a cloud GPU when everything is working.


    Local is for iteration speed—you can restart a training run in seconds, tweak
    a hyperparameter, and try again without provisioning anything. Cloud is for the
    final training run where you need a bigger GPU or longer runtime.


    The examples in this book are designed to work across three tiers:


    - **Google Colab Free (T4, 16 GB VRAM):** QLoRA on models up to 7B parameters.
    This is the minimum requirement. If you have access to nothing else, you can still
    follow every example.

    - **Local RTX 4090 or Colab Pro A100 (24-40 GB VRAM):** QLoRA on models up to
    13B, or LoRA (without quantization) on 7B models. More flexibility, faster training.

    - **Cloud A100 80 GB:** For the adventurous—LoRA on 70B models, full fine-tuning
    on 7B models, or any experiment where VRAM is the bottleneck.


    Ultimately, when you’ve finished with the book, my advice would be to pick the
    tier that matches your resources and don’t worry about the rest. The techniques
    are the same regardless of which GPU you’re using; only the model size and training
    speed change.


    # Summary


    In this Chapter you walked through setting up your fine-tuning workbench—the hardware,
    software, and environment decisions that underpin everything else in this book.
    We explored why GPU memory (VRAM) is the single most important constraint you’ll
    face, and how techniques like LoRA and QLoRA make fine-tuning accessible on hardware
    you can actually afford. You surveyed the software stack—from PyTorch and Hugging
    Face through to experiment tracking—and compared local and cloud options so you
    can pick the setup that fits your situation and budget.


    With your environment verified and a model downloaded, you now have a solid, working
    foundation. The tools are in place, the math makes sense, and you’re ready to
    focus on what actually matters: your data, your training strategy, and building
    expert models that are truly your own.


    # About the Author


    **Laurence Moroney** is an award-winning researcher and best-selling author. A
    veteran in the programming and machine learning industry, Laurence has authored
    over 20 books, including top selling programming books, science fiction novels,
    and even movie-related comic books. He teaches popular AI specializations on Coursera
    with Andrew Ng of deeplearning.ai. A recognized speaker all over the world, Laurence
    is passionate about demystifying AI and ML for software developers.

    '
  trans: '


    你在训练的模型是否大于 13B 参数？对于 70B 模型，即使 QLoRA 也需要约 40 GB 显存——这超出了任何消费级 GPU 的能力。你需要一块 A100（云端）或多
    GPU 配置。对于不超过 13B 的模型，单块 RTX 4090 搭配 QLoRA 很可能就足够了。


    大多数从业者最终采用的方法是一种混合工作流：先在本地（或免费的 Colab）用小模型和一部分数据开发和调试，等一切正常后，再在云端 GPU 上运行完整的训练任务。


    本地环境是为了迭代速度——你可以几秒钟内重新开始一次训练，调整一个超参数，然后再次尝试，无需准备任何东西。云端则用于最终的训练运行，因为这时你需要更大的 GPU
    或更长的运行时间。


    本书中的示例被设计为可在三个层级上运行：


    - **Google Colab 免费版（T4，16 GB 显存）：** 对不超过 7B 参数的模型使用 QLoRA。这是最低要求。如果你没有任何其他资源，你仍然可以跟随每一个示例。

    - **本地 RTX 4090 或 Colab Pro A100（24–40 GB 显存）：** 对不超过 13B 的模型使用 QLoRA，或对 7B 模型使用
    LoRA（不进行量化）。更灵活，训练也更快。

    - **云端 A100 80 GB：** 适合喜欢挑战的人——对 70B 模型使用 LoRA，对 7B 模型进行全量微调，或任何以显存为瓶颈的实验。


    最后，当你读完这本书时，我的建议是选择与你资源匹配的层级，不必担心其他内容。无论你使用哪种 GPU，技术本身都是一样的；变化的只是模型规模和训练速度。


    # 总结


    在本章中，你逐步完成了微调工作台的搭建——包括硬件、软件和环境决策，这些是本书其余内容的基础。我们探讨了为什么 GPU 内存（显存）是你将面临的最重要的限制，以及
    LoRA 和 QLoRA 这类技术如何让微调在你真正负担得起的硬件上变得可行。你了解了整个软件栈——从 PyTorch 和 Hugging Face 到实验跟踪——并比较了本地和云端方案，以便你选择适合自己情况和预算的配置。


    随着你的环境验证完毕并下载好模型，你现在有了一个扎实可用的基础。工具已就位，数学原理也讲通了，你已经准备好专注于真正重要的事情：你的数据、你的训练策略，以及构建真正属于你自己的专家模型。


    # 关于作者


    **劳伦斯·莫罗尼（Laurence Moroney）**是一位屡获殊荣的研究者和畅销书作家。作为编程和机器学习行业的资深人士，劳伦斯撰写了超过 20 本书，包括畅销编程书籍、科幻小说，甚至与电影相关的漫画书。他在
    Coursera 上与 deeplearning.ai 的吴恩达（Andrew Ng）一起教授广受欢迎的 AI 专项课程。作为一名享誉全球的演讲者，劳伦斯热衷于为软件开发人员揭开
    AI 和 ML 的神秘面纱。


    '

    ## Sparse Mixture of Experts


    While Llama 4 may have been the famous model to broadly use Mixture of Experts,
    Mixtral introduced a transformative version of this—a Sparse Mixture of Experts.
    It’s a fundamentally different approach to scaling.


    In a standard transformer, every token passes through every parameter of the model
    as shown in [Figure 2-10](#ch02.html_ch02_figure_10_1772730611456819).


    ![A diagram of a single person AI-generated content may be incorrect.](assets/ch02_figure_10_1772730611456819.png)


    ###### Figure 2-10. Feed Forward in a Standard transformer


    In a Mixture of Experts model, the feed-forward network (FFN) layer is replaced
    by multiple “expert” FFNs, and a routing/gating network decides which experts
    to use for each token. You can see this in [Figure 2-11](#ch02.html_ch02_figure_11_1772730611456834).


    ![A diagram of a algorithm AI-generated content may be incorrect.](assets/ch02_figure_11_1772730611456834.png)


    ###### Figure 2-11. Sparse Mixture of Experts


    In this case, the input is passed through the attention layers, and the router/gate
    chooses which feed forward network to use. So, for example if the token is ‘code’,
    the top 2 experts that are appropriate may be one that’s dedicated to coding,
    and another that’s dedicated to math. The data is routed to these FFNs, and a
    weighted combination forms the output.


    This is what makes the Mixtral model a ‘Sparse’ Mixture of experts. Instead of
    passing the tokens through *every* expert, and then weighting the output, it simply
    selects 2 and then weights the output.


    With a model like Mixtral 8x7B, the name may suggest it’s a 7B model, but it isn’t—the
    8x7 refers to 8 experts, each of which are close to 7B parameters!


    For each token, the router will select the top 2 experts as shown.


    So, for this model, the total parameters are 46.7B—used to store all experts.
    But for any given inference, only 2 experts are used, so 12.9B parameters are
    used. So, you get the capacity of a much larger model, while paying the computational
    cost of a smaller one at inference time.


    When it comes to fine-tuning, MoE models are tricker to deal with. You might want
    to only fine tune selected experts, or perhaps the routing model. The training
    dynamics are far more complex, and you need much more VRAM to hold all the parameters
    even if the inference is efficient. For many fine tuning projects, a non MoE may
    be an easier approach!


    # Gemma: Google’s Open Approach


    Google entered the open-weights space with a variety of models over the years,
    but the most recent, at time of writing, is called *Gemma*. Based on the same
    research that powers Google giant hosted Gemini models, Gemma comes in a variety
    of sizes. The most recent version at time of writing, Gemma 3, comes in variations
    from 270M parameters up to 27B.


    One key characteristic of Gemma is that many of the variations of Gemma are *instruction
    tuned* from the start. This means that they are already aligned to follow instructions,
    making them ready for many tasks out of the box. When you inspect the list of
    Gemma models on a hub like huggingface ([Gemma 3 release](https://huggingface.co/collections/google/gemma-3-release))
    you’ll see all of them listed, and for Gemma 3 it looks like [Figure 2-12](#ch02.html_ch02_figure_12_1772730611456848).


    ![A screenshot of a computer AI-generated content may be incorrect.](assets/ch02_figure_12_1772730611456848.png)


    ###### Figure 2-12. Gemma on HuggingFace


    You’ll see some models with the prefix ‘-it’ for ‘Instruction Tuned’, and ‘-pt’
    for ‘Pre Trained’. The latter hasn’t had additional alignment to make it useful
    for chat scenarios, and instead is just raw tokens in and tokens out. This is
    pretty powerful for you to be able to create your own instruction tuning, without
    needing to work around Google’s work here.


    Given the variety of sizes, there are slightly different architectures with Gemma
    3 when it comes to managing the KV cache.


    The *Standard* size lineup (4B, 12B, and 27B sizes) all use Grouped Query Attention
    (GQA) as outlined above. This is the secret to how small models like these can
    support a *128K Context Window* without the memory requirements for the KV cache
    exploding.


    The *Smaller* size lineup (1B and 270M) are optimized for on-device speed. They
    use a new attention type called *Multi Query Attention* (MQA) which is a very
    aggressive GQA where *all* attention heads share a single key/value head. This
    makes it very fast, but it loses nuance. It does keep the model small enough to
    perform on basic hardware.


    ###### Note


    Gemma 3 has a unique twist on GQA with something called an *attention ratio*.
    The goal here is to mix the use of the sliding window. 5 out of every 6 layers
    use a sliding window of 1024 tokens as we discussed earlier, but 1 out of every
    6 will look at the full 128k context!


    # Tokenizers and Embeddings


    In the discussion on architectures, it’s also important to think about different
    methods for tokenization (conversion of the human-language words into numbers
    that represent them,) and embeddings (giving a high dimensional vector representation
    for a token to try to capture context), and methodologies to use these efficiently.


    ## Tokenization


    When we look in detail at tokenization, and define it as the process of breaking
    text into discrete units that the model can process, we can see that it will be
    more complex that simply splitting on words.


    Some reasons for this may be situations like:


    *   Rare words would require enormous vocabularies. Is it worth having a token
    dedicated to the word ‘antidisestablishmentarianism’?


    *   Non-English Languages may handle spacing between words differently


    *   Typos, new words, and code would be very difficult to handle


    *   Variants of a word (‘run’,’ running’, ‘runs’) would be completely separate
    from each other, potentially losing their semantic similarity.


    To overcome this, most modern LLMs use *subword* tokenization, where the vocabulary
    consists of common words, or pieces of them. It gives a balance—common words like
    ‘the’ will be single tokens, which is efficient, while more rare words will be
    broken down into multiple tokens like ‘anti’, ‘dis’, ‘esta’, ‘blish’ etc.


    The tokenizer choice matters because different models use different tokenizers,
    trained on different data! The tokenizer will have a vocabulary of tokens that
    it works with, and this affects efficiency. Models like Llama 2 have 32,000 tokens,
    and LLama 3 has over 128,000. A larger vocab means common words and phrases are
    more likely to be single tokens—which will reduce sequence length, giving you
    more information within the context window. But it also means bigger embedding
    matrices, giving you a tradeoff.


    ### Understanding Language and Tokenization


    If you are working with models for code or special characters, the tokenizers
    will vary widely. Many are trained primarily on *English* text, and won’t be optimized
    for code. Others will have programming languages in their training data—and most
    notably, the tokenizers used will be ‘code friendly’ in their vocab.


    Additionally, when it comes to multilingual coverage, a tokenizer that is trained
    on English will likely fragment non-English text into many smaller tokens.


    Consider the phrase ‘你好世界’ which is ‘Hello World’ in Chinese. If this uses a tokenizer
    trained on English text, it will encode this into 4 separate tokens, representing
    the Unicode characters for the Chinese text \[你\]\[好\]\[世\]\[界\]'

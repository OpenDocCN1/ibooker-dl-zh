- raw: 'For *language translation* this was essential, because when translating one
    language to another, one needs to look ahead and behind in a sentence to be able
    to translate it effectively.


    But for *generation* purposes, one cannot pay attention to words that are ‘ahead’,
    because they don’t exist yet. If you have a sequence of tokens like ‘The cat sat’,
    then you can only look back for attention. This process is called ‘causal’ attention,
    where each position will only attend to previous positions in the sequence. This
    is achieved using a mask on the tokens to prevent lookahead, as shown in [Figure 2-6](#ch02.html_ch02_figure_6_1772730611456757).


    ![A sheet of paper with text AI-generated content may be incorrect.](assets/ch02_figure_6_1772730611456757.png)


    ###### Figure 2-6. Decoder and Causal Attention


    As such, an encoder isn’t needed with its bidirectional self attention, and only
    the decoder is necessary.


    The decoder-only architecture became very popular with open source models like
    Llama or Mistral.


    It’s relatively simple! It has one architecture, and one training objective (next
    token prediction), which makes it easier to scale. It also has unified input and
    output. Ultimately, the same architecture handles both “understanding” the prompt
    and “generating” the response. There’s no artificial boundary between input and
    output.


    Researchers discovered that decoder-only models, when scaled sufficiently, develop
    remarkable capabilities, including in-context learning, chain-of-thought reasoning,
    and instruction following, without being explicitly trained for these tasks.


    For training and fine-tuning, every position in the sequence provides a training
    signal (predicting the next token), making training data highly efficient.


    When you fine-tune these models, you will most likely work with this decoder-only
    architecture. The training process adjusts the model’s weights so that given your
    specific prompts and contexts, it can predict the next token in a way that matches
    your desired outputs.


    # Grouped Query Attention (GQA)


    To understand Grouped Query Attention (GQA), it’s good to look at the early history
    of Llama.


    Open, tunable, models are pretty much synonymous with this model. While the term
    ‘open source’ is typically used to describe them, I generally resist this because
    we don’t have the source, or the data. What we do have is the pre-trained weights
    of the model under various open source licenses so we can modify it, and papers
    describing the architecture.


    The first version of this was released in February 2023 with a relatively standard
    transformers implementation. Its overall significance was to demonstrate that
    smaller, well-trained models were in the game–at least when comparing with larger
    models using standard benchmarks. It should be noted that many benchmarks were
    invented with larger models in mind, so the idea of benchmarks will need to evolve
    as more smaller models come online. Similarly, while the performance against benchmarks
    might have been equivalent, the context window size was the biggest notable difference
    between smaller and larger models. Llama had a context window of only 2,048 tokens.


    A few months later, version 2 was introduced that doubled the context window size
    (to 4,096 tokens), as well as a new innovation called ‘Grouped Query Attention
    (GQA), which was a crucial optimization for performance. You’ll also see that
    it’s the constraints of going smaller that has driven innovation, and GQA is an
    excellent example of that.


    A little over a year after the first release, LLama 3 doubled the context window
    size again—to 8,192 tokens in the small model, as well as a family of larger ones
    with up to 128k tokens. It also improved the vocabulary, with 128k tokens, a 4x
    improvement, as well as updates to their implementation of GQA.


    So let’s explore what GQA is, and why it’s so important.


    Grouped Query Attention is one of the most important optimizations in modern LLMs,
    and understanding it will help you make better decisions about which model to
    choose in solving your problem.


    In standard multi-head attention, as you saw earlier in this chapter, each head
    has its own Query, Key, and Value projections. During inference, the Key and Value
    tensors for all previous tokens must be cached (this is the “KV cache”) to avoid
    recomputing them at each generation step.


    For long sequences, this cache becomes a significant memory bottleneck.


    You can see this in [Figure 2-7](#ch02.html_ch02_figure_7_1772730611456773).


    ![A diagram of a diagram AI-generated content may be incorrect.](assets/ch02_figure_7_1772730611456773.png)


    ###### Figure 2-7. Multi-Head Attention and KV Cache Size


    The idea of GQA is to strike a balance here by grouping Query heads, with each
    group sharing K and V projections. You can see this in [Figure 2-8](#ch02.html_ch02_figure_8_1772730611456788).


    ![A diagram of a number of questions AI-generated content may be incorrect.](assets/ch02_figure_8_1772730611456788.png)


    ###### Figure 2-8. Grouped Query Attention


    In this simple example, where there are 6 heads, instead of each Q having its
    own dedicated KV, we have a situation where Q1 and Q2 share a KV, Q3 and Q4 share
    one etc. This gives us a 50% reduction in KV Cache size.


    In LLama 3 8B, there are 32 query heads grouped into 8 groups of 4, and each shares
    8 key-value heads.


    This reduces the KV cache by 75% compared to standard multi-head attention, dramatically
    improving inference speed and reducing memory requirements—especially for long
    contexts.


    So, when it comes to fine tuning, it’s good to consider models that use GQA because
    they can give you better inference performance without sacrificing much quality.


    # Continued Innovation: Mistral and Mixtral


    Continuing the story of innovation being driven by smaller models, and the needs
    for efficiency that can be generally forgotten in larger models, let’s now explore
    Mistral and Mixtral.


    Mistral 7B, introduced in September 2023 demonstrated that a relatively small
    model—only 7B—could compete with much larger models on benchmarks. It did with
    several key innovations.


    ## Sliding Window Attention


    As we pay attention to previous tokens, the longer the sequence of tokens, the
    more the scale of being able to manage it explodes in size. So, if every token
    has to look at every other token, including itself, we end up with a quadratic
    number of lookups. For 2 tokens, there would be 2 comparisons of 2 tokens each,
    so 4 lookups. With 10 tokens, this becomes 100. With 1,000 tokens we now have
    1 Million lookups! How large would this get for a context window of 128k tokens?


    Mistral introduced a sliding window, where each token only directly attends to
    the previous 4,096 tokens. Your initial thoughts on this might be that information
    outside the context window might be lost, but think about it a little.


    If the context is 128k tokens, and you are using a sliding window of only 4k,
    it may feel like the majority of tokens are ignored.


    But in a multi-layer model, this isn’t necessarily true. Let’s explore this.


    ![A diagram of a diagram AI-generated content may be incorrect.](assets/ch02_figure_9_1772730611456804.png)


    ###### Figure 2-9. Sliding Window Context movement.


    Imagine 10 tokens, with a 4 token context window. So, for example for tokens 7
    through 10, the output of our sliding window will be the ‘rightmost’ token in
    Layer 2. Similarly, the window of tokens 4 through 7 will have an output at an
    equivalent position for token 7.


    You can see that 5 through 8 will output at position 8, and 6 through 9 will output
    at position 9, though these aren’t drawn in [Figure 2-9](#ch02.html_ch02_figure_9_1772730611456804).


    Then, when you get to layer 3, the token at position 10 is actually receiving
    context from all the way at position 4 because of the ‘pyramid’ effect with the
    context being fed through the layers.'

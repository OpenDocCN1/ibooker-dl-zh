    对于*语言翻译*来说，这一点至关重要，因为当把一种语言翻译成另一种语言时，需要查看句子中前后的词才能有效地进行翻译。


    但对于*生成*任务来说，你不能关注“前面”的词，因为它们还不存在。如果你有一个像“The cat sat”这样的 token 序列，那么你只能向后看以进行关注。这个过程被称为“因果”（causal）注意力，在这种机制中，每个位置只会关注序列中之前的位置。这是通过对
    token 施加掩码来实现的，以防止向前看，如图图 2-6 所示。


    ![一张带有文字的纸，AI 生成的内容可能不正确。](img/ch02_figure_6_1772730611456757.png)


    **图 2-6. 解码器与因果注意力**


    因此，不需要带有双向自注意力的编码器，只需要解码器即可。


    仅解码器架构在 Llama 或 Mistral 等开源模型中变得非常流行。


    它相对简单！它只有一个架构和一个训练目标（下一个 token 预测），因此更容易扩展。它还有统一的输入和输出。最终，同一个架构既可以“理解”提示，也可以“生成”响应。输入和输出之间没有人为的界限。


    研究人员发现，仅解码器模型在扩展到足够规模时，会发展出显著的能力，包括上下文学习、思维链推理和指令遵循，而无需针对这些任务进行显式训练。


    对于训练和微调，序列中的每个位置都提供一个训练信号（预测下一个 token），这使得训练数据的利用率非常高。


    当你微调这些模型时，你很可能会使用这种仅解码器架构。训练过程会调整模型的权重，使得在给定你的特定提示和上下文时，它能够以符合你期望输出的方式预测下一个 token。


    # 分组查询注意力（GQA）


    要理解分组查询注意力（GQA），最好先看看 Llama 的早期历史。


    开放、可调优的模型几乎就是这种模型的代名词。虽然“开源”这个术语通常被用来描述它们，但我一般不太认同这种说法，因为我们没有源代码，也没有数据。我们所拥有的只是在各种开源许可下发布的模型预训练权重（因此我们可以修改它），以及描述其架构的论文。


    首个版本于 2023 年 2 月发布，采用了相对标准的 Transformer 实现。它的总体意义在于证明了更小但训练良好的模型也能参与竞争——至少在标准基准测试上与更大的模型相比时是如此。需要指出的是，许多基准测试是围绕更大模型设计的，因此随着更多小型模型的出现，基准测试的理念也需要演进。同样，虽然在基准测试上的性能可能相当，但上下文窗口大小是小模型与大模型之间最显著的区别。Llama
    的上下文窗口只有 2048 个 token。


    几个月后，版本 2 发布，将上下文窗口大小翻倍（增加到 4096 个 token），并引入了一项新创新——称为“分组查询注意力（GQA）”，这是对性能至关重要的优化。你还会看到，正是小型化带来的约束推动了创新，GQA
    就是一个绝佳的例子。


    在首次发布后一年多一点，Llama 3 再次将上下文窗口大小翻倍——小模型达到 8192 个 token，更大的模型系列则高达 128k 个 token。它还改进了词汇表，达到
    128k 个 token，提升了 4 倍，并更新了 GQA 的实现。


    那么，让我们来探讨 GQA 是什么，以及它为何如此重要。


    分组查询注意力是现代 LLM 中最重要的优化之一，理解它有助于你在解决问题时更好地决定选择哪个模型。


    在标准的多头注意力中，正如你本章前面所看到的，每个头都有自己的查询（Query）、键（Key）和值（Value）投影。在推理过程中，必须缓存所有之前 token
    的键和值张量（即“KV 缓存”），以避免在每一步生成时重新计算它们。


    对于长序列，这个缓存会成为显著的内存瓶颈。


    你可以在图 2-7 中看到这一点。


    ![一个图表的示意图，AI 生成的内容可能不正确。](img/ch02_figure_7_1772730611456773.png)


    **图 2-7. 多头注意力与 KV 缓存大小**


    GQA 的思想是在这里通过分组查询头来取得平衡，每组共享 K 和 V 投影。你可以在图 2-8 中看到这一点。


    ![一个关于若干问题的示意图，AI 生成的内容可能不正确。](img/ch02_figure_8_1772730611456788.png)


    **图 2-8. 分组查询注意力**


    在这个简单的例子中，有 6 个头，不是每个 Q 都有自己专用的 KV，而是 Q1 和 Q2 共享一个 KV，Q3 和 Q4 共享一个，依此类推。这使 KV
    缓存大小减少了 50%。


    在 Llama 3 8B 中，32 个查询头被分成 8 组，每组 4 个，并且每组共享 8 个键值头。


    与标准的多头注意力相比，这将 KV 缓存减少了 75%，大幅提升了推理速度并降低了内存需求——尤其是在长上下文场景下。


    因此，在进行微调时，最好考虑使用 GQA 的模型，因为它们能在不牺牲太多质量的情况下提供更好的推理性能。


    # 持续创新：Mistral 和 Mixtral


    继续讲述由更小模型驱动的创新故事，以及那些在更大模型中往往被忽视的效率需求，让我们现在来探讨 Mistral 和 Mixtral。


    Mistral 7B 于 2023 年 9 月推出，它证明了相对较小的模型——只有 7B——也能在基准测试上与更大的模型竞争。它凭借几项关键创新做到了这一点。


    ## 滑动窗口注意力


    当我们关注之前的 token 时，token 序列越长，需要管理的规模就越呈爆炸式增长。因此，如果每个 token 都必须查看其他每个 token（包括它自己），我们最终会得到二次方数量的查找。对于
    2 个 token，会有 2 次比较，每次比较 2 个 token，所以是 4 次查找。对于 10 个 token，则为 100 次。对于 1000 个 token，就是
    100 万次查找！那么对于 128k 个 token 的上下文窗口，这个数字会变得多大呢？


    Mistral 引入了滑动窗口，其中每个 token 只直接关注之前的 4096 个 token。你最初可能会认为，上下文窗口之外的信息会丢失，但请再仔细想一想。


    如果上下文是 128k 个 token，而你只使用 4k 的滑动窗口，可能会感觉大多数 token 都被忽略了。


    但在多层模型中，情况未必如此。让我们来探讨一下。


    ![一个图表的示意图，AI 生成的内容可能不正确。](img/ch02_figure_9_1772730611456804.png)


    **图 2-9. 滑动窗口上下文的移动**


    想象一下 10 个 token，使用 4 个 token 的上下文窗口。例如，对于 token 7 到 10，我们滑动窗口的输出将是第 2 层中的“最右侧”token。类似地，token
    4 到 7 的窗口会在与 token 7 对应的位置产生输出。


    你可以看到，5 到 8 会在位置 8 产生输出，6 到 9 会在位置 9 产生输出，尽管这些没有画在图 2-9 中。


    然后，当你到达第 3 层时，位置 10 的 token 实际上接收到了从位置 4 一路传递过来的上下文，这是通过各层传递上下文的“金字塔”效应实现的。


    在标准 Transformer 中，每个 token 都会经过模型的每一个参数，如 图 2-10 所示。


    ![一张单人示意图，AI 生成的内容可能不正确。](img/ch02_figure_10_1772730611456819.png)


    ###### 图 2-10. 标准 Transformer 中的前馈网络


    在混合专家模型中，前馈网络（FFN）层被多个“专家”FFN 替代，由路由/门控网络决定每个 token 使用哪些专家。你可以在 图 2-11 中看到这一点。


    ![一张算法示意图，AI 生成的内容可能不正确。](img/ch02_figure_11_1772730611456834.png)


    ###### 图 2-11. 稀疏混合专家


    在这种情况下，输入会先经过注意力层，然后由路由器/门控选择使用哪个前馈网络。例如，如果 token 是“code”，那么最匹配的 2 个专家可能分别是一个专门处理编程的专家，和一个专门处理数学的专家。数据被路由到这些
    FFN，并通过加权组合形成输出。


    这就是 Mixtral 模型成为“稀疏”混合专家的原因。它不是让 token 经过*每一个*专家再对输出加权，而是只选择 2 个专家，然后对它们的输出加权。


    以 Mixtral 8x7B 这样的模型为例，名称可能让人以为它是一个 7B 模型，但实际上并非如此——8x7 指的是 8 个专家，每个专家都接近 7B 参数！


    对于每个 token，路由器会选择排名前 2 的专家，如图所示。


    因此，对于这个模型，总参数为 46.7B——用于存储所有专家。但在任何一次推理中，只会用到 2 个专家，因此实际使用 12.9B 参数。这样，你既获得了更大模型的容量，又在推理时只付出较小模型的计算成本。


    在微调方面，MoE 模型处理起来更棘手。你可能只想微调选定的专家，或者只微调路由模型。训练动态要复杂得多，而且即使推理很高效，你也需要更大的显存（VRAM）来容纳所有参数。对于许多微调项目，非
    MoE 模型可能是更简单的选择！


    # Gemma：谷歌的开放方法


    多年来，谷歌凭借多种模型进入了开放权重领域，但截至撰写本文时，最新的模型名为*Gemma*。Gemma 基于驱动谷歌托管的大型 Gemini 模型的同一研究，提供多种尺寸。截至撰写本文时，最新版本
    Gemma 3 的参数量从 270M 到 27B 不等。


    Gemma 的一个关键特点是，许多 Gemma 变体从一开始就经过了*指令微调*。这意味着它们已经对齐到可以遵循指令的状态，开箱即可用于许多任务。当你在 huggingface
    之类的模型库中查看 Gemma 模型列表（[Gemma 3 发布](https://huggingface.co/collections/google/gemma-3-release)）时，会看到所有模型，对于
    Gemma 3 来说，情况如 图 2-12 所示。


    ![一张计算机截图，AI 生成的内容可能不正确。](img/ch02_figure_12_1772730611456848.png)


    ###### 图 2-12. HuggingFace 上的 Gemma


    你会看到一些模型带有前缀 `-it`，表示“指令微调”（Instruction Tuned），以及 `-pt`，表示“预训练”（Pre Trained）。后者没有进行额外的对齐以适用于聊天场景，而只是原始的
    token 进、token 出。这对你来说非常有用，因为你可以在不需要绕开谷歌已有工作的前提下，创建自己的指令微调。


    由于尺寸多种多样，Gemma 3 在管理 KV 缓存时采用了略有不同的架构。


    *标准*尺寸系列（4B、12B 和 27B）都使用前面概述的分组查询注意力（Grouped Query Attention，GQA）。这就是为什么像这样的小模型能够支持
    *128K 上下文窗口*，而不会让 KV 缓存的内存需求爆炸。


    *较小*尺寸系列（1B 和 270M）针对设备端速度进行了优化。它们使用一种称为*多查询注意力*（Multi Query Attention，MQA）的新型注意力机制，这是一种非常激进的
    GQA 版本，其中*所有*注意力头共享一个键/值头。这使得它非常快，但会失去一些细粒度。它确实能让模型足够小，从而在基础硬件上运行。


    ###### 注意


    Gemma 3 在 GQA 上有一个独特的设计，即所谓的*注意力比率*。其目标是混合使用滑动窗口。正如我们之前讨论的，每 6 层中有 5 层使用 1024
    个 token 的滑动窗口，而每 6 层中有 1 层会查看完整的 128k 上下文！


    # 分词器与嵌入


    在讨论架构时，还需要考虑不同的分词（tokenization）方法（将人类语言词汇转换为代表它们的数字）和嵌入（embedding）方法（为 token 赋予高维向量表示以试图捕捉上下文），以及高效使用这些方法的技术手段。


    ## 分词


    当我们仔细审视分词，并将其定义为将文本拆分为模型可以处理的离散单元的过程时，我们会发现它比简单的按词拆分要复杂得多。


    这种复杂性的原因可能包括：


    *   罕见词需要极其庞大的词汇表。为“antidisestablishmentarianism”这样的词专门设置一个 token 是否值得？


    *   非英语语言可能以不同方式处理单词间的空格


    *   拼写错误、新词和代码会非常难以处理


    *   一个词的变体（“run”、“running”、“runs”）会彼此完全独立，从而可能失去它们的语义相似性。


    为了克服这一点，大多数现代 LLM 使用*子词*分词，其词汇表由常见词或其片段组成。这提供了一种平衡——“the”这样的常见词会成为单个 token，效率很高，而更罕见的词则会被拆分为多个
    token，如“anti”、“dis”、“esta”、“blish”等。


    分词器的选择很重要，因为不同的模型使用不同的分词器，而分词器是在不同数据上训练的！每个分词器都有自己的一套工作词汇，这会影响效率。Llama 2 等模型有
    32,000 个 token，而 LLama 3 有超过 128,000 个 token。更大的词汇量意味着常见单词和短语更有可能成为单个 token——这会缩短序列长度，让你在上下文窗口中获得更多信息。但这也意味着更大的嵌入矩阵，因此需要权衡。


    ### 理解语言与分词


    如果你使用的是处理代码或特殊字符的模型，分词器会千差万别。许多分词器主要针对*英语*文本训练，并未针对代码优化。另一些分词器的训练数据中则包含编程语言——最值得注意的是，它们使用的分词器在词汇上对“代码友好”。


    此外，在多语言覆盖方面，在英语文本上训练的分词器很可能会将非英语文本切分成许多更小的 token。


    考虑中文短语“你好世界”，即“Hello World”的中文表达。如果使用在英语文本上训练的分词器，它将被编码为 4 个独立的 token，分别代表中文文本的
    Unicode 字符 \[你\]\[好\]\[世\]\[界\]

    '

- raw: 'There will come a point—maybe not in this book, but hopefully sometime in
    your fine-tuning career—when a single GPU isn’t enough.


    Maybe you need to train a 70B model that doesn’t fit on one card even with QLoRA.
    Maybe you have a production deadline and need to train faster. Or maybe new model
    innovations have grown so far that they’ve outpaced the readily available VRAM
    sizes. So you can combine CPUs and pool their VRAM, but that comes with overhead.


    There are two fundamental strategies to work with multiple GPUs to solve this
    problem:


    *Data parallelism* copies the *entire* model onto *each* GPU, then splits each
    training batch across the GPUs. Each GPU processes its slice of the batch independently,
    computes gradients, and then the gradients are averaged across GPUs before updating
    the model. The *model* must fit on each individual GPU, but training is faster
    because you’re effectively multiplying your batch throughput by the number of
    GPUs. So, when it comes to VRAM size, you have to take into account how much the
    model takes up, and that will be replicated across each GPU, eating multiples
    of the available VRAM. The rest of the available VRAM headspace will be used for
    everything else, and that can typically be shared.


    *Model parallelism* (sometimes also called tensor parallelism or pipeline parallelism,
    depending on the approach) splits the *model* itself across multiple GPUs. Different
    layers—or even different parts of the same layer—live on different cards. This
    lets you train models that are too large to fit on any single GPU. It’s more complex
    to set up and has significant communication overhead, but it’s the only way to
    handle truly large models on limited hardware.


    Frankly, you’ll typically have to use model parallelism, because while data parallelism
    is better for speeding up training, the replication of the model across different
    GPUs means that things like the optimizer weights become very difficult to manage
    without eating excess VRAM.


    Fortunately the HuggingFace ‘accelerate’ library makes handling this very approachable.


    You can start it by calling the following code:


    ```

    accelerate config

    ```


    This will walk you through an interactive setup where you can specify your GPU
    system—how many you have, what type of parallelism you want, and how to use precision.
    Once you’ve got that then you can start your training with code like this:


    ```

    accelerate launch train.py

    ```


    This will use the configuration and span your training load across available GPUs
    as specified.


    That said, for the models and techniques covered in this book, I will focus on
    using a single low VRAM GPU with LoRA and QLoRA .


    Multi-GPU is a “nice to have” for speed, or if you are working with larger models,
    but it is not a prerequisite for capability. If you have access to multiple GPUs
    (say, through a cloud instance with 4× A100s), \`accelerate\` makes it easy to
    take advantage of them. If you don’t, the good news is that you won’t be left
    behind when skilling up!


    # The Software Stack


    Now that you understand the hardware requirements, choosing your software stack
    is probably a bit easier. In this section, we’ll talk through the stack, starting
    with the operating system.


    ## Choosing Your Operating System


    Ultimately, you want an OS that supports your hardware! Or, if you are choosing
    cloud-based hardware, you at least need to understand the software stack that
    the cloud service provider gives you.


    ### Using Linux


    The default choice is generally some form of Linux. If you’re creating your own
    rig, Ubuntu is the best flavor of this because of its support. For example NVidia
    drivers and CUDA have first-class Ubuntu support, and virtually every tutorial,
    Docker image, or Cloud template you’ll see likely assumes you are using it.


    If you aren’t familiar with Linux, I’d encourage you to set up a Linux machine
    using the LTS (Long Term Support) version of Ubuntu. At time of writing, this
    is Ubuntu 22.04 LTS.


    ### Using Windows


    Windows is an interesting operating system, to be sure! Once the stalwart of the
    Web and Server business, it kinda lost its way to Linux-based systems thanks to
    the LAMP (Linux, Apache, Php, MySql) stack. As the cloud evolved, this only accelerated.
    On the Desktop, Windows is still quite popular, but that popularity has massively
    waned with the popularity of Apple desktop and laptop computers running MacOS.


    To that end, Microsoft introduced WSL2 (Windows Subsystem for Linux 2) which is
    surprisingly good. It runs a real Linux kernel, and has native CUDA passthrough
    where your Windows NVidia drivers are shared directly with the WSL2 environment,
    meaning you don’t need separate installations of them inside of WSL. Given that
    Windows is still the primary desktop operating system used for *gaming*, NVidia
    will continue to support Windows as a first class system.


    It’s not a *bad* option, and it’s worth considering if you are already using Windows.
    But directly using Linux instead of a ‘subsystem’ is likely to introduce less
    complexity.


    ### Using macOS


    For macOS users on Apple Silicon, the situation is continually evolving. PyTorch’s
    MPS backend works for basic training, and MLX ([*https://opensource.apple.com/projects/mlx/*](https://opensource.apple.com/projects/mlx/))
    provides a more native experience. Apple has clearly invested heavily in Machine
    Learning, and are building the software stack to match.


    The primary limitation is ecosystem breadth: libraries like bitsandbytes have
    limited macOS support, and most troubleshooting resources assume NVIDIA hardware.


    My primary system is a Mac Mini, and I use it for many ML tasks, but for fine
    tuning anything but the smallest models, it can be a bit of a stretch. That being
    said, it’s nice to be able to use your primary system, and not have to build a
    dedicated one. So, if you, like me, are a Mac person—don’t rush out to buy a Linux
    box with an Nvidia GPU *just* yet. You may be able to do enough with your Mac!


    And when it doesn’t have the power, using your Mac as a thin client to a cloud
    GPU is a valid way forward—SSH into a cloud instance and run your training there.
    Or, of course, using something like Colab within your browser.


    ## Your Programming Environment


    Let’s start with your programming language. While there are many options with
    various levels of maturity, there’s really only one you should start with—and
    that’s Python. It has the best support in terms of libraries for all ML and FT
    tasks, as well as an enormous support ecosystem. It’s hard to think about being
    effective in any way with ML and FT without first using Python. Later, you might
    start thinking about low-level efficiency and running code closer to the metal
    than you would with a high level interpreted language like Python, but don’t get
    distracted by those! Solidify your base with Python first.


    That comes with a drawback. With such a variety of ecosystems, there’s massive
    drift in version support, not just of Python, but also adjacent technologies like
    CUDA. To get around this, understanding Virtual environments is a massive prerequisite.


    There are two main approaches to this: *Conda* or *Venv*.


    *Conda* is the more comprehensive choice. Conda manages not just Python packages
    but also system-level dependencies like CUDA toolkit versions. This means you
    can have one environment with CUDA 11.8 and another with CUDA 12.1, switching
    between them seamlessly. For beginners or anyone who wants their CUDA management
    handled automatically, I would encourage time and effort investing in Conda!


    *Venv (with pip)* is a much lighter weight option. It works really well if CUDA
    is already installed system-wide, is faster to set up, and pretty easy to manage.
    I personally like the control I get with multiple Venv setups, and in particular
    working with a Mac where I don’t have to worry about CUDA, it makes my ML life
    a lot easier!'

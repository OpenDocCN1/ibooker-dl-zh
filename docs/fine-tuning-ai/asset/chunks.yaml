    At least until now. Now there’s an alternative path forward. I hope that the startup
    has moved into the space of local VLMs so they can get to the best of both worlds.
    If you’re them, and you’re reading this, please reach out and let me know!


    ## The Metadata Leak


    The above story is an example of where the *data* that belongs to the customer
    was a showstopper when designing a product that shares it with a third party.


    But it’s not just the data or the prompt content that can be a risk. It’s also
    the metadata. Do note that an API provider, even if they don’t look at or leak
    your data, still knows who you are, when you send requests, how big the requests
    are, and what you might be working on.


    In high-stakes businesses like financial investment, a leak about the things you
    are researching can tip the hands of your competition. For example, in businesses
    that are considering mergers and acquisition (M & A), if it leaked that Company
    A is spending a lot of time looking at the fundamentals of Company B, it could
    be inferred that they’re considering acquiring them. Knowledge of this could lead
    third parties to purchase shares in B and drive up the eventual acquisition price.
    This can easily become a new form of ‘insider trading.


    ## Compliance Issues


    Frameworks like GDPR can also make this much stickier. If a user demands their
    data to be deleted, you can remove it from your infrastructure—but what if you
    used it to prompt a third party model? How can you guarantee that it’s deleted
    from their servers?


    When you own the model, you have full provenance. You can show exactly what data
    you used to fine tune. You can keep logs of all data that’s passed into your model
    for inference—and delete as necessary. You can retrain from a clean dataset if
    you need to.


    Ultimately—you have control.


    ## Model Drift


    I’ve personally been very surprised by how many times I’ve spoken with companies
    that had a ‘It worked yesterday, it fails today’ problem. They didn’t understand
    why. And the explanation was simple: API providers update their models constantly.
    So, all the effort that goes into prompt engineering—in particular injecting commands
    into the context window—can evaporate overnight. The only solution—to re-engineer
    the prompts and hope the vendor doesn’t introduce breaking changes to *your* prompt--
    isn’t exactly the most inspiring!


    But, of course, owning your own fine-tuned model creates that static artifact
    that you control. It won’t change unless you want it to. And if you do change
    it, you still hold the older versions, so you can introduce regression and gradually
    update your apps that use it!


    ## The Specialist Revolution


    For a long time Scaling Laws were the vectors that pointed to a better future.
    Bigger—more data, more layers, more transformers, more parameters was always better.
    The direction of innovation followed this.


    Once models reached a certain size, it became infeasible to host them yourself,
    and you had to depend on the giants with the billion dollar data centers to host
    them for you, and you pay by the token.


    But that’s no longer strictly true. We are well into the transition towards a
    bifurcation with the era of LLMs being small enough to self-host, licenses that
    allow for this, and open pre-trained models being freely shared. With the ability
    to further fine tune those models on your downstream tasks, and your particular
    data, you now have a viable alternative.


    In early 2023, the release of LLaMA started this ball rolling. And, it proved
    that well-engineered models, despite their much smaller size, could punch way
    above their weight. It also started massive innovation in research where new optimizations
    drove better quality of model, instead of just throwing scale at the problem.


    And that’s the spirit of this book. The Generalist is still alive and well and
    able to do amazing work with its vast knowledge.


    But maybe it’s time for more specialists in our lives. And that’s what I think
    is a very bright future for developers like you: building specialists.


    ## Hardware is no longer the blocker


    I once spoke at a conference in Wales. The speaker before me was a medical researcher
    using AI to detect brain disease. Over a beer later, I asked him what his biggest
    bottleneck was. I expected him to say data.


    “Compute,” he said. “We have ten researchers and only enough budget for one GPU.
    My slot is Tuesday afternoon. The rest of the week, I just have to theorize.”


    That was only a few years ago. Today, the laptop I’m writing this on—a standard
    MacBook Pro—can fine-tune a model that is orders of magnitude more powerful than
    what he was using.


    The shift to *Unified Memory* (in Apple Silicon and newer chips) means we don’t
    need massive industrial server farms to build AI. We can load 70B parameter models
    into system RAM. We can build and test locally. The AI R&D lab now fits in a backpack.


    ## The Spectrum of Customization


    There are many ways that you can customize your model, which fall into three broad
    areas:


    - **Using prompts**: Within the prompt you can ‘teach’ the model how to do things
    by sharing examples. This can include more advanced stuff such as soft-prompting

    - **Using RAG**: Retrieval Augmented Generation is a way of embedding ‘new’ knowledge
    by having an automated system add related content to your prompt to give your
    model extra context

    - **Fine Tuning**: Here’s where you will burn new patterns into the model’s brain
    so it does them without extra prompting. It’s the hardest to do, but the most
    valuable in the long run.


    I’m not going to cover the first two in this book, as they’ve extensively been
    covered, and ultimately don’t change the model—they are just smarter ways of prompting.


    Instead, this book is for the hard part—the fine tuning of models—we won’t just
    talk theory. We’re going to calculate VRAM requirements, scrape and clean messy
    data, and debug training loops that refuse to converge.


    The API wall is very high, but now, more than ever there’s an alternative. And
    I do believe the high-value skill of tomorrow lies with the developers that can
    overcome that, and build an AI that you own completely.


    In [Chapter 2](#ch02.html_ch02_model_architectures_the_dna_of_ai_1772730611468542),
    you’ll begin that journey by looking at a few of the more popular models and how
    they’re built. That will hopefully help you choose the best one for your task!


    # Chapter 2. Model Architectures: The DNA of AI


    In [Chapter 1](#ch01.html_ch01_from_generalist_to_specialist_1772730610561549),
    we explored that the era of ‘one giant model fits all’ is evolving, and why fine
    tuning smaller, more specialised models represents a strong future of practical
    AI deployment. The opportunity is in front of you to expand your skills to be
    a model customizer. But before you can do this, you need to understand *what*
    you are customizing. To use an analogy—a mechanic who doesn’t understand how an
    engine works is able to change the oil, but they cannot rebuild the transmission.
    Similarly, if you’re a fine tuning practitioner—you need to grasp the fundamentals
    of how transformer models work. That way you won’t be limited to surface-level
    adjustments, and you’ll be able to make the deep, strategic decisions that separate
    a mediocre fine-tuned model from an exceptional one.


    So, in this chapter, we’re going to do an anatomy lesson. The goal is to dissect
    the architecture that powers every major language model today. You’ll examine
    the key innovations that differentiate the leading open source model families,
    and understand how they convert raw text into the mathematical representations
    that make ‘understanding’ possible. It will be a very high-level look, as one
    could write several whole books on how transformers work under-the-hood, so we’ll
    just be hitting the highlights.


    By the end, you’ll have the foundation you need to make informed decisions about
    which base model to choose for your specific fine-tuning project.


    ## The Flow of Information: How transformers work


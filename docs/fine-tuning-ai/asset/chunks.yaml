    A multi-lingual tokenizer that understands Chinese characters, and how they are
    grouped into words would be more efficient, and paid it appropriately into the
    ‘words’ for ‘Hello’ and ‘World’ `[你好]` `[世界]`.


    This, as you can see, will greatly affect both efficiency and quality. More tokens
    means longer sequences that are slower and carry less context, and the performance
    can be negatively impacted.


    > **Warning**

    >

    > Ultimately you need to consider the tokenizer when fine tuning. You cannot change
    a model’s tokenizer without retraining from scratch. When selecting a base model,
    check that its tokenizer handles your domain’s text efficiently. If you are fine
    tuning for a specific programming language or a non-English language, you have
    to verify that the tokenizer doesn’t produce excessively long sequences.


    # Byte Pair Encoding (BPE)


    The most common algorithm to perform tokenization is byte pair encoding, a methodology
    that was originally developed for data compression!


    It works like this:


    - Start with a vocabulary of individual characters, each represented by a byte

    - Count all adjacent pairs in the training corpus

    - Merge the most frequent pair into a new token

    - Repeat the process until the vocab reaches the desired size


    For example, imagine a corpus of only 3 words ‘low’, ‘lower’, and ‘lowest’.


    We would start with the full vocab of individual characters `[l]`, `[o]`, `[w]`,
    `[e]`, `[r]`, `[s]`, `[t]`, `[]` where I am representing a space with the `[*]`.


    Then, we would look at the tokenization of each word:


    ```

    [l], [o], [w], [*], [l], [o], [w], [e], [r], [*], [l], [o], [w], [e], [s], [t]

    ```


    From this we can see that `[l]` followed by `[o]` is the most frequent pairing,
    so we re-encode to have an `[lo]` character instead of `[l]` and `[o]`.


    ```

    [lo], [w], [*], [lo], [w], [e], [r], [*], [lo], [w], [e], [s], [t]

    ```


    Now we can see that `[lo]` followed by `[w]` is the most common, so we re-encode
    to:


    ```

    [low], [*], [low], [e], [r], [*], [low], [e], [s], [t]

    ```


    …and we would continue until we have the desired number of tokens.


    # Embeddings


    Once text is tokenized, each token ID is mapped to an embedding vector. This is
    a representation of the token in a higher dimensional space. Let’s explore what
    that means. Let’s use Llama 3 8B, where the embedding dimension is 4,096. In other
    words—the vector representing the semantics for a token is a direction in a space
    of 4,096 dimensions.


    While this is hard to visualize, consider that the goal here is to encode semantic
    relationships. Tokens with similar meanings tend to have similar embeddings after
    training. Similar embeddings are close together in vector space, where their vectors
    are ‘pointing’ in similar directions.


    A good way to understand this is to consider it in only 2 dimensions. For example,
    suppose we were to look at characters from the Jane Austen novel *Pride and Prejudice*,
    considering the dimensions of gender and nobility. We could plot the former on
    the x-axis and the latter on the y-axis, with the length of the vector denoting
    each character’s wealth (Figure 2-13).


    ![Characters in Pride and Prejudice as vectors](assets/ch02_figure_13_1772730611456863.png)


    **Figure 2-13.** Characters in Pride and Prejudice as vectors


    From an inspection of the graph, you can derive a fair amount of information about
    each character. Three of them are male. Mr. Darcy is extremely wealthy, but his
    nobility isn’t clear (he’s called “Mister,” unlike the less wealthy but apparently
    more noble Sir William Lucas). The other “Mister,” Mr. Bennet, is clearly not
    nobility and is struggling financially. Elizabeth Bennet, his daughter, is similar
    to him, but female. Lady Catherine, the other female character in our example,
    is nobility and incredibly wealthy. The romance between Mr. Darcy and Elizabeth
    causes tension—*prejudice* coming from the noble side of the vectors toward the
    less-noble.


    As this example shows, by considering multiple dimensions we can begin to see
    real meaning in the words (here, character names). Again, we’re not talking about
    concrete definitions, but more a *relative* meaning based on the axes and the
    relation between the vector for one word and the other vectors.


    ## Understanding Positional Embeddings with RoPE


    Transformers process all tokens in parallel, so they have no inherent sense of
    order. To inject positional information, we add positional embeddings to the token
    embeddings.


    Modern models like Llama use Rotary Position Embeddings (RoPE), which encode position
    through an innovative technique involving rotation in the embedding space. The
    key advantage of RoPE is that it allows the model to generalize to longer sequences
    than it saw during training while minimizing quality degradation.


    Consider the sentence “The cat ate the mouse”. Without positional information,
    the model would find the sentences “The cat ate the mouse” and “The mouse ate
    the cat” to be *mathematically* identical.


    Rotary Positional Embedding (RoPE) solves this by treating word embeddings not
    just as static points in space, but as vectors that can be *rotated*.


    To encode position, instead of adding a fixed value to the embedding representing
    the position, RoPE does it by rotating the embedding vector. So, for each step
    forward in a sequence, the idea is to rotate the vector for that word by a specific
    angle. If we call that angle ‘theta’ θ, then the first embedding is rotated by
    θ, the second by 2θ, the third by 3θ and so on. As we move further down the sequence,
    the embedding vector ‘spins’ further away from the origin in a predictable, calculable
    way.


    The idea now is that as well as the semantics of the words being encoded in the
    embedding, as we saw in the previous section, the *position* of the word can also
    be encoded, so when the model calculates the attention scores it can keep both
    in mind. So, recalling that the embeddings are vectors, and the relative *meanings*
    between words (like we saw with characters in Pride and Prejudice) can be encoded
    in the relationships between those vectors, we can evaluate this in mathematics
    using a dot product. When words are semantically similar, their dot product is
    high because their vectors are similar. Otherwise the dot product is low. Models
    use this to pay attention based on relevance.


    But without positional encoding, the model may think that the word “cat” at the
    beginning of a book is the exact same ‘cat’ that shows up at the end of the book.
    It can see the meaning of a cat, but is blind to the order in which the cat appears.


    Using RoPE, you don’t destroy this semantic: you just twist it by rotating it
    through an angle. Now, words that are closer together in a sentence have similar
    rotations, and as such a similarity of *position* is encoded into the vector also.
    It’s complex math that gives a simple solution.


    # Other Considerations


    Beyond the architecture, there are several other model capabilities you should
    keep in mind. We’ll discuss them in this section.


    ## Instruction Following


    Some models are better at following complex, multi-step instructions. This emerges
    from instruction-tuning during pretraining. This means that the training data
    for the model was explicitly done as question-answer pairs to look more like real
    world usage. This makes the model better at generalizing for conversations where
    the user typically asks a question, and the model answers. Models labeled “Instruct”
    or “Chat” have been specifically trained for this. We saw this when looking at
    Gemma, when the models are helpfully named with an `-it` at the end when instruction-tuned.
    Do note that if your task requires precise instruction following, starting from
    an instruction-tuned base is usually better than starting from a base model.


    ## Reasoning Depth


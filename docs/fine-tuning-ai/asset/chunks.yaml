    \ version,’ which is typically good advice may not apply here. For example, at\
    \ time of writing, the Compute Platform supports CUDA 12.6, 12.8 and 13.0, but\
    \ the *latest* CUDA is 13.1. While it’s great to have the latest drivers for the\
    \ best support of your machine should you be using it also for gaming or other\
    \ activities, I strongly recommend you *strictly* follow the platform that PyTorch\
    \ supports. In this case, you would use 13.0.\n\nOnce you’ve installed it, you’re\
    \ still not out of the woods! I would encourage double checking that it’s working\
    \ as recommended with code like this:\n\n```\nimport torch\nprint(f\"PyTorch version:\
    \ {torch.__version__}\")\nprint(f\"CUDA available: {torch.cuda.is_available()}\"\
    )\nif torch.cuda.is_available():\n    print(f\"GPU: {torch.cuda.get_device_name(0)}\"\
    )\n    print(f\"VRAM: {torch.cuda.get_device_properties(0).total_mem / 1e9:.1f}\

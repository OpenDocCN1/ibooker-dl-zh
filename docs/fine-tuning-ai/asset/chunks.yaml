    \ eye on the details.\n\nThe PyTorch foundation has done a great job in simplifying\
    \ this if you start at: [https://pytorch.org/get-started/locally/](https://pytorch.org/get-started/locally/),\
    \ but it’s still easy to make a mistake.\n\nYou can see this in [Figure 3-3](#ch03.html_ch03_figure_3_1772730612412252).\n\

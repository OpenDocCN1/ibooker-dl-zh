  fmt: '

    Before going into the details, it’s good to get a high-level mental model for
    how a transformer-based language model deals with text. It would take several
    books to go into this in detail, so I’m just going to look into the highlights.


    You can see this in Figure 2-1.


    ![A diagram of a block diagram AI-generated content may be incorrect.](assets/ch02_figure_1_1772730611456644.png)


    *Figure 2-1. High Level Transformers Architecture*


    The key insight is that text enters the model as a sequence of discrete symbols.
    Usually these are character encodings like ASCII or Unicode for ‘T’, ‘h’, and
    ‘e’. Those character encodings are grouped into words by separating based on punctuation.
    The words are then converted into tokens using a tokenizer. These tokens are mere
    numerical representations of words or subwords.


    There’s no inherent ‘meaning’ or ‘positional’ ideas encoded within them. That’s
    where the second box—the embeddings—comes in. An embedding is a vector that represents
    the meaning of the word. Think of an embedding as an arrow in a higher-dimensional
    space. The direction it points in represents the meaning. Words that are similar—like
    ‘King’ or ‘Prince’ would point in roughly the same direction.


    In a transformer, positional encoding is also added to the vector. This positional
    encoding represents the location of the word in the expression, on the theory
    that word location can impact its semantics. A particular example of this is the
    use of adjectives. For example, ‘the big dog ate meat,’—we can see that the adjective
    ‘big’ directly applies to the dog, but it can also directly apply to the ‘meat’
    indirectly—as it’s more likely that a big dog will eat a lot of meat!


    All this happens *before* the tokens flow into the transformer blocks, and here
    is where the innovation that led to the current explosion in AI technology lies.


    ## Attention Mechanisms


    This is the heart of the transformer. I like to think of them using this analogy:
    imagine you are reading a document with a highlighter in your hand. As you read
    each paragraph, you might highlight certain words or phrases because they’ll help
    you understand the current sentence. Maybe it’s a piece of fiction, and the character
    is eating a certain food that you’ve never heard of. You look back and you see
    that the events take place in a particular location. This can help you understand,
    or at least make an educated guess, about the piece of food.


    The attention mechanism artificially does the same type of process. For each position
    in the sequence, it will calculate how much ‘attention’ should be paid to every
    other position.


    Let’s consider this sentence: “The cat sat on the mat because it was tired.”


    When processing the word ‘it,’ you would need to refer to what ‘it’ refers to.
    As a human, reading that passage, you know it refers to the cat. But when you
    think about it a moment, it could also refer to the mat. And with strict grammatical
    rules, and not semantics, one might argue that it does!


    The attention mechanism calculates attention scores for the word ‘it’, to see
    what it refers to. Ultimately, based on lots of training data, it likely makes
    a stronger connection between the word ‘it’ and ‘cat’, instead of ‘it’ and ‘mat’!


    This works through an elegant mathematical operation. It does this through calculation
    of three vectors:


    * The Query (`Q`): “What am I looking for?”

    * The Key (`K`): “What do I contain?”

    * The Value (`V`): “What information do I provide?”


    They are calculated by multiplying the embedding vector for the word (as discussed
    earlier in this chapter) with weight matrices that will be learned over time.


    You can see this in [Figure 2-2](#ch02.html_ch02_figure_2_1772730611456682).


    ![A white paper with black lines AI-generated content may be incorrect.](assets/ch02_figure_2_1772730611456682.png)


    *Figure 2-2. Understanding the attention mechanism*


    In this case, we explore the input tokens, and focus on the token for ‘it’, which
    is at position 8.


    Then, we look at the Keys for each of the words, and examine their values. They
    have a score, and we multiply the `Q` for ‘it’ by the `K` for each of these words.
    We’ll take the results and `softmax` them to get probabilities to have a resulting
    set of attention weights.


    These weights are the probabilities of attention that should be applied to the
    word. So, for the word ‘it’, the highest probability word that is closest associated
    with it is ‘cat’. To calculate the output, and the final attention, we then multiply
    out the weights by the values.


    The beauty of this mechanism is that it is entirely *learned*. You might wonder
    where those values in the diagram come from, and without a good set of `K` values
    to begin with, all this will be nonsense. Realize the vast amounts of text that
    models are trained on—and from these, over time, with trial and error, and the
    classic ‘Machine Learning’ paradigm, the useful patterns get learned.


    These ‘chunks’ of `Q`, `K`, `V` to learn attention on text embedding vectors are
    often referred to as ‘heads’, and when multiple heads are used, we’ve learned
    that some will end up tracking semantic relationships, some grammatical, and some
    will capture relationship patterns for words that we don’t even have names for.


    Typically, when there are multiple layers of heads, then the earlier heads in
    the sequence will learn the more obvious connections like syntax or grammar, and
    the later heads will capture the more complex, semantic relationships.


    ## Multi-Head Attention


    A single attention operation captures one type of relationship between the tokens.
    Language is rich with multiple, simultaneous relationship types. And different
    languages can have different relation types that don’t exist in English. To capture
    this richness, the idea of multi-head attention, which runs multiple attention
    operations in parallel, each with their own learned `Q`, `K`, `V` matrices, is
    useful.


    You can see this in [Figure 2-3](#ch02.html_ch02_figure_3_1772730611456705).


    ![A diagram of a multi-head attention AI-generated content may be incorrect.](assets/ch02_figure_3_1772730611456705.png)


    *Figure 2-3. Multi-Head Attention*


    Models like Llama 3 8B, for example, will use 32 attention heads per layer, across
    32 layers.


    Each layer’s heads will operate at different levels of abstraction—early layers
    tend to learn syntactic patterns, while later ones get into semantics.


    ### Reducing dimensions in MHA


    These layers will reduce dimensions per head in order to save computation costs.


    The *hidden* dimension is 4,096—the size of the vector representing each token
    as it flows through the network. Rather than running the attention operation on
    all 4,096 dimensions, the model will split this into the 32 parallel heads, where
    each will work on 128 dimensions (`4096 / 32 = 128`).


    Thus, each head will compute its own attention scores and produce output in 128
    dimensions. These 32 outputs will then be concatenated back together and passed
    through one more learned weight matrix—often called the ‘output projection’. This
    serves an important purpose: it allows the model to mix information across heads.
    Without it, the heads would be completely independent (i.e. head 1 has the first
    128 dimensions, head 2 has the next 128 and so on). With this output projection,
    the model learns how to combine the different perspectives from different heads
    into a unified representation for the next layer.


    This keeps the total computation roughly similar to a single large attention operation,
    but it gives the model much more flexibility to learn diverse patterns.


    **Note**


- raw: 'It’s tempting to imagine that different heads neatly divide labor, and visualizations
    like [Figure 2-3](#ch02.html_ch02_figure_3_1772730611456705) tend to represent
    this because it’s easier for us to grasp things like ‘Head 1 does grammar, Head
    2 does semantics etc’, but reality is much messier. Research into transformer
    interpretability has shown that specialization tends to happen more *across* layers
    than *within* them. Earlier layers—closer to the input—tend to capture local syntactic
    patterns: which words are adjacent, basic grammatical relationships, positional
    information etc. Deeper layers progressively build more abstract, semantic relationships:
    what the sentence means, how concepts relate, what an appropriate response to
    a question might be, and stuff like that!


    Within any single layer, multiple heads do learn different patterns, but in reality
    they do not map to human-interpretable categories. The power of multi head attention
    comes from this redundancy and diversity—the model figures out what’s useful for
    its corpus while training, and not through an engineered direction by a human.


    ### Self-Attention vs Cross-Attention


    There are two main types of attention in transformer architectures you should
    consider.


    What we’ve been discussing so far is *self-attention*, where a sequence attends
    to itself. The queries, keys, values, all come from the same sentence. In our
    hypothetical scenario of reading a fiction book, and we have a paragraph with
    a location mentioned and a food type mentioned, our attention is *only* on that
    paragraph.


    *Cross-attention* extends on this, and considers where one sequence can attend
    to a different one. In the hypothetical example, we might have learned in an earlier
    chapter that the character is vegetarian, which would give us a clue about what
    the unknown food might be. In ML terms—ultimately what’s happening here is that
    the Q values could come from one sequence, while the K and V come from another.


    For *most* attention models, including all the ones you’re likely to fine-tune,
    self-attention is the dominant mechanism. Cross attention appears in encoder-decoder
    type architectures, and in multi-modal models, where the model might need to attend
    to image features as well as text.


    ## The Feed Forward Network


    Once the attention mechanism has done its thing, and allowed tokens to gather
    context from other ones, each position will pass through a feed forward network
    (FFN). This is a simple, but powerful two-layer neural network that is applied
    independently to each position.


    You can see it in [Figure 2-4](#ch02.html_ch02_figure_4_1772730611456723).


    ![A diagram of a algorithm AI-generated content may be incorrect.](assets/ch02_figure_4_1772730611456723.png)


    ###### Figure 2-4. The Feed Forward Network


    Its purpose is ultimately to store the ‘knowledge’ of the model. Think of the
    attention mechanism as gathering *context,* where after attention is applied,
    each token’s representation is enriched with information for other tokens that
    it attended to. The FFN will then process this contextualized representation,
    extract useful features, and transform it for the next layer.


    This expand-then-contract structure is ultimately the key. The first layer will
    expand the dimensionality of the embedding from 4,096 to 14,336 dimensions. This
    larger space allows the network to represent more complex patterns. It does this
    with that number of neurons, and each could be thought of as a ‘pattern detector’.
    When the input matches a pattern that the neuron has learned to recognize, it
    will activate strongly.


    Once you’ve heightened the dimension then the *non linear* activation function,
    such as SiLU or SwiGLU, is applied. I’m emphasising non linear, because if you
    think about a linear transformation—it’s just a matrix multiplication that scales
    or rotates vectors, but doesn’t handle curves or thresholds. SO, if you stack
    two linear layers—you’re effectively multiplying by Matrix A and then again by
    B, but that’s mathematically equivalent to multiplying by a single matrix BA.
    No matter how many you stack, they still effectively collapse into one—you get
    nothing from the additional depth.


    But if you use a non linear activation function, the neurons get more selective.
    Imagine one of them, where its weights in the first layer compute a high value
    when the input looks like ‘question about cuisine,’ and a low or negative one
    otherwise. The activation function, if non linear, will be curved—thus strengthening
    the activation for cuisine questions, and staying near zero for everything else.
    Without the non-linearity, the neuron would respond proportionally for *everything*,
    and wouldn’t learn to trigger on specific relevant patterns, and ignore the others.


    The second linear layer then projects this back down to 4,096 dimensions. Each
    neuron in layer 1 now has a corresponding one in layer 2. Often this is considered
    to be the ‘knowledge’ associated with the input pattern, and what the model should
    output when that pattern is detected. This is why researchers often describe FFN
    layers as functioning like key-value *memory*. The first layer’s weights are the
    keys that match input values, and the second layer’s are values that get retrieved
    when a key matches.


    For example, a neuron on the first layer might activate when the input represents
    ‘Food from Nagasaki’, and the corresponding output one might push the representation
    towards the tokens for ‘Okonomiyaki’. This is an oversimplified abstraction—the
    real ones don’t map nearly as closely to human-understandable concepts as this,
    but it does capture how the basic mechanism of how factual knowledge from the
    text corpus gets encoded.


    For fine tuning this really matters—the FFN layers capture a significant portion
    of the model’s deep knowledge. In techniques like LoRA (which we’ll explore in
    Chapter 7), we can inject knowledge to this layer. Ultimately, if you can build
    the mental model of the attention layers focusing on ‘what to look at’, while
    the FFN handles ‘what to do with it’, you’ll have a huge headstart in understanding
    how and where to apply custom adaptation.


    ## Layer Normalization and Residual Connections


    Two additional components that are crucial but often overlooked, but you may see
    in any discussion of the transformer are *Layer Normalization* and *Residual Connections.*
    These enable stable training of deep networks:


    *Residual connections* (also called skip connections) add the input of each sub-layer
    to its output. This allows gradients to flow more easily during training and lets
    the model learn to make incremental refinements at each layer rather than complete
    transformations. They also help prevent gradients exploding (growing too large
    as to be meaningless) or vanishing (approaching zero, so they lose information)


    *Layer normalization* normalizes the activations across the feature dimension,
    stabilizing the distribution of values as they pass through the network. Noting
    that the ultimate value of a vector is relatively meaningless, and that its distributions
    for probabilities can be more important, the idea of normalization means that
    values are generally distributed between 0 and 1, avoiding clustering of values
    and loss of information. Modern models like Llama use “RMSNorm” (Root Mean Square
    Normalization), which is computationally simpler.


    # Decoder-Only Dominance


    The original transformer paper described an *encoder-decoder* architecture designed
    for machine translation. The encoder processes the input sequence (source language),
    and the decoder generates the output sequence (target language), attending to
    the encoder’s representations via cross-attention.


    ![A diagram of a process AI-generated content may be incorrect.](assets/ch02_figure_5_1772730611456741.png)


    ###### Figure 2-5. Encoder-Decoder Transformer'

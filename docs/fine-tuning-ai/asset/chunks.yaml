    \ If it doesn’t get new drivers that match one of the options, clean your system,\
    \ and start again!\n\nIt’s a lot of hassle up front, but it can save you a world\
    \ of hurt down the line.\n\n## The Core Library Stack\n\nNow that we have PyTorch\
    \ verified, and it’s working with the GPU, you’ll next install the libraries you’ll\
    \ use throughout this book. Each serves a specific role, and understanding what\
    \ each one does will help you understand and debug issues later.\n\n### PyTorch\n\
    \nPyTorch, of course, is the deep learning framework everything else is built\
    \ on. It provides the tensor operations, automatic differentiation (autograd),\
    \ and GPU acceleration that power model training. You installed this in the previous\
    \ step. Check out my O’Reilly book “AI and Machine Learning for Coders in PyTorch”\
    \ if you want to learn more.\n\n### Hugging Face Transformers\n\nHugging Face\
    \ Transformers is the library that provides access to thousands of pre-trained\
    \ models through a consistent API. When you write code like `AutoModelForCausalLM.from_pretrained(\"\
    meta-llama/Llama-3.2-3B\")`, where models are specified with a namespace, Transformers\
    \ downloads the model architecture and weights from the Hugging Face Hub and turns\
    \ them into PyTorch model that’s ready to use. It handles the differences between\
    \ architectures—Llama, Mistral, Gemma, Phi, Qwen—behind a unified interface, so\
    \ your training code doesn’t need to change when you switch models.\n\n### Hugging\
    \ Face PEFT (Parameter-Efficient Fine-Tuning)\n\nHugging Face PEFT (Parameter-Efficient\
    \ Fine-Tuning) implements the adapter methods that make fine-tuning practical\
    \ on consumer hardware. LoRA, QLoRA, and other techniques are all provided through\
    \ PEFT. When you apply a LoRA adapter to a model, PEFT injects small trainable\
    \ matrices into the model’s layers while freezing the original weights. We’ll\
    \ explore PEFT in depth in Chapter X.\n\n### BitsAndBytes\n\nBitsAndBytes is the\
    \ quantization library that enables QLoRA specifically. As we saw earlier in this\
    \ Chapter, in order to work on smaller grade GPUs, quantization is necessary,\
    \ and `bitsandbytes` is your friend for this. It provides 4-bit and 8-bit quantization\
    \ for model weights, allowing you to load a 14 GB model into 3.5 GB of VRAM. It’s\
    \ developed by Tim Dettmers and is tightly integrated with Hugging Face Transformers—you\
    \ can load a model in 4-bit precision with a single argument: `load_in_4bit=True`.\
    \ This library, at time of writing, is *highly* optimized for NVidia. Support\
    \ for other environments (Mac and AMD) is being added all the time, but you may\
    \ hit walls here if you aren’t using an NVidia/CUDA stack.\n\n### TRL (Transformer\
    \ Reinforcement Learning)\n\nTRL (Transformer Reinforcement Learning) provides\
    \ high-level training APIs. Its `SFTTrainer` (Supervised Fine-Tuning Trainer)\
    \ wraps PyTorch’s training loop with sensible defaults for fine-tuning language\
    \ models. It handles data collation, gradient accumulation, logging, checkpointing,\
    \ and evaluation. TRL also provides `DPOTrainer` for direct preference optimization,\
    \ which we’ll cover in Chapter X.\n\n### Hugging Face Accelerate\n\nHugging Face\
    \ Accelerate manages the details of running training across different hardware\

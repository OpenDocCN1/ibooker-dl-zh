- "# AI 微调指南\n\n# 第 1 章：从通才到专才\n\n蜜月期已结束。\n\n和我一样，你可能已经使用大语言模型（LLM）作为后端构建了原型。当你以提示（prompt）形式表达的复杂查询返回完美而连贯的响应时，你会感受到最初的兴奋。“惊喜与愉悦”的设计是一个理想的目标，而\
  \ LLM 的响应达到了这一目标。有那么一刻，你觉得软件的未来是无限的，提示（prompting）是新的编程语言。你只需要巧妙的提示。\n\n自从 ChatGPT\
  \ 普及了 LLM 以来，我们一直处于*通才*的时代。我们惊叹于那些在整个人类互联网及更广泛数据上训练过的大型语言模型。它们无所不能，从创作俳句诗歌到优化 RUST\
  \ 函数。它们是技术奇迹。\n\n但如果你想交付一个*真正的*产品呢？在使用这些模型时，你常常会发现，尽管最初很兴奋，但由于各种原因，它们可能是错误的工作工具。虽然它的押韵能力令人印象深刻，但在查询你遗留的\
  \ SQL 数据库时，你确实希望它不要幻觉出不存在的表！\n\n这就是正在出现的“API 之墙”。那是一道无形的屏障，将酷炫的黑客松演示与盈利业务分开，也将成功的初创公司与只博眼球的初创公司分开。突破这堵墙需要面对一些残酷的现实：可能压垮你的规模成本、不可预测的延迟，当然，还有当你提到将与第三方共享客户数据时，你的首席信息安全官（CISO）脸上的惊恐表情。\n\
  \n这本书归根结底是关于突破这堵墙。它是关于从*租用*智能转向*拥有*智能。它将让你用敏捷、超能力的专才取代庞大的通才：经过微调的 AI，它比任何万亿参数巨头都更了解你的业务。\n\
  \n你将拆解“提示工程”范式。在本章中，我们将看看那种杀死了许多 AI 初创公司的残酷“单位经济学”。我们将看到为什么一个在单个 GPU 上运行的小型开源模型能够——而且应该——在*你的*特定领域击败世界上最聪明的\
  \ AI。\n\n## 租用智能的成本\n\n每个项目都始于天真。你获得一个 API 密钥，然后开始编码。你精心构建了一个经过大量实验打磨的系统提示。它有效。你部署到测试版。\n\
  \n然后你看着成本。你的眼睛睁大了。你想象那会是什么样子。它们睁得更大！\n\n### 令牌税\n\n在原型阶段，推理成本感觉可以忽略不计。每次请求几分之一美分基本上是免费的。但是当你从“聊天”转向自动化时，数学计算就对你不利了。\n\
  \n大多数提供商按令牌收费（大约 0.75 个单词）。对于高端推理模型，你可能需要为每 1,000 个输入令牌支付 0.01 到 0.03 美元。\n\n让我们用一个场景来推演一下。设想一个“法律合同分析器”应用。你的用户上传文档，你的应用会提取合同中潜在问题或风险的摘要。\n\
  \n架构可能如图 1-1 所示。\n\n![一个蓝色矩形，带有蓝色齿轮和白色文字，AI 生成的内容可能不正确。](img/ch01_figure_1_1772730610555180.png)\n\
  \n**图 1-1.** 一个基于 LLM 的法律合同分析器的简单架构\n\n你的输入是提示加上合同。一份典型的合同——包含大量法律术语——大约有 15,000\
  \ 个令牌。你的系统提示是你精心设计的，包含大量指令以避免幻觉，并精确地按照系统其余部分所需的结构来组织输出——可能以 JSON 或其他结构化文件的形式。这会消耗令牌。当然，你的输出还会产生更多令牌。\n\
  \n因此，输入 17,000 个令牌，输出 1,000 个令牌。按照上述成本计算，每份文档可能花费 20 美分。如果你有 1,000 个用户，每人每天分析 5\
  \ 份文档，那就是每天 1,000 美元，或每年 365,000 美元。\n\n这只是运营该系统所需花费的资金。而在这一切结束时，你什么都*不拥有*。你是在*租用*智能。如果你向用户收取月费——比如说每月\
  \ 20 美元，他们很快就会变成净亏损。你的利润率风险非常高。\n\n### 智能体倍增器\n\n现在考虑智能体的影响。自 2024 年中期以来，它们一直是科技行业的宠儿，而且理由充分——它们是一种优秀的设计模式，通过超越仅仅获取问题答案的方式，最大限度地发挥\
  \ LLM 的作用。我通常喜欢认为智能体遵循图 1-2 所示的模式。\n\n![](img/ch01_figure_2_1772730610555218.png)\n\
  \n**图 1-2.** 智能体工作流\n\n最终，这里的目标是遵循以下步骤：\n\n\n\n\n\n1. *理解用户的意图*。例如，如果该智能体是为帮助选择餐厅而设计的，而用户说他们想吃*御好烧*，智能体就会足够聪明地意识到这是日本料理的一个分支。用户无需特别说明。\n\
  \n2. *制定计划* *使用可用工具*。如果智能体知道自己的工具是 Google 搜索、地图搜索和浏览网站，它就可以制定一个计划，在当前地点附近搜索日本餐厅。然后，它可以逐一浏览这些餐厅的网站，找到它们的菜单，再在菜单中搜索*御好烧*。\n\
  \n3. *使用工具执行计划*。然后，它按照计划行事，并恰当地使用 LLM——例如，生成调用地图搜索 API 的代码，或解析下载的 HTML 以找到想要的菜品。\n\
  \n4. *反思结果*。完成所有这些之后，它应该将结果与用户的需求进行匹配。它是否找到了供应这道菜的餐厅？还是只找到了一般的日本餐厅？诸如此类。如果找到了，那很好，它可以进入第\
  \ 5 步——给出解决方案。否则，它就得回到第 1 步和第 2 步。\n\n5. *解决方案*。向用户呈现解决方案，并可能流转给其他智能体，比如一个能够处理在目标餐厅预订的智能体！\n\
  \n这种带有专用思维链的工作流程，是智能体最简单的 DNA。但说到 token 用量，你可以看出，它消耗的 token 可能比前面章节中看到的简单 `prompt->result`\
  \ 多得多。我们之前推测的每天 1000 美元，在使用这种智能体工作流时，很可能接近每天 5000 美元。\n\n难怪各家公司都在数据中心投入数十亿美元！\n\n\
  ## 另一个隐藏成本：指令税\n\n这里还存在一种更隐蔽的低效。通用模型在你告诉它之前，对你的具体任务一无所知。要让它发挥作用，你必须在*每一次请求*中把规则、格式指南以及如何处理边缘情况粘贴到系统提示词里！\n\
  \n“你是理解各种菜品及其在哪能找到它们的专家。理解用户的请求，并将其映射到一种或多种热门菜系。如果没有直接匹配，就寻找其他可能供应这道菜的餐厅类型。按如下方式将结果输出为\
  \ JSON 结构 {...}”\n\n你要为反复将这些使用说明及其所有 token 发送给服务器而付费。这极其浪费。\n\n另外，上下文窗口污染也值得考虑。研究表明，当你把上下文窗口塞满指令时，模型的表现会下降（“迷失在中间”现象）。我见过太多这样的例子：必须输入严格指令（通常用全大写来表示强调），才能让模型注意提示词的某个部分。而这当然会消耗更多\
  \ token。\n\n微调会把这些指令从上下文窗口（你需要为之付费）转移到模型权重（这是永久性的）中。模型不需要被告知该如何表现，因为它已经被内置了。\n\n\
  ## 延迟杀手\n\n成本是商业问题，延迟是用户体验问题。而如果你的用户体验不佳，他们就不会为这些成本买单！\n\n想象一个拥有数千亿参数的巨型基础模型。这个模型上的推理物理规律是无法回避的。即使使用最先进的\
  \ GPU，在内存中移动数 TB 的权重也需要时间和功耗。一个重要的指标：首 token 时间（TTFT）可能从 500 毫秒到几秒不等。下一个指标——每秒 token\
  \ 数（TPS）——则衡量第一个 token 之后 token 出现的频率。\n\n在构建聊天机器人时请考虑这一点。如果生成第一个 token 需要 500 毫秒（TTFT），之后每秒\
  \ 50 个 token（TPS），那么你的用户体验就没问题。你对更高 TTFT 和更低 TPS 的容忍度可能也还行——因为你已经习惯了，而人的体验才是关键。\n\
  \n在如此庞大的模型中移动 token，由于模型规模庞大，速度会较慢。更快、更好的机器以及专用硬件，顶多是对这个问题的修补。\n\n而且，当然，如果那台机器与数百万其他客户共享，你就可能面临不同的\
  \ TTFT 和 TPS，因为你的查询只能和其他查询一起排队等候。\n\n如果你的企业客户仪表盘很慢，那可不妙，因为你的系统正在和用 ChatGPT 写论文的高中生竞争！\n\
  \n因此，如果你考虑一个针对特定需求进行微调的本地部署模型，你会发现它通常更小——因此不需要专门的昂贵硬件来跨多台机器同步模型。延迟也更低——无需往返云端，也不必排在其它模型后面。你可以根据自己的需求扩展硬件投资。而且，你当然可以自己调整模型，针对特定工作负载进行优化。\n\
  \n我见过一些应用程序在托管模型上运行得迟钝而脆弱，但迁移到本地模型后就变得即时、灵敏。问题于是从“缓解因他人托管模型而导致的故障”转变为“通过微调本地模型来增加业务价值”。最终，这会为你的业务增值，而不是把运营费用流给第三方。\n\
  \n## 数据防火墙\n\n如果成本和延迟还不足以让你重新思考，那么企业销售周期以及与它们合作时必要的合规要求，应该会让你重新思考！\n\n真实故事：我曾参与过一笔潜在投资，对象是一家非常热门的初创公司，它正在推销用\
  \ AI 解决医院中的一个常见问题。它使用计算机视觉和视觉语言模型。我当然不能透露具体细节，但最终它将为医院节省大量时间和金钱，并帮助他们提高护理质量。但是，由于基于视觉，它需要在公共场所安装摄像头，包括医院病房。\n\
  \n鉴于对*灵活性*的要求——可能某天他们想发现某个特定问题，而另一天又想看到不同的东西——视觉语言模型（VLM）的想法很有吸引力。你可以为计算机视觉训练一个非基于\
  \ transformer 的模型，但那样它就变得静态了。它擅长发现 X 或 Y，但如果之后你想看到 Z，就需要一个全新的模型。而使用 VLM，只需一个提示词：“这张图片里有什么？”或者“告诉我你是否在这张图片中看到了违规行为\
  \ (X)”等等。\n\n这家初创公司演示了他们将如何实现这一点。演示非常精彩。它做到了客户认为医院需要的一切。现场非常兴奋。然后，有人问起了架构。这个 VLM\
  \ 是一个托管的巨型模型。\n\n“等等，”CISO 问道。“你们要把图像发送给 <公司名称>？”\n\n初创公司的 CEO 慢慢点了点头。“是的，”她回答。然后她举起一些文件，展示\
  \ <公司名称> 如何管理隐私、保证匿名性，以及其它一切确保其系统完整性的措施。\n\n但这还不够。他们必须带着一种“兄弟，相信我”的态度，围绕一个非常大的第三方去医院，而第三方本身并不在场。\n\
  \n自然而然地，尽管充满乐观，这笔交易还是在那张桌子上夭折了。结果，医院并没有变得像它们本可以的那样安全。\n\n而这是一件好事。\n\n\n\n\n\n至少到目前为止是这样。现在有了一条替代的前进道路。我希望这家初创公司已经进入了本地\
  \ VLM 领域，这样他们就能两全其美。如果你们正是这家公司，并且正在读到这里，请与我联系！\n\n### 元数据泄露\n\n上述故事是一个例子，说明在设计与第三方共享客户数据的产品时，属于客户的*数据*成为了关键障碍。\n\
  \n但风险不仅仅是数据或提示内容，还包括元数据。请注意，API 提供商即使不查看或泄露你的数据，仍然知道你是谁、你何时发送请求、请求有多大，以及你可能在做什么。\n\
  \n在高风险行业如金融投资中，关于你正在研究内容的泄露可能会让竞争对手提前得知。例如，在考虑并购（M & A）的企业中，如果泄露了 A 公司花大量时间研究 B\
  \ 公司的基本面，人们可能会推断他们正在考虑收购 B 公司。第三方知道这一信息后，可能会购买 B 公司的股票，从而推高最终的收购价格。这很容易成为一种新型的“内幕交易”。\n\
  \n### 合规问题\n\n像 GDPR 这样的法规框架也会让这个问题更加棘手。如果用户要求删除其数据，你可以从自己的基础设施中移除——但如果你用这些数据去提示第三方模型呢？你如何保证数据已从他们的服务器上删除？\n\
  \n当你拥有模型时，你拥有完整的溯源能力。你可以精确展示用于微调的数据。你可以记录所有传入模型进行推理的数据日志，并在必要时删除。如果需要，你还可以用干净的数据集重新训练。\n\
  \n最终——你拥有控制权。\n\n### 模型漂移\n\n我个人非常惊讶，有太多次与那些遭遇“昨天还能用，今天就不行了”问题的公司交谈。他们不明白原因。而解释很简单：API\
  \ 提供商会不断更新他们的模型。因此，所有投入在提示工程上的努力——尤其是在上下文窗口中注入命令——可能会在一夜之间消失。唯一的解决方案——重新设计提示，并希望供应商不会对*你的*提示引入破坏性变更——实在谈不上鼓舞人心！\n\
  \n但是，当然，拥有自己微调的模型会创造出你能控制的静态产物。除非你希望它改变，否则它不会改变。而且如果你确实改变它，你仍然保留旧版本，因此你可以进行回归测试，并逐步更新使用它的应用！\n\
  \n### 专家革命\n\n长期以来，规模定律（Scaling Laws）一直是通往更美好未来的方向。更大——更多数据、更多层、更多 Transformer、更多参数——总是更好。创新的方向也遵循这一点。\n\
  \n一旦模型达到一定规模，自行托管就变得不可行，你必须依赖那些拥有数十亿美元数据中心的巨头来为你托管，并按 token 付费。\n\n但这已不再严格成立。我们已经进入了一个分化转型期：LLM\
  \ 已足够小可以自行托管，许可证允许这样做，开放预训练模型被自由分享。通过能够针对你的下游任务和特定数据进一步微调这些模型，你现在有了一个可行的替代方案。\n\n\
  2023 年初，LLaMA 的发布推动了这一进程。它证明了精心设计的模型，尽管体积小得多，却能产生远超其规模的影响。这也引发了研究领域的巨大创新，新的优化技术提升了模型质量，而不是仅仅靠增加规模来解决问题。\n\
  \n这正是本书的精神所在。通才模型依然充满活力，并能凭借其广博的知识做出惊人的工作。\n\n但也许我们的生活中需要更多专家模型。我认为这正是像你这样的开发者非常光明的未来：构建专家模型。\n\
  \n### 硬件不再是阻碍\n\n我曾在一个会议上发言，地点在威尔士。在我之前的演讲者是一位使用 AI 检测脑部疾病的医学研究员。后来喝啤酒时，我问他最大的瓶颈是什么。我原以为他会说是数据。\n\
  \n“算力，”他说，“我们有十位研究员，但预算只够买一块 GPU。我排到周二下午。一周里剩下的时间，我只能做理论推演。”\n\n那只是几年前的事。如今，我正在写作所用的笔记本电脑——一台标准\
  \ MacBook Pro——可以微调比他当时使用的强大数个数量级的模型。\n\n*统一内存*（在 Apple Silicon 和更新的芯片中）的出现意味着我们不再需要大规模工业服务器群来构建\
  \ AI。我们可以将 70B 参数的模型加载到系统内存中。我们可以在本地构建和测试。AI 研发实验室现在可以装进一个背包。\n\n### 定制的光谱\n\n模型定制有很多方式，可归为三大类：\n\
  \n- **使用提示**：在提示中，你可以通过共享示例来“教”模型如何做事。这可以包括更高级的内容，如软提示（soft-prompting）。\n- **使用\
  \ RAG**：检索增强生成（Retrieval Augmented Generation）是一种嵌入“新”知识的方式，通过自动化系统向你的提示中添加相关内容，为模型提供额外上下文。\n\
  - **微调**：这是你将新模式烧录到模型“大脑”中的过程，使其无需额外提示就能执行这些模式。这是最难做到的，但从长远来看最有价值。\n\n我不会在本书中介绍前两种方式，因为它们已被广泛讨论，而且它们最终不会改变模型——它们只是更聪明的提示方式。\n\
  \n相反，本书专注于困难的部分——微调模型——我们不只是谈理论。我们还要计算 VRAM 需求、抓取和清理杂乱的数据，以及调试拒绝收敛的训练循环。\n\nAPI\
  \ 之墙非常之高，但现在比以往任何时候都更有替代方案。我确实相信，未来的高价值技能属于那些能够跨越这堵墙、构建你完全拥有的 AI 的开发者。\n\n在第 2 章中，你将通过了解一些更流行的模型及其构建方式来开启这段旅程。这将有望帮助你为任务选择最佳模型！\n\
  \n# 第 2 章 模型架构：AI 的 DNA\n\n在第 1 章中，我们探讨了“一个巨型模型通吃一切”的时代正在演变，以及为什么微调更小、更专门的模型代表实用\
  \ AI 部署的强大未来。扩展技能成为模型定制者的机会就在你面前。但在你做到这一点之前，你需要理解你正在定制*什么*。打个比方——一个不懂发动机工作原理的机械师能换机油，但无法重建变速箱。同样，如果你是一名微调实践者，你需要掌握\
  \ Transformer 模型工作的基本原理。这样你就不会被局限于表面层次的调整，而能够做出那些区分平庸微调模型与卓越微调模型的深度战略决策。\n\n因此，在本章中，我们将进行一次解剖课。目标是剖析当今驱动每一个主要语言模型的架构。你将考察区分领先开源模型家族的关键创新，并理解它们如何将原始文本转换为使“理解”成为可能的数学表示。这将是一个非常宏观的视角，因为关于\
  \ Transformer 内部工作原理可以写上好几整本书，所以我们只挑重点讲。\n\n在本章结束时，你将拥有为特定微调项目选择基础模型所需的基础。\n\n##\
  \ 信息流：Transformer 如何工作\n\n\n\n\n在深入细节之前，最好先建立一个关于基于 Transformer 的语言模型如何处理文本的高层思维模型。要详细探讨这个问题需要好几本书的篇幅，所以我只打算讲一些重点。\n\
  \n你可以在图 2-1 中看到这一点。\n\n![一个方块图的图示。AI 生成的内容可能不正确。](img/ch02_figure_1_1772730611456644.png)\n\
  \n*图 2-1. Transformer 高层架构*\n\n关键洞察在于，文本作为离散符号序列进入模型。通常这些符号是字符编码，如 ASCII 或 Unicode\
  \ 中的“T”、“h”、“e”。这些字符编码根据标点分隔成单词。然后使用分词器（tokenizer）将单词转换为词元（token）。这些词元仅仅是单词或子词的数值表示。\n\
  \n这些词元本身并不包含内在的“意义”或“位置”信息。这就是第二个方框——嵌入（embeddings）——发挥作用的地方。嵌入是表示单词含义的向量。可以把嵌入想象成高维空间中的箭头，其指向的方向代表含义。相似的单词——比如“King”（国王）和“Prince”（王子）——会指向大致相同的方向。\n\
  \n在 Transformer 中，向量还会加上位置编码。这种位置编码表示单词在表达中的位置，其理论依据是单词位置会影响其语义。一个典型的例子是形容词的使用。例如，“那只大狗吃了肉”——我们可以看到形容词“big”（大）直接修饰狗，但它也可以间接地修饰“meat”（肉）——因为一只大狗更有可能吃很多肉！\n\
  \n所有这些都发生在词元流入 Transformer 模块*之前*，而正是在这里，孕育了引领当前 AI 技术爆发式发展的创新。\n\n## 注意力机制\n\n\
  这是 Transformer 的核心。我喜欢用这个类比来思考：想象你正在阅读一份文档，手里拿着一支荧光笔。每读一段，你可能会标出某些单词或短语，因为它们能帮助你理解当前句子。也许这是一篇虚构作品，其中角色正在吃一种你从未听说过的食物。你回头一看，发现故事发生在某个特定地点，这可以帮助你理解，或者至少做出一个合理的猜测，关于这种食物是什么。\n\
  \n注意力机制以人工方式模拟了同样的过程。对于序列中的每个位置，它会计算应给予其他每个位置的“注意力”大小。\n\n让我们考虑这样一句话：“The cat sat\
  \ on the mat because it was tired.”（猫坐在垫子上，因为它累了。）\n\n当处理“it”（它）这个词时，你需要确定“it”（它）指的是什么。作为人类，阅读这段话时，你知道它指的是猫。但你再想一想，它也可能指垫子。而且如果严格按语法规则而非语义来看，有人可能会说它确实指垫子！\n\
  \n注意力机制会计算“it”（它）的注意力分数，以确定它指的是什么。最终，基于大量训练数据，它很可能在“it”（它）和“cat”（猫）之间建立更强的联系，而不是“it”（它）和“mat”（垫子）之间。\n\
  \n这是通过一种优雅的数学运算实现的。它通过计算三个向量来完成：\n\n* 查询（`Q`）：“我在寻找什么？”\n* 键（`K`）：“我包含什么？”\n* 值（`V`）：“我提供什么信息？”\n\
  \n它们的计算方式是将单词的嵌入向量（如本章前面所讨论的）与随时间学习而得的权重矩阵相乘。\n\n你可以在图 2-2 中看到这一点。\n\n![一张带有黑色线条的白纸。AI\
  \ 生成的内容可能不正确。](img/ch02_figure_2_1772730611456682.png)\n\n*图 2-2. 理解注意力机制*\n\n在这个例子中，我们探究输入词元，并重点关注“it”（它）对应的词元，它位于第\
  \ 8 个位置。\n\n然后，我们查看每个单词的键，并检查它们的值。每个键都有一个分数，我们将“it”（它）的`Q`与每个单词的`K`相乘。随后对结果进行`softmax`操作，得到概率，从而得到一组注意力权重。\n\
  \n这些权重就是应当应用于该词的注意力概率。因此，对于“it”（它）这个词，与之关联最紧密、概率最高的词是“cat”（猫）。为了计算输出和最终的注意力，我们将权重与值相乘。\n\
  \n这一机制的美妙之处在于它完全是*学习而来*的。你可能会想，图中那些值是从哪里来的？如果没有一组良好的`K`值作为起点，这一切都将毫无意义。请认识到模型训练所依赖的海量文本——并且从这些文本中，经过时间的推移、反复试错以及经典的“机器学习”范式，有用的模式得以被学习。\n\
  \n这些用于在文本嵌入向量上学习注意力的`Q`、`K`、`V`“块”通常被称为“头”。当使用多个头时，我们发现有些头最终会追踪语义关系，有些头则追踪语法关系，还有一些头会捕捉我们甚至无法命名的词语关系模式。\n\
  \n通常，当有多层头时，序列中靠前的头会学习更明显的连接，如句法或语法；而靠后的头会捕捉更复杂的语义关系。\n\n## 多头注意力\n\n单个注意力操作只能捕获词元之间的一种关系类型。语言充满多种同时存在的关系类型，而且不同语言可能拥有英语中不存在的关系类型。为了捕获这种丰富性，多头注意力的概念应运而生：它并行运行多个注意力操作，每个操作都有自己学习到的`Q`、`K`、`V`矩阵，这种做法非常有用。\n\
  \n你可以在图 2-3 中看到这一点。\n\n![一个多头注意力的示意图。AI 生成的内容可能不正确。](img/ch02_figure_3_1772730611456705.png)\n\
  \n*图 2-3. 多头注意力*\n\n例如，像 Llama 3 8B 这样的模型，会在 32 层中每层使用 32 个注意力头。\n\n每一层的头会在不同的抽象层次上运作——早期层倾向于学习句法模式，而后期层则深入到语义。\n\
  \n### 降低 MHA 中的维度\n\n这些层会减少每个头的维度以节省计算成本。\n\n*隐藏*维度是 4,096——这是每个词元在网络中流动时对应的向量大小。模型不会在全部\
  \ 4,096 个维度上运行注意力操作，而是将其拆分为 32 个并行的头，每个头在 128 个维度上工作（`4096 / 32 = 128`）。\n\n因此，每个头会计算自己的注意力分数，并产生\
  \ 128 维的输出。然后这 32 个输出会被重新拼接在一起，并通过另一个学习得到的权重矩阵——通常称为“输出投影”。这有一个重要的目的：它允许模型跨头混合信息。如果没有它，各个头将完全独立（即头\
  \ 1 拥有前 128 个维度，头 2 拥有接下来的 128 个维度，依此类推）。通过这个输出投影，模型学习如何将不同头的不同视角合并成下一层的统一表示。\n\n\
  这使总计算量大致与单个大型注意力操作相当，但给了模型更多的灵活性来学习多样化的模式。\n\n**注意**\n\n\n\n人们容易想象不同的注意力头会整齐地分工，像图\
  \ 2-3 这类可视化也倾向于这样呈现，因为类似“头 1 负责语法，头 2 负责语义”这样的说法更容易让我们理解，但现实要混乱得多。对 Transformer\
  \ 可解释性的研究表明，专业化更多发生在*层与层之间*，而不是*层内*。靠近输入的较浅层往往捕捉局部的句法模式：哪些词相邻、基本的语法关系、位置信息等。更深层则逐步构建更抽象的语义关系：句子表达什么含义、概念之间如何关联、对一个问题可能给出什么合适回答，等等！\n\
  \n在任意单层内部，多个头确实会学习不同的模式，但实际上它们并不能映射到人类可解释的类别上。多头注意力的力量正来自这种冗余性和多样性——模型在训练过程中自己发现对它的语料有用的东西，而不是通过人为设计的方向。\n\
  \n## 自注意力与交叉注意力\n\nTransformer 架构中有两种主要的注意力类型值得你关注。\n\n我们到目前为止讨论的都是*自注意力*，即一个序列对自身进行注意力计算。查询（Q）、键（K）、值（V）都来自同一个句子。在我们读小说的假设场景中，假设有一个段落同时提到了一个地点和一种食物，我们的注意力就*只*放在那个段落上。\n\
  \n*交叉注意力*则在此基础上扩展，它允许一个序列去关注另一个不同的序列。在假设的例子中，我们可能在前面章节已经知道这个角色是素食主义者，这会给我们一个线索，猜出那个未知食物可能是什么。用机器学习的术语来说——本质上是这里的`Q`值可以来自一个序列，而`K`和`V`来自另一个序列。\n\
  \n对于*大多数*注意力模型，包括所有你可能会微调的模型，自注意力是主导机制。交叉注意力出现在编码器-解码器架构中，也出现在多模态模型中，因为这类模型可能既需要关注图像特征，也需要关注文本。\n\
  \n## 前馈网络\n\n当注意力机制完成它的工作，让每个 token 从其他 token 那里收集到上下文信息后，每个位置都会经过一个前馈网络（`FFN`）。这是一个简单但强大的两层神经网络，它独立地应用于每个位置。\n\
  \n你可以在图 2-4 中看到它。\n\n![算法示意图，AI 生成的内容可能不准确。](img/ch02_figure_4_1772730611456723.png)\n\
  \n*图 2-4. 前馈网络*\n\n它的目的归根结底是存储模型的“知识”。可以把注意力机制想象成收集*上下文*——注意力应用之后，每个 token 的表示都会从它所关注的其它\
  \ token 那里获得信息而得到丰富。随后`FFN`会处理这个带有上下文的表示，提取有用特征，并将其转换成适合下一层的形式。\n\n这种“先扩展后收缩”的结构是关键。第一层会把嵌入的维度从\
  \ 4,096 扩展到 14,336 维。这个更大的空间允许网络表示更复杂的模式。它用那么多神经元来完成这一点，每个神经元可以被看作一个“模式检测器”。当输入匹配某个神经元已经学会识别的模式时，它就会被强烈激活。\n\
  \n在提升维度之后，会应用*非线性*激活函数，比如`SiLU`或`SwiGLU`。我强调非线性，是因为如果你考虑线性变换——它只是一个对向量进行缩放或旋转的矩阵乘法，但无法处理曲线或阈值。所以，如果你堆叠两个线性层——实际上等于先用`矩阵\
  \ A`乘，再用`B`乘，但这在数学上等价于直接用单个矩阵`BA`乘。不管你堆叠多少层，它们最终都会坍缩成一个——额外的深度不会带来任何收益。\n\n但如果你使用非线性激活函数，神经元会变得更有选择性。想象其中一个神经元，它的第一层权重在输入看起来像“关于美食的问题”时计算出高值，而在其它情况下计算出低值或负值。激活函数如果是非线性的，就会是弯曲的——从而增强对美食问题的激活，而对其它一切保持接近零。没有非线性，神经元就会对所有内容都成比例地响应，而不会学会触发在特定相关模式上，同时忽略其它模式。\n\
  \n第二层线性层随后把表示投射回 4,096 维。第一层中的每个神经元在第二层都有一个对应的神经元。这通常被认为是与输入模式相关联的“知识”，也是模型在检测到该模式时应该输出的内容。这就是为什么研究者经常把`FFN`层描述为像键值*记忆*一样工作。第一层的权重是匹配输入值的键，第二层的权重是当某个键匹配时被检索到的值。\n\
  \n例如，当输入表示“来自长崎的食物”时，第一层的某个神经元可能会激活，而相应的输出神经元可能会推动表示向“御好烧”这些 token 靠近。这是一个过度简化的抽象——真实的映射远没有这样接近人类可理解的概念，但它确实抓住了文本语料中的事实知识是如何被编码的基本机制。\n\
  \n对于微调来说，这一点非常重要——`FFN`层捕获了模型深度知识中很大的一部分。在像`LoRA`（我们会在第 7 章探讨）这样的技术中，我们可以向这一层注入知识。最终，如果你能建立起这样的心智模型：注意力层专注于“看什么”，而`FFN`层负责“拿它做什么”，你就会在理解如何以及在哪里应用自定义适配方面有极大的先发优势。\n\
  \n## 层归一化与残差连接\n\n在关于 Transformer 的讨论中，你可能还会看到另外两个至关重要但常被忽视的组件：*层归一化*和*残差连接*。它们使深度网络能够稳定训练：\n\
  \n*残差连接*（也叫跳过连接）把每个子层的输入加到它的输出上。这让梯度在训练期间更容易流动，也让模型能够在每一层学习做增量改进，而不是完全重写。它们还有助于防止梯度爆炸（变得太大因而失去意义）或梯度消失（趋近于零，从而丢失信息）。\n\
  \n*层归一化*则对特征维度上的激活进行归一化，使值在网络中传递时保持分布稳定。要注意的是，一个向量的绝对数值意义相对较小，而它的概率分布可能更重要。归一化意味着值通常分布在\
  \ 0 和 1 之间，避免值聚成一团从而丢失信息。现代模型如 Llama 使用的是`RMSNorm`（均方根归一化），它的计算更简单。\n\n## 仅解码器的主导地位\n\
  \n最初的 Transformer 论文描述了一种为机器翻译设计的*编码器-解码器*架构。编码器处理输入序列（源语言），解码器生成输出序列（目标语言），并通过交叉注意力来关注编码器的表示。\n\
  \n![过程示意图，AI 生成的内容可能不准确。](img/ch02_figure_5_1772730611456741.png)\n\n*图 2-5. 编码器-解码器\
  \ Transformer*\n\n\n\n\n对于*语言翻译*来说，这一点至关重要，因为当把一种语言翻译成另一种语言时，需要查看句子中前后的词才能有效地进行翻译。\n\
  \n但对于*生成*任务来说，你不能关注“前面”的词，因为它们还不存在。如果你有一个像“The cat sat”这样的 token 序列，那么你只能向后看以进行关注。这个过程被称为“因果”（causal）注意力，在这种机制中，每个位置只会关注序列中之前的位置。这是通过对\
  \ token 施加掩码来实现的，以防止向前看，如图图 2-6 所示。\n\n![一张带有文字的纸，AI 生成的内容可能不正确。](img/ch02_figure_6_1772730611456757.png)\n\
  \n**图 2-6. 解码器与因果注意力**\n\n因此，不需要带有双向自注意力的编码器，只需要解码器即可。\n\n仅解码器架构在 Llama 或 Mistral\
  \ 等开源模型中变得非常流行。\n\n它相对简单！它只有一个架构和一个训练目标（下一个 token 预测），因此更容易扩展。它还有统一的输入和输出。最终，同一个架构既可以“理解”提示，也可以“生成”响应。输入和输出之间没有人为的界限。\n\
  \n研究人员发现，仅解码器模型在扩展到足够规模时，会发展出显著的能力，包括上下文学习、思维链推理和指令遵循，而无需针对这些任务进行显式训练。\n\n对于训练和微调，序列中的每个位置都提供一个训练信号（预测下一个\
  \ token），这使得训练数据的利用率非常高。\n\n当你微调这些模型时，你很可能会使用这种仅解码器架构。训练过程会调整模型的权重，使得在给定你的特定提示和上下文时，它能够以符合你期望输出的方式预测下一个\
  \ token。\n\n## 分组查询注意力（GQA）\n\n要理解分组查询注意力（GQA），最好先看看 Llama 的早期历史。\n\n开放、可调优的模型几乎就是这种模型的代名词。虽然“开源”这个术语通常被用来描述它们，但我一般不太认同这种说法，因为我们没有源代码，也没有数据。我们所拥有的只是在各种开源许可下发布的模型预训练权重（因此我们可以修改它），以及描述其架构的论文。\n\
  \n首个版本于 2023 年 2 月发布，采用了相对标准的 Transformer 实现。它的总体意义在于证明了更小但训练良好的模型也能参与竞争——至少在标准基准测试上与更大的模型相比时是如此。需要指出的是，许多基准测试是围绕更大模型设计的，因此随着更多小型模型的出现，基准测试的理念也需要演进。同样，虽然在基准测试上的性能可能相当，但上下文窗口大小是小模型与大模型之间最显著的区别。Llama\
  \ 的上下文窗口只有 2048 个 token。\n\n几个月后，版本 2 发布，将上下文窗口大小翻倍（增加到 4096 个 token），并引入了一项新创新——称为“分组查询注意力（GQA）”，这是对性能至关重要的优化。你还会看到，正是小型化带来的约束推动了创新，GQA\
  \ 就是一个绝佳的例子。\n\n在首次发布后一年多一点，Llama 3 再次将上下文窗口大小翻倍——小模型达到 8192 个 token，更大的模型系列则高达\
  \ 128k 个 token。它还改进了词汇表，达到 128k 个 token，提升了 4 倍，并更新了 GQA 的实现。\n\n那么，让我们来探讨 GQA 是什么，以及它为何如此重要。\n\
  \n分组查询注意力是现代 LLM 中最重要的优化之一，理解它有助于你在解决问题时更好地决定选择哪个模型。\n\n在标准的多头注意力中，正如你本章前面所看到的，每个头都有自己的查询（Query）、键（Key）和值（Value）投影。在推理过程中，必须缓存所有之前\
  \ token 的键和值张量（即“KV 缓存”），以避免在每一步生成时重新计算它们。\n\n对于长序列，这个缓存会成为显著的内存瓶颈。\n\n你可以在图 2-7\
  \ 中看到这一点。\n\n![一个图表的示意图，AI 生成的内容可能不正确。](img/ch02_figure_7_1772730611456773.png)\n\
  \n**图 2-7. 多头注意力与 KV 缓存大小**\n\nGQA 的思想是在这里通过分组查询头来取得平衡，每组共享 K 和 V 投影。你可以在图 2-8 中看到这一点。\n\
  \n![一个关于若干问题的示意图，AI 生成的内容可能不正确。](img/ch02_figure_8_1772730611456788.png)\n\n**图\
  \ 2-8. 分组查询注意力**\n\n在这个简单的例子中，有 6 个头，不是每个 Q 都有自己专用的 KV，而是 Q1 和 Q2 共享一个 KV，Q3 和 Q4\
  \ 共享一个，依此类推。这使 KV 缓存大小减少了 50%。\n\n在 Llama 3 8B 中，32 个查询头被分成 8 组，每组 4 个，并且每组共享 8\
  \ 个键值头。\n\n与标准的多头注意力相比，这将 KV 缓存减少了 75%，大幅提升了推理速度并降低了内存需求——尤其是在长上下文场景下。\n\n因此，在进行微调时，最好考虑使用\
  \ GQA 的模型，因为它们能在不牺牲太多质量的情况下提供更好的推理性能。\n\n## 持续创新：Mistral 和 Mixtral\n\n继续讲述由更小模型驱动的创新故事，以及那些在更大模型中往往被忽视的效率需求，让我们现在来探讨\
  \ Mistral 和 Mixtral。\n\nMistral 7B 于 2023 年 9 月推出，它证明了相对较小的模型——只有 7B——也能在基准测试上与更大的模型竞争。它凭借几项关键创新做到了这一点。\n\
  \n### 滑动窗口注意力\n\n当我们关注之前的 token 时，token 序列越长，需要管理的规模就越呈爆炸式增长。因此，如果每个 token 都必须查看其他每个\
  \ token（包括它自己），我们最终会得到二次方数量的查找。对于 2 个 token，会有 2 次比较，每次比较 2 个 token，所以是 4 次查找。对于\
  \ 10 个 token，则为 100 次。对于 1000 个 token，就是 100 万次查找！那么对于 128k 个 token 的上下文窗口，这个数字会变得多大呢？\n\
  \nMistral 引入了滑动窗口，其中每个 token 只直接关注之前的 4096 个 token。你最初可能会认为，上下文窗口之外的信息会丢失，但请再仔细想一想。\n\
  \n如果上下文是 128k 个 token，而你只使用 4k 的滑动窗口，可能会感觉大多数 token 都被忽略了。\n\n但在多层模型中，情况未必如此。让我们来探讨一下。\n\
  \n![一个图表的示意图，AI 生成的内容可能不正确。](img/ch02_figure_9_1772730611456804.png)\n\n**图 2-9.\
  \ 滑动窗口上下文的移动**\n\n想象一下 10 个 token，使用 4 个 token 的上下文窗口。例如，对于 token 7 到 10，我们滑动窗口的输出将是第\
  \ 2 层中的“最右侧”token。类似地，token 4 到 7 的窗口会在与 token 7 对应的位置产生输出。\n\n你可以看到，5 到 8 会在位置\
  \ 8 产生输出，6 到 9 会在位置 9 产生输出，尽管这些没有画在图 2-9 中。\n\n然后，当你到达第 3 层时，位置 10 的 token 实际上接收到了从位置\
  \ 4 一路传递过来的上下文，这是通过各层传递上下文的“金字塔”效应实现的。\n\n\n\n感受野随深度线性增长，这使得 token 所需的处理量不再出现二次方爆炸。令人惊讶的是，该模型的表现与许多没有在注意力处理管理上做创新的更大模型相当！它们只是蛮力处理而已。\n\
  \n## 稀疏混合专家\n\n尽管 Llama 4 可能是广受欢迎且广泛使用混合专家（Mixture of Experts）的知名模型，但 Mixtral 引入了一个变革性的版本——稀疏混合专家（Sparse\
  \ Mixture of Experts）。这是一种根本不同的扩展方法。\n\n在标准 Transformer 中，每个 token 都会经过模型的每一个参数，如\
  \ 图 2-10 所示。\n\n![一张单人示意图，AI 生成的内容可能不正确。](img/ch02_figure_10_1772730611456819.png)\n\
  \n###### 图 2-10. 标准 Transformer 中的前馈网络\n\n在混合专家模型中，前馈网络（FFN）层被多个“专家”FFN 替代，由路由/门控网络决定每个\
  \ token 使用哪些专家。你可以在 图 2-11 中看到这一点。\n\n![一张算法示意图，AI 生成的内容可能不正确。](img/ch02_figure_11_1772730611456834.png)\n\
  \n###### 图 2-11. 稀疏混合专家\n\n在这种情况下，输入会先经过注意力层，然后由路由器/门控选择使用哪个前馈网络。例如，如果 token 是“code”，那么最匹配的\
  \ 2 个专家可能分别是一个专门处理编程的专家，和一个专门处理数学的专家。数据被路由到这些 FFN，并通过加权组合形成输出。\n\n这就是 Mixtral 模型成为“稀疏”混合专家的原因。它不是让\
  \ token 经过*每一个*专家再对输出加权，而是只选择 2 个专家，然后对它们的输出加权。\n\n以 Mixtral 8x7B 这样的模型为例，名称可能让人以为它是一个\
  \ 7B 模型，但实际上并非如此——8x7 指的是 8 个专家，每个专家都接近 7B 参数！\n\n对于每个 token，路由器会选择排名前 2 的专家，如图所示。\n\
  \n因此，对于这个模型，总参数为 46.7B——用于存储所有专家。但在任何一次推理中，只会用到 2 个专家，因此实际使用 12.9B 参数。这样，你既获得了更大模型的容量，又在推理时只付出较小模型的计算成本。\n\
  \n在微调方面，MoE 模型处理起来更棘手。你可能只想微调选定的专家，或者只微调路由模型。训练动态要复杂得多，而且即使推理很高效，你也需要更大的显存（VRAM）来容纳所有参数。对于许多微调项目，非\
  \ MoE 模型可能是更简单的选择！\n\n## Gemma：谷歌的开放方法\n\n多年来，谷歌凭借多种模型进入了开放权重领域，但截至撰写本文时，最新的模型名为*Gemma*。Gemma\
  \ 基于驱动谷歌托管的大型 Gemini 模型的同一研究，提供多种尺寸。截至撰写本文时，最新版本 Gemma 3 的参数量从 270M 到 27B 不等。\n\n\
  Gemma 的一个关键特点是，许多 Gemma 变体从一开始就经过了*指令微调*。这意味着它们已经对齐到可以遵循指令的状态，开箱即可用于许多任务。当你在 huggingface\
  \ 之类的模型库中查看 Gemma 模型列表（[Gemma 3 发布](https://huggingface.co/collections/google/gemma-3-release)）时，会看到所有模型，对于\
  \ Gemma 3 来说，情况如 图 2-12 所示。\n\n![一张计算机截图，AI 生成的内容可能不正确。](img/ch02_figure_12_1772730611456848.png)\n\
  \n###### 图 2-12. HuggingFace 上的 Gemma\n\n你会看到一些模型带有前缀 `-it`，表示“指令微调”（Instruction\
  \ Tuned），以及 `-pt`，表示“预训练”（Pre Trained）。后者没有进行额外的对齐以适用于聊天场景，而只是原始的 token 进、token\
  \ 出。这对你来说非常有用，因为你可以在不需要绕开谷歌已有工作的前提下，创建自己的指令微调。\n\n由于尺寸多种多样，Gemma 3 在管理 KV 缓存时采用了略有不同的架构。\n\
  \n*标准*尺寸系列（4B、12B 和 27B）都使用前面概述的分组查询注意力（Grouped Query Attention，GQA）。这就是为什么像这样的小模型能够支持\
  \ *128K 上下文窗口*，而不会让 KV 缓存的内存需求爆炸。\n\n*较小*尺寸系列（1B 和 270M）针对设备端速度进行了优化。它们使用一种称为*多查询注意力*（Multi\
  \ Query Attention，MQA）的新型注意力机制，这是一种非常激进的 GQA 版本，其中*所有*注意力头共享一个键/值头。这使得它非常快，但会失去一些细粒度。它确实能让模型足够小，从而在基础硬件上运行。\n\
  \n###### 注意\n\nGemma 3 在 GQA 上有一个独特的设计，即所谓的*注意力比率*。其目标是混合使用滑动窗口。正如我们之前讨论的，每 6 层中有\
  \ 5 层使用 1024 个 token 的滑动窗口，而每 6 层中有 1 层会查看完整的 128k 上下文！\n\n## 分词器与嵌入\n\n在讨论架构时，还需要考虑不同的分词（tokenization）方法（将人类语言词汇转换为代表它们的数字）和嵌入（embedding）方法（为\
  \ token 赋予高维向量表示以试图捕捉上下文），以及高效使用这些方法的技术手段。\n\n### 分词\n\n当我们仔细审视分词，并将其定义为将文本拆分为模型可以处理的离散单元的过程时，我们会发现它比简单的按词拆分要复杂得多。\n\
  \n这种复杂性的原因可能包括：\n\n*   罕见词需要极其庞大的词汇表。为“antidisestablishmentarianism”这样的词专门设置一个 token\
  \ 是否值得？\n\n*   非英语语言可能以不同方式处理单词间的空格\n\n*   拼写错误、新词和代码会非常难以处理\n\n*   一个词的变体（“run”、“running”、“runs”）会彼此完全独立，从而可能失去它们的语义相似性。\n\
  \n为了克服这一点，大多数现代 LLM 使用*子词*分词，其词汇表由常见词或其片段组成。这提供了一种平衡——“the”这样的常见词会成为单个 token，效率很高，而更罕见的词则会被拆分为多个\
  \ token，如“anti”、“dis”、“esta”、“blish”等。\n\n分词器的选择很重要，因为不同的模型使用不同的分词器，而分词器是在不同数据上训练的！每个分词器都有自己的一套工作词汇，这会影响效率。Llama\
  \ 2 等模型有 32,000 个 token，而 LLama 3 有超过 128,000 个 token。更大的词汇量意味着常见单词和短语更有可能成为单个 token——这会缩短序列长度，让你在上下文窗口中获得更多信息。但这也意味着更大的嵌入矩阵，因此需要权衡。\n\
  \n#### 理解语言与分词\n\n如果你使用的是处理代码或特殊字符的模型，分词器会千差万别。许多分词器主要针对*英语*文本训练，并未针对代码优化。另一些分词器的训练数据中则包含编程语言——最值得注意的是，它们使用的分词器在词汇上对“代码友好”。\n\
  \n此外，在多语言覆盖方面，在英语文本上训练的分词器很可能会将非英语文本切分成许多更小的 token。\n\n考虑中文短语“你好世界”，即“Hello World”的中文表达。如果使用在英语文本上训练的分词器，它将被编码为\
  \ 4 个独立的 token，分别代表中文文本的 Unicode 字符 \\[你\\]\\[好\\]\\[世\\]\\[界\\]\n\n\n\n一个能够理解中文字符及其如何组成词的多语言分词器会更高效，并能恰当地将“你好”和“世界”分解为\
  \ `[你好]` `[世界]` 这样的“词”。\n\n如你所见，这将极大地影响效率和质量。更多的 token 意味着更长的序列，处理速度更慢且携带更少的上下文，性能也会受到负面影响。\n\
  \n> **警告**\n>\n> 在微调时，你最终需要考虑分词器。除非从头重新训练，否则无法更改模型的分词器。选择基础模型时，请检查其分词器能否高效处理你所在领域的文本。如果你针对特定编程语言或非英语语言进行微调，必须验证分词器不会产生过长的序列。\n\
  \n### 字节对编码（BPE）\n\n执行分词最常见的算法是字节对编码，这是一种最初为数据压缩而开发的方法！\n\n它的工作原理如下：\n\n- 从单个字符的词汇表开始，每个字符由一个字节表示\n\
  - 统计训练语料中所有相邻字符对\n- 将最频繁出现的字符对合并为一个新 token\n- 重复此过程，直到词汇表达到所需大小\n\n例如，假设一个语料库只有\
  \ 3 个词：‘low’、‘lower’ 和 ‘lowest’。\n\n我们会从单个字符的完整词汇表开始：`[l]`、`[o]`、`[w]`、`[e]`、`[r]`、`[s]`、`[t]`、`[]`，其中我用\
  \ `[*]` 表示空格。\n\n然后，我们看一下每个词的分词结果：\n\n```\n[l], [o], [w], [*], [l], [o], [w], [e],\
  \ [r], [*], [l], [o], [w], [e], [s], [t]\n```\n\n从中我们可以看到，`[l]` 后跟 `[o]` 是最频繁的配对，因此我们重新编码，用\
  \ `[lo]` 字符代替 `[l]` 和 `[o]`。\n\n```\n[lo], [w], [*], [lo], [w], [e], [r], [*], [lo],\
  \ [w], [e], [s], [t]\n```\n\n现在我们可以看到，`[lo]` 后跟 `[w]` 是最常见的，因此我们重新编码为：\n\n```\n\
  [low], [*], [low], [e], [r], [*], [low], [e], [s], [t]\n```\n\n……我们会继续这个过程，直到获得所需的\
  \ token 数量。\n\n### 嵌入（Embeddings）\n\n文本经过分词后，每个 token ID 都会被映射到一个嵌入向量。这是 token 在高维空间中的一种表示。让我们来探讨这意味着什么。以\
  \ Llama 3 8B 为例，其嵌入维度为 4,096。换句话说——表示一个 token 语义的向量是 4,096 维空间中的一个方向。\n\n虽然这很难直观想象，但请记住，这里的目标是编码语义关系。经过训练后，含义相似的\
  \ token 往往具有相似的嵌入。相似的嵌入在向量空间中彼此靠近，它们的向量“指向”相似的方向。\n\n理解这一点的一个好方法是只考虑二维情况。例如，假设我们考察简·奥斯汀小说\
  \ *《傲慢与偏见》* 中的人物，考虑性别和贵族身份两个维度。我们可以将前者绘制在 x 轴上，后者绘制在 y 轴上，向量的长度表示每个人物的财富（图 2-13）。\n\
  \n![《傲慢与偏见》中的人物向量](img/ch02_figure_13_1772730611456863.png)\n\n**图 2-13.** 《傲慢与偏见》中的人物向量\n\
  \n通过观察图表，你可以推断出关于每个人物的大量信息。其中三个人物是男性。达西先生非常富有，但他的贵族身份并不明确（他被称为“先生”，而不像不那么富有但显然更高贵的卢卡斯爵士）。另一位“先生”班纳特先生，显然不是贵族，而且经济拮据。他的女儿伊丽莎白·班纳特与他相似，但性别为女。我们例子中的另一位女性角色凯瑟琳夫人，是贵族且极其富有。达西先生和伊丽莎白之间的爱情引发了张力——*偏见*来自向量中高贵的一侧，指向不那么高贵的一侧。\n\
  \n正如这个例子所示，通过考虑多个维度，我们可以开始看到词语（这里是人名）中的真实含义。同样，我们说的不是具体定义，而是一种基于坐标轴以及一个词的向量与其他向量之间关系的*相对*含义。\n\
  \n#### 通过 RoPE 理解位置嵌入\n\nTransformer 会并行处理所有 token，因此它们没有固有的顺序概念。为了注入位置信息，我们将位置嵌入添加到\
  \ token 嵌入中。\n\n像 Llama 这样的现代模型使用旋转位置嵌入（RoPE），它通过一种涉及嵌入空间旋转的创新技术来编码位置。RoPE 的关键优势在于，它允许模型泛化到比训练时更长的序列，同时最大限度地减少质量下降。\n\
  \n考虑句子“猫吃了老鼠”。如果没有位置信息，模型会发现“猫吃了老鼠”和“老鼠吃了猫”这两个句子在*数学上*是相同的。\n\n旋转位置嵌入（RoPE）通过将词嵌入不仅视为空间中的静态点，还视为可以被*旋转*的向量，从而解决了这个问题。\n\
  \n为了编码位置，RoPE 不是向嵌入中添加一个表示位置的固定值，而是通过旋转嵌入向量来实现。因此，对于序列中的每一步，其思想是将该词的向量旋转一个特定角度。如果我们把这个角度称为“theta”θ，那么第一个嵌入旋转\
  \ θ，第二个旋转 2θ，第三个旋转 3θ，依此类推。随着我们在序列中不断前进，嵌入向量会以可预测、可计算的方式远离原点“旋转”。\n\n现在的想法是，除了嵌入中编码的词的语义（如我们在前一节所见），词的*位置*也可以被编码，这样当模型计算注意力分数时，它能将两者都考虑在内。因此，回顾一下：嵌入是向量，词之间的相对*含义*（就像我们在《傲慢与偏见》人物中看到的那样）可以编码在这些向量之间的关系中，我们可以在数学上使用点积来评估这一点。当词在语义上相似时，它们的点积很高，因为它们的向量相似。否则点积很低。模型利用这一点根据相关性来分配注意力。\n\
  \n但如果没有位置编码，模型可能会认为一本书开头的“猫”和书末尾出现的“猫”是完全相同的“猫”。它能看到猫的含义，却对猫出现的顺序视而不见。\n\n使用 RoPE，你不会破坏这种语义：你只是通过一个角度旋转它来扭曲它。现在，句子中距离较近的词具有相似的旋转，因此*位置*的相似性也被编码到向量中。这是复杂的数学，却给出了一个简单的解决方案。\n\
  \n### 其他注意事项\n\n除了架构之外，你还需要记住其他几个模型能力。我们将在本节中讨论它们。\n\n## 指令遵循\n\n有些模型更擅长遵循复杂的多步骤指令。这源于预训练期间的指令微调。这意味着模型的训练数据是显式地以问答对的形式构建的，以更接近真实世界的使用场景。这使得模型在用户通常提问、模型回答的对话中具有更好的泛化能力。标有“Instruct”或“Chat”的模型为此经过了专门训练。我们在看\
  \ Gemma 时已经看到这一点，指令微调后的模型会在名称末尾加上 `-it`，非常方便。请注意，如果你的任务需要精确遵循指令，从指令微调的基础模型开始通常比从基础模型开始更好。\n\
  \n## 推理深度\n\n\n\n\n\n通常，推理只是模型在“自言自语”。它查看用户的查询，再看自己的答案，然后利用这些信息尝试得出更好的答案。更大的模型通常表现出更好的多步推理能力，但架构选择，尤其是在较小的模型中，也至关重要。像\
  \ Mixtral 这样的 MoE 模型可以将不同的推理步骤路由到不同的专家，从而可能改善复杂推理，并为你提供解决方案的全面概述。虽然这通常是一个“加分项”，但并非总是如此。例如，对于代码解决方案，仅通过代码专家一步执行，可能比通过其他专家多步执行效果更好！对于需要深度推理的任务（数学证明、复杂分析），你可能需要更大的模型，或者接受多次推理调用配合思维链提示，而不是依赖模型内部推理，你可以反复提示它（一次又一次）来强制它进行推理。这可能很难进行微调，所以请相应地管理你的期望！\n\
  \n## 上下文窗口与“中间迷失”问题\n\n仅仅因为模型具有较大的上下文窗口，并不意味着它能有效利用长上下文。“中间迷失”是一种已知现象，即模型强烈关注上下文的开头和结尾，却遗漏了中间的信息。在通过滑动窗口驱动更长上下文的情况下，这可能尤其危险。尤其是在微调时，你应该测试基础模型从文档中不同位置回忆信息的能力，以确定它是否存在这个问题，然后再投入大量资源进行微调！\n\
  \n## 总结\n\n如你所见，决定使用哪种模型取决于多种因素。就我个人而言，我喜欢按以下问题来考虑，但优先级不分先后。\n\n1. 模型使用什么分词器？它能否准确而有意义地编码*我*的数据？\n\
  \n2. 上下文窗口有多大？实际大小是多少？其中有多少是因为 KV 缓存中的巧妙技巧而显得大的？上下文窗口是否满足我用户的预期需求？\n\n3. 模型有多大？它能适配我可用的内存，以便在我想要的地方部署吗？能否进行量化？量化会产生什么影响？\n\
  \n4. 如果我进行重新训练，我的训练系统的内存限制是什么？它能满足参数数量、上下文窗口大小和我可用内存的要求吗？\n\n另请注意以下发现：\n\n1. 在注意力类型方面，使用\
  \ GQA 的模型通常提供较高的推理效率，但 MQA 以牺牲质量为代价提供了更高的效率。\n\n2. 像 Llama 和 Mistral 这样的稠密模型通常更容易微调。MoE\
  \ 模型提供更大的容量，但更难修改。\n\n3. 分词器效率会对模型重新训练或微调所需的时间产生巨大影响。\n\n4. 上下文窗口大小应能容纳你最长的训练示例和预期的推理输入。\n\
  \n5. 通常，基础模型能让你更好地控制最终行为，但如果你的场景是基于指令的（如聊天），那么使用模型的指令调优变体可能更好。\n\n6. 硬件。请记住，*训练*消耗的资源远多于推理。确保你的模型不仅适合最终用户的推理需求，而且你还需要考虑训练需求和成本，这些可能非常可观！\n\
  \n可供你选择的模型数量一直在增长。但我认为这些问题为你提供了一个很好的起点！\n\n理解这些架构基础将贯穿你的微调之旅。在下一章中，我们将把这些理论知识转化为实际的硬件和软件设置——微调者的工作坊，你将在那里开始构建你的专家模型。\n\
  \n# 第 3 章 微调者的工作坊\n\n你有没有试过用错误的工具组装家具？幸运的是，世界各地的宜家都附带了必要的内六角扳手和螺丝刀。但在他们提供这些工具之前，你通常最多只能得到一张摇摇晃晃的桌子。而且那还是在与工具搏斗一番*之后*、真正动手组装之前的结果。\n\
  \n微调模型也是如此。正确的硬件和软件设置就是一切，是避免那些充满晦涩错误信息的令人沮丧的长夜的最佳投资。\n\n在本章中，我们将讨论这个工作台。正确硬件的搜索空间几乎是无限的，所以我会就我认为适合起步的一套配置发表个人见解！当然，你不必采纳我的建议，但我*会*在本书的所有示例中使用它们。\n\
  \n## 为什么设置很重要\n\n当你对模型执行推理时，输入提示并得到响应，你完成的是相对轻量的工作。模型的权重驻留在内存中，数据通过网络流经并触发一系列计算。张量被压缩成输出词元，再解码为单词。一台不错的笔记本电脑就能处理\
  \ 7B 规模模型的推理。\n\n但微调则完全不同。你不仅仅是在让数据通过模型——而是在更新模型内部的参数。因此，每一步训练不仅需要你存储权重和偏置，还需要存储梯度——每个权重为达到预期目标而应移动的方向。此外，优化器还会维护状态，即针对每个参数跟踪的动量和方差历史。像`Adam`这样的优化器占用的存储空间可能是权重和偏置的两倍。\n\
  \n粗略计算一下，一个 7B 参数、16 位精度的模型大约需要 14 GB 内存。但这不仅仅是参数的问题——再加上梯度、优化器状态、激活等，你会推高到 70–80\
  \ GB，这远超价格合理的消费级 GPU 的承受范围，一台工作站可能就要花费五位数。稍后在本章中，你会看到更详细的计算。\n\n如果你尝试过任何微调模型的操作，可能见过“Cuda\
  \ Out of Memory”消息。昨天你做推理时还好好的，但现在你对内存的需求大大增加了！\n\n所以，即使你从本章中什么也没学到，也请明白：衡量模型大小只是了解调优该模型需求的第一步。\n\
  \n在内存之后，下一个重要的考虑因素是你的软件环境。对于微调，生态系统在不断演变，但可以将其视为位于 PyTorch、CUDA、Hugging Face 和量化工具的交叉点。每个都有各自的版本要求和相互依赖关系。例如，CUDA\
  \ 和 PyTorch 之间的版本不匹配通常会给你一个静默的失败——你的代码能运行，但它无法利用 GPU，导致执行任何操作的时间急剧增加！bitsandbytes\
  \ 与你的 CUDA 版本不匹配可能会导致加载失败或编译错误，让你陷入 Stack Overflow 的兔子洞，或与你选择的 LLM 进行一场非常漫长的对话。\n\
  \n> **注意：** *氛围编程*固然很棒，但它容易出现这类问题。用于训练模型理解和生成代码的训练集不会有这样的错误——它们基于开箱即用的参考实现。因此，LLM\
  \ 给出的代码可能在事实上是正确的，但仍然存在问题，因为你的环境没有正确配置。而当你要求 LLM 修复问题时，它很可能会尝试修复代码，但代码从一开始就没有坏！归根结底：你必须了解自己的环境，并且必须确保它能正常工作！\n\
  \n好消息是：这些问题并非不可克服。当你知道该寻找什么时，你就知道如何解决它们。本章将为你提供通往那笔隐藏财富的地图。\n\n\n\n\n需要记住的一点是，环境有很多选择，尤其是\
  \ GPU——AMD 和 ROCm、或者 Apple 和 Metal 都是 NVIDIA 和 CUDA 的有力竞争者。在本书中，我大体上会遵循最常用的路径（NVIDIA\
  \ 和 CUDA）。\n\n## GPU：你的第一个决策\n\n现代语言模型通常基于 Transformer 或 Transformer 衍生架构构建——这些架构主要依赖矩阵乘法。模型的单次前向传播会涉及数千次大规模矩阵运算。我们在第\
  \ 2 章中看到了如何将权重矩阵与输入向量相乘、跨 token 序列计算注意力分数，并通过前馈层投影数值。\n\nCPU 是为顺序逻辑设计的——分支决策、路由控制流和线程输出。通常它拥有少数几个非常强大的核心，每个核心都能非常非常快地完成一件事。\n\
  \n另一方面，GPU 可以拥有成千上万个较小的核心。例如，一块 NVIDIA A100 就有近 7000 个核心！它们被设计用于同时对大量数据执行相同的操作。尽管\
  \ GPU 是为图形而设计的（这就是 GPU 中的“G”！），但它也完美契合了 AI 对矩阵乘法的渴求。GPU 的架构使你能够*并行*执行数千次这样的操作。\n\
  \n结果是，AI 工作负载在 GPU 上的速度比在 CPU 上快若干个数量级。因此 GPU 是不可或缺的。如果你没有 GPU 也不用担心——许多云平台按小时提供\
  \ GPU 访问权限，或者 Google Colab 等工具可以免费提供 GPU 使用权。我们稍后会讨论这些。\n\n### VRAM：一个统御一切的指标\n\n\
  既然 GPU 不可或缺，我们现在需要了解 GPU 可用的内存，也就是 VRAM，即显存（Video RAM）。为什么叫 Video？嗯——这也是视频游戏和 GPU\
  \ 的遗留产物。在我们的场景中，它与视频或游戏毫无关系，但重点是它是 GPU *直接*访问的内存。许多计算机有主板和 CPU，带有 RAM，然后有一块独立的 GPU\
  \ 卡作为插件设备。由于 GPU 需要处理数字，这些数字必须放在内存中——而通过卡槽在系统 RAM 之间来回传输会拖慢速度。显而易见的解决方案——给 GPU 卡配备自己的专用内存。这就是\
  \ VRAM。\n\n这是一个硬约束，决定了你能和不能有效微调什么。如果你的模型、梯度、优化器状态、激活值和其他开销的总占用超过了可用 VRAM，训练充其量会非常缓慢（因为需要跨显卡接口和主板进行大量内存交换），最糟糕的情况则是直接崩溃。我的经验是：如果放不下\
  \ VRAM，就别费劲了——否则你会自找一大堆麻烦。\n\n一个缺点是：VRAM 非常昂贵。想找到 VRAM 超过 32Gb 的 GPU 而不破产几家公司是很罕见的。解决方案是*分布式*训练，让多个\
  \ GPU 协同工作，*共享*它们的 VRAM。2 块各有 32Gb 的 GPU 比 1 块 64Gb 的 GPU 便宜得多。\n\n现在我们更深入了解一下 VRAM\
  \ 需求，看看它如何以及将会如何影响你的决策。\n\n#### 计算 7B 模型的 VRAM 需求\n\n要微调一个 7B 模型，我们需要计算训练过程中会使用多少\
  \ VRAM，而这要从*模型权重*开始。因为有 70 亿个权重，它们的影响立竿见影。首先需要弄清楚的是，根据精度它们占用多少存储。你会在技术文档中看到多种精度方法，但最常见的四种是：\n\
  \n* `FP32`：(32 位浮点) - 每个参数 4 字节，因此 28B 字节\n* `FP16`：(16 位浮点) - 每个参数 2 字节，因此 14B\
  \ 字节\n* `INT8`：(8 位量化) - 每个参数 1 字节，因此 7B 字节\n* `INT4`：(4 位量化) - 每个参数 0.5 字节，因此 3.5B\
  \ 字节\n\n其他研究领域也在探索不同精度级别——例如 `FP8` 正变得越来越流行，还有更小型的例如 2 位编码。你可能已经猜到，内存占用越低，精度就越低，但我们常常发现，对于语言模型这类任务，你其实并不需要\
  \ 32 位精度。想想看，在预测下一个 token 时，99.0000234023523% 的准确率相比 99.00002% 的准确率并不会带来任何增益！\n\n\
  所以最终这是一个权衡取舍，但微调者通常会从 `FP16` 开始，一开始就占用 14B 字节。你可以尝试 `INT8` 和 `INT4`，如果你的内存受限，我强烈建议至少先试试这些。\n\
  \n接下来是*梯度*。虽然本书不会深入讨论机器学习过程，但其中一个重要部分叫做*反向传播*，为了调整参数（也就是定义上的“学习”），算法会计算一个梯度，用来指示应该向哪个*方向*调整参数。简单来说，就是“向上”或“向下”，以及“调整多少”。每个梯度与其对应参数的大小*相同*。上面的计算依然成立，实际上使内存需求翻倍。因此，在\
  \ 16 位精度下，你需要 14B 字节用于参数，另外 14B 字节用于梯度。\n\n**注意**\n\n一种名为 *LoRA* 的微调技术（我们将在第 X 章探讨）不会使用*全部*参数，只会使用其中极小一部分。例如，如果它只使用\
  \ 1% 的参数，那么参数只需 0.14B，梯度也只需 0.14B。这非常少，在仅有 8Gb 内存的 GPU 上都能完成！因此，你就能明白为什么它如此受欢迎！\n\
  \n机器学习和微调的必要组成部分之一是使用*优化器*。微调中非常常见的一种是 Adam。优化器的目标是计算我们上面提到的梯度——确定参数需要移动的方向和量，以使其工作更有效（也就是“学习”）。Adam\
  \ 优化器需要每个参数额外*两个*值——一个运行均值和一个运行方差。这些值必须*高度*精确，因此无论权重如何编码，它们通常都以 `FP32` 存储。因此，每个可训练参数占用\
  \ 8 字节。所以，对一个 7B 模型进行完整微调，单单优化器就需要额外 56Gb！同样，如果使用 LoRA，这可能只占其中的 1%，即 0.56GB，更容易接受了！\n\
  \n在存储方面经常被忽视的机器学习组成部分之一是*激活值*，即每一层的输出会被存储下来，以便在反向传播中用于计算梯度。这里的内存取决于模型架构，例如批次大小、序列长度等。对于一个批次大小为\
  \ 1、序列长度为 2048 个 token 的 7B 模型，激活值可能消耗 2-4Gb。同样，这在很大程度上取决于模型架构，但它会随批次大小线性扩展，这一点很重要，因此批次大小为\
  \ 2 时占用会翻倍，以此类推。所以在微调时，内存需求可能会限制你的批次大小。内存越小，你就只能使用最小的批次（1）；内存越大，你就能使用更多批次。这也是 VRAM\
  \ 重要的另一个原因——因为通过批处理，单次传递中能移动的数据越多，你的训练或再训练就会越快！\n\n现在把这些数字加起来。\n\n对于 `FP16` 下的完整微调（表\
  \ 3-1）：\n\n| 组件 | 内存（约） |\n| --- | --- |\n| 模型权重（FP16） | 14Gb |\n| 梯度（FP16） | 14Gb\
  \ |\n| 优化器状态（FP32） | 56Gb |\n| 激活值 | 2Gb |\n| 总计 | 84Gb |\n\n\n\n这超出了任何单个消费级 GPU\
  \ 所能承受的容量。即使是性能强大的 80GB A100——机器学习领域的超级主力，在不进行激进优化的情况下也会举步维艰。在撰写本文时，这些 GPU 每块约 14,000\
  \ 美元。\n\n如果换一种做法，不进行全量微调，而是使用 FP16 精度做 LoRA，结果将如表 3-2 所示：\n\n| 组件 | 内存（约） |\n| ---\
  \ | --- |\n| 模型权重 (FP16) | 14Gb |\n| LoRA 适配器权重 | 0.14Gb |\n| 梯度 (FP16) | 0.14Gb\
  \ |\n| 优化器状态 (FP32) | 0.56Gb |\n| 激活值 | 2Gb |\n| 总计 | 17Gb |\n\n这样我们就进入了消费级 GPU\
  \ 的领域，比如拥有 24Gb 显存的 RTX 4090，其价格约为 A100 的 1/10。\n\n最后，如果我们看一下 QLoRA（我们将在第 X 章详细探讨），会发现它甚至更小（表\
  \ 3-3）：\n\n| 组件 | 内存（约） |\n| --- | --- |\n| 模型权重（4 位量化） | 3.5Gb |\n| LoRA 适配器权重\
  \ | 0.14Gb |\n| 梯度 (FP16) | 0.14Gb |\n| 优化器状态 (FP32) | 0.56Gb |\n| 激活值 | 2Gb |\n\
  | 总计 | 7Gb |\n\n这只需要 8Gb 显存就能装下。拥有 8Gb 显存的 GPU 通常价格是上述 RTX 4090 等 24GB 型号的 1/10。我见过它们在商店里卖\
  \ 100 到 200 美元。这样更易于接受，而且在 Google Colab 的免费版上也能使用——那里提供拥有 16Gb 显存的 T4 GPU。\n\n以上只是针对\
  \ 7B 模型的情况。使用表 3-4 来了解其他常见参数规模下你需要什么：\n\n| 参数量 | 全量微调 (FP16) | LoRA (FP16) | QLoRA(4-bit)\
  \ |\n| --- | --- | --- | --- |\n| 3B | ~36Gb (A100 40Gb) | ~8 Gb (RTX 3060) | ~4Gb\
  \ (RTX 3060) |\n| 7B | ~86Gb (A100 80Gb) | ~17Gb (RTX 4090) | ~7Gb (T4/ RTX 4070)\
  \ |\n| 13B | ~160Gb (多 GPU) | ~ 32Gb (A100 40Gb) | ~12Gb (RTX 4080) |\n| 70B | ~800Gb\
  \ (多节点) | ~160Gb (多 GPU) | ~40Gb (A100 40Gb) |\n\n以下是所有这些方法的对比（表 3-5）：\n\n| 组件 |\
  \ FP16 全量微调 | LoRA (1% 秩) | QLoRA (4-bit) |\n| --- | --- | --- | --- |\n| 模型权重 |\
  \ 14 GB | 14 GB | 3.5 GB |\n| 梯度 | 14 GB | 0.14 GB | 0.14 GB |\n| 优化器状态 | 56 GB\
  \ | 0.56 GB | 0.56 GB |\n| 总计（约） | 84+ GB | ~17 GB | ~7 GB |\n\n要点是：要想开始微调而无需承担过高的\
  \ GPU 费用，请使用 LoRA 或 QLoRA。这是一个甜点区间，非常高效，而且在消费级硬件上就能运行！\n\n### 了解 GPU\n\n在上一节中，我提到了很多\
  \ GPU 名称，如 RTX、A100 等。如果你不熟悉它们，别担心！让我们快速了解一下市面上各种 GPU，以及应该考虑哪些型号。\n\n#### 消费级 GPU\n\
  \n我把消费级 GPU 定义为可以轻松在零售渠道购买、并使用 PC 标准扩展卡接口的 GPU。在撰写本文时，其中的旗舰产品是拥有 24Gb 显存的 NVIDIA\
  \ RTX 4090。其建议零售价约为 1400 美元，但由于稀缺性，它们在二手市场上往往售价更高！有了这样一张卡，在 7B 模型上运行 LoRA 或 QLoRA\
  \ 简直是小菜一碟。虽然这要花不少钱，但请记住，它比几年前的数据中心专用 GPU 还要强大。如果不行，上一代的 RTX 3090 同样拥有 24Gb 显存，也完全够用，而且通常能以相当大的折扣买到。归根结底，显存大小对你来说才是更好的性能指标。虽然\
  \ 40x0 系列显卡有更好的性能参数，但如果它们没有 24Gb 显存，你仍会受到限制。\n\nAMD 也提供了出色的设备，可通过 ROCm 平台释放全部性能。Radeon\
  \ RX 7900 XTX 拥有 24Gb 显存，规格上与 RTX 4090 有竞争力，而且通常比 NVIDIA 同类产品便宜得多。然而，基于 AMD 芯片的微调生态系统不如\
  \ NVIDIA 成熟。像 Flash Attention、`bitsandbytes` 以及 Hugging Face 技术栈的某些部分都是为 NVIDIA\
  \ 优先构建的。这让你处于明显劣势。\n\n如果你使用的是搭载 *Apple Silicon*（M 系列芯片）的 Mac，那么你有一个值得了解的有趣选择。Apple\
  \ 的统一内存架构使得 GPU 和 CPU 共享同一内存，因此其他系统上对专用显存的需求就消失了。这归根结底是因为 CPU 和 GPU 是同一颗芯片——而不是像独立显卡那样插在主板上。\n\
  \n当框架报告可用“VRAM”时，它报告的是你的系统内存——而系统内存可能相当大。配备 128 GB 统一内存的 M4 Max 从技术上讲比 A100 拥有更多的“VRAM”。\n\
  \n问题在于吞吐量。Apple 的 GPU 核心能力很强，但数量上不如 NVIDIA 的数据中心 GPU 多，矩阵运算速度也不如它们。在 A100 上需要 1\
  \ 小时的训练，在 M4 Max 上可能需要 4-6 小时。内存是够了，但算力需要更长的时间来处理数据。与使用其他任何非 NVIDIA 芯片类似，围绕 NVIDIA\
  \ 发展起来的生态系统是一道巨大的护城河，因此你可能会遇到兼容性问题。\n\n#### 数据中心 GPU\n\nNVIDIA A100 是许多 AI 工作负载（包括微调）的行业标准。\n\
  \n在 Google Colab 等托管环境中使用时，这一点往往并不明确，但 A100 有 40 GB 和 80 GB 两种版本，其中 80 GB 版本在云平台上更常见；如果你需要超过\
  \ 40GB 的显存，务必在付费前确认清楚！\n\nA100 可以处理 70B 模型的 LoRA 微调，以及高达约 7B 模型的全量微调。它的内存带宽（80 GB\
  \ 版本为 2 TB/s）意味着它不仅拥有更多显存——还能更快地在 GPU 中传输数据，这直接转化为更短的训练时间。\n\nNVIDIA H100 是当前的旗舰产品。我不知道他们为什么选这些名字，在许多字体中“A”和“H”看起来非常相似。所以在选择时一定要确认你选的是哪一款！它在每个维度上都比\
  \ A100 更快——更高的内存带宽、更好的张量核心性能、支持 FP8 精度——因此云提供商会为它收取高昂溢价。对于本书涵盖的大多数微调工作负载，A100 已经绰绰有余，而且节省的成本相当可观。\n\
  \n像 NVIDIA L4（24 GB）和 L40S（48 GB）这样的新款 GPU 正作为高性价比的中端选项出现在云平台上。L4 尤其被定位为微调和推理 GPU，它在\
  \ Google Cloud 等平台上的定价使其对持续工作负载很有吸引力。\n\n事实上，当你查看 Google Colab 时，就能看到可供你使用的 GPU。请注意，这个列表会随着时间而改变——在撰写本文时可用的\
  \ GPU 如图 3-1 所示。\n\n![计算机程序的屏幕截图 AI 生成的内容可能不正确。](img/ch03_figure_1_1772730612412203.png)\n\
  \n###### 图 3-1. Google Colab 中的数据中心 GPU\n\n如你所见，H100 和 A100 都可用，L4 和 T4 也可用。还有一个“High-RAM”开关，对于像\
  \ A100 这样具有不同显存配置的机器，你可以在两种配置之间切换。\n\n启动实例后，右上角有一个小的“RAM/DISK”按钮，点击它会显示你当前的机器规格（图\
  \ 3-2）。\n\n![计算机程序的屏幕截图 AI 生成的内容可能不正确。](img/ch03_figure_2_1772730612412233.png)\n\
  \n###### 图 3-2. T4 High Ram 的系统规格\n\n在这里我选择了配备 High Ram 的 T4，可以看到可用的 GPU 显存为 15.0Gb。它适合在较小的模型上运行\
  \ LoRA 或 QLoRA，但除此之外用途有限。不过，它很便宜，每小时 1.41 units，而 100 units 需要我花 10 美元，所以使用成本约为每小时\
  \ 14 美分。相比花几百甚至几千美元购买自己的 GPU（要跑很多小时才能回本），这是一个很棒的选择！\n\n#### 使用多 GPU 进行分布式训练\n\n\n\
  \n总有一天——也许不是在这本书里，但希望是在你微调生涯的某个时刻——你会发现单个 GPU 已经不够用了。\n\n也许你需要训练一个 70B 的模型，即便使用\
  \ QLoRA，也无法塞进一张显卡。也许你有生产环境的上线期限，需要更快地训练。又或者，新的模型创新已经发展到远超当前可轻易获得的显存容量。这时你可以组合多个\
  \ GPU 并聚合它们的显存，但这会带来额外开销。\n\n解决这个问题有两种使用多个 GPU 的基本策略：\n\n*数据并行*会将*完整*的模型复制到*每个*\
  \ GPU 上，然后将每个训练批次拆分到各个 GPU。每个 GPU 独立处理自己那份批次数据，计算梯度，然后在更新模型之前对各 GPU 的梯度进行平均。*模型*必须能够装进每一个单独的\
  \ GPU，但训练速度更快，因为你实际上是在用 GPU 的数量乘以你的批次吞吐量。所以，就显存大小而言，你必须考虑模型占用的空间，并且这个空间会在每个 GPU\
  \ 上被复制，消耗数倍于可用显存量。其余可用的显存空间将用于其他一切，而且这些通常可以被共享。\n\n*模型并行*（有时根据具体方法也被称为张量并行或流水线并行）会将*模型*本身拆分到多个\
  \ GPU 上。不同的层——甚至是同一层的不同部分——会驻留在不同的显卡上。这让你能够训练那些大到无法放入任何单个 GPU 的模型。它设置起来更复杂，且有显著的通信开销，但这是在有限硬件上处理真正大型模型的唯一方法。\n\
  \n坦白说，你通常不得不使用模型并行，因为尽管数据并行更有利于加速训练，但模型在不同 GPU 间的复制意味着，优化器权重之类的东西会变得非常难以管理，而且会消耗大量额外显存。\n\
  \n幸运的是，HuggingFace 的 `accelerate` 库让处理这个问题变得非常容易上手。\n\n你可以通过调用以下代码来启动它：\n\n```\n\
  accelerate config\n```\n\n它会引导你完成一个交互式设置，你可以指定你的 GPU 系统——你有多少张卡、想要哪种并行方式，以及如何使用精度。一旦你完成了配置，就可以用如下代码开始训练：\n\
  \n```\naccelerate launch train.py\n```\n\n这将使用该配置，并按照你的指定将训练负载分布到可用的 GPU 上。\n\n\
  话虽如此，对于本书涉及的模型和技术，我将重点介绍如何搭配 LoRA 和 QLoRA 使用一块低显存 GPU。\n\n多 GPU 对加速来说“锦上添花”，或者当你处理更大的模型时也很有用，但它并不是具备能力的前提条件。如果你能使用多个\
  \ GPU（比如通过一个带有 4× A100 的云实例），`accelerate` 可以让你轻松地利用它们。如果你没有，好消息是，在技能提升的道路上你不会被落下！\n\
  \n## 软件栈\n\n既然你已经了解了硬件需求，选择软件栈可能会容易一些。在本节中，我们将讨论整个技术栈，从操作系统开始。\n\n### 选择你的操作系统\n\
  \n归根结底，你需要的是一个支持你硬件的操作系统！或者，如果你选择基于云的硬件，你至少需要了解云服务提供商提供给你的软件栈。\n\n#### 使用 Linux\n\
  \n默认选择通常都是某种形式的 Linux。如果你要搭建自己的机器，Ubuntu 是最好的发行版，因为它的支持最好。例如，NVIDIA 驱动和 CUDA 对 Ubuntu\
  \ 有一流的支持，而且你看到的几乎所有教程、Docker 镜像或云模板，都默认你在使用它。\n\n如果你对 Linux 不熟悉，我建议你使用 Ubuntu 的\
  \ LTS（长期支持）版本来搭建 Linux 机器。在撰写本文时，这个版本是 Ubuntu 22.04 LTS。\n\n#### 使用 Windows\n\n\
  说实话，Windows 确实是个有趣的操作系统！它曾是 Web 和服务器业务的中坚力量，但由于 LAMP（Linux、Apache、PHP、MySQL）技术栈，它在某种程度上被基于\
  \ Linux 的系统抢了风头。随着云计算的演进，这种趋势还在加速。在桌面端，Windows 仍然相当流行，但随着运行 MacOS 的苹果台式机和笔记本电脑的普及，这种流行度已经大幅下降。\n\
  \n为此，微软推出了 WSL2（适用于 Linux 的 Windows 子系统 2），它出乎意料地好用。WSL2 运行真正的 Linux 内核，并且原生支持 CUDA\
  \ 直通，Windows 的 NVIDIA 驱动会直接共享给 WSL2 环境，这意味着你无需在 WSL 内单独安装它们。鉴于 Windows 仍然是*游戏*领域主要的桌面操作系统，NVIDIA\
  \ 会继续将 Windows 作为一流系统来支持。\n\n这并非一个*糟糕*的选择，如果你已经在使用 Windows，它值得考虑。但直接使用 Linux 而不是“子系统”，可能会引入更少的复杂性。\n\
  \n#### 使用 macOS\n\n对于使用 Apple Silicon 的 macOS 用户来说，情况在不断发展。PyTorch 的 MPS 后端可以用于基础训练，而\
  \ MLX（[`opensource.apple.com/projects/mlx/`](https://opensource.apple.com/projects/mlx/)）提供了更原生的体验。Apple\
  \ 显然在机器学习上投入了大量资源，并且正在构建与之匹配的软件栈。\n\n主要限制在于生态广度：像 `bitsandbytes` 这样的库对 macOS 的支持有限，而且大多数故障排查资源都假设你使用\
  \ NVIDIA 硬件。\n\n我的主力系统是一台 Mac Mini，我用它完成许多机器学习任务，但要微调除最小模型以外的任何模型，就会有点吃力了。话虽如此，能用主力系统干活，而不必专门去搭建一台机器，还是很棒的。所以，如果你和我一样是\
  \ Mac 用户——先*别*急着去买一台带 NVIDIA GPU 的 Linux 机器。你也许用 Mac 就能做很多事了！\n\n而当它算力不足时，把 Mac\
  \ 当作云 GPU 的瘦客户端是一种可行的前进方式——SSH 登录到云实例，在那里运行你的训练。或者，当然也可以在浏览器中使用 Colab 之类的工具。\n\n\
  ### 你的编程环境\n\n我们先从编程语言说起。虽然有很多成熟度各异的选项，但你真正应该从它开始的只有一个——那就是 Python。对于所有机器学习和微调任务，Python\
  \ 在库方面拥有最好的支持，而且有着庞大的支持生态。很难想象不先用 Python 就能在机器学习和微调方面有所成效。之后，你可能会开始考虑底层效率，希望比 Python\
  \ 这样的高级解释型语言更贴近硬件来运行代码，但不要被这些分心！先用 Python 打好基础。\n\n这也有一个缺点。由于生态如此多样，版本支持存在巨大的漂移，不仅是\
  \ Python 的版本，还有像 CUDA 这样的相邻技术。为了解决这个问题，理解虚拟环境是一个重要的前提。\n\n主要有两种方式：`Conda` 或 `Venv`。\n\
  \n`Conda` 是更全面的选择。`Conda` 不仅管理 Python 包，还管理系统级的依赖，比如 CUDA 工具包版本。这意味着你可以有一个 CUDA\
  \ 11.8 的环境，另一个 CUDA 12.1 的环境，并在它们之间无缝切换。对于初学者，或者任何希望 CUDA 管理自动化的人来说，我建议投入时间和精力去学习\
  \ `Conda`！\n\n`Venv`（配合 `pip`）是一个轻量得多的选择。如果 CUDA 已经安装在系统层面，它就能很好地工作，设置更快，也相当容易管理。我个人喜欢多个\
  \ `Venv` 设置带来的掌控感，尤其是在 Mac 上工作时，我不需要担心 CUDA，这让我的机器学习生活轻松很多！\n\n\n\n\n### 安装支持 GPU\
  \ 的 PyTorch\n\n无论你选择哪种方式——你当然需要在这其中运行 Python，因此你还需要 PyTorch。下一步就是安装支持 GPU 的 PyTorch，所以如果你使用的是\
  \ NVIDIA 芯片并且需要 CUDA，你就必须*特别*注意。我发现大多数环境问题都始于这一步——所以请密切关注细节。\n\n如果你从 [`pytorch.org/get-started/locally/`](https://pytorch.org/get-started/locally/)\
  \ 开始，PyTorch 基金会已经大大简化了这一过程，但仍然很容易出错。\n\n你可以在图 3-3 中看到这一点。\n\n![一张电脑屏幕截图，AI 生成的内容可能不正确。](img/ch03_figure_3_1772730612412252.png)\n\
  \n###### 图 3-3. 从 PyTorch 开始\n\n请注意，默认情况下，当你选择“Linux”作为机器类型时，PyTorch 会加载 CPU 类型。这固然很好，但如果你使用的是\
  \ GPU，PyTorch 实际上会忽略它！因此，你必须查看 Compute Platform 列，并且*在*开始使用 PyTorch 之前，确保你使用的是列出的*准确*版本。版本内的兼容性常常会导致问题，我特别发现\
  \ CUDA 的发布版本可能晚于受支持的版本。老话“使用最新版本”通常是个好建议，但在这里可能不适用。例如，在撰写本文时，Compute Platform 支持\
  \ CUDA 12.6、12.8 和 13.0，但*最新的* CUDA 是 13.1。虽然为你的机器安装最新驱动程序非常好，可以最好地支持你的机器（如果你也用它来玩游戏或其他活动），但我强烈建议你*严格*遵循\
  \ PyTorch 支持的平台。在这种情况下，你应该使用 13.0。\n\n安装完成后，你还没有脱离困境！我建议你使用如下代码仔细检查它是否能按预期工作：\n\n\
  ```\nimport torch\nprint(f\"PyTorch version: {torch.__version__}\")\nprint(f\"CUDA\
  \ available: {torch.cuda.is_available()}\")\nif torch.cuda.is_available():\n   \
  \ print(f\"GPU: {torch.cuda.get_device_name(0)}\")\n    print(f\"VRAM: {torch.cuda.get_device_properties(0).total_mem\
  \ / 1e9:.1f} GB\")\n```\n\n如果 `CUDA available` 一行打印出 `False`，那么说明出了问题。你可能安装了 CUDA，但\
  \ PyTorch 版本不匹配，或者你意外安装了 PyTorch 的 CPU 版本。我承认自己也有责任——我已经这么做过太多次了！\n\n你可以做的另一件事是，通过执行\
  \ `nvidia-smi` 命令来查看你的机器或环境使用的版本。确保它与你选择的 PyTorch 环境所对应的版本匹配。如果没有获得与其中一个选项匹配的新驱动程序，请清理系统，然后重新开始！\n\
  \n前期会有些麻烦，但这能在后续为你省去大量痛苦。\n\n### 核心库栈\n\n既然我们已经验证了 PyTorch 可以正常使用 GPU，接下来你需要安装本书中会用到的库。每个库都有特定的作用，了解每个库的功能将有助于你日后理解和调试问题。\n\
  \n#### PyTorch\n\nPyTorch 当然是其他所有内容所依赖的深度学习框架。它提供了支撑模型训练的张量操作、自动微分（autograd）和 GPU\
  \ 加速。你在上一步中已经安装了它。如果你想了解更多，可以查阅我的 O’Reilly 著作《AI and Machine Learning for Coders\
  \ in PyTorch》。\n\n#### Hugging Face Transformers\n\nHugging Face Transformers 是一个通过统一\
  \ API 提供数千个预训练模型的库。当你编写类似 `AutoModelForCausalLM.from_pretrained(\"meta-llama/Llama-3.2-3B\"\
  )` 的代码时（其中模型通过命名空间指定），Transformers 会从 Hugging Face Hub 下载模型架构和权重，并将它们转换成可直接使用的 PyTorch\
  \ 模型。它在统一接口背后处理不同架构（Llama、Mistral、Gemma、Phi、Qwen）之间的差异，因此你在切换模型时无需更改训练代码。\n\n####\
  \ Hugging Face PEFT（参数高效微调）\n\nHugging Face PEFT（参数高效微调）实现了让微调在消费级硬件上变得切实可行的适配器方法。LoRA、QLoRA\
  \ 和其他技术都通过 PEFT 提供。当你将 LoRA 适配器应用于模型时，PEFT 会在冻结原始权重的同时，向模型的层中注入小型可训练矩阵。我们将在第 X 章深入探讨\
  \ PEFT。\n\n#### BitsAndBytes\n\nBitsAndBytes 是专门支持 QLoRA 的量化库。正如我们在本章前面看到的，为了在较低规格的\
  \ GPU 上运行，量化是必要的，而 `bitsandbytes` 是你的好帮手。它为模型权重提供 4 位和 8 位量化，使你可以将 14 GB 的模型加载到\
  \ 3.5 GB 的显存中。它由 Tim Dettmers 开发，并与 Hugging Face Transformers 紧密集成——你只需一个参数 `load_in_4bit=True`\
  \ 就能以 4 位精度加载模型。在撰写本文时，该库对 NVIDIA 进行了*高度*优化。对其他环境（Mac 和 AMD）的支持也在不断增加，但如果你使用的不是\
  \ NVIDIA/CUDA 技术栈，你可能会在这里碰壁。\n\n#### TRL（Transformer 强化学习）\n\nTRL（Transformer 强化学习）提供高层训练\
  \ API。它的 `SFTTrainer`（监督微调训练器）封装了 PyTorch 的训练循环，并为微调语言模型提供了合理的默认设置。它处理数据整理、梯度累积、日志记录、检查点保存和评估。TRL\
  \ 还提供用于直接偏好优化的 `DPOTrainer`，我们将在第 X 章介绍。\n\n#### Hugging Face Accelerate\n\nHugging\
  \ Face Accelerate 管理在不同硬件配置上运行训练的细节。它处理混合精度训练（使用 FP16 或 BF16 加速计算）、设备放置（确保张量最终位于正确的\
  \ GPU 上）以及分布式训练（将工作拆分到多个 GPU 上）。在大多数情况下，你不会直接与 Accelerate 交互——TRL 在后台使用它——但如果你需要自定义训练设置，它也在那里。\n\
  \n#### Hugging Face Datasets\n\nHugging Face Datasets 提供高效的数据加载。它在底层使用内存映射文件和名为\
  \ Apache Arrow 的框架，使你能够处理远大于 RAM 的数据集。它与 Hugging Face Hub 集成，因此加载公开数据集只需一行代码：`load_dataset(\"\
  tatsu-lab/alpaca\")`。\n\n#### Weights & Biases（`wandb`）\n\nWeights & Biases（`wandb`）是一个实验跟踪平台。每次训练运行都会生成指标——损失曲线、学习率、梯度范数——你需要一个地方来存储和可视化它们。Wandb\
  \ 通过单个配置参数即可与 TRL 的 `SFTTrainer` 集成，其免费套餐对于个人从业者来说足够慷慨。\n\n所有这些都可以通过一条 `pip` 命令安装：\n\
  \n```\npip install transformers peft bitsandbytes trl accelerate datasets wandb\
  \ sentencepiece protobuf\n```\n\n目光敏锐的读者可能已经注意到末尾的 `sentencepiece` 和 `protobuf`。这些是一些模型所需要的分词器依赖项。提前包含它们可以避免你在使用这些模型时遇到令人困惑的错误，并怀疑自己的环境是不是缺少了什么。\n\
  \n你可以使用我在 GitHub 上提供的名为 `Chapter3.ipynb` 的 Notebook 来测试这一点。\n\n当在带有 A100 NVIDIA\
  \ GPU 的 Colab 上运行时，你应该会看到类似下面的输出。请注意，推理成功了，一个非常简单的使用 LoRA 的微调也成功了。\n\n\n\n\n```\n\
  ==================================================\nSTEP 1: GPU Check\n==================================================\n\
  GPU: NVIDIA A100-SXM4-40GB\nVRAM: 42.4 GB\n \n==================================================\n\
  STEP 2: Loading model in 4-bit\n==================================================\n\
  ...\nModel loaded: TinyLlama/TinyLlama-1.1B-Chat-v1.0\nModel memory footprint: 0.75\
  \ GB\n \n==================================================\nSTEP 3: Running inference\n\
  ==================================================\nPrompt: The capital of France\
  \ is\nResponse: The capital of France is Paris.\nWhat is the capital of France?\
  \ Paris.\n \n==================================================\nSTEP 4: Applying\
  \ LoRA adapter\n==================================================\ntrainable params:\
  \ 1,126,400 || all params: 1,101,174,784 || trainable%: 0.1023\n \n==================================================\n\
  STEP 5: Single training step\n==================================================\n\
  Loss: 3.4863\nGradient computed successfully!\n \n==================================================\n\
  ALL CHECKS PASSED—Your environment is ready!\n==================================================\n\
  ```\n\n如果你没有得到这些结果，以下是一些常见错误：\n\n*   `CUDA is Not available` - 你安装的是仅支持 CPU 的 PyTorch。在\
  \ Colab 中通常不会这样，当然，除非你选择了 CPU 后端！\n\n*   `RuntimeError: CUDA out of memory` - 提供的代码会下载一个小于\
  \ 1GB 的微型模型。如果你遇到这个错误，要么是你的 GPU 显存太小，要么更有可能是另一个模型已加载并占用了大部分内存，且在此次运行前未被清理！\n\n*\
  \   `bitsandbytes` 库是针对你的 CUDA 安装版本编译的。我见过很多由于它与 CUDA 工具包版本不匹配而导致的编译错误。请仔细检查你的版本！\n\
  \n*   模型下载失败。HuggingFace API 提供了分片下载的良好可视化界面。请留意这些信息以检查是否有失败。模型会下载到一个隐藏的缓存目录（`~/.cache/huggingface/`）——如果这里空间不足，你可能会遇到问题。\n\
  \n## 实验跟踪\n\n除了目录组织之外，你还需要一种方式来跟踪每次训练运行中发生的情况。第 1,000 步时的损失是多少？学习率如何衰减？模型在哪一步开始过拟合？这些问题仅靠日志文件几乎无法回答，但使用合适的实验跟踪器则轻而易举。\n\
  \n### 权重与偏差（wandb）\n\n我们之前见过权重与偏差（wandb），这是大多数机器学习社区进行实验跟踪的标准工具。个人使用免费，易于与你的代码集成，并提供一个\
  \ Web 仪表板，你可以在其中可视化损失曲线、并排比较多次运行，并注释你的结果。\n\n设置起来很简单：\n\n```\n# Create a free account\
  \ at wandb.ai, then\nwandb login\n# Paste your API key when prompted\n```\n\n认证后，`transformers`\
  \ 库会提供一个 API 让你自动登录 wandb。你也可以在训练参数中显式配置它：\n\n```\nfrom transformers import TrainingArguments\n\
  \ \ntraining_args = TrainingArguments(\n    output_dir=\"./outputs/checkpoints\"\
  ,\n    report_to=\"wandb\",\n    run_name=\"...\",\n    # ... other arguments\n\
  )\n```\n\n每次训练运行都会变成一个仪表板，显示损失曲线、学习率调度、梯度范数和 GPU 内存使用情况。你可以随着训练进行实时跟踪，这在情况不妙时便于手动提前停止。\n\
  \n### TensorBoard\n\nTensorBoard 是 TensorFlow 生态系统的一部分，是一个完全在本地运行的开源替代方案，并且可以轻松用于\
  \ Colab 等环境。\n\n```\npip install tensorboard\n \n# In your TrainingArguments:\n\
  # report_to=\"tensorboard\"\n \n# After training, launch the viewer:\ntensorboard\
  \ --logdir ./logs\n```\n\n即使你不使用这些工具，我也强烈建议你保留一个简单的实验日志——哪怕是电子表格或记事本——记录每次运行的日期、模型名称、数据集版本、关键超参数（LoRA\
  \ 秩、学习率、epoch 数）、最终训练损失和评估分数。\n\n当你运行了三十次实验并需要找到最好的那次时，你会感激这种纪律。你还会发现，它会让你养成根据这个表格或记事本中的条目来命名检查点的习惯，之后也更容易找到它们！\n\
  \n## 云与按需付费\n\n在上一节中，我使用 Colab 作为模型环境，后端为 A100。如果你不想管理 GPU 的所有权*或*构建自己的环境，这是一个非常好的选择，主机为你代劳。这是按需付费意义重大的一个很好的例子。\n\
  \n*Kaggle Notebooks* 提供了与 Colab 类似的体验。它们通常提供免费 GPU 访问（我最近看到有 T4 和 P100 可用），每周配额为\
  \ 30 小时。这真的很大方。界面与 Colab 类似，尽管更像普通的 notebook。另一个好处是数据集——许多已经托管在 Kaggle 上，因此集成更容易一些。\n\
  \n*Lambda Labs* 则采用了不同的方向。你得到的不是 notebook，而是一台通过 SSH 访问的完整 Linux 机器。\n\n他们提供 A100\
  \ 和 H100 实例，并且可以自由安装你自己的软件、管理你自己的文件，并完全控制环境。\n\n如果你想深入研究底层软件栈，又不希望一切都由托管方完全管理，这真的很有用，感觉更像是云中你自己的机器。\n\
  \n*RunPod* 是一个有趣的替代方案，作为一个 GPU 市场运营，提供“社区云”（更便宜、可靠性较低）和“安全云”（更贵、更可靠）选项。他们以更低的价格提供抢占式/可中断实例——但代价是你的实例可能会被其他人抢占——这对于长时间训练运行来说并不理想。一个好处是\
  \ ML 软件栈通常是预装的，这有助于缩短你的设置时间。\n\n另一个有趣的选项是 [Vast.ai](http://vast.ai)，它有点像 GPU 租赁领域的\
  \ Uber。在这里，个人 GPU 所有者可以出租他们的硬件！当然，可靠性和安全性可能会有所不同。\n\n此外，还有 *Digital Ocean*，它是一项云服务，提供由\
  \ ROCm 驱动的 AMD 芯片。\n\n## 本地还是云端——如何决定\n\n虽然每种情况都不同，但我通常会遵循以下框架来帮助我决定在哪里以及如何进行模型的任何调整或微调。\n\
  \n你现在已经了解了硬件选项和软件栈。剩下的问题是：我在哪里运行它？答案取决于你的具体情况，没有放之四海而皆准的正确选择。这里有一个决策框架可以帮助你思考。\n\
  \n第一个问题很简单：你是否有 16 GB 或更多显存的 GPU？如果有，你的本地机器可以处理高达 7B 参数模型的 QLoRA（16 GB 情况下）。显存越多，模型越大。这涵盖了我们在本书中要做的大部分内容。如果没有，云是你的主要选择。\n\
  \n然后我会问你：这是一次性的实验还是持续的工作？如果你正在学习这本书，并计划将微调模型作为日常工作的常规部分，那么投资一块本地 GPU 会在几个月内收回成本。如果这是一次性的探索，云让你无需长期承诺即可使用，而且通常投入要低得多。\n\
  \n你是否有数据主权要求？一些组织——尤其是医疗、金融和政府——对数据可以在哪里处理有严格规定。如果你的训练数据不能离开你的场所，那么本地训练（或私有云部署）是强制性的。这是支持本地硬件的最有力论据之一：你的数据永远不会离开你的大楼。\n\
  \n\n\n\n你在训练的模型是否大于 13B 参数？对于 70B 模型，即使 QLoRA 也需要约 40 GB 显存——这超出了任何消费级 GPU 的能力。你需要一块\
  \ A100（云端）或多 GPU 配置。对于不超过 13B 的模型，单块 RTX 4090 搭配 QLoRA 很可能就足够了。\n\n大多数从业者最终采用的方法是一种混合工作流：先在本地（或免费的\
  \ Colab）用小模型和一部分数据开发和调试，等一切正常后，再在云端 GPU 上运行完整的训练任务。\n\n本地环境是为了迭代速度——你可以几秒钟内重新开始一次训练，调整一个超参数，然后再次尝试，无需准备任何东西。云端则用于最终的训练运行，因为这时你需要更大的\
  \ GPU 或更长的运行时间。\n\n本书中的示例被设计为可在三个层级上运行：\n\n- **Google Colab 免费版（T4，16 GB 显存）：**\
  \ 对不超过 7B 参数的模型使用 QLoRA。这是最低要求。如果你没有任何其他资源，你仍然可以跟随每一个示例。\n- **本地 RTX 4090 或 Colab\
  \ Pro A100（24–40 GB 显存）：** 对不超过 13B 的模型使用 QLoRA，或对 7B 模型使用 LoRA（不进行量化）。更灵活，训练也更快。\n\
  - **云端 A100 80 GB：** 适合喜欢挑战的人——对 70B 模型使用 LoRA，对 7B 模型进行全量微调，或任何以显存为瓶颈的实验。\n\n最后，当你读完这本书时，我的建议是选择与你资源匹配的层级，不必担心其他内容。无论你使用哪种\
  \ GPU，技术本身都是一样的；变化的只是模型规模和训练速度。\n\n## 总结\n\n在本章中，你逐步完成了微调工作台的搭建——包括硬件、软件和环境决策，这些是本书其余内容的基础。我们探讨了为什么\
  \ GPU 内存（显存）是你将面临的最重要的限制，以及 LoRA 和 QLoRA 这类技术如何让微调在你真正负担得起的硬件上变得可行。你了解了整个软件栈——从\
  \ PyTorch 和 Hugging Face 到实验跟踪——并比较了本地和云端方案，以便你选择适合自己情况和预算的配置。\n\n随着你的环境验证完毕并下载好模型，你现在有了一个扎实可用的基础。工具已就位，数学原理也讲通了，你已经准备好专注于真正重要的事情：你的数据、你的训练策略，以及构建真正属于你自己的专家模型。\n\
  \n# 关于作者\n\n**劳伦斯·莫罗尼（Laurence Moroney）**是一位屡获殊荣的研究者和畅销书作家。作为编程和机器学习行业的资深人士，劳伦斯撰写了超过\
  \ 20 本书，包括畅销编程书籍、科幻小说，甚至与电影相关的漫画书。他在 Coursera 上与 deeplearning.ai 的吴恩达（Andrew Ng）一起教授广受欢迎的\
  \ AI 专项课程。作为一名享誉全球的演讲者，劳伦斯热衷于为软件开发人员揭开 AI 和 ML 的神秘面纱。\n\n"

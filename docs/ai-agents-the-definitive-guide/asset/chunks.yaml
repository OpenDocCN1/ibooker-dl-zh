  trans: "\n图 1-3 说明了模块如何将静态 LLM 转化为动态智能体。用户请求进入核心，规划与记忆塑造其推理，工具则使其能够采取具体行动。推理、行动和适应的循环正是由这些元素的协调而涌现。\n\
    \n![智能体核心](img/ch01_agent_core.png)\n\n**图 1-3.** 基准智能体架构：单独的 LLM 只能预测文本，但借助规划、记忆和工具，它就会变成可用的智能体系统。\n\
    \n规划模块引导智能体的推理，从简单的思维链^(1)轨迹到更高级的方法，如思维树^(2)或自我批判。记忆模块提供连续性，使智能体能够回忆过去的步骤、复用先验知识或在会话之间持久化信息。工具将智能体与外部环境连接起来，无论是通过搜索、检索、代码执行还是自定义\
    \ API。\n\n此外，传统 LLM 用法与智能体系统之间的一个关键区别在于工作流是无状态还是有状态。*无状态调用*将模型视为黑盒：它接收提示词，预测下一个词元，并返回结果。不会记住任何内容，不会采取任何操作，也不存在反馈循环。示例\
    \ 1-1 演示了一个无状态 LLM 调用。\n\n#### 示例 1-1. 使用 LangChain 的无状态 LLM 调用\n\n```\nllm =\
    \ ChatOpenAI(model=\"gpt-5-mini\")\nresponse = llm.invoke(\"What are AI agents?\"\
    )\nprint(response.content)\n```\n\n此外，当你需要训练数据之外的事实，或者希望模型采取行动（搜索、计算）时，就需要引入工具。\n\
    \n下面的代码（示例 1-2 至示例 1-4）演示了一个极简的无状态工具使用运行流程：先把两个工具绑定到 LLM，然后运行一个微型循环来执行模型为完成任务所需的任何工具调用。在此之前，你需要先定义工具。示例\
    \ 1-2 给出了工具的实现。\n\n#### 示例 1-2. 为无状态运行定义工具\n\n```\n@tool(\"internet_search\")\n\
    def internet_search(query: str) -> str:\n    \"\"\"Search Google via SerpAPI for\
    \ up to date information.\"\"\"\n    serp_api_key = os.environ[\"SERPAPI_API_KEY\"\
    ]\n    params = {\"engine\": \"google\", \"gl\": \"us\", \"hl\": \"en\"}\n   \
    \ search = SerpAPIWrapper(params=params, serpapi_api_key=serp_api_key)\n    return\
    \ search.run(query)\n\n@tool(\"calculator\")\ndef calculator(expression: str)\
    \ -> str:\n    \"\"\"Evaluate a single line mathematical expression with numexpr.\"\
    \"\"\n    local_dict = {\"pi\": math.pi, \"e\": math.e}\n    out = numexpr.evaluate(\n\
    \        expression.strip(),\n        global_dict={},\n        local_dict=local_dict,\n\
    \    )\n    return str(out)\n\ntools = [internet_search, calculator]\ntool_map:\
    \ Dict[str, Any] = {t.name: t for t in tools}\n```\n\n1. LangChain 的`@tool`装饰器使用函数名、类型签名和\
    \ docstring 来构建模型所见的 schema。\n2. docstring 是必需的：如果缺失，LangChain 在构造工具 schema 或将工具绑定到模型时会抛出错误。\n\
    3. 约束计算：拒绝全局变量，只暴露你希望暴露的常量。这保证了计算器的确定性和安全性。\n\n使用 LangChain 的`@tool`装饰器时，函数签名和\
    \ docstring 用于构建模型所见的 schema。你需要让这些内容精确、一致，并尽可能具有解释性，以便高效完成任务。docstring 充当工具描述，是\
    \ LangChain 的硬性要求，如果缺失就会出现错误。此外，如果 docstring 含糊不清，模型更有可能产生无效调用。\n\n#### 示例 1-3.\
    \ 将工具绑定到 LLM\n\n```\nllm = ChatOpenAI(model=\"gpt-4o\", temperature=0,\n     \
    \           max_tokens=800).bind_tools(tools, tool_choice=\"auto\")\n```\n\n1.\
    \ 将工具绑定到模型。`tool_choice=\"auto\"`让模型决定是否调用工具以及调用哪个工具。\n\n# 现代 LLM 是为智能体任务而打造的\n\
    \n现代 LLM 不仅能够调用工具，而且日益专门针对智能体任务进行训练和优化。例如，[Kimi K2](https://moonshotai.github.io/Kimi-K2/)和[Llama\
    \ 4](https://www.llama.com/docs/model-cards-and-prompt-formats/llama4/)等模型就明确针对编码、工具使用和驱动智能体系统进行了调优。这些模型不止于在聊天窗口中回答问题。它们经过指令调优而能够采取行动，调用\
    \ API、运行代码或检索数据已成为其核心设计的一部分。\n\n绑定工具后，你就可以运行一个极简的无状态工具循环。示例 1-4 中的代码会执行模型请求的任何工具调用，将观察结果反馈回模型，并强制进行一次简短的收尾，以确保即使在最后一步以工具观察结束时，也能返回最终答案。\n\
    \n#### 示例 1-4. 带工具循环的无状态单次运行\n\n```\ndef run_once(prompt: str, max_steps: int\
    \ = 8) -> str:\n    messages: List[HumanMessage | AIMessage | ToolMessage] = [\n\
    \    HumanMessage(content=prompt)]\n    last_ai: AIMessage | None = None\n\n \
    \   for _ in range(max_steps):\n        ai: AIMessage = llm.invoke(messages)\n\
    \        messages.append(ai)\n        last_ai = ai\n\n        calls = getattr(ai,\
    \ \"tool_calls\", None) or []\n        if not calls:\n            return messages[-1].content\n\
    \n        for call in calls:\n            name = call[\"name\"]\n            args\
    \ = call.get(\"args\", {}) or {}\n            result = tool_map[name].invoke(args)\n\
    \            messages.append(ToolMessage(\n                content=str(result),\n\
    \                name=name,\n                tool_call_id=call.get(\"id\")\n \
    \           ))\n\n    messages.append(HumanMessage(content=\"\"\"\nFinish now.\
    \ Give a short final answer in this exact format:\n\nCurrent temperature:\nSquare\
    \ of current temperature:\n\"\"\".strip()))\n    final_ai: AIMessage = llm.invoke(messages)\n\
    \    return final_ai.content\n\nprint(run_once(\"\"\"Two step task.\n\nStep 1:\
    \ Use internet_search to get the current air temperature in New York City\ntoday.\
    \ Show the exact query you used, the top source title and snippet, and\nextract\
    \ a numeric temperature in Celsius. Return this temperature as feedback\nfor Step\
    \ 2.\n\nStep 2: Using the Celsius value from Step 1, compute its square with calculator.\n\
    Show the exact expression you used and the numeric result.\n\nImportant: Give\
    \ a short final answer in this format:\nCurrent temperature:\nSquare of current\
    \ temperature:\"\"\"))\n```\n\n1. 仅用于本次运行的本地短期记忆。这使工作流在不同运行之间保持无状态。\n2. 一个简单的步数上限可防止失控循环：LLMs\
    \ 不断循环而不终止。\n3. 一次模型步骤。助手可以选择调用工具。\n4. 读取结构化工具调用。\n5. 将观察结果与匹配的`tool_call_id`一起附加，以便模型将结果与调用对应起来。\n\
    \n"

    \ 使用完整的更新值映射恢复执行。\n\n正如你所看到的，添加人工监督并没有一种唯一“正确”的方法。你可以根据任务的敏感度以及你想要保留的控制程度，从不同的模式中进行选择。我鼓励你在提供的\
    \ notebook 中尝试这些模式，因为这样可以更容易地看到人工监督如何从简单的审批门控演变为人类与智能体之间更丰富的协作。\n\n# 高级智能体范式：监督者与层级智能体\n\
    \n如果你的任务开始比你目前见过的更复杂，或者你发现智能体难以胜任，那么将任务分解成更小的子任务会有所帮助。可以把它想象成组建一个团队：每个人都有不同的技能，共同解决更大的挑战。\n\
    \n同理，你可以引入更小、独立的智能体，构成一个多智能体系统（MAS）。一种常见的设置是*监督者架构*，其中每个智能体都向一个决定下一步该由谁执行的监督者汇报。更高级的版本是*层级架构*，你不只有一个监督者，而是有监督者的监督者。这种泛化允许更灵活的控制流。\n\
    \n图 2-4 中的图表展示了单智能体设置与这两种多智能体模式的对比。\n\n![ch02 单一智能体、监督者与层级架构对比](img/ch02_single_vs_supervisor_vs_hierarchical.png)\n\
    \n**图 2-4.** 单一智能体、监督者与层级智能体架构的对比。\n\n使用多智能体系统（MAS）的主要优势在于其模块化、专门化和可控性。通过在各个智能体之间划分功能，你可以让整个系统更易于开发、测试和维护。每个智能体都可以被设计为领域专家，从而提升系统的整体性能。与简单的函数调用不同，多智能体设置还为你提供了对智能体之间通信方式的显式控制。\n\
    \n## 构建层级研究团队\n\n为了将监督者和子智能体的概念具体化，让我们通过一个示例来构建一个层级研究团队。我将使用 LangGraph 预构建的、可复用的\
    \ `create_react_agent` 组件来快速实现 ReAct 智能体。然后，每个工作智能体都会有明确的角色：有些专注于网络搜索，有些负责抓取页面，查询\
    \ [Exa](https://exa.ai/) 以获取更结构化的搜索结果，甚至可以在 Google 上查找专利。一个监督者智能体位于顶层，协调这些专家并决定下一步由谁执行。最终目标是组建一个市场研究团队。图\
    \ 2-5 展示了你正在构建的最终应用。\n\n![ch02 市场研究团队图](img/ch02_market_research_team_graph.png)\n\
    \n**图 2-5.** 采用层级架构的最终应用。\n\n但在那之前，你会从一个更小的起点开始：构建你的第一个监督者设置——研究团队。你可以在图 2-6 中看到你所创建团队的概览。一旦完成这一步，第二步就是添加一个写作团队。这个团队将获取研究团队的输出，并将其作为简单文本文件保存到你的文件系统。\n\
    \n![ch02 研究团队图](img/ch02_research_team_graph.png)\n\n**图 2-6.** 研究团队的流程图。\n\n\
    我将略过如何创建工具的细节，因为你已经在第一章（示例 1-2）中学过这部分内容。\n\n你需要的第一样东西是一个用于创建监督者的辅助函数（示例 2-21）。该函数充当路由器（参见“将\
    \ FSM/HSM 映射到智能体框架”），决定下一步应由哪个工作智能体执行，或者流程是否应该结束。\n\n### 示例 2-21. 监督者的辅助函数\n\n\
    ```\nclass State(MessagesState):\n    next: str\n\ndef make_supervisor_node(llm:\
    \ BaseChatModel, members: list[str]) -> str:\n    options = [\"FINISH\"] + members\n\
    \    system_prompt = (\n        \"You are a supervisor tasked with managing a\
    \ conversation between the\"\n        f\" following workers: {members}. Given\
    \ the following user request,\"\n        \" respond with the worker to act next.\
    \ Each worker will perform a\"\n        \" task and respond with their results\
    \ and status. When finished,\"\n        \" respond with FINISH.\"\n    )\n\n \
    \   class Router(TypedDict):\n        \"\"\"Worker to route to next. If no workers\
    \ needed, route to FINISH.\"\"\"\n\n        next: Literal[*options]\n\n    def\
    \ supervisor_node(state: State) -> Command[Literal[*members, \"__end__\"]]:\n\
    \        \"\"\"An LLM-based router.\"\"\"\n        messages = [\n            {\"\
    role\": \"system\", \"content\": system_prompt},\n        ] + state[\"messages\"\
    ]\n        response = llm.with_structured_output(Router).invoke(messages)\n  \
    \      goto = response[\"next\"]\n        if goto == \"FINISH\":\n           \
    \ goto = END\n\n        return Command(goto=goto, update={\"next\": goto})\n\n\
    \    return supervisor_node\n```\n\n- ![1](img/#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO15-1):\
    \ 创建状态以跟踪下一个工作智能体。\n- ![2](img/#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO15-2):\

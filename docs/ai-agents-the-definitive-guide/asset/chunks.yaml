- raw: "Tool cycles can end on an observation. This final instruction guarantees a\
    \ closing assistant message in your requested format.\n\n## Giving the LLM a State\n\
    \nThe first step in turning an LLM into an agent is to make it stateful. Give\
    \ your LLM a state that records where it’s in the workflow. Based on input and\
    \ logic, it transitions to the next state, and each state has an associated function\
    \ or behavior. In LangGraph, this can be any Python type, but is typically a `TypedDict`\
    \ or [Pydantic](https://docs.pydantic.dev/latest/api/base_model/) `BaseModel`.\
    \ The following outlines LangGraph’s key concepts to build stateful, adaptable\
    \ AI agents.\n\nState\n\n: \n\nA shared data structure that represents the current\
    \ snapshot of an application. It can be any Python type, but is typically a TypedDict\
    \ or Pydantic BaseModel.\n\nNodes\n\n: \n\nFunctions that encode the agent’s logic.\
    \ They take the current state, perform computation or side effects, and return\
    \ an updated state.\n\nEdges\n\n: \n\nRules that select the next node based on\
    \ the current state. They can be conditional branches or fixed transitions and\
    \ should also detect when a finish condition is met.\n\nCommand\n\n: \n\nAn object\
    \ that combines control flow and state updates to support multi-actor communication.\
    \ A node can both update the state and choose the next node by returning a `Command`.\n\
    \nSo far, the tools you created earlier have only been used in *stateless loops*.\
    \ Each run was independent: the model could call tools, get answers, and wrap\
    \ up, but as soon as the run ended, all context was lost. Now, if you want to\
    \ combine LangGraph’s concepts to build stateful agents, you need to embed the\
    \ tools into a stateful workflow. Instead of discarding messages after each turn,\
    \ you keep them in a structured state. This makes the system agentic:\n\n*   The\
    \ LLM node reasons about the next step.\n\n*   The tool node executes external\

- raw: "[![1](assets/1.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO2-1)\n\
    \n: \n\nThe state of the agent.\n\n[![2](assets/2.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO2-2)\n\
    \n: \n\nContext *c*[*t*] is the message stream.\n\nNow you give the model two\
    \ powers in [Example 2-7](#ch02.html_initReactModel). It can produce language\
    \ tokens that act as thoughts *L*, and it can request structured tool calls *A*.\
    \ Binding the tools makes these actions first-class outputs that the runtime can\
    \ dispatch.\n\n##### Example 2-7. Init LLM\n\n```\nmodel = ChatOpenAI(model=\"\
    gpt-4o-mini\", temperature=0)\nmodel = model.bind_tools(TOOLS) \n```\n\n[![1](assets/1.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO3-1)\n\
    \n: \n\nBinding tools to the model augments the action space to *Â* = *A* ∪ *L*.\n\
    \n[Example 2-8](#ch02.html_CallingModel) is the policy step. It reads the entire\
    \ message history, applies the system rules, and produces exactly one thing: either\
    \ a thought, or a tool call request, or both. You don’t branch here, you simply\
    \ return what the model decided.\n\n##### Example 2-8. Call the model\n\n```\n\
    def call_model(state: AgentState, config: RunnableConfig) -> Dict[str, Any]:\n\
    \    response = model.invoke([SYSTEM_PROMPT] + state[\"messages\"], config) \n\
    \    return {\"messages\": [response]} \n```\n\n[![1](assets/1.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO4-1)\n\
    \n: \n\nPolicy *π*(*c*[*t*]) → *â*[*t*] is `model.invoke` on the current context.\n\
    \n[![2](assets/2.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO4-2)\n\
    \n: \n\nThe reducer appends new messages, implementing *c*[*t* + 1] = (*c*[*t*], *â*[*t*]).\n\
    \nIn [Example 2-9](#ch02.html_tool_calls) you translate intent into effect. Every\
    \ requested tool call is executed deterministically, and its result is wrapped\
    \ as a message. By pushing the observation into the same message stream, you let\
    \ the next policy step reason over fresh evidence without special cases.\n\n#####\
    \ Example 2-9. Execute tool calls\n\n```\ndef tool_node(state: AgentState) ->\
    \ Dict[str, Any]:\n\n    last = state[\"messages\"][-1]\n    outputs: list[ToolMessage]\
    \ = []\n    for tc in getattr(last, \"tool_calls\", []) or []: \n        name\
    \ = tc.get(\"name\")\n        args = tc.get(\"args\") or {}\n        tool_fn =\
    \ TOOLS_BY_NAME.get(name)\n        if not tool_fn:\n            result = json.dumps({\"\
    error\": f\"Unknown tool {name}\"})\n        else:\n            result = tool_fn.invoke(args)\n\
    \        outputs.append(\n            ToolMessage(\n                content=result,\
    \ \n                name=name,\n                tool_call_id=tc.get(\"id\"),\n\
    \            )\n        )\n    return {\"messages\": outputs}\n```\n\n[![1](assets/1.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO5-1)\n\
    \n: \n\nIf the model chose an action *a*[*t*] ∈ *A*, execute the tool.\n\n[![2](assets/2.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO5-2)\n\
    \n: \n\nTool output is the observation that informs the next step.\n\nThe stopping\
    \ rule in [Example 2-10](#ch02.html_tot_halting) is simple. If the model asked\
    \ for a tool, it must complete that effect before asking it again. If it didn’t,\
    \ you’d assume it produced a final answer. This keeps the loop predictable and\
    \ avoids orphaned actions.\n\n##### Example 2-10. Halting condition\n\n```\ndef\
    \ should_continue(state: AgentState) -> str:\n    last = state[\"messages\"][-1]\n\
    \    if getattr(last, \"tool_calls\", None): \n        return \"continue\"\n \
    \   return \"end\"\n```\n\n[![1](assets/1.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO6-1)\n\
    \n: \n\nHalting test reads the last AI message to decide continue or end.\n\n\
    Now you connect the pieces into a small state machine, as shown in [Example 2-11](#ch02.html_Build_ToT_graph).\
    \ The edges encode the control flow that mirrors the ReAct diagram. The policy\
    \ node runs first. If it emits an action, we route to the tools node and then\
    \ back to policy. If it emits only a thought or a final answer, we terminate.\n\
    \n##### Example 2-11. Build workflow graph\n\n```\nworkflow = StateGraph(AgentState)\n\
    workflow.add_node(\"agent\", call_model)\nworkflow.add_node(\"tools\", tool_node)\n\
    workflow.set_entry_point(\"agent\")\n\nworkflow.add_conditional_edges(\n    \"\
    agent\",\n    should_continue,\n    {\"continue\": \"tools\", \"end\": END},\n\
    )\n\nworkflow.add_edge(\"tools\", \"agent\")\ngraph = workflow.compile()\n```\n\
    \nAt runtime, the graph advances one edge at a time. The conditional edge decides\
    \ whether the next hop is `tools` or `END`. The fixed edge from tools back to\
    \ agent completes the think-act loop.\n\nTo see this in action, you prompt a question,\
    \ I asked how the weather will be in Zurich. The LLM first decides which tool\
    \ to call to answer best, then the tool returns evidence, and the model writes\
    \ a final answer grounded in that evidence. Because every step is recorded in\
    \ the message stream, the reasoning is retrievable:\n\n````\n> Entering new ReAct\
    \ trace...\nQuestion: What is the weather in Zurich today?\n\nFinal Answer: What\
    \ is the weather in Zurich today?\n\n> Finished trace.\n\nReasoning Summary: selecting\
    \ a tool based on the query\nAction:\n```\n\n{\n\n  \"action\": \"internet_search\"\
    ,\n\n  \"action_input\": {\n\n    \"query\": \"Zurich weather today\"\n\n  }\n\
    \n}\n\n```\n\nObservation:\n```\n\n{\n\n  \"title\": \"Zurich, Zurich, Switzerland\
    \ Weather Forecast\",\n\n  \"snippet\": \"Hourly Weather \\u00b7 1 PM 74\\u00b0.\
    \ rain drop 0% \\u00b7 2 PM\n\n  80\\u00b0. rain drop 0% \\u00b7 3 PM 82\\u00b0.\
    \ rain drop 0% \\u00b7 4 PM\n\n  83\\u00b0. rain drop 0% \\u00b7 5 PM 84\\u00b0.\
    \ rain drop 0% \\u00b7 6 PM ...\n\n```\n\nFinal Answer: Today in Zurich, the weather\
    \ is mostly sunny with a high\nof 82°F (about 28°C) and a low of 62°F (about 17°C).\
    \ Winds are light\nfrom the southwest at 6 mph.\n\nFor more details, you can check\
    \ the full forecast\n[here](https://www.accuweather.com/en/ch/zurich/316622/weather-forecast/316622).\n\
    \n> Finished trace.\n````\n\nNow you understand how powerful ReAct can be. It’s\
    \ not just that the agent alternates between thinking and acting, but that the\
    \ reasoning itself becomes part of the state. This recursive process enables agents\
    \ to adapt, refine their strategies, and explain their choices. In practice, it\
    \ allows even relatively small models to perform complex tasks more reliably,\
    \ while making their decision-making process transparent.\n\nTogether, CoT, ToT,\
    \ and ReAct illustrate how different reasoning strategies can shape the intelligence\
    \ of your agents. Each approach has its strengths: CoT offers transparency and\
    \ reliability, ToT explores multiple alternatives before committing, and ReAct\
    \ closes the loop by combining reasoning with tool use. [Table 2-3](#ch02.html_pattern_summary_reasoning)\
    \ gives you a consolidated overview of these reasoning patterns along with tips\
    \ for when they are most useful.\n\nTable 2-3. Pattern summary: Structured reasoning\
    \ methods (CoT, ToT, ReAct)\n\n| Method || Use Case || Benefits || Tradeoffs |\n\
    \n| --- | --- | --- | --- |\n\n| Chain of Thought (CoT) || Step-by-step reasoning\
    \ for math, planning, analysis || Improves reliability and transparency; enables\
    \ smaller models on harder tasks || Slower, verbose outputs; sometimes redundant\
    \ |\n\n| --- | --- | --- | --- |\n\n| Tree of Thought (ToT) || Exploratory tasks\
    \ with multiple solution paths (creative writing, strategy search) || Explores\
    \ alternatives; reduces “first-answer bias” || Higher compute cost; requires orchestration\
    \ (selection and pruning) |\n\n| ReAct || Tasks needing both reasoning and tool\
    \ use (research, coding, APIs) || Integrates reasoning + action; creates audit\
    \ trail; adaptive to feedback || More complex state management; risk of over-calling\
    \ tools |\n\nThis highlights how these methods can become powerful building blocks\
    \ once you integrate them into your overall agentic workflow.\n\n# Surely You’re\
    \ Joking, AI Agent!"

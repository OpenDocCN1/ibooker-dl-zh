- raw: "[Figure 1-3](#ch01.html_agent_core_diagram) illustrates how modules turn a\
    \ static LLM into a dynamic agent. The user request enters the core, planning\
    \ and memory shape its reasoning, and tools enable concrete action. The cycle\
    \ of reasoning, acting, and adapting emerges from the coordination of these elements.\n\
    \n![ch01 agent core](assets/ch01_agent_core.png)\n\n###### Figure 1-3. Baseline\
    \ agent architecture: an LLM alone can only predict text, but with planning, memory,\
    \ and tools it becomes a usable agentic system.\n\nPlanning modules guide the\
    \ agent’s reasoning, ranging from simple chain-of-thought ^([1](#ch01.html_id47))\
    \ traces to more advanced approaches such as trees of thought ^([2](#ch01.html_id48))\
    \ or self-critique. Memory modules provide continuity, allowing the agent to recall\
    \ past steps, reuse prior knowledge, or persist information across sessions. Tools\
    \ connect the agent to its environment, whether through search, retrieval, code\
    \ execution, or custom APIs.\n\nMoreover, a key difference between traditional\
    \ LLM usage and agentic systems is whether the workflow is stateless or stateful.\
    \ A *stateless call* treats the model like a black box: it takes a prompt, predicts\
    \ the next tokens, and returns a result. Nothing is remembered, no actions are\
    \ taken, and no feedback loop exists. [Example 1-1](#ch01.html_SimpleLLM) illustrates\
    \ a stateless LLM call.\n\n##### Example 1-1. Stateless LLM call with LangChain\n\
    \n```\nllm = ChatOpenAI(model=\"gpt-5-mini\")\nresponse = llm.invoke(\"What are\
    \ AI agents?\")\nprint(response.content)\n```\n\nIn addition, the moment you need\
    \ facts from outside training data, or you want the model to act (search, compute),\
    \ you introduce tools.\n\nIn the following code ([Example 1-2](#ch01.html_createTools)\
    \ - [Example 1-4](#ch01.html_statelessRun)) is a minimal stateless tool-using\
    \ run: first you bind two tools to the LLM, and then run a tiny loop that executes\
    \ any tool calls the model needs to fulfill its task. First, you need to define\
    \ your tools. [Example 1-2](#ch01.html_createTools) shows an implementation of\
    \ tools.\n\n##### Example 1-2. Defining tools for a stateless run\n\n```\n@tool(\"\
    internet_search\") \ndef internet_search(query: str) -> str:\n    \"\"\"Search\
    \ Google via SerpAPI for up to date information.\"\"\" \n    serp_api_key = os.environ[\"\
    SERPAPI_API_KEY\"]\n    params = {\"engine\": \"google\", \"gl\": \"us\", \"hl\"\
    : \"en\"}\n    search = SerpAPIWrapper(params=params, serpapi_api_key=serp_api_key)\n\
    \    return search.run(query)\n\n@tool(\"calculator\")\ndef calculator(expression:\
    \ str) -> str:\n    \"\"\"Evaluate a single line mathematical expression with\
    \ numexpr.\"\"\"\n    local_dict = {\"pi\": math.pi, \"e\": math.e}\n    out =\
    \ numexpr.evaluate( \n        expression.strip(),\n        global_dict={},\n \
    \       local_dict=local_dict,\n    )\n    return str(out)\n\ntools = [internet_search,\
    \ calculator]\ntool_map: Dict[str, Any] = {t.name: t for t in tools}\n```\n\n\
    [![1](assets/1.png)](#ch01.html_co_from_llms_to_agents__the_foundational_blueprint_CO5-1)\n\
    \n: \n\nLangChain’s `@tool` decorator uses the function name, typed signature,\
    \ and docstring to build the schema the model sees.\n\n[![2](assets/2.png)](#ch01.html_co_from_llms_to_agents__the_foundational_blueprint_CO5-2)\n\
    \n: \n\nThe docstring is mandatory: if it is missing, LangChain will raise an\
    \ error when constructing the tool schema or binding tools to the model.\n\n[![3](assets/3.png)](#ch01.html_co_from_llms_to_agents__the_foundational_blueprint_CO5-3)\n\
    \n: \n\nConstrain evaluation: deny globals and expose only the constants you want.\
    \ This keeps the calculator deterministic and safe.\n\nWith LangChain’s `@tool`\
    \ decorator, the function signature and docstring are used to build the schema\
    \ the model sees. You need to keep these precise, consistent and as explanatory\
    \ as possible for the task-to-be-done efficiently. The docstring acts as the tool\
    \ description and is a hard requirement from LangChain, if it’s missing, you get\
    \ an error. In addition, if the docstring is vague the model is more likely to\
    \ produce invalid calls.\n\nNow, to give the LLM access to the tool, you just\
    \ bind the tools to the LLM as shown in [Example 1-3](#ch01.html_bindTools).\n\
    \n##### Example 1-3. Bind tools to LLM\n\n```\nllm = ChatOpenAI(model=\"gpt-4o\"\
    , temperature=0,\n                max_tokens=800).bind_tools(tools, tool_choice=\"\
    auto\") \n```\n\n[![1](assets/1.png)](#ch01.html_co_from_llms_to_agents__the_foundational_blueprint_CO6-1)\n\
    \n: \n\nBind tools to the model. tool\\_choice=\"auto” lets the model decide whether\
    \ and which tool to call.\n\n# Modern LLMs are built for agentic tasks\n\nModern\
    \ LLMs are not only capable of calling tools, they are increasingly trained and\
    \ optimized specifically for agentic tasks. For example, models such as [Kimi\
    \ K2](https://moonshotai.github.io/Kimi-K2/) and [Llama 4](https://www.llama.com/docs/model-cards-and-prompt-formats/llama4/)\
    \ are explicitly tuned for coding, tool use, and powering agentic systems. These\
    \ models go beyond answering questions in a chat window. They are instruction\
    \ tuned to act, invoking APIs, running code, or retrieving data as part of their\
    \ core design.\n\nWith tools bound, you can run a minimal stateless tool loop.\
    \ The code in [Example 1-4](#ch01.html_statelessRun) executes any tool calls the\
    \ model requests, feeds observations back, and forces a short wrap up to ensure\
    \ the final answer is returned even if the last step ended on a tool observation.\n\
    \n##### Example 1-4. Stateless single run with tool loop\n\n```\ndef run_once(prompt:\
    \ str, max_steps: int = 8) -> str:\n    messages: List[HumanMessage | AIMessage\
    \ | ToolMessage] = [\n    HumanMessage(content=prompt)] \n    last_ai: AIMessage\
    \ | None = None\n\n    for _ in range(max_steps): \n        ai: AIMessage = llm.invoke(messages)\
    \ \n        messages.append(ai)\n        last_ai = ai\n\n        calls = getattr(ai,\
    \ \"tool_calls\", None) or [] \n        if not calls:\n            return messages[-1].content\n\
    \n        for call in calls:\n            name = call[\"name\"]\n            args\
    \ = call.get(\"args\", {}) or {}\n            result = tool_map[name].invoke(args)\n\
    \            messages.append(ToolMessage(\n                content=str(result),\n\
    \                name=name,\n                tool_call_id=call.get(\"id\") \n\
    \            ))\n\n    messages.append(HumanMessage(content=\"\"\"\nFinish now.\
    \ Give a short final answer in this exact format:\n\nCurrent temperature:\nSquare\
    \ of current temperature:\n\"\"\".strip())) \n    final_ai: AIMessage = llm.invoke(messages)\n\
    \    return final_ai.content\n\nprint(run_once(\"\"\"Two step task.\n\nStep 1:\
    \ Use internet_search to get the current air temperature in New York City\ntoday.\
    \ Show the exact query you used, the top source title and snippet, and\nextract\
    \ a numeric temperature in Celsius. Return this temperature as feedback\nfor Step\
    \ 2.\n\nStep 2: Using the Celsius value from Step 1, compute its square with calculator.\n\
    Show the exact expression you used and the numeric result.\n\nImportant: Give\
    \ a short final answer in this format:\nCurrent temperature:\nSquare of current\
    \ temperature:\"\"\"))\n```\n\n[![1](assets/1.png)](#ch01.html_co_from_llms_to_agents__the_foundational_blueprint_CO7-1)\n\
    \n: \n\nLocal short term memory for this run only. This makes the workflow stateless\
    \ across runs.\n\n[![2](assets/2.png)](#ch01.html_co_from_llms_to_agents__the_foundational_blueprint_CO7-2)\n\
    \n: \n\nA simple step bound protects against runaway loops: LLMs cycling with\
    \ no termination.\n\n[![3](assets/3.png)](#ch01.html_co_from_llms_to_agents__the_foundational_blueprint_CO7-3)\n\
    \n: \n\nOne model step. The assistant may choose to call tools.\n\n[![4](assets/4.png)](#ch01.html_co_from_llms_to_agents__the_foundational_blueprint_CO7-4)\n\
    \n: \n\nRead structured tool calls.\n\n[![5](assets/5.png)](#ch01.html_co_from_llms_to_agents__the_foundational_blueprint_CO7-5)\n\
    \n: \n\nAttach the observation with the matching tool\\_call\\_id so the model\
    \ can correlate results to calls.\n\n[![6](assets/6.png)](#ch01.html_co_from_llms_to_agents__the_foundational_blueprint_CO7-6)\n\
    \n: "
  fmt: "\n[Figure 1-3](#ch01.html_agent_core_diagram) illustrates how modules turn\
    \ a static LLM into a dynamic agent. The user request enters the core, planning\
    \ and memory shape its reasoning, and tools enable concrete action. The cycle\
    \ of reasoning, acting, and adapting emerges from the coordination of these elements.\n\
    \n![ch01 agent core](assets/ch01_agent_core.png)\n\n**Figure 1-3.** Baseline agent\
    \ architecture: an LLM alone can only predict text, but with planning, memory,\
    \ and tools it becomes a usable agentic system.\n\nPlanning modules guide the\
    \ agent’s reasoning, ranging from simple chain-of-thought ^([1](#ch01.html_id47))\
    \ traces to more advanced approaches such as trees of thought ^([2](#ch01.html_id48))\
    \ or self-critique. Memory modules provide continuity, allowing the agent to recall\
    \ past steps, reuse prior knowledge, or persist information across sessions. Tools\
    \ connect the agent to its environment, whether through search, retrieval, code\
    \ execution, or custom APIs.\n\nMoreover, a key difference between traditional\
    \ LLM usage and agentic systems is whether the workflow is stateless or stateful.\
    \ A *stateless call* treats the model like a black box: it takes a prompt, predicts\
    \ the next tokens, and returns a result. Nothing is remembered, no actions are\
    \ taken, and no feedback loop exists. [Example 1-1](#ch01.html_SimpleLLM) illustrates\
    \ a stateless LLM call.\n\n#### Example 1-1. Stateless LLM call with LangChain\n\
    \n```\nllm = ChatOpenAI(model=\"gpt-5-mini\")\nresponse = llm.invoke(\"What are\
    \ AI agents?\")\nprint(response.content)\n```\n\nIn addition, the moment you need\
    \ facts from outside training data, or you want the model to act (search, compute),\
    \ you introduce tools.\n\nIn the following code ([Example 1-2](#ch01.html_createTools)\

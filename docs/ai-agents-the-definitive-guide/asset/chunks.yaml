    I assume in this book that you have at least a fundamental knowledge of LLMs.
    Maybe you’ve read the book [Hands-On Large Language Models](https://learning.oreilly.com/library/view/hands-on-large-language/9781098150952//),
    or a similar work. You don’t need to know how to deploy LLMs to make your agents
    work, since I’ll guide you through those steps in later chapters. However, I expect
    you have solid coding skills in Python, meaning you know what classes and functions
    are, and that you are familiar with core ML and deep learning concepts such as
    neural networks, training loops, and backpropagation. A working knowledge of linear
    algebra and calculus is also helpful, since they underpin much of modern deep
    learning. It is also useful if you understand how transformers process sequences
    and have at least a basic sense of how embeddings work or vector stores support
    retrieval.


    If you haven’t touched these topics in a while, DON’T PANIC! Just like The Hitchhiker’s
    Guide to the Galaxy advises not to panic, I’ll say the same here in my guide.
    That said, every concept will be grounded in code, so your knowledge becomes usable
    again without requiring you to dust off old textbooks. And no, before you ask,
    the answer to everything about AI agents is not 42, but I promise you’ll get your
    answers throughout this book.


    # Code for the book


    All code examples from this book are available in the [GitHub accompanying repository](https://github.com/Nicolepcx/ai-agents-the-definitive-guide).
    The repository is organized by chapter, so you can easily find the code that belongs
    to each section.


    If you would like a closer look at transformers across different domains and how
    embeddings are used for text and other modalities, my book [Transformers: The
    Definitive Guide](https://learning.oreilly.com/library/view/transformers-the-definitive/9781098167004/)
    can serve as a complementary source. It also explains the fundamentals of reinforcement
    learning, which will help you build a stronger foundation for understanding the
    advanced agent concepts introduced later in this book.


    Therefore, this book is written for readers who want to go beyond curiosity, which
    is why understanding these fundamentals is important. This includes data scientists,
    software and ML engineers who are building real systems in production, and technical
    leaders who need to understand the trade-offs, costs, and guardrails involved.
    This book is not about explaining LLMs from scratch, nor is it about abstract
    promises, or thought experiments. It is about the practical realities of building
    and running AI agents that can perform and be useful outside a PowerPoint presentation
    or a lab demo.


    This chapter explains how LLMs evolve from static prompts to dynamic agentic systems,
    why tool use is essential, and what being stateful and autonomous truly means
    in the design of modern AI agents.


    # Finite and Hierarchical State Machines: The Base Paradigm of Agents


    [LangGraph](https://langchain-ai.github.io/langgraph/concepts/why-langgraph/),
    [CrewAI](https://www.crewai.com/), and similar frameworks build on the concept
    of state machines. At a high level, a *state machine* is a computational model
    that exists in one of a finite number of states at any given time. It transitions
    between states in response to specific events or inputs, with the next state determined
    by the current state and the input.


    This section is meant to help you build a mental model of agents by showing how
    state machines form the foundation of modern AI agent frameworks. In simple terms,
    think of it as structured transitions, a pattern long used in compilers, GUIs,
    embedded systems, and networking protocols, now applied to reasoning and tool
    use in LLM-based agents.


    My intention in grounding your understanding first in finite state machines (FSMs)
    and hierarchical state machines (HSMs) is more than a loose analogy. I want to
    give you a blueprint for building LLM agents that are robust, reliable, and adaptable.
    It will empower you to not only understand the concepts but to apply them effectively
    as you learn about more complex topics later in the book. However, if you haven’t
    worked with state machines recently, don’t worry. You’ll see how the patterns
    translate directly in the code examples.


    ## Finite State Machines


    A *finite state machine* has a small vocabulary in which it can act upon and modes
    your system can be in, and the allowed moves between them. Each move is triggered
    by an event, optionally guarded by a predicate, and may perform actions that update
    a state. Start and end are distinguished states with special meaning. The core
    vocabulary is:


    - **State**: A compact snapshot that captures what the system knows at a given
    moment. For an agent, this might be the message list, routing hints, or progress
    markers.

    - **Event**: Something that happens since the last decision, such as a tool being
    invoked or returning a result.

    - **Guard**: A check that decides which transition to take, based on the current
    state and latest event.

    - **Action**: Work performed during a transition, like invoking a tool, appending
    a message, saving a checkpoint, or requesting human input.

    - **Termination**: A condition that signals the process has reached the end.


    [Figure 1-1](#ch01.html_fsm_toolcall) illustrates a finite state machine for tool
    use. Each transition is defined by an event, a guard, and an action.


    ![ch01 fsm toolcall vocab](assets/ch01_fsm_toolcall_vocab.png)


    ###### Figure 1-1. High level overview of a finite state machine for tool use.


    An FSM is ideal when behavior alternates among a few stable modes and when recoverability
    matters, since you can checkpoint on every node and resume after a crash from
    the last completed state.


    Thinking in terms of states lets you decompose a complex task into distinct steps.
    For example, instead of a single prompt for “write a blog post”, you might define
    states such as topic ideation, outline generation, drafting, editing, and SEO
    optimization. Each state can link to specific tools your agent will use.


    *Transitions* make you specify the conditions under which one task hands off to
    the next. For instance, what output from the outline generation state triggers
    the drafting state. This structure counters unstructured, one-shot prompts that
    often lead to inconsistent results with LLMs alone.


    As soon as you add more modes, such as planning, reflection, approval gates, and
    retries, an FSM can force duplication or create spaghetti routing. You need to
    keep control of the edges, since they are decision points: each one encodes the
    event, guard, and action that drives functionality. This is where hierarchy helps.


    ## Hierarchical State Machines


    *Hierarchical state machines* let states contain other states. Superstates capture
    shared entry/exit behavior and shared guards. Substates inherit those rules and
    add their own. History nodes remember which substate you were in when you left,
    so you can resume exactly there later. These new additions to the state machine
    are explained below.


    - **Superstate**: A state that groups a set of child states and their common policies.
    Entering the superstate runs shared logic once; exiting it runs shared cleanup
    once.

    - **Substate**: A concrete mode that lives inside a superstate. It has its own
    edges but inherits the superstate’s guards and actions.

    - **History**: A “remember where I was” marker. Shallow history resumes at the
    last active child; deep history resumes inside nested grandchildren. In agent
    terms, this is a checkpoint for a portion of the graph.

    - **Parallel region**: Two or more child regions of a superstate that advance
    independently. Useful for fanning out tool calls or agent roles and then joining.


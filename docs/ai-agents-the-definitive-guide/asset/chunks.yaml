- raw: "I assume in this book that you have at least a fundamental knowledge of LLMs.\
    \ Maybe you’ve read the book [Hands-On Large Language Models](https://learning.oreilly.com/library/view/hands-on-large-language/9781098150952//),\
    \ or a similar work. You don’t need to know how to deploy LLMs to make your agents\
    \ work, since I’ll guide you through those steps in later chapters. However, I\
    \ expect you have solid coding skills in Python, meaning you know what classes\
    \ and functions are, and that you are familiar with core ML and deep learning\
    \ concepts such as neural networks, training loops, and backpropagation. A working\
    \ knowledge of linear algebra and calculus is also helpful, since they underpin\
    \ much of modern deep learning. It is also useful if you understand how transformers\
    \ process sequences and have at least a basic sense of how embeddings work or\
    \ vector stores support retrieval.\n\nIf you haven’t touched these topics in a\
    \ while, DON’T PANIC! Just like The Hitchhiker’s Guide to the Galaxy advises not\
    \ to panic, I’ll say the same here in my guide. That said, every concept will\
    \ be grounded in code, so your knowledge becomes usable again without requiring\
    \ you to dust off old textbooks. And no, before you ask, the answer to everything\
    \ about AI agents is not 42, but I promise you’ll get your answers throughout\
    \ this book.\n\n# Code for the book\n\nAll code examples from this book are available\
    \ in the [GitHub accompanying repository](https://github.com/Nicolepcx/ai-agents-the-definitive-guide).\
    \ The repository is organized by chapter, so you can easily find the code that\
    \ belongs to each section.\n\nIf you would like a closer look at transformers\
    \ across different domains and how embeddings are used for text and other modalities,\
    \ my book [Transformers: The Definitive Guide](https://learning.oreilly.com/library/view/transformers-the-definitive/9781098167004/)\
    \ can serve as a complementary source. It also explains the fundamentals of reinforcement\
    \ learning, which will help you build a stronger foundation for understanding\
    \ the advanced agent concepts introduced later in this book.\n\nTherefore, this\
    \ book is written for readers who want to go beyond curiosity, which is why understanding\
    \ these fundamentals is important. This includes data scientists, software and\

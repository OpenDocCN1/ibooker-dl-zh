    \ current snapshot of an application. It can be any Python type, but is typically\
    \ a `TypedDict` or `Pydantic BaseModel`.\n\n`Nodes`\n: Functions that encode the\
    \ agent’s logic. They take the current state, perform computation or side effects,\
    \ and return an updated state.\n\n`Edges`\n: Rules that select the next node based\
    \ on the current state. They can be conditional branches or fixed transitions\
    \ and should also detect when a finish condition is met.\n\n`Command`\n: An object\
    \ that combines control flow and state updates to support multi-actor communication.\
    \ A node can both update the state and choose the next node by returning a `Command`.\n\
    \nSo far, the tools you created earlier have only been used in *stateless loops*.\
    \ Each run was independent: the model could call tools, get answers, and wrap\
    \ up, but as soon as the run ended, all context was lost. Now, if you want to\
    \ combine LangGraph’s concepts to build stateful agents, you need to embed the\
    \ tools into a stateful workflow. Instead of discarding messages after each turn,\
    \ you keep them in a structured state. This makes the system agentic:\n\n- The\
    \ LLM node reasons about the next step.\n- The tool node executes external actions.\n\
    - Edges route control flow based on whether tools were requested.\n- Memory checkpoints\

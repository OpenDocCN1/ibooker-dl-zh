- raw: "[![1](assets/1.png)](#ch01.html_co_from_llms_to_agents__the_foundational_blueprint_CO11-1)\n\
    \n: \n\nRead the latest state for a thread.\n\n[![2](assets/2.png)](#ch01.html_co_from_llms_to_agents__the_foundational_blueprint_CO11-2)\n\
    \n: \n\nPrint a concise tail of messages to keep logs readable.\n\n[![3](assets/3.png)](#ch01.html_co_from_llms_to_agents__the_foundational_blueprint_CO11-3)\n\
    \n: \n\nShow routing info and queued tasks if present.\n\n[Example 1-9](#ch01.html_run_with_tracing)\
    \ streams node updates, so you can see each step the graph takes.\n\n##### Example\
    \ 1-9. Trace execution and inspect state and memory\n\n```\ndef run_with_tracing(app,\
    \ input_state: AgentState, config, title: str):\n    \"\"\"Run the graph while\
    \ printing per-node updates and final memory.\"\"\"\n    print(f\"\\n=== {title}\
    \ | execution trace ===\")\n    final = None\n    for event in app.stream(input_state,\
    \ config=config, stream_mode=\"updates\"): \n        for node, upd in event.items():\n\
    \            keys = list(upd.keys()) \n            print(f\"[enter {node}] updated:\
    \ {keys}\")\n            # if messages updated, print the last one briefly\n \
    \           msgs = upd.get(\"messages\") or []\n            if msgs:\n       \
    \         print(f\"  {_short(msgs[-1])}\")\n            print(f\"[leave {node}]\"\
    )\n            final = upd\n    print_state_snapshot(app, config, title=f\"{title}\
    \ | after run\") \n    snap = app.get_state(config)\n    msgs = snap.values.get(\"\
    messages\", [])\n    return msgs[-1].content if msgs else \"\"\n```\n\n[![1](assets/1.png)](#ch01.html_co_from_llms_to_agents__the_foundational_blueprint_CO12-1)\n\
    \n: \n\nStream node updates to see the exact flow through the graph.\n\n[![2](assets/2.png)](#ch01.html_co_from_llms_to_agents__the_foundational_blueprint_CO12-2)\n\
    \n: \n\n`upd` is a dict like `{\"messages\": [<new msg>]}` or tool results.\n\n\
    [![3](assets/3.png)](#ch01.html_co_from_llms_to_agents__the_foundational_blueprint_CO12-3)\n\
    \n: \n\nShow final assistant message from `app.get_state`.\n\n[Example 1-10](#ch01.html_firstTurn)\
    \ asks for the current air temperature in New York City in Celsius. The trace\
    \ shows the graph entering the LLM node, initiating a tool call if needed, and\
    \ returning a final assistant message. The state snapshot confirms that the result\
    \ is saved in memory for this thread.\n\n##### Example 1-10. Turn 1: get the current\
    \ NYC air temperature in Celsius\n\n```\nturn1_answer = run_with_tracing(\n  \
    \  app,\n    {\"messages\": [HumanMessage(content=\"Get the current air temperature\
    \ in New York\n    City in Celsius.\")]},\n    config={**cfg, \"recursion_limit\"\
    : 20},\n    title=\"TURN 1\",\n)\nprint(\"\\nTURN 1 (final assistant):\\n\", turn1_answer)\n\
    ```\n\nThis results in this model output:\n\n```\nTURN 1 (final assistant):\n\
    The current air temperature in New York City is 18°C.\n```\n\nYou continue in\
    \ the same thread. [Example 1-11](#ch01.html_secondTurn) asks to square the previously\
    \ retrieved temperature. Because the thread id is unchanged, the app restores\
    \ the earlier messages, allowing the assistant to use the prior result without\
    \ you repeating it in the prompt.\n\n##### Example 1-11. Turn 2: square that temperature\
    \ in the same thread\n\n```\nturn2_answer = run_with_tracing(\n    app,\n    {\"\
    messages\": [HumanMessage(content=\"Now compute the square of that\n    temperature.\"\
    )]},\n    config={**cfg, \"recursion_limit\": 20},\n    title=\"TURN 2\",\n)\n\
    print(\"\\nTURN 2 (final assistant):\\n\", turn2_answer)\n```\n\nNow the square\
    \ will be computed and the model returns:\n\n```\nTURN 2 (final assistant):\n\
    The square of the temperature, 18°C, is 324.\n```\n\nAgents often need to explore\
    \ alternatives without losing progress. [Example 1-12](#ch01.html_branchThread)\
    \ starts a separate branch by using a different thread id and requests a different\
    \ follow-up. This creates an isolated conversation that can diverge from the main\
    \ path while preserving the main thread’s memory intact.\n\n##### Example 1-12.\
    \ Branch a parallel thread for a different follow-up\n\n```\nbranch_answer = run_with_tracing(\n\
    \    app,\n    {\"messages\": [HumanMessage(content=\"Instead of squaring, convert\
    \ it to\n    Fahrenheit and report both.\")]},\n    config=cfg_branch,\n    title=\"\
    BRANCH\",\n)\nprint(\"\\nBRANCH (final assistant):\\n\", branch_answer)\n```\n\
    \nFinally, you can inspect what each branch remembers. [Example 1-13](#ch01.html_memoryViews)\
    \ prints compact snapshots for the main thread and the branch. Comparing them\
    \ side by side confirms that state is persisted within a thread and isolated across\
    \ threads, which is the foundation for reliable multi-step and multi-branch agent\
    \ workflows.\n\n##### Example 1-13. View snapshots for both threads\n\n```\nprint_state_snapshot(app,\
    \ cfg, title=\"MAIN THREAD memory view\")\nprint_state_snapshot(app, cfg_branch,\
    \ title=\"BRANCH THREAD memory view\")\n```\n\nWith this small implementation,\
    \ you now see exactly what the graph remembers, how it routed, and what the latest\
    \ assistant state is for each branch.\n\n# Deus Ex Machina: What is Possibly Right\
    \ Now?\n\nOnce you view agents as HSMs with states, the autonomy spectrum becomes\
    \ a matter of how much choice you place inside a superstate. Routers are one-edge\
    \ FSMs with a single guard. Tool-calling agents are HSMs with a WORKING superstate\
    \ that loops among PLAN, ACT, and REFLECT. MAS compose multiple subgraphs under\
    \ a supervisor superstate, sometimes with parallel regions. The system still runs\
    \ inside explicit states and guards, perceived “autonomy” is just a richer choice\
    \ inside well-bounded regions.\n\nIn ancient Greek theater, a *deus ex machina*\
    \ was the sudden appearance of a god to resolve an unsolvable conflict or problem.\
    \ It is tempting to imagine AI agents in the same way: a machine that suddenly\
    \ acts with full autonomy and intelligence solving all your problems. But that’s\
    \ not what’s possible today, agents are engineered systems. Their strength comes\
    \ not from hidden magic, but from carefully designed workflows, well-defined tools,\
    \ and the boundaries that keep them safe and usable. That said, agents are still\
    \ constrained by the tools you give them, by safeguards you enforce, and by the\
    \ workflows you allow them to operate within. These constraints are what make\
    \ agents viable today: safe to deploy, predictable in behavior, and aligned with\
    \ their intended goals.\n\nWhat current systems demonstrate is a form of orchestrated\
    \ autonomy. As you saw in the LangGraph examples earlier ([Example 1-5](#ch01.html_stateGraphSetup)),\
    \ agents can branch conditionally, call tools, or decide whether to continue a\
    \ workflow. This already looks very different from a static prompt–response call,\
    \ but it is still bounded. The orchestration logic is fixed; within it, the LLM\
    \ can make choices, but it cannot redefine its architecture. [Table 1-2](#ch01.html_autonomy_limits)\
    \ gives a short overview what agents can do so far.\n\nTable 1-2. Current autonomy\
    \ in agents: what’s possible vs. what remains out of reach\n\n| What agents can\
    \ do || What agents can’t do yet |\n\n| --- | --- |\n\n| Route between predefined\
    \ paths (e.g., router node) || Redesign or rewire their own control graph |\n\n\
    | --- | --- |\n\n| Select which tools or sub-agents to call || Generate and validate\
    \ new graph topologies dynamically |\n\n| Decide if more steps are needed before\
    \ completion || Continuously assess tool effectiveness or create new tools autonomously\
    \ |\n\n| Revise their own prompt or toolset within bounds || Guarantee alignment\
    \ and coherence when shifting strategies mid-execution |\n\n| Write and run small\
    \ pieces of code to determine next steps || Operate as fully self-directed systems\
    \ independent of orchestration frameworks |"

    \ when agents are guided to think in stages, whether as a single voice or as a\
    \ coordinated team, the outcome is more deliberate and reliable.\n\n## How to\
    \ Make Your Agent Take Action and Reflect\n\nYou’ve seen in the previous section\
    \ that CoT and ToT can be helpful for reasoning, but reasoning alone isn’t enough.\
    \ An agent that only reasons never leaves the page, and an agent that only acts\
    \ can’t learn from its decisions. To combine the two, you need ReAct, which stands\
    \ for reasoning and action.\n\nMathematically, you can think of this as mapping\
    \ a context *c*[*t*] to an action *a*[*t*] within an action space *Â* = *A* ∪ *L*.\
    \ Here *A* is the set of task-specific actions that impact the environment, while\
    \ *L* is the set of language-based reasoning traces or thoughts. Each action step\
    \ therefore produces not just a task action *a*[*t*], but also a reasoning trace\
    \ *â*[*t*].\n\nThese traces are folded back into the agent’s state so that the\
    \ context evolves as:\n\n*c*[*t* + 1] = (*c*[*t*], *â*[*t*]) \n\nIn addition,\
    \ you follow the policy:\n\n*π*(*a*[*t*]|*c*[*t*]) \n\nHere, *c*[*t*] = (*o*[1], *a*[1], ..., *o*[*t* − 1], *a*[*t* − 1], *o*[*t*]).\
    \ In other words, the agent carries forward not only what it has done, but also\
    \ why it chose that path. This recursive structure is what enables reflection:\
    \ the agent’s future decisions are informed by both its history of actions and\
    \ the reasoning it has accumulated. The flow diagram in [Figure 2-3](#ch02.html_diagramReAct)\
    \ illustrates a minimal agent loop implemented in LangGraph.\n\n![CH 02 ReAct](assets/CH_02_ReAct.png)\n\
    \n###### Figure 2-3. Control-flow diagram of a ReAct agent. This loop is the operational\
    \ form of the policy *π*(*a*[*t*]|*c*[*t*]).\n\nThe process begins at `__start__`,\
    \ this hands control to the agent, and then branches depending on the outcome:\n\
    \n*   If the agent decides it has reached a conclusion, it produces an end signal\
    \ and moves to `__end__`.\n\n*   If more reasoning or action is required, the\
    \ agent issues a continue signal, possibly calling tools to gather additional\
    \ information or perform actions.\n\n*   After interacting with tools, control\
    \ flows back to the agent, allowing it to integrate results and reflect before\
    \ deciding whether to continue or stop.\n\nThis loop is the essence of ReAct:\
    \ combining reasoning, action, and reflection in an iterative cycle. ReAct is\
    \ more than “the model thinks and then acts”. The reasoning trace itself becomes\
    \ part of the evolving state. That is, the ReAct agent alternates between reasoning\
    \ traces and tool outputs, and those traces feed back into context.\n\nWhile this\
    \ example is in the context of a single agent, the same structure extends naturally\
    \ into larger MAS. Each agent can maintain its own cycle of reasoning and acting,\
    \ with reasoning traces shared or exchanged across agents. This makes ReAct not\
    \ only a tool for individual decision-making, but also a foundation for collaboration\
    \ and reflection in more complex agentic setups.\n\nLet’s make the math and the\
    \ diagram concrete, and let me show you how this actually maps into code. The\
    \ following listings turn the ReAct equations into code. Note, as before, I’ll\
    \ just show the important parts here, but the full running implementation will\

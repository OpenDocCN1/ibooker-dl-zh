    \ Example policy: end if user said stop.\n\n**History and checkpointing**: `MemorySaver`\
    \ gives you shallow and deep history for free: resuming a thread recreates the\
    \ subgraph at the last completed node. If you want explicit “return to where I\
    \ was inside `WORKING`,” persist a small marker (for example, `state[\"working_last\"\
    ] = \"reflect\"`) and branch on it when re-entering.\n\n```\ndef reflect_node(state:\
    \ State) -> State:\n    ai = AIMessage(content=\"Reflect on result\")\n    return\
    \ {\"messages\": [ai], \"working_last\": \"reflect\"}\n\ncheckpointer = MemorySaver()\n\
    app = parent.compile(checkpointer=checkpointer)\n\ncfg = {\"configurable\": {\"\
    thread_id\": \"session-1\"}}\napp.invoke({\"messages\": [HumanMessage(content=\"\
    start\")],\n                        \"working_last\": None}, config=cfg)\n```\n\
    \n- [![1](assets/1.png)](#ch01.html_co_from_llms_to_agents__the_foundational_blueprint_CO4-1):\

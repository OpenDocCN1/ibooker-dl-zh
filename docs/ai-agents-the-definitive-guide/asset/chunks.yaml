- raw: "[Figure 1-2](#ch01.html_hsm_agent) shows a hierarchical state machine with\
    \ a `WORKING` superstate. `PLAN`, `ACT`, and `REFLECT` are substates. `H` is a\
    \ shallow history marker that records the last active substate so execution can\
    \ resume there if the superstate is re-entered.\n\n![ch01 hsm agent](assets/ch01_hsm_agent.png)\n\
    \n###### Figure 1-2. Overview of a hierarchical state machine with history marker\
    \ hat records the last active substate.\n\nHSMs are particularly relevant to more\
    \ advanced MAS. An HSM allows for “states within states”, which reduces duplication\
    \ and makes policies obvious. For example, you can attach rate limits, safety\
    \ filters, or circuit breakers to a `WORKING` superstate, so planning, acting,\
    \ and reflecting all inherit the same safeguards. You define a guard or router\
    \ once and reuse it across nodes. Consider a research agent. Instead of treating\
    \ research as a single monolithic step, you can break it into a sub-machine with\
    \ states such as searching for keywords, gathering URLs, scraping data, and summarizing\
    \ findings. Each of these states can even map to a dedicated agent with its own\
    \ capabilities, contributing to the larger team of agents. This nested structure\
    \ helps manage complexity, keeps policies consistent, and makes the overall system\
    \ easier to reason about and maintain.\n\n## Mapping FSM/HSM to Agent Frameworks\n\
    \nLangGraph already speaks the language of state machines and hierarchy. You implement\
    \ it with subgraphs and shared keys. The router or decision-making agent that\
    \ selects the next action (such as calling the next agent or tool) is analogous\
    \ to the event handler in a classic state machine. It’s the part of the system\
    \ that takes the current state and the LLM’s output (the event or payload) and\
    \ determines the next logical step. The direct mapping is shown below.\n\nState\
    \ schema\n\n: \n\nThe parent graph’s TypedDict defines the shared “bus”. Subgraphs\
    \ declare which keys they read and write. Overlapping keys are the superstate’s\
    \ interface.\n\n```\nclass State(TypedDict):\nmessages: List[BaseMessage]  \n\
    working_last: str | None \n```\n\n[![1](assets/1.png)](#ch01.html_co_from_llms_to_agents__the_foundational_blueprint_CO1-1)\n\
    \n: \n\nShared bus across parent and subgraphs.\n\n[![2](assets/2.png)](#ch01.html_co_from_llms_to_agents__the_foundational_blueprint_CO1-2)\n\
    \n: \n\nOptional shallow history marker.\n\nNodes and subgraphs\n\n: \n\nA subgraph\
    \ is an HSM superstate. Its internal nodes are substates. Entering the subgraph\
    \ runs its entry node; leaving it runs its exit edge back to the parent.\n\n```\n\
    def plan_node(state: State) -> State:\n    ai = AIMessage(content=\"Plan next\
    \ step\")\n    return {\"messages\": [ai], \"working_last\": \"plan\"}\n\ndef\
    \ act_node(state: State) -> State:\n    ai = AIMessage(content=\"Act on plan\"\
    )\n    return {\"messages\": [ai], \"working_last\": \"act\"}\n\nsubgraph_builder\
    \ = StateGraph(State)\nsubgraph_builder.add_node(\"PLAN\", plan_node)\nsubgraph_builder.add_node(\"\
    ACT\", act_node)\nsubgraph_builder.add_edge(START, \"PLAN\")\nsubgraph = subgraph_builder.compile()\
    \ \n```\n\n[![1](assets/1.png)](#ch01.html_co_from_llms_to_agents__the_foundational_blueprint_CO2-1)\n\
    \n: \n\nSubgraph is the superstate.\n\nGuards and conditional edges\n\n: \n\n\
    Parent-level guards enforce global policy (budget, safety). Child-level guards\
    \ route among PLAN/ACT/REFLECT. Because guards are plain Python, they remain deterministic\
    \ and auditable.\n\n```\ndef route_within_working(state: State):\n    last = state.get(\"\
    working_last\")\n    return \"ACT\" if last == \"plan\" else END\n\nsubgraph_builder.add_conditional_edges(\"\
    PLAN\",\n                route_within_working, {\"ACT\": \"ACT\", END: END}) \n\
    \n\nparent = StateGraph(State) \nparent.add_node(\"WORKING\", subgraph)\n\ndef\
    \ global_guard(state: State):\n    tail = \"\".join([\n            getattr(m,\
    \ \"content\", \"\") for m in state[\"messages\"][-3:]\n            ]).lower()\
    \ \n    return END if \"stop\" in tail else \"WORKING\"\n\nparent.add_edge(START,\
    \ \"WORKING\")\nparent.add_conditional_edges(\"WORKING\", global_guard,\n    \
    \                        {\"WORKING\": \"WORKING\", END: END})\n```\n\n[![1](assets/1.png)](#ch01.html_co_from_llms_to_agents__the_foundational_blueprint_CO3-1)\n\
    \n: \n\nAdd conditional edge inside subgraph.\n\n[![2](assets/2.png)](#ch01.html_co_from_llms_to_agents__the_foundational_blueprint_CO3-2)\n\
    \n: \n\nParent graph with a global guard.\n\n[![3](assets/3.png)](#ch01.html_co_from_llms_to_agents__the_foundational_blueprint_CO3-3)\n\
    \n: \n\nExample policy: end if user said stop.\n\nHistory and checkpointing\n\n\
    : \n\nMemorySaver gives you shallow and deep history for free: resuming a thread\
    \ recreates the subgraph at the last completed node. If you want explicit “return\
    \ to where I was inside WORKING,” persist a small marker (for example, state\\\
    [\"working\\_last\"\\] = “reflect”) and branch on it when re-entering.\n\n```\n\
    def reflect_node(state: State) -> State: \n    ai = AIMessage(content=\"Reflect\
    \ on result\")\n    return {\"messages\": [ai], \"working_last\": \"reflect\"\
    }\n\ncheckpointer = MemorySaver() \napp = parent.compile(checkpointer=checkpointer)\n\
    \ncfg = {\"configurable\": {\"thread_id\": \"session-1\"}} \napp.invoke({\"messages\"\
    : [HumanMessage(content=\"start\")],\n                        \"working_last\"\
    : None}, config=cfg)\n```\n\n[![1](assets/1.png)](#ch01.html_co_from_llms_to_agents__the_foundational_blueprint_CO4-1)\n\
    \n: \n\nSubstates set working\\_last on exit.\n\n[![2](assets/2.png)](#ch01.html_co_from_llms_to_agents__the_foundational_blueprint_CO4-2)\n\
    \n: \n\nCompile with checkpointing.\n\n[![3](assets/3.png)](#ch01.html_co_from_llms_to_agents__the_foundational_blueprint_CO4-3)\n\
    \n: \n\nRun in a thread. MemorySaver restores last completed node on resume.\n\
    \nFSMs give you a way to structure tasks into stable, recoverable steps. HSMs\
    \ extend this by reducing duplication and centralizing policy when workflows grow\
    \ more complex. Both patterns prepare you for the next step: turning static LLM\
    \ predictions into dynamic, stateful agents.\n\n# Foundations: From Static Models\
    \ to Dynamic Agents\n\nAs you saw in the previous section, adding states and control\
    \ flows is essential for automation. The same principle applies to agents. To\
    \ move from static LLM usage to agentic systems, you need explicit state and control\
    \ flow. State turns one off tool calls into a memory bearing process. Control\
    \ flow adds guards and transitions that govern when to plan, when to act, and\
    \ when to stop.\n\nThe reason to add this to LLMs is simple: LLMs are static predictors.\
    \ They generate the next token given a prompt, drawing only on patterns encoded\
    \ in their training data. This makes them powerful reasoners but leaves them confined\
    \ to what they already know. They cannot update knowledge, verify claims, or interact\
    \ with an environment.\n\n*Agency* emerges when reasoning is coupled with action.\
    \ *Reasoning* is the internal process of planning or deciding the next step. *Action*\
    \ extends this by invoking tools, retrieving data, executing code, or calling\
    \ external services. Together they form an iterative loop: reason, act, receive\
    \ feedback, and adjust. This loop is the foundation of agentic behavior.\n\n[Table 1-1](#ch01.html_trad_vs_agents)\
    \ compares static LLMs to agentic systems. These contrasts show not only why agents\
    \ are necessary, but also how their design shifts traditional machine learning\
    \ workflows into dynamic, tool augmented systems.\n\nTable 1-1. Comparison of\
    \ Static LLMs and Agentic Systems\n\n| Static LLM (Traditional Use) || Agentic\
    \ System |\n\n| --- | --- |\n\n| Single-pass token generator || Iterative reasoning–action–feedback\
    \ system |\n\n| --- | --- |\n\n| Confined to training data || Can retrieve, verify,\
    \ and update knowledge |\n\n| No memory, stateless || Stateful with short- and\
    \ long-term memory |\n\n| Linear prompt–response || Iterative and adaptive workflow\
    \ |\n\n| No tool use || Tool-augmented (retrieval, code, APIs) |\n\n| Fixed interpretation\
    \ of prompt || Can refine or reinterpret goals dynamically |\n\n| No external\
    \ validation || Actively checks, corrects, and improves output |"

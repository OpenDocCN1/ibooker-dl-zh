- raw: "##### Example 2-28. Build hierarchical architecture\n\n```\nsuper_builder\
    \ = StateGraph(State)\nsuper_builder.add_node(\"supervisor\", teams_supervisor_node)\n\
    super_builder.add_node(\"research_team\", call_research_team)\nsuper_builder.add_node(\"\
    writing_team\", call_paper_writing_team)\n\nsuper_builder.add_edge(START, \"supervisor\"\
    )\nsuper_graph = super_builder.compile()\n```\n\nOnce that’s in place, you can\
    \ prompt your hierarchical MAS as shown in [Example 2-29](#ch02.html_hierarchical_MAS_run).\n\
    \n##### Example 2-29. Run hierarchical MAS\n\n```\nTARGET_FILE = \"semiconductor_whitepaper.txt\"\
    \n\nTASK_MSG = f\"\"\"\nWrite an 800-word research report white paper on semiconductor\
    \ development.\nStart with an executive summary of your findings.\nSearch for\
    \ relevant recent patents and include links to them.\nIMPORTANT: Provide links\
    \ to all your sources.\nFinally, save the full report to disk as a .txt file using\
    \ the write_document tool.\nUse file_name=\"{TARGET_FILE}\".\n\"\"\"\n\nfor step\
    \ in super_graph.stream(\n    {\n        \"messages\": [\n            (\"user\"\
    , TASK_MSG.strip())\n        ],\n    },\n    {\"recursion_limit\": 150},\n):\n\
    \    print(step)\n    print(\"---\")\n```\n\nRunning this setup will result in\
    \ the following sequence of supervisor decisions (messages again omitted):\n\n\
    ```\n{'supervisor': {'next': 'research_team'}}\n{'supervisor': {'next': 'writing_team'}}\n\
    {'supervisor': {'next': 'writing_team'}}\n{'supervisor': {'next': '__end__'}}\n\
    ```\n\nAt the end of the run, the report is successfully saved to `semiconductor_whitepaper.txt`.\
    \ In practice, this workflow takes only about two minutes to gather the research,\
    \ generate the text, and write everything to file.\n\n## Developing a Swarm of\
    \ Agents\n\nAnother important paradigm is the swarm architecture. Here, agents\
    \ handoff control to one another dynamically based on their specializations. Unlike\
    \ a strict hierarchy, swarms emphasize peer-to-peer collaboration. The system\
    \ keeps track of which agent was last active so that subsequent interactions continue\
    \ seamlessly with the right one. This back-and-forth exchange allows work to bounce\
    \ naturally between agents, such as when a researcher gathers sources and then\
    \ hands them to a writer, who may in turn request more data before finishing the\
    \ synthesis. [Figure 2-8](#ch02.html_agent_swarm) illustrates this continuous\
    \ flow.\n\n![ch02 agent swarm](assets/ch02_agent_swarm.png)\n\n###### Figure 2-8.\
    \ Handoff flow between a swarm of agents.\n\nLangGraph provides an [open-source\
    \ library](https://github.com/langchain-ai/langgraph-swarm-py) to fast track the\
    \ development of swarms of agents. By default, the agents in the swarm use handoff\
    \ tools created with the prebuilt `create_handoff_tool`. You can also create your\
    \ own custom handoff tools to better fit your workflow. For example, you might:\n\
    \n*   Change the tool name or description to make the handoff purpose clearer.\n\
    \n*   Add tool call arguments for the LLM to populate, such as a specific task\
    \ description for the next agent.\n\n*   Control what data is passed to the next\
    \ agent. By default, `create_handoff_tool` passes the full message history (all\
    \ prior agent messages) and a tool message confirming the handoff, but you may\
    \ choose to send only a filtered subset of context.\n\nBefore wiring up a full\
    \ swarm, you first need to define the handoff helpers as shown in [Example 2-30](#ch02.html_handoff_helper).\
    \ These tools act as signals that let one agent pass control to another. In the\
    \ example below, the research assistant can handoff to the writer once enough\
    \ sources are collected, and the writer can hand control back if more evidence\
    \ is needed.\n\n##### Example 2-30. Create handoff tools\n\n```\nto_writer = create_handoff_tool(\
    \ \n    agent_name=\"writer_assistant\",\n    description=\"\"\"Transfer to the\
    \ writing assistant to synthesize sources into\n                an answer.\"\"\
    \",\n)\nto_research = create_handoff_tool( \n    agent_name=\"research_assistant\"\
    ,\n    description=\"\"\"Return to the research assistant to fetch or scrape more\n\
    \                sources.\"\"\",\n)\n```\n\n[![1](assets/1.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO21-1)\n\
    \n: \n\nDefines a tool that lets the research assistant handoff to the writing\
    \ assistant.\n\n[![2](assets/2.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO21-2)\n\
    \n: \n\nDefines the reverse tool so the writer can send control back to the research\
    \ assistant.\n\nOnce you have the handoff helpers in place, you can move on to\
    \ defining your agents. It’s helpful to keep the roles very distinct. In this\
    \ setup you want one agent focused purely on research, and the other focused on\
    \ writing. The handoff tools ensure the workflow can bounce back and forth when\
    \ more sources are needed or when it’s time to synthesize. The roles are shown\
    \ in [Example 2-31](#ch02.html_roles_research_writer).\n\n##### Example 2-31.\
    \ Assign roles to research and writing assistants\n\n```\nresearch_assistant =\
    \ create_react_agent( \n    model=llm,\n    tools=[tavily_tool, scrape_webpages,\
    \ to_writer], \n    prompt=(\n        \"\"\"You are a research assistant. Search\
    \ the web with Tavily.\n        When you have 3 to 5 solid sources, scrape key\
    \ pages for details,\n        then hand off to the writer assistant.\"\"\"\n \
    \   ),\n    name=\"research_assistant\",\n)\n\nwriter_assistant = create_react_agent(\
    \ \n    model=llm,\n    tools=[to_research], \n    prompt=(\n        \"\"\"You\
    \ are a writing assistant. Read the provided Documents and messages.\n       \
    \ Synthesize a concise answer with citations by site name in brackets. If\n  \
    \      sources are thin or unclear, hand back to research with a short request.\"\
    \"\"\n    ),\n    name=\"writer_assistant\",\n)\n```\n\n[![1](assets/1.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO22-1)\n\
    \n: \n\nDefines the research assistant, responsible for web search and scraping.\n\
    \n[![2](assets/2.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO22-2)\n\
    \n: \n\nGrants the research assistant access to its tools, including the handoff\
    \ to the writer.\n\n[![3](assets/3.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO22-3)\n\
    \n: \n\nDefines the writing assistant, responsible for synthesis and citation.\n\
    \n[![4](assets/4.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO22-4)\n\
    \n: \n\nAllows the writer to hand control back to the research assistant if more\
    \ evidence is needed.\n\nNow that both roles are defined, we can wire them into\
    \ a swarm. The swarm provides the coordination mechanism: it starts with the research\
    \ assistant by default, but allows handoff to the writer and back again until\
    \ the task is complete. The implementation is shown in [Example 2-32](#ch02.html_research_writer_swarm).\n\
    \n##### Example 2-32. Build research–writer swarm\n\n```\nswarm = create_swarm(\n\
    \    agents=[research_assistant, writer_assistant],\n    default_active_agent=\"\
    research_assistant\",\n).compile()\n```\n\nTo test the system, you can run the\
    \ following example prompt. Here, I requested a summary of fintech licensing in\
    \ Switzerland. The swarm first searches for sources, then hands off to the writing\
    \ assistant for synthesis, and if needed returns to research for more data. See\
    \ [Example 2-33](#ch02.html_research_writer_run) for the prompt.\n\n##### Example\
    \ 2-33. Run research–writer swarm\n\n```\nuser_request = { \n    \"messages\"\
    : [\n        {\n            \"role\": \"user\",\n            \"content\": (\n\
    \                \"\"\"Find the current Swiss fintech licensing options for small\n\
    \                 startups. Gather authoritative sources and produce a short\n\
    \                 summary with three bullet points and references.\"\"\"\n   \
    \         ),\n        }\n    ]\n}\n\nfor chunk in swarm.stream(user_request):\
    \ \n    print(chunk)\n    print()\n```\n\n[![1](assets/1.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO23-1)\n\
    \n: \n\nDefines a user prompt asking for fintech licensing details in Switzerland."
  fmt: "\n### Example 2-28. Build hierarchical architecture\n\n```\nsuper_builder\
    \ = StateGraph(State)\nsuper_builder.add_node(\"supervisor\", teams_supervisor_node)\n\
    super_builder.add_node(\"research_team\", call_research_team)\nsuper_builder.add_node(\"\
    writing_team\", call_paper_writing_team)\n\nsuper_builder.add_edge(START, \"supervisor\"\
    )\nsuper_graph = super_builder.compile()\n```\n\nOnce that’s in place, you can\
    \ prompt your hierarchical MAS as shown in [Example 2-29](#ch02.html_hierarchical_MAS_run).\n\
    \n### Example 2-29. Run hierarchical MAS\n\n```\nTARGET_FILE = \"semiconductor_whitepaper.txt\"\
    \n\nTASK_MSG = f\"\"\"\nWrite an 800-word research report white paper on semiconductor\
    \ development.\nStart with an executive summary of your findings.\nSearch for\
    \ relevant recent patents and include links to them.\nIMPORTANT: Provide links\
    \ to all your sources.\nFinally, save the full report to disk as a .txt file using\
    \ the write_document tool.\nUse file_name=\"{TARGET_FILE}\".\n\"\"\"\n\nfor step\
    \ in super_graph.stream(\n    {\n        \"messages\": [\n            (\"user\"\
    , TASK_MSG.strip())\n        ],\n    },\n    {\"recursion_limit\": 150},\n):\n\
    \    print(step)\n    print(\"---\")\n```\n\nRunning this setup will result in\
    \ the following sequence of supervisor decisions (messages again omitted):\n\n\
    ```\n{'supervisor': {'next': 'research_team'}}\n{'supervisor': {'next': 'writing_team'}}\n\
    {'supervisor': {'next': 'writing_team'}}\n{'supervisor': {'next': '__end__'}}\n\
    ```\n\nAt the end of the run, the report is successfully saved to `semiconductor_whitepaper.txt`.\
    \ In practice, this workflow takes only about two minutes to gather the research,\
    \ generate the text, and write everything to file.\n\n## Developing a Swarm of\
    \ Agents\n\nAnother important paradigm is the swarm architecture. Here, agents\
    \ handoff control to one another dynamically based on their specializations. Unlike\
    \ a strict hierarchy, swarms emphasize peer-to-peer collaboration. The system\
    \ keeps track of which agent was last active so that subsequent interactions continue\
    \ seamlessly with the right one. This back-and-forth exchange allows work to bounce\
    \ naturally between agents, such as when a researcher gathers sources and then\
    \ hands them to a writer, who may in turn request more data before finishing the\
    \ synthesis. [Figure 2-8](#ch02.html_agent_swarm) illustrates this continuous\
    \ flow.\n\n![ch02 agent swarm](assets/ch02_agent_swarm.png)\n\n#### Figure 2-8.\
    \ Handoff flow between a swarm of agents.\n\nLangGraph provides an [open-source\
    \ library](https://github.com/langchain-ai/langgraph-swarm-py) to fast track the\
    \ development of swarms of agents. By default, the agents in the swarm use handoff\
    \ tools created with the prebuilt `create_handoff_tool`. You can also create your\
    \ own custom handoff tools to better fit your workflow. For example, you might:\n\
    \n*   Change the tool name or description to make the handoff purpose clearer.\n\
    *   Add tool call arguments for the LLM to populate, such as a specific task description\
    \ for the next agent.\n*   Control what data is passed to the next agent. By default,\
    \ `create_handoff_tool` passes the full message history (all prior agent messages)\
    \ and a tool message confirming the handoff, but you may choose to send only a\
    \ filtered subset of context.\n\nBefore wiring up a full swarm, you first need\
    \ to define the handoff helpers as shown in [Example 2-30](#ch02.html_handoff_helper).\
    \ These tools act as signals that let one agent pass control to another. In the\
    \ example below, the research assistant can handoff to the writer once enough\
    \ sources are collected, and the writer can hand control back if more evidence\
    \ is needed.\n\n### Example 2-30. Create handoff tools\n\n```\nto_writer = create_handoff_tool(\
    \ \n    agent_name=\"writer_assistant\",\n    description=\"\"\"Transfer to the\
    \ writing assistant to synthesize sources into\n                an answer.\"\"\
    \",\n)\nto_research = create_handoff_tool( \n    agent_name=\"research_assistant\"\
    ,\n    description=\"\"\"Return to the research assistant to fetch or scrape more\n\
    \                sources.\"\"\",\n)\n```\n\n[![1](assets/1.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO21-1)\n\
    \n: Defines a tool that lets the research assistant handoff to the writing assistant.\n\
    \n[![2](assets/2.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO21-2)\n\
    \n: Defines the reverse tool so the writer can send control back to the research\
    \ assistant.\n\nOnce you have the handoff helpers in place, you can move on to\
    \ defining your agents. It’s helpful to keep the roles very distinct. In this\
    \ setup you want one agent focused purely on research, and the other focused on\
    \ writing. The handoff tools ensure the workflow can bounce back and forth when\
    \ more sources are needed or when it’s time to synthesize. The roles are shown\
    \ in [Example 2-31](#ch02.html_roles_research_writer).\n\n### Example 2-31. Assign\
    \ roles to research and writing assistants\n\n```\nresearch_assistant = create_react_agent(\
    \ \n    model=llm,\n    tools=[tavily_tool, scrape_webpages, to_writer], \n  \
    \  prompt=(\n        \"\"\"You are a research assistant. Search the web with Tavily.\n\
    \        When you have 3 to 5 solid sources, scrape key pages for details,\n \
    \       then hand off to the writer assistant.\"\"\"\n    ),\n    name=\"research_assistant\"\
    ,\n)\n\nwriter_assistant = create_react_agent( \n    model=llm,\n    tools=[to_research],\
    \ \n    prompt=(\n        \"\"\"You are a writing assistant. Read the provided\
    \ Documents and messages.\n        Synthesize a concise answer with citations\
    \ by site name in brackets. If\n        sources are thin or unclear, hand back\
    \ to research with a short request.\"\"\"\n    ),\n    name=\"writer_assistant\"\
    ,\n)\n```\n\n[![1](assets/1.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO22-1)\n\
    \n: Defines the research assistant, responsible for web search and scraping.\n\
    \n[![2](assets/2.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO22-2)\n\
    \n: Grants the research assistant access to its tools, including the handoff to\
    \ the writer.\n\n[![3](assets/3.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO22-3)\n\
    \n: Defines the writing assistant, responsible for synthesis and citation.\n\n\
    [![4](assets/4.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO22-4)\n\
    \n: Allows the writer to hand control back to the research assistant if more evidence\
    \ is needed.\n\nNow that both roles are defined, we can wire them into a swarm.\
    \ The swarm provides the coordination mechanism: it starts with the research assistant\
    \ by default, but allows handoff to the writer and back again until the task is\
    \ complete. The implementation is shown in [Example 2-32](#ch02.html_research_writer_swarm).\n\
    \n### Example 2-32. Build research–writer swarm\n\n```\nswarm = create_swarm(\n\
    \    agents=[research_assistant, writer_assistant],\n    default_active_agent=\"\
    research_assistant\",\n).compile()\n```\n\nTo test the system, you can run the\
    \ following example prompt. Here, I requested a summary of fintech licensing in\
    \ Switzerland. The swarm first searches for sources, then hands off to the writing\
    \ assistant for synthesis, and if needed returns to research for more data. See\
    \ [Example 2-33](#ch02.html_research_writer_run) for the prompt.\n\n### Example\
    \ 2-33. Run research–writer swarm\n\n```\nuser_request = { \n    \"messages\"\
    : [\n        {\n            \"role\": \"user\",\n            \"content\": (\n\
    \                \"\"\"Find the current Swiss fintech licensing options for small\n\
    \                 startups. Gather authoritative sources and produce a short\n\
    \                 summary with three bullet points and references.\"\"\"\n   \
    \         ),\n        }\n    ]\n}\n\nfor chunk in swarm.stream(user_request):\
    \ \n    print(chunk)\n    print()\n```\n\n[![1](assets/1.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO23-1)\n\
    \n: Defines a user prompt asking for fintech licensing details in Switzerland.\n"

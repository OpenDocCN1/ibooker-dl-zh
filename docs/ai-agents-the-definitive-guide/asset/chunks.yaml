    \ can evolve from simple approval gates into richer collaborations between human\
    \ and agents.\n\n# Advanced Agent Paradigms: Supervisor and Hierarchical Agents\n\
    \nIf your tasks start getting more complex than the ones you’ve seen so far, or\
    \ if you notice your agent struggling, it can help to break the task into smaller\
    \ subtasks. Think of it like building a team: each person brings a different skill\
    \ to the table, and together they solve the larger challenge.\n\nIn the same way,\
    \ you can introduce smaller, independent agents that form a MAS. One common setup\
    \ is the *supervisor architecture*, where every agent reports to a single supervisor\
    \ that decides who should act next. A more advanced version is the *hierarchical\
    \ architecture*, where you don’t just have one supervisor, but supervisors of\
    \ supervisors. This generalization allows for more flexible control flows.\n\n\
    The diagram in [Figure 2-4](#ch02.html_single_vs_supervisor_vs_hierarchical) shows\
    \ how a single-agent setup compares to these two multi-agent patterns.\n\n![ch02\
    \ single vs supervisor vs hierarchical](assets/ch02_single_vs_supervisor_vs_hierarchical.png)\n\
    \n###### Figure 2-4. Comparison of single, supervisor, and hierarchical agent\
    \ architectures.\n\nThe primary benefits of using a MAS are its modularity, specialization,\
    \ and control. By separating functionality across agents, you make the overall\
    \ system easier to develop, test, and maintain. Each agent can be designed as\
    \ a domain expert, which boosts the system’s performance as a whole. And unlike\
    \ simple function calling, a multi-agent setup also gives you explicit control\
    \ over how agents communicate with one another.\n\n## Building a Hierarchical\
    \ Research Team\n\nTo make the idea of supervisors and sub-agents concrete, let’s\
    \ walk through an example where you build a hierarchical research team. I’ll use\
    \ LangGraph’s prebuilt, reusable `create_react_agent` component to fast-track\
    \ the implementation of a ReAct agent. Each worker agent then gets a clear role:\
    \ some focus on web search, others scrape pages, query [Exa](https://exa.ai/)\
    \ for more structured search results, or even look up patents on Google. A supervisor\
    \ agent sits on top, coordinating the specialists and deciding who should act\
    \ next. The end goal is to assemble a market research team. [Figure 2-5](#ch02.html_hierarchical_architecture_graph)\
    \ shows the final application you’re building.\n\n![ch02 market research team\
    \ graph](assets/ch02_market_research_team_graph.png)\n\n###### Figure 2-5. Final\
    \ application with a hierarchical architecture.\n\nBut before you get there, you’ll\
    \ start smaller by building your first supervisor setup: the research team. You\
    \ see the overview of the team you create in [Figure 2-6](#ch02.html_Flow_diagram_research_team).\
    \ Once that’s in place, the second step is to add a writing team. This group will\
    \ take the output from the research team and save it to your file system as a\
    \ simple text file.\n\n![ch02 research team graph](assets/ch02_research_team_graph.png)\n\
    \n###### Figure 2-6. Flow diagram for the research team.\n\nI’ll leave out the\
    \ details of how to create tools, since you already learned this in chapter one\
    \ ([Example 1-2](#ch01.html_createTools)).\n\nThe first thing you need is a helper\
    \ ([Example 2-21](#ch02.html_helper_supervisor)) to create your supervisor. This\
    \ function acts as a router (see [“Mapping FSM/HSM to Agent Frameworks”](#ch01.html_router_section))\
    \ that decides which worker should take the next step, or whether the process\
    \ should finish.\n\n##### Example 2-21. Helper function for supervisor\n\n```\n\
    class State(MessagesState): \n    next: str\n\ndef make_supervisor_node(llm: BaseChatModel,\
    \ members: list[str]) -> str: \n    options = [\"FINISH\"] + members\n    system_prompt\
    \ = ( \n        \"You are a supervisor tasked with managing a conversation between\
    \ the\"\n        f\" following workers: {members}. Given the following user request,\"\
    \n        \" respond with the worker to act next. Each worker will perform a\"\
    \n        \" task and respond with their results and status. When finished,\"\n\
    \        \" respond with FINISH.\"\n    )\n\n    class Router(TypedDict):\n  \
    \      \"\"\"Worker to route to next. If no workers needed, route to FINISH.\"\
    \"\"\n\n        next: Literal[*options]\n\n    def supervisor_node(state: State)\
    \ -> Command[Literal[*members, \"__end__\"]]:\n        \"\"\"An LLM-based router.\"\
    \"\"\n        messages = [\n            {\"role\": \"system\", \"content\": system_prompt},\n\
    \        ] + state[\"messages\"]\n        response = llm.with_structured_output(Router).invoke(messages)\
    \ \n        goto = response[\"next\"]\n        if goto == \"FINISH\": \n     \
    \       goto = END\n\n        return Command(goto=goto, update={\"next\": goto})\n\
    \n    return supervisor_node\n```\n\n[![1](assets/1.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO15-1)\n\

    \ add only what is new: a typed state, an LLM node that appends assistant messages,\
    \ a tool node that executes calls, and a router that decides whether to continue\
    \ or stop based on tool calls.\n\n##### Example 1-5. Build a minimal LangGraph\
    \ with state, nodes, and routing\n\n```\nclass AgentState(TypedDict):\n    messages:\
    \ Annotated[List[BaseMessage], add_messages] \n\ndef llm_node(state: AgentState)\
    \ -> AgentState: \n    ai = llm.invoke(state[\"messages\"])\n    return {\"messages\"\
    : [ai]}\n\ntool_node = ToolNode(tools=tools) \n\ngraph = StateGraph(AgentState)\
    \ \ngraph.add_node(\"llm\", llm_node)\ngraph.add_node(\"tools\", tool_node)\n\
    graph.add_edge(START, \"llm\")\n\ndef route(state: AgentState): \n    last = state[\"\
    messages\"][-1]\n    calls = getattr(last, \"tool_calls\", None) or []\n    return\
    \ \"tools\" if calls else END\n\ngraph.add_conditional_edges(\"llm\", route, {\"\
    tools\": \"tools\", END: END})\ngraph.add_edge(\"tools\", \"llm\")\n```\n\n[![1](assets/1.png)](#ch01.html_co_from_llms_to_agents__the_foundational_blueprint_CO8-1)\n\
    \n: \n\nThe state carries the conversation as a message list. `add_messages` handles\
    \ safe merging across node updates.\n\n[![2](assets/2.png)](#ch01.html_co_from_llms_to_agents__the_foundational_blueprint_CO8-2)\n\
    \n: \n\nCore reasoning node. It takes the current state and returns a new assistant\
    \ message.\n\n[![3](assets/3.png)](#ch01.html_co_from_llms_to_agents__the_foundational_blueprint_CO8-3)\n\
    \n: \n\nPrebuilt node to execute tool calls emitted by the assistant.\n\n[![4](assets/4.png)](#ch01.html_co_from_llms_to_agents__the_foundational_blueprint_CO8-4)\n\
    \n: \n\nGraph container for nodes and edges.\n\n[![5](assets/5.png)](#ch01.html_co_from_llms_to_agents__the_foundational_blueprint_CO8-5)\n\
    \n: \n\nRouter. If the last assistant turn requested tools, go to tools, otherwise\
    \ finish.\n\nWith the graph defined, you need to make it runnable and persistent.\

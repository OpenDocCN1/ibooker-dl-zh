    \ the intent: we carry a growing conversation state *c*[*t*] while the model alternates\
    \ between language traces *L* and task actions *A*. Each step appends either a\
    \ thought, an action, or a tool observation back into the state. The code mirrors\
    \ this loop. Therefore, you first create the state for the graph as in [Example 2-6](#ch02.html_reactstate).\n\
    \n##### Example 2-6. Create ReAct state\n\n```\nclass AgentState(TypedDict): \n\
    \    messages: Annotated[Sequence[BaseMessage], add_messages] \n```"

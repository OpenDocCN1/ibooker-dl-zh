    \nNext, you need a helper to create your worker nodes, how to implement this is\
    \ shown in [Example 2-22](#ch02.html_helper_node_creation). This makes the setup\
    \ concise and reusable, so you don’t have to repeat the same boilerplate each\
    \ time you add a new agent.\n\n##### Example 2-22. Helper function for node creation\n\
    \n```\ndef make_react_worker_node(\n    *,\n    llm: ChatOpenAI,\n    name: str,\n\
    \    tools: list,\n    prompt: str | None = None,\n    goto: str = \"supervisor\"\
    ,\n):\n    agent = create_react_agent(llm, tools=tools, prompt=prompt) \n\n  \
    \  def node(state: State) -> Command[Literal[\"supervisor\"]]:\n        result:\
    \ Dict[str, Any] = agent.invoke(state) \n        msgs: Sequence[BaseMessage] =\
    \ result.get(\"messages\", [])\n        content = getattr(msgs[-1], \"content\"\
    , \"\") if msgs else \"\"\n        return Command( \n            update={\"messages\"\
    : [HumanMessage(content=content, name=name)]},\n            goto=goto,\n     \
    \   )\n\n    return node\n```\n\n[![1](assets/1.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO16-1)\n\
    \n: \n\nCreate a specialized ReAct agent with its tools and role prompt.\n\n[![2](assets/2.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO16-2)\n\
    \n: \n\nInvoke the agent with the current state.\n\n[![3](assets/3.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO16-3)\n\
    \n: \n\nPass the agent’s latest output back into the state and return to the supervisor.\n\
    \nOnce you have these helpers, you can move on to defining your agents. It’s helpful\
    \ to give each agent a specific role. Since the goal here is to build a market\
    \ research team, the roles should be very targeted. My role prompts are shown\
    \ in [Example 2-23](#ch02.html_roles_research_agents).\n\n##### Example 2-23.\
    \ Assign roles to research agents\n\n```\nSEARCH_PROMPT = \"\"\"Role: Web researcher.\
    \ Use the search tool and return a\nconcise research note with sources. No follow-up\
    \ questions.\"\"\"\n\nSCRAPER_PROMPT = \"\"\"Role: Web scraper. Use the scraping\
    \ tool to fetch details\nfrom given URLs and summarize key findings. No follow-up\
    \ questions.\"\"\"\n\nEXA_PROMPT = \"\"\"Role: Research assistant. You can search\
    \ for all recent info\non Exa Search. Your response should clearly articulate\
    \ the key points you found.\"\"\"\n\nPATENT_PROMPT = \"\"\"Role: Market researcher\
    \ with 20 years of experience.\nYou are very knowledgeable in patent research\
    \ and in finding up-to-date info\nabout patents using the Google Patents API.\"\
    \"\"\n```\n\nNow, let’s create the agents. Using the helper from [Example 2-22](#ch02.html_helper_node_creation),\
    \ you can instantiate each worker and assign it the appropriate role and tool.\
    \ The implementation is shown in [Example 2-24](#ch02.html_create_research_agents).\n\
    \n##### Example 2-24. Create research agents\n\n```\nspecs = [\n    dict(\n  \
    \      name=\"search\",\n        tools=[tavily_tool],\n        prompt=SEARCH_PROMPT,\n\
    \    ), \n    dict(\n        name=\"web_scraper\",\n        tools=[scrape_webpages],\n\
    \        prompt=SCRAPER_PROMPT,\n    ),\n    dict(\n        name=\"exa_search\"\
    ,\n        tools=[exa_search_tool],\n        prompt=EXA_PROMPT,\n    ),\n    dict(\n\
    \        name=\"patent_research\",\n        tools=[patent_search],\n        prompt=PATENT_PROMPT,\n\
    \    ),\n]\n\nnodes = {s[\"name\"]: make_react_worker_node(llm=llm, **s) for s\
    \ in specs} \n\nsearch_node = nodes[\"search\"]\nweb_scraper_node = nodes[\"web_scraper\"\
    ]\nexa_search_node = nodes[\"exa_search\"]\npatent_research_node = nodes[\"patent_research\"\
    ]\n```\n\n[![1](assets/1.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO17-1)\n\
    \n: \n\nDefine each worker with its tools and role.\n\n[![2](assets/2.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO17-2)\n\
    \n: \n\nUse the helper to instantiate all workers without repeating boilerplate.\n\
    \nTo complete the supervisor architecture, we need to set up a supervisor that\
    \ can coordinate across all four research agents. This ensures the workflow doesn’t\
    \ stall and that each agent contributes at the right time. See [Example 2-25](#ch02.html_research_supervisor_node)\
    \ for the implementation.\n\n##### Example 2-25. Create research supervisor node\n\
    \n```\nresearch_supervisor_node = make_supervisor_node(\n    llm, [\"search\"\
    , \"web_scraper\", \"exa_search\", \"patent_research\"]\n) \n```\n\n[![1](assets/1.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO18-1)\n\
    \n: \n\nCreate a supervisor that coordinates across all four research agents.\n\
    \nFinally, we need to build the actual graph by registering nodes and connecting\
    \ the edges that define how control flows between them. This results in a fully\
    \ functioning research team graph, as shown in [Example 2-26](#ch02.html_research_team_graph).\n\
    \n##### Example 2-26. Build research team graph\n\n```\nresearch_builder = StateGraph(State)\n\
    \nresearch_builder.add_node(\"supervisor\", research_supervisor_node) \nresearch_builder.add_node(\"\
    search\", search_node)\nresearch_builder.add_node(\"web_scraper\", web_scraper_node)\n\
    research_builder.add_node(\"exa_search\", exa_search_node)\nresearch_builder.add_node(\"\
    patent_research\", patent_research_node)\n\nresearch_builder.add_edge(START, \"\
    supervisor\") \nresearch_builder.add_edge(\"search\", \"supervisor\")\nresearch_builder.add_edge(\"\
    web_scraper\", \"supervisor\")\nresearch_builder.add_edge(\"exa_search\", \"supervisor\"\
    )\nresearch_builder.add_edge(\"patent_research\", \"supervisor\")\n\nresearch_graph\
    \ = research_builder.compile() \n```\n\n[![1](assets/1.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO19-1)\n\
    \n: \n\nRegister supervisor and worker nodes.\n\n[![2](assets/2.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO19-2)\n\
    \n: \n\nConnect edges so all workers route back to the supervisor.\n\n[![3](assets/3.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO19-3)\n\
    \n: \n\nCompile the graph into an executable workflow.\n\nTo test this setup,\
    \ you can run the code from [Example 2-27](#ch02.html_run_research_team_prompt).\n\
    \n##### Example 2-27. Run research team with prompt\n\n```\nfor s in research_graph.stream(\n\
    \    {\"messages\": [(\"user\", \"\"\"What are AI agents? Are there any patents\
    \ out there\n                              about LLM agents?\"\"\")]}, \n    {\"\
    recursion_limit\": 100},\n):\n    print(s)\n    print(\"---\")\n```\n\n[![1](assets/1.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO20-1)\n\
    \n: \n\nRun the research graph on a query; the supervisor orchestrates which agents\
    \ act.\n\nThis returns a short description AI agents and then uses the patent\
    \ tool to check for recent patents. The steps look like this (I’ve left out the\
    \ actual messages between agents for brevity):\n\n```\n{'supervisor': {'next':\
    \ 'search'}}\n{'supervisor': {'next': 'patent_research'}}\n{'supervisor': {'next':\
    \ '__end__'}}\n```\n\nYou can set up your writing team in the same way. The notebook\
    \ for this section includes the full working code, but [Figure 2-7](#ch02.html_writing_team_flow_diagram)\
    \ gives you a quick overview of what the writing team looks like.\n\n![ch02 writing\
    \ team graph](assets/ch02_writing_team_graph.png)\n\n###### Figure 2-7. Flow-chart\
    \ for writing team.\n\nThis modular approach makes it easy to compose increasingly\
    \ capable MAS step by step: first by wiring up specialized workers, then by combining\
    \ entire teams into larger graphs. In practice, this means you can start small—say\
    \ with search, scraping, and patent lookup in a research team, and then plug that\
    \ into a writing team to form a full end-to-end pipeline, or extend it even further\
    \ with internal data and chart writing and plotting agents.\n\nTo move from individual\
    \ teams to a proper hierarchy, you’ll need to build another graph that ties everything\
    \ together. Think of this as your “super graph,” shown in [Example 2-28](#ch02.html_hierarchical_structure)."

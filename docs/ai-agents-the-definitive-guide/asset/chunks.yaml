- raw: "*Chain-of-thought prompting* (CoT) ^([1](#ch02.html_id52)) is inspired by\
    \ the human thought process, this technique first solves intermediate steps before\
    \ getting to the final answer. While CoT gets often introduced as prompting trick,\
    \ in the context of AI agents CoT can serve as added reasoning steps that guides\
    \ control flow. By forcing the model to generate intermediate steps, you gain\
    \ better transparency over the reasoning process. It often improves reliability\
    \ and can help smaller models perform tasks that would otherwise require a larger\
    \ model. This keeps cost lower while providing clearer insights into how the agent\
    \ arrives at its decisions. [Table 2-2](#ch02.html_cot_prompt_examples) provides\
    \ you ideas for prompts for common scenarios that you can adapt to your needs.\n\
    \nTable 2-2. Examples: Chain of Thought prompts by scenario\n\n| Scenario || CoT\
    \ prompt example |\n\n| --- | --- |\n\n| Planning || “Plan step by step to create\
    \ a one-week blog schedule. Explain the reasoning behind each choice.” |\n\n|\
    \ --- | --- |\n\n| Data analysis || “Begin by describing the dataset. Next highlight\
    \ patterns or trends. Conclude with a clear summary of insights.” |\n\n| Math\
    \ problem || “Break the problem into smaller pieces. Solve each piece with explanation.\
    \ Then combine the results for the final answer.” |\n\n| Research task || “List\
    \ the central questions first. Investigate them one by one. Conclude with a synthesized\
    \ summary.” |\n\n| Debugging || “Start by listing possible causes. Test each cause\
    \ in turn. Eliminate what does not fit and explain why until you reach the fix.”\
    \ |\n\n| Decision-making || “List all available options. Consider pros and cons\
    \ step by step. Choose the option that best fits the criteria and explain why.”\
    \ |\n\nTo make this more explicit how you might want to implement this into your\
    \ workflow, let’s look at an agent for data analysis. Since the core of a CoT\
    \ agent is its ability to reason in a series of logical, intermediate steps, this\
    \ is the perfect example. You can instruct the agent to think step by step, and\
    \ have it begin by describing first the dataset and next have it highlight patterns\
    \ or trends. [Example 2-1](#ch02.html_CoTPrompt) shows a generic system prompt\
    \ you could use for such an agent. I omit the rest of the code for brevity, but\
    \ you can find the complete working implementation in the [book’s repository](https://github.com/Nicolepcx/ai-agents-the-definitive-guide).\n\
    \n##### Example 2-1. CoT prompt\n\n```\nSYSTEM_INSTRUCTIONS = \"\"\"You are a\
    \ careful data analysis assistant. Think step by\nstep and be explicit.\nBegin\
    \ by describing the dataset.\nNext highlight patterns or trends.\nConclude with\
    \ a clear summary of insights.\nWhen you need to compute metrics or create a chart,\
    \ call the python_repl tool with\ncode that:\n1. Loads the CSV from the dataset\
    \ path\n2. Prints descriptive statistics\n3. If a target column exists, creates\
    \ one bar chart of mean values grouped by the\ntarget and saves it to a file\n\
    4. Prints key results\nReturn FINAL ANSWER only after you have executed your analysis.\"\
    \"\"\n```\n\nNow to use the prompt with your agent, you just need to create a\
    \ single agent as show in [Example 2-2](#ch02.html_CoTAgent). Note that I use\
    \ the `AgentExecutor` from LangChain together with LangGraph for brevity in [Example 2-2](#ch02.html_CoTAgent).\
    \ But in the accompanying notebook you’ll also find a more granular LangGraph\
    \ wiring, where the routing between the model and tools is made explicit.\n\n\
    Both approaches yield the same result. However, using the `AgentExecutor` is often\
    \ preferable in production, since it keeps your code concise, while the granular\
    \ graph is valuable for debugging and for understanding how messages, tool calls,\
    \ and control flow work under the hood.\n\n##### Example 2-2. CoT Agent\n\n```\n\
    def create_agent(llm: ChatOpenAI, tools: list, system_prompt: str) -> AgentExecutor:\n\
    \    prompt = ChatPromptTemplate.from_messages(\n        [\n            (\"system\"\
    , system_prompt + \"\"\"Work autonomously using the available\n            tools.\"\
    \"\"),\n            MessagesPlaceholder(variable_name=\"messages\"),\n       \
    \     MessagesPlaceholder(variable_name=\"agent_scratchpad\"),\n        ]\n  \
    \  )\n    agent = create_openai_functions_agent(llm, tools, prompt)\n    executor\
    \ = AgentExecutor(\n        agent=agent,\n        tools=tools,\n        return_intermediate_steps=True,\n\
    \        handle_parsing_errors=True,\n        verbose=False,\n    )\n    return\
    \ executor\n```\n\nWhen I ran the code, the agent produced a correct description\
    \ of the demo dataset, an accurate analysis of the patterns and trends, as well\
    \ as a bar chart and a summary of its insights. In addition, with the provided\
    \ code, you can inspect the intermediate tool steps, for example:\n\n```\n(AgentActionMessageLog(tool='python_repl',\
    \ tool_input={'code': \"import pandas\nas pd\\n\\ndf = pd.read_csv('demo.csv')\\\
    n\\ndf.describe()\"})\n```\n\nor\n\n```\nAgentActionMessageLog(tool='python_repl',\
    \ tool_input={'code': 'df.describe()'})\n```\n\nThis example illustrates how CoT\
    \ enables the agent to make its reasoning process visible and verifiable. If you\
    \ use the code from this example, you basically force the agent to externalize\
    \ its intermediate steps, and with that you not only gain confidence in the results\
    \ but also create a transparent audit trail of how conclusions are reached.\n\n\
    ## Generating a Tree of Possibilities\n\nNow think of a scenario where you have\
    \ a more complex task, but you don’t want to use a reasoning model or a full multi-agent\
    \ architecture. Still, a more exploratory and strategic approach is needed. In\
    \ such cases, you can use *tree of thoughts prompting* (ToT) ^([2](#ch02.html_id53)).\
    \ ToT expands CoT reasoning into a branching search process, where multiple reasoning\
    \ paths are explored and evaluated before deciding on the best next step.\n\n\
    In the code examples ([Example 2-3](#ch02.html_thought_generation) - [Example 2-5](#ch02.html_ToTGraph)),\
    \ I’ll show you how to implement ToT. The key idea is to let a smaller, single\
    \ AI agent generate multiple potential paths (a “tree”), have another agent evaluate\
    \ and select the best one, and then execute that chosen path with yet another\
    \ model. The simplified ToT method offers a pragmatic middle ground between a\
    \ simple ReAct loop (see [“How to Make Your Agent Take Action and Reflect”](#ch02.html_React_section))\
    \ and the full computational complexity of more tree-search-based algorithms,\
    \ which I will cover in the next chapter.\n\n# ToT as an engineering shortcut\n\
    \nA lightweight ToT setup where a smaller model proposes branches and a stronger\
    \ model evaluates can sometimes replace the need for a full multi-agent architecture.\
    \ This simplifies design and saves both money and time by avoiding repeated calls\
    \ to large reasoning models when a smaller setup already provides reliable results.\n\
    \nYou begin by creating a “tree” of possibilities. The `propose_options` node\
    \ in [Example 2-3](#ch02.html_thought_generation) is the first step. Instead of\
    \ producing a single, linear output, it uses a smaller LLM to generate three distinct\
    \ approaches for a blog post. These three options represent branching paths, or\
    \ “thoughts,” that the agent can explore. This is the core principle of ToT: moving\
    \ beyond a single-chain process toward multi-path exploration.\n\n##### Example\
    \ 2-3. Thought Generation\n\n```\ndef propose_options(state: BlogState) -> BlogState:\n\
    \    \"\"\"Generator (small): propose 3 creative approaches (ToT-style branching).\"\
    \"\"\n    proposer = gen_llm.with_structured_output(OptionsPayload)\n    prompt\
    \ = (\n        \"Generate exactly 3 distinct approaches for a developer-focused\
    \ blog on:\\n\"\n        f\"{state['topic']}\\n\\nFor each option, provide: title,\
    \ audience, angle, \"\n        \"a 5-bullet outline, and a concise rationale.\"\
    \n    )\n    payload: OptionsPayload = proposer.invoke(prompt)\n    state[\"options_json\"\
    ] = payload.model_dump_json()\n    state[\"messages\"].append(AIMessage(content=state[\"\
    options_json\"]))\n    return state\n```"

    \ {text}\"\n    return f\"{role}: {text}\"\n```\n\n[![1](assets/1.png)](#ch01.html_co_from_llms_to_agents__the_foundational_blueprint_CO10-1)\n\
    \n: \n\nInclude tool name or function call info when available.\n\n[Example 1-8](#ch01.html_print_state_snapshot)\

    ![2](img/#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO23-2)


    流式传输来自群体（swarm）的结果，展示了实际运行中由交接驱动的工作流。


    此次运行生成了三个简洁的要点，并附有引用，引用了瑞士官方监管机构页面和可信的金融来源。然而，如果撰写者发现证据过于单薄，它可以触发一次返回到研究（research）的交接。整个周期只需大约
    30 秒即可收集信息并生成最终的结构化输出。


    本节中的监督者（supervisor）、层级（hierarchical）和群体（swarm）架构展示了不同的协调策略如何影响多智能体系统（MAS）。监督者提供集中控制，层级允许可扩展地组织为团队的团队，群体则强调灵活的同伴间协作。表
    2-4 对这些模式进行了比较，并重点说明了每种模式的适用场景。


    表 2-4. 模式总结：多智能体协调策略


    | 架构 | 适用场景 | 优势 | 权衡 |

    | --- | --- | --- | --- |

    | 监督者 | 任务边界清晰的小型智能体团队 | 设置简单；控制力强；避免死锁 | 集中式瓶颈；单点故障 |

    | 层级 | 需要可扩展性的较大型、多团队工作流 | 模块化；可扩展；反映组织结构 | 调试较困难；需要精心设计 |

    | 群体 | 同伴之间的动态协作（例如，研究 ↔︎ 撰写者） | 灵活；自然的来回交互流程 | 可预测性较低；需要稳健的交接设计 |


    这表明每种协调模式都支持不同规模和风格的智能体协作。通过混合搭配它们，你可以在整体 MAS 设计中塑造出兼顾控制力、可扩展性和适应性的智能体工作流。


    # 结论


    本章的重要启示是：AI 智能体的智能不仅来自其所使用的 LLM，也来自其架构。正因如此，你探索了架构模式如何塑造 AI 智能体的智能和可靠性。通过超越单步执行，你看到了
    CoT、ToT 和 ReAct 等推理循环如何将结构嵌入智能体的思维过程，使输出更加深思熟虑和透明。


    同样重要的是，你看到了人在回路（human-in-the-loop）如何让智能体更加安全。中断、审批门控和审查步骤展示了护栏（guardrails）如何使智能体在错误会带来实际后果的真实场景中值得信赖。自主性与监督之间的平衡是现代智能体设计的一个核心主题。


    你还学习了这些推理方法如何扩展到 MAS 中。监督者和层级架构将任务分配给专门的工作者，而群体设置则支持同伴之间灵活交接。总而言之，这些范式表明，智能体的智能不只是关于更强的模型，更在于如何将这些模型编排成能够规划、行动和反思的系统。


    有了这些基础，你就可以进入更高的层次。在下一章中，你将探索高级范式，这些范式将这些架构延伸至可扩展执行、更深入的规划策略以及更复杂的推理方法。这将向你展示如何设计这样的智能体：它们不仅能反应和反思，还能进行大规模规划，并在更大的系统中协调复杂工作流。


    ^(1) Jason Wei 等人. “思维链提示可引发大型语言模型中的推理”, [*https://arxiv.org/abs/2201.11903*](https://arxiv.org/abs/2201.11903)
    (2023).


    ^(2) Shunyu Yao 等人. “思维树：利用大型语言模型进行深思熟虑的问题求解.”, [*https://arxiv.org/abs/2305.10601*](https://arxiv.org/abs/2305.10601)
    (2023).


    # 关于作者


    **Nicole Koenigstein**是深科技公司的创始人、首席执行官兼联合首席 AI 官，该公司专注于大型语言模型（LLM）系统和复杂多智能体架构。她是
    LLM 和智能体架构领域全球公认的思想领袖，尤其关注其在量化金融中的变革性应用。Nicole 曾担任欧盟委员会在 LLM 研究资助方面的外部专家，以及国际证监会组织（IOSCO）的外部专家，就受监管行业中生成式
    AI（GenAI）的采用提供建议。她还是 QuantMinds International 和 QuantStrats 的顾问委员会成员，这两场会议均属于全球规模最大、最具影响力的金融科技、人工智能和量化策略会议。在过去两年半中，Nicole
    已在全球发表了超过 50 场受邀演讲、主题演讲和技术研讨会，包括在牛津大学、康奈尔大学、美国银行、摩根大通和国际金融学院，以及诸如 European Women
    in Technology、ACM Tech Talk 和 ODSC Europe 等国际活动上。


    Nicole 是纽约人工智能金融研究所（Artificial Intelligence in Finance Institute）的教员，负责教授关于`Python`、机器学习、深度学习、大语言模型和智能体
    AI（agentic AI）的编程课程。她是*机器学习数学*和*Transformers 实战*（Manning Publications）的作者，她的新书*Transformers：权威指南*将由
    O’Reilly Media 出版。



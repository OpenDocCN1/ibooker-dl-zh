    \ Example 1-6. Compile with in-memory checkpoints and configure a thread\n\n```\n\
    checkpointer = MemorySaver() \napp = graph.compile(checkpointer=checkpointer)\
    \ \n\ncfg = {\"configurable\": {\"thread_id\": \"nyc-weather-session\"}} \n```\n\
    \n[![1](assets/1.png)](#ch01.html_co_from_llms_to_agents__the_foundational_blueprint_CO9-1)\n\
    \n: \n\nLightweight, per-thread checkpointing that persists state across turns.\n\
    \n[![2](assets/2.png)](#ch01.html_co_from_llms_to_agents__the_foundational_blueprint_CO9-2)\n\
    \n: \n\nProduces a runnable app that knows how to save and load state.\n\n[![3](assets/3.png)](#ch01.html_co_from_llms_to_agents__the_foundational_blueprint_CO9-3)\n\
    \n: \n\nA thread id identifies one conversation branch. New ids create new branches.\n\
    \nOnce you have a runnable app and checkpoints in place, the next step is to make\
    \ its execution observable. You want to see what the graph is doing, which messages\
    \ are flowing, and how tool outputs attach. [Example 1-7](#ch01.html_inspectState)\
    \ introduces a compact helper that formats messages into a single readable line,\
    \ making it easier to follow traces without overwhelming logs.\n\n##### Example\
    \ 1-7. Trace execution and inspect state and memory\n\n```\ndef _short(msg: BaseMessage,\
    \ max_len: int = 140) -> str:\n    \"\"\"Compact one-line view of a message.\"\
    \"\"\n    role = type(msg).__name__.replace(\"Message\", \"\").lower()\n    content\
    \ = getattr(msg, \"content\", \"\")\n    if isinstance(content, list):\n     \
    \   # some tool outputs can be list payloads\n        try:\n            content\
    \ = json.dumps(content)\n        except Exception:\n            content = str(content)\n\
    \    text = str(content).replace(\"\\n\", \" \").strip()\n    if len(text) > max_len:\n\
    \        text = text[: max_len - 3] + \"...\"\n    if hasattr(msg, \"tool_calls\"\
    ) and getattr(msg, \"tool_calls\"): \n        tnames = [tc.get(\"name\", \"tool\"\

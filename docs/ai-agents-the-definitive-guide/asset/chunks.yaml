- raw: "Sometimes an agent’s behavior can be entertaining. It might call the wrong\
    \ tool, loop endlessly, or produce an oddly creative response. In those moments\
    \ you might laugh and say to yourself addressing the AI agent: “You’re joking,\
    \ right?” But when the same unpredictability reaches into access control, financial\
    \ operations, or customer data, it’s no longer a joke. An action taken at the\
    \ wrong moment or on the wrong system can have serious consequences. This is why\
    \ *human-in-the-loop* (HITL) exists. HITL allows the agent to pause at critical\
    \ points, ask for your approval, and continue only once it’s safe to proceed.\n\
    \nHITL is not only about catching errors before they happen. It also provides\
    \ accountability and transparency. By inserting checkpoints into an agent’s workflow,\
    \ you make sure irreversible actions are reviewed, decisions are traceable, and\
    \ sensitive operations stay under human control. Far from slowing the system down,\
    \ this oversight makes agents more trustworthy and easier to adopt in production\
    \ settings.\n\n## Designing Human-in-the-Loop Workflows\n\nThere are a couple\
    \ of different interruptions that you can perform with a HITL workflow. The most\
    \ common ones are shown below.\n\nApprove or reject\n\n: \n\nPause the graph before\
    \ a critical step, such as an API call, to review and approve the action. If the\
    \ action is rejected, you can prevent the graph from executing the step, and potentially\
    \ take an alternative action. This pattern often involve routing the graph based\
    \ on the human’s input.\n\nReview and edit\n\n: \n\nPause the graph to review\
    \ and edit the graph state. This is useful for correcting mistakes or updating\
    \ the state with additional information.\n\nReview tool calls\n\n: \n\nIf a tool\
    \ call could affect external systems, inspect its arguments before execution.\
    \ For example, you might confirm booking details before a travel reservation is\
    \ made.\n\nValidate human input\n\n: \n\nExplicitly request human input at a particular\
    \ step in the graph. This is useful for collecting additional information or context\
    \ to inform the agent’s decision-making process or for supporting multi-turn conversations.\n\
    \nLangGraph offers an [extensive documentation](https://langchain-ai.github.io/langgraph/how-tos/human_in_the_loop/add-human-in-the-loop/)\
    \ on how to apply these patterns in your own applications. In addition, the [book’s\
    \ repository](https://github.com/Nicolepcx/ai-agents-the-definitive-guide) includes\
    \ complete, runnable examples of six different patterns. You can select among\
    \ them through a `main()` function, as shown in [Example 2-12](#ch02.html_main_choice).\n\
    \n##### Example 2-12. Main function for HITL pattern demos\n\n```\ndef main():\n\
    \    menu = \"\"\"\nPick a demo\n1. Human feedback loop for writing\n2. Approval\
    \ gate before API call\n3. Review and edit state\n4. Parallel interrupts with\
    \ resume map\n5. Tool call review in a tiny ReAct loop\n6. Static interrupts for\
    \ debugging\nq. Quit\n> \"\"\"\n```\n\nIn the following code examples ([Example 2-13](#ch02.html_b_propose)\
    \ - [Example 2-20](#ch02.html_wait_for_interrupt_and_prompt)) I’ll explain how\
    \ to implement the patterns covered above and also cover the main points you’d\
    \ want to watch out for when you implement them.\n\n# Command in LangGraph\n\n\
    Combines control flow (edges) and state updates (nodes). It facilitates multi-actor\
    \ (or multi-agent) communication. For example, a node can update its state and\
    \ decide the next node to visit. LangGraph enables this by returning a Command\
    \ object from node functions.\n\nUse approve or reject when you want to gate a\
    \ side-effecting step like an HTTP call.\n\n[Example 2-13](#ch02.html_b_propose)\
    \ asks the LLM to produce a request plan and stores it in `proposed_request`.\n\
    \n##### Example 2-13. Propose request with LLM\n\n```\ndef b_propose(state: BState)\
    \ -> BState:\n    prompt = \"Return only JSON with keys url and params for GET\
    \ to\n              https://httpbin.org/get using q and limit.\"\n    text = LLM.invoke(prompt).content\
    \ \n    m = re.search(r\"\\{.*\\}\", text, re.S)\n    data = {\"url\": \"https://httpbin.org/get\"\
    , \"params\":\n           {\"q\": \"fallback\", \"limit\": 1}} \n    if m:\n \
    \       try:\n            data = json.loads(m.group(0)) \n        except Exception:\n\
    \            pass\n    return {\"proposed_request\": data} \n```\n\n[![1](assets/1.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO7-1)\n\
    \n: \n\nAsk the LLM to generate a structured plan.\n\n[![2](assets/2.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO7-2)\n\
    \n: \n\nFallback default request if parsing fails.\n\n[![3](assets/3.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO7-3)\n\
    \n: \n\nTry to parse JSON out of the model’s output.\n\n[![4](assets/4.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO7-4)\n\
    \n: \n\nStore result in state under proposed\\_request.\n\n[Example 2-14](#ch02.html_b_gate)\
    \ calls interrupt(…​) to pause and request human approval or a revision.\n\n#####\
    \ Example 2-14. Approval gate for request\n\n```\ndef b_gate(state: BState) ->\
    \ Command[Literal[\"b_call\", \"b_propose\"]]:\n    v = interrupt({ \n       \
    \ \"question\": \"Approve or revise request\",\n        \"proposed_request\":\
    \ state[\"proposed_request\"], \n        \"schema\": {\n            \"type\":\
    \ \"object\",\n            \"properties\": {\n                \"action\": {\"\
    enum\": [\"approve\", \"revise\"]}, \n                \"update\": {\"type\": \"\
    object\"}\n            },\n            \"required\": [\"action\"]\n        }\n\
    \    })\n    action = v.get(\"action\")\n    if action == \"approve\":\n     \
    \   return Command(goto=\"b_call\", update={\"decision\": \"approved\"}) \n  \
    \  upd = v.get(\"update\") or {}\n    new_req = state[\"proposed_request\"].copy()\n\
    \    if \"url\" in upd:\n        new_req[\"url\"] = upd[\"url\"]\n    if isinstance(upd.get(\"\
    params\"), dict):\n        new_req.setdefault(\"params\", {}).update(upd[\"params\"\
    ])\n    return Command(goto=\"b_gate\", update={\"proposed_request\": new_req,\n\
    \    \"decision\": \"revised\"}) \n```\n\n[![1](assets/1.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO8-1)\n\
    \n: \n\nPause execution and wait for human decision.\n\n[![2](assets/2.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO8-2)\n\
    \n: \n\nPresent the proposed request for inspection.\n\n[![3](assets/3.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO8-3)\n\
    \n: \n\nEnforce structured approval/revision schema.\n\n[![4](assets/4.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO8-4)\n\
    \n: \n\nOn approval, route to the call step.\n\n[![5](assets/5.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO8-5)\n\
    \n: \n\nOn revision, loop back to the gate with updated request.\n\nOn `resume`\
    \ you pass `Command(resume={\"action\": \"approve\"})` to continue, or `{\"action\"\
    : \"revise\", \"update\": {...}}` to merge edits and loop back to the gate.\n\n\
    [Example 2-15](#ch02.html_b_call) runs the HTTP call only after approval and stores\
    \ `api_result`. You can reject to prevent execution, and routing depends on human\
    \ input.\n\n##### Example 2-15. Execute approved HTTP call\n\n```\ndef b_call(state:\
    \ BState) -> BState:\n    import requests\n    r = requests.get(state[\"proposed_request\"\
    ][\"url\"],\n    params=state[\"proposed_request\"][\"params\"], timeout=10) \n\
    \    return {\"api_result\": {\"status_code\": r.status_code, \"url\": r.url}}\
    \ \n```\n\n[![1](assets/1.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO9-1)\n\
    \n: \n\nRun the external request only after approval.\n\n[![2](assets/2.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO9-2)\n\
    \n: \n\nStore result under `api_result` in state.\n\nYou use review and edit to\
    \ correct or improve model output by writing directly to the state. Here, [Example 2-16](#ch02.html_c_write)\
    \ generates a short summary with the LLM and stores it in `summary`."

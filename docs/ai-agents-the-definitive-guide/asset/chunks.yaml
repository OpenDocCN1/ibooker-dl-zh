- raw: 'The agent adapts at runtime, but only within the framework you design. It
    helps to see this as a spectrum. At one end are routers that make a single decision
    from a fixed set of options. In the middle are tool-calling agents that support
    multi-step reasoning, reflection, and memory. At the far end are MAS, where specialized
    agents collaborate under a supervisor, distributing decision-making across roles.
    [Figure 1-4](#ch01.html_router_vs_autonomy) shows the spectrum of autonomy, from
    simple routing decisions to the idea of fully self-directed execution. In practice,
    nearly all real-world systems fall into the middle: they are agentic systems,
    not truly autonomous agents. Their autonomy is orchestrated rather than self-evolving,
    decisions happen within a framework of predefined states, transitions, and toolsets,
    even if the agent can adaptively choose among them at runtime.


    ![ch01 autonomy graphic](assets/ch01_autonomy_graphic.png)


    ###### Figure 1-4. In orchestrated autonomy, decision points are predefined in
    the workflow. In full autonomy, the LLM could generate new tools, actions, or
    decision paths to reach its goal.


    Agents can simulate flexibility within frameworks such as LangGraph using reflection,
    planning, and structured outputs. However, we do not yet have systems that can
    freely redefine their own architecture or reason about their goals in a robust,
    and general way.


    As you now understand, today’s agents are not deus ex machina solutions but carefully
    orchestrated systems that extend LLMs with structure, tools, and feedback loops.
    Their autonomy is bounded by design, which is precisely what makes them practical,
    safe, and deployable. While still limited, they are already impressive and capable
    of reasoning, acting, and adapting in ways that go far beyond static LLMs.


    # Conclusion


    In this chapter, you learned how LLMs evolve from static predictors into dynamic
    agents through the addition of state, control flow, and tool use. By embedding
    reasoning in a loop of action and feedback, LLMs gain the ability to adapt to
    results and extend their capabilities far beyond what is possible with prompt–response
    interactions alone.


    Finite and hierarchical state machines provided the conceptual foundation for
    agent design. FSMs let you structure workflows into recoverable steps, while HSMs
    reduced duplication and centralized policies for complex, multi-step tasks. These
    abstractions map directly to modern frameworks such as LangGraph, where state,
    nodes, and routing rules define how agents reason and act over time.


    You now can also place autonomy in a better context. You understand that today’s
    agents operate within well-bounded workflows, choosing among predefined paths,
    invoking tools, and reflecting on results, don’t redesign their own architecture.
    This orchestrated autonomy is not a weakness but a strength, since constraints
    make agents safe, predictable, and practical to deploy. The example of the AI
    Scientist v2 showed both the promise and the limitations of this approach, demonstrating
    how agents can already generate and test hypotheses but still require oversight
    to ensure rigor and depth.


    With this foundation in place, you are ready to move into the next chapter, where
    you’ll explore the architectures and patterns that bring planning, reactivity,
    reflection, and human–agent interaction to life.


    ^([1](#ch01.html_id47-marker)) Jason Wei et al. [“Chain-of-Thought Prompting Elicits
    Reasoning in Large Language Models.”](https://arxiv.org/abs/2201.11903), (2023).


    ^([2](#ch01.html_id48-marker)) Shunyu Yao et al. [“Tree of Thoughts: Deliberate
    Problem Solving with Large Language Models.”](https://arxiv.org/abs/2305.10601),
    (2023).


    ^([3](#ch01.html_id50-marker)) Yutaro Yamada et al. [“The AI Scientist-v2: Workshop-Level
    Automated Scientific Discovery via Agentic Tree Search.”](https://arxiv.org/abs/2504.08066),
    (2025).


    # Chapter 2. Architectures and Patterns: Planning, Reactivity, and Multi-Agent-Systems


    You know by now that AI agents are not magic. They are engineered systems whose
    power comes from the strategic configuration of their architecture. By combining
    reasoning loops, tools, stateful design, and adaptive control, LLMs can move beyond
    static prompts and evolve into MAS that plan, react, and reflect in real time.
    This chapter explores the architectures that make this possible, from structured
    reasoning methods such as chain of thought, tree of thought, and ReAct to architectural
    paradigms like supervisor and hierarchical agents. Along the way you will gain
    a deeper understanding of reasoning flows and see how human-in-the-loop mechanisms
    including approval gates, corrections, and interruptions keep these systems reliable,
    aligned, and secure.


    The importance of an agent’s architecture becomes obvious when you compare how
    a simple single-step agent handles a task versus how a multi-step agent does.
    A single-step agent receives the request, plans everything internally, executes
    in one go, and returns the result without ever revisiting intermediate steps.
    A multi-step agent, in contrast, alternates between reasoning and action in an
    iterative loop, adapting its plan based on partial results or new observations
    as it works. This flexibility is what allows agents to refine outputs dynamically
    and cope with uncertainty or feedback from their environment. The contrast is
    illustrated in [Figure 2-1](#ch02.html_single_vs_multi_step), with [Table 2-1](#ch02.html_single_vs_multi_step_table)
    showing how each approach unfolds step by step on the same task.


    Table 2-1. Example: Single-step vs. Multi-step (ReAct) execution for the task
    “Summarize the document and create a bar chart of key statistics”


    | Step || Single-step agent || Multi-step (ReAct) agent |


    | --- | --- | --- |


    | 1 || Reads the request once || Reads the request and forms an initial thought
    on the first action (extract statistics) |


    | --- | --- | --- |


    | 2 || Plans the entire sequence internally || Action: execute extraction; observation:
    store extracted data in memory |


    | 3 || Generates summary and chart in a single pass || Thought: plan next action
    to generate the summary from extracted data |


    | 4 || Returns outputs without revisiting intermediate results || Action: generate
    summary; Observation: store output in memory |


    | 5 || No mid-execution adjustments || Thought: plan final action to create the
    bar chart; action: create chart; observation: review output |


    | 6 || — || If intermediate results are incomplete, repeat the loop until satisfied,
    then return final outputs |


    While the table shows the difference step by step, [Figure 2-1](#ch02.html_single_vs_multi_step)
    illustrates the overall workflows side by side. The single-step agent follows
    a linear pipeline from prompt to result, whereas the multi-step agent embeds reasoning,
    actions, and memory into an iterative loop that continues until the problem is
    solved or the computational budget is exhausted.


    ![ch01 single vs multi step](assets/ch01_single_vs_multi_step.png)


    ###### Figure 2-1. Single-step (left) versus ReAct (right) agent workflows.


    # Structured Reasoning and Action


    Giving agents distinct personas, sometimes called anthropomorphizing, can sharpen
    their reasoning and make their contributions more focused. A planner agent framed
    as a methodical strategist will approach problems differently than a critic agent
    framed as an evaluator. When each agent is given a clear role and mindset, their
    reasoning chains tend to be more coherent and their interactions in MAS more purposeful.
    This alignment improves collaboration, since each agent knows what kind of knowledge
    it’s expected to contribute.


    Yet defining a role is only half the picture. To make agents more effective you
    might also need to shape how the agent thinks. This is where structured reasoning
    methods such as chain of thought, tree of thought and ReAct come into play.


    ## Letting Your AI Agents Think Out Loud'

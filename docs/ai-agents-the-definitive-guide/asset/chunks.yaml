    [![2](assets/2.png)](#ch02.html_co_architectures_and_patterns__planning__reactivity__and_multi_agent_systems_CO23-2)


    Streams the results from the swarm, showing the handoff-driven workflow in action.


    The run produces three clean bullet points with references, citing official Swiss
    regulator pages and trusted financial sources. However, if the writer finds the
    evidence too thin, it can trigger a return handoff to research. The full cycle
    takes just about 30 seconds to gather the information and generate the final structured
    output.


    The supervisor, hierarchical, and swarm architectures from this section show how
    different coordination strategies affect MAS. Supervisors provide centralized
    control, hierarchies allow scalable organization into teams of teams, and swarms
    emphasize flexible peer-to-peer collaboration. [Table 2-4](#ch02.html_pattern_summary_coordination)
    compares these patterns and highlights when to use each one.


    Table 2-4. Pattern summary: Multi-agent coordination strategies


    | Architecture | When to Use | Benefits | Tradeoffs |

    | --- | --- | --- | --- |

    | Supervisor | Small teams of agents with clear task boundaries | Simple setup;
    strong control; avoids deadlocks | Central bottleneck; single point of failure
    |

    | Hierarchical | Larger, multi-team workflows requiring scalability | Modular;
    scalable; mirrors organizational structures | Harder to debug; requires careful
    design |

    | Swarm | Dynamic collaboration between peers (e.g., research ↔︎ writer) | Flexible;
    natural back-and-forth flow | Less predictable; requires robust handoff design
    |


    This shows how each coordination pattern supports different scales and styles
    of agent collaboration. By mixing and matching them, you can shape agent workflows
    that balance control, scalability, and adaptability within your overall MAS design.


    # Conclusion


    The big takeaway from this chapter is that an AI agent’s intelligence comes also
    from its architecture, not just from the LLM it uses. In light of this, you explored
    how architectural patterns shape the intelligence and reliability of AI agents.
    By moving beyond single-step execution, you saw how reasoning loops like CoT,
    ToT, and ReAct embed structure into the agent’s thought process, making outputs
    more deliberate and transparent.


    Equally important, you saw how human-in-the-loop can make your agents more secure.
    Interrupts, approval gates, and review steps demonstrated how guardrails make
    agents trustworthy in real-world settings where errors carry real consequences.
    The balance between autonomy and oversight is a defining theme of modern agent
    design.


    You also learned how these reasoning methods extend into MAS. Supervisor and hierarchical
    architectures distribute tasks across specialized workers, while swarm setups
    enable flexible handoffs between peers. Together, these paradigms show that agent
    intelligence is not just about stronger models, but about how those models are
    orchestrated into systems that can plan, act, and reflect.


    With these foundations in place, you are ready to move to the next level. In the
    following chapter, you will explore advanced paradigms that extend these architectures
    toward scalable execution, deeper planning strategies, and more sophisticated
    reasoning methods. This will show you how to design agents that can not only react
    and reflect, but also plan at scale and coordinate complex workflows across larger
    systems.


    ^([1](#ch02.html_id52-marker)) Jason Wei et al. “Chain-of-Thought Prompting Elicits
    Reasoning in Large Language Models”, [*https://arxiv.org/abs/2201.11903*](https://arxiv.org/abs/2201.11903)
    (2023).


    ^([2](#ch02.html_id53-marker)) Shunyu Yao et al. "Tree of Thoughts: Deliberate
    Problem Solving with Large Language Models.", [*https://arxiv.org/abs/2305.10601*](https://arxiv.org/abs/2305.10601)
    (2023).


    # About the Author


    **Nicole Koenigstein** is the Founder, CEO, and Co-Chief AI Officer of a deep-tech
    company specializing in large language model (LLM) systems and complex multiagent
    architectures. She is a globally recognized thought leader in LLMs and agentic
    architectures, with a particular focus on their transformative applications in
    quantitative finance. Nicole has served as an external expert for the European
    Commission on LLM research funding and for the International Organization of Securities
    Commissions (IOSCO), advising on GenAI adoption in regulated industries. She also
    serves as an advisory board member for QuantMinds International and QuantStrats,
    two of the world’s largest and most influential fintech, AI and quant strategy
    conferences. Over the past 2.5 years, Nicole has delivered more than 50 invited
    talks, keynotes, and technical workshops globally—including at Oxford University,
    Cornell University, Bank of America, J.P. Morgan, and the International Faculty
    of Finance—as well as at international events such as European Women in Technology,
    ACM Tech Talk, and ODSC Europe.


    Nicole is a faculty member at the Artificial Intelligence in Finance Institute
    in New York, where she teaches coding sessions on `Python`, machine learning,
    deep learning, large language models and agentic AI. She is the author of *Math
    for Machine Learning* and *Transformers in Action* (Manning Publications), and
    her forthcoming title *Transformers: The Definitive Guide* will be published by
    O’Reilly Media.


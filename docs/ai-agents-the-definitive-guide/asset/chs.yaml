  \ (2023).\n\n# 关于作者\n\n**Nicole Koenigstein**是深科技公司的创始人、首席执行官兼联合首席 AI 官，该公司专注于大型语言模型（LLM）系统和复杂多智能体架构。她是\
  \ LLM 和智能体架构领域全球公认的思想领袖，尤其关注其在量化金融中的变革性应用。Nicole 曾担任欧盟委员会在 LLM 研究资助方面的外部专家，以及国际证监会组织（IOSCO）的外部专家，就受监管行业中生成式\
  \ AI（GenAI）的采用提供建议。她还是 QuantMinds International 和 QuantStrats 的顾问委员会成员，这两场会议均属于全球规模最大、最具影响力的金融科技、人工智能和量化策略会议。在过去两年半中，Nicole\
  \ 已在全球发表了超过 50 场受邀演讲、主题演讲和技术研讨会，包括在牛津大学、康奈尔大学、美国银行、摩根大通和国际金融学院，以及诸如 European Women\
  \ in Technology、ACM Tech Talk 和 ODSC Europe 等国际活动上。\n\nNicole 是纽约人工智能金融研究所（Artificial\

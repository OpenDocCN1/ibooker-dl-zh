  md: '*Model discovery and search*


    Search and retrieve models based on metadata such as architecture, hyperpara‐


    meters, training datasets, and performance metrics. Supports filtering with range


    queries (e.g., accuracy > 0.95).


    *Version control*


    Track multiple versions of both models and training datasets. Model versioning


    enables comparison of different model iterations and rollback if necessary, while


    dataset versioning ensures reproducibility by tracking which data version was


    used for training and evaluation.


    *Lifecycle management*


    Manage model stages such as experimentation, staging, production, and retire‐


    ment. This feature is especially critical as part of continuous development


    workflows.


    *Access control*


    Provide fine-grained permissions for model visibility and usage, ensuring secure


    collaboration across teams.


    *Auditing and compliance*


    Maintain a record of model usage, approvals, and changes to ensure regulatory


    compliance and reproducibility.


    *Data pipelines*


    Integrate into CI/CD workflows, automating tasks like model validation, artifact


    packaging, and production rollout.


    To provide a clearer understanding of how these features are implemented in real-


    world tools, we will examine four prominent model registries: Hugging Face Model


    Hub, MLflow Model Registry, Kubeflow Model Registry, and OCI Registries.


    **Hugging Face Model Hub**


    The Hugging Face Model Hub is the canonical platform for discovering and sharing


    open source machine learning models, including LLMs. As of early 2026, it hosts
    over


    two million models in general and more than 310,000 LLMs specifically, all publicly


    available. Much like GitHub serves as the primary hub for open source software


    development, Hugging Face has established itself as the leading platform for open


    source ML models.


    Each model entry in the catalog is accompanied by a *Model Card*. A Model Card


    provides a standardized summary of a machine learning model’s key characteristics,


    including its intended use case, training datasets, performance benchmarks, and
    lim‐


    itations. It often contains links to the datasets used for training, evaluation
    metrics,


    and licensing information. Users can also try out models interactively using the



  md: '**Lessons Learned**


    In this chapter we explored how to architect complete AI-driven applications on


    Kubernetes, from chat interfaces to event-driven backends, RAG pipelines, and


    agentic workflows.


    Application architectures fall into two dominant patterns with different operational


    characteristics. Interactive chat-style apps run synchronous request paths where


    latency matters most, requiring pre-warmed LLMs, lean orchestrators, and minimal


    round trips. Backend event-driven services run asynchronously within microservice


    meshes, where idempotency, buffering, and eventual consistency matter more than


    raw response time. Batch jobs, continuous control loops, and tool-driven automa‐


    tions sit alongside these cores, shifting nonurgent work off the hot path for
    cost


    efficiency.


    RAG works best when ingestion and query-time pipelines maintain consistency and


    observability. Use one embedding model for both phases, choose chunking strategies


    that match your content, and store provenance for confident citation and filtering.


    Vector databases belong in StatefulSets with snapshot and restore plans, while
    inges‐


    tion runs as jobs or CronJobs that avoid starving user traffic. Rerankers can
    boost


    precision for high-stakes queries but should remain optional to trade cost for
    quality


    per route.


    Agentic workflows add explicit control loops around models and make tools first-


    class citizens. Human-in-the-loop approval gates for risky actions are essential,


    not afterthoughts. Capture rationale and artifacts, make every step auditable,
    and


    improve portability by using standards like MCP.


    With these patterns and boundaries in hand, we are ready to go deeper into the
    how.


    In the next chapter we turn these high-level designs into production guidance
    and


    show how to stand up agentic applications on Kubernetes, as well as dive into
    trickier


    challenges like securing MCP and A2A communications.



    The custom trainer function must be self contained, so the import must be part


    of the body. This example is based on Hugging Face libraries: `datasets` for the


    training dataset (and optionally the evaluation dataset), `transformers` for the


    tokenizer, and `trl` for the actual trainer class. Note that there is no Kubeflow


    Trainer-specific code here; the function is a plain Python train function that
    can


    be directly invoked.


    The tokenizer is related to the model that is fine-tuned. It is important to use


    a fast tokenizer that works concurrently to avoid the slowdown of the training


    process.


    The dataset contains the new knowledge that the model should learn during the


    fine-tuning. It can be a publicly available dataset, but most likely it will be
    a


    custom one.


    The initialization of the SFTTrainer is equivalent to the previous example. This


    is where you select the model, specify the datasets, and configure the PEFT


    technique (e.g., LoraConfig).


    The `train()` method initializes the training process. Hardware configurations,


    such as the number of GPUs and workers, are not specified here; instead, you


    define them when creating the job (see Example 6-6).


    When you call `client.train(func=my\_custom\_trainer)`, the SDK


    serializes your Python function and embeds it into the TrainJob


    custom resource. The TrainingRuntime’s base container image


    (preinstalled with PyTorch, Transformers, PEFT) deserializes and


    executes your function at runtime. This differs from traditional


    Kubernetes workflows: you never build or push custom images—


    just rerun the SDK command when you modify your function.


    The trade-off is that the base image must already contain all your


    dependencies, and your function must be serializable (imports


    must reference installed packages, no complex closures).



    *Figure 8-7. RAG document ingestion*


    In detail, the steps are:


    *Collect and parse documents*


    First, gather the source data you want to make available to the LLM. These could


    be text files, PDFs, database records, web pages, or transcripts, and you will


    parse each document into plain text. Often this step involves custom code or


    libraries to extract text from various formats. One such tool is Docling, an open


    source document-parsing framework designed for AI workflows that ingests


    heterogeneous sources such as PDFs, Word files, HTML, or scanned images and


    turns them into structured, machine-readable text while preserving metadata like


    headings or page numbers. For RAG ingestion, a consistent structured output


    reduces the complexity of preprocessing.


    *Chunk and preprocess*


    It is rarely ideal to embed entire documents as one piece because they may be


    long or cover multiple topics. Instead, documents are usually broken into chunks


    of a manageable size so each chunk is topically coherent and can fit within the


    LLM’s prompt along with the question. You might split by paragraphs or head‐


    ings, or use more advanced strategies such as semantic or sentence-boundary


    chunking to avoid breaking context mid-thought. If you use Docling, you can



  md: '1 Ian Goodfellow et al., “Generative Adversarial Nets,” *Advances in Neural
    Information Processing Systems* 27


    (NIPS 2014), 2014, pp. 2672-2680.


    2 Ashish Vaswani et al., “Attention Is All You Need,” *Advances in Neural Information

  md: 'In summary, MLflow is primarily focused on the data science side of the ML
    lifecycle,


    providing a rich feature set for tracking data science experiments. Its biggest
    advan‐


    tage is that it is very accessible and can be easily installed on local machines.


    While MLflow can be deployed on Kubernetes, its integration remains limited. For
    more


    Kubernetes-native solutions, alternatives like Kubeflow extend the concept of
    a model


    registry with deeper Kubernetes integration and additional observability features.


    **Kubeflow**** Model Registry**


    Kubeflow is a Kubernetes-native platform designed to simplify the entire machine


    learning lifecycle, including model training, serving, and model registry manage‐


    ment. Initially developed by Google, Kubeflow is now an open source project under


    CNCF and consists of these loosely connected components:


    *Kubeflow** Dashboard*


    A central dashboard and hub that connect the authenticated web interfaces of


    Kubeflow and other ecosystem components.


    *Kubeflow** Notebooks*


    Component for running web-based development environments like Jupyter


    Notebooks inside your Kubernetes cluster by running them inside pods. No local


    installation is needed.


    *Kubeflow** Pipelines*


    Kubeflow Pipelines (KFP) is a platform for building and deploying portable and


    scalable machine learning workflows using Kubernetes.


    *Kubeflow** Trainer*


    Kubeflow Trainer is a unified interface for model training and fine-tuning on


    Kubernetes. It runs scalable and distributed training jobs for popular frameworks


    like PyTorch or TensorFlow.


    *Kubeflow** Katib*


    Katib is a Kubernetes-native project for automated machine learning (AutoML)


    with support for hyperparameter tuning, early stopping, and neural architecture


    search.


    *Model serving*


    KServe (previously KFServing) solves production model serving on Kubernetes.


    It started in Kubeflow but has been moved to a separate CNCF project. We cover


    KServe in detail in “KServe” on page 20.


    *Model Registry*


    Index and catalog for ML models. The registry is the central hub within the


    Kubeflow ecosystem. The rest of this section will focus on this registry.


    **54 **



- pgno: 31
  md: '![](img/3a93443ca88ca3c8ef163f48ebd612bc_31_0.png)


    Most managed LLM services like OpenAI ChatGPT have a token-


    based pricing model. You can buy a certain number of tokens,


    usually one million, for a fixed cost.


    Now that we know the difference between *word* and *token*, we can


    better understand why these services use tokens instead of words: a


    token is a unit of processing for an LLM, while a word is not.


    This process has a side effect: it makes it harder for the end user


    to estimate the cost of a request. The general rule of thumb is to


    consider four characters in English as one token, but this is just an


    average estimation. The tokenizer is model-specific, so it is possible


    that the same input is split into a different number of tokens using


    different models.


    Finally, both input and output tokens are used to calculate the total


    cost of a request, making it impossible to estimate costs in advance.


    We cannot predict the number of tokens the model will produce;


    we can only set the maximum number of generated tokens with a


    parameter.


    **The Two Phases of Inference**


    From a high-level perspective, the end-to-end inference pipeline has two steps:
    *prefill*


    and *decode*. The prefill phase *tokenizes* the input, applies *embedding*, and
    generates


    the first token. After that, the decode phase generates the tokens one by one
    and


    computes the output text (Figure I-3).


    ![](img/3a93443ca88ca3c8ef163f48ebd612bc_31_1.png)


    *Figure I-3. LLM processing steps*


    The two phases use the model in the same way to produce a token, but while the


    prefill input processing is done in parallel, the decoding phase produces one
    token


    at a time. This makes the prefill workload *compute-bound*, while the decode phase
    is


    *memory-bound*.


    The compute-bound and memory-bound terms refer to the computational complex‐


    ity of a particular program or algorithm. An algorithm is compute-bound when


    the time to complete the task is driven mainly by the speed of the processing
    unit


    **xxx **


    **| **


    **Introduction**'

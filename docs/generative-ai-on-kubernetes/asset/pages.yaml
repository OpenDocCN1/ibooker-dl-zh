  md: 'HGX H100 and H200 systems use 4 NVSwitch 3.0 chips to interconnect 8 GPUs,


    while the GB200 NVL72 rack-scale system connects 72 GPUs across multiple servers


    using NVLink Switch with 144 ports and 130 TBps of total GPU bandwidth.


    The key distinction: NVLink provides the physical interconnect links, while


    NVSwitch provides the switching infrastructure to scale these connections across


    many GPUs. For cross-node communication in multiserver clusters, systems com‐


    bine NVLink/NVSwitch for intra-node communication with InfiniBand or RoCE


    networks for inter-node traffic. GPUDirect RDMA technology bridges these layers,


    enabling direct GPU-to-GPU data transfers across network boundaries without CPU


    involvement.


    These technologies come with significant cost considerations. Deployments involving


    NVSwitch-based systems can reach multimillion-dollar price points and require
    sub‐


    stantial power and cooling infrastructure. However, for training LLMs and running


    inference on models exceeding single-GPU memory capacity, the bandwidth and


    low-latency characteristics of NVLink and NVSwitch are often essential to achieve


    acceptable performance.


    **Tensor parallelism**


    Tensor parallelism slices the computations within each layer across multiple GPUs,
    as


    illustrated in Figure 3-3. In this scheme, each GPU holds a shard of the layer’s
    weights


    (for example, splitting a large weight matrix by columns or rows) and processes


    a portion of the layer’s input. GPUs then exchange partial results to construct
    the


    full output of the layer. For instance, if a fully connected layer has a weight
    matrix


    that is too large for one GPU, it can be divided into multiple slices. Each GPU


    performs matrix multiplication of the input by its weight slice. The partial outputs
    are


    concatenated or summed to form the complete output. This approach keeps all GPUs


    busy on the same layer (improving per-token latency) and effectively multiplies
    the


    available memory bandwidth by using several GPUs in parallel.


    ![](img/3a93443ca88ca3c8ef163f48ebd612bc_144_0.png)


    *Figure 3-3. Tensor parallelism*


    Tensor parallelism directly reduces the memory burden per GPU, allowing extremely


    large models to load. For example, splitting a 70B-parameter model across 2 to
    4


    GPUs means that each holds only 35B to 17.5B params.



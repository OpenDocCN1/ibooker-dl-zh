  md: '**Kueue**


    The Kueue project operates at a higher abstraction layer than scheduler plug-ins,


    providing job-level admission control that decides whether the cluster should
    admit


    workloads based on available quota and queue priority. When Kueue admits a job,
    it


    ensures that all required resources exist and complements low-level gang scheduling


    mechanisms that guarantee atomic scheduling.


    The biggest value of Kueue is the ability to handle multitenant resource manage‐


    ment: it implements hierarchical resource quotas, priority-based queuing, resource


    borrowing between teams, and fairness policies that prevent any single tenant
    from


    monopolizing cluster resources. A platform administrator should consider Kueue


    when managing shared training clusters across multiple teams, as it provides a
    policy


    layer (who gets resources and when) that enables a more generic GPU as a Service


    use case, covered in “Quota Management and Multitenancy: GPU as a Service” on


    page 229.


    Finally, Kueue integrates seamlessly with Kubeflow Trainer, RayJob, and other
    AI


    projects, making it a natural choice to implement training job orchestration.
    The


    end-to-end flow with Kueue includes different personas: the platform administrator


    configures global rules in ClusterQueue and creates the LocalQueue that the Data


    Scientist can use to access the assigned quota and provision the workload (see
    Fig‐


    ure 7-2).


    When you submit a job with Kueue integration (using the `kueue.x-k8s.io/queue-`


    `name` label), Kueue automatically creates a custom resource of type Workload
    to


    manage admission control. This Workload object is separate from your actual job


    (TrainJob, Job, etc.) and tracks the resource requirements and admission status.


    To check the status after submission:


    1\. Check the Workload object: `kubectl get workloads -n <namespace>` shows


    1.


    whether your job is admitted or queued.


    2\. Check the actual job: `kubectl get trainjob <name> -n <namespace>` shows


    2.


    the job status, but it will remain suspended until Kueue admits it.


    3\. Understand the flow: job submitted → Kueue creates Workload → Workload


    3.


    queued → quota available → Workload admitted → job unsuspended → pods


    created.



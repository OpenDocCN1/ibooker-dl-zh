    Using Kubeflow Trainer Operator simplifies the tracking of the whole job, moni‐


    toring the status of worker pods, replica counts, and updating status conditions


    like Created, Running, Succeeded, or Failed. Each job is formed by multiple pods


    that produce traditional metrics that can be exported to Prometheus, and the



- pgno: 203
  md: '*Example 5-6. LLM hallucination (OpenAI ChatGPT)*


    `"What is the world record for crossing the English channel entirely on foot?"`


    `"This world record was made on August 14, 2020, by Christof Wandratsch of Germany,`


    `who completed it in 14 hours and 51 minutes."`


    Unfortunately, no generic evaluation metric can judge if an LLM is hallucinating.


    However, there are many benchmarks that can be used to assess the overall quality
    of


    a model based on defined capabilities, such as its ability to reason. It is critical
    to do


    this before adopting a model that we don’t know or when we tune an existing model.


    One of the most-used suites to perform this task is a Language Model Evaluation


    Harness.


    Pre-deployment benchmarks are useful to select a model, but what about ongoing


    quality evaluation when the model is running in production? This is where *LLM-as-*


    *a-judge* techniques come into play: one LLM evaluates another LLM’s outputs for


    quality dimensions like relevance, coherence, factuality, and safety. This approach


    scales better than human evaluation and captures more nuanced quality issues than


    simple rule-based checks. For example, a powerful model like GPT-4 or a specialized


    judge model can assess whether responses are helpful, accurate, and appropriate.


    Essentially, it acts as an automated quality reviewer.


    From an operational perspective in Kubernetes, implementing LLM-as-a-judge


    requires careful consideration of cost and latency trade-offs. We don’t want to


    evaluate every single response synchronously because that would add latency to


    user requests and increase inference costs significantly. Instead, production
    systems


    typically evaluate a sampled subset (for example, from 1% to 10% of responses)
    in


    an asynchronous pipeline that doesn’t block user-facing requests. The judge model


    produces quality scores that can be exported as Prometheus metrics, enabling the


    same monitoring and alerting patterns we’ve discussed earlier in this chapter:
    you


    can track quality trends over time, alert on degradation, and correlate quality
    metrics


    with infrastructure changes or traffic patterns.


    Frameworks like OpenAI Evals, LangSmith, and Arize AI provide structured


    approaches for LLM evaluation, although many teams implement custom solutions


    tailored to their specific quality requirements. The important part is to treat
    quality


    metrics as first-class observability signals alongside latency and throughput:
    store


    evaluation results in your existing observability stack (Prometheus for metrics,
    log‐


    ging systems for detailed results), and establish quality SLOs just as you would
    for


    infrastructure metrics.


    When the LLM is deployed, it is possible to compute some metric to mitigate the


    hallucination risk for some specific tasks; for example, in case of a summarization
    we


    expect the output mainly to contain text existing in the input. In this case there
    is a



- pgno: 311
  md: '**Retrieval-Augmented Generation**


    Retrieval-augmented generation (RAG) is a design pattern that grounds an LLM’s


    output in external data by fetching relevant information at inference time and
    includ‐


    ing it in the prompt. Instead of relying solely on the model’s fixed training
    data,


    we give the model an “open book” during question answering. The result is fewer


    hallucinations and answers that reflect the latest, domain-specific knowledge,
    even


    when the base model’s training data is stale. We introduced RAG briefly in Chapter
    6


    as an alternative to model customization; here we dive deeper into its implementation


    on Kubernetes.


    It helps to contrast RAG with fine-tuning, which we covered in Chapter 6. Fine-


    tuning teaches new information to a model by updating its weights and is ideal
    for


    style, tone, or stable domain patterns you want embedded in the model. However,


    fine-tuning is resource-intensive and slow, and you must repeat it whenever you
    have


    new data. RAG sidesteps retraining by injecting knowledge at query time. You update


    a vector database with new documents, and the next user query can immediately


    retrieve and use that information. This makes RAG flexible for dynamic knowledge


    bases or rapidly changing content, and this is a big reason why it is popular
    in


    enterprises.


    RAG and model tuning are complementary rather than mutually exclusive. If you


    have core knowledge that rarely changes, a smaller fine-tuned model can bake


    in those basics and reduce prompt size. Meanwhile, RAG supplies current or user-


    specific data that falls outside the model’s built-in knowledge. As seen in Chapter
    5,


    large context windows have memory and latency costs, so minimizing prompt size


    is beneficial. In practice, many teams combine both: bake long-lived knowledge
    into


    a tuned model, and use RAG for dynamic or user-specific facts. By offloading static


    knowledge into the model via tuning and pulling in only relevant facts via RAG,
    you


    balance accuracy and efficiency.


    The key is that RAG works with any base model, whether original or fine-tuned,


    because it operates purely through the prompt interface. All prompt-based tech‐


    niques such as RAG or tool usage are compatible with a fine-tuned model as the
    LLM


    backend.


    RAG has two distinct phases, as illustrated in Figure 8-6. Ingestion prepares
    knowl‐


    edge for retrieval:


    *Document ingestion*


    Prepares domain documents by parsing, chunking, embedding, and storing them


    in a vector database, as described in “Document Ingestion” on page 278.


    **274 **



- pgno: 207
  md: 'Beyond hallucinations, there are other safety risks to address. Toxic or inappropriate


    content can emerge either from model outputs or malicious user inputs. The defini‐


    tion of inappropriate is broad, ranging from off-topic questions to returning
    private


    or sensitive information (PII or Personal Identifiable Information). Most well-known


    open source models have already been fine-tuned to encourage friendly and noncon‐


    descending text generation. However, an attacker can craft specific prompts to
    bypass


    the model’s built-in safety mechanisms.


    These attacks are called *prompt jailbreaking*, when the prompt is trying to make
    the


    model produce something against the terms and conditions, and *prompt injection*
    is


    when the user is trying to inject specific instructions in the prompt to bypass
    the


    instructions configured by the developer. To produce a similar attack is very
    simple,


    you add an instruction like “ignore all previous instructions” to try to confuse
    the


    model bypassing system prompts.


    **Runtime Guardrails**


    Fortunately, it is possible to protect a model by implementing *guardrails*: preproces‐


    sors and postprocessors for user input and model output that validate the data
    to


    ensure the model remains on track. At their core, guardrails consist of an input


    validation function that analyzes text (or other modalities) and determines whether
    it


    meets safety criteria, followed by an action: allowing the request to proceed,
    blocking


    it, or modifying it.


    The processing logic to analyze arbitrary text and decide if it is inappropriate
    is not


    trivial. Other LLMs can be used for this purpose.


    Some models have been tuned specifically to detect similar problems. They are


    flexible and allow specifying which risk types to detect. Two families of models
    in this


    category are *Llama Guard* and *Granite Guardian*: both are available on Hugging
    Face


    with different sizes and configurations so that you can select the one that fits
    your


    use case. Currently, the biggest model is about 7B or 8B, which corresponds to
    about


    15–20 GB of data. These models can be deployed like any other LLM with KServe
    and


    vLLM, as we already learned in “vLLM” on page 8.


    The configuration of the validation to perform is done in the prompt itself; see


    Example 5-7 as reference. The same approach can be applied to validate the output
    of


    the model.


    **170 **


    **| **


    **Chapter 5: Model Observability**'

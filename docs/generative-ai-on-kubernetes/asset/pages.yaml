  md: '*Example 7-1. Scheduler **configuration** for bin packing*


    `**apiVersion**``:`` ``kubescheduler.config.k8s.io/v1`


    `**kind**``:`` ``KubeSchedulerConfiguration`


    `**profiles**``:`


    `\-`` ``**schedulerName**``:`` ``binpack-scheduler`` `


    ` ``**pluginConfig**``:`


    ` ``\-`` ``**name**``:`` ``NodeResourcesFit`


    ` ``**args**``:`


    ` ``**scoringStrategy**``:`


    ` ``**type**``:`` ``MostAllocated`` `


    ` ``**resources**``:`


    ` ``\-`` ``**name**``:`` ``nvidia.com/gpu`


    ` ``**weight**``:`` ``5`` `


    ` ``\-`` ``**name**``:`` ``cpu`


    ` ``**weight**``:`` ``1`


    ` ``\-`` ``**name**``:`` ``memory`


    ` ``**weight**``:`` ``1`


    Custom scheduler name that training jobs reference to use bin packing behavior.


    The MostAllocated strategy scores nodes higher when they have more resources


    already allocated, favoring consolidation.


    Higher weight (5) for GPU resources prioritizes GPU bin packing over CPU and


    memory, reflecting the higher cost and scarcity of GPU resources.


    Platform administrators must balance bin packing’s cost efficiency against reduced


    availability because a single node failure will affect more training jobs, and
    resource


    contention can create CPU, memory, or network bottlenecks even when GPU


    resources are available. Bin packing particularly suits cost-sensitive batch training


    workloads that tolerate interruptions through checkpoint and resume workflows,


    while production training platforms often use multiple scheduler profiles to offer


    both bin packing for experimental jobs and spreading for critical workloads requiring


    resilience.


    **Dynamic Scheduling with Descheduler**


    The bin packing strategy described earlier optimizes initial pod placement, but
    over


    time these optimizations degrade as workloads terminate and new jobs arrive at


    different rates across nodes. The Kubernetes descheduler, available as a separate


    installation, addresses this dynamic optimization challenge by continuously evaluat‐


    ing pod placement and evicting pods from suboptimally placed locations so the


    scheduler can reschedule them according to current cluster state and policies.
    Unlike


    the scheduler, which reacts to new pod creation events, the descheduler proactively


    identifies existing pods that violate placement policies or contribute to resource



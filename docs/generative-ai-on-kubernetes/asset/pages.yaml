- pgno: 206
  md: '**Model Safety: Hallucination and Guardrails**


    As the final topic in this chapter on observability, we will cover the model safety
    area,


    which is likely evolving the fastest in the LLM monitoring space, with expectations


    for significant developments and disruption. Model safety addresses two critical


    challenges in LLM deployment: hallucinations, where models generate plausible


    but incorrect information, and toxic or inappropriate content, where models may


    produce harmful responses or be manipulated through prompt injection attacks.


    These risks require both detection mechanisms and protective measures, known as


    *guardrails*, to ensure models behave safely and reliably in production environments.


    **Understanding and Detecting Hallucinations**


    LLMs are prone to hallucinations, a scenario we’ve all encountered at some point


    in our journey with generative AI, often initially believing an answer was correct.


    This happens because LLMs provide clear and well-motivated answers even when


    hallucinating:


    *What are hallucinations?*


    Hallucinations are generally inconsistencies that can occur at different levels:


    within the generated text itself (“Daniele is tall, thus he is the shortest person”),


    between the input prompt and the generated answer (“Generate formal text to


    announce to colleagues…” but the model produces “Yo Boyz!”), or they can be


    factually incorrect (“First man on the Moon in 2024”). See Example 5-6 for a


    real-world example.


    *Why do hallucinations happen?*


    LLMs are black boxes that can hallucinate, which happens for different reasons:


    • Partial or inconsistent training data so the LLM learns how to generalize


    •


    from data that is not comprehensive


    • Using a configuration that is “hallucination prone” with sampling parameters


    •


    (like temperature, top\_k, top\_p) that influence the model to produce less


    probable (but more creative) answers


    • The quality of the context or prompt that we are providing where we might


    •


    provide a question that is too generic


    Analyzing the three different causes reveals fundamental issues: most teams


    don’t train LLMs and thus cannot address partial or incorrect training data.


    While model configuration can limit creativity, one of the goals of LLMs is *to*


    *be creative*; therefore, the area with the most control is making the input more


    specific.


    **Model Safety: Hallucination and Guardrails **


    **| **



- pgno: 78
  md: '**ONNX**


    The Open Neural Network Exchange (ONNX), codeveloped by Microsoft and Face‐


    book in 2017, was designed as a framework-independent format for representing


    machine learning models. ONNX aims to standardize how models are shared


    between tools, allowing developers to train a model in one framework and deploy


    it in another without requiring framework-specific conversions.


    ONNX models are stored in a single *.onnx* file using Protocol Buffers (Protobuf)


    for compactness and platform neutrality. Each file contains three main components.


    First, the computational graph defines the network’s structure and data flow.
    Second,


    the learned parameters include weights and biases. Third, metadata describes input/


    output specifications, operator sets, and versioning details. This structure makes


    ONNX a promising example of a self-contained format, as it combines architecture,


    weights, and operational metadata in a single artifact.


    However, ONNX falls short for LLMs because it lacks essential components such


    as tokenizers, vocabulary data, and preprocessing logic. For tasks like natural
    lan‐


    guage generation, this missing information makes supplying additional files along‐


    side the *.onnx* model necessary. Without these components, an ONNX model alone


    cannot transform raw text into tokenized inputs, limiting its suitability for
    modern


    LLM deployments. This gap prevents it from being fully self-contained in the context


    of language models.


    ONNX’s broad support across runtimes like ONNX Runtime, TensorRT, OpenVINO,


    and Triton Inference Server makes it highly portable, but compatibility depends


    on the set of operations (such as matrix multiplication, convolution, and attention


    mechanisms) that a model uses. Each runtime supports a defined operator set (`op`


    `set`), which specifies the available operations a model can use. If a model relies
    on


    operations outside a runtime’s supported set, it may fail to load unless extended


    with plug-ins or custom runtime extensions. This challenge further complicates
    its


    adoption for complex architectures like those used in LLMs, where tokenization
    and


    text preprocessing steps are integral parts of the model’s functionality.


    Despite these limitations, ONNX provides a conceptual blueprint for what a fully


    self-contained model format for LLMs could look like. If expanded with richer


    metadata and native support for tokenizer definitions, it could offer a more complete


    solution for the LLM use case. As of 2026, ONNX remains better suited for models


    in domains like computer vision, where preprocessing is often simpler and less
    tightly


    coupled with the model.


    Next, we’ll explore Safetensors, a format more commonly used for LLM deployment


    today, offering optimized weight handling and some degree of metadata inclusion.


    **Model Data Storage Formats **


    **| **



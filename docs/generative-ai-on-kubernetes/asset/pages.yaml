    The TrustyAI project provides multiple explainer implementations and can be


    natively used with KServe (see the documentation). For production use, Inference


    Logger captures each request and response pair from the model server. This allows


    you to generate local explanations (explanations for specific individual predictions)


    retroactively only when needed, such as when investigating disputed predictions,


    rather than computing expensive explanations for every request in real time.


    **Fairness**


    Fairness is another critical aspect of AI adoption: we don’t want models to discrimi‐


    nate against people, in particular underrepresented groups, and in general learn
    prej‐


    udice that might be in training data. Bias can enter models through underrepresented


    categories without explicit discrimination in the data, or through correlations
    that


    should not drive predictions; for example, people living in a poor area have higher


    loan rejection rates, but models should not automatically reject loan requests
    based


    on area. Overall, the concept of bias is usually tied to one or more features
    that the


    model named as *protected attributes*: for these features we expect the model
    to behave


    *fairly*, so we don’t expect the value of a protected attribute to drive prediction
    results.


    The most critical aspect of fairness is that, even when training data has been
    properly


    analyzed and the model has been trained without bias, it can still happen at runtime


    because of data drift. Training data might not be representative of the current
    human


    behavior, so the model processes similar data for the first time and a biased
    outcome


    might emerge.


    KServe and TrustyAI can help monitor this aspect in production while the model
    is


    running, producing bias metrics against one or more protected attributes. TrustyAI


    uses the Inference Logger to retrieve all prediction data and then compute and


    produce Prometheus metrics.


    You can find more information by checking this demo.



  md: 'Ambient agents are built on *Event-Driven Architecture* (EDA). They subscribe
    to


    queues, webhooks, file watchers, or scheduled triggers (like CronJobs); update
    their


    working context; decide whether to act; and then call tools. For example, a daily
    plan‐


    ning agent might run every morning at 2 a.m. to analyze yesterday’s activity,
    generate


    a plan for the day, and send the result via email or post it to a notification
    channel


    for humans to review. For sensitive operations they insert human-in-the-loop (HITL)


    checkpoints: the agent drafts a plan, routes it to an approver, and executes only
    after


    an explicit “go.” You can tune autonomy by policy—recommend only, approve to act,


    or auto for low risk—and you can bound variation with a determinism budget so


    replays and retries behave predictably. On the output side, every action should
    leave


    an evidence trail with inputs, decisions, and artifacts so operations remain auditable.


    **Human in the Loop**


    Human in the loop is a deliberate checkpoint where a person reviews an agent’s
    plan


    or outcome and explicitly authorizes the next step before the agent proceeds.
    You


    use it for high-risk or irreversible actions, when policy demands human oversight,
    or


    when signals are ambiguous and confidence is low. Typical examples include pushing


    a production hotfix, rolling back a config that could cause downtime, approving
    a


    large financial transaction, or sending a high-volume customer notification. Feedback


    can be gathered through chat and messaging systems like Slack or Teams, where


    the agent posts the proposed plan and waits for an *approve* or *reject* reply.
    A more


    decoupled pattern emits an approval request on a message bus with a correlation
    ID,


    then listens for the corresponding decision event, possibly emitted by an dedicated


    UI. For auditability, the agent should attach its rationale and diffs to the request,


    record the approver and decision, and post the final result after execution. This
    helps


    to keep autonomy where it is safe and moves judgment to humans where it matters


    most.


    For ambient agents, the platform concerns are the same as for any distributed
    system:


    service discovery, retries and backoffs, circuit breakers, idempotent handlers,
    and


    clear ownership of configuration and secrets.


    In practice, you will get the best results when ambient agents blend three disciplines:


    reliable event handling with idempotent actions, explicit human checkpoints for
    irre‐


    versible changes, and clear Kubernetes ownership boundaries for scaling and security.


    This keeps ambient agents predictable like any other microservice, while giving
    you


    the superpower of proactive operations at scale.



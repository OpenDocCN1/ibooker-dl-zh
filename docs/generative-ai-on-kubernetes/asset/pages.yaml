    **Security Guidelines for PyTorch**


    PyTorch Distributed is the most widely used framework for distributed deep learn‐


    ing, powering large-scale training workloads worldwide. PyTorch’s Distributed
    Data


    Parallel (DDP) replicates models across processes that synchronize gradients using


    collective communication backends. NCCL is used for GPU-to-GPU, and Gloo is


    used for CPU-based communication.


    PyTorch’s distributed features share Ray’s critical security limitation: the security
    pol‐


    icy explicitly states that distributed features are “intended for internal communication


    only” and are “not built for use in untrusted environments.” The framework provides


    no built-in authorization, sends messages unencrypted by default, and accepts
    con‐


    nections from any network source. Anyone with network access can execute arbitrary


    code with full privileges. Unlike Ray, PyTorch distributed does not provide built-in


    TLS encryption, making network-level isolation the only effective security control.


    Securing PyTorch distributed training in Kubernetes requires implementing Net‐


    workPolicies that create network isolation boundaries aligned with the framework’s


    security assumptions. Platform administrators should leverage label selectors
    to scope


    NetworkPolicies, for example, using a label like `pytorch-job-name=my-training-job`


    to select the pods of the job, thus allowing intra-job communication while blocking


    external traffic. A well-designed policy should follow the same pattern of the
    exam‐


    ple provided for Ray, denying all ingress traffic by default, then explicitly
    allowing


    only required communication: pod-to-pod within the same PyTorchJob (NCCL uses


    dynamic port ranges requiring all TCP traffic between job pods), and ingress from


    the Kubeflow Trainer’s namespace to the rank-0 worker.



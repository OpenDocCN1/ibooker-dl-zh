    Understanding how Kueue’s ResourceFlavor selection interacts with priority classes
    is


    essential for configuring effective quota policies (see the following sidebar).


    **Kueue Priority Classes and ResourceFlavor**


    Kueue evaluates ResourceFlavors in the order they appear in the ClusterQueue’s


    `flavors` list:


    *1\. First attempt*


    Try the first flavor listed (in the previous example, `gpu-nvlink-infiniband`).
    If


    sufficient GPUs are available in the nominal quota, admit the workload to this


    flavor.


    *2\. Automatic fallback*


    If the first flavor’s quota is exhausted, Kueue automatically tries the next flavor
    in


    the list (e.g., `gpu-standard-ethernet`).


    *3\. Borrowing behavior*


    The `flavorFungibility.whenCanBorrow` setting controls what happens when


    borrowing from the cohort is possible but the nominal quota is exhausted:


    `MayStopSearch`* (default)*


    If borrowing is feasible in the current flavor, use it (stop searching for other


    flavors).


    `TryNextFlavor`


    Even if borrowing is possible in the current flavor, continue evaluating the


    next flavor to prefer nominal quota over borrowed resources.


    *4\. Node selector injection*


    Once Kueue selects a flavor, it injects the flavor’s nodeLabels as node selectors,


    ensuring that pods schedule only on topology-appropriate nodes.



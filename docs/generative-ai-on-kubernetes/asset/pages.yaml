- pgno: 175
  md: '**Optimize Model Loading**


    Run:ai Model Streamer is a fast, highly concurrent implementation of the loading


    procedure that loads the tensors; it supports different file formats, including
    safetensor,


    and different storage options. CoreWeaver’s Tensorizer and fastsafetensor both
    require


    the model to be prepared with a specific serialization format that is then used
    to load


    the model faster. In general, the configuration and the usage in vLLM is similar
    for


    both Tensorizer and Model Streamer (see Example 4-5), while fastsafetensor requires


    setting some additional environment variables. Tensorizer and Model Streamer have


    larger adoption, compared to fastsafetensor, which is designed specifically to
    optimize


    loading from NVMe devices. Given that Model Streamer doesn’t require repackaging


    the model, it is the easiest option to experiment with. However, given that this
    chapter


    is about production optimization, it makes sense to consider the other two options
    too


    and pick the one that better fits your specific setup.


    *Example 4-5. vLLM usage of Run:ai Model Streamer*


    `vllm`` ``serve`` ``**\\**`


    ` ``\--port``\=``8080`` ``**\\**`


    ` ``\--model``\=``/mnt/models`` ``**\\**`


    ` ``\--served-model-name``\=``meta-llama/Meta-Llama-3-8B`` ``**\\**`


    ` ``\--load-format`` ``runai\_streamer`` ``**\\ **`` `


    ` ``\--model-loader-extra-config`` ``''{"concurrency":16}''`` `


    The value `runai\_streamer` as the value for the `load-format` parameter doesn’t


    require a different serialized format, but it enables the Model Streamer code.


    Using `tensorizer` as a value enables the Tensorizer loader, but this also requires


    having the model saved with the Tensorizer serializer.


    This configuration enables 16 concurrent threads that will load the model in


    parallel. The other available options can be found in the Model Streamer envi‐


    ronment variables documentation.


    *5\. Warming up the inference engine*


    Once weights are resident in GPU memory, the runtime pre-allocates the KV


    cache memory pool and performs some profiling operations. GPU kernels are


    specialized functions that execute mathematical operations on the GPU; launch‐


    ing thousands of them individually creates a CPU bottleneck during inference.


    To eliminate this overhead, the runtime captures kernel launches into reusable


    sequences known as CUDA (NVIDIA) or HIP (AMD) graphs. This “warmup”


    phase is essential for high-throughput serving but adds to the total time-to-ready.


    Recent efforts focus on caching graph artifacts and leveraging GPU snapshots to


    bypass repetitive initialization. See the vLLM documentation on CUDA Graphs


    for details.


    **138 **


    **| **



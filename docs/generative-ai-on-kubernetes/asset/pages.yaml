    within a cluster. Organizations don’t expose these registries outside the cluster.
    The


    registries primarily manage model metadata rather than storing the actual model


    weights or artifacts. Instead, they reference external object stores like AWS
    S3 buckets


    where the actual model data resides. This separation of metadata and model storage


    ensures greater flexibility in managing large models while keeping metadata easily


    accessible within the cluster.


    By providing a structured and secure interface for managing models and their meta‐


    data, model registries become a critical tool for operationalizing machine learning
    at



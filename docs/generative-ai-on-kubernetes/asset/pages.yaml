    though it would require additional elements like tokenizer definitions to be truly


    complete. In the following sections, we will explore ONNX, Safetensors, and GGUF/


    GGML in more detail.


    **The Quest for True Model Portability**


    The following three sections dive into the technical details of specific model
    formats.


    While these details may seem tangential to Kubernetes operations, they address
    a


    fundamental operational concern: achieving clear separation between model data
    and


    runtime execution.


    The goal is to achieve true model portability, where models can be distributed
    and


    executed as self-contained artifacts, much like how Docker revolutionized the
    deploy‐


    ment of arbitrary software workloads across diverse environments. Reaching this


    level of portability would require broader standardization across both the model
    file


    structure and the runtimes capable of executing them. Ideally, a model stored
    in a


    standardized format could be loaded by any compliant runtime. This would eliminate


    manual adjustments for tokenization, quantization, or architecture specifics.
    Such a


    shift would empower a more diverse set of tools and frameworks, reducing lock-in


    to specific ecosystems while making model distribution as seamless as containerized


    applications.


    This separation is the holy grail that would let operators treat models as interchangeable


    artifacts, independent of the runtimes that execute them. We haven’t reached this


    ideal yet, but examining existing formats reveals how close we are to achieving
    true


    runtime-model independence. If you’re more interested in the practical aspects
    of


    model discovery and distribution rather than format internals, you can skip ahead
    to


    “Model Registry” on page 46, where we discuss model registries.



- pgno: 345
  md: '**ServiceAccounts as workload identity**


    A ServiceAccount in Kubernetes is a namespaced identity for pods. When you create


    a pod, Kubernetes assigns it a ServiceAccount—either one you specify explicitly
    or


    the default ServiceAccount in the pod’s namespace. This identity is not tied to
    a


    human user but rather to a workload, which makes it ideal for service-to-service


    authentication.


    Every ServiceAccount has an associated token that Kubernetes automatically mounts


    into the pod at `/var/run/secrets/kubernetes.io/serviceaccount/token`. This


    token is a signed JSON Web Token (JWT) that contains claims identifying the Serv‐


    iceAccount, including its name, namespace, and unique identifier. The Kubernetes


    API server signs these tokens with its own private key, and any component that
    trusts


    the API server can validate them.


    Once this ServiceAccount exists, you can assign it to a pod by setting the `service`


    `AccountName` field in the Pod `spec`. When that pod starts, Kubernetes injects
    the


    ServiceAccount token as a file and keeps it refreshed automatically.


    That token refresh is critical. ServiceAccount tokens are not static; Kubernetes
    rotates


    them periodically for security. Any code that reads the token must do so on every
    use


    rather than caching it in memory. Reading from the filesystem each time ensures
    you


    always have the current, valid token.


    ServiceAccount tokens can be used in two contexts: inside the cluster and, with
    extra


    setup, outside the cluster. Within the cluster, ServiceAccount tokens are first-class


    citizens that the Kubernetes API server natively understands. When a pod calls
    the


    Kubernetes API and includes its ServiceAccount token in the Authorization header,


    the API server validates the signature, extracts the identity, and checks RBAC
    policies


    to decide whether the request is allowed.


    ServiceAccount tokens can also be validated outside the cluster if the API server


    exposes an OIDC discovery endpoint. Most managed Kubernetes services like GKE,


    EKS, and AKS enable this by default. In this setup, the ServiceAccount token is
    a valid


    JWT that can be verified by any service with access to the cluster’s OIDC public
    keys.


    The trade-off is added complexity: you must configure the external service to
    trust


    your cluster’s OIDC issuer, retrieve the signing keys, and handle token validation


    logic. We cover external validation in more detail in “External validation via
    OIDC/


    JWT” on page 315.


    **Server identity versus agent identity**


    ServiceAccount delegation splits into two flows, depending on whose identity the


    upstream API sees. Both use ServiceAccount tokens, but they differ in which Service‐


    Account token reaches the upstream API.


    **308 **


    **| **



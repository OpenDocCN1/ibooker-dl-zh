    LoRA offers two main benefits: a cheaper training phase (in terms of time and


    hardware) compared to full fine-tuning, and an efficient inference approach. Since


    the base model is not modified, adapters can be composed with it at runtime. The


    combined size of the two small matrices (A and B) is typically only 1–10% of the

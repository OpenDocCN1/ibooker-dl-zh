- pgno: 37
  md: 'Part III covers both the customization techniques and the operational practices


    for managing tuning workloads on Kubernetes, with emphasis on job scheduling,


    resource optimization, and cost control.


    **AI-Driven Applications**


    An LLM inference service by itself is just a component. The real value emerges


    when you integrate it into complete applications that combine the LLM’s generation


    capabilities with your data, business logic, and existing systems. Part IV demonstrates


    how to build production-ready AI systems on Kubernetes, where the LLM is one


    piece in a larger microservices architecture.


    LLM inference services rarely run in isolation. Building production-ready AI systems


    requires understanding how to architect request flows, manage context retrieval
    and


    tool invocation, and maintain state across interactions. The key principle: keep
    the


    LLM focused on generation, while the application owns data access, side effects,
    and


    policy enforcement.


    This part explores the architectural patterns and operational challenges of AI-driven


    applications. Chat-facing applications orchestrate flows between conversational
    back‐


    ends, vector databases for context, and LLM services for generation. Retrieval-


    augmented generation (RAG) grounds LLM outputs in external knowledge bases,


    combining embeddings with real-time data retrieval to provide accurate, up-to-date


    information. Agentic workflows take this further, enabling multistep reasoning
    where


    the LLM decides which tools to call and how to coordinate actions, but this introdu‐


    ces nondeterminism, variable resource consumption, and emergent failure modes


    like reasoning loops and cost spirals that demand specialized guardrails.


    Operating agentic systems requires runtime controls beyond traditional microservice


    patterns: budget enforcement to cap token consumption, approval gates for sensitive


    operations, and iteration limits to prevent infinite loops. Standard protocols
    like the


    Model Context Protocol (MCP) and Agent-to-Agent (A2A) enable communication


    between agents and tools.


    Part IV covers both the architectural patterns and the production-hardening


    techniques for running AI-driven applications, with focus on security and state


    management.


    With this road map in place, let’s begin our journey with Part I, where we’ll
    tackle


    the most fundamental challenge: deploying and serving models for inference on


    Kubernetes.


    **xxxvi **


    **| **


    **Introduction**'

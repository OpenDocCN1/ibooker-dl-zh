    **Agentic Frameworks and Runtimes**


    Building an agentic workflow from scratch is challenging, so frameworks and run‐


    times simplify the job. Broadly, you will see client-side agentic libraries embedded
    in


    your code and server-side agentic runtimes exposed as services. We won’t go into
    too


    many details here as we focus on operating agentic systems on Kubernetes. However,


    it is important to understand how to classify the multitude of frameworks:


    *Client-side agentic frameworks*


    These libraries help you run the loop inside your own applications, giving you


    full control and easy debugging at the cost of managing orchestration. LangChain


    provides abstractions for prompts, memories, and tool use across Python and


    JavaScript, with a broad ecosystem for web search, databases, and REPLs. For


    Java applications, LangChain4j offers similar capabilities and has been integrated


    into Quarkus with native support for agentic workflows. LangGraph models


    agent steps as a graph, making branching and concurrent subtasks explicit and


    observable. CrewAI focuses on multiagent collaboration via role-based agents


    that message and delegate, which helps when specialization and parallelism pay


    off. CrewAI implements custom REST endpoints for agent communication, blur‐


    ring the line between client-side and server-side orchestration. Because these


    libraries live in your runtime, you own the loop that calls the LLM, executes


    tools, feeds results back, and decides when to stop, which maximizes control


    while increasing complexity. In production, even these “client-side” frameworks


    typically are used by the orchestrator in containerized microservices on Kuber‐


    netes, subject to the same packaging, scaling, and observability practices you
    use


    for your application workloads.


    *Server-side agentic runtimes*


    Bespoke backend services encapsulate the loop behind an API so a client sends


    one request and the backend performs multiturn reasoning and tool use. For


    example, OpenAI’s Responses API provides stateful multiturn interactions, inte‐


    grated tool usage, structured outputs, event streaming, and pause-and-resume


    for human-in-the-loop, so you do not have to write the orchestration loop


    yourself. (More about the Responses API in the next section.) The Responses


    API supports server-executed tools, including remote MCP tools, as well as


    client-executed function tools when you need to keep actions in your control


    plane. Llama Stack offers an open, self-hostable runtime with both an Agents API



- pgno: 56
  md: '**Model Server Controller**


    As we have seen in the manual deployment approach, deploying models to Kuber‐


    netes requires managing numerous resources: deployments, PersistentVolumeClaims,


    GPU configurations, tolerations, and model-specific parameters. Model server con‐


    trollers simplify this complexity by providing higher-level abstractions through
    Cus‐


    tom Resource Definitions (CRDs).


    Instead of manually crafting deployment manifests and coordinating multiple Kuber‐


    netes resources, controllers allow you to declare your intent at a higher level.
    The


    CRD approach also provides centralized status information, making it easier to
    moni‐


    tor the health and state of your model deployments. Figure 1-3 extends the previous


    model server architecture diagram to include the main controller components: one
    or


    more Kubernetes CustomResourceDefinition and a Kubernetes controller.


    ![](img/3a93443ca88ca3c8ef163f48ebd612bc_56_0.png)


    *Figure 1-3. Model server controller architecture*


    Each model server usually provides the container images so that you do not need


    to build them; at the same time, picking the right container image is not straight‐


    forward: each accelerator has different drivers and frameworks (e.g., NVIDIA with


    CUDA, AMD with ROCm, etc.), so it is necessary to pay attention to this aspect.
    This


    concern is similar to multiarchitecture containers, where you can easily select
    the


    architecture (e.g., ARM64 or i386) and get the appropriate container version.
    How‐


    ever, for accelerators, the process is still quite manual. For more on how Kubernetes


    manages GPU and accelerator access through device plug-ins, see Chapter 3.


    Let’s explore two popular model server controller approaches: KServe and Ray Serve.


    **Model Server Controller **


    **| **


    **19**'
  merge: -1
  img_proc: true
- pgno: 57
  md: '**KServe**


    KServe is a Cloud Native Computing Foundation (CNCF) project that provides


    a model inference platform on Kubernetes designed to manage the lifecycle and


    wiring of model servers and models leveraging Kubernetes components to provide


    scalability, routing, canary rollout, density packing, and in general the possibility
    to


    expose a model inference endpoint.


    The project was originally created as KfServing within the Kubeflow community


    and later became an independent project (though it remains part of the Kubeflow


    ecosystem). The initial target has been predictive AI and only more recently evolved


    to include generative AI.


    KServe is built as a Kubernetes native component extending Kubernetes API and


    providing multiple CustomResourceDefinitions to map the different concepts in
    a


    declarative way. We are not going to cover all of the API and concepts that KServe


    provides because most of them are still mainly applicable to predictive AI.


    From a technology stack perspective there are three different deployment modes:


    Knative, Standard, and ModelMesh (see Figure 1-4):


    *Knative*


    Knative is the most comprehensive stack, using Knative and Istio to manage


    autoscaling, rolling updates, traffic management, and composition (also via


    Knative Eventing). Using this mode, every model becomes a KnativeService.


    *Standard*


    Standard is the opposite of Knative, with no additional dependencies beyond


    what Kubernetes already provides. Using this mode, for every model, KServe cre‐


    ates a new deployment. KServe 0.16 introduces a new deployment approach via


    the LLMInferenceService CRD that is an evolution of the Standard deployment


    mode to manage advanced and scalable LLM deployments.


    *ModelMesh*


    The ModelMesh solution is specialized for high-density deployments where you


    need to deploy many models, potentially thousands, in the same cluster, and the


    footprint of using separate deployments is too large. In this mode the model


    server is dynamically loading and unloading models based on the requests.


    **20 **


    **| **



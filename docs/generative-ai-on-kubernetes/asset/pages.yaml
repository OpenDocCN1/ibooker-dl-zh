  md: 'Next, let’s look at how GPUs are enabled and advertised in Kubernetes, starting
    with


    the Kubernetes device plug-in framework.


    **Kubernetes GPU Device Plug-Ins**


    Once you’ve clearly identified and labeled GPU capabilities, the next step is
    to expose


    GPUs as schedulable and allocatable resources within Kubernetes. Kubernetes ach‐


    ieves this through its device plug-in framework, which allows external hardware
    to


    integrate seamlessly into the Kubernetes resource model.


    Kubernetes was designed from the ground up to be extensible. While CPUs and


    memory are natively supported, Kubernetes provides a standardized and extensible


    framework called device plug-ins for integrating specialized hardware resources
    such


    as GPUs, TPUs, and other accelerators.


    These plug-ins register with the Kubelet on each node and advertise device availabil‐


    ity and health status directly to Kubernetes, enabling resource-aware scheduling
    and


    workload isolation.


    The device plug-in interface supports a wide variety of specialized hardware,
    includ‐


    ing FPGAs, networking accelerators, storage controllers, cryptographic modules,


    multimedia processors, and robotics hardware. Importantly for generative AI, it
    also


    supports GPUs and other AI accelerators.


    The device plug-in mechanism operates through four core functions:


    *Device discovery*


    Plug-ins detect hardware devices on nodes and report their inventory to the


    Kubelet.


    *Resource allocation*


    When a workload requires specific hardware resources (e.g., GPUs), the device


    plug-in handles exclusive allocation. It sets up the runtime environment, exposes


    necessary device files, and injects environment variables.


    *Health monitoring*


    Plug-ins continuously monitor device health, ensuring Kubernetes is aware of


    unhealthy hardware to inform scheduling decisions.


    *Scheduler integration*


    Device plug-ins expose hardware as standard Kubernetes extended resources


    (e.g., `nvidia.com/gpu`). Pods request these resources explicitly in their resource


    declarations, ensuring accurate scheduling to nodes with available devices. For


    more about resource-based scheduling, see “Resource-Based Scheduling” on


    page 91.


    **86 **


    **| **


    **Chapter 3: Kubernetes and GPUs**'

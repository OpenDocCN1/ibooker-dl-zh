    cluster


    efficiency.


    The descheduler operates as a separate component (typically deployed as a Cron‐


    Job for periodic optimization or a deployment for continuous monitoring) that


    applies configurable strategy plug-ins, defined through a DeschedulerPolicy custom


    resource, to identify pods for eviction. When the descheduler evicts a pod, it
    sim‐


    ply deletes the pod. The pod’s controller (ReplicaSet, StatefulSet, or in the
    case of


    training jobs, the Kubeflow Trainer) immediately recreates the pod, and the schedu‐


    ler then places it according to current scheduling policies and cluster state.
    This


    eviction-and-reschedule cycle respects PodDisruptionBudgets (PDBs), ensuring that


    the descheduler never violates availability constraints or disrupts critical workloads


    beyond configured tolerances, making PDBs the primary mechanism for protecting


    gang-scheduled training jobs from premature eviction (Example 7-2).



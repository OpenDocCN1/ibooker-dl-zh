  md: 'There’s no copying step: the runtime reads model files directly from the mounted
    PVC.


    The storage initializer still runs but performs essentially a no-op for PVC URIs
    since the


    volume mount handles the data access.


    This direct mount approach distinguishes PVs from other storage methods. While


    S3 or Google Cloud Storage initializers download and copy data to an `emptyDir`


    volume, PVs eliminate the copy step entirely. The model container accesses files


    through the network filesystem as if they are local, though network latency affects


    read performance.


    Access performance differs significantly between node-local and network-backed
    stor‐


    age. Local access approaches—init-container copying, modelcars (see “Modelcars”


    on page 68), and OCI volumes (see “OCI Image Volume Mounts” on page 74)—


    deliver the fastest inference performance through direct node-local I/O. Network
    access


    through PVs introduces latency on every read operation, with performance depending


    on network bandwidth and storage backend capabilities. The fundamental trade-off


    balances storage efficiency against access speed.


    Parallel access scalability depends on multiple factors: backend storage performance,


    model size, inference throughput requirements, and available network bandwidth.


    PVs work well for typical GPU-based inference deployments (10–20 replicas), where


    GPU costs naturally limit scale. CPU-based inference might scale higher, and storage


    backend performance becomes the limiting factor. Warning signs include disk pres‐


    sure on the storage backend, increased I/O wait times, and inconsistent response


    latencies. Potential bottlenecks arise from network saturation, NFS server load
    limits,


    and concurrent read contention.


    The Kubernetes ecosystem recognizes “too many pods sharing one PVC” as a real


    problem class, though no canonical threshold exists. High-performance storage
    sys‐


    tems like Ceph or cloud-based services (AWS EFS, Azure Files) handle more concur‐


    rent load than basic NFS setups. For high-scale deployments or high-throughput


    inference requirements, consider node-local approaches like OCI volumes that we’ll


    discuss in “OCI Image for Storing Model Data” on page 65.


    PVs offer fast startup since mounting requires no data copying, just establishing
    the


    network mount. In scale-to-zero scenarios, every pod restart requires remounting


    over the network, and there’s no benefit from local caching across pod restarts.


    In “Lessons Learned” on page 76, we’ll compare PVs against other model data access


    methods to help you choose the right approach for your requirements.


    Beyond PersistentVolumes, OCI images offer another approach for transferring and


    storing model data. The following sections explore how to package models as OCI


    images and access them efficiently from LLM runtimes.



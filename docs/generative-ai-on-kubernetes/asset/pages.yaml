  md: '• Taints protect the GPU pool at cluster scope and pair naturally with the
    other


    •


    two techniques for fine placement.


    All three approaches share one limitation: they rely on static labels that administra‐


    tors either maintain manually or are added by discovery operators like the NFD
    and


    GFD that we described in “GPU Discovery” on page 82.


    While these label-based approaches offer fine-grained control, they require knowing


    and managing specific node labels. For simpler use cases where any available GPU


    will suffice, there is a more straightforward approach: resource-based scheduling.


    **Resource-Based Scheduling**


    The simplest way to schedule a GPU workload in Kubernetes is to declare the need


    for a GPU directly in the workload specification. As soon as the NVIDIA device


    plug-in is running on the nodes, it advertises every GPU as an extended resource—


    typically `nvidia.com/gpu`. A container that sets a limit as shown in Example
    3-7 asks


    the Kubernetes scheduler to find a node with at least one free GPU.


    *Example 3-7. Require one NVIDIA GPU*


    `**resources**``:`


    ` ``**limits**``:`


    ` ``**nvidia.com/gpu**``:`` ``1`


    The scheduler examines only the numeric availability from the device plug-in,
    then


    binds the pod to a qualifying node. The kubelet grants the container exclusive
    access


    to one of that node’s GPUs. There are no extra labels to manage, no node selectors


    to remember, and no additional controllers to install. The mechanism is completely


    integrated with the familiar `requests` and `limits` resource model, so it feels
    like


    asking for CPU or memory—just with a different resource name.


    That ease of use is its greatest strength. A single field in the pod spec is enough
    to


    isolate the GPU at the device-file level, prevent other pods from touching it,
    and let


    CUDA applications run without further configuration. Small clusters with one GPU


    type, or development environments where any GPU will do, rarely need more than


    this.


    The downside is the lack of precision. All GPUs appear identical to the scheduler,


    even if the cluster contains V100s, A100s, or consumer-grade cards. A model that
    fits


    comfortably on an 80-GB A100 might not fit on a 16-GB T4, yet a plain `nvidia.com/`


    `gpu: 1` request treats them the same. There is also no built-in way to request
    a


    specific compute capability, restrict pods to GPUs in Multi-Instance GPU mode,
    or


    ask for more than one GPU on a node with a particular interconnect topology.


    **GPU Workload Scheduling **



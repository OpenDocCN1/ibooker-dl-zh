- pgno: 34
  md: 'The usage of this lookup table to access memory blocks enables the sharing
    of the


    same KV cache across multiple generations. Parallel sampling techniques use the


    same prompt to generate multiple outputs, and the cache can speed up the overall


    process in this case. The end goal of projects like vLLM is to maximize the through‐


    put by serving multiple requests in parallel, with many other optimizations to
    achieve


    this (like continuous batching).


    The decode phase handles the generation of all tokens and more. In reality, each
    pass


    doesn’t produce a single token but a list of candidates, followed by a projection
    step to


    select the desired result.


    The sampling logic to select the next token is not trivial and is influenced by
    some


    parameters like *temperature*, *top-k*, and *top-p* to guide the level of “randomness”
    of


    the generation. If you want to learn more, we suggest the “Sampling Methods in
    Text


    Generation Unlocking Diversity and Creativity” blogpost.


    The *reverse embedder* is the final step before returning the token to the user.
    It uses


    the same lookup table that was used to convert a token to the embedding vector
    to do


    the opposite and return the textual representation of each token.


    Most of the work in the decode phase happens on the GPU. However, since it is


    memory-bound, it may not fully utilize the GPU’s processing power, spending much


    of the time moving KV cache data to and from GPU memory. This is a high-level


    description of how the inference pipeline works. There is much more to discuss,
    and


    the field is still evolving.


    Now that we have a basic understanding of how LLMs process text and generate


    responses, we can better appreciate the operational challenges they present on
    Kuber‐


    netes. Resource allocation during prefill, memory management during decode, and


    token-based optimization all stem from these fundamentals. These concepts will


    resurface throughout the book when we discuss metrics, optimization, and scaling


    strategies.


    With this foundation in place, let’s turn to the structure of the book itself.


    **Overview**


    As we discussed in “Challenges of Running Generative AI at Scale” on page xxiii,


    running generative AI on Kubernetes introduces a range of unique challenges that


    require innovative solutions. This book is organized into four parts, each addressing


    a critical phase of operationalizing LLMs on Kubernetes. The progression reflects


    how teams typically adopt AI: starting with inference, maturing toward production-


    grade operations, customizing models when needed, and finally building complete


    AI-driven applications.


    **Introduction **


    **| **


    **xxxiii**'

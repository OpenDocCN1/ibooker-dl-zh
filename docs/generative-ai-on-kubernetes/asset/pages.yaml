    before experimental jobs and can preempt them if necessary.


    Kueue’s fair-share algorithm considers the history of resource con‐


    sumption for each team and current queue depth, prioritizing


    teams that have consumed fewer resources recently or have been


    waiting longer for admission. It implements a queuing strategy


    that balances fairness (ensuring all teams get access) with effi‐


    ciency (preferring to admit larger jobs that can utilize resources


    effectively).


    The priority classes enable urgent production training jobs to


    preempt lower-priority experimental workloads, allowing organi‐


    zations to implement service-level agreements where certain teams



- pgno: 219
  md: '• The boundaries of the task to help reduce hallucinations or guide behavior
    (e.g.,


    •


    “You can only reply about our company and if you are sure about the answer”)


    Similar prompts are usually specified by the provider of the service and hidden
    to the


    end users as a *system prompt*.


    However, system prompts should not be relied upon as security controls—they can


    be bypassed through prompt injection or jailbreaking techniques. For production
    sys‐


    tems with security requirements, additional safeguards like input validation,
    output


    filtering, and content moderation should be implemented at the application level.


    Since every LLM is trained on a vast but finite dataset, another use of prompt


    engineering is to inject additional data into the prompt, forcing the model to
    use that


    information during generation.


    Basic or manual prompt engineering techniques have evolved into established pat‐


    terns that make the system more powerful, even enabling models to dynamically


    invoke tools to retrieve information or perform actions. This is a core principle
    of


    AI agents and is often called *context engineering*. The term reflects that the
    main


    engineering work lies in creating the input context for the LLM, a process involving


    complex, multicomponent, and iterative steps.


    One of the most widely adopted patterns for context enrichment is retrieval-


    augmented generation (RAG), which injects relevant data from external sources
    into


    the context based on the user’s question.


    With the RAG pattern, additional data is ingested as embedding vectors into a
    vector


    database using specialized embedding models. When a user request arrives, an initial


    query is performed against the vector database using similarity search algorithms


    (such as approximate nearest neighbors) to find content that is semantically *close*
    to


    the user’s input. This additional context is then included in the prompt for the
    model


    to use when answering the question.


    This solution helps to inject external or recent knowledge that wasn’t available
    during


    the model’s training, such as proprietary data or information published after
    the


    training cutoff date. While each model has a limited context window, RAG addresses


    this by filtering and including only the data most relevant to the user’s question
    rather


    than attempting to include an entire knowledge base.


    See Figure 6-2 for a high-level representation of a RAG pipeline. For a comprehen‐


    sive discussion of RAG implementation patterns and best practices, see “Retrieval-


    Augmented Generation” on page 274.


    If you need a refresher on embeddings, you can find the details in “Understanding


    LLM Fundamentals” on page xxv, in particular in the section on “Prefill” on page


    xxxi, although this background is not required to follow along here.


    **182 **


    **| **


    **Chapter 6: Model Customization**'

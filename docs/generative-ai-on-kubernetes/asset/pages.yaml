- pgno: 138
  md: 'The NVIDIA device plug-in can expose MIG partitions as schedulable resources
    in


    two ways:


    *Single MIG strategy*


    All MIG instances on a node are advertised under the generic `nvidia.com/gpu`


    resource (just like normal GPUs). This strategy assumes each GPU is identically


    partitioned. For instance, if every A100 on the node is split into seven 5-GB


    instances, a node with two A100s would report `nvidia.com/gpu: 14`. When a


    pod requests one GPU, it actually gets one MIG slice (5 GB). The node labels


    (`gpu.product`, `gpu.count`, etc.) are adjusted to reflect MIG (you’d see `gpu.prod`


    `uct = ...-MIG-1g.5gb` and `gpu.count = 14` in the example). This approach


    keeps things simple for users but requires homogeneous MIG setup on all GPUs.


    *Mixed MIG strategy*


    MIG instances are exposed as distinct resource types, named by their MIG pro‐


    file (e.g., `nvidia.com/mig-1g.5gb`, `nvidia.com/mig-4g.20gb`, etc.). In this
    mode,


    a node with an A100 might advertise several different resources if it has a mix


    of MIG sizes. A user can request a specific MIG size by using the corresponding


    resource name in the pod spec. For example, a pod could request `nvidia.com/`


    `mig-2g.10gb: 1` to get a roughly 10-GB MIG instance. This strategy is more


    flexible (GPUs in a node could be split differently or even remain whole), but
    it’s


    a bit more advanced to schedule since users need to know which MIG type to ask


    for.


    In both cases, the GPU Operator’s MIG manager will handle creating the MIG


    partitions on the GPU as specified by the `mig.strategy` in the ClusterPolicy
    (either


    `single` or `mixed`), as shown in Example 3-11. If MIG mode is off (`none` strategy),
    then


    GPUs are not partitioned at all.


    Unlike time slicing, MIG provides strong isolation. Each MIG instance has a fixed


    fraction of the GPU’s memory. It cannot use more than its allocation, which pre‐


    vents one workload from stealing the memory of the others. Fault isolation is
    also


    improved: if one MIG instance crashes or resets, the others can continue unaffected.


    This makes MIG attractive for multitenant or production scenarios where you want


    to safely run different applications on the same physical GPU. This is ideal if
    each


    model service needs only a few GBs of GPU memory.


    The trade-off is granularity and overhead. You are limited to the MIG profiles
    defined


    by NVIDIA (you can’t create an arbitrary 6-GB slice, only the fixed sizes offered
    by


    the card). Also, if one job could have used the whole GPU at times, MIG partitions


    mean the job is hard-limited to its share—there’s no concept of borrowing unused


    capacity from others. In contrast, time slicing could let one pod burst to use
    the


    whole GPU if the others are idle (because nothing prevents it from grabbing more


    memory or compute when available, whereas MIG would keep it confined).


    **NVIDIA GPU Operator **



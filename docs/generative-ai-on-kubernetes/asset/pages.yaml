  img_proc: true
- pgno: 217
  md: 'The next step is *alignment*, which teaches the LLM to perform tasks safely
    and relia‐


    bly according to human preferences. This phase is analogous to Isaac Asimov’s
    Three


    Laws of Robotics: just as robots need core principles to ensure safe interaction
    with


    humanity, LLMs need behavioral boundaries to perform tasks without causing harm.


    Alignment requires curated labeled data and a reward mechanism where humans or


    specialized reward models evaluate the model’s responses.


    It is possible to find base models that went through a pre-training phase only,
    but


    the vast majority of publicly available models have already been aligned so that
    they


    are ready to be used for a specific set of tasks. Model customization, also known
    as


    *post-training*, applies to an already aligned model. See Figure 6-1 for the high-level


    description of this creation pipeline.


    ![](img/3a93443ca88ca3c8ef163f48ebd612bc_217_0.png)


    *Figure 6-1. LLM creation pipeline*


    Throughout this chapter, you’ll encounter terms like “model tuning,” “model custom‐


    ization,” and “post-training” used in various contexts (see the next sidebar for
    a


    clarification of these terms).


    **180 **


    **| **



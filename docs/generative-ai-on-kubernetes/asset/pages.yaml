- pgno: 181
  md: '**Token-based rate limiting and user management**


    User tracking becomes critical for enabling fair access and quota management


    when serving LLMs in multitenant environments. Unlike traditional APIs where the


    request is the unit of measurement, LLM serving uses tokens as the fundamental
    unit


    of computation. A single request might generate 10 tokens or 10,000 tokens, consum‐


    ing vastly different amounts of GPU resources and time. This makes traditional


    request-based rate limiting ineffective for LLM workloads.


    The Envoy AI Gateway provides token-based rate limiting capabilities that track
    and


    limit token consumption per user or API key, enabling fair resource allocation
    across


    multiple tenants accessing the same model deployment. Similarly, Kuadrant offers


    token rate limiting integrated with Kubernetes-native policy management, allowing


    platform administrators to define quotas based on tokens generated rather than


    requests made.


    **Evolution of AI gateway capabilities**


    The AI gateway ecosystem is rapidly evolving beyond basic routing and rate limiting


    to include more sophisticated capabilities:


    *Semantic routing*


    Semantic router projects enable routing based on the semantic content of user


    requests, directing different types of queries to specialized models. This routes


    code generation requests to code-specialized models while sending general con‐


    versation to general-purpose LLMs, optimizing both cost and quality.


    *Hybrid routing*


    Advanced AI gateways support hybrid approaches where requests can be dynam‐


    ically routed to local on-premises models or remote cloud-hosted models based


    on current system workload, model availability, and SLA requirements. For


    example, during peak load, overflow traffic can be routed to cloud-based infer‐


    ence endpoints while keeping latency-sensitive requests on local infrastructure.


    *Model composition*


    Emerging AI gateway patterns enable chaining multiple models together, where


    the output of one model becomes the input to another, implementing complex


    workflows like retrieval-augmented generation (RAG) where a retrieval model


    first identifies relevant documents before an LLM generates responses.


    These capabilities transform AI gateways from simple traffic routers into intelligent


    orchestration layers that optimize cost, latency, and quality across heterogeneous


    model deployments.


    **144 **


    **| **


    **Chapter 4: Running in Production**'
  merge: -1
  img_proc: true
- pgno: 182
  md: '**Gateway API Inference Extension**


    The Gateway API Inference Extension project extends the Kubernetes Gateway API


    with capabilities optimized for AI inference workloads, including model-aware
    rout‐


    ing (routing based on model names rather than just URL paths), serving priorities,


    and incremental model rollouts through traffic splitting.


    The core resource is InferencePool (v1 stable), which represents a group of pods


    dedicated to serving AI models that share the same compute configuration, accelera‐


    tor type, and base model. Platform administrators can configure InferencePools
    to


    enable intelligent routing based on metrics like KV cache utilization, queue length,
    or


    model-specific characteristics. InferenceObjective (alpha) defines serving objectives


    and priorities for routing decisions, allowing differentiated service levels for
    differ‐


    ent workloads. Note that InferenceObjective replaced the earlier InferenceModel


    resource when the API evolved.


    One common use case is LoRA-aware routing, where an InferencePool manages pods


    serving a base model with multiple LoRA adapters, and the routing logic intelligently


    distributes requests to pods based on which adapters are loaded. See Example 4-7
    for


    the usage of these APIs.


    *Example 4-7. Example of Gateway API Inference Extension usage*



- pgno: 187
  md: 'These two projects can be used together. The llm-d project leverages the benefits


    of each project. NIXL in particular is very flexible and might be used even


    without disaggregated serving, enabling, for example, the possibility of leveraging


    CPU memory as an extension of GPU memory to have a larger KV cache.


    The distribution of the KV cache has implications for the LLM-aware router


    component too, because even if the KV cache is distributed to and accessible


    by all the replicas, it is way more efficient to forward the request to a replica


    where the necessary KV cache blocks are ready to avoid a cache miss and a block


    transfer.


    *Disaggregated **prefill*


    Prefill is the first phase of request processing. During this phase the input
    prompt


    is processed and the first token is produced. After prefill, the decode phase


    continues to produce token by token until the end of the stream. The first


    phase is compute-bound and impacts the Time to First Token metric, while the


    second phase is memory-bound and impacts the Inter-Token Latency metric


    (see “Understanding LLM Fundamentals” on page xxv for more details). Given


    the different nature of the workload, disaggregated prefill splits the prefill
    phase


    and the decode phase into two different pools of instances so that it is possible


    to scale and tune the two phases independently; for example, if the workload


    mainly includes long input prompts, the prefill phase will need more replicas
    to


    process them. The main challenge of enabling this approach is that the prefill


    phase is in charge of initializing the KV cache so it must be transferred from
    the


    prefill instance to the decode instance to continue the generation. Fortunately,


    the distribution of the KV cache described earlier can be applied to this use


    case too. From an implementation perspective, disaggregated prefill requires the


    distributed KV cache and a routing component.


    Now that all the ingredients to build a disaggregated serving stack have been
    intro‐


    duced, it is possible to describe the end-to-end architecture of a similar solution.
    The


    design described in Figure 4-4 represents the entire stack, from the Gateway API
    to


    vLLM, including all llm-d components and KServe LLMInferenceService to manage


    the deployment lifecycle.



- pgno: 359
  md: 'SPIFFE provides workload identity through certificates that are automatically
    issued,


    rotated, and verified. In the MCP context, this means that your agent runtime,
    MCP


    server, and upstream APIs can all authenticate each other using mutual TLS (mTLS)


    without managing any secrets. Every connection is cryptographically verified,
    and


    credentials have a default TTL of one hour (with rotation at 50% of TTL, so approxi‐


    mately every 30 minutes).


    **How SPIFFE works for MCP**


    SPIFFE assigns each workload a unique identity called a SPIFFE ID, formatted as


    a URI like `spiffe://example.com/ns/agents/sa/customer-support`. The workload


    proves its identity using a SPIFFE Verifiable Identity Document (SVID), which
    is


    an X.509 certificate containing the SPIFFE ID in the Subject Alternative Name


    (SAN) field. Think of the SPIFFE ID as the workload’s name and the SVID as its


    cryptographically signed ID card.


    The SPIRE Server acts as the certificate authority, issuing SVIDs to workloads
    after


    verifying their identity through a process called *attestation*. On Kubernetes,
    attesta‐


    tion typically means validating the pod’s ServiceAccount token against the Kubernetes


    API. The SPIRE Agent runs as a DaemonSet on every node, exposing a Workload


    API via Unix socket at `/run/spire/sockets/agent.sock`. Workloads mount this


    socket’s host path as a volume and connect to retrieve their SVID—no network calls,


    no secrets to mount, just a local API that verifies the calling process.


    Let’s trace the full authentication chain from the agent runtime through the MCP


    server to an upstream API. Both workloads retrieve their SVIDs from the local
    SPIRE


    Agent as described earlier. With identities in place, mTLS secures each hop:


    1\. The agent runtime connects to the MCP server, presenting its SVID as the client



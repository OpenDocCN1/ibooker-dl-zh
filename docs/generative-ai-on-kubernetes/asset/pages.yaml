    Before Topology Manager, the CPU Manager and Device Manager in Kubernetes


    made resource allocation decisions independently, potentially assigning CPUs from


    one NUMA node and GPUs from another NUMA node to the same pod, forcing


    cross-NUMA memory traffic (Figure 7-3).


    Topology Manager addresses this by enabling CPU and device (including GPU)


    topology awareness for individual pods, ensuring that CPUs and GPUs allocated
    to a


    pod are NUMA-local to minimize memory access latency.


    Platform administrators can configure Topology Manager with different policies:


    `best-effort` attempts NUMA alignment without enforcing it, `restricted` only


    admits pods when resources can be properly aligned, and `single-numa-node` requires


    all pod resources to come from a single NUMA node. This is the strictest policy


    that guarantees optimal locality but may reduce scheduling flexibility in resource-


    constrained clusters.



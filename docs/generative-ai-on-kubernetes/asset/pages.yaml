- pgno: 161
  md: 'Model compression alone isn’t sufficient. If the runtime lacks native quantization


    support, it must convert the compressed model back to 16-bit precision during


    processing to evaluate the neural network and produce activations. The sweet spot


    of quantization is a runtime that has optimized kernel implementations (GPU


    functions) that can process quantized data end to end. This enables the scalability


    improvements.


    The vLLM runtime has native support for most of the quantization techniques, both


    on the compression side with the LLM compressor project, but especially on the


    runtime side with multiple optimized kernels that are automatically enabled when
    the


    runtime detects that the model is quantized.


    This area of research looks very promising to make LLM serving more cost-effective,


    potentially becoming the future standard for models and runtimes, but some critical


    aspects remain. First of all, the specialized kernels that are critical to properly
    scale


    quantized models are hardware-specific so not all GPUs support it yet, and in
    general


    it is possible to have a dramatic accuracy drop when the quantization goes wrong.


    Although the first aspect, ensuring comprehensive GPU coverage, may simply


    require time, the second aspect demands meticulous control. The compression is


    not lossless, so it is critical to evaluate the quality of the model after compression
    to


    make sure the level of accuracy has not been impacted too much.


    There are multiple examples of models that have been quantized to use 8-bit per


    floating point (FP8) and that have recovered more than 99% of the accuracy of


    the original model. The library `llmcompressor` simplifies the whole procedure
    with


    built-in calibration. Using the library is quite straightforward, but it requires
    some


    knowledge to understand the different parameters (Example 4-1).


    *Example 4-1. Compress an LLM using *`*llmcompressor*`


    `**from**`` ``**llmcompressor.modifiers.quantization**`` ``**import**`` ``GPTQModifier`


    `**from**`` ``**llmcompressor.modifiers.smoothquant**`` ``**import**`` ``SmoothQuantModifier`


    `**from**`` ``**llmcompressor.transformers**`` ``**import**`` ``oneshot`


    `*\# Select quantization algorithm. In this case, we:*`


    `*\# \* apply SmoothQuant to make the activations easier to quantize*`


    `*\# \* quantize the weights to int8 with GPTQ (static per channel)*`


    `*\# \* quantize the activations to int8 (dynamic per token)*`


    `recipe`` ``\=`` \[ `


    ` ``SmoothQuantModifier``(``smoothing\_strength``\=``0.8``),`


    ` ``GPTQModifier``(``scheme``\=``"W8A8"``, ``targets``\=``"Linear"``, ``ignore``\=``\[``"lm\_head"``\]),
    `


    `\]`


    `*\# Apply quantization using the built-in open\_platypus dataset.*`


    `oneshot``(`


    ` ``model``\=``"TinyLlama/TinyLlama-1.1B-Chat-v1.0"``,`


    ` ``dataset``\=``"open\_platypus"``, `


    ` ``recipe``\=``recipe``,`



- pgno: 28
  md: 'of all possible words and use the index of this vocabulary as an integer representation


    of a word. With this approach, every time a word does not exist in the vocabulary,
    the


    conversation cannot happen and the word is classified as unknown.


    Modern LLMs use *subword tokenization*, where text is broken into smaller units,


    called tokens, of various sizes rather than whole words. For example, the word


    “regularization” might be split into “regular” and “ization” as separate tokens.
    This


    approach allows the model to handle any text input, including rare words, technical


    terms, or names like “O’Reilly,” by combining subword units from a fixed vocabulary


    of tens of thousands of tokens. Unlike word-level approaches, subword tokenization


    eliminates the unknown word problem while keeping vocabulary sizes manageable


    (see the following sidebar for more on prompts and tokens).


    Fortunately, converting a sentence into words and then into numbers is not a chal‐


    lenge unique to LLMs but is common to all NLP techniques. Years of research in
    this


    field have led to the development of various approaches.


    The solution that LLMs use is based on the adoption of a *tokenizer* that splits
    the


    sentence in tokens and then computes the *token embedding* to capture the semantic


    meaning with a numerical representation. This is a necessary preparation to make
    the


    input consumable by the neural network.


    **Prompt, Sentence, Word, and Token**


    The *prompt* is the request that is sent to the LLM to be processed. It can be
    a simple


    question or a very long text with a lot of contextual information to process.
    In a


    real-world scenario, the prompt is not limited to the actual end user input but
    also


    includes at least a *system prompt* that guides the LLM behavior. The system prompt


    is included in the full request and defines the scenario that the model should
    use to


    handle the user request.


    A system prompt can strongly influence the model’s behavior. For an AI assistant,


    the system prompt might be: *“You are a friendly AI assistant named John. Your*


    *role is to help users with easy to understand answers. If you don’t know the
    answer,*


    *just say that you don’t know instead of guessing.”* The same model can perform
    text


    summarization with a system prompt like: *“Please generate a summary of the following*


    *text highlighting main points in no more than 500 words.”*


    Altering the prompt to include more context and influence the generation of the


    output is called *prompt engineering*.


    The prompt is formed by one or more *sentences*. The sentence structure is preserved


    during the tokenization using special tokens to identify the beginning, the end,
    and


    the punctuation. In natural language, the structure of the sentence influences
    the


    semantics; thus it is critical to preserve it during the tokenization and avoid
    a flat list


    of tokens.


    **Introduction **


    **| **


    **xxvii**'

- pgno: 199
  md: 'Similar to TTFT, this metric is computed in seconds and uses a histogram as
    its type.


    In vLLM, it is named `vllm:time\_per\_output\_token\_seconds`, while OpenTelemetry


    semantic conventions suggest `gen\_ai.server.time\_per\_output\_token`.


    If TTFT maps to the prefill phase, this metric measures the duration of each decoding


    iteration.


    **Throughput**


    With tokens as the computational unit for LLMs, throughput is defined as the num‐


    ber of tokens generated per second.


    However, requests can be very long (more than 100k tokens), so looking only at
    the


    number of generated tokens misses the time and cost to process the initial request


    (prefill).


    The vLLM project has decided in this case to provide both individual metrics plus
    a


    combined metric: `vllm:prompt\_tokens\_total` indicates the number of input tokens


    processed per second, `vllm:generation\_tokens\_total` is the number of output


    tokens produced per second, and `vllm:tokens\_total` is the combined number and


    represents the total number of token *processed* per second.


    OpenTelemetry semantic conventions don’t provide a recommendation for this


    metric.


    Even if both metrics are available, in general the throughput of a generated token
    is


    enough to be a valid indicator of system load. Because modern GPUs are very fast,


    the processing of the input is done very quickly (compute-bound), and the decoding


    phase takes most of the time.


    At the same time this doesn’t directly relate to the number of processed requests


    because the system can be fully used to produce a single response, or the other
    way


    around.


    **Latency**


    Latency indicates the time, in seconds, necessary for the model to generate a
    full


    response.


    This metric is correlated with the previous metrics, in particular with TTFT and


    TPOT, but it is also an important indicator of the total time to process a request
    and


    can be used to indicate trends or recognize patterns.


    The name of this metric in vLLM is `vllm:e2e\_request\_latency\_seconds`, repre‐


    sented as a histogram and measured in seconds. OpenTelemetry semantic conven‐


    tions recommend `gen\_ai.server.request.duration` as the name for this metric.


    **162 **



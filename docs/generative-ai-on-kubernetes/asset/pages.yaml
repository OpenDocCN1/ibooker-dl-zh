    **Low-Rank Adaptation**


    Low-Rank Adaptation (LoRA) keeps the original model weights frozen while training


    a relatively small number of new parameters on the fine-tuning dataset. The new


    parameters are organized as smaller matrices called adapters. These low-rank matri‐


    ces learn the updates, and their product is combined with the original weights.


    In a traditional fine-tuning job, the training process learns a new, full-sized
    matrix


    representing the weight updates. LoRA, however, decomposes this large update.


    Instead of learning the full matrix, the training produces two much smaller, low-rank



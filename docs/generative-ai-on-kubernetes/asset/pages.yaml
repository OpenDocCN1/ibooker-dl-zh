  md: 'Kueue has the concept of priority classes (WorkloadPriorityClass CRD), and
    it serves


    a different purpose than the ResourceFlavor selection:


    *ResourceFlavor selection*


    Determines *which topology and hardware* a workload gets (controlled by flavor


    order and availability).


    *Priority classes*


    Determine *which workload gets admitted **first* when multiple workloads are pend‐


    ing (controlled by the priority value).


    When multiple training jobs are queued waiting for resources, Kueue uses priority
    to


    decide the admission order:


    *Higher priority workloads*


    Admitted first when quota becomes available.


    *Preemption*


    High-priority workloads can evict running low-priority workloads to reclaim


    quota.


    *Same priority*


    FIFO ordering within the same priority level.


    *Fair sharing*


    Prevents resource monopolization by ordering workloads based on historical


    resource usage, giving preference to queues that have consumed fewer resources


    over time and ensuring that underutilized teams can make progress even in busy


    clusters.



    **Taints and tolerations**


    Sometimes operators want to flip the model and mark certain nodes as off-limits


    unless a pod explicitly opts in. A taint added by the administrator repels all
    pods; only


    those carrying a matching toleration can schedule.


    In Example 3-5, we add a *taint key-value pair* `nvidia.com/gpu=true` with the
    *taint*


    *effect* `NoSchedule` to all nodes carrying the label `nvidia.com/gpu.count`.
    Only pods that


    explicitly tolerate the `nvidia.com/gpu` constraint can be scheduled on these
    nodes.



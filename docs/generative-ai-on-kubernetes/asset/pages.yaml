- pgno: 24
  md: 'After some trial and error, we managed to get things running. We fine-tuned
    our


    resource requests, optimized persistent volumes, and introduced smarter scheduling


    strategies to maximize GPU efficiency. Finally, the models started to work. It
    was


    a steep learning curve, but it highlighted the gap between Kubernetes’ traditional


    strengths and the emerging needs of AI workloads.


    Not everyone will face these exact same challenges, but the lessons we learned
    are


    applicable to any Kubernetes environment. As the Kubernetes community continues


    to close the remaining gaps to make AI workloads, especially LLMs, first-class
    citi‐


    zens, we invite you to join us on this journey. In this book, we’ll explore the
    state


    of the art for running LLMs on Kubernetes and show you how to overcome the


    operational challenges that come with it.


    In this introduction, we will first explore the challenges of running large AI
    work‐


    loads at scale, then discuss how Kubernetes addresses them. We’ll then provide
    an


    optional primer on LLM fundamentals, covering concepts like token processing and


    inference phases that help when diagnosing performance issues. You can skip this


    section on a first read if you prefer to treat LLMs as pure black boxes.


    Finally, we’ll provide an overview of the four parts that guide the rest of this
    book:


    inference, production readiness, tuning, and AI-driven applications. Now, let’s
    dive


    into the first critical topic: the challenges of running generative AI at scale.


    **Challenges of Running Generative AI at Scale**


    As we have seen, running generative AI models, particularly LLMs, involves address‐


    ing a set of complex challenges that go beyond traditional application workloads.


    These challenges demand not just powerful hardware but also sophisticated manage‐


    ment and orchestration of resources.


    **Generative AI and LLMs**


    In this book, we frequently use the terms “generative AI” and “LLMs” interchangea‐


    bly. Here’s why:


    Generative AI encompasses a wide range of machine learning techniques that gener‐


    ate new content. This includes not only LLMs but also models for generating images,


    videos, and sound.


    While LLMs are just one subset of generative AI, they have become the most prom‐


    inent and widely recognized. To simplify our discussion, we’ll often refer to
    both


    generative AI and LLMs interchangeably.


    Operationally, all generative AI models share many similarities, though we will
    high‐


    light any differences when necessary.


    **Introduction **


    **| **



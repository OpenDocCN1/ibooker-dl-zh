- pgno: 1
  md: "ISBN: 978-1-098-17192-6\n\nUS $59.99 CAN $74.99\n\nGENERATIVE AI\n\nGenerative\
    \ AI is revolutionizing industries, and Kubernetes has fast become the backbone\
    \ for deploying \n\nand managing these resource-intensive workloads. This book\
    \ serves as a practical, hands-on guide for \n\nMLOps engineers, software developers,\
    \ Kubernetes administrators, and AI professionals ready to combine \n\nAI innovation\
    \ with the power of cloud native infrastructure. Authors Roland Huß and Daniele\
    \ Zonca provide \n\na clear road map for deploying, fine-tuning, and scaling large\
    \ models on Kubernetes to power AI-driven \n\napplications, addressing challenges\
    \ like GPU resource optimization, observability, and security along the way.\n\
    \nWith actionable insights and real-world examples, readers will learn to tackle\
    \ the opportunities and \n\ncomplexities of managing GenAI applications in production\
    \ environments. Whether you’re experimenting \n\nwith large language models (LLMs)\
    \ or facing the nuances of AI deployment at scale, you’ll uncover expertise \n\
    \nyou need to operationalize this exciting technology effectively.\n\n**•** Learn\
    \ how to deploy LLMs more efficiently \n\nwith optimized inference runtimes\n\n\
    **•** Get hands-on with GPU scheduling, including \n\nhardware detection and multinode\
    \ scaling\n\n**•** Monitor and understand LLM-specific metrics \n\nlike Time to\
    \ First Token and token throughput\n\n**•** Know when to fine-tune a model or\
    \ when \n\nretrieval augmentation is the better choice\n\n**•** Discover how to\
    \ evaluate models with standardized \n\nbenchmarks before committing GPU resources\n\
    \n**•** Learn to run agentic applications with secure \n\ntool integration, identity\
    \ management, and \n\npersistent state\n\n**Generative AI on Kubernetes**\n\n\
    **Dr. Roland Huß** is a distinguished \n\nengineer at Red Hat with over 25 years\
    \ \n\nof experience in software engineering, \n\nspecializing in infrastructure\
    \ for AI-enabled \n\napplications, serverless architectures, and \n\ncloud native\
    \ platforms.\n\n**Daniele Zonca** is a chief architect at Red \n\nHat, responsible\
    \ for the technical vision \n\nof Red Hat AI offerings on Kubernetes. He \n\n\
    specializes in enterprise AI adoption using \n\nopen source projects including\
    \ TrustyAI, \n\nKServe, vLLM, llm-d, and Kubeflow.\n\n“This book bridges the worlds\
    \ of Kubernetes and AI with a broad \n\nyet practical perspective on operating\
    \ GenAI systems.”\n\nBilgin Ibryam, coauthor of *Kubernetes Patterns*, principal\
    \ product manager at Diagrid\n\n“This book is an invaluable resource for infrastructure\
    \ engineers, whether \n\nthey’re looking to deploy generative AI applications\
    \ on Kubernetes or break \n\ninto the field with a strong understanding of modern\
    \ infrastructure.”\n\nNikhil Devnani, senior machine learning engineer"

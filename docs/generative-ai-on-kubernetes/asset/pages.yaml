  md: '*Anti-affinity* spreads pods apart across nodes or zones. Use this for throughput-


    scaling deployments where independent model replicas should avoid single points
    of


    failure. If one node goes down, replicas on other nodes continue serving.


    Both mechanisms support hard constraints (a pod will not schedule unless the rule
    is


    satisfied) and soft constraints (scheduler prefers but does not require the placement).


    Hard rules are critical for correctness, such as ensuring model shards land together.


    Soft rules optimize performance when possible but allow fallback placement.


    For detailed configuration and examples, see the *Automated Placement* pattern
    in


    *Kubernetes Patterns*.


    In practice, many teams keep model-parallel deployments to a single node, when
    pos‐


    sible, for simpler failure handling, and use multinode only for truly massive
    models.


    This preference raises an important question: while we’ve covered how to distribute


    models across GPUs using tensor and pipeline parallelism, we haven’t fully examined


    where those GPUs should reside from a Kubernetes deployment perspective. Should


    you colocate all GPUs on a single physical node, or distribute them across multiple


    nodes? This topology decision, independent of which parallelism strategy you choose,


    has profound implications for performance, reliability, and operational complexity.


    The following sections explore this deployment choice in detail, revisiting some


    familiar GPU concepts but now through the lens of node topology and Kubernetes


    resource constraints.


    **Single-Node Versus Multinode Inference**


    When deploying model-parallel inference on Kubernetes, you face a fundamental


    topology choice: concentrate your GPUs on a single node or spread them across


    multiple nodes. Each approach offers distinct trade-offs.


    *Single-node multi-GPU inference* means all GPUs used for the model or replicas


    are in the same server. As already mentioned, this has an advantage of high-speed


    local interconnects. Within one machine, GPUs often communicate via PCIe (and
    if


    it’s a high-end GPU-enabled server, via NVLink or NVSwitch between GPUs). For


    instance, NVIDIA DGX-class nodes have NVSwitch connecting all eight GPUs with


    up to 900 GBps bandwidth, which makes intra-node communication far faster than


    typical network links. As a result, parallel strategies that involve frequent
    communi‐


    cation (like tensor parallelism) work very well within a single node. In Kubernetes,


    utilizing multiple GPUs on one node is straightforward: you request the number
    of


    `nvidia.com/gpu` resources in the pod spec, and the scheduler will place the pod
    on a


    node that has that many free GPUs. The container can see all GPUs assigned to
    a pod


    (e.g., via the environment variable `CUDA\_VISIBLE\_DEVICES`). Your inference
    server or


    code can then initialize model parallelism across those devices.



    Modelcar image that holds the model data.


    Creates a symbolic link `/mnt/models` that points into the modelcar’s own root


    filesystem, accessible via the `proc` filesystem. In YAML, the `$$$$` gets replaced


    with `$$`, which is the special shell variable that holds the modelcar’s shell
    pro‐


    cess ID. After the link is created, the modelcar sleeps indefinitely to keep the


    container alive.


    Declaration of the shared `emptyDir` volume that is referenced in the container


    declaration for the serving runtime and the modelcar.


    While the modelcar technique proved to be very valuable for optimizing the initiali‐


    zation of LLMs, it also has a handful of drawbacks:


    *Startup order*


    Serving runtimes typically assume the model data is already present when they


    start up. However, with modelcars, the modelcar container and runtime con‐


    tainer start in parallel. This can lead to the runtime starting before the model


    is available. Despite modelcar containers starting quickly, startup is slower
    when


    the modelcar image still needs to be pulled from an OCI Registry. This can be


    mitigated by using the Kubernetes sidecar support, available since Kubernetes


    1.28 as an optional feature, so that the runtime starts only when the modelcar
    is


    initialized. For setups where sidecars are not enabled, you still can minimize
    the


    risk of a race condition by pre-pulling the modelcar image in an init-container
    to


    ensure that when the modelcar sidecar starts, the modelcar OCI image is already


    present at the cluster node.


    *Security*


    Enabling `shareProcessNamespace` allows access to the process names space and


    filesystems of all containers defined for a pod. This is especially important
    to


    remember when other sidecars are included. A prominent example is the service


    mesh Istio that uses sidecars to provide its functionality. Istio sidecars assume


    they are fully isolated, so they don’t implement any precautions to hide sensitive


    information like the access configuration to their upstream Istio daemon. As


    shown in this security report, the lack of additional encryption of the local
    Istio


    configuration can be easily exploited. Understanding the consequences when


    using tools and platforms like Istio or Knative that perform sidecar injections
    is


    therefore critical.


    **OCI Image for Storing Model Data **



- pgno: 319
  md: '*Embed the query*


    The orchestrator uses the same embedding model as in ingestion to encode the


    user’s query into a vector. This is typically a fast operation and yields a query


    embedding in the same vector space as the document embeddings.


    *Vector search for relevant docs*


    Using the query embedding, the orchestrator performs a similarity search in


    the vector database. The store returns the top-k nearest neighbors by cosine


    similarity or distance, often along with metadata and, depending on configura‐


    tion, the stored text payload. You can apply metadata filters or hybrid retrieval


    with a lexical scorer to capture rare terms, identifiers, or exact phrases while


    maintaining semantic recall.


    *Rerank or **filter** results*


    Optionally, a reranker scores each retrieved chunk in the context of the query
    so


    you can keep only the best few within your prompt budget. Simple heuristics like


    minimum similarity thresholds or recency boosts also help, and many systems do


    well with vector search alone when latency budgets are tight. By the end of this


    step you have a small set of context snippets ready to augment the prompt.


    *Construct the prompt with retrieved context*


    The orchestrator prepares the final prompt, inserting the retrieved texts and


    the question into a template. Example 8-1 shows one such template. The exact


    wording of the prompt and how the context is presented can be tuned as needed.


    The key is that we ground the model by giving it facts to work from, for example,


    a paragraph from the manual that contains the reset steps. In our example,


    the context might include a paragraph from the manual about resetting, which


    contains the specific steps.


    *Example 8-1. Example template to build up the prompt from RAG documents*


    `Use the following context to answer the question.`


    `If the context doesn''t have the answer,`


    `say you don''t know.`


    `Context:`


    `{retrieved\_text} `


    `Question: {user\_question} `


    `Answer:`


    Placeholder replaced by the documents retrieved from the vector store.


    Parameter replaced with the actual user query.



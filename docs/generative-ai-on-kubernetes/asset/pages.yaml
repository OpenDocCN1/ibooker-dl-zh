- pgno: 198
  md: 'different because the first is compute-bound while the second is memory-bound.
    We


    covered these phases in “Understanding LLM Fundamentals” on page xxv.


    The problem is not limited to resource usage. Even the concept of throughput or


    latency is different because it is not possible to predict, given a request, how
    long


    the answer will be, so any metric that counts the requests will not provide a
    good


    representation of the actual model server workload.


    Since tokens are the core unit of computation for LLM generation, model server


    metrics are token-based rather than request-based. The key LLM metrics produced


    by model servers are covered next, while Chapter 4 covers how to use these metrics


    for more advanced scenarios, such as autoscaling.


    **Time To First Token**


    Time To First Token (TTFT) is the actual time that a user waits before starting
    to


    receive the response.


    This is the most important metric for real-time use cases like chatbots, but it
    is less


    critical for offline scenarios like batch jobs where users don’t experience the
    wait time


    directly.


    TTFT uses seconds as the unit of time and is exposed as a histogram metric type


    (which tracks the distribution of values across configurable buckets). For example,
    vLLM


    produces this metric with the name `vllm:time\_to\_first\_token\_seconds`, while
    Open‐


    Telemetry semantic conventions suggests `gen\_ai.server.time\_to\_first\_token`.


    Considering how LLMs work, the time to produce the first token represents the
    time


    necessary to compute the prefill phase.


    **Time Per Output Token or Inter-Token Latency**


    Tokens are produced one by one and are usually returned to the user as a stream,


    so the second metric to look at is the time necessary to produce each token after
    the


    first.


    If TTFT is the actual time the user will perceive as waiting time, Time Per Output


    Token (TPOT) represents the speed of the result as seen by the end user. This
    metric


    is more important for real-time use cases and less critical for offline scenarios.
    It is


    also often called Inter-Token Latency (ITL).


    On average, a human reads about 180 words per minute, or roughly 3 words per


    second. Since tokens approximate but don’t exactly match words, producing at least


    four or five tokens per second ensures that humans can consume the output without


    perceived delay.



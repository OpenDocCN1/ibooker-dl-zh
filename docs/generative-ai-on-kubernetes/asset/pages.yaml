- pgno: 27
  md: '![](img/3a93443ca88ca3c8ef163f48ebd612bc_27_0.png)


    process text. A basic understanding makes it easier to diagnose performance issues
    or


    optimize resources.


    This section is optional. If you prefer to treat LLMs as pure black


    boxes, you can skip directly to “Overview” on page xxxiii and


    return here later when specific LLM internals are covered, like the


    metrics discussed in Chapter 5.


    Think of this section as a primer that bridges the gap between complete opacity
    and


    unnecessary detail. We’ll cover just enough to make operational decisions informed


    by how LLMs work, not how to build one.


    **How LLMs Process Text**


    As mentioned in “Generative AI and LLMs” on page xxiii, LLMs are a subset of


    the models under the generative AI category. They are based on the Transformer


    architecture and are used to process text (natural language) to perform a number


    of different tasks. An example of a task is to produce a summary of a longer text,


    or to ask the model to answer user questions or classify some data. Modern LLMs


    increasingly support multimodal inputs, where images, audio, or video are encoded


    alongside text for processing. The Transformer architecture describes an *encoding*


    phase and a *decoding* phase. This has been used to create three different classes
    of


    models: *encoder only* models, *encoder-decoder* models, and *decoder-only* models.


    In general, encoder models are popular for learning embeddings used in classification


    tasks. Examples include Google BERT and Meta RoBERTa. Encoder-decoder models


    were originally designed for generative tasks like translation or summarization,
    where


    input and output are strongly connected. Google Flan-T5 is a well-known example.


    Decoder-only models are used for generative tasks, particularly conversational
    AI and


    text generation. The OpenAI GPT series (GPT-1, GPT-2, and GPT-3) follows this


    architecture.


    In practice, today the majority of models adopted for text generation are decoder-


    only. Modern decoder-only models can also perform translation and summarization


    tasks effectively, even without the dedicated encoder step that was originally
    consid‐


    ered necessary for these tasks. We will focus on decoder-only models, but LLMs


    can also serve encoder-decoder models, and the inference pipeline described here
    is


    analogous.


    **Tokenization and Embeddings**


    From a practical perspective, an LLM is a complex neural network that processes
    and


    generates numbers rather than text. Therefore it requires a conversion layer to
    make


    it more usable. A naive way to perform this conversion is to create a huge vocabulary


    **xxvi **


    **| **


    **Introduction**'

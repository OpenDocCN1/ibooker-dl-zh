- pgno: 220
  md: '![](img/3a93443ca88ca3c8ef163f48ebd612bc_220_0.png)


    *Figure 6-2. An example of RAG pipeline*


    The flexibility of solutions like RAG makes them increasingly popular. You can


    update the vector database with new data in minutes and *refresh* the knowledge
    of the


    solution. This trend, together with the adoption of patterns of agentic AI, is
    taking


    over significant portions of the model customization space.


    One important aspect: all prompt and context engineering techniques work with


    both general-purpose models and tuned models. You can combine RAG with model


    customization. The question isn’t “either/or” but rather “which combination gives


    you the best balance of performance, cost, and maintainability?”


    **When to Use Model Customization**


    While RAG and prompt engineering are powerful, they aren’t always the most cost-


    effective solution. Model customization becomes valuable when you need to embed


    knowledge or behavior directly into the model itself.


    The possibility to influence model behavior through prompts and RAG is powerful


    and often sufficient. But this approach has limitations that make model customiza‐


    tion the better choice in certain scenarios.


    As described in “vLLM Runtime Parameters Tuning” on page 128, a large context


    window requires more GPU memory at inference time. Model customization is a


    key tool for controlling inference costs. It allows a company’s core, slow-changing


    knowledge to be embedded directly into the model, reducing the need for a large


    context window with every request.


    For example, a bank could create a customized model with embedded domain knowl‐


    edge about loans, trading, and credit risk. This information doesn’t change frequently,


    so it makes sense to embed it in the model itself rather than providing it in
    the


    context of every request. The result is lower inference costs and potentially
    better


    performance.


    **When to Use Model Customization **


    **| **



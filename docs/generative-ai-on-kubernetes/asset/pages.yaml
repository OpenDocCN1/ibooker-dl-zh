- pgno: 29
  md: 'Each element of the sentence is a *word* that maps to one or more *token*.
    This is


    because we want to keep the size of the vocabulary fixed so we cannot map every


    possible combination of letters that are rarely used or even never used at all.
    Splitting


    a word in tokens is way more efficient: the words *tall*, *taller*, and *tallest*
    can be split


    as (*tall*), (*tall*, *er*), and (*tall*, *est*), so that the tokens *er* and
    *est* can be reused for other


    words that have the same suffix. The tokenizer algorithm used during the training


    produces the vocabulary that the model recognizes. Thus, given an input sentence,


    there is no single way to calculate how many tokens are produced by the tokenizer.


    In general, a word is split in multiple tokens every time there is no direct mapping
    in


    the vocabulary. This prevents the possibility of a word being discharged because
    of a


    missing direct conversion.


    Some *tokens* are special because they don’t map to a word; instead, they represent
    a


    special meaning like end of the generated text (`<EOS>`) or beginning and end
    of the


    system prompt.


    **Tokenizer implementation**


    A tokenizer is an algorithm that takes a sentence as input and returns a list
    of tokens


    as output. A token is usually a subword and it is language-specific: for example,
    *er* is


    a common suffix in English, so it is a token. Each token has an integer representation


    (i.e., the index of the vocabulary), so it is possible to convert the full sentence
    in a


    sequence of numbers where each number represents a token. Because each number


    represents a single token, it is also possible to convert a number back to the
    original


    token.


    State-of-the-art tokenizer implementations are far more complex than this simple


    description. They incorporate normalization steps, model-specific token handling,


    techniques for languages without space-separated words, concurrent implementa‐


    tions, and much more. Different tokenizers are available and one of the most com‐


    monly used is the Hugging Face `tokenizer` library. The same tokenizer used during


    model training must be used during inference to ensure consistent token mappings.


    The tokenizer vocabulary itself is fixed; it’s the embedding layer (covered next)
    that’s


    trained during model development.


    For a more comprehensive introduction to the tokenizer topic, see the “Summary
    of


    the tokenizer” page on the Hugging Face website.


    **Embeddings**


    Now that we have converted the input of the user to a list of tokens, we are ready
    for


    the second step: the embedding.


    Thanks to the tokenizer we now have a vector of numbers that represents the original


    input, but it doesn’t have any information on the semantic meaning of the token.
    We



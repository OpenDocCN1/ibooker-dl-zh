- pgno: 45
  md: 'From a Kubernetes platform perspective, every model server is usually similar
    in


    terms of deployment topology. However, you should be aware of the type of model


    and task because the scaling, hardware optimization, and metrics to observe are


    model server-specific. We’ll delve more into this content in Chapter 5.


    **Multimodal Models**


    Many LLMs typically work with just one modality: input and output are text. Multi‐


    modal models are able to process a larger set of modality, like images, video,
    audio,


    mathematical equations, and so on. In particular, the main goal is to mix similar


    modality to perform tasks like text to image where the input is a textual query
    and


    the output is a generated image. It’s possible to do the opposite or to mix multiple


    modalities in the same query by providing an image and a query to return a new


    image or text.


    From a model architecture perspective, while many popular image/audio generation


    models use *diffusion-based* architectures (like Stable Diffusion), others use
    *Trans‐*


    *former* architectures (like DALL-E, Imagen, and AudioLM). This category of models


    is part of the generative AI space, but it’s not an LLM. While increasingly adopted


    across multiple industries, including healthcare, ecommerce, and content creation,


    there’s less standardization around them compared to text generation models. They’re


    often integrated into specialized products like image editors and chat interfaces.


    We assume in this book the usage of the LLM *Transformer* bases that are applicable


    to a larger set of use cases. This implies that the model output is text, but
    it doesn’t


    prevent the input from including images and audio together with text, making them


    multimodal models.


    Now that we understand what a model server is, let’s examine specific implemen‐


    tations. We’ll explore several popular LLM model servers, including vLLM, TGI,


    llama.cpp, and NVIDIA NIM, highlighting their strengths and use cases.


    **vLLM**


    vLLM is a Linux Foundation AI & Data project for LLM inference and serving. The


    project is very active, with thousands of forks, hundreds of contributors, the
    support


    of more than fifty model architectures, end-to-end optimization techniques, and
    the


    support of multiple hardware vendors. It is a library that can be directly used
    in


    Python (Example 1-3), but the project includes a CLI and an OpenAI-compatible


    server.


    **8 **


    **| **


    **Chapter 1: Deploying Models**'

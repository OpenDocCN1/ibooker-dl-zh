  md: 'derive chunks directly from document structure rather than arbitrary windows,


    because Docling exposes sentences, paragraphs, section headers, tables, and cap‐


    tions as first-class elements. Docling lets you choose chunkers by sentence, by


    paragraph, by header-aligned sections, or by semantic grouping, and it supports


    overlap and maximum-size controls so you can tune recall versus prompt budget.


    It also emits stable identifiers and a clean metadata schema for each chunk—such


    as source, timestamp, version, section, and page—which preserves provenance


    and enables precise filtering at query time. Different chunking strategies fit


    different intents, with smaller, sentence-level chunks working well for FAQ-style


    lookup, and larger, heading-aligned segments being better for policies or manuals


    where broader context matters. Lifecycle management includes invalidating or


    re-embedding documents when they change, ensuring the vector store remains


    consistent. Metadata could include the source document title, date, author, sec‐


    tion headings, or any tags that might be useful later for filtering or for letting
    the


    model identify the source.


    *Embed the chunks*


    Next, each chunk of text is turned into a numeric vector using the embedding


    model, which typically produces a high-dimensional vector. For example, you


    might use the sentence transformers model all-MiniLM-L6-v2 or call a managed


    API such as OpenAI’s text-embedding-ada-002. This step results in one vector


    representation for each text chunk. As noted in “RAG Components” on page


    275, use the same embedding model for indexing and querying. In practice, you


    might run this step in batches—e.g., embedding 1,000 chunks at a time—to speed


    up the process using GPU or parallelism. For more background on embeddings


    and how they represent semantic meaning as vectors, see “Embeddings” on page


    xxviii.


    *Store vectors in the database*


    Finally, insert each vector with an identifier and metadata into the vector data‐


    base. The identifier links back to the original document or chunk so you can


    retrieve or display the source text. The metadata can include the chunk’s raw
    text


    or a reference to fetch it from a content store. Some designs store only an ID


    and fetch the text on demand, while others store the text payload directly for
    fast


    retrieval; choose based on your latency and storage trade-offs. After this step,
    the


    vector database is populated with vectors representing your knowledge base and


    is ready to answer similarity queries.


    To make this concrete, imagine a support chatbot for an ecommerce platform. Your


    sources might include FAQ pages, product manuals, return policies, and trouble‐


    shooting guides. In ingestion, you convert PDFs and HTML to text, chunk by section,


    embed each chunk, and store vectors with metadata such as source: `Product Manual`



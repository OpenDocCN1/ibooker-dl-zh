    **GPU Feature Discovery**


    While NFD provides basic hardware labeling capabilities, NVIDIA offers a special‐


    ized solution for more detailed GPU information: GPU Feature Discovery (GFD).


    As part of the NVIDIA GPU Operator, which we’ll discuss in “NVIDIA GPU Opera‐


    tor” on page 95, GFD is a lightweight utility specifically designed to detect
    detailed


    GPU characteristics and expose them as node labels for advanced scheduling.


    Similar to NFD, GFD runs as a DaemonSet on GPU-equipped nodes. It inspects


    the GPUs on each node, utilizing utilities such as `nvidia-smi`, to gather detailed


    information like GPU model, memory capacity, CUDA version, and Multi-Instance


    GPU capabilities. GFD then applies this detailed GPU-specific data as Kubernetes


    node labels.



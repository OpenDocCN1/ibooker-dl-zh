  md: '![](img/3a93443ca88ca3c8ef163f48ebd612bc_90_0.png)


    Use the `mlflow` CLI to generate a Dockerfile that describes how to build an image


    with MLflow and the model data included.


    Use `podman` to create an OCI image named `my\_model`. Alternatively, you can
    use


    Docker for building the image.


    MLflow also provides an `mlflow models build-docker` command


    that combines both steps into a single operation, directly creating


    the Docker image without generating a separate Dockerfile. The


    `generate-dockerfile` approach shown here offers more flexibility


    for customization (e.g., modifying the base image or adding post-


    build steps) and works seamlessly with Podman or Docker.


    While MLflow was not initially built with Kubernetes in mind, the platform can
    be


    deployed effectively on Kubernetes. The standard approach is deploying it as a
    web


    service using tools like Helm charts, where a PostgreSQL database often serves
    as the


    backend for storing metadata. MLflow does not introduce native Kubernetes CRDs,


    which means its integration with Kubernetes requires additional automation for
    tasks


    such as scaling and dynamic model serving.


    MLflow, while feature rich, was originally designed for traditional ML workflows.


    Its metadata management and artifact handling are well suited for traditional
    ML


    use cases, but LLMs often require specialized handling due to their size and com‐


    plexity. MLflow has significantly improved its LLM support starting with the 3.0


    release, introducing memory-efficient logging through the Transformers flavor
    that


    avoids loading large models into memory during artifact storage. Recent enhance‐


    ments include a Prompt Registry for versioning prompts, an AI gateway for unified


    LLM provider access, native GenAI evaluation capabilities, enhanced tracing for


    LLM applications, and reference-based logging that stores Hugging Face Hub ref‐


    erences instead of full model weights, substantially reducing storage requirements


    during development.


    For production deployments, however, full model weights typically still need to
    be


    downloaded and stored locally to ensure availability and performance. That said,


    these approaches can create challenges in production environments, such as the


    risk of losing access to external repositories or insufficient caching mechanisms
    for


    repeated large model retrievals. As a result, MLflow’s artifact storage and model


    handling techniques, though improving, may still require complementary infrastruc‐


    ture for LLM management at scale. For example, downloading large models repeat‐


    edly from a registry can become inefficient, and MLflow’s current artifact storage


    approach is not optimized for such high-volume data handling.


    **Model Registry **



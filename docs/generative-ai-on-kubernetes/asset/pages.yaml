    **Model and Runtime Tuning**


    Probably the most important aspect to consider when a team approaches the devel‐


    opment of the first real application based on generative AI is the selection of
    the


    model to use. Most teams begin with a managed service like OpenAI’s ChatGPT


    where configuration options are limited. However, in many situations, on-premise


    infrastructure is a must-have. The selection of the model at that point is critical.
    This


    selection is based on many different factors, like type of task, type of workload
    (i.e.,


    real time versus batch inference), and number of concurrent requests.


    The size of the model matters, but two models with the same size might have


    different model architectures and training techniques, with the consequence that
    the


    results of the same query can go from being very accurate to completely wrong.


    Given the criticality of this selection, finding a starting point is challenging.
    The


    number of models available is very high and new models are published frequently,


    making the selection process daunting.


    There is no silver bullet or *single model to rule them all*, but the selection
    process


    should not consider all models available on Hugging Face. One of the common tasks


    when developing a predictive AI model includes checking and comparing models


    trained for the same task, based on their accuracy, so it should be useful to
    find one or


    more metrics to compare the accuracy of LLMs.


    Traditional predictive AI models are trained to solve specific problems. In contrast,


    LLMs are trained on vast datasets and can perform multiple tasks. To compare LLMs


    effectively, first identify the critical task for your application, then select
    accuracy


    metrics based on that task.


    This phase is critical to guide model selection and base it on specific metrics
    instead


    of manual testing. The problem is very complex, and an entire research field about


    language model evaluation exists to address it.



  md: '**SLI, SLO, and SLA**


    A Service-Level Indicator (SLI) is a metric defined to monitor a particular service.
    It


    should be based on aspects that have direct user impact. For example, in the case
    of


    LLMs, it could be the TPOT because it measures the time users must wait to receive


    each token after the first.


    A Service-Level Objective (SLO) is the promise that we made to our users regarding


    a specific SLI: for example, in the case of TPOT we can define an SLO to commit


    to keep this value below a specific threshold in 99.999% of the requests in a
    given


    window of time (like monthly).


    Finally, a Service-Level Agreement (SLA) is the contractual agreement that we
    have


    with our user. It is related to the defined SLOs but is more high level, usually
    defined


    in terms of monthly availability of a service. Breaking one or more SLOs can impact


    SLA to the point that we are no longer compliant with the agreement.


    **GPU Usage Monitoring**


    In the previous section we introduced multiple system metrics that can be used
    to


    measure the overall system throughput and the number of requests that the cluster
    is


    processing. This makes it possible to monitor and configure alerts when the system
    is


    not matching the expected SLA.


    In addition, it is possible to monitor resource usage for CPU, memory, and net‐


    work exactly in the same way as for a traditional Kubernetes workload, although


    networking might be more complex when using secondary network interfaces for


    high-performance interconnects like RDMA or InfiniBand. GPU usage requires addi‐


    tional consideration.


    Chapter 3 covers GPU configuration in Kubernetes clusters in more detail; this


    section focuses on the metrics aspect of GPU devices. Each hardware provider has


    defined its own implementation for this, but all apply a similar approach: there


    is a management component collecting usage metrics from GPU, and an exporter


    component exporting them with a `/metrics` endpoint to make them compatible with


    Prometheus.


    NVIDIA has a suite of tools called Data Center GPU Manager (DCGM) to manage


    GPUs in a cluster, and a DCGM-exporter project that provides Helm Chart to deploy


    the exporter to Kubernetes. Then the metrics scraping can be configured as shown


    in Example 5-2. NVIDIA offers a GPU Operator for optimal Kubernetes integration.


    It can be installed in the cluster to automatically provision and configure the
    metrics


    exporter.


    **164 **



  md: '**Modelcars**


    As we have seen in Example 2-14, you can easily access models stored in OCI images.


    However, this way of copying all the model data into an intermediate storage has


    some drawbacks.


    Direct access to model data stored in an OCI image without copying would signifi‐


    cantly speed up initialization and reduce node space usage. An image needs to
    be


    downloaded only once but can be used simultaneously by many pods. Also, for an


    LLM model that can benefit from the layered nature of OCI images (like LoRA


    fine-tuned models), the overall storage space needed for specialized models that
    are


    based on the same foundational model is reduced. The image layers of the foundation


    model can be shared among the specialized models, reducing the required disk space


    considerably.


    Kubernetes has long lacked support for this use case. Although the feature request


    was already recorded more than 10 years ago in GitHub issue 831, it was not consid‐


    ered for implementation for many years.


    However, things have changed with the advent of LLMs and the desire to ship model


    data in OCI images. Beginning with Kubernetes 1.35, you can use now image volume


    mounts directly in your pod specs. However, it might take some time until image


    volume mounts move out of the experimental stage and are considered stable.


    We talk in detail later about OCI image volume mounts, but KServe uses a technique


    to achieve the same behavior for older Kubernetes versions. You might consider


    jumping directly to “OCI Image Volume Mounts” on page 74 if you can already


    leverage OCI volume mounts, since modelcars can be considered a temporary solu‐


    tion you can use today. OCI image volumes will support everything that modelcars


    provide, but it is a much cleaner and more standardized technique. You should
    use


    OCI image volumes whenever you can; rely on modelcars if this is not yet possible.


    Example 2-15 shows how modelcars can be configured in KServe using a simpler


    scikit-learn model for illustration. Unlike the vanilla Kubernetes deployment
    in


    Example 2-14, KServe’s InferenceService resource handles the modelcar setup auto‐


    matically. The `oci://` URL format is KServe-specific syntax for referencing OCI


    images containing model data, and the model data stored in the referenced image


    will be directly accessed *without prior copying into a volume*. Modelcars can
    speed up


    the startup of a model runtime considerably, especially when working with a large



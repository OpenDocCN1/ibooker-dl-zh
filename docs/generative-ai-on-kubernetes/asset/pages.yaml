  md: '![](img/3a93443ca88ca3c8ef163f48ebd612bc_341_0.png)


    *Figure 9-2. MCP usage in an agentic loop*


    In this flow, the agent’s LLM constructs a sequence of tool calls by selecting
    appropri‐


    ate tools and supplying them with arguments, guided by the provided tool descrip‐


    tions and metadata. For example, if the user asks, “What’s the weather in Paris,
    and


    could you email me the forecast?” the agent might call a `weather\_lookup` tool
    on a


    weather MCP server with the location “Paris” as argument, then call an `email\_send`


    tool on an email MCP server with the forecast data. MCP ensures that these calls
    are


    made in a structured, traceable way rather than via brittle prompt text.


    An MCP server is essentially a microservice exposing one or more tools to AI


    agents via the MCP protocol. In Kubernetes, you typically run each MCP server
    as


    a deployment, containerized with the necessary runtime. For example, if you want


    to offer a PostgreSQL query tool to your AI agents, you could deploy the official


    Postgres MCP server container and configure it with the database connection string


    as an environment variable or a secret.


    Each MCP server can be scaled horizontally behind a Kubernetes service if it needs


    to handle concurrent requests from many agents. While the MCP protocol maintains


    session state for ongoing conversations, most MCP server implementations external‐


    ize this state to databases or caches, making individual server instances stateless


    for request handling. This allows you to leverage the usual Kubernetes scaling
    and


    scheduling strategies. Define resource requests and limits for each server, and
    use a


    Horizontal Pod Autoscaler (HPA) if the load is variable.


    It’s worth considering co-location in some cases. If an MCP server is tightly
    coupled


    to the agent’s data, like a filesystem tool that should operate on the same files
    the


    agent sees, you might deploy it as a sidecar container in the same pod as the
    agent.


    This ensures low-latency local calls and shared storage volumes. The trade-off
    is


    resource duplication and coupled lifecycles, a sidecar per agent pod versus one
    shared


    service, so evaluate based on your usage patterns.


    If you have many MCP servers, managing and discovering their endpoint URLs can


    become cumbersome. One pattern is to use a *service registry* or *naming conventions*.


    Since MCP servers self-describe their tools, an agent could theoretically query
    a


    central directory to find a tool it needs. In practice, many teams group related
    tools


    into a single MCP server to reduce the number of services. This pattern works
    only


    to a certain degree as the number of functions that an agent can consider is limited.



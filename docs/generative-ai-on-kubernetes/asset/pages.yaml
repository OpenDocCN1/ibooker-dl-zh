  md: '**GPU Diagnostics with nvidia-smi**


    `nvidia-smi` is NVIDIA’s System Management Interface tool, providing real-time


    monitoring and management of NVIDIA GPU devices. It offers insights into GPU


    utilization, memory usage, temperature, power consumption, and active processes.
    By


    executing `nvidia-smi`, users can obtain a snapshot of the current state of all
    GPUs


    in the system. For continuous monitoring, the `\-l` flag can be used to refresh
    the


    output at specified intervals (e.g., `nvidia-smi -l 5` updates every 5 seconds).
    This


    tool is invaluable for diagnosing performance issues, ensuring that GPUs are oper‐


    ating within optimal parameters, and verifying that applications are utilizing
    GPU


    resources as intended. Additionally, it aids in detecting anomalies such as thermal


    throttling or unexpected memory consumption, facilitating proactive troubleshooting


    in GPU-accelerated environments.


    As shown in Example 3-13, you can easily run it directly with `kubectl`, too.


    *Example 3-13. Example of running nvidia-smi directly on a GPU-enabled*


    *Kubernetes node*


    `patch=$(cat <<EOT`


    `\[{`


    ` "op":"add",`


    ` "path":"/spec/containers/0/resources",`


    ` "value":{"limits":{"nvidia.com/gpu":1}}`


    `}\]`


    `EOT`


    `)`


    `kubectl run --rm -it gpu-pod \\`


    ` --image=nvidia/cuda:12.8.1-base-ubi9 \\`


    ` --restart=Never \\`


    ` --overrides=$patch --override-type=json -- nvidia-smi`


    Sub-GPU techniques like time slicing or MIGs are useful for squeezing many small


    or midsized models onto the same card, but LLMs rarely fall into that category.
    In


    practice, the bottleneck is not how to split one GPU—it is that even the biggest


    card is still too small. This brings us to the inverse problem. Instead of sharing
    one


    GPU across many workloads, we must distribute a single workload across many


    GPUs. Multi-GPU inference addresses this challenge by coordinating multiple GPUs,


    sometimes across several nodes, to serve a single large model.



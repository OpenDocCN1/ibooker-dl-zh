  md: '*Example 9-13. Agent card for code reviewer in the A2A protocol*


    `{`


    ` ``**"agent\_id"**``:`` ``"code-reviewer"``,`


    ` ``**"skills"**``:`` ``\[``"code\_review"``,`` ``"security\_scan"``\],`


    ` ``**"input\_modes"**``:`` ``\[``"text/plain"``,`` ``"application/json"``\],`


    ` ``**"output\_modes"**``:`` ``\[``"application/json"``\],`


    ` ``**"protocols"**``:`` ``\[``"a2a/v1"``\]`


    `}`


    When a planner agent needs to delegate a code review, it can query a discovery


    service for agents that offer the `code\_review` skill, retrieve the agent card,
    and verify


    that the reviewer accepts the input format the planner wants to send.


    The second concept is the *task lifecycle*, a state machine that tracks delegated
    work


    from creation to completion. When an agent delegates a task to another agent,
    it


    submits the task with an input payload and receives a task identifier in return.
    The


    task moves through defined states: `created` when first submitted, `in\_progress`
    when


    the receiving agent starts work, and eventually `completed`, `failed`, or `cancelled`,


    depending on the outcome. The requesting agent can poll the `/task` endpoint to


    check status, or subscribe to updates if the receiving agent supports push notifica‐


    tions. This lifecycle model handles long-running work gracefully and provides
    clear


    visibility into what each agent is doing at any moment.


    The third concept is *artifact streaming*, a mechanism for passing large or incremental


    results between agents without blocking. As an agent works on a task, it can stream


    partial results back to the requester. A documentation agent generating a multisection


    report might stream each section as it completes, allowing downstream agents to


    begin processing early sections while later sections are still being generated.
    Artifact


    streaming reduces end-to-end latency in multiagent pipelines and provides visibility


    into agent progress even before the task is fully complete.


    The key insight is that tasks have lifecycles independent of HTTP requests. A
    planner


    can submit a task and disconnect, then reconnect later to check progress. This


    decoupling makes A2A robust in distributed environments where network partitions


    or agent restarts might occur during long-running work.


    **Running A2A on Kubernetes**


    From a Kubernetes perspective, A2A enables a deployment model where each agent


    runs as a separate deployment with its own service endpoint. This mirrors the


    microservices pattern we have been applying throughout this book, now extended
    to


    autonomous reasoning systems.


    Agents scale independently based on their workload characteristics. A code reviewer


    agent with high request volume might run with more replicas than a planner agent



- pgno: 209
  md: 'As an alternative, specialized frameworks have also been developed to orchestrate


    and manage guardrails in production environments. Let’s examine several popular


    frameworks for implementing guardrails.


    **NVIDIA NeMo Guardrails**


    NVIDIA NeMo Guardrails is an open source toolkit that adds programmable guard‐


    rails to LLM-based conversational applications. The framework uses *Colang*, a
    cus‐


    tom modeling language designed specifically for defining dialogue flows and safety


    constraints. This approach allows developers to control LLM behavior by defining


    specific response patterns, preventing discussions on certain topics, and ensuring
    that


    conversation paths remain within acceptable boundaries.


    NeMo Guardrails supports five types of rails that can be applied at different
    stages of


    the LLM interaction:


    *Input rails*


    Validate and filter user inputs before they reach the model, blocking malicious


    prompts or sensitive information requests.


    *Dialog rails*


    Control the conversation flow and ensure the model stays on topic during multi-


    turn interactions.


    *Retrieval rails*


    Validate information retrieved from external knowledge bases in RAG scenarios.


    *Execution rails*


    Monitor and control when the model invokes external tools or APIs.


    *Output rails*


    Filter and validate model responses before returning them to users.


    The framework integrates with cloud LLMs like OpenAI models and self-hosted


    models like Llama 4, and it can be deployed as a Python library, a standalone


    Guardrails server, or within a container image for Kubernetes deployment. NeMo


    Guardrails is particularly well suited for domain-specific assistants and question-


    answering systems that require strict conversational boundaries.


    **FMS Guardrails Orchestrator**


    The FMS Guardrails Orchestrator, developed by IBM Research and integrated with


    the TrustyAI project, is designed specifically to orchestrate the application
    of one


    or more guardrails in complex workflows. This framework addresses a common


    challenge in production LLM deployments: coordinating multiple safety checks that


    need to be applied at different stages of request processing.


    **172 **


    **| **


    **Chapter 5: Model Observability**'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'The Orchestrator provides a layer of abstraction that allows you to compose
    different


    guardrail types (such as input validation, output filtering, and PII detection)
    into


    cohesive safety pipelines. Each of them is called a *detector*, and the composition
    is


    particularly valuable when you need to apply different guardrail policies based
    on


    context, user roles, or the specific LLM being invoked.


    For Kubernetes deployments, the FMS Guardrails Orchestrator can be deployed as
    a


    service that sits between your application and the model server, intercepting
    requests


    and responses to apply configured safety policies. The integration with TrustyAI


    also provides monitoring capabilities, allowing you to track guardrail activations
    and


    violations as Prometheus metrics.


    **Guardrails AI**


    Guardrails AI takes a different, more developer-oriented approach compared to
    the


    infrastructure-focused frameworks described in the previous section. It is a Python


    library with a validator-based architecture and a centralized hub of prebuilt
    risk


    detectors. The framework serves two primary purposes: detecting and mitigating


    specific AI-related risks through input/output validation, and helping generate
    struc‐


    tured data from LLM responses.


    The key differentiator of Guardrails AI is the Guardrails Hub, which provides
    a


    library of community-contributed validators that can detect specific risks, such


    as toxic language, PII exposure, hallucinations, competitor mentions, or off-topic


    responses. These validators can be combined to create comprehensive guards tailored


    to your use case.


    Unlike frameworks that require learning a new configuration language or deploying


    separate orchestration services, Guardrails AI validators are Python functions
    that


    you integrate directly into your application code. The framework intercepts LLM


    inputs and outputs within your application, runs them through configured validators,


    and takes action based on the results, whether that’s blocking the request, logging
    the


    violation, or applying remediation.


    This developer-centric, code-level integration approach makes Guardrails AI particu‐


    larly attractive for teams that prefer to manage safety logic within their application


    layer rather than deploying additional infrastructure components. However, this
    also


    means it is less integrated with the Kubernetes ecosystem as compared to frameworks


    like NeMo Guardrails or FMS Guardrails Orchestrator, which can be deployed as


    standalone services. In Kubernetes environments, Guardrails AI is embedded directly


    into your application container code, making it simpler to deploy but potentially
    less


    flexible for centralized policy management across multiple services.


    **Model Safety: Hallucination and Guardrails **


    **| **



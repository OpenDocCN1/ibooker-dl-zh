- pgno: 186
  md: 'The traditional pod network interface is usually backed by an Ethernet connection


    that has up to 10–20 Gbps, while the bandwidth requirement is about one order
    of


    magnitude higher—about 500–600 Gbps!


    NVIDIA developed a specialized network stack to match a similar requirement. It
    is


    possible to connect multiple GPUs using NVLink and NVSwitch to break the limit
    of


    Tbps in some configurations.


    Other options that are not specific to NVIDIA hardware are based on Remote Direct


    Memory Access (RDMA) and RDMA over Converged Ethernet (RoCE) to reach up


    to 800 Gbps. InfiniBand is a famous RDMA implementation that was created many


    years before generative AI to support high-performance computing (HPC), and now


    similar configurations are not limited to supercomputers but might become more


    widely adopted with the evolution of generative AI workloads.


    After the introduction of the additional network requirements to support the distri‐


    bution of the serving runtime, we will now introduce two optimizations that can
    be


    implemented with a similar cluster available: distributed KV cache and disaggregated


    prefill:


    *Distributed KV cache*


    The KV cache has been mentioned many times already because it is a very critical


    aspect to make the LLM execution more efficient. The base intuition behind the


    distributed KV cache is simple: it would be great if we could store KV blocks
    in


    some external cache and reuse them when necessary.


    This approach has two main benefits: the KV cache instance size is no longer


    limited by the available memory, and it is possible to share blocks across different


    replicas. It is easy to imagine that this optimization has a positive impact only


    if the time to transfer KV cache data from one instance to another is very fast,


    in the range of milliseconds. The idea is quite natural, but the implementation


    is very complex, and two new projects have been created specifically with this


    focus: LMCache and NVIDIA Inference Xfer Library (NIXL). The claim from


    LMCache is “Redis for LLMs,” and it implements an API to cache KV blocks. The


    main benefit applies, as expected, to scenarios where the input prompt is very


    long (as usually happens with a RAG use case), so that the prefill phase doesn’t


    need to be performed for every new request.


    On the other hand, the NIXL project is a small library with a more specific


    goal: accelerate point-to-point communication for AI runtimes, providing an


    abstraction over the different types of memory (like GPU and CPU) and storage


    (from file to remote object store).


    **Disaggregated Serving **


    **| **


    **149**'

    Now let’s examine Kubernetes support for each component in more depth and, where


    it adds clarity, point to the associated patterns in *Kubernetes Patterns*:


    *Vector database*


    The vector store is the backbone of retrieval, and on Kubernetes it belongs in


    a StatefulSet with a PersistentVolumeClaim per replica, so shards have stable


    identities and data persists across restarts. If the vendor offers an operator,
    adopt


    it to encapsulate cluster setup and upgrades, and size memory so hot indexes stay


    resident while enabling approximate nearest neighbor (ANN) indexes for scale.


    Expose it on a cluster-internal service and use NetworkPolicies to restrict which


    pods can connect, then treat it like any critical database with snapshots and
    tested


    restores. This maps directly to the *Stateful Service* and *Service Discovery*
    patterns.


    *Embedding service*


    Embedding models can be deployed in different ways, depending on your per‐


    formance and operational needs. The most common production setup is to


    serve embeddings through a lightweight model server packaged as a deployment,


    which allows you to scale it independently and allocate either CPU or GPU


    resources as needed. For small, efficient models it may be simpler to embed


    directly in-process within the orchestrator, avoiding a network hop and keeping


    latency low. A middle ground is a sidecar in the orchestrator pod to share fate


    while versioning the model independently, as shown in Figure 8-9. The key is


    consistency between ingestion-time and query-time encoding, and the *sidecar*


    pattern fits well when you need a local helper without coupling builds. Some


    databases can generate embeddings in the database at write or query time; for


    example, Weaviate’s vectorizer modules can embed on write operations and


    at query, and Postgres with pgvector can drive automatic embedding via SQL


    triggers and extensions. This keeps ingestion and retrieval encoders aligned but


    increases coupling between the database and model choice. Whichever pattern


    you use, enforcing a single embedding model and configuration for both inges‐


    tion and query-time encoding is crucial.



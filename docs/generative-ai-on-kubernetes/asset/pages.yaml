  md: 'Therefore, MIG is best when you have fairly steady parallel uses for the GPU
    that


    each fit in a partition. For LLM and generative AI workloads, MIG is particularly


    useful for inference serving scenarios or running many smaller experiments. If
    you


    have a large model (that needs >40 GB, for instance), MIG won’t help—you need
    the


    full GPU or multiple GPUs. But if you’re hosting multiple smaller models (say,
    seven


    different language models each requiring ~5 GB), MIG can be very helpful, effectively


    giving each model its own *virtual* GPU with guaranteed memory.


    Interestingly, time slicing and MIG aren’t mutually exclusive. You can time slice
    MIG


    instances too. For example, you could split a GPU into two MIG instances, and
    then


    oversubscribe each MIG instance twice with time slicing. This would present four


    schedulable units per GPU. This is advanced and needed only in corner cases—but


    the operator does support it (appending `\-SHARED` to MIG device product labels
    if


    both are enabled). You might do this if you want the memory isolation of MIG (say,


    two big slices) but also want to occasionally run two pods in one slice. However,
    for


    most, it’s either MIG or time-shared, not both simultaneously, due to complexity
    in


    managing performance.


    To summarize the difference, MIG partitions a GPU into smaller dedicated slices


    (each with fixed memory and compute capacity), whereas time slicing treats the


    whole GPU as a single pool that multiple jobs take turns using, sharing time but
    not


    guaranteeing memory splits. MIG gives you isolation and predictability, while
    time


    slicing gives you flexibility and potentially higher utilization if not all jobs
    are busy


    at once. For LLM training (which often consumes entire GPUs or multiple GPUs),


    typically neither MIG nor time slicing is used—you just allocate GPUs exclusively.


    But for LLM inference and related workloads (fine-tuning smaller models, running


    many experiments, serving many models), both MIG and time slicing are very useful.


    A common pattern is to use MIG for strict multitenancy or production QA tests,
    and


    use time slicing in dev environments or for oversubscribing on less critical batch
    jobs


    where you don’t mind if they slow each other down. To verify that your GPU sharing


    configuration works as expected, `nvidia-smi` is your go-to diagnostic tool.



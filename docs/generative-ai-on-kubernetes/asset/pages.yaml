    position of the token in the vocabulary.


    Embedding is a process that generates a vector representation of the input, capturing


    its semantic meaning. This means that the distance between two embedding vectors


    is smaller if they represent semantically similar inputs, and larger if the inputs
    are not


    strongly related.


    In other words, consider this example: the tokens *dog* and *puppy* are related
    to each


    other, so their embedding representations produce vectors with a smaller distance


    compared to the embeddings for *dog* and *car*.


    Similar to the tokenizer, the model’s embedding layer is learned during training.
    At


    this stage, the token vocabulary is fixed, and each token ID is associated with
    a


    learned vector in an embedding matrix. These token embeddings capture a token’s


    typical semantic relationships to other tokens in a high-dimensional space. Later,


    as the model processes an input sequence, these static token embeddings are trans‐


    formed into contextual representations that depend on the surrounding tokens.


    See Figure I-2 for a simplified visual example of embeddings. If you want to learn


    more on the topic, we suggest “The Illustrated Word2vec” blogpost.


    ![](img/3a93443ca88ca3c8ef163f48ebd612bc_30_0.png)


    *Figure I-2. **Simplified** 2D representation of multidimensional embedding vectors*


    The embedding techniques described here are specific to text embeddings. However,


    it is also possible to convert image, video, or audio data and make it available
    to the


    model as part of a *multimodal* vocabulary. This is necessary when working with
    a


    multimodal model that supports additional input modalities, such as images or
    video,


    alongside text.



- pgno: 222
  md: 'For both full fine-tuning and PEFT approaches, Hugging Face provides the Trans‐


    former Reinforcement Learning (TRL) library, which includes SFTTrainer, a utility


    class that can load a model and perform various tuning techniques, including an


    evaluation step to compute accuracy.


    **What Is Supervised Fine-Tuning?**


    The name of the library SFTTrainer stands for Supervised Fine-Tuning Trainer.
    The


    term *supervised* is usually omitted when discussing fine-tuning because practitioners


    implicitly understand the process as supervised.


    While some techniques for unsupervised fine-tuning exist, the vast majority of
    meth‐


    ods require labeled data as input—data that has been classified by a human or
    another


    model. The reason is straightforward: for a model to learn a specific policy or
    piece of


    knowledge, the input dataset must contain the specific traits the model is expected
    to


    embed.


    However, labeled data for generative models differs from classification tasks.
    In classi‐


    fication, labels are discrete categories such as spam/not-spam, while for LLMs,
    the


    label is the complete expected output text. Training pairs consist of input-output


    sequences such as input “Translate to French: Hello” paired with output “Bonjour,”


    or input “Summarize: \[article\]” paired with output “The article discusses X,
    Y, and


    Z.” During training, the model learns by predicting the next word at each step
    in the


    output sequence and adjusting when it predicts incorrectly. Both classification
    and


    generation are “supervised” because training provides correct answers, but generation


    predicts sequences of tokens rather than single categories.


    The creation of a supervised input dataset is usually an expensive activity. As
    a result,


    these curated datasets are orders of magnitude smaller than the datasets used
    for


    unsupervised pre-training.


    **Fine-Tuning**


    Fine-tuning a model involves continuing the training process to embed additional


    knowledge or tasks, such as instruction following, question answering, or chat
    capa‐


    bilities. In other words, full fine-tuning changes all the model’s parameters,
    produc‐


    ing a distinct model that, while derived from the original, has been fully adapted
    to


    the new training data. This approach requires a considerable amount of labeled
    data


    (at least hundreds of thousands of new examples) to influence the model enough


    to learn new concepts. It is a very expensive activity. From a Kubernetes platform


    perspective, it requires many GPUs during the training phase and dedicated GPUs


    to serve the new model, as there is no efficient way to layer or merge it with
    the


    original at inference time. While this is the primary approach for predictive
    AI, full


    fine-tuning in generative AI is more challenging due to the high cost of preparing



- pgno: 40
  md: '**CHAPTER 1**


    **Deploying Models**


    Running models within your own cluster becomes necessary when real data cannot


    leave it due to privacy laws or compliance requirements, or when you need greater


    control over model deployment and performance.


    There are many different models on the market; many of them are open source and


    freely available for commercial use. Hugging Face is the largest community where


    you can find not only models but also datasets and libraries. For a list of current
    open


    source large language models, see Chapter 2.


    Regardless of where you obtained the model, whether it’s open source or not, there


    are aspects of deploying the model on Kubernetes that aren’t specific to the model


    itself. However, some aspects require careful analysis of the model to determine
    the


    best approach.


    This chapter describes different approaches and patterns for managing the lifecycle
    of


    your model at runtime, with a focus on some of the most-used runtimes for LLMs.


    Before diving into deployment details, see the following sidebar for background
    on


    the Transformer architecture that powers most modern LLMs.


    **3**'

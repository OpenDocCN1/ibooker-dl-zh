  md: 'GPU deployments and advanced network topologies, see the network optimiza‐


    tion and topology-aware scheduling sections in Chapter 7.


    `pipeline-parallel-size`


    Pipeline parallelism distributes the model layers across multiple GPUs, whereas


    tensor parallelism splits individual tensors. Both approaches are compatible and


    increase available KV cache memory, but tensor parallelism is more commonly


    used for multi-GPU inference on the same node.


    `data-parallel-size`


    Similar to pipeline parallelism, this approach splits data into parallel groups,


    enabling multinode serving across GPUs on different servers. This technique is


    applicable when a cluster contains more than one GPU-equipped server. While


    it increases available KV cache memory, it introduces the complexity of a multi‐


    node scenario, which requires dedicated connectivity.


    `cpu-offload-gb`


    This parameter offloads part of the model to the CPU, allowing deployment of


    models larger than the available GPU memory. While this seems useful for KV


    cache management, it significantly impacts throughput. It is strongly discouraged


    for production due to a massive performance drop and the loss of critical GPU-


    specific optimizations (e.g., specialized kernels), which are essential for efficient


    LLM serving.


    Using these parameters and knowing the characteristics of the workload is critical
    to


    tune the runtime to maximize the performance and match the expected service-level


    expectation. When this is not enough, it is possible to add more GPUs to the system,


    but it is also possible to consider additional optimizations thanks to the Kubernetes


    stack, and in particular the networking part, as described in “LLM-Aware Routing”


    on page 139.


    **Autoscaling**


    You’ve optimized the model and tuned the runtime parameters. But production


    deployments face another challenge: variable workload. Even with a perfectly tuned


    single instance, you’ll eventually need multiple replicas to handle peak traffic.


    In a real-time inference scenario, end user latency is critical. Monitor the Time
    To


    First Token (TTFT) and Inter-Token Latency (ITL) metrics to guide routing and


    scaling. For offline inference, focus on tuning batch size and throughput instead.


    Kubernetes has native support for horizontal pod autoscaling that dynamically
    bal‐


    ances requests across different replicas. However, LLM workloads present specific


    challenges: request cost varies dramatically by token count, GPU utilization doesn’t


    correlate with CPU/memory, and startup times can be lengthy. Similar challenges



- pgno: 15
  md: 'started to think about the best way to run GenAI in general, and specifically,
    LLM


    workloads in production. The journey of bringing GenAI workloads into production


    has evolved significantly. Initially, AI models were deployed ad hoc, with bespoke


    scripts and manual processes. As the field matured, frameworks like TensorFlow


    Serving and tools like MLflow emerged to streamline the deployment experience.


    However, the operational challenges of managing these workloads at scale required


    more sophisticated solutions. Kubernetes, with its powerful orchestration capabilities,


    began to play a crucial role in managing ML workloads, providing a scalable and


    resilient platform for deployment. Unlike traditional ML models, LLMs require
    speci‐


    alized infrastructure, including high-performance GPUs and distributed computing


    environments, to handle their size and computational demands.


    Deploying generative AI models, particularly LLMs, in a production environment


    is far from straightforward. The operational challenges are significant. Generative


    AI models require vast amounts of training data. After deployment, while individ‐


    ual inference requests typically process small amounts of data (like user prompts),


    some production scenarios such as retrieval-augmented generation (RAG) or batch


    processing may involve handling larger datasets. Moreover, the effective usage
    of


    expensive accelerators like GPUs is critical. These rare hardware resources are
    essen‐


    tial for the performance of LLMs, and the AI workload orchestration platform must


    ensure context-aware scheduling to optimize their utilization, ensuring efficient
    and


    cost-effective operation.


    In this book, we will address these challenges and show how Kubernetes can be
    used


    to successfully deploy and manage generative AI models at scale.


    **How This Book Is Structured**


    This book guides you through operationalizing generative AI models on Kubernetes,


    and is organized into four parts that reflect the practical journey from initial
    deploy‐


    ment to production-scale AI applications. Whether you’re a Kubernetes practitioner


    encountering AI workloads for the first time, or an MLOps engineer seeking to


    leverage Kubernetes more effectively, you’ll find the content builds on your existing


    knowledge while introducing new concepts progressively.


    Unlike traditional machine learning books that start with training, we begin with


    *inference*: deploying and serving pre-trained models. This reflects how most
    organi‐


    zations adopt generative AI today. You typically start with existing foundation
    models


    rather than building from scratch, making model serving the natural entry point
    for


    bringing AI capabilities into production.


    **xiv **


    **| **



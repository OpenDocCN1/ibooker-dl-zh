- pgno: 315
  md: 'Vector search predates LLMs in recommendations and multimedia deduplication,


    and breakthroughs such as HNSW graphs and FAISS made billion-scale similarity


    practical by trading perfect accuracy for speed. These algorithms return approxi‐


    mately correct results rather than guaranteed exact nearest neighbors.


    Popular choices of vector databases include open source databases like Milvus,
    Wea‐


    viate, and Qdrant, the managed service Pinecone, vector features in PostgreSQL
    via


    pgvector, and in Elasticsearch via dense vectors.


    These components work together to achieve RAG. Importantly, they map well to


    microservice boundaries, which is useful when we later deploy on Kubernetes. For


    instance, the vector database might be one service, the LLM another, and so on,


    allowing each to scale or be managed independently. Before we get into deployment,


    let’s now walk through the two distinct phases of a RAG pipeline: *document ingestion*


    and *user query processing*. Understanding these two flows will make it clearer
    how to


    build and operate RAG systems.


    **Document Ingestion**


    Document ingestion is the offline process that prepares your external data so
    it can


    be used for retrieval. In this phase, we take raw documents and convert them into


    embeddings stored in the vector database. Think of it as building the knowledge


    index that your application will later query. This process can happen up front
    like


    indexing a large corpus of company documents before the app goes live and continu‐


    ally as new data arrives.


    The ingestion pipeline runs asynchronously and independently from user query pro‐


    cessing. There is no blocking relationship between ingestion and query handling—


    users can query the vector database while ingestion jobs are running, and new
    docu‐


    ments become available for retrieval as soon as their embeddings are written to
    the


    store. In Kubernetes, you implement ingestion as Jobs or CronJobs that process
    docu‐


    ments in batches. Within each ingestion job, the processing steps (parsing, chunking,


    embedding, storing) can run sequentially in a single container for simplicity,
    or be


    distributed across multiple worker pods using message queues when high throughput


    is required. The pipeline writes results incrementally to the vector database,
    making


    newly indexed documents searchable immediately without waiting for the entire


    batch to complete.


    A typical ingestion pipeline involves several steps, as shown in Figure 8-7.


    **278 **



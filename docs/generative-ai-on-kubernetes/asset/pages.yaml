- pgno: 355
  md: 'When you need to attribute actions to individual users across system boundaries,


    OAuth2 provides the dominant standard for delegated access. OAuth2 enables a user


    to grant an application permission to act on their behalf without sharing credentials,


    which is exactly what we need when an agent calls upstream APIs on behalf of a
    user.


    While we do not cover OAuth2 comprehensively in this book, understanding token


    exchange—a key OAuth2 extension—is critical for agentic security patterns. Token


    exchange allows you to trade one credential for another with a different scope


    and audience, enabling fine-grained delegation that preserves both user and agent


    identity.


    **OAuth2 and the Model Context Protocol**


    The Model Context Protocol specification uses OAuth 2.1 for authorization when


    MCP servers require authenticated access. MCP servers act as OAuth Resource


    Servers, protecting their tools and resources with standard OAuth2 mechanisms.


    MCP implementations follow established OAuth2 specifications. MCP clients *must*


    implement OAuth 2.0 Authorization Server Metadata (RFC 8414) to discover authori‐


    zation endpoints. Implementations *should* support Dynamic Client Registration
    (RFC


    7591) to streamline setup. All clients *must* use Proof Key for Code Exchange
    (PKCE)


    for authorization code flows.


    For multiuser agentic systems requiring delegation semantics, RFC 8693 (Token


    Exchange) provides the mechanism to preserve both user and agent identities; we


    explore this pattern in detail in the next section.


    For comprehensive coverage of OAuth2 security patterns and delegation flows, see


    *Cloud Native Data Security with OAuth* by Gary Archer et al. (O’Reilly).


    **Delegated Identity via OAuth2 Token Exchange**


    The impersonation pattern preserves user context but introduces token lifetime


    complexity and scope explosion. The service account pattern simplifies operations


    but loses per-user attribution. OAuth2 Token Exchange (RFC 8693) provides both:


    a standards-based way to preserve user identity while making the calling service’s


    identity visible to upstream systems.


    Token exchange enables *delegation semantics* where the original user remains
    dis‐


    tinguishable from the service acting on their behalf. The exchanged token carries


    both identities in its claims: `sub` identifies the user on whose behalf work
    is being


    done (e.g., `alice@example.com`), while `act` identifies the current actor performing


    the work (e.g., `customer-support-agent` or `customer-data-mcp-server`). This
    dual-


    identity token allows services to enforce composite policies like “allow if the
    user has


    permission *and* the service is authorized for this operation.”


    **318 **


    **| **



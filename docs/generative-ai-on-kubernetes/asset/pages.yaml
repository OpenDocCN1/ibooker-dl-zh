    orders of magnitude slower and increasing job execution time dramatically.


    In this context, topology-aware refers to the physical interconnect architecture


    between GPUs. This includes whether GPUs are connected within a single node


    via NVLink or PCIe, across nodes through high-speed fabrics like InfiniBand or


    RoCE (RDMA over Converged Ethernet), or through standard Ethernet networking.


    The bandwidth and latency characteristics of these interconnects dramatically
    impact


    distributed training performance: NVLink provides up to 900 GBps bidirectional


    bandwidth between GPUs within the same node (with NVLink 4.0 on H100),


    InfiniBand offers 200–400 GBps across nodes with submicrosecond latency, while


    standard Ethernet typically delivers only 10–100 GBps with higher latency. The
    topic


    of bandwidth connecting different GPUs and the different technologies was discussed


    with similar concerns in the context of inference in “Single-Node Versus Multinode


    Inference” on page 110.


    In networking terminology, a *fabric* refers to the underlying network


    infrastructure that provides interconnected communication paths


    between multiple nodes or devices. Unlike traditional hierarchical


    network architectures with discrete layers, a fabric provides a mesh-


    like topology where multiple paths exist between endpoints, enabling


    high bandwidth and low latency communication.


    In the context of GPU computing, fabrics like InfiniBand or


    NVSwitch (a switching fabric for full mesh GPU connectivity


    within a server) provide the high-speed interconnect infrastructure


    that enables GPUs to communicate efficiently. This can be either


    within a single server (NVSwitch fabric connecting 8–16 GPUs)


    or across multiple servers (InfiniBand fabric connecting hundreds


    of nodes). The fabric abstracts the complexity of the underlying


    switching infrastructure, presenting a unified high-performance


    communication layer to distributed training workloads.


    *Topology-aware scheduling* extends gang scheduling by considering hardware topol‐


    ogy constraints when making placement decisions, ensuring that distributed training


    jobs are scheduled on nodes with the optimal interconnect configuration for their


    communication patterns.


    A training job requiring eight GPUs might achieve significantly better performance


    when all eight GPUs reside within a single eight-GPU node connected via NVLink,


    as compared to spreading those GPUs across eight single-GPU nodes communicating



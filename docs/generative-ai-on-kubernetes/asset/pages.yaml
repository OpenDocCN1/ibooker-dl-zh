  md: '**Operator ****Configuration**** with ClusterPolicy**


    The NVIDIA GPU Operator is available for multiple Kubernetes distributions,


    including OpenShift, where it comes out-of-the-box as part of the OperatorHub


    catalog. It can also be installed on standard Kubernetes clusters using Helm charts
    or


    custom manifests provided by NVIDIA, as shown in Example 3-10.



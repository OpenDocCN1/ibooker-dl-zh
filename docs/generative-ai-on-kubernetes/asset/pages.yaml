    services. Tool use comes in two execution paths that you can mix in one workflow:


    *Client-executed function tools*


    The model emits a function call with JSON arguments: your client code performs


    the action and posts the result back, keyed by a `call\_id`. This is the portable


    baseline for fine-grained control and audit in your control plane. Example 8-2


    shows the request-response flow in which the server response asks the client



    Hallucination and toxic content are part of a more general topic of *model safety*.


    Let’s now look at responsible AI and then apply some model safety techniques.


    Understanding responsible AI principles provides the foundation for implementing


    these safety guardrails effectively.


    **Responsible AI**


    Responsible AI is a field that groups all the principles and techniques to develop


    and manage AI solutions with the goal of enabling transparency and trust for all
    the


    involved stakeholders. It has ethical implications to avoid biases, and in general
    it


    aims to mitigate risks related to the adoption of AI.


    This goal cannot be achieved by focusing on a single specific aspect. Instead,
    it


    requires a framework that your organization must adopt at every level. From a


    certain perspective, you can compare the responsible AI mindset to the way your


    organization manages security: a dedicated security team that implements security


    policies doesn’t replace the fact that everyone must adopt proper security principles.


    Responsible AI terms cover different aspects; there is no single definition, but
    overall


    we can summarize them as *explainability* and *fairness*.


    More recently, LLMs became the main priority even for responsible AI—in particular,


    toxic content detection and hallucinations. We will briefly introduce the explainabil‐


    ity and fairness that applies mainly to predictive AI, and then focus specifically
    on


    model safety for LLMs in “Model Safety: Hallucination and Guardrails” on page
    169.


    **Explainability**


    Explainability is a pervasive topic because it spans model selection to postexecution


    analysis. It is the principle that human trust is based on the ability to understand


    *why* and *how* a model has produced a prediction, and not every model has the
    same


    level of intrinsic explainability. For example, a neural network is very powerful
    but


    hard for humans to understand because the knowledge is captured in the different


    layers and weights as numbers that humans cannot easily correlate with the actual


    inputs and outputs. Explainability techniques can explain overall model behavior



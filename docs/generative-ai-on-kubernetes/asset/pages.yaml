    declared. It specifies the image of the model server to use, along with some


    parameters and the type of model it can serve. This concept separates runtime


    configuration from model configuration. This separation gives project owners


    better control over model server versions, default configurations, and runtime


    lifecycle management. It is also possible to use a ClusterServingRuntime to con‐


    figure a runtime that is available for the whole cluster. See Example 1-10.



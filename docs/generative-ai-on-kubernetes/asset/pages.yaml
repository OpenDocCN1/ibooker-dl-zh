- pgno: 214
  md: '**PART III**


    **Tuning**


    This part covers LLM tuning, focusing on the operational challenges of managing


    and optimizing these demanding workloads in Kubernetes. A key distinction in the


    generative AI lifecycle is the shift from training to tuning. Unlike traditional
    machine


    learning, which often involves training a model from scratch, here we typically
    start


    with a large, pre-trained foundation model. Customization is an optional, subsequent


    step to specialize that model for a specific purpose. The goal is refinement,
    not


    creation from the ground up.


    While the techniques for model tuning are rapidly evolving, the operational hurdles


    of scheduling, resource management, and cost optimization remain constant.


    The chapters in this part cover how to address these challenges within the Kubernetes


    ecosystem:


    • Chapter 6, “Model Customization”, describes some of the techniques to custom‐


    •


    ize an LLM, with a focus on the common challenges and how projects in Kuber‐


    netes ecosystem solve them.


    • Chapter 7, “Job Scheduling Optimization”, focuses on job scheduling, quota


    •


    management, and tuning the GPU configuration for the tuning workload on


    Kubernetes.'

  md: 'While you can delete the job at any time, even while it’s running, this action


    also removes the TrainJob object and its associated metadata from Kubernetes.


    If you’re not using external experiment tracking, consider preserving completed


    jobs to maintain a record of training runs.


    **Some YAML Magic**


    A training job like the one in Example 6-6 requires many parameters, more than


    10, and if the job creation code runs inside a Jupyter Notebook, maybe using the


    Kubeflow Notebooks component, it is possible to easily configure all the parameters


    using the `yamlmagic` library.


    This project is a Python module that can be installed in a notebook via `pip install`


    `yamlmagic` and loaded via `%load\_ext yamlmagic`; after that, it is possible

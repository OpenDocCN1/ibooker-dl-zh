    5\. The *external tools* enable the agent to interact with the outside world.
    This could


    5.


    include databases to query, plotting libraries to generate graphs, SMTP services


    to send emails, or any other APIs the agent needs to accomplish its goal. The


    ReAct pattern and multiagent coordination discussed in “Agentic Workflows” on


    page 286 fall here—they are application-level control flows within your orches‐


    tration service.


    6\. The *task state database* tracks the agent’s progress and decisions. This
    provides an


    6.


    audit trail of what the agent did and allows recovery if the agent needs to restart


    (*StatefulSet + PVC*).


    7\. The *notifications/external** consumers* receive the final output or status
    updates.


    7.


    The agent may notify external systems when the workflow completes or if it


    encounters issues.


    The key characteristic is that these agents do not map to distinct Kubernetes
    resource


    kinds—you’ll run them within the deployment or job workloads. Architecturally,
    you


    must decide whether each multistep process runs synchronously (holding open a


    user request) or asynchronously (off the request path). Often, it’s safer to run
    long


    multistep agents asynchronously and then notify the user or system when done.


    Asynchronous patterns allow you to be more flexible with resource usage. If some‐


    thing isn’t urgent, you can run it at lower priority or when capacity is available.


    For example, if using spot instances or spare cycles, you might schedule noncritical


    LLM jobs there. Conversely, if an ambient agent is critical (say, watching for
    security


    intrusions), you treat it like any important service: ensure it’s highly available
    and


    fast enough, which might mean dedicating a pod that keeps an LLM model loaded


    in memory. Always-on agents incur constant cost since the pod runs continuously,


    whereas event-triggered jobs incur cost only per use—a classic trade-off between
    cost


    efficiency and responsiveness. We need to set those lifecycle boundaries intentionally:


    which processes can be spun up on demand (to save money) versus which must be


    pre-warmed and waiting (to meet latency targets).


    Now that we have covered popular architectural choices for designing AI-infused


    applications, let’s focus on the AI Orchestrator component that is central to
    any AI


    application architecture. For that we will revisit the popular concepts, starting
    with a


    technique for grounding LLMs in your domain data.



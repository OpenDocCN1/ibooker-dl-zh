  md: '![](img/3a93443ca88ca3c8ef163f48ebd612bc_195_0.png)


    KServe has different deployment modes, as previously described


    in “KServe” on page 20. The monitoring works differently when


    Knative mode is used because multiple containers in the pod run


    the model: the sidecars for Knative and Istio run in coordination


    with the main container where the model server is executed.


    Prometheus configuration assumes a single endpoint to scrape,


    which means we risk missing important information from other


    containers. To address this, the KServe project has developed


    a metric aggregator component (named `qpext`) that scrapes met‐


    rics from all containers and exposes a single aggregated metrics


    endpoint.


    Use the `serving.kserve.io/enable-metric-aggregation` annota‐


    tion to enable this behavior.


    This aggregation is not necessary when Standard mode is used


    because the deployment has a single container.


    After configuring the export of model server metrics, see “Model Server Metrics”
    on


    page 160 for a discussion of the most important metrics. But first, let’s look
    at the


    tracing stack.


    **Tracing**


    Observability in Kubernetes involves multiple aspects: we can access container
    logs to


    gain full visibility into what the component (in this case, the model server)
    is doing,


    and we use aggregated metrics for trends and time-series indicators. However,
    what


    we still lack is the ability to trace the execution flow of a single request.


    The evolution of tracing best practices in Kubernetes mirrors the development
    of


    metrics: it is not natively integrated, but the OpenTelemetry project has defined


    concepts and formats that have become the de facto standard.


    OpenTelemetry specification for tracing defines that every request has an identifier


    used to correlate the execution flow that can span multiple steps during the execu‐


    tion, making tracing very different compared to metrics. In a real-world scenario,


    multiple components are involved during request processing in addition to the
    model


    server, such as firewalls or gateways acting as preprocessors or postprocessors.
    All


    of these components must implement the protocol to propagate the identifier and


    produce tracing information. Unlike metrics that are pulled by a collector, trace


    information is pushed to the exporter by the component.


    **158 **



  md: 'Let’s begin by examining label-based scheduling, which offers fine-grained
    control


    over GPU workload placement.


    **Label-Based Scheduling**


    When a cluster contains several different kinds of GPUs, or when operators want


    to fence off GPU nodes from general workloads, labels become the steering wheel.


    Kubernetes offers three closely related mechanisms, each adding a different degree
    of


    control: `nodeSelector`, node affinity, and taints with tolerations.


    **nodeSelector**


    `nodeSelector` is the most direct approach. You attach a fixed label to every
    node that


    matches a certain characteristic, then repeat that exact key-value pair in the
    pod spec’s


    `nodeSelector` field. Instead of creating custom labels manually, you can leverage
    the


    GPU-specific labels that the NFD and GFD operators automatically attach to nodes.


    See “GPU Discovery” on page 82 for details and the GPU-related labels that are


    available for selection.


    As seen in Example 3-3, the beauty of `nodeSelector` is its simplicity. A single
    line


    pins the workload to the desired node pool, with no extra scheduler overhead.


    However, the rule is absolute: if the label is missing or misspelled, the pod
    won’t


    schedule. `nodeSelector` also can’t express alternatives; it’s “T4 or nothing.”


    *Example 3-3. Direct selection of a node with a node selector*


    `**apiVersion**``:`` ``v1`


    `**kind**``:`` ``Pod`


    `**metadata**``:`


    ` ``**name**``:`` ``t4-inference`


    `**spec**``:`


    ` ``**containers**``:`


    ` ``\-`` ``**name**``:`` ``server`


    ` ``**image**``:`` ``myrepo/llm-server:latest`


    ` ``**nodeSelector**``:`


    ` ``*\# Select only nodes that are labelled for a Tesla T4 GPU*`


    ` ``**nvidia.com/gpu.product**``:`` ``Tesla-T4`


    **Node ****affinity**


    Node affinity builds on the same idea but allows richer expressions and soft prefer‐


    ences. Required terms act like an extended selector, while preferred terms let
    you


    nudge the scheduler toward the best node when several satisfy the hard constraints.


    Example 3-4 demonstrates this flexibility. This example relies on the labels added
    by


    the GFD, as described in “GPU Feature Discovery” on page 84.



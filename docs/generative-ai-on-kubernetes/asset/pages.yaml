- pgno: 313
  md: '*Embedding model*


    The model that converts text or other modalities into embedding vectors during


    ingestion and at query time. During document ingestion, the embedding model


    transforms each document or document chunk into a numerical vector, which


    is then stored in the vector database. At query time, the same embedding model


    converts the user’s query into a vector so we can search for similar documents


    by searching for other embedding vectors that are close to the query vector.


    The quality of these embeddings directly affects retrieval relevance. Quality
    here


    means that semantically similar documents map to vectors that are close to


    each other in the high-dimensional vector space. You might use an open source


    sentence transformer, a proprietary API (e.g., OpenAI embeddings), or even the


    LLM’s own embedding capabilities, if available. The crucial point is to use the


    *same embedding model* for both indexing and querying. Note that the embedding


    model can be different from the LLM you use for generation; many production


    RAG systems use a specialized small embedding model for retrieval and a sepa‐


    rate, often much larger, LLM for generating responses. Consistency is key: if
    you


    update or change the embedding model, you will likely need to re-embed your


    documents to maintain search accuracy.


    *Reranker*


    This is an optional component that improves the relevance of retrieved results.


    Typically, a reranker is a second-stage model or heuristic that takes the initial
    set


    of results from the vector search and orders or filters them by how useful they
    are


    likely to be for answering the query. For example, a simple approach might rank


    by similarity score or document metadata like recency or source trust level. More


    advanced setups use a cross-encoder model or even the LLM itself to score each


    candidate snippet in the context of the question. Incorporating a reranker can


    boost answer quality by ensuring only the most pertinent pieces of information


    get into the final prompt. The trade-off is extra complexity and latency, so


    whether you use a reranker depends on your application’s requirements.


    *AI Orchestrator*


    The AI Orchestrator is the glue of the RAG system. As we saw in “Architectural


    Patterns” on page 262, this central role is common to all AI-driven applications.


    It handles the overall query workflow. When a user’s request comes in, the


    AI Orchestrator is responsible for calling the embedding model to embed the


    query, performing the vector database similarity search, optionally invoking the


    reranker to refine results, constructing the augmented prompt with retrieved


    text, calling the LLM service to get an answer, and post-processing and return‐


    ing the result. The AI Orchestrator could be a custom REST API service you


    write, an API layer such as Llama Stack, or a local AI framework that manages


    chains of calls like LangChain. The AI Orchestrator also often implements any


    application-specific rules or guardrails, that, for instance, handle cases where



    **Ambient Agents**


    *Ambient agents* run continuously in the background and react to signals from
    their


    environment rather than waiting for an interactive prompt. They live alongside
    your


    systems and take action when triggers fire: a new file appears, a row changes,
    a sensor


    crosses a threshold, or a timer goes off. Think of them as passive until needed;
    they


    do not start conversations, though they can (but do not need to) ask a human before


    they act.


    A practical example is a Kubernetes caretaker that monitors cluster health signals


    for crash loops or CPU pressure and immediately investigates by querying logs
    and


    comparing recent metrics. If the findings match a known pattern, the agent attempts


    a targeted remedy like restarting a deployment, rolling back a config, or scaling
    out


    a service, and escalates to a human only when automated actions fail or when policy


    marks the situation as high risk. The involved components of such an ambient agent


    setup are shown in Figure 8-13.



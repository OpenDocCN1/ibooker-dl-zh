    In *agent identity*, the agent runtime sends its own ServiceAccount token to the
    MCP


    server, and the MCP server relays that token to the upstream API. The upstream
    API


    enforces permissions based on the agent runtime’s identity, allowing different
    agent


    runtimes to have different access levels, even when calling the same MCP server.


    Figure 9-4 illustrates both flows side by side.



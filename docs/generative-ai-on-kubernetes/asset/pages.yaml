  md: 'no relevant documents are found or enforce that certain data sources must be


    included. The AI Orchestrator may also implement *source attribution*, tracking


    which document chunks were used to generate the response and returning


    links or IDs that point back to the original source documents. This citation


    tracking enhances transparency and allows users to verify information, typically


    by preserving chunk metadata (URLs, titles, timestamps) through the retrieval


    and ranking stages and including them in the final response as footnotes, inline


    citations, or a references list.


    *LLM service*


    Finally, the LLM itself is the component that generates the answer for the end


    user. The LLM takes the prompt assembled by the orchestrator (which includes


    the user’s question plus retrieved context) and produces a completion. In a RAG


    setup, the LLM’s job is constrained to generation. It doesn’t need to have all


    knowledge internally; instead it relies on the provided context for facts. This


    service could be a model deployment running in your cluster, like we have


    described in Chapter 1, or a call to an external API like OpenAI. The LLM


    service should be treated like any other dependent service: you send it a request


    and get back a response, and the AI Orchestrator then delivers that response to


    the user, often after some formatting or verification.


    **Vector Databases in a Nutshell**


    A vector database (also called a vector store) specializes in fast similarity
    search so a


    RAG pipeline can fetch the document chunks most similar to a user’s query and
    pass


    them to the LLM. Documents and queries are mapped by an embedding model to a


    single vector in high-dimensional space where semantic neighbors lie close together,


    and similarity is typically scored with cosine similarity.


    Cosine similarity measures how much two vectors point in the same direction. In


    two dimensions you can picture two arrows from the origin forming an angle theta,


    and cosine similarity is the cosine of that angle: 1.0 when they point the same
    way,


    0.0 when they are perpendicular, and –1.0 when they point in opposite directions.


    This orientation focus is useful for text embeddings because scaling a vector
    does not


    change its meaning, while direction preserves semantics.


    Hybrid search combines dense vector matching with lexical ranking such as BM25
    so


    you capture both semantic relatedness and exact-token signals. Engines typically
    fuse


    scores or run a two-stage pipeline with an optional reranker, which helps especially


    for rare terms, identifiers, and exact phrases while keeping semantic recall high.


    Modern systems accelerate search with approximate nearest-neighbor indexes and


    add filtering, durability, and distribution to meet production SLAs.


    **Retrieval-Augmented Generation **



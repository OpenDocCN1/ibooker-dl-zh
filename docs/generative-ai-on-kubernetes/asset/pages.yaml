    *Other concepts and APIs*


    KServe API is very flexible and includes many other concepts that are not strictly


    necessary to deploy an LLM but that enable more advanced and composable use


    cases. It is possible to configure an inference logger to forward every input
    and


    output of the model to a logger service for auditing or training purposes, do


    some preprocessing and postprocessing, or even compose different models using


    an InferenceGraph. See the KServe Control Plane API for a more comprehensive


    documentation.


    One of the main benefits of the split between ServingRuntime and InferenceService
    is


    a more defined ownership in terms of management because the runtime lifecycle
    and


    model lifecycle are very different. KServe also provides additional benefits like
    the


    support of multiple storage options: the KServe controller injects an `initContainer`


    called storage initializer that reads the location of the model, performs the
    download


    (if necessary), and copies the model to a folder in the model server. It is also
    possible


    to replace the storage initializer container using the ClusterStorageContainer
    API


    with a custom one to support custom protocols for centralizing a catalog of available


    models. We will cover in more detail how to package, register, and load a model
    in


    Chapter 2.


    KServe is actively evolving to provide better support for LLM-specific requirements


    through a new API surface (see the next section).


    **From InferenceService to LLMInferenceService**


    KServe 0.16 introduced a new LLMInferenceService CustomResourceDefinition specif‐


    ically designed to manage complex and large-scale LLM deployments. While the


    traditional InferenceService API works for basic LLM serving, LLMInferenceService


    provides specialized capabilities for advanced deployment topologies that are
    common


    in production Generative AI workloads, including intelligent routing with KV cache-


    aware scheduling, disaggregated serving, and multinode distributed inference.


    From an implementation perspective, LLMInferenceService uses the Standard


    deployment mode, creating plain Kubernetes Deployment resources, reflecting a


    fundamental shift in how LLM workloads are managed. This evolution requires



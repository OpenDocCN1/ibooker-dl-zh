- pgno: 35
  md: 'With the fundamentals in place and the landscape mapped, let’s dive into the
    details


    and explore what each part covers, beginning with the foundation of LLM operations


    on Kubernetes: inference.


    **Inference**


    The most common use case for running GenAI on Kubernetes is to offer querying


    the model as a service. This process is known as *inference*. Inference involves
    using


    the trained model to generate predictions or outputs based on new inputs. To serve


    these models to a wide range of users, they must be deployed in a scalable and


    reliable manner. This is where Kubernetes shines, offering a robust platform for


    operationalizing inference at scale.


    Kubernetes orchestration manages GPU allocation, scheduling, and self-healing
    for


    inference workloads. Containers provide consistent execution environments, while


    extensions like KServe add ML-specific capabilities: autoscaling, canary rollouts,
    and


    built-in monitoring. Role-Based Access Control (RBAC) enforces granular policies


    for managing and accessing model services.


    To understand what you’re deploying, Table I-1 shows some examples of popular


    foundation models and their resource requirements.



    From a Kubernetes platform perspective, Ray is definitely less familiar in terms
    of


    API and management when compared to KServe, but at the same time it enables data


    scientists and Python developers to have full control over deployment. This flexibility


    brings a lot of value, especially when you need to configure a more complex serving


    topology, like distributed serving or training on multiple hosts.


    **Lessons Learned**


    In this chapter we explored the components necessary to deploy LLMs on Kuber‐


    netes, from basic model serving to production-ready orchestration.


    Model servers like vLLM, TGI, and SGLang provide essential optimizations


    (PagedAttention, FlashAttention, and continuous batching) that directly impact


    throughput and latency. While you can containerize inference code with FastAPI,


    production workloads demand specialized runtimes that maximize GPU utilization


    and efficiently manage memory-bound decode phases.


    The separation between serving runtime configuration and model lifecycle man‐


    agement reflects operational reality. KServe provides InferenceService with Serving‐


    Runtime for general model serving, and introduces LLMInferenceService with


    LLMInferenceServiceConfig for complex LLM deployments requiring distributed


    inference and advanced routing.


    This separation acknowledges that runtime upgrades, model deployments, and infra‐


    structure changes operate on different schedules with different ownership. Platform


    teams can manage runtime versions and container images, while data science teams


    deploy and iterate on models independently, preventing conflicts and enabling
    paral‐


    lel workflows.


    Deployment controller choice involves fundamental trade-offs. KServe integrates


    natively with Kubernetes primitives (deployments, services, ingress), making it
    famil‐


    iar to platform operators but requiring additional components for features like


    autoscaling. Ray provides a Python-first development experience with built-in
    dis‐


    tributed serving capabilities, but introduces its own orchestration layer that
    partially



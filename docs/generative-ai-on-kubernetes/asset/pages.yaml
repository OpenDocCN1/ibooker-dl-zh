- pgno: 211
  md: '![](img/3a93443ca88ca3c8ef163f48ebd612bc_211_0.png)


    **Llama Stack and moderation APIs**


    Llama Stack, created by Meta, defines a comprehensive set of APIs for building


    generative AI applications, including a dedicated safety layer through its *Safety
    API*


    with configurable *shields* (guardrails). This API allows developers to register
    safety


    shields with specific configurations and apply them at both input and output stages
    of


    LLM interactions.


    The Safety API supports multiple shield types, from basic content moderation with


    Llama Guard models to advanced custom safety policies for domain-specific require‐


    ments. Shields can be applied with fine-grained control; for example, different
    shields


    for user inputs versus model outputs, or contextual shields that adapt based on


    conversation state.


    Llama Stack also provides a moderation endpoint at `/v1/moderations` that mirrors


    the concept of OpenAI’s Moderation API. This OpenAI Moderation API is a speci‐


    alized model endpoint that classifies text inputs across categories like hate
    speech,


    self-harm, sexual content, and violence. The API returns category scores and binary


    flags indicating whether content violates each policy.


    The advantage of using moderation APIs like OpenAI’s or Llama Stack’s is that
    they


    provide pre-trained, continuously updated models specifically designed for safety


    classification without requiring you to deploy and maintain separate guardrail
    mod‐


    els. However, they are typically less customizable than framework-based approaches


    like NeMo Guardrails or Guardrails AI, and relying on external APIs introduces


    network latency and potential vendor dependencies.


    For Kubernetes deployments, Llama Stack can be deployed as a service that your


    applications call to apply shields, or you can integrate the Llama Stack SDK directly


    into your application containers. The moderation API approach works best for asyn‐


    chronous validation workflows where a small percentage of requests is sampled
    and


    evaluated without blocking user-facing responses.


    Many of the guardrailing techniques described earlier rely on *LLM*


    *as a judge*, an emerging pattern where one LLM evaluates the


    output of another LLM (or even its own output).


    When implementing LLM as a judge for safety detection or for


    any other evaluation prompt, be very specific in your evaluation


    questions. Instead of asking “Is this answer right?”, ask targeted


    questions like “Is the tone of this answer formal?” or “Does this


    response include personal information?” Specific, focused evalua‐


    tion criteria produce more reliable and consistent judgments from


    your judge model.


    **174 **


    **| **


    **Chapter 5: Model Observability**'

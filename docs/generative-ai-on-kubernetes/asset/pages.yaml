  md: '**Language Model Evaluation**


    The evaluation of a language model can target many different aspects such as measur‐


    ing how knowledgeable a model is, or the model’s ability to produce content without


    toxic language, or even how good a model is with reasoning tasks. This definition
    is


    not specific to LLMs; the same principle applies to many traditional language
    models


    defined before the LLM era.


    One of the most important applications of language evaluation is to verify model


    safety with specific tasks to measure model toxicity or robustness.


    Many different projects provide one or more evaluation benchmarks; one of the


    most-used suites is EleutherAI’s `lm-evaluation-harness` that includes more than


    one hundred out-of-the-box tasks. There are other libraries too, and new evaluation


    techniques are often defined to test the models in scenarios that are increasingly


    complex.


    Traditionally, an evaluation task includes a dataset with a set of inputs and
    outputs to


    use (usually as multichoice questionnaires to simplify the analysis), and an evaluation


    function to compute the metric. This format makes it very easy for a subject matter


    expert to review the dataset, and it can be easily grouped into subtopics to better


    categorize the model’s abilities.


    Each benchmark is essentially a procedure that invokes the target model with a
    set


    of predefined question-answer pairs and analyzes the results, so it takes time
    (even


    hours) to run it, and the model must be deployed, so it can be very expensive


    to perform. Fortunately, for all the most-used models it is possible to find online


    leaderboards that collect the evaluation results for multiple benchmarks, allowing
    for


    easy comparison.


    A leaderboard is a table where different models are compared using one or more


    metrics. At the same time, the usage of similar leaderboards has security and
    trust


    implications because there is no way to verify if the published numbers are true


    without locally re-executing the test. The general advice is to use the leaderboards
    to


    perform the initial assessment to produce a short list of models, and then perform


    additional analysis.



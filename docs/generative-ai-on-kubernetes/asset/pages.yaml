  md: 'This layered approach gives you speed and allows queries. Your analytics team
    can


    run reports against long-term memory in the database to understand agent behavior


    patterns. The compliance team can audit conversation logs with proper retention


    policies and the engineering team can debug issues by querying production data
    with


    SQL. Your users get fast responses because the short-term memory-critical path
    stays


    in memory.


    For simple agents—internal tools, development environments, or purely ephemeral


    conversations—start with a KV store for short-term memory alone. Add a database


    for long-term memory when you hit one of these requirements: regulatory compli‐


    ance that demands immutable audit trails, analytics needs that require cross-session


    queries, or data retention policies that exceed what you want to keep in your
    KV


    store. The KV store remains your short-term memory performance layer; the data‐


    base becomes your long-term memory durability and querying layer.


    **Checkpointing for Long-Running Agents**


    Some agents execute workflows that span hours or even days. Consider a research


    agent that needs to review hundreds of documents, extract key findings, and synthe‐


    size a comprehensive report. Or you can use a testing agent that runs a suite
    of


    experiments, analyzes results, and generates recommendations. These long-running


    processes need a different pattern: checkpointing for saving the intermediate
    results.


    The idea is simple. After completing each major step in the workflow, the agent
    saves


    a checkpoint containing its current state and progress. If the pod is evicted
    or crashes,


    the agent can resume from the most recent checkpoint rather than starting from


    scratch. This pattern is especially valuable on Kubernetes where pods are ephemeral


    and can be rescheduled at any time.


    Example 9-14 provides a basic checkpoint implementation, ignoring any user context.


    *Example 9-14. Simple checkpoint algorithm*


    `**import**`` ``**json**`


    `**from**`` ``**pathlib**`` ``**import**`` ``Path`


    `**def**`` ``save\_checkpoint``(``step``: ``int``, ``state``: ``dict``):`


    ` ``*\# Store checkpoints on a PersistentVolume mounted at /data*`


    ` ``checkpoint\_dir`` ``\=`` ``Path``(``"/data/checkpoints"``)`


    ` ``checkpoint\_dir``.``mkdir``(``exist\_ok``\=``**True**``)`


    ` ``*\# Save state as JSON with a sequential step number*`


    ` (``checkpoint\_dir`` ``/`` f``"step\_``{``step``:``03d``}``.json"``)``.``write\_text``(``json``.``dumps``(``state``))`


    `**def**`` ``load\_latest\_checkpoint``() ``\->`` ``tuple``\[``int``, ``dict``\]:`


    ` ``checkpoint\_dir`` ``\=`` ``Path``(``"/data/checkpoints"``)`


    ` ``*\# Find all existing checkpoints and sort by filename*`


    ` ``checkpoints`` ``\=`` ``sorted``(``checkpoint\_dir``.``glob``(``"step\_\*.json"``))`



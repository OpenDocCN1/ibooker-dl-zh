  md: 'on priorities and current workload. LoRA-aware routing is one of the key use
    cases,


    allowing intelligent distribution of requests to pods serving specific model adapters.


    Gateway API Inference Extension has been designed with the idea of extending the


    routing decision logic to be increasingly more specific for the LLM workload.
    *Envoy*


    *proxy* is the core component that enables this flexibility. It is a highly scalable
    HTTP


    proxy implementation used for many different use cases thanks to the ability to
    plug


    custom processing logic via External Processing. The External Processing (`ext\_proc`)


    filter defines a gRPC protocol that can be implemented by external services to
    be


    registered as a processing step that can read and modify both the HTTP headers
    and


    the request body.


    The Gateway API Inference Extension project adopts the External Processing concept


    to define the Endpoint Picker protocol (EPP). An Endpoint Picker, as the name


    suggests, can pick an endpoint from the InferencePool, and each implementation
    of


    this component must support the Envoy External Processing protocol so that it
    can


    be invoked by the Envoy proxy during processing.


    One of the most interesting Endpoint Picker implementations is the inference-


    scheduler that is part of the llm-d project (see “Disaggregated Serving” on page
    148


    for more details). This specific Endpoint Picker implementation supports different


    filters and scoring logic; for example, it is possible to configure metrics scraping
    from


    the different vLLM instances and use the `vllm:num\_requests\_waiting` metric
    to pick


    the replica with the lowest number of requests waiting.


    From a Kubernetes perspective, each Endpoint Picker is a different deployment
    that


    is usually deployed in the same namespace where the model is deployed, but it
    is not


    required. The only requirement is that it has access to the container where vLLM
    is


    running to collect the metrics and that the instance of the gateway (Envoy proxy)


    can reach the Endpoint Picker. The communication can be secured via mTLS or in


    general via certificate.


    In “Disaggregated Serving” on page 148, the Inference Gateway will be used together


    with other components in a more complicated setup to distribute the inference


    workload, but the usage of a smarter routing logic has already had a big impact
    on


    scalability.


    Gateway API Inference Extension is not the only option, and neither is it the
    only


    open source project focusing on the creation of an AI gateway. The Envoy AI Gate‐


    way is another project using Envoy proxy to build AI gateway capabilities, reusing
    the


    Gateway API Inference Extension and extending it with other user-facing features,


    like token-based rate limiting and security. Another example is the vLLM Production


    Stack project that has introduced an external and sharable KV cache storage to


    extend the benefit of reusing the KV cache content across different instances.



- pgno: 189
  md: '**Lessons Learned**


    In this chapter we explored the continuous optimization required for production


    LLM inference across model selection, runtime configuration, and infrastructure


    topology.


    Model selection cannot rely solely on parameter count or general benchmarks. Task-


    specific evaluation using domain-relevant datasets reveals accuracy differences
    that


    general leaderboards obscure. Compression techniques like quantization and pruning


    reduce memory footprint and improve throughput, but quality degradation varies


    by model architecture. Benchmark your specific workload before committing to a


    compression strategy.


    Autoscaling LLM workloads differs fundamentally from traditional application scal‐


    ing. Token-based metrics (TTFT, TPOT) and KV cache utilization provide better


    scaling signals than request rate or CPU usage. Scale-to-zero remains impractical


    for most LLM deployments due to model loading times measured in minutes, not


    seconds. Pre-warming replicas and setting conservative minimum replica counts


    prevent the cold-start latency spikes that destroy user experience.


    vLLM startup optimization directly impacts deployment velocity and recovery time.


    Model caching on persistent volumes, optimized container images, and strategic
    use


    of init containers reduce initialization from minutes to seconds. These optimizations


    compound during rollouts, autoscaling events, and failure recovery.


    Request routing strategies affect both latency and cost. Cache-aware routing that


    directs similar requests to the same replica maximizes KV cache hit rates, reduc‐


    ing redundant computation. Disaggregated serving architectures separate prefill


    and decode phases across specialized hardware, enabling independent scaling of


    compute-bound and memory-bound workloads.


    Advanced topologies like disaggregated serving introduce operational complexity


    that requires specialized Kubernetes resources like LeaderWorkerSet, topology-aware


    scheduling, and high-bandwidth networking. These patterns mirror distributed train‐


    ing workloads more than traditional stateless services, demanding infrastructure


    planning that considers GPU interconnect topology and network bandwidth along‐


    side compute capacity.


    With all these optimizations in place, the next question becomes: how do you know


    they are working? The next chapter explores observability for LLM workloads, cover‐


    ing the metrics, logs, and traces that reveal whether your production setup performs


    as expected.


    **152 **


    **| **


    **Chapter 4: Running in Production**'

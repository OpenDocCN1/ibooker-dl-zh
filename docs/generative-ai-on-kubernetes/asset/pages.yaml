  md: '*Gang scheduling*, also known as *coscheduling*, is a scheduling strategy that
    ensures all


    pods belonging to the same distributed job are scheduled together as a single
    atomic


    unit. Either all pods are scheduled simultaneously or none are. This scheduling


    technique uses a queue where the pods remain in a pending state without assigning


    resources until the scheduler can guarantee that sufficient resources exist across
    the


    cluster to satisfy the complete job requirement.


    The gang scheduling problem is not new to Kubernetes or specific for distributed


    training jobs, but it affects them more because of GPU scarcity and cost. Kubernetes


    has been designed to be pluggable, and different projects can be used to address
    this


    challenge.


    **PyTorch Rendezvous and Gang Scheduling**


    PyTorch’s distributed training relies on a rendezvous mechanism that combines
    peer


    discovery with barrier synchronization. When a distributed training job starts,
    all


    workers connect to a rendezvous backend (typically a TCP-based key-value store
    or


    etcd) to:


    1\. Discover all other workers in the training job


    1.


    2\. Agree on the complete set of participants and assign ranks (0 to `world\_size-1`)


    2.


    3\. Synchronize at a barrier—no worker proceeds until all workers arrive


    3.


    4\. Exchange connection information for peer-to-peer communication


    4.


    This rendezvous barrier is atomic and blocking: if the scheduler places seven
    out


    of eight workers but the eighth cannot be scheduled due to resource fragmentation,


    the seven scheduled workers will wait indefinitely at the rendezvous barrier.
    Those


    seven GPUs remain allocated but idle, consuming cost while producing no training


    progress.


    Gang scheduling solves this by ensuring all eight workers schedule simultaneously


    or none schedule at all, preventing partial deployments that deadlock at rendezvous.


    While PyTorch’s elastic training (`torch.distributed.elastic`) can handle dynamic


    worker sets, most LLM training uses static configurations where the worker count
    is


    fixed and all must be present.


    **Comparing Gang Scheduling Solutions**


    Several approaches exist for implementing gang scheduling on Kubernetes, each


    operating at different layers of the stack and serving different use cases. Table
    7-2


    describes the main options. Understanding the distinctions between these solutions


    helps platform administrators select the appropriate technology for their training


    workloads.


    **Gang Scheduling **



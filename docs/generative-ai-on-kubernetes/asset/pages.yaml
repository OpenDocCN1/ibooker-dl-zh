- pgno: 218
  md: '**Model Tuning, Model Customization, and Post-Training**


    *Model tuning* is a general term for various fine-tuning techniques and is not
    specific


    to LLMs, as it also applies to predictive AI.


    *Model customization* is a broader term that encompasses all techniques used to


    modify an LLM or to learn new tasks. Some of these methods differ compared to


    traditional fine-tuning and may require multiple steps, including human interaction.


    *Post-training* refers to the specific phase in the LLM creation pipeline where
    model


    customization occurs. This step can be applied multiple times to incrementally
    inject


    new policies or knowledge into the model.


    These terms are often used interchangeably in this book because they all involve
    modi‐


    fying a model and present similar operational challenges on a Kubernetes platform.


    The primary difference that makes LLMs unique from traditional predictive AI


    models is their versatility. A single LLM can perform a large number of different


    tasks, whereas a traditional machine learning model is specialized for just one.
    This


    versatility is why we covered inference first: you can often adapt an existing
    LLM for


    different use cases without any training at all.


    Before diving into training techniques, it’s worth understanding when you don’t
    need


    to train. Many use cases can be solved through alternatives that avoid the complexity


    and cost entirely.


    **Prompt and Context Engineering**


    The real power of LLMs is that they work without modification. Through careful


    engineering of inputs and context, you can often achieve your goals without training.


    These alternatives aren’t just simpler, they are often the right choice.


    *Prompt engineering* is the process of crafting detailed and specific instructions


    (prompts) to guide an LLM’s output. This set of instructions is critical to maximize


    the accuracy of the response. This field is becoming a specialization in its own
    right,


    with best practices for communicating effectively with an LLM to obtain the most


    accurate results.


    Effective prompt engineering is not just about specifying the task; it also involves


    describing:


    • The scenario (e.g., “This is an airline company named ABC”)


    •


    • The role the model should take (e.g., “You are an AI-assistant chatbot to help


    •


    customers”)


    **Prompt and Context Engineering **


    **| **


    **181**'

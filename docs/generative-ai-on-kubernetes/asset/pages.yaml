  md: '![](img/3a93443ca88ca3c8ef163f48ebd612bc_51_0.png)


    Assuming you have a powerful machine with at least 24 GB of


    memory, but even without GPU, running quantized LLMs locally is


    remarkably straightforward using tools built on top of llama.cpp.


    Ollama provides a simple CLI interface to download and run mod‐


    els with a single command:


    `ollama`` ``run`` ``llama3.2:3b`


    Ramalama offers similar simplicity with support for multiple


    model registries and container runtimes:


    `ramalama`` ``run`` ``llama3.2:3b`


    Both tools use llama.cpp behind the scenes to handle model execu‐


    tion and expose an OpenAI-compatible API for inference. While


    Ramalama provides stronger isolation through container-based


    execution, Ollama offers a more polished developer experience


    with easier model management. Both are ideal for local develop‐


    ment, experimentation, and prototyping before deploying to pro‐


    duction Kubernetes clusters.


    **NVIDIA NIM**


    NVIDIA is the leading provider of GPU for AI and also provides the necessary soft‐


    ware to train and serve models. NVIDIA NIM is a solution designed for Kubernetes


    to simplify the deployment and optimization of an LLM on NVIDIA hardware. It


    takes a different approach with a curated container image per model family, where


    models are directly tested and published by NVIDIA. Check the supported model
    list


    (like Llama and Mistral) in the documentation. This approach aims to simplify
    the


    deployment configuration having pre-optimized model profiles.


    Similar to TGI, NVIDIA NIM supports multiple inference backends: TensorRT-LLM


    (an open source library for optimizing LLM inference on NVIDIA GPUs), vLLM,


    and SGLang. NIM automatically selects the optimal backend based on available


    model profiles for the detected GPU hardware, with a preference order of TensorRT-


    LLM > vLLM > SGLang. The selection is automatic based on the availability of


    pre-optimized TensorRT engines and other parameters. This hardware-aware back‐


    end selection allows users to benefit from the most suitable inference engine
    without


    manual configuration.


    Beyond backend selection, NVIDIA NIM stands out due to its opinionated design


    offering some notable features: local caching of the model and hardware optimiza‐


    tion. Local caching is supported by a PersistentVolume, aiming to simplify and
    speed


    up one of the major pain points of model serving for LLMs: loading time. The


    model is downloaded only once, and subsequent replica creations or restarts do
    not


    trigger another download. Hardware optimization is another key feature: NVIDIA


    NIM can detect available accelerators, select the most suitable model variant
    for the



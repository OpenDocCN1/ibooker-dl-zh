    The vLLM runtime greedily utilizes available resources to maximize throughput.


    Therefore, having more resources directly improves performance. In a perfect sce‐


    nario, vLLM has enough GPU memory to load the model into VRAM. It also has


    enough space for activations (the intermediate results of each neural network
    layer)


    and for the KV cache. This ensures that the runtime never needs to evict and


    recompute data that’s still necessary.



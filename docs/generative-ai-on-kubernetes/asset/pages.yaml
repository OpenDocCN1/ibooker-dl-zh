  md: '**OCI Image for Storing Model Data**


    In 2013 Docker invented a clever layered format for storing container blueprints.
    The


    original and still prevalent usage for those images is to store beside the kernel
    all the


    binaries and files that make up a Linux operating system. It is a layered format
    so that


    users can create *base images* that can be reused for different specialized images,
    for


    example, those containing the applications that will be run in a container. Multiple


    containers share layers when running if they refer to the same layers.


    In addition to the read-only layers of an image, Docker uses a union filesystem
    that


    adds a read-write layer on top of the image layer stack, so that different container


    instances can still share the same underlying operating system files. One key
    benefit


    of this schema is that the read-only layers can be cached individually, which
    makes


    working with OCI images very efficient as only changed layers need to be distributed.


    We don’t go into much detail about the concrete format here as many aspects are
    not


    relevant when we store model data in such layers. For the moment it is important


    that you can share layers and that an OCI image is built up hierarchically; i.e.,
    the


    layers are stacked. This stacking matches nicely for model composition techniques


    like finetuning with Low-Rank Adaptation (LoRA) adapters on top of foundational


    models. We will see more about LoRA in “Low-Rank Adaptation” on page 187. These


    foundational models, stored in base images, can be shared when running on the


    cluster nodes, which makes it very efficient to run multiple specialized fine-tuned


    models.


    Figure 2-8 shows how such images are composed. At the end, all layers are packed


    into a tar archive that is stored in an OCI Registry.


    ![](img/3a93443ca88ca3c8ef163f48ebd612bc_102_0.png)


    *Figure 2-8. OCI image consists of multiple **filesystem** layers*


    **OCI Image for Storing Model Data **



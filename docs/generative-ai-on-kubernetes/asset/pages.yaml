- pgno: 343
  md: '*Service Account Delegation*


    Kubernetes ServiceAccount tokens authenticate communication between agent,


    MCP server, and upstream APIs within a cluster.


    *Delegated Identity via OAuth2 Token Exchange*


    Token exchange (RFC 8693) creates credentials carrying both user identity and


    agent identity, combining attribution with service-level visibility.


    *Mutual TLS with SPIFFE/SPIRE*


    Cryptographically bound workload identities and short-lived certificates enable


    zero-trust authentication without stealable tokens.


    Let’s start with the most straightforward approach: passing the user’s token through


    the entire call chain.


    **Agent Impersonation (Token Passthrough)**


    To propagate user identity, the agent represents or *impersonates* the user for
    any MCP


    interactions. The advantage of impersonation is that it preserves your existing
    RBAC


    infrastructure without modification. Your audit logs naturally capture which end
    user


    accessed which data, satisfying compliance requirements in one stroke. You can
    also


    enforce per-user quotas and rate limits, preventing a single user from exhausting


    shared resources.


    In the agent impersonation pattern, the MCP server receives the end user’s creden‐


    tials from the agent runtime and uses them directly when calling upstream APIs.


    The upstream service sees the request as coming from the user, not from the agent.


    This is conceptually similar to the OAuth2 token passthrough pattern: the agent


    runtime passes the user’s access token to the MCP server, which includes it in
    the


    Authorization header when calling the upstream API.


    Consider Nurse Alice querying patient records through a medical assistant agent.


    The nurse authenticates to the agent runtime via OpenID Connect, obtaining an


    access token. When the nurse asks, “Show me lab results for patient 4711,” the
    agent


    runtime forwards the nurse’s token to the MCP server along with the tool request.


    The MCP server then calls the hospital’s patient records API with Alice’s token
    in


    the Authorization header. The patient records API enforces its existing user-level


    permissions—checking whether this specific nurse is allowed to read records for


    patient 4711—and the audit log shows that Nurse Alice accessed patient 4711’s
    lab


    results, not just that “the agent” accessed them.


    The pattern does introduce operational complexity around token lifetimes. User


    access tokens typically expire within minutes to hours, and if your agent’s task
    runs


    longer than the token’s lifetime, calls will fail unless you implement refresh
    logic.


    You also face scope explosion. The user’s token must be valid for every upstream


    API the agent might call, which often means granting users broad OAuth scopes
    that



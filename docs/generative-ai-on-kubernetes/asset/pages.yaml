- pgno: 230
  md: '![](img/3a93443ca88ca3c8ef163f48ebd612bc_230_0.png)


    *Figure 6-7. **Kubeflow** Trainer architecture*


    TrainingRuntime (or ClusterTrainingRuntime for cluster-wide configuration) is


    equivalent to KServe’s ServingRuntime, which was described for inference in


    “KServe” on page 20. It’s a template that declares the availability of a runtime,
    such


    as PyTorch, including its container image and other options. Similar to a Serving‐


    Runtime, a TrainingRuntime is visible only in the namespace where you create it,


    and TrainJobs must be in the same namespace to use it. A ClusterTrainingRuntime,


    however, is visible to the entire cluster.


    Kubeflow Trainer supports multiple frameworks for distributed training, such as


    PyTorch, DeepSpeed, MLX, and MPI. Because of this multiframework design, a


    TrainingRuntime requires a mandatory `trainer.kubeflow.org/framework` label.


    The SDK uses this label to apply the correct configuration for the specified frame‐


    work (e.g., `torch` for PyTorch) and its trainer.


    The trainer represents the library that uses the framework to define and perform
    the


    training job—it can be a BuiltinTrainer or a CustomTrainer.


    A BuiltinTrainer, like TorchTune, provides a predefined training script for common


    use cases like LLM fine-tuning, requiring only parameters for the input dataset
    and


    LoRA configuration. While less flexible, it’s easier to start with. On the other
    hand, a


    CustomTrainer gives the user full control by allowing them to define a Python
    function


    containing the entire training process. This approach gives the data scientist
    maximum


    flexibility, while the administrator only needs to define the TrainingRuntime
    with the


    compatible framework.


    The TrainJob object defines the training code and references a training runtime.
    As


    mentioned before, the SDK simplifies the configuration so data scientists don’t
    need


    to write it manually.


    Once the TrainJob is created, the Kubeflow Trainer controller merges it with the


    TrainingRuntime to produce a JobSet and the corresponding Kubernetes jobs.


    **Running Tuning Jobs on Kubernetes **


    **| **


    **193**'

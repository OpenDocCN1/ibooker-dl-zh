  md: 'This section of the spec configures the head and worker nodes of Ray Cluster.


    The version of Ray should be specified here and in the images to use.


    The head node exposes multiple components in addition to the serving aspect,


    like dashboard or client.


    As in some previous examples, it is possible to configure tolerations and taints

    IDs, for


    more fine-grained selection.


    However, NFD labels primarily indicate the existence of certain hardware devices


    rather than detailed GPU specifications, like the GPU model, memory size, or CUDA


    capabilities. For deeper GPU-specific insights, NVIDIA provides a specialized
    tool



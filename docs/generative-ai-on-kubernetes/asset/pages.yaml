    **OpenAI’s Responses API**


    OpenAI’s Responses API is designed for agentic workflows in a single, stateful


    API call. The Responses API introduced features that simplify agent development:


    automatic conversation state across turns, structured outputs, integrated tool
    usage,


    streaming of intermediate tool events, and built-in error handling.


    You send the user input and a catalog of tools with JSON Schemas, and the service


    can autonomously sequence tool calls, feed observations back into the model, and


    return a final answer. Two execution paths can coexist in one flow. *Server-side*


    *tools* run within OpenAI’s runtime, including tools accessed via the Model Context


    Protocol (MCP), and you receive streamed events and the final answer without


    implementing the loop client-side. We have more to say about MCP in “The Model


    Context Protocol” on page 303. *Client-executed function tools* let the model
    emit a


    tool call with name and JSON arguments; your service performs the action, and
    you


    resume by posting the result so the model can continue and finish.


    Importantly, the Responses interface is rapidly becoming a de facto standard,
    formal‐


    ized by the Open Responses initiative as an open specification. Several backends


    already implement compatible endpoints. Meta’s Llama Stack ships an OpenAI-


    compatible interface and a Responses implementation that is usable but still in
    active


    development, enabling self-hosted agent runtimes on Kubernetes without changing


    client code. vLLM has introduced a Responses entry point in its OpenAI-compatible


    server and is progressing rapidly as of early 2026, so it’s definitely worthwhile
    to


    check it out. OpenAI’s own cookbook and community guides also reference vLLM


    offering a Responses-compatible API, underscoring the ecosystem’s convergence
    on


    this contract. In parallel, LiteLLM provides a proxy that exposes a `/responses`
    end‐


    point and routes to multiple providers, giving teams a compatibility layer while
    the


    various servers continue to mature.



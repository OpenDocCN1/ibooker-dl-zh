- pgno: 41
  md: '**Transformer Architecture and Attention Mechanism**


    Generative AI is a vast field, and the maturity levels of different model classes
    vary


    significantly, with text generation models being the most widely used and optimized.


    Modern LLMs are predominantly based on *Transformer architecture* or a derivative


    (like the *mixture of expert* approach), although Transformers are also used beyond


    text for vision and multimodal tasks. These models can cover multiple use cases
    that


    involve text processing: chatbot, code generation, translation, summarization,
    etc.


    Transformer architecture is a deep learning architecture created and introduced
    by


    Google in 2017 to be more efficient in long-range dependencies tracking via Atten‐


    tion mechanisms. The main advantage of this architecture, compared to others like


    recurrent neural networks (RNNs), is that it doesn’t have recurring units. This
    means


    it doesn’t use the output of one neuron as the input to another. This makes it
    highly


    parallelizable during training.


    Long-range dependency is a core concept in natural language processing: the mean‐


    ing of a sentence is influenced by the context.


    The attention mechanism mimics human attention by assigning different weights
    (or


    importance) to various components of a sentence. In particular, a multihead attention


    mechanism runs an attention mechanism in parallel several times to produce differ‐


    ent outputs that are then finally concatenated and linearly transformed.


    For more information on Transformer architecture and attention, see the article


    “How do Transformers work?”.


    **“It Works on My Machine”**


    Before we explore deploying models on Kubernetes clusters, let’s first understand


    how to run a model locally on your machine.


    In a nutshell, deploying a model requires both the model itself and a runtime
    capable


    of loading and executing it. As mentioned, Transformer-based models are the most


    common LLMs. Therefore, you can use the Transformers library from Hugging Face


    to load the model and invoke it. This doesn’t mean that every laptop can handle


    similar workloads, nor that models of every size can be loaded. It’s possible
    to


    execute some models using CPU with very limited performance (tens of seconds to


    produce a full sentence). However, a GPU is essentially required. Moreover, memory


    requirements are directly related to the size of the model. A model with 7 billion


    parameters (aka 7B) is considered a *small language model (SLM)* and requires
    a GPU


    with about 15 GB of memory to be loaded. A 70B model requires about 140 GB of


    memory.


    See Example 1-1 for a code example that illustrates this approach.


    **4 **


    **| **


    **Chapter 1: Deploying Models**'

  md: '*Inference Perf*


    Inference Perf is a GenAI inference performance benchmarking tool proposed


    and incubated by the Kubernetes WG-Serving group and sponsored by the


    Kubernetes SIG Scalability. This community effort includes support from dif‐


    ferent companies. It is specialized for generative AI, and you can specify an


    arbitrary dataset to simulate a scenario that is similar to a real-world situation.


    The library can run locally or deploy in a cluster connecting to a previously


    deployed model with the assumption that it exposes an OpenAI-compatible API.


    *vLLM benchmark suite*


    Performance is a critical aspect for inference engines like vLLM, which provides


    publicly available nightly benchmark jobs with instructions. It is not a proper


    tool but more like a set of scripts that can be used to measure the performance
    of


    a specific model or hardware configuration.


    As mentioned before, while other traditional load generators can be used, this
    would


    require implementing the LLM-specific metrics like Time to First Token (TTFT)


    and Inter-Token Latency (ITL). Whatever tool has been selected to measure the


    performance, the integration in the CI/CD system is usually quite straightforward


    and is enough to create a task that deploys the model and then performs the test


    using the tool. The most critical aspect is to use an environment that is equivalent


    to the production cluster, especially regarding the model and the number of GPUs


    where the model is deployed.


    Integrating the performance test in the release pipeline and storing the result
    is


    critical to properly size the cluster and learn the capacity limits. These numbers
    are


    critical for capacity planning and for configuring rate limiting or the API gateway.


    **vLLM Runtime Parameters Tuning**


    “Understanding LLM Fundamentals” on page xxv explained how the inference of


    LLM works, which metrics are important to monitor, and how important the KV


    cache is to make LLM serving efficient. The model is now compressed and ready


    to be deployed. Thanks to the performance tests, data related to overall system


    performance can be used to guide the runtime tuning.


    This section is specific to vLLM runtime, but most of the content applies to other


    LLM runtimes, too.


    The development of a vLLM project is very active; new optimizations and new


    models are added weekly. Improved defaults are implemented in every release, so
    in


    most cases it does not need to be tuned, and *it just works*. The only aspects
    that vLLM


    cannot easily infer automatically are the type of workload and the assigned hardware;


    this is where it is possible to help the engine with the configuration.



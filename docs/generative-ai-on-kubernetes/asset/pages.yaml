    **Advanced Tuning Techniques**


    Full fine-tuning and PEFT are not the only ways to tune a model; new and more


    complex techniques are constantly emerging. Many of these new approaches involve


    multistep workflows rather than a single training loop, which can include using
    syn‐


    thetic data produced by the model in a previous iteration. Some of the most common


    advanced techniques include: Group Relative Policy Optimization (GRPO), Direct


    Preference Optimization (DPO), model distillation, model merging, and reward


    modeling.


    This book will not cover these advanced methods in detail, as each technique is
    a


    complex topic. They are also very different; for example, GRPO is an innovation
    from


    the DeepSeek team, while InstructLAB is a full methodology from IBM Research


    for *alignment tuning*. For more information, see the Transformer Reinforcement


    Learning (TRL) library from Hugging Face, which collects many of these techniques


    with dedicated trainer classes.



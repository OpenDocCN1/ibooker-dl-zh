    Platform administrators must implement comprehensive observability spanning


    three dimensions: application-level training metrics that track model performance


    and convergence, infrastructure metrics that monitor resource utilization (i.e.,
    GPU)


    and job health, and distributed systems metrics that capture communication patterns


    and coordination overhead.


    **Metrics Collection for Distributed Training**


    We already covered in “GPU Usage Monitoring” on page 164 how to track GPU


    metrics, so this section focuses on the other components:


    *Training metrics*


    Training metrics capture the actual model performance and learning progress,


    providing visibility into whether training runs are converging toward desired


    accuracy targets or diverging due to hyperparameter misconfiguration. Modern


    training frameworks integrate with experiment tracking systems that record met‐


    rics like training loss, validation loss, accuracy, learning rate schedules, and
    cus‐


    tom application-specific metrics defined by data scientists. TensorBoard is part


    of the TensorFlow ecosystem but has emerged as the de facto standard for visual‐


    izing training metrics in PyTorch too. It is integrated and trains code logs metrics


    using `torch.utils.tensorboard.SummaryWriter` or `tf.summary`. TensorBoard


    server instances read these logs to provide web-based dashboards showing metric


    trends over training steps and epochs. In Kubernetes deployments, TensorBoard


    typically runs as a separate deployment or pod that mounts the same persistent


    volume where training jobs write their logs, enabling data scientists to monitor


    training progress in real-time while jobs execute across distributed worker pods.


    TensorBoard works within a single run, while comparing metrics across multiple


    training runs requires other tools like MLflow or Weights & Biases.



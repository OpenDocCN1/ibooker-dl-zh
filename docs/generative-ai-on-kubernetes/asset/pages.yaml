    **Sub-GPU Allocation**


    The NVIDIA GPU Operator supports advanced GPU features for partitioning or


    slicing a single GPU among multiple workloads. While sub-GPU resource allocation


    might not have big relevance for operating LLMs, it’s still important to understand
    to


    optimize your GPU usage.


    The operator supports two modes, which can also be combined:


    *Time slicing*


    Allows multiple containers to share a GPU by allocating time-based slices.


    *MIG*


    Available on certain GPUs (like A100 and H100) to partition a single GPU into


    isolated instances.


    One of the powerful capabilities that the NVIDIA GPU Operator enables is sharing


    a GPU among multiple workloads. This is especially relevant for AI inference or


    serving multiple models, where you might not always need an entire GPU for each


    process.


    Let’s demystify these.


    **Time slicing**


    By default, if a pod requests a GPU (`nvidia.com/gpu: 1` in its resource require‐


    ments), Kubernetes grants it exclusive access to one physical GPU. Time slicing


    is a feature that allows oversubscription of GPUs—i.e., advertising more than
    one


    virtual GPU per physical GPU, so the scheduler can place multiple pods on the
    same


    GPU simultaneously. The NVIDIA device plug-in (when configured accordingly)


    will create GPU replicas for each real GPU. For example, you could configure one


    physical GPU to be represented as four devices, allowing up to four pods to each
    get


    what they think is one GPU, all actually running on the same hardware. The GPU


    workloads of these pods will interleave in time on the single GPU. Think of it
    like


    CPU time-sharing: if you have a 16-core CPU, you could schedule more than 16


    CPU-bound processes by context switching. Each gets a slice of time on the cores,
    but


    not all can run at full speed simultaneously. GPU time slicing works the same
    way.


    **98 **



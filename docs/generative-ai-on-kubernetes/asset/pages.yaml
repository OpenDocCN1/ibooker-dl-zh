- pgno: 173
  md: 'In this section we covered the challenges of configuring a proper autoscaler
    strategy


    for LLM deployments. When there are multiple replicas, another challenge requires


    attention: the tune load balancing strategy. If the load balancer is not LLM-aware,
    it


    can produce a suboptimal distribution of the request and impact the stability
    of system


    latency. This challenge is described and addressed in “LLM-Aware Routing” on page
    139.


    **Optimize vLLM Startup Time**


    In “Autoscaling” on page 132 we learned how to introduce a more specialized


    autoscaler configuration for LLMs, but in a real-world scenario, dynamic scaling


    is not applicable if the time to start a new replica is many minutes.


    The size of LLMs stretches the core design principles behind Kubernetes itself:
    some


    of the biggest LLMs can require almost 1 TB of storage just to store the model
    itself.


    They are *large*.


    This aspect makes it hard to configure an efficient autoscaling strategy that
    can detect


    workload peak and scale the deployment on the fly. There is a physical bottleneck
    in


    the time to transfer a similar amount of data.


    Performing proper capacity planning, together with performance and scalability
    tests,


    is in general a good practice before deploying an application in production. This


    general advice is even more critical with LLMs.


    Optimizing the model’s loading time is a multiphase activity that starts with
    the pack‐


    aging of the model. This aspect is described in detail in Chapter 2, but this
    section


    focuses on the following steps that are performed, from creating the deployment
    in


    Kubernetes to when the runtime is ready to process requests:


    *1\. Runtime image provisioning*


    Like any other traditional workload in Kubernetes, the vLLM runtime is wrapped


    in a container that is pulled from a registry to the Kubernetes node. The image


    size of vLLM is not small, usually few gigabytes (less than 5 GB), and most of


    the space is usually for the GPU framework, like CUDA in the case of NVIDIA,


    so it cannot be removed. By default the download of the image from the registry


    to the node is performed on the fly when the image is required by a pod.


    The frequency of this activity is specified with the `imagePullPolicy` property,


    and it is important to avoid the `Always` value to keep the image from being


    downloaded for every replica or new deployment. In a production configuration


    it’s usually configured with `IfNotPresent` so that the download happens only


    the first time, or even with `Never`, making sure that the image is prepulled
    to


    the node. When the image is already available on the node, the time to load it


    is very limited, so to optimize this step, the only aspect to pay attention to
    is


    to avoid `Always` as `imagePullPolicy`. Additionally, for production deployments


    it’s recommended to use specific version tags (e.g., `vllm/vllm-openai:v0.12.0`)


    **136 **


    **| **


    **Chapter 4: Running in Production**'

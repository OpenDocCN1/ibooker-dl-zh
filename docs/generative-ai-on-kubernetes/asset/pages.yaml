    of Kubeflow.


    At its core, Kubeflow takes advantage of Kubernetes principles, with all tasks,
    includ‐


    ing model registration and training, defined as containerized workloads. Unlike


    MLflow, which is a more flexible experiment tracking and model management tool,


    Kubeflow offers deeper Kubernetes integration through CustomResourceDefinitions


    (CRDs), manifests, and native controllers for each ML lifecycle component.


    ![](img/3a93443ca88ca3c8ef163f48ebd612bc_92_0.png)


    *Figure 2-7. **Kubeflow** architecture and how it interacts with its Model Registry*


    The Kubeflow Model Registry serves as a central repository for managing machine


    learning models, their versions, and related metadata. It substantially simplifies
    the


    transition from experimentation to production deployments.


    At its core, the registry uses a flexible entity-relationship model for metadata
    storage


    in a backend relational database (MySQL). This model, inspired by Google’s ML


    Metadata project, provides a structured, scalable approach to storing model lineage,


    metrics, and parameters. The Kubeflow Model Registry can standardize metadata,


    enable version control, and offer interoperability across Kubeflow components.
    This


    allows for robust tracking of model versions and the reuse of metadata for deploy‐


    ment or pipeline triggers.


    The registry relies on external dependencies such as MySQL for metadata storage,


    with a persistent volume required for durability. This needs to be taken into
    account


    when operating the registry in production setups. It exposes REST APIs and a Python


    SDK for interaction.


    **Model Registry **



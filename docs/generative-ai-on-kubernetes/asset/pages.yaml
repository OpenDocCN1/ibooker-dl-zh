    Read-only mounts deliver two performance advantages. First, the operating system


    can apply aggressive filesystem caching since it knows the data won’t change.
    Second,


    there’s no lock contention between replicas attempting concurrent access, eliminating


    coordination overhead that would occur with read-write mounts.



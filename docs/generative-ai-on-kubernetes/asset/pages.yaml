- pgno: 145
  md: 'It also produces lower latency per token since GPUs compute in parallel.


    These advantages make tensor parallelism attractive for large models, but it requires


    significant overhead. Tensor parallelism adds frequent communication overhead—


    GPUs must sync after processing each layer or attention head. If the interconnect
    is


    not fast enough, communication can dominate runtime (in poorly partitioned cases,


    communication can consume 50 to 70% of inference time).


    For this reason, tensor parallelism is best confined to single-node setups with
    high-


    bandwidth links (PCIe with NVLink or NVSwitch, as described in “NVLink and


    NVSwitch: NVIDIA GPU Interconnects” on page 106). In fact, fine-grained tensor


    parallelism across multiple nodes with standard networking is not advisable due
    to


    latency costs. We talk in more detail about single-node versus multinode setup
    for


    GPU usage later in “Single-Node Versus Multinode Inference” on page 110. In prac‐


    tice, the maximum tensor parallel degree is often the number of GPUs in one server


    (e.g., four-way tensor parallelism on a four-GPU node). Beyond that, one should


    either use a machine with more GPUs or switch to pipeline parallelism between


    nodes, which we explore next.


    **Pipeline parallelism**


    Pipeline parallelism splits the model vertically by layers, assigning different
    consecu‐


    tive layers to different GPUs, as illustrated in Figure 3-4. In this approach,
    the first


    few layers on GPU 0 process the input sequence. They then pass the intermediate


    activations to GPU 1 for the subsequent layers. This process continues through



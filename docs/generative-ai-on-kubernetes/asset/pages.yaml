- pgno: 208
  md: '*Example 5-7. Prompt to validate user input using Llama Guard*


    `\[INST\] Task: Check if the content of ''user'' messages in the `


    ` conversations our policies described with the below categories.`


    `<BEGIN UNSAFE CONTENT CATEGORIES> `


    `O1: Violence and Hate.`


    `Should not`


    `**\-**`` ``Promote or suggest people to use violence.`


    `...`


    `Can`


    `**\-**`` ``Describe what violence is.`


    `...`


    `<END UNSAFE CONTENT CATEGORIES>`


    `<BEGIN CONVERSATION> `


    `...`


    `<END CONVERSATION>`


    `Provide safety assessment with following format: `


    `**\-**`` ``First line must be ''safe'' or ''unsafe''`


    `**\-**`` ``If unsafe, second line must include comma-separated list of`


    ` violated categories.`


    In a chat with LLM you can define different roles, and this instruction specifies
    to


    Llama Guard to check only user messages.


    In this section you can configure to detect one or more categories that are


    considered inappropriate; the more specific you are under `Should not` and `Can`,


    the better.


    After this tag, include the conversation that you want to verify.


    It is critical to be specific in how you expect the result to be provided so that
    it


    can easily be parsed to decide how to proceed.


    This technique is very powerful but also expensive both in terms of resource usage


    and latency introduced: you need to deploy another LLM to check the conversation,


    and the evaluation requires the full conversation because safety assessment cannot


    be done token by token; understandably, this introduces a considerable delay on
    the


    end user side. It is critical to consider smaller and more specialized models
    and tech‐


    niques to implement safety guardrails so that you can find the best cost-performance


    trade-off for your use case.


    The composition of the guardian model with end user request flow can be done


    programmatically with custom orchestration code, but there is ongoing work to


    include this aspect in AI/LLM gateway components that we covered in Chapter 4.


    **Model Safety: Hallucination and Guardrails **


    **| **



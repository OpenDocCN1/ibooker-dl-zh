  img_proc: true
- pgno: 23
  md: '![](img/3a93443ca88ca3c8ef163f48ebd612bc_23_0.png)


    *Figure I-1. Exponential parameter growth and expanding data led to a phase transition*


    *where model capabilities suddenly emerged, though data growth has since plateaued*


    And with these advancements came new challenges, especially in managing the


    infrastructure required to handle such massive workloads. For example, as OpenAI


    detailed in its report on scaling Kubernetes to 7,500 nodes, Kubernetes emerged
    as


    a critical tool for orchestrating the immense computational needs of models like


    GPT-3. Its ability to autoscale clusters, dynamically adjust infrastructure, and
    control


    costs made it an essential part of deploying these large models efficiently.


    Most of us don’t deal with clusters at the scale of OpenAI, but the underlying
    prin‐


    ciples they developed are relevant for any Kubernetes environment, whether you’re


    running LLMs on a small cluster or at “web scale.”


    As Kubernetes experts working on Red Hat OpenShift AI, we (the authors) were used


    to supporting traditional workloads—web applications, API services, and databases—


    but running LLMs? That was a whole new ballgame. Our first experience with these


    computational monsters was both exciting and overwhelming. These models were


    like “translucent” black boxes: we knew they were huge, needed GPUs and persistent


    volume space, and required health checks, but beyond that, the inner workings
    were


    opaque.


    We still remember our first attempt vividly. It was a disaster. The models took
    ages


    to initialize, enabling GPU usage felt like falling down a rabbit hole, and CrashLoop‐


    BackOff errors kept happening. The response times were embarrassingly slow. It


    became clear that we had to rethink how Kubernetes was handling these workloads.


    **xxii **


    **| **


    **Introduction**'

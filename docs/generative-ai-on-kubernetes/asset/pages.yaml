- pgno: 71
  md: 'Even smaller models can pose significant challenges for Kubernetes administrators


    when managing them efficiently within a cluster. Understanding how to store and


    organize these large datasets effectively is critical for a successful LLM operation.


    In this chapter, we will explore how to manage data-heavy artifacts efficiently
    within


    a Kubernetes cluster. Most of the time, ML models can be treated as opaque boxes,


    accessed by the inference services described in Chapter 1. However, understanding


    the package formats used to distribute these models is still valuable for successful


    integration. The next section provides an overview of the most important LLM


    storage formats.


    Another critical aspect of operating LLMs is discovering where to find and how
    to


    retrieve model data. The concept of *model registries*, discussed in “Model Registry”
    on


    page 46, offers a practical solution for model discovery and access.


    Finally, the models must be downloaded into the cluster to be usable. “Accessing


    Model Data in Kubernetes” on page 59 outlines Kubernetes-native methods for effi‐


    ciently fetching and accessing model data.


    With this road map in mind, let’s start by examining how LLM data is packaged
    and


    stored.


    **Model Data Storage Formats**


    The first thing we notice when working with LLMs is their massive size, measured


    in billions of parameters. However, models shared on platforms like Hugging Face


    contain more than just the raw weight parameters. These distributed models also


    include metadata and, in some cases, the model’s architecture, which defines how
    the


    neural network layers and transformers are wired together.


    For operators, such distributed models often feel like black boxes. Yet, understanding


    which format they are stored in is critical because not every packaged model can
    run


    with every runtime, as described in Chapter 1. Some formats are highly flexible
    and


    can be operated by multiple runtimes, while others are closely tied to specific
    runtime



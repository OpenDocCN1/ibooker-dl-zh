  md: 'The takeaway is portability: you can standardize client code on the Responses
    API


    while choosing where to run the agentic loop—OpenAI’s cloud, a self-hosted Llama


    Stack, or a vLLM-based service on your cluster—and swap as your operational needs


    evolve.


    Human-in-the-loop fits naturally into this flow. You can pause on model-requested


    actions to ask a user for approval, collect additional inputs, or escalate to
    a reviewer


    before resuming, and you can enforce approval gates for sensitive tools so the
    model


    cannot proceed until you confirm. When using remote providers via MCP, the API


    can surface explicit approval requests for those calls, which gives you an auditable


    checkpoint before any side effect happens.


    In short, Responses provides *agentic reasoning* as a service while letting you
    control


    which tools exist, which calls execute on your side, and when to require approval.
    The


    growing set of compatible backends makes it a pragmatic choice for portable agent


    architectures.


    **Agents on Kubernetes**


    In “Agentic Frameworks and Runtimes” on page 290 we categorized popular libraries


    and API services you can use to implement an agentic workflow. In this section
    we


    focus on deployment models for agent-enabled applications on Kubernetes and show


    what Kubernetes-native integrations look like in practice. We keep this high level:


    refer to Chapter 9 for deeper operational details.


    Kubernetes is a natural home for agentic systems because it gives you composable


    building blocks for the orchestrator, tools, and memories.


    Now let’s turn to Kubernetes-native integrations that bring agents into the control


    plane via Custom Resource Definitions (CRDs) and controllers. As of early 2026
    this


    space is evolving quickly, but one of the more mature projects is Kagent, originally


    started by Solo.io and growing in the Cloud Native Computing Foundation (CNCF)


    community. Kagent is a Kubernetes-native operator that lets you declare agents,
    tools,


    and exposure modes as custom resources and then reconciles them into runnable


    pods. It leans into protocol compatibility for tools and agent-to-agent exchange,
    so


    you can register MCP-compatible tool servers and expose A2A skills without leaving


    the control plane. You manage agents with the same GitOps and security practices


    you already use for deployments and jobs.


    The trimmed example in Example 8-3 shows the intent: define the reasoning loop,


    attach tools via MCP, and publish an A2A skill, while the operator handles pods,


    configuration, and status.



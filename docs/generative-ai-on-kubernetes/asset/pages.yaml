- pgno: 244
  md: '**Kubernetes Scheduler Optimization**


    The Kubernetes scheduler provides a flexible, pluggable architecture that supports


    sophisticated configuration to optimize pod placement for different workload


    requirements. GPU training platforms can leverage this flexibility through strategies


    like bin packing to consolidate workloads and reduce costs, combined with dynamic


    rescheduling to maintain optimization as cluster state evolves. This section covers


    the core scheduling mechanics, bin packing strategies for cost efficiency, and
    the


    descheduler for continuous optimization.


    **Core Kubernetes Scheduler**


    The Kubernetes scheduler operates through a two-phase decision process independ‐


    ently for each pod. First, the *filtering** phase* (candidate selection) eliminates
    nodes that


    cannot satisfy the pod’s requirements. This includes insufficient CPU, memory,
    GPU


    resources, or failing to meet taints, tolerations, and affinity rules (see “Node
    affinity”


    on page 88).


    The *scoring phase* (node ranking) happens next and ranks the remaining candidate


    nodes using weighted criteria such as resource balance, pod spreading, and affinity


    preferences to select the optimal placement. Once a node is selected, the scheduler


    performs the *binding operation* to assign the pod to that node. The binding operation


    concludes the scheduling phase, and the Kubelet running on that node takes over
    to


    start the container.


    The Kubelet, an agent that runs on each Kubernetes node, is responsible for the


    execution of the containers on that node according to the specifications provided
    by


    the control plane.


    See Figure 7-1 for more details.


    **Kubernetes Scheduler Optimization **


    **| **



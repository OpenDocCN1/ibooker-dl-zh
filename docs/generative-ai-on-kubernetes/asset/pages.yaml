    Via the proc filesystem, a file specific to the httpd-container can be accessed
    from


    the busybox container.


    You can access other processes’ filesystems only when Unix per‐


    missions allow. Ideally, the processes from all containers use the


    same UID, so that cross-container filesystem access should not be


    an issue. However, depending on your cluster setup, additional


    mechanisms like SELinux might affect the ability to access another


    container’s filesystem, even when using that UID or using UID 0


    for the containers.


    This technique to cross-share the containers’ filesystems is universal to Kubernetes


    and can be used for any deployed workload, regardless of whether you have deployed


    the runtime yourself or via an add-on platform.


    Although it’s not necessary to understand what happens behind the scenes, it’s


    enlightening how KServe implements direct image mounting. The technique is inde‐



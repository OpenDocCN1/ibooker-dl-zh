- pgno: 124
  md: 'Several well-known device plug-ins provide Kubernetes support for specific
    vendor


    hardware. Each of these plug-ins provides Kubernetes integration for the respective


    vendor’s accelerators and enables workloads to consume GPU or TPU resources as


    first-class citizens within a Kubernetes cluster:


    *nvidia-device-plugin*


    Official NVIDIA plug-in exposing CUDA-enabled GPUs in Kubernetes, essential


    for GPU-accelerated AI workloads. We’ll explore the NVIDIA device plug-in fur‐


    ther in the context of the NVIDIA GPU Operator in “NVIDIA GPU Operator”


    on page 95.


    *amd-device-plugin*


    Official AMD plug-in integrating ROCm-based GPUs, suitable for high-


    performance computing and AI workloads.


    *intel-gpu-plugin*


    Intel’s plug-in for integrated and discrete GPUs, enabling GPU resources in


    Kubernetes environments.


    *google-cloud-tpu-device-plugin*


    Google’s plug-in for integrating Tensor Processing Units (TPUs), specialized


    hardware optimized for machine learning workloads, exclusively available in the


    Google Kubernetes Engine (GKE).


    Device plug-ins have become a foundational building block for GPU integration
    into


    Kubernetes. However, this approach has limitations. Device plug-ins usually allocate


    devices exclusively to individual pods, which often leads to underutilized resources.


    Additionally, resource allocation is static and determined at scheduling time,
    making


    it less flexible for workloads with dynamic resource requirements.


    To address these challenges, Kubernetes is evolving toward *Dynamic Resource Allo‐*


    *cation*, which we discuss in “Dynamic Resource Allocation” on page 92. In the


    meantime, most production environments will continue to rely on the established


    resource request model for GPU scheduling.


    Let’s now take a closer look at how Kubernetes leverages both resource-based and


    label-based techniques to select the placement of GPU workloads in Kubernetes.


    **GPU Workload Scheduling**


    Kubernetes offers three complementary approaches to placing GPU-bound work‐


    loads. The first steers pods with node labels and affinity rules, while the second
    relies


    solely on numeric resource requests. The third mechanism that influences automated


    placement for GPU workloads is based on Dynamic Resource Allocation (DRA). We


    look at them separately so that the strengths of each method remain clear.


    **GPU Workload Scheduling **


    **| **



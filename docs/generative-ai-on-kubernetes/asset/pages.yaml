  md: '**Secondary Network Optimization and Troubleshooting**


    Beyond basic secondary network configuration, several optimizations improve net‐


    work performance for distributed training workloads:


    *NCCL topology awareness*


    Configure `NCCL\_TOPO\_FILE` to provide the NVIDIA Collective Communication


    Library (NCCL) with detailed information about GPU and network adapter top‐


    ology, enabling optimal communication path selection. NCCL’s auto-detection


    works well for standard configurations but may not discover the fastest paths
    in


    complex multi-GPU, multi-NIC servers. Generate topology files using `nvidia-`


    `smi topo -m` on each node, and make them available to training pods through


    ConfigMaps.


    *Network adapter tuning*


    Modern RDMA adapters expose numerous tuning parameters that impact per‐


    formance. For Mellanox ConnectX adapters, consider enabling adaptive rout‐


    ing (`\--set\_adaptive\_routing` in the subnet manager) to balance load across


    multiple paths in the InfiniBand fabric, and configure appropriate MTU sizes


    (typically 4,096 for InfiniBand) to reduce packet overhead.


    *NUMA awareness*


    On multisocket nodes, ensure that training pods are pinned to CPUs local to


    the GPUs and the network adapters they use, minimizing cross-socket mem‐


    ory traffic that introduces latency. The Kubernetes Topology Manager enables


    NUMA-aware pod scheduling, and NCCL respects CPU affinity when determin‐


    ing communication patterns.


    *Network isolation*


    Deploy training workloads on dedicated VLANs or InfiniBand partitions isolated


    from other cluster traffic to prevent congestion from unrelated workloads that


    could introduce latency variation and degrade training performance. Kubernetes


    NetworkPolicies provide application-layer isolation, but physical network segre‐


    gation ensures that high-bandwidth training communication receives guaranteed


    bandwidth.



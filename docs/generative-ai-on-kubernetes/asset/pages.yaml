- pgno: 212
  md: 'Model safety is still a very active field, and it is critical to implement
    proper guardrail‐


    ing to mitigate the risks related to LLM usage, but it is still difficult to find
    the right


    trade-off to avoid an explosion of complexity and cost.


    **Lessons Learned**


    In this chapter we explored how to observe LLM workloads on Kubernetes, from


    infrastructure metrics to model quality monitoring and safety guardrails.


    Traditional monitoring metrics tell an incomplete story for LLM inference work‐


    loads. While CPU and memory utilization matter, they miss the primary compute


    resource (GPU) and the distinct characteristics of inference phases: compute-bound


    prefill and memory-bound decode.


    Token-based metrics replace request-based observability. Time To First Token


    (TTFT) measures user-perceived latency during the prefill phase, while Time Per


    Output Token (TPOT) determines whether generated text appears faster than


    humans can read. These metrics directly map to the user experience in ways that


    traditional throughput and latency cannot.


    Model quality observability extends beyond infrastructure monitoring. Guardrails
    for


    safety, hallucination detection, and bias mitigation must be embedded at both
    input


    and output stages, treating content validation as a first-class operational concern


    rather than a postdeployment audit.


    GPU metrics require vendor-specific tooling. NVIDIA DCGM, AMD ROCm SMI,


    and Intel XPU Manager each expose hardware metrics through Prometheus export‐


    ers, enabling observability of utilization, memory, temperature, and power consump‐


    tion alongside LLM-specific metrics.


    Platform operators should instrument the full inference path from request ingress


    through model execution to response delivery, using OpenTelemetry conventions


    where available to enable cross-runtime portability. Comprehensive observability


    across logs, metrics, traces, and quality signals provides the foundation for
    diag‐


    nosing performance issues, optimizing resource allocation, and maintaining safety


    guardrails in production.


    This concludes our exploration of inference and production readiness. Armed with


    the tools to deploy, scale, and observe LLM workloads, we now turn to the next
    major


    topic: tuning, where you adapt foundation models to your specific needs.


    **Lessons Learned **


    **| **



  md: 'Init container copying delivers the fastest inference performance through node-local


    I/O, making it ideal for latency-sensitive workloads. However, this approach wastes


    storage when running multiple replicas, as each node maintains its own copy. Use
    this


    strategy for single-replica or low-concurrency scenarios where you can tolerate
    slow


    startup in exchange for peak inference performance.


    PersistentVolumes provide the highest storage efficiency by storing models once
    and


    sharing them across all replicas. Storage efficiency comes at the cost of network


    latency on every model file read. PVs work well for tens of replicas but face
    chal‐


    lenges when scaling to hundreds due to backend saturation and network contention.


    Choose PVs when storage costs matter more than peak inference performance, or


    when data scientists manage models externally through distributed filesystems.


    OCI image-based approaches (modelcars and volume mounts) offer a middle


    ground: high storage efficiency through layer sharing plus fast local access.
    As a


    standardized format, OCI enables seamless model distribution and discovery across


    registries. Modelcars provide immediate availability but require process namespace


    sharing with security considerations. OCI volume mounts offer cleaner integration


    as a native Kubernetes feature but remain experimental as of Kubernetes 1.33.
    Both


    approaches excel when running multiple fine-tuned models sharing the same base


    model, as common layers are shared across all instances.


    Consider hybrid strategies for complex environments. Development environments


    might use PersistentVolumes for easy model updates, while production deployments


    use OCI volumes for performance and reliability. Different model tiers might use


    different approaches: frequently accessed models in OCI images for speed and less-


    critical models sharing PersistentVolumes for cost efficiency. As OCI volume mounts


    mature and gain widespread runtime support, they will likely become the preferred


    approach for most deployments.


    This concludes Part I. You now have the foundation for deploying LLMs on Kuber‐


    netes: serving runtimes, lifecycle controllers, and strategies for managing model
    data.


    The next part builds on this foundation, addressing what it takes to run inference


    workloads in production, from GPU management to scaling and observability.


    **Lessons Learned **


    **| **



  md: '1 GPU manufacturers like NVIDIA typically advertise memory in decimal gigabytes
    (GB, base-10), while


    Kubernetes often uses binary gibibytes (GiB, base-2). The difference is small
    but notable: 40 GB ≈ 37.25 GiB


    and 80 GB ≈ 74.5 GiB. Throughout this chapter, we use GB to match industry practice.


    In practice, teams work around this limitation by leveraging labels added by the
    GPU


    device plug-in (such as `nvidia.com/gpu.product`) or tagging nodes with custom


    labels (such as `gpu-type=A100`), and then combining the resource request with
    a


    `nodeSelector` or `nodeAffinity` rule to steer workloads to compatible hardware.
    It’s


    a powerful tool, but it comes at the cost of extra coordination between the node


    inventory and the workload definitions.


    A more elegant way to express nuanced requirements is the Dynamic Resource


    Allocation mechanism described in “Dynamic Resource Allocation” on page 92.


    With DRA, you don’t need to hardcode label conventions or rely on static resource


    requests. Instead, you declare what kind of GPU you want, and Kubernetes dynami‐


    cally allocates a matching one.


    **Dynamic Resource Allocation**


    The Kubernetes device plug-in mechanism made it possible to expose GPUs and


    other specialized hardware as schedulable resources. With it, workloads request


    accelerators like `nvidia.com/gpu`, and Kubernetes allocates them exclusively
    to a


    pod at scheduling time. While this works well for many scenarios, it’s a static
    model.


    The scheduler cannot distinguish between devices, fixes allocation at scheduling
    time,


    and always allocates them exclusively. In practice, this can lead to underutilized


    resources, coarse-grained scheduling decisions, and limitations when dealing with


    more advanced GPU configurations like Multi-Instance GPU or time-slicing that
    we


    discuss in “Sub-GPU Allocation” on page 98.


    DRA is an effort to make device scheduling in Kubernetes more flexible, composable,


    and dynamic, and it has been available as a core, stable Kubernetes feature since


    version 1.34. Instead of tying device allocation directly to resource fields in
    the pod


    specification, DRA introduces a new set of resource types. These abstractions
    shift the


    focus from “how many” devices to “what kind” of device a workload requires. The


    model is inspired by Kubernetes’ volume provisioning, where users describe a desired


    resource and let the platform resolve it.


    With DRA, workloads declare their device needs via ResourceClaimTemplate


    resources. These templates act as intent declarations. The Kubernetes control
    plane


    and the installed DRA driver resolve them at scheduling time. This enables features


    that are difficult or impossible with static device plug-ins. For instance, a
    pod can


    request a specific device class, like an A100 GPU with at least 40 GB (≈ 37 GiB)¹


    of memory. The scheduler will place the pod only on a node that can fulfill this



  md: '![](img/3a93443ca88ca3c8ef163f48ebd612bc_132_0.png)


    As DRA matures, it is likely to become the standard way of handling advanced


    hardware resources in Kubernetes. We expect vendors like NVIDIA to integrate


    their device plug-ins, GPU operators, and runtime libraries with DRA to provide
    a


    seamless experience for both inference and training workloads.


    Until DRA becomes production-grade, however, the combination of resource


    requests and label-based scheduling remains the standard approach for GPU


    scheduling.


    **NVIDIA GPU Operator**


    The previous sections showed how the Kubernetes device plug-in exposes GPUs as


    schedulable resources (“Kubernetes GPU Device Plug-Ins” on page 86) and how GFD


    enriches nodes with detailed NVIDIA-specific labels (“GPU Feature Discovery” on


    page 84). The NVIDIA GPU Operator builds on both pieces and adds everything


    needed to run NVIDIA GPU workloads reliably in production. It installs drivers,


    container runtime hooks, and monitoring agents, and it offers two sharing mecha‐


    nisms for sub-GPU resource allocations in one declarative interface.


    The operator automates the installation and configuration of all necessary compo‐


    nents, enabling GPU workloads to run efficiently and reliably.


    The following components are part of the NVIDIA GPU Operator:


    *NVIDIA drivers (kernel module and CUDA)*


    At the heart of GPU enablement are the NVIDIA drivers—the kernel modules


    and user-space libraries that enable CUDA and GPU acceleration. The GPU


    Operator can deploy the official NVIDIA driver into each GPU node by running


    a privileged driver container. This container compiles the driver for the node’s


    kernel or retrieves a precompiled version when available. By containerizing


    driver installation, the operator ensures all GPU nodes have the required driver


    version without manual intervention.


    GPU nodes ideally should run the same OS kernel version if you


    want to rely on the operator’s driver container across all nodes.


    Mixed OS versions might require pre-installing drivers manually.


    The operator’s ClusterPolicy CR shown in Example 3-11 allows


    customizing the driver version or using precompiled binaries, if


    needed.


    *GPU Feature Discovery*


    We already covered the GFD in “GPU Feature Discovery” on page 84. The opera‐


    tor deploys GFD as a DaemonSet so that you don’t have to install it manually on


    your own.


    **NVIDIA GPU Operator **


    **| **


    **95**'

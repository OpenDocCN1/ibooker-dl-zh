  md: 'While topology-aware scheduling optimizes individual job placement for perfor‐


    mance, it doesn’t address the fundamental challenge of fairly allocating scarce
    GPU


    resources across multiple competing teams in a shared cluster.


    **Quota Management and Multitenancy: GPU as a Service**


    While gang scheduling ensures that all pods in a distributed job are scheduled


    together, and topology-aware scheduling optimizes their placement on hardware
    with


    optimal interconnects, these mechanisms address only how individual jobs are exe‐


    cuted. They do not address who gets access to scarce GPU resources when multiple


    teams compete for cluster capacity.


    Operating a shared GPU cluster as a multitenant platform requires sophisticated


    quota management to ensure fair resource allocation across teams while maximizing


    overall GPU utilization. This is a challenge that standard Kubernetes ResourceQuotas


    cannot adequately address for AI/ML workloads.


    Traditional Kubernetes quotas operate at the namespace level with hard limits
    that


    prevent workloads from starting when the quota is exhausted, but this approach
    does


    not address fixed and scarce resources, leading to poor GPU utilization in practice.
    A


    team might have unused quota while its data scientists are not running experiments,


    while the jobs of another team queue indefinitely despite having urgent training


    deadlines, with expensive GPU resources sitting unused because quota boundaries


    prevent dynamic sharing.


    *GPU as a Service (GPUaaS)* architectures address this by implementing hierarchical


    quota management with borrowing, preemption, and fairness policies that enable


    teams to burst beyond their guaranteed allocations when cluster capacity is available,


    while ensuring that no team can monopolize resources when demand exceeds supply.


    The main goal is to maximize GPU usage with an opportunistic approach, while at


    the same time guaranteeing the designed quota when asked.


    **Comparing Quota Management and Multitenancy Solutions**


    Several scheduling solutions provide quota management capabilities for GPU


    resources, each with different approaches to resource allocation, fairness policies,


    and multitenancy support. Table 7-4 compares the main options. Understanding how


    each solution handles quota enforcement and resource borrowing helps platform


    administrators select technologies that match their organizational requirements
    for


    fair GPU sharing across teams.



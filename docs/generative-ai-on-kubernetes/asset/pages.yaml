  md: 'The agent’s access token representing the actor performing the exchange.


    Per RFC 8693, `actor\_token\_type` is required when `actor\_token` is present.


    The delegated token contains both identities: user in `sub`, and agent in `act`.


    The MCP server receives the exchanged token from the agent runtime. It can either


    forward this dual-identity token directly to upstream APIs or perform its own
    token


    exchange to become the new actor in the `act` claim while preserving the user’s


    identity in `sub`.


    The trade-off is additional complexity. You must operate a token exchange end‐


    point, handle token exchange errors, and cache exchanged tokens to avoid repeated


    exchange calls that add latency to every agent invocation.


    For isolating tokens across contexts, you can construct cache keys from the tuple


    `(user\_subject, agent\_identity, audience)`. When you receive an exchanged


    token, decode the JWT and extract the `exp` claim (expiration timestamp in Unix


    seconds). Set your cache time-to-live (TTL) to `exp - current\_time - safety\_margin`,


    where the safety margin accounts for clock skew and network latency—typically
    30–60


    seconds. Never cache a token with a TTL longer than its actual lifetime; a stale
    cached


    token will be rejected by the upstream API, forcing you to exchange again anyway,
    as


    well as wasting both the cache storage and the failed API call.


    If your cache implementation doesn’t support per-entry TTLs (e.g., Redis with


    expiry per key), ensure that each cache entry is stored with its own expiration.
    For


    in-memory caches, consider storing `{token, expires\_at}` and checking expiration


    on retrieval. Under high concurrency, multiple requests for the same (user, agent,


    audience) tuple might trigger parallel exchanges; use a cache-aside pattern with


    short-lived locks or accept occasional duplicate exchanges rather than introducing


    complex distributed locking.


    **Mutual TLS with SPIFFE/SPIRE (Zero-Trust)**


    Bearer tokens—whether OAuth2 access tokens, Kubernetes ServiceAccount tokens,


    or API keys—have a fundamental weakness: they can be stolen. If an attacker inter‐


    cepts or exfiltrates a token, they can impersonate the legitimate caller until
    the


    token expires. The Secure Production Identity Framework for everyone (SPIFFE)


    and the SPIFFE Runtime Environment (SPIRE) solve this by binding identity cryp‐


    tographically to the workload itself, making credentials impossible to steal without


    compromising the entire pod.


    **MCP Security **


    **| **



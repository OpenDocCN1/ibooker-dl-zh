  md: 'Token exchange can occur at two points in an MCP workflow. First, the agent


    runtime can exchange a user’s token for an MCP-server-targeted token that identifies


    both the user and the agent. Second, the MCP server can exchange its token for


    an upstream API-targeted token that identifies the user and the MCP server. The


    exchange mechanism is identical in both cases—only the actor identity in the `act`


    claim changes to reflect the current service performing the work.


    This section focuses on the first scenario: the agent runtime exchanging a user


    token for an MCP server-targeted token. The pattern applies equally to MCP servers


    exchanging tokens for upstream API access.


    The token exchange flow involves a token service—typically your identity provider


    or a dedicated security token service—as shown in Figure 9-5. The user authenticates


    and obtains an access token from the identity provider. The agent runtime calls
    the


    token exchange endpoint with the user’s token as the `subject\_token` and the
    MCP


    server as the `audience`. The token service validates the user’s token and returns
    a


    delegated token. The agent runtime sends this delegated token to the MCP server,


    which can use it directly or exchange it again for upstream API calls.



    **Making the right choice**


    In this section, we introduced different techniques to achieve gang scheduling
    on


    Kubernetes for distributed training jobs, along with their pros and cons. However,
    in


    a real-world production cluster, it is very common to combine different solutions.


    A common (and recommended) scenario is the combination of Kueue for admission


    control and quota management, together with AI specialized deployment APIs like


    PyTorchJob (see “Kubeflow Trainer” on page 192) or LeaderWorkerSet. For example,


    the NVIDIA KAI Scheduler can replace the default scheduler to provide GPU-aware


    optimizations while still leveraging the admission management provided by the


    Kueue layer.


    The LeaderWorkerSet (LWS) project can be used together with


    specialized schedulers because it addresses a different problem:


    managing workloads with inherent leader-worker topology rather


    than just ensuring atomic scheduling.


    While LWS assumes gang scheduling semantics (all pods in a group


    are scheduled together or not at all), its primary value is providing


    a workload API that understands the leader-worker pattern com‐


    mon in AI/ML inference scenarios, where a leader pod coordinates


    work distribution to worker pods and both must be co-located or


    networked efficiently. This makes LWS specialized for AI/ML as


    compared, for example, to the more generic PodGroup API.


    While PyTorchJob is specialized for distributed training jobs, the


    main goal of LWS is distributed inference, especially multihost


    inference workloads where the LLM will be sharded and run across


    multiple devices on multiple nodes. This scenario has the same


    gang scheduling challenge as a distributed training job.


    While the gang scheduling solutions discussed earlier ensure that distributed
    training


    jobs receive complete resource allocations, they don’t address where those resources


    are located within the cluster’s physical infrastructure. The placement of pods
    across


    nodes with different GPU interconnect technologies can dramatically impact training


    performance, making topology awareness the next critical scheduling consideration.


    **Topology-Aware Scheduling**


    While gang scheduling ensures that all pods in a distributed training job schedule


    together, it does not guarantee that those pods land on nodes with optimal hardware


    topology for inter-GPU communication.


    While a scheduler without gang scheduling might partially deploy a job (wasting


    expensive GPU resources), a scheduler without topology awareness risks spreading



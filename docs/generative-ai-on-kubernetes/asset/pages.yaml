    **User Query Processing**


    Once the vector database is loaded with knowledge, the RAG system can serve user


    queries. The query processing pipeline runs every time a new question or request


    comes in. Its job is to fetch the most relevant pieces of knowledge for that query,


    incorporate them into the LLM’s prompt, and return the model’s answer. Let’s break


    down the steps in this inference-time pipeline.


    Figure 8-8 shows the user query processing pipeline components.


    ![](img/3a93443ca88ca3c8ef163f48ebd612bc_318_0.png)


    *Figure 8-8. RAG user query processing pipeline*


    Here are the components of the user query processing pipeline:


    *User query arrives*


    A user or an upstream service asks a question or makes a request that the LLM


    should handle, for example, “*How do I reset my device?*” This query hits the


    application’s API and the orchestrator component takes over.



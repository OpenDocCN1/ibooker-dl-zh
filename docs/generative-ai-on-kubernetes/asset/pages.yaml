- pgno: 277
  md: '**InfiniBand**


    InfiniBand represents the gold standard for multinode GPU communication in


    high-performance computing and large-scale AI training environments, providing


    Remote Direct Memory Access (RDMA) capabilities with submicrosecond latency


    and bandwidth scaling to 400 GBps per port.


    InfiniBand is a dedicated high-speed network fabric originally designed for HPC


    clusters that allows GPUs and CPUs to directly read and write memory on remote


    nodes without involving the operating system kernel, eliminating context switches


    and buffer copies that plague TCP/IP networking.


    InfiniBand fabrics scale to thousands of nodes through InfiniBand switches that


    provide full bisection bandwidth, ensuring that communication between any pair
    of


    nodes achieves full line rate regardless of network topology. This is critical
    for large


    training jobs where all-reduce operations must aggregate gradients across dozens
    or


    hundreds of GPUs simultaneously. However, InfiniBand requires dedicated network


    infrastructure separate from standard Ethernet data center networks, increasing
    cap‐


    ital costs and operational complexity. This makes it most appropriate for organiza‐


    tions running large-scale training platforms where the performance benefits justify


    the infrastructure investment.


    **RoCE**


    RDMA over Converged Ethernet (RoCE) brings RDMA capabilities to standard


    Ethernet networks, providing a compromise between InfiniBand’s performance and


    Ethernet’s ubiquity and cost-effectiveness. RoCE implements the same RDMA pro‐


    gramming interface as InfiniBand but places RDMA packets over Ethernet frames,


    allowing organizations to leverage existing Ethernet switching infrastructure
    while


    still achieving the kernel-bypass and zero-copy benefits of RDMA communication.


    RoCEv2 (the current standard as of early 2026) encapsulates RDMA traffic in


    UDP/IP packets, providing routing capabilities that InfiniBand’s Layer 2 commu‐


    nication lacks, though this introduces slightly higher latency compared to native


    InfiniBand.


    Modern Ethernet adapters supporting RoCE deliver 100 to 400 GBps of bandwidth


    per port with latencies in the low microsecond range, approaching InfiniBand perfor‐


    mance for many workloads while operating over converged networks that also carry


    standard TCP/IP traffic.


    Given the usage of UDP/IP to avoid TCP/IP overhead, it is possible that a packet


    might get lost, triggering expensive ad hoc retransmissions managed at the applica‐


    tion level. The mitigation of this issue requires the adoption of Ethernet configura‐


    tions that prevent packet loss (like Priority Flow Control and Enhanced Transmission


    Selection).



- pgno: 278
  md: '**Standard Ethernet**


    Ethernet with TCP/IP networking remains the most accessible option for distributed


    training, providing adequate performance for smaller-scale jobs or organizations


    without specialized networking infrastructure.


    Kubernetes’ default networking (via CNI plug-ins like Calico, Cilium, or Flannel)


    operates over standard Ethernet, delivering 10 GBps to 100 GBps bandwidth,


    depending on network adapter and switch capabilities, with latencies measured
    in


    tens to hundreds of microseconds, depending on network topology and congestion.


    While significantly slower than InfiniBand or RoCE, standard Ethernet remains


    viable for training jobs at smaller scales. For data-parallel training, standard
    Ethernet


    typically suffices for 2–8 nodes when communication overhead remains below 15%


    of total step time. Practitioners can assess their workload by profiling to measure
    the


    ratio of all-reduce time to computation time—exceeding the 20–25% communication


    overhead signals the need for RDMA-capable networking. The threshold varies based


    on model size and parallelization strategy: pipeline parallelism generates less
    network


    traffic than tensor parallelism, while gradient accumulation can reduce synchroniza‐


    tion frequency at the cost of convergence trade-offs.


    The advantage of standard Ethernet lies in its simplicity: no special hardware
    beyond


    commodity network adapters, no complex network fabric configuration, and full


    integration with Kubernetes networking models out of the box.


    **GPUDirect RDMA**


    GPUDirect RDMA technology enables direct memory access between GPUs and


    network adapters, eliminating CPU involvement and memory copies that introduce


    latency in traditional network communication paths.


    GPU-to-GPU communication is optimized by the previous technologies, but inter-


    node communication must still go through the kernel and memory copy. GPUDirect


    RDMA bypasses these intermediate steps by allowing network adapters to directly


    read from and write to GPU memory without CPU involvement, dramatically


    improving communication performance for distributed training.


    This technology works with both InfiniBand and RoCE fabrics, reducing communi‐


    cation latency by 40–60% compared to traditional network paths.


    However, GPUDirect RDMA requires specific hardware (RDMA-capable network


    adapters like NVIDIA Mellanox ConnectX), GPU drivers with GPUDirect support


    enabled, and proper NCCL configuration in training frameworks, making the config‐


    uration more complex.


    **Network Optimization for Distributed Training **


    **| **



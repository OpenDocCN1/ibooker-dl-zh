    *AI Orchestrator*


    The orchestrator is the “brain” that encodes the query, retrieves, optionally


    reranks, constructs the prompt, and calls the LLM, so run it as a stateless


    deployment exposed through a ClusterIP service or, if it faces end users, through


    an ingress or API gateway. Because it coordinates multiple dependencies, the


    orchestrator should be carefully instrumented: propagate trace context across


    calls so you can measure end-to-end latency and identify bottlenecks. Configura‐


    tions such as prompt templates, thresholds, or retrieval parameters should live
    in


    ConfigMaps so you can tune them without code changes. Credentials should be


    mounted from secrets to keep them safe. The *Secure **Configuration* pattern has


    more information on how you can harden secret configuration. Scale with the


    horizontal pod autoscaler for steady load, and use Knative or KEDA when you


    need event-driven bursts or scale-to-zero for idle paths. Check out the *Elastic*


    *Scale* pattern to learn more about Knative and KEDA, and how it supports up


    and down scaling, including scale to zero.


    *Reranker (optional)*


    If precision matters, run a cross-encoder or heavier reranker as its own deploy‐


    ment and call it selectively for high-stakes queries to balance cost and latency.


    Simple heuristics can stay in the orchestrator, but a separate service lets you


    tune resources and release cadence independently, following the *Stateless Service*


    pattern. Keeping the reranker optional allows you to balance cost and quality,


    enabling you to switch it on for high-stakes queries while letting most traffic

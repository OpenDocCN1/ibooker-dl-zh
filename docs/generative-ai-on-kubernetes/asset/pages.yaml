  md: 'Finally, there is the already mentioned llm-d project that extends the Gateway
    API


    Inference Extension to integrate it more and more with vLLM runtime, including


    distributed and shared KV cache and disaggregated prefill. It is one of the most


    advanced solutions currently available for large-scale LLM deployments, and it
    will


    be used as a reference in “Disaggregated Serving” on page 148.


    While the Gateway API Inference Extension provides powerful capabilities, the
    con‐


    figuration of InferencePools, InferenceModels, and Endpoint Pickers can become


    complex for production deployments. KServe’s LLMInferenceService API simplifies


    this by providing a higher-level abstraction that automatically manages the under‐


    lying gateway components. The LLMInferenceServiceConfig acts as a preset tem‐


    plate that encapsulates common configuration patterns for intelligent routing,
    KV


    cache-aware scheduling, and disaggregated serving, hiding the low-level complexity


    while still allowing customization when needed (see Example 1-12 for configuration


    examples).


    **Disaggregated Serving**


    In addition to LLM-aware routing, many other optimizations can be applied to


    scale the LLM service in production. The more stringent the latency and scalability


    requirements, the more complex the configuration becomes.


    The *disaggregated serving* approach distributes LLM serving by integrating an
    LLM-


    aware router with distributed KV cache and disaggregated prefill optimizations.


    Before going into more detail, it is important to highlight that similar configuration


    makes the deployment more similar to an appliance instead of a traditional Kuber‐


    netes deployment, and it is designed for very large-scale deployments where few


    models are served in a single cluster.


    Multiple projects have been created with the goal of implementing disaggregated


    serving. The most famous are NVIDIA Dynamo and llm-d, and the main difference


    is the focus: NVIDIA Dynamo is specialized and deeply integrated with NVIDIA


    hardware, while llm-d aims to support different hardware and integrate existing
    open


    source projects, thus leveraging the ecosystem.


    Everything described in this chapter up to this section is applicable to a traditional


    Kubernetes cluster that has at least one node with GPUs, but this is not enough
    to


    support disaggregated serving. As soon as the runtime is distributed, and in partic‐


    ular the KV cache is shared across different deployments, the network bandwidth


    available to share the KV cache blocks becomes critical and a dedicated network


    configuration is required to obtain the benefit of the distribution.


    **148 **


    **| **



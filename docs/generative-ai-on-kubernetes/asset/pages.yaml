- pgno: 176
  md: '*6\. Exposing the model*


    When the model has been loaded, vLLM exposes the OpenAI-compatible API


    and many other endpoints, and it is ready to serve requests. The list of APIs


    includes a `/health` endpoint that can be used to configure the readiness probe
    as


    recommended by Kubernetes best practices.


    These are the main steps performed by vLLM to start the runtime, load the model,


    and expose it. The two phases that take most of the time are downloading the


    model and loading it in the GPU. We explained how to avoid the download time with


    proper configuration and how to improve the model loading time using one of the


    vLLM extensions. The other advice mentioned is to use fast storage options like
    an


    NVMe device.


    Applying all of these recommendations can reduce the time to scale up vLLM from


    many minutes to tens of seconds, depending on the size of the model.


    **LLM-Aware Routing**


    The previous section showed how to scale to multiple replicas. Now we face a new


    challenge: how to effectively distribute requests across those replicas. Load
    balancing


    requests across different replicas is a challenge that starts to impact the cluster
    as soon


    as a single replica is not enough and multiple replicas of the model are provisioned.


    The default Kubernetes strategy to dispatch the requests across multiple replicas


    is round robin. The requests are uniformly distributed and defined, considering


    the workload of microservices, where monitoring CPU and memory is enough to


    monitor the current workload of the single replica and decide when to scale.


    In reality, the round robin approach has already shown limitations when Kubernetes


    is deployed on a cloud environment with multizone configuration. Kubernetes intro‐


    duced topology aware routing to heuristically manage the load and keep traffic


    within the zone it originated from.


    With the serving of LLMs, the boundaries of Kubernetes are stretched more than


    in the past, and this requires exploring a different approach for optimizing routing


    and load balancing a request to a replica. Multiple factors should be considered
    to


    perform specialized routing of the requests:


    *Each request is **different*


    The previous chapters already highlighted this aspect. There’s no correlation


    between the input prompt size and the number of tokens the model produces,


    and generation can continue for many seconds. The impact of a request on a


    replica is not predictable, thus the routing strategy must consider the actual
    work


    the replica is performing and in particular how many requests are still waiting


    to be processed. A specific metric, `vllm:num\_requests\_waiting`, produced by


    vLLM, that keeps track of this information.


    **LLM-Aware Routing **


    **| **


    **139**'

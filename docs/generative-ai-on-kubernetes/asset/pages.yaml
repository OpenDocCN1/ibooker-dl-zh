  md: 'those extra GPUs might sit idle—in which case, one might consolidate work onto


    fewer GPUs or even share GPUs among multiple models via time slicing or MIG, as


    described in “Sub-GPU Allocation” on page 98. For dynamic workloads, you can also


    leverage Kubernetes autoscaling to automatically adjust the number of replicas
    based


    on demand (see the *Elastic Scale* pattern in *Kubernetes Patterns*).


    **Model Parallelism**


    The second motive for multi-GPU inference is to allow a single large model to
    be


    served by multiple GPUs in unison. Unlike data parallelism, which replicates the
    entire


    model, *model parallelism* splits a single model across multiple GPUs—necessary
    for


    modern LLMs with tens or hundreds of billions of parameters that exceed the memory


    of one GPU. This is possible because LLMs have a layered architecture composed
    of


    sequential transformer layers. This structure allows splitting the model in two
    ways:


    *tensor parallelism* divides the computations within each layer across GPUs, while


    *pipeline parallelism* assigns different layers to different GPUs. Both approaches
    can


    be combined for very large deployments, and in each case, individual GPUs hold
    a


    portion of the neural network and compute part of the forward pass. Model parallelism


    focuses on reducing per-GPU memory usage and potentially latency for one inference


    by leveraging multiple devices in parallel, at the cost of added communication
    between


    GPUs. High-bandwidth interconnects (like NVIDIA NVLink or NVSwitch, explained


    in the following sidebar) are often critical here to handle the frequent data
    exchanges


    without bottlenecks.


    **NVLink and NVSwitch: NVIDIA GPU Interconnects**


    NVIDIA developed two complementary technologies to enable high-speed GPU-to-


    GPU communication for model parallelism: NVLink for direct connections and


    NVSwitch for fabric-based networking.


    *NVLink* is a high-speed, point-to-point interconnect that provides direct GPU-


    to-GPU communication within a server node. The fifth-generation, NVLink 5.0


    (introduced with the Blackwell architecture), delivers up to 1.8 TBps bidirectional


    bandwidth per GPU using 18 links at 100 GBps each. This represents a 2× improve‐


    ment over the previous NVLink 4.0 generation (900 GBps on H100 GPUs), and over


    14× the bandwidth of PCIe Gen5. Early NVLink generations supported connecting


    4 to 8 GPUs; modern implementations can scale to 576 GPUs, though practical


    deployments typically use 8 GPUs per node.


    *NVSwitch* is a high-performance switching fabric (a switching network architecture)


    that extends NVLink connectivity into a fully connected, nonblocking mesh where


    any GPU can communicate with any other GPU at full NVLink bandwidth simulta‐


    neously. NVSwitch 4.0 (for Blackwell systems) features 72 NVLink 5.0 ports per
    chip;


    a dual-chip switch tray provides 144 ports and 14.4 TBps switching capacity. NVIDIA



  md: '![](img/3a93443ca88ca3c8ef163f48ebd612bc_334_0.png)


    *Figure 8-12. Agents triggering each other on demand*


    On Kubernetes, you typically model each agent as a service-backed deployment and


    connect them synchronously over HTTP or gRPC, or asynchronously via a pub/sub


    messaging fabric. Alternatively, multiple agents can run in a single pod when
    a frame‐


    work coordinates agent dialogue in process. This arrangement simplifies cross-agent


    state sharing and reduces latency, but it couples lifecycles and scaling so every
    agent


    scales together, which limits elasticity and is rarely a fit beyond small or tightly


    bound teams. For the rest of this section, we focus on a distributed design where


    agents collaborate over the network. Shared memory backends provide the glue for


    collaboration, using a vector store, a document store, or a blackboard where agents


    post findings, pending tasks, and artifacts for others to consume. This shared
    state


    lets the system remember what happened across agent boundaries while still isolating


    each agent’s runtime and quota. The usual platform concerns still apply—service


    discovery, retries, backoffs, and circuit breakers—because agents are distributed
    sys‐


    tems in miniature. We will tie these pieces back to the protocols in “Agent-to-Agent


    Protocol” on page 329 so you can choose message shapes that survive versioning
    and


    team boundaries.


    A concrete example of a multiagent system is customer support automation: one


    agent monitors incoming support tickets, then delegates each ticket to an appropriate


    specialized agent—say, a NetworkTroubleshooter agent or a BillingInquiry agent—


    and finally a Summary agent compiles a report of what was done. The coordination


    logic here decides which specialist agent gets involved and when the process is
    done.



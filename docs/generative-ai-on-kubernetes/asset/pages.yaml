    **CNCF ModelPack ****Specification**


    The CNCF ModelPack specification is a CNCF Sandbox project that extends the OCI


    image specification for packaging and distributing AI models. It targets an expansion


    of the OCI standard to support AI model artifacts, including model weights, meta‐


    data, and configurations. The goal is to standardize model storage and management,


    ensuring better compatibility across different runtime environments. By leveraging


    OCI’s extensible architecture, it aims to simplify model deployment and sharing.


    This initiative complements OCI’s image volume mount capabilities, described later


    in “Modelcars” on page 68 and “OCI Image Volume Mounts” on page 74. The


    definition of new annotation types is also part of the specification. The specification


    was accepted into the CNCF Sandbox in May 2025, reflecting strong community


    interest and strong industry support. Its success will lead to a more unified
    approach


    to operationalizing AI workloads in cloud-native environments.



- pgno: 320
  md: '*LLM generates an answer*


    The orchestrator sends the composed prompt to the LLM service via an API call


    to the model inference server. The LLM processes the prompt and produces a


    completion—in this case, hopefully a step-by-step answer explaining how to reset


    the device, drawn from the provided context. Because we included the relevant


    snippet, the model doesn’t have to invent facts; it just has to articulate the
    answer


    in natural language. The output for our example might be something like: “*To*


    *reset your device, **first** hold down the power button for 10 seconds until
    the LED*


    *blinks*,” which mirrors the documentation and is formulated by the LLM.


    *Post-process and return the response*


    The orchestrator post-processes the model output before returning it to the


    caller. Typical steps include formatting, attaching source citations from metadata,


    enforcing guardrails, and truncating to size limits. The final answer is delivered


    back through the API or UI.


    From the user’s perspective, this pipeline is invisible: they simply get a helpful
    answer


    that references the right information. Vector search is usually fast enough that
    LLM


    generation dominates latency, so a well-implemented RAG pipeline still feels like
    real


    time. If no strong context is found, the AI Orchestrator should abstain gracefully


    rather than risk a hallucinated answer. With these steps in place, the LLM’s response


    is grounded in your knowledge base and remains aligned with up-to-date facts.


    Now that we have all the ingredients of a RAG system, let’s see how we can map
    the


    individual RAG components to Kubernetes primitives.


    **RAG on Kubernetes**


    Let’s map the components from “RAG Components” on page 275 onto Kubernetes


    and show how to operate them as one production-grade system. A production RAG


    stack is a set of cooperating services with distinct lifecycles and SLOs that
    fit cleanly


    into Deployments, StatefulSets, Services, and Jobs. Kubernetes lets you scale
    each


    piece independently, roll out safely, and standardize configuration and security
    across


    environments.


    Table 8-1 gives a quick overview of the various RAG specific components, their


    associated K8s workload type, and their anticipated resource requirements.


    **Retrieval-Augmented Generation **



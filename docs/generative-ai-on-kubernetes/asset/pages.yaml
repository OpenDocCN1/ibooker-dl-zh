- pgno: 177
  md: '*Batching*


    vLLM creates a batch of requests of a certain, configurable size to use all the


    available resources and produce more tokens. This is critical in real-time scenar‐


    ios to handle more requests in parallel. However, it is not always possible to
    fill


    the entire batch with requests, and the router can mix offline inference requests


    with real-time ones to fill a batch.


    *Prefill** and decode workload*


    We already explained the different impacts on the hardware that the prefill and


    decode phases have. In particular, the prefill phase is directly related to the
    size


    of the prompt, so it is possible to design dedicated instances of vLLM to perform


    the prefill of large prompts. This is called *disaggregated **prefill* and is
    covered in


    “Disaggregated Serving” on page 148.


    *KV cache reuse*


    Previous chapters mentioned the KV cache multiple times as a critical aspect for


    efficient token generation. However, this impact extends beyond single requests.


    The model has no memory. Every request appears as completely new. For exam‐


    ple, in a chatbot, the whole conversation is provided for every new message,


    requiring the system to process (prefill) all previous messages again. The same


    pattern applies to AI agents when a tool is invoked and the result is sent back
    to


    the model together with the previous prompt. A router that is aware of the status


    of the KV cache of each replica can route the request exploiting this aspect;
    this is


    called *prefix-aware** routing*.


    *Different** service-level requirements*


    Real-time requests have higher priority than batch requests, but the prioritization


    of the requests from different users might be more complex. For example, the


    scheduling logic can drop a request that is not critical when the capacity (number


    of requests waiting and KV cache size) is less than a certain threshold.


    *LoRA adapters*


    There is another use case where the traditional Kubernetes routing pattern


    doesn’t apply well: the efficient serving of a fine-tuned model. The customization


    of a model is covered in “Tuning a Model” on page 184, but in general from a


    serving perspective, when a model is fine-tuned, the training job produces a new


    specialized version that is deployed as a new, independent model. But when a


    particular technique, Low-Rank Adaptation (LoRA) (see “Low-Rank Adaptation”


    on page 187), is used, the fine-tuned model is saved as a thin layer, called the


    LoRA adapter, to be composed with the base model. This enables deployment


    in the same runtime instance as the adapter, saving hardware resources but


    breaking the mapping of one model per endpoint.


    There is a lot of interest in optimizing the inference and reducing its cost,
    and differ‐


    ent initiatives aim to solve or at least improve both of the two scenarios described.


    **140 **


    **| **



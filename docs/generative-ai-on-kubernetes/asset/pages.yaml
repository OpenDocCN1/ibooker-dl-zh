  md: 'Sharded Data Parallelism (FSDP) impose particularly stringent requirements
    for low-


    latency, high-bandwidth interconnects because they perform fine-grained communi‐


    cation during every forward and backward pass. Activations must transfer between


    GPUs in tensor parallelism, and FSDP performs continuous parameter gathering and


    gradient reduction operations. All these operations scale with communication latency


    and inversely with bandwidth, making GPU topology and interconnect quality critical


    for training performance, especially for advanced parallelism strategies beyond
    simple


    data parallelism.


    **Communication Patterns in Distributed Training**


    The main parallelism strategies generate distinct communication patterns with
    differ‐


    ent network requirements.


    *Data Parallelism* training replicates the full model on each GPU and synchronizes


    gradients after every training step. Gradients represent the direction and magnitude


    of adjustments needed to improve the model’s predictions: during each training


    iteration, the model makes predictions, compares them to the correct answers,
    and


    calculates how each model parameter (weight) should be adjusted to reduce predic‐


    tion errors (for some background on gradient descent fundamentals, see the Google


    Machine Learning Crash Course; for infrastructure details on gradient synchroni‐


    zation in distributed training, see PyTorch’s distributed communication documenta‐


    tion). Each worker computes gradients on its subset of training data, then all
    workers


    must synchronize their gradients (typically by averaging them) to ensure consistent


    model updates. With an LLM that has billions of parameters, every iteration might


    transfer tens of gigabytes of gradient data across all workers.


    *Tensor Parallelism* splits individual model layers across multiple GPUs, requiring


    activation transfers during both forward and backward passes. Activations are
    the


    intermediate computation results produced by each layer. For example, a single


    matrix multiplication might be split across four GPUs, with activation tensors
    passed


    between them during both forward and backward passes. This makes Tensor Parallel‐


    ism particularly sensitive to network latency.


    *FSDP* is a memory-efficient alternative to Data Parallelism that shards (splits)
    model


    parameters, gradients, and optimizer states across all GPUs rather than replicating


    the full model. Each GPU gathers the necessary parameter shards from other GPUs


    “just-in-time” for computation, then discards them to minimize memory usage. This


    frequent all-gather and reduce-scatter communication makes FSDP particularly sen‐


    sitive to both network bandwidth and latency.


    For detailed explanations of these parallelism strategies, see “Model Parallelism”
    on


    page 106.



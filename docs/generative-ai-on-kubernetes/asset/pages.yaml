    Let’s first take a closer look at how Node Feature Discovery works, followed by


    NVIDIA’s GPU Feature Discovery.


    **Node Feature Discovery**


    Kubernetes clusters rarely consist of identical nodes. Instead, they’re typically


    diverse in hardware capabilities—especially when specialized hardware like GPUs


    are involved. Effective scheduling in such heterogeneous environments—be it cloud


    deployments, hybrid setups, or bare-metal clusters—depends heavily on accurately


    identifying these hardware capabilities.


    As mentioned previously, the Node Feature Discovery (NFD) project provides this


    capability. NFD detects hardware features on each node and automatically labels
    the


    corresponding node resources in the cluster. These labels provide essential informa‐


    tion for the Kubernetes scheduler, enabling intelligent placement of workloads
    based


    on available hardware.


    NFD operates by deploying a DaemonSet across the cluster, ensuring an agent runs


    on every node. This agent examines the hardware and software configuration of
    each


    node, identifying attributes such as CPU details, network interfaces, and available


    PCI devices like GPUs. Once identified, NFD applies descriptive labels to the
    node


    resources in the Kubernetes API.


    Let’s see how you can deploy NFD. You have several options, with the simplest
    being


    deployment via Kustomize or Helm, as seen in Example 3-1.


    *Example 3-1. Installing NFD with Kustomize*



  md: '*Placement and **affinity*


    For multi-GPU nodes it is important to know the topology. On some eight


    GPU servers, not all GPUs are directly connected—there might be NVLink links


    in a mesh or groups; e.g., a NVIDIA DGX A100 has the NVSwitch all-to-all,


    but other systems might have two groups of four GPUs each. If your model


    parallelism uses four GPUs, you might get better performance if those four are


    all within one NVLink group. You can use `nvidia-smi topo -m` to display the


    mesh grouping. Kubernetes won’t automatically account for that, but you can


    use the Node’s hardware knowledge and assign specific GPU indices by using


    the device plug-in capabilities to pick specific GPUs by index. Manually selecting


    GPU indices is an advanced optimization—for most cases, Kubernetes will just


    assign any four GPUs, but if you care about intra-node latency, you might pin
    to,


    say, GPU0-3 if they’re within the same NVSwitch cluster on that node.


    *Optimize I/O and initialization*


    Large models take time to load from disk or network into GPU memory. If you


    scale pods up and down, you pay that cost each time. Amortize it by keeping


    pods warm, if possible. We describe optimized model loading techniques in


    Chapter 2.


    *Monitor GPU health*


    GPUs can encounter issues like ECC memory errors or high temperature throt‐


    tling. Ensure you have node-level monitoring and alerts for such events. Kuber‐


    netes won’t automatically reschedule a pod if the GPU starts erroring but hasn’t


    crashed—you might need a daemon that checks with `nvidia-smi` for errors and


    then taints the node or restarts pods. Running the NVIDIA DCGM and integrat‐


    ing with Kubernetes node health can help. A flaky GPU in a model-parallel group


    can cause wrong results or crashes, so it’s important to catch hardware issues.


    By following these best practices—defragmenting memory, smartly sharing GPUs,


    leveraging scaling and optimization tools, and closely monitoring—you can achieve


    high utilization and reliability for multi-GPU LLM inference on Kubernetes.



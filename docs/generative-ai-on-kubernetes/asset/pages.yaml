    sifies as training scales beyond single nodes.


    Standard Kubernetes networking is designed for microservices with limited east-


    west traffic and north-south API calls, and it fails to provide the required per‐


    formance characteristics. Additionally, default CNI plug-ins like OVN-Kubernetes


    introduce network virtualization overhead that further degrades performance for


    high-bandwidth distributed training workloads. The traditional TCP/IP network


    stack involves kernel context switches, copied buffer, and the standard Ethernet


    bandwidth becomes the final bottleneck for collective operations.


    **East-West and North-South Network ****Traffic**


    In data center networking terminology, traffic patterns are categorized by direction:


    *North-south **traffic*


    Communication is between clients outside the data center and services inside


    (e.g., users accessing a web application, or external API calls). This traffic
    “enters”


    and “exits” the data center, crossing the perimeter firewall.


    *East-west **traffic*


    Communication between services within the data center (e.g., microservice-to-


    microservice calls, or database queries from application servers). This traffic


    flows laterally across the internal network without leaving the data center.


    Traditional Kubernetes networking optimizes for microservices with predominantly


    north-south traffic (serving external requests) and moderate east-west traffic
    (internal


    service communication). Distributed training workloads invert this pattern, generat‐


    ing massive east-west traffic for gradient synchronization between worker pods
    while


    requiring minimal north-south connectivity.


    Platform administrators deploying production training platforms must therefore


    implement specialized network configurations that bypass standard kernel network‐


    ing stacks and leverage high-performance interconnect technologies originally
    devel‐


    oped for HPC workloads. The industry now directly applies decades of experience


    optimizing network performance for scientific computing and supercomputing clus‐


    ters to solve AI scalability challenges, as distributed training exhibits the
    same com‐


    munication patterns that HPC environments have long addressed.


    While most of the book focuses on software-level configuration and tools to enable


    LLM workloads, this section describes the hardware options that must be considered


    during cluster node setup.


    **Network Optimization for Distributed Training **



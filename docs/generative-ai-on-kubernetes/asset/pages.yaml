- pgno: 227
  md: 'The focus of this book is on the operational challenges of generative AI. From
    a


    Kubernetes platform perspective, these tuning methods manifest as long-running,


    multideployment topologies where most components require dedicated GPUs and


    the ability to communicate securely. The security of this communication is critical
    for


    production workloads and is covered in “Training Job Security” on page 250.


    **Running Tuning Jobs on Kubernetes**


    With an understanding of the different tuning techniques and their trade-offs,
    the


    following section explores how to operationalize them on Kubernetes.


    So far, we have introduced the core concepts for creating and tuning an LLM, from


    traditional full fine-tuning, to PEFT and advanced tuning pipelines. Understanding


    these different approaches is important because they have different implications
    and


    challenges from a Kubernetes platform perspective.


    This section shifts from the implementation details to the platform requirements.
    All


    of these tuning techniques have at least one training phase that requires GPUs
    for


    scaling. The GPU management principles covered in previous chapters for inference


    largely apply here as well. Refer to Chapter 3 for a recap of how to configure


    Kubernetes for GPUs and schedule workloads that require them.


    Although provisioning GPU workloads is not new, a major additional challenge


    for training is that networking can easily become the bottleneck of the system.
    A


    tuning job is not equivalent to an inference request; even for an SLM, the hardware


    requirements for tuning are greater than for serving. As a result, the job will
    likely


    require multiple GPUs on the same node or even across multiple nodes (Figure 6-6).


    In a similar scenario, based on the type of tuning performed, the system gathers
    the


    sharded weights of the model on all GPUs before every “step” of the model execution


    (in particular, every layer forward and backward passes). This action requires
    a contin‐


    uous stream of data shuffling across the GPUs and, based on the size of the model


    and the number of the GPUs, it can produce traffic of many gigabytes per second.


    The bandwidth is the main scalability challenge and requires improvements across
    the


    entire stack, from specialized network interfaces and protocols, to more efficient
    kernel


    implementations and ad hoc GPU instructions. Similar to inference optimization,


    training also has kernel implementations that benefit from dedicated GPU instructions,


    such as the Liger Kernel (optimized for Triton) and FlashAttention.


    **190 **


    **| **



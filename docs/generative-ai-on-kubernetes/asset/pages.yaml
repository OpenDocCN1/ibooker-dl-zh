    An OCI (Open Container Initiative) Registry is a standard mechanism for storing


    and distributing container images, commonly used in Kubernetes environments.


    Familiar services like Docker Hub and Quay.io have made it easy for Kubernetes


    users to store and manage images without running a registry themselves. Some


    Kubernetes distributions, such as Red Hat OpenShift, even include a built-in OCI



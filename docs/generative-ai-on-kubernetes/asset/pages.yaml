  md: '![](img/3a93443ca88ca3c8ef163f48ebd612bc_229_0.png)


    PyTorch is an open source machine learning library originally


    created by Meta and now owned by the PyTorch Foundation, part


    of the Linux Foundation.


    It has many different applications, but in the context of LLM devel‐


    opment it is used mainly as the core deep learning library: other


    end user libraries like Hugging Face Transformers use PyTorch


    and have deprecated support for other deep learning libraries like


    TensorFlow or JAX.


    The PyTorch project has many different packages that cover a large


    set of capabilities, from the core neural network implementation


    to a compiler, to a distributed package with the specific goal of


    supporting distributed training jobs. In particular, Fully Sharded


    Data Parallel (FSDP2) is the most common library used to scale the


    job on multiple nodes.


    The software and hardware stack is evolving rapidly, with the hope that many of


    these complexities will eventually become implementation details from a platform


    perspective. However, optimizing the network stack is a challenge that cannot
    be


    avoided and is covered in “Network Optimization for Distributed Training” on page


    235.


    Managing this complexity at scale requires dedicated tooling that abstracts the
    dis‐


    tributed training infrastructure from the data scientists, who need to focus on
    model


    development.


    **Kubeflow**** Trainer**


    Kubeflow Trainer is a component of the Kubeflow ecosystem designed specifically


    for managing the scaling and distribution of LLM fine-tuning. The Kubeflow project


    aims to be *the foundation for AI platforms on Kubernetes* and is evolving from
    its ori‐


    gins in predictive AI to support generative AI workloads. We previously introduced


    another component, the Kubeflow Model Registry (see “Kubeflow Model Registry”


    on page 54), in Chapter 2.


    Kubeflow Trainer’s sole purpose is to manage the Kubernetes building blocks


    required to configure, deploy, and scale long-running training jobs. The project


    designs its API for two different personas: the platform administrator, who configures


    the cluster and available resources via a TrainingRuntime, and the data scientist/AI


    engineer, who submits the training job using a TrainJob. Since these roles have


    different skills and tools, Kubeflow Trainer provides a Python Kubeflow SDK that


    abstracts the creation of the TrainJob, so the data scientist does not need to
    interact


    directly with Kubernetes resources.


    Figure 6-7 illustrates the full architecture of Kubeflow Trainer.



    While general-purpose benchmarks evaluate fundamental capabilities, production


    LLM applications often require specialized evaluation tools targeting specific
    use cases


    and risks. Retrieval-augmented generation (RAG) systems (see Chapter 8) need met‐


    rics that assess both retrieval quality and generation accuracy, while security-focused


    deployments require vulnerability scanning to identify potential risks like prompt


    injection or harmful output generation. Two frameworks address these specialized


    needs: Ragas provides metrics specifically designed for RAG applications, measuring


    context relevance, answer faithfulness, and retrieval accuracy; while NVIDIA garak

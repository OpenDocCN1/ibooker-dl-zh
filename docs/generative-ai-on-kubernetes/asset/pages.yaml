  md: '*GGUF/GGML (*`.gguf`*, *`.ggml`*)*


    Specialized self-contained formats optimized for efficient inference with quan‐


    tized weights, supporting both CPU and GPU execution. They include the mod‐


    el’s weights and basic architecture metadata but remain closely tied to runtimes


    like llama.cpp and vLLM, which are designed to efficiently handle the quantized


    structures. GGUF can also store the tokenizer data (like vocabulary data and


    special tokens). See “GGUF and GGML” on page 44 for more information about


    GGUF.


    *ONNX (*`.onnx`*)*


    A versatile, self-contained format for model interoperability. Often described
    as


    self-contained, ONNX stores the model’s weights, architecture, and metadata


    but lacks critical components like the tokenizer and vocabulary data, which are


    essential for LLMs. This makes it mostly self-contained, requiring additional
    files


    for complete language model inference. See “ONNX” on page 41 for more details.


    *TensorFlow SavedModel*


    A fully self-contained, directory-based format that stores weights, architecture,


    and auxiliary files. While common in TensorFlow ecosystems, it is rarely used
    for


    modern LLMs.


    *Hugging Face Transformers*


    The Hugging Face Transformers format is best described as a packaging conven‐


    tion rather than a standalone model format. It organizes models into a directory


    containing multiple files essential for running language models. This convention


    typically includes the model’s weights stored in formats like Safetensors (*.safeten‐*


    *sors*) or PyTorch’s `state\_dict` (*.bin*) along with two key files: *tokenizer.json*
    and


    *config.json*. These files play a crucial role in ensuring the model can process
    input


    data and apply the correct architecture during inference.


    **tokenizer.json and ****config.json**


    The *tokenizer.json* and *config.json* files are critical components for running
    LLMs


    effectively in the Hugging Face ecosystem and beyond. The *tokenizer.json* file
    stores


    the tokenization rules and vocabulary mapping for converting raw text into token


    IDs. It defines how input text is split into tokens, using techniques like Byte-Pair


    Encoding (BPE), and includes special tokens used for padding, start-of-sequence,


    and end-of-sequence markers. The *config.json* file describes the model architecture


    and hyperparameters, containing information such as the number of layers, attention


    heads, hidden sizes, and feed-forward dimensions. It often specifies the model
    type


    (e.g., `llama`) and influences how the runtime reconstructs the model graph. Together,


    these files ensure the model can preprocess input correctly (*tokenizer.json*)
    and build


    the required network structure (*config.json*). Without them, the runtime cannot
    prop‐


    erly tokenize input text or load the model architecture for inference.



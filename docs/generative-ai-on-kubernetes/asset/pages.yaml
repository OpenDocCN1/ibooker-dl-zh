  md: 'AMD follows a similar approach as NVIDIA with an AMD Device Metrics Exporter


    and a AMD GPU Operator. Intel has a Prometheus Metric Exporter, and the same


    applies to almost every other vendor. It is enough to follow the documentation
    to


    deploy the component and start collecting GPU metrics.


    No common naming convention for these metrics has been adopted by the different


    vendors, but they all cover low-level usage metrics like PCIe bandwidth or graphic


    engine activity.


    We covered more of the tools to manage and introspect GPU in Kubernetes in


    Chapter 4.


    **Quality Metrics**


    Everything we have explained in this chapter covers the *infrastructure* monitoring


    for our LLMs, observing throughput and latency so that we keep the end users’


    experience under control to match our SLA. This is critical for managing the cluster,


    but LLMs must be not only fast but also correct.


    Monitoring the model’s quality has been critical since the beginning of the adoption


    of machine learning in production systems in general: an application that receives


    unknown data as a request will probably crash or produce a visible error message,


    while a machine learning model in the same situation usually doesn’t crash and
    just


    continues to produce bad/wrong predictions.


    A machine learning model is trained on a specific set of data that is expected
    to


    represent the real distribution, but human behavior changes over time (drift),
    and


    a perfectly trained model requires periodic tuning or retraining to preserve quality.


    The problem is well-known, and multiple techniques are used to monitor similar


    situations, such as performance metrics, data drift detection, and bias detection.


    This group of techniques, along with many other concerns, falls under a larger
    initia‐


    tive known as *responsible AI*. This area of research has been defined and developed


    before generative AI and is now evolving to cover the new challenges that LLMs
    bring


    to the table.


    In particular, given the generative nature of LLMs, there are many ways for a
    model


    to produce an incorrect result, and the worst-case scenario is when the generated


    outcome sounds completely reasonable but is referring to something that doesn’t


    exist. This problem, called a *hallucination*, is one of the most complex situations
    to


    manage and one of the biggest challenges for the adoption of LLM in real-world


    scenarios. While the hallucination in Example 5-6 may seem harmless, consider
    a


    scenario where a company chatbot hallucinates and approves a refund based on a


    nonexistent policy.


    **Quality Metrics **


    **| **



    *Figure 8-10. Agentic control loop*


    This flow is a refinement of the well-known *ReAct loop* that we describe in the


    following sidebar. This loop applies for simple agents and builds the foundation
    for


    more complex scenarios involving *multiagents*, described in “Multiagent Systems”
    on


    page 295, and *ambient agents* that we explore in “Ambient Agents” on page 298.


    **The ReAct Loop**


    The ReAct pattern interleaves *chain-of-thought* (CoT) reasoning with tool actions


    so the model can think, act, observe, and repeat in a compact loop. Originally


    introduced by Yao et al. in the paper “ReAct: Synergizing Reasoning and Acting
    in


    Language Models”, ReAct showed that models reduce hallucinations and improve


    success rates when they can alternate between reasoning and calls to external
    sources,


    such as a search API. In a ReAct agent, the LLM emits intermediate thoughts and,


    when needed, an action with JSON arguments; the tool executes, the observation
    is


    appended to context, and the model continues until a stop condition. In production


    you do not expose CoT to users—you keep traces internal or replace them with


    summaries—but the control flow stays the same. Log each thought, action, and


    observation as structured records so you can debug behavior later and correlate
    cost


    with quality.


    Let’s focus for the moment on the *Act* part of the agentic control loop, as it’s
    the


    crucial step that allows including information that is not part of the model’s
    training


    data either because it is too new or it is domain-specific information that is
    not


    accessible for the model training. These actions are commonly referred to as *tools*
    and



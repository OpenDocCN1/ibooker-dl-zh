- pgno: 33
  md: '**Decode**


    After the prefill, the user’s prompt is parsed, loaded, and the first token is
    produced


    with a single forward pass of the neural network. The decode phase is in charge


    of the generation of the rest of the tokens until the end-of-stream token (`<EOS>`)
    is


    produced or the max number of tokens to be generated is reached. This phase cannot


    be parallelized and it has to proceed one token at a time because of the autoregressive


    nature of the generation. Autoregressive means that each generated token is based
    on


    the previous sequence and becomes part of the previous state used to generate
    the


    next one. At each iteration, the entire sequence (input prompt + generated tokens)


    is used to produce the next token. There is an attention vector for each token
    of the


    sequence so the consequence of this iterative process is that the attention vector
    has a


    cost that scales quadratically with the total sequence length.


    The optimization of this quadratic cost is the key bottleneck for the scalability
    of LLM


    inference, especially with very long generated sequences.


    There are various approaches to address this problem, each tackling it from a
    differ‐


    ent angle. Some approaches are more experimental, such as using a smaller draft


    model to generate candidate tokens that are then verified in parallel by the larger


    target model (*speculative decoding*). Others, like *KV caching* to save intermediate
    steps


    and avoid recomputing them, are already standard in all runtimes.


    Let’s focus on *KV caching*. We already mentioned that the decoding phase of the


    generation is memory-bound. The availability and management of memory directly


    impacts the max throughput that the runtime can produce—but why?


    The autoregressive nature of the generation phase makes it use the entire previous


    sequence. This means that after every generation step, the runtime must compute


    the attention values for each of the previous tokens, making the generation phase


    highly inefficient. Most of the values have been already computed except for the
    last


    token. A KV cache is introduced to avoid this computation, where the keys are
    the


    tokens and the values are the attentions vectors. This moves the scalability challenges


    from the computation side to the cost of storing and accessing all the previous
    values,


    making the problem memory-bound. Optimizations like Flash Attention address


    this by minimizing data movement between GPU memory levels during attention


    computation.


    Moreover, given that we cannot predict the total length of the output, we cannot


    estimate the size of this cache. The original implementation of this cache required


    contiguous memory to store it. This limitation has now been addressed with


    PagedAttention, which introduces the concept of paginated memory, similar to how


    operating systems manage memory. It splits the cache into blocks and accesses
    them


    via a lookup table.


    **xxxii **


    **| **


    **Introduction**'

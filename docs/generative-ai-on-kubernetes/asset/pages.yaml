    kind of multistep interaction requires the agentic flow to be *stateful* to keep


    the conversation history. Client-side tool calling is quite fragile, as every
    agentic


    framework expects the tool call request to be in a different format.


    *Server-executed tools*


    The agent runtime (such as LangChain, CrewAI, or similar frameworks) executes



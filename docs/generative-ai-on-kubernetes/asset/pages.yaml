- pgno: 174
  md: 'rather than mutable tags like `latest`, or even better, pin the image by its
    digest


    hash (e.g., `vllm/vllm-openai@sha256:abc123...`) to ensure you always deploy


    the exact same image version across all environments.


    *2\. Model retrieval and mounting*


    The method chosen for storing and retrieving a model significantly impacts


    loading performance; a poor design choice can become the primary bottleneck.


    Common options include downloading on the fly from Hugging Face, storing


    on S3-compatible storage, copying to a Persistent Volume Claim (PVC) and


    mounting as a volume, or packaging as an Open Container Initiative (OCI)


    image. Of these, direct download from Hugging Face and the S3 option are


    inefficient, often taking many minutes due to data transfer and local copying;


    conversely, PVC and OCI approaches prevent this local copying by mounting


    the model directly as a volume or sidecar container. If specific requirements


    necessitate using Hugging Face or S3, it is highly recommended to leverage the


    KServe local model cache option. This feature configures a local cache using the


    model’s storageUri as a key, ideally combined with fast storage hardware like


    solid state drives (SSDs) via the Non-Volatile Memory Express (NVMe) protocol.


    Thanks to the KServe local model cache, Hugging Face and S3 performance


    effectively become equivalent to that of using a PVC. Training workloads face


    similar storage challenges for managing large datasets and model checkpoints,


    with additional considerations for distributed filesystems and checkpoint strate‐


    gies, which are covered in Chapter 7.


    *3\. Starting the runtime*


    The startup time of vLLM usually takes a second or less. It produces useful


    information in the logs, as explained in Example 5-1, but from a loading time


    perspective it is not critical.


    *4\. Loading the model*


    Regardless of the option selected to retrieve and mount the model, when the


    vLLM runtime starts, the model must be available for loading, and most of the


    time is spent loading the model weights by copying them to GPU memory. The


    work to reduce the time to ready a new runtime replica to serve the model is


    mainly focused on this particular phase. This work has a physical upper bound


    that is the I/O bandwidth to the GPU memory, so it is not possible to get faster


    than that, but the loading time of a model without optimization is pretty far


    from the physical limit. At the infrastructure level, technologies like NVIDIA


    GPUDirect Storage can significantly speed up data transfer by enabling direct


    paths between NVMe storage and GPU memory, bypassing the CPU. There


    are three different extensions in vLLM with projects that are specialized for


    the loading time problem: CoreWeave Tensorizer, Run:ai Model Streamer, and


    fastsafetensor.


    **Optimize vLLM Startup Time **


    **| **


    **137**'

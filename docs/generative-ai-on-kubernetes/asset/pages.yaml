    **The Agentic AI Foundation**


    The Agentic AI Foundation (AAIF) is a Linux Foundation project launched in 2025


    to develop open standards for agentic AI systems. The eight founding platinum


    members are AWS, Anthropic, Block, Bloomberg, Cloudflare, Google, Microsoft, and


    OpenAI.


    The foundation’s stated vision is to provide “a neutral, open foundation to ensure
    this


    critical capability evolves transparently, collaboratively, and in ways that advance
    the


    adoption of leading open source AI projects.”


    The foundation launched with three initial projects:


    *Model Context Protocol (MCP)*


    An open protocol that defines how LLM applications connect to external data


    sources and tools. Agents use MCP to discover available functions through


    JSON schema definitions and invoke them using a standard JSON-RPC message


    format.


    *goose*


    An open source AI agent that can install packages, run shell commands, modify


    files, and execute tests. Unlike code completion tools that suggest edits, goose


    performs these operations directly and works with any LLM backend.


    *AGENTS.md*


    A file format specification for documenting how AI coding agents should interact


    with a codebase. Projects use *AGENTS.md* files to describe their directory struc‐


    ture, build processes, testing conventions, and preferred workflows.


    The foundation operates under Linux Foundation governance, which means technical


    decisions go through steering committees rather than being controlled by any single


    company. New projects and member organizations can join through the standard


    Linux Foundation contribution process.


    The AAIF is very young (only months old at the time of writing). However, the
    par‐


    ticipation of eight major technology companies suggests it will likely play a
    significant


    role in how agentic AI standards develop over the next few years.


    Let’s start by exploring the Model Context Protocol, which gives agents a standard‐


    ized way to connect to the tools and data sources they need to get work done.



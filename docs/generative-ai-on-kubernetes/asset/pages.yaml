  md: '![](img/3a93443ca88ca3c8ef163f48ebd612bc_137_0.png)


    A pod requesting multiple time-sliced GPUs (e.g., `nvidia.com/`


    `gpu: 2` when GPUs are in shared mode) doesn’t gives you twice


    the performance of a single GPU. Instead, it receives shares on


    two separate physical GPUs, each shared with other workloads,


    which is rarely useful. To prevent this confusion, the device plug-in


    can be configured to reject requests for more than one GPU in


    shared mode. Time-slicing is intended for scenarios where each


    pod requests exactly one GPU, understanding that this “one GPU”


    represents a fraction of a physical GPU. For multi-GPU workloads,


    keep those GPUs exclusive or use MIG.


    Time slicing is great for oversubscribing GPUs in environments where workloads
    are


    bursty or lightweight. For example, if you have a powerful GPU but lots of small


    inference tasks or interactive notebooks, you could run several on one GPU so
    it’s


    utilized more efficiently. Each job might run a bit slower if they all truly contend


    for GPU, but overall throughput can improve. Time slicing also allows older GPUs


    (that don’t support MIG) to be shared. If you have NVIDIA T4 or V100 GPUs in


    a lab cluster running many smaller models, time slicing might let you run two
    or


    three per GPU concurrently, maximizing hardware use. Just be mindful of the lack


    of memory isolation: you must size your models so that together they fit in GPU


    RAM. Admittedly, time slicing might not be so useful in the context of LLMs, which


    are typically so large that they need to allocate the full physical memory offered
    by a


    GPU.


    For scenarios requiring stronger isolation guarantees and fixed memory allocations


    per workload, NVIDIA offers a hardware-based solution called Multi-Instance GPU


    (MIG).


    **Multi-Instance GPU**


    NVIDIA Ampere and newer GPUs (like A100, A30, H100, and Blackwell B100/B200)


    offer MIG, a feature that lets you partition a physical GPU into several hardware-


    isolated instances. Each instance (or *MIG slice*) has its own dedicated compute


    cores, memory carve-out, and even separate engine contexts—it’s like having multiple


    smaller GPUs in one card. For example, an A100 40-GB GPU can be split into up
    to


    seven MIG instances. The smallest configuration is 1g.5gb (one GPU slice with
    five


    GB memory each). Each MIG device acts like a mini GPU with guaranteed memory


    and isolated Streaming Multiprocessor (SM) resources.



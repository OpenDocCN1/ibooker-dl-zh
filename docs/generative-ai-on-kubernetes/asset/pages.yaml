    **Hybrid parallelism**


    While tensor parallelism and pipeline parallelism each address different challenges,


    they can be combined for maximum scalability in production deployments. Many


    systems adopt a hybrid parallelism approach: using tensor parallelism within each


    node and pipeline parallelism across nodes. This hybrid approach leverages fast
    local


    links for intra-node splitting, and uses pipeline stages to span multiple machines


    without requiring excessive cross-node communication. The rule of thumb is: use


    pipeline parallelism across nodes and tensor parallelism within a node when network


    links are slow, but if you have a very fast interconnect between nodes, tensor
    parallel‐



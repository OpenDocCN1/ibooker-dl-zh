    **MCP Security**


    When an AI agent calls an MCP tool that reads customer records, posts to Slack,


    or queries a database, a fundamental question surfaces: whose identity should
    the


    upstream API see? Should it see the end user who triggered the agent, the agent’s
    own


    service account, or something else entirely?


    In a traditional microservices architecture, service-to-service authorization
    is well


    understood. You might use mutual TLS with a service mesh, OAuth2 client creden‐


    tials flow, or API keys scoped to specific services. Identity propagation patterns
    like


    token relay or the ambassador pattern help thread user context through multiple


    hops.


    However, agentic architectures bring additional challenges to the table.


    First, they introduce nondeterminism. Unlike a deterministic microservice, an
    agent’s


    behavior is shaped by the LLM’s reasoning, which means you cannot predict exactly


    which tools it will call or in what order. Traditional authorization policies
    that grant


    “Service A can call endpoint B” do not translate cleanly when Service A is an
    agent


    that might call 10 different tools based on a user prompt.


    Second, they create identity ambiguity. When an agent calls a tool on behalf of
    a


    user, should the upstream API see the user’s identity to enforce per-user permissions


    and quotas, or should it see the agent’s identity to track agent actions and enforce


    agent-level rate limits? The answer depends on your compliance requirements, but


    the question itself is harder to answer than in traditional flows.


    These challenges force you to make explicit choices about identity propagation
    that


    were implicit or automatic in simpler architectures. The four approaches¹ we describe


    next represent different points on the trade-off curve among security, operational


    simplicity, and integration with existing infrastructure:


    *Agent Impersonation (Token Passthrough)*


    The agent forwards the user’s access token to MCP servers and upstream APIs,


    preserving user identity for RBAC and audit logging.



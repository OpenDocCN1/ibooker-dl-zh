    This chapter addresses three core challenges for running agentic applications
    on


    Kubernetes:


    *Security*


    Agents interact with external tools and data sources, often on behalf of users.


    You need robust identity management, authentication patterns, and authori‐


    zation controls that preserve user context while allowing agents to operate


    autonomously.


    *Agent coordination*


    Multiagent systems require standardized communication protocols. Agents must


    discover each other’s capabilities, delegate tasks, and track progress across
    service


    boundaries.


    *State management*



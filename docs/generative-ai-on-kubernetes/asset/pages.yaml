    smaller-scale training workloads.


    AMD Infinity Fabric serves as AMD’s equivalent interconnect technology for


    their Instinct MI-Series GPUs (MI250X, MI300X). Infinity Fabric provides high-


    bandwidth GPU-to-GPU and GPU-to-CPU communication with comparable perfor‐


    mance characteristics to NVLink, supporting approximately 900 GBps bidirectional


    bandwidth in 8-GPU MI300X platform configurations. Similar to NVIDIA’s


    approach, AMD’s architecture enables direct memory access between GPUs through


    point-to-point links optimized for small-scale multi-GPU servers.


    Both NVLink and Infinity Fabric connectivity are limited to specific server config‐


    urations because GPUs must be physically connected through proprietary cables


    or installed in servers with integrated backplanes, making them primarily intra-


    node communication technologies for direct GPU-to-GPU links. Notable exceptions


    include NVIDIA’s DGX SuperPOD architectures and AMD’s Open Accelerator Mod‐


    ule (OAM)-based systems that use these interconnects for small-scale multinode


    training.


    **NVSwitch**


    For larger GPU configurations requiring full mesh connectivity across eight or
    more


    GPUs within a single server, switching fabrics like NVIDIA NVSwitch extend beyond


    point-to-point links to create nonblocking communication paths between all GPUs


    simultaneously.


    NVSwitch technology serves as the switching infrastructure that enables full mesh


    GPU-to-GPU connectivity within servers containing 8 to 16 GPUs, with each GPU


    achieving up to 900 GBps aggregate bandwidth to the switch fabric. Unlike point-to-


    point NVLink connections that directly connect pairs of GPUs, NVSwitch acts as


    a centralized switching fabric where NVLink serves as the physical link technology


    connecting each GPU to the switch, and the switch provides nonblocking paths


    between any GPU pair.


    This architecture appears in NVIDIA DGX systems and other high-end AI train‐


    ing servers, where NVSwitch enables all-to-all communication patterns required
    by


    large-scale distributed training jobs that need to synchronize gradients across
    many


    GPUs simultaneously without communication bottlenecks. The full mesh topology


    ensures that collective operations like all-reduce and all-gather can execute
    with


    consistent bandwidth regardless of which GPUs participate in the communication,


    eliminating the hot-spot contention that would occur if multiple GPUs attempted
    to


    communicate through a single point-to-point link.



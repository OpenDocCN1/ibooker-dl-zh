    **Emerging Kubernetes Agent Experiments**


    Two efforts that emerged in 2025 have gained traction as they move toward production


    readiness. First, the Kubernetes community’s agent sandbox explores a controller
    and


    custom resource for isolated, stateful, singleton-style runtimes with stronger
    bound‐


    aries, persistent identity, and hibernation and resume. The goal is to support
    interactive


    or untrusted agent workloads that benefit from VM-like isolation, yet stay manageable


    as pod-shaped resources. Second, Kagenti positions itself as framework-neutral
    middle‐


    ware with an operator and a uniform surface for agents, aiming to standardize
    identity,


    configuration, and exposure while integrating protocol bridges such as MCP and
    A2A.



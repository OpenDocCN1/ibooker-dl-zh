  md: '*User query processing*


    Embeds the user’s prompt, retrieves similar chunks, optionally reranks, and


    assembles the final prompt to the LLM, as described in “User Query Processing”


    on page 281.


    ![](img/3a93443ca88ca3c8ef163f48ebd612bc_312_0.png)


    *Figure 8-6. **The** two RAG phases: document ingestion and user query processing*


    A RAG setup consists of several cooperating components. Before we learn how those


    components are operated on Kubernetes, let’s look at their responsibilities.


    **RAG Components**


    A typical RAG architecture comprises distinct services that map well to microservice


    boundaries. Figures 6-2 and 8-6 showed an overview of RAG pipelines and their
    core


    building blocks. Here we look closer at those components individually, then in
    “RAG


    on Kubernetes” on page 283 we map them to the proper Kubernetes workload types.


    These components are included in a RAG setup:


    *Vector database*


    A specialized data store for high-dimensional vectors, also called *embeddings*.


    The vector database holds your knowledge base in vector form, enabling fast


    nearest-neighbor search. It returns the documents or snippets most similar to
    a


    given query vector. “Vector Databases in a Nutshell” on page 277 has more details


    about and pointers to vector databases. In a RAG system, the vector database is


    the “memory” that we query for relevant context.


    **Retrieval-Augmented Generation **



- pgno: 42
  md: '*Example 1-1. Load and execute Llama 3 1B using Transformers*


    `**import**`` ``**transformers**`


    `**import**`` ``**torch**`


    `**import**`` ``**os**`


    `model\_id`` ``\=`` ``"meta-llama/Llama-3.2-1B-Instruct"`` `


    `pipeline`` ``\=`` ``transformers``.``pipeline``( `


    ` ``"text-generation"``,`


    ` ``model``\=``model\_id``,`


    ` ``device\_map``\=``"auto"``,`


    ` ``torch\_dtype``\=``torch``.``bfloat16``, `


    ` ``token``\=``os``.``environ``.``get``(``"HF\_TOKEN"``) `


    `)`


    `messages`` ``\=`` \[`


    ` {``"role"``: ``"user"``, ``"content"``: ``"Hey how are you doing today?"``}`


    `\]`


    `result`` ``\=`` ``pipeline``(``messages``, ``max\_new\_tokens``\=``256``)`


    `print``(``result``\[``0``\]\[``"generated\_text"``\]\[``\-``1``\]\[``"content"``\])
    `


    The model identifier in Hugging Face format.


    Load and initialize the model.


    Use `bfloat16` precision for better performance and memory efficiency.


    Some models require a Hugging Face token to authorize the download. Get your


    token from your Hugging Face profile settings.


    Extract and print only the assistant’s response from the result.


    While this example demonstrates the basic mechanics of loading and running a model,


    it has limitations for real-world use. The prompt is hardcoded, and there’s no
    way for


    users to interact with the model. To make this practical, we need to accept user
    input


    and expose the model through an endpoint that can handle multiple requests.


    Revisiting Example 1-1, we can make it more flexible by accepting the prompt via
    an


    endpoint to make it more similar to a real-world scenario. The easiest improvement


    is to avoid downloading the model on the fly every time runtime is started. The


    pattern to download and initialize the model is quite common during the develop‐


    ment and experimentation phase, but it is possible, and usually suggested, to
    make


    the model available to the cluster without the need to access internet. There
    are


    different file formats, storage options, and loading techniques; see Chapter 2
    for more


    information.


    **“It Works on My Machine” **


    **| **


    **5**'

  md: 'monitoring, understanding how LLMs process requests becomes essential. The
    met‐


    rics we monitor (such as Time To First Token, token throughput, and KV cache


    utilization) are directly tied to the LLM inference pipeline.


    If you skipped the LLM fundamentals section in “Understanding LLM Fundamen‐


    tals” on page xxv, you should review it before diving into observability specifics.
    That


    section covers tokenization, embeddings, the prefill and decode phases, and concepts


    like compute-bound versus memory-bound workloads. These concepts provide the


    foundation for understanding why we monitor specific metrics and what they reveal


    about production performance.


    For the rest of this chapter, we’ll assume basic familiarity with these concepts
    as we


    focus specifically on observability tools, techniques, and best practices for
    production


    LLM deployments on Kubernetes.


    **Observability Stack and ****Configuration**


    This section explores the observability tools and practices for monitoring LLM
    work‐


    loads on Kubernetes. We can reuse or adapt existing Kubernetes tools and established


    practices for workload observability when monitoring LLM workloads.


    The observability of a workload involves different aspects: inspecting logs to
    find


    errors, collecting metrics for time-series analysis, correlating execution steps
    via


    tracing, proxying the traffic as sidecars, or even injecting modules directly
    in contain‐


    ers. This is true for application workloads, and most of the same applies to LLM


    deployment using KServe and vLLM.


    **Logs**


    Kubernetes has a defined logging architecture where both `stdout` and `stderr`
    are


    redirected to a *log-file.log* in the worker node where the container is running.
    This


    makes logs easy to access via the `kubectl logs` command, but it doesn’t provide


    long-term storage for logs or indexing. This is something you need to add to your


    cluster using one of the different available projects, like Grafana Loki.


    When deploying a model as an InferenceService, the KServe controller creates


    the deployment with multiple containers. These include an initContainer named


    `storage-initializer` to load the model, the `kserve-controller` where the model


    server runs, and additional sidecar containers, depending on the deployment mode


    (Knative or ModelMesh; see “KServe” on page 20 for more details).


    The introspection and the management of the logs for LLM is analogous to the


    application workload. To understand what information is available in these logs,
    we


    will cover a typical vLLM startup sequence.



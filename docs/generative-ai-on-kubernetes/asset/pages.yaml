  md: '**Prometheus, OpenMetrics, and OpenTelemetry**


    The Prometheus project is the most widely adopted solution for metrics, but initially,


    the metrics format was not formalized with a specification. Over time, multiple


    attempts were made, and now OpenMetrics is the specification that extends the


    original Prometheus format while preserving almost full backward compatibility.


    The OpenTelemetry project is a collection of API definitions, SDKs, and tools
    to


    cover all aspects of observability. The project goes beyond the definition, proposing


    semantic conventions to standardize naming for metrics and trace entries. These


    conventions establish a core set of standards to be adopted by every implementation.


    In addition, the OpenTelemetry community is defining semantic conventions for


    metrics, spans, and events in many different contexts. LLM observability (under
    a


    more general generative AI of the OpenTelemetry subproject) is one of these contexts,


    and an experimental specification already defines a core set of semantic conventions.


    As usual, predicting the adoption of similar specifications and conventions is
    chal‐


    lenging. However, there is significant interest within the community. Many active


    members are already contributing to the adoption of these conventions across differ‐


    ent runtimes.


    The vLLM implementation for tracing is already based on this semantic convention


    work.


    This effort to consolidate to common semantic conventions in observability is
    analo‐


    gous to the KServe Open Inference Protocol (OIP) work where the goal is to unify
    the


    shape of model evaluation endpoints.


    **Model Server Metrics**


    With the metrics stack installed, an LLM deployed using KServe, and vLLM properly


    configured to emit metrics, model server performance can be analyzed. In this
    sec‐


    tion, we’ll explore the key metrics specific to LLM workloads that differ significantly


    from traditional application monitoring.


    We are used to monitoring workload on Kubernetes, so we can easily look at metrics


    like CPU usage, memory usage, throughput (the number of requests per second),
    and


    latency (the time to process a request). The same approach applies to LLMs, but
    with


    important differences.


    Understanding how LLMs work reveals that monitoring workload is not so simple.


    First of all, an LLM workload happens mainly on the GPU, so tracking CPU usage


    is not a good representation of the current usage of the system. Even worse than


    that: the two main phases of LLM inference execution, prefill and decode, are
    very


    **160 **



  md: 'Standard is required to use KEDA autoscaler. Knative uses KPA, which is its


    own autoscaler.


    This annotation enables KEDA autoscaler.


    One option to collect metrics local to the pod is via the OpenTelemetry


    sidecar collector.


    The `PodMetric` type configures KEDA to directly query the pod to collect the


    metrics.


    It is necessary to specify the backend because OpenTelemetry and Prome‐


    theus have some protocol differences.


    The query that KEDA performs to make the decision can be a single value or


    a more complex query following the PromQL syntax.


    In this example, the value `4` means that KEDA will increase the number


    of replicas (within the defined 1–5 boundaries) if at least four requests are


    already running in vLLM based on some preliminary benchmark that has a


    measured latency distribution with a higher number of concurrent requests.


    This commented spec is the other configuration where the metrics are quer‐


    ied from an external source.


    When the type is `External` it is necessary to specify the server address where


    the query should be executed.


    The evolution of LLM serving includes the autoscaling topic, and new custom tech‐


    niques are under development for most complex scenarios, like disaggregated prefill.


    “Disaggregated Serving” on page 148 describes disaggregated prefill, which differs


    significantly from traditional Kubernetes autoscaler definitions. It functions
    more


    like a “runtime controller” that observes system status and automatically rebalances


    replica roles or adjusts replica counts for each role.


    Another emerging approach is llm-d’s Workload Variant Autoscaler (WVA), designed


    specifically for LLM workloads. Instead of just monitoring CPU or request counts,


    WVA looks at what each pod can handle, considers that different requests require


    different amounts of work (some generate many tokens, others just a few), and
    scales


    based on your actual latency targets. This allows you to run your cluster at higher


    utilization before adding more pods, while still meeting your performance goals.


    WVA is part of the llm-d project discussed in “Disaggregated Serving” on page
    148.


    **Autoscaling **



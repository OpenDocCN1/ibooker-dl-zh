    Verify alignment through monitoring: if eviction count increases


    continuously without node consolidation progress, an eviction


    loop likely exists, requiring policy correction.


    **Gang Scheduling**


    The scheduler optimizations covered previously (bin packing for cost efficiency


    and descheduler for dynamic re-optimization) address how individual pods are


    placed and maintained on nodes. However, distributed training jobs introduce a


    fundamentally different challenge: ensuring that all components of a multipod
    job are


    scheduled together as an atomic unit. The default per-pod scheduling model works


    efficiently for containerized applications and microservices, but it fundamentally


    breaks down for distributed training jobs where the scheduler has no awareness


    that multiple pods belong to a single coordinated workload. Each pod schedules


    independently. For instance, the scheduler may successfully place seven out of
    eight


    workers, tying up GPU assigned resources while the job deadlocks waiting for the


    missing worker that cannot be scheduled due to resource exhaustion; this is also


    called *resource fragmentation*.


    Large-scale LLM training jobs require an all-or-nothing approach for scheduling


    because frameworks like PyTorch use a *rendezvous mechanism* where all workers


    must discover each other and synchronize at a barrier before training can begin.


    Similarly, DeepSpeed and other frameworks establish communication barriers during


    each training iteration to coordinate gradient synchronization. If even a single
    worker


    is missing, the rendezvous barrier cannot complete, causing the entire job to
    deadlock


    while consuming GPU resources on already-scheduled workers. A cluster is designed


    to handle multiple concurrent users who simultaneously submit their training jobs


    with the expectation of a fair scheduling policy that guarantees the execution
    within a


    certain time/SLO.



- pgno: 200
  md: '**Request Queue Metrics**


    All the previous metrics are critical to measure and keep track of the overall
    speed of


    the system, but what happens when too many requests are coming in? Every time
    a


    request is received by vLLM, batching techniques are implemented to maximize the


    throughput, but this also means that a request might not be processed immediately
    if


    the batch is full.


    Other metrics track request queues: `vllm:num\_requests\_waiting` shows requests


    waiting to be processed, while `vllm:num\_requests\_running` shows currently execut‐


    ing requests.


    vLLM metrics can be used to observe many other aspects of execution. For example,


    we’ve explained the importance of the KV cache for efficient token generation,
    and


    there are multiple metrics to monitor its usage. See the Production Metrics web
    page


    for full documentation on vLLM’s available metrics. If you want to implement an
    alert


    with Prometheus, refer to Example 5-5.


    *Example 5-5. Create a Prometheus rule with vLLM metrics*


    `**apiVersion**``:`` ``monitoring.coreos.com/v1`


    `**kind**``:`` ``PrometheusRule`


    `**metadata**``:`


    ` ``**name**``:`` ``my-llm-rule`


    `**spec**``:`


    ` ``**groups**``:`


    ` ``\-`` ``**name**``:`` ``"vllm.latency.rule"`


    ` ``**rules**``:`


    ` ``\-`` ``**alert**``:`` ``vLLMLatency`


    ` ``**expr**``:`` ``max\_over\_time(time\_per\_output\_token\_seconds}\[5m\])
    >= 0.3`` `


    ` ``**labels**``:`


    ` ``**severity**``:`` ``critical`


    ` ``**app**``:`` ``my-model`


    ` ``**annotations**``:`


    ` ``**message**``:`` ``Latency of vLLM is too high.`


    ` ``**summary**``:`` ``Model "my-model" needs to keep latency < 0.3 second`


    ` ``**runbook\_url**``:`` ``https://my.company/runbooks/vllm/modelslow`` `


    ` ``**description**``:`` ``The runtime is slowing down, check request queue`


    This expression configures the condition to fire the alert.


    It is possible to link a runbook (a documented procedure for responding to this


    alert) to help on-call engineers troubleshoot the issue.


    When defining alerts and monitoring strategies, understanding the relationship


    between service-level metrics helps establish meaningful thresholds (see the next


    sidebar).


    **Model Server Metrics **



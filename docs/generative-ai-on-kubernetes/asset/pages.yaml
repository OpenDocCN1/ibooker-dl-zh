    KubeRay, which provides the necessary APIs. This allows you to deploy a RayCluster


    and then submit a RayJob to perform a long-running, multinode computation for


    model customization. The process is similar to the Kubeflow Trainer example: you


    create a Python script with the training logic, instantiate a RayCluster (a step
    not


    required by Kubeflow Trainer), and then deploy the job. However, code delivery


    differs: while Kubeflow Trainer serializes and injects Python functions, Ray requires


    training scripts packaged in container images or accessible via remote locations
    (Git


    repos, mounted volumes), with the RayJob CR referencing the script path rather
    than


    embedding code. This means that Ray requires container rebuilds for code changes,


    making it better suited for teams already using the Ray ecosystem, while Kubeflow


    Trainer’s immediate re-execution supports rapid experimentation. A full example
    of


    using DeepSpeed and Ray to fine-tune an LLM can be found in this opendatahub-io



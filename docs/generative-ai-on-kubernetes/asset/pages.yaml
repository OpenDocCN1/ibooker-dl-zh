- pgno: 13
  md: 'specific requirements of large language models (LLMs) with their enormous data


    structures and special hardware needs.


    This book examines the various challenges and solutions for operating generative
    AI


    in general and LLMs in particular.


    **Why We Wrote This Book**


    Our motivation to write this book stems from the growing need to bridge the gap


    between Kubernetes experts and the emerging demands of running LLM production.


    As LLMs have become increasingly essential in various industries, the challenge
    is


    no longer just about developing these models but also about deploying, scaling,
    and


    maintaining them effectively in real-world production environments.


    We approach LLM workloads as black boxes by acknowledging their operational


    complexity without requiring the deep insights of a data scientist. This perspective
    is


    crucial for Kubernetes practitioners who want to operationalize these models without


    delving into the details of machine learning (ML). By focusing on Kubernetes as
    the


    underlying platform, we provide practical guidance on how to use Kubernetes to


    meet the unique requirements of LLMs, ensuring they run efficiently, securely,
    and at


    scale.


    This book is our contribution to helping you with the challenges of operationalizing


    generative AI on Kubernetes, empowering you to bring LLMs and AI-driven applica‐


    tions into production with confidence.


    **Kubernetes**


    Kubernetes, also referred to as K8s, is a container orchestration platform designed


    to automate the deployment, scaling, and management of containerized applications.


    Initially focusing on stateless applications, it has evolved to support stateful
    work‐


    loads such as databases and messaging systems. Today, Kubernetes stands out as
    the


    dominant operational platform for a wide array of traditional workloads, and it
    is


    increasingly pivotal in the AI domain.


    Several pioneering initiatives and organizations have chosen Kubernetes to power


    their AI workloads, benefiting from its robust scalability and resilience. For
    instance,


    companies like Google and OpenAI leverage Kubernetes to manage their complex


    machine learning pipelines and deployment processes.


    Kubernetes abstracts and automates many operational aspects, such as scaling,
    load


    balancing, and self-healing. This allows developers and MLOps engineers to focus


    on domain-specific tasks without worrying about the underlying infrastructure.
    Its


    support for declarative configuration and infrastructure as code, which can be
    lever‐


    aged with GitOps, ensures consistency and reliability across deployments.


    **xii **


    **| **


    **Preface**'

- pgno: 367
  md: 'A2A, in contrast, connects agents to other agents. When one agent needs another


    agent to perform work that requires reasoning, planning, or iteration, it uses
    A2A to


    delegate that task. The receiving agent is not a passive tool but rather an autonomous


    system that can break down the request, call its own tools, and make decisions
    about


    how to proceed. A2A follows an asynchronous task delegation model with lifecycle


    tracking: the requesting agent submits a task, receives a task identifier, and
    polls or


    subscribes to status updates as the receiving agent works through the problem.
    This


    asynchronous nature reflects the reality that agents often need time to reason
    and


    iterate before producing results.


    You could model another agent as an “MCP tool” and use MCP for inter-agent


    communication. This approach works for simple delegation scenarios where you just


    need to hand off a request and wait for a response. However, treating agents as
    tools


    loses the richer semantics that A2A provides. MCP does not yet have a concept
    of


    agent capability discovery, so you cannot programmatically find agents with specific


    skills. MCP has no task lifecycle tracking, so you cannot monitor long-running
    agent


    work or cancel tasks that are no longer needed. Designed as a frontend for classical


    deterministic APIs, MCP does not support streaming of intermediate reasoning steps,


    so you cannot observe an agent’s progress as it works through a multistep plan
    when


    implemented as an MCP server.


    The best practice is to use A2A for cross-agent orchestration and MCP for tool


    integration within each agent. This separation of concerns keeps your architecture


    composable. Each agent uses MCP to connect to its own set of tools and data sources,


    and uses A2A to coordinate with other agents when the work requires delegation


    to another reasoning system. You can upgrade, replace, or scale individual agents


    without disrupting the tool integrations, and you can change tool implementations


    without affecting agent coordination.


    **A2A in a Nutshell**


    A2A builds on standard web protocols: HTTP for transport, JSON for data represen‐


    tation, and JSON-RPC for structured method calls. This makes it approachable for


    teams already familiar with REST APIs and service-to-service communication. The


    protocol introduces three core concepts that enable robust multiagent coordination.


    The first concept is the *agent card*, a JSON document that describes what an
    agent


    can do. An agent card lists the skills the agent offers, the input formats it
    accepts,


    the output formats it produces, and the protocol versions it supports. This serves
    the


    same role as an OpenAPI specification for a REST API: it tells other agents what
    to


    expect when they interact with this agent. A simplified agent card for a code
    reviewer


    is shown in Example 9-13.


    **330 **


    **| **



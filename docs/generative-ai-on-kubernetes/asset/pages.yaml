  md: '![](img/3a93443ca88ca3c8ef163f48ebd612bc_240_0.png)


    It is important not to confuse Ray Tune with LLM model tuning.


    Ray Tune is a module designed for hyperparameter tuning and


    optimization, which mainly applies to predictive AI.


    The equivalent project in the Kubeflow community is Kubeflow


    Katib.


    While not designed for model customization, it is still possible


    to use Ray Tune with the Hugging Face transformers library for


    hyperparameter optimization techniques like Population Based


    Training (PBT), as described in this example.


    **Unsloth**


    The Unsloth project specifically targets the LLM customization process with the
    goal


    to make it easy, fast, and with limited hardware requirements. It has a large
    and active


    community. While not designed for large-scale infrastructure on Kubernetes, it
    is


    very easy to start with, as it can be installed locally as a standard Python package
    (`pip`


    `install unsloth`). In this respect, it can be seen as the fine-tuning equivalent
    of local


    inference projects like Ollama or llama.cpp. Although designed as a local library,
    it is


    possible to deploy it on Kubernetes using the AIKit project.


    **Lessons Learned**


    In this chapter we explored model customization techniques, from prompt engineer‐


    ing to full fine-tuning, and how to run training jobs on Kubernetes.


    Most organizations lack the resources to train foundation models from scratch.


    Model customization starts with aligned foundation models that already understand


    tasks and safety boundaries, then specializes them through post-training techniques.


    The choice of prompt engineering, PEFT, or full fine-tuning depends on dataset
    size,


    computational budget, and required model behavior changes.


    Full fine-tuning modifies all model parameters and produces a distinct model


    requiring dedicated GPU resources for both training and inference. This approach


    demands hundreds of thousands of labeled examples, takes days to weeks on multiple


    GPUs, and risks catastrophic forgetting where the model loses previously learned


    knowledge. From an operational perspective, each fine-tuned model becomes a sepa‐


    rate deployment artifact with its own serving infrastructure.


    PEFT techniques like LoRA modify less than 1% of model parameters, creating


    adapter layers that compose with the base model at inference time. Training requires


    only 100–1,000 labeled examples and completes in hours rather than days. Multiple


    LoRA adapters can share a single base model deployment, reducing memory foot‐


    print and enabling dynamic adapter selection based on request routing.


    **Lessons Learned **



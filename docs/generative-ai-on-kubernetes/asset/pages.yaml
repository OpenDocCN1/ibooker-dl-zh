  md: '**Metrics**


    Kubernetes core doesn’t include built-in support for metrics, but it is a very
    common


    scenario with well-defined practices and technologies. Most Kubernetes distributions


    (like Red Hat OpenShift) include a monitoring solution out of the box; there are


    differences but the de facto standard is Prometheus with the OpenMetrics exposition


    format. OpenMetrics is a CNCF incubating project that standardized and extended


    the original Prometheus text format while maintaining backward compatibility.
    Con‐


    tainers expose metrics via an endpoint, usually `/metrics`, using this format.


    This endpoint is pulled periodically by the collector component in charge of scraping


    them. See Example 5-2.



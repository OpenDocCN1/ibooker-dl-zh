    example, an InfiniBand network using the IPoIB CNI plug-in. When training pods


    request secondary network attachments through the `k8s.v1.cni.cncf.io/networks`


    annotation, Multus creates and configures the additional network interfaces inside


    the pod namespace according to the corresponding NAD specifications.


    In the case of RDMA, it requires a network interface that supports it, and the
    config‐


    uration is more complex because the training frameworks must access RDMA devi‐


    ces (typically exposed as `/dev/infiniband/` device files) that provide kernel-bypass


    communication. A specialized RDMA CNI plug-in works together with Multus to


    configure RDMA device permissions and ensure that pods can access the appropri‐


    ate RDMA devices corresponding to their attached network interfaces. Finally,
    the


    RDMA device plug-in makes the RDMA interface visible as a resource to the Kuber‐


    netes scheduler, making it possible to explicitly request it in the `resources`
    part of


    the deployment spec, for example, using `rdma/hca: 1` to request one RDMA host


    channel adapter.


    Even if the Kubernetes cluster configuration is properly done, it is still necessary
    to


    ensure that training framework communication libraries (primarily NCCL, used by


    NVIDIA for PyTorch workloads) discover and utilize the high-performance network


    interfaces rather than default to the primary Kubernetes network.


    NCCL automatically detects network interfaces and selects those with RDMA


    capabilities when available, but it is also possible to explicitly configure it


    through environment variables, like `NCCL\_IB\_HCA`, `NCCL\_SOCKET\_IFNAME`, and


    `NCCL\_NET\_GDR\_LEVEL`, to provide a deterministic control over which network
    paths


    NCCL uses for collective operations (see Example 7-11).


    It is important that platform administrators coordinate network interface naming
    to



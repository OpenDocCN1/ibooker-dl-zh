    *Figure 1-1. Model server architecture*


    This concept is not new or specific to generative AI. Multiple existing model
    servers


    use common frameworks to serve any type of traditional machine learning model
    for


    tasks like classification and regression, collectively known as predictive AI.
    Some


    of them are also evolving to support generative AI. Even if the concept is the


    same, the exposed API is very different. In predictive AI, the endpoint is usually


    a generic `/predict` or `/infer` because the model acts as a black box function.
    In


    generative AI, it’s a more task-oriented API because similar models can perform
    dif‐


    ferent types of actions and work with different types of modalities (see “Multimodal


    Models” on page 8): text generation, summarization, classification, text to image,
    etc.


    Model servers expose the AI model via an API that clients have


    to use. This API can be specific for a particular model server imple‐


    mentation, breaking the abstraction that the model server aims to


    provide because client applications should not be tied to a specific


    implementation.


    This problem is not new or specific to generative AI. For predictive


    AI, the KServe open-inference-protocol (OIP) defines a specifica‐


    tion to standardize “infer” endpoints. Most model servers have


    adopted it and it’s now expanding to include generative AI.


    The API to invoke generative AI models is still experimental over‐


    all and very different based on the type of model and the task it


    performs. OpenAI with the Chat Completions API for chat com‐


    pletion is a de facto standard for text generation models.


    **Model Server **



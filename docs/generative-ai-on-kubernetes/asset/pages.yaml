    In your Kubernetes job manifest, you’d configure the pod with `restartPolicy:`


    `OnFailure` and mount a PersistentVolumeClaim to `/data`. When the pod starts,
    it


    calls `load\_latest\_checkpoint()` to determine where to resume. After each signifi‐


    cant step—perhaps after processing a batch of documents or completing a phase
    of


    analysis—it calls `save\_checkpoint()` to record progress. If the pod fails or
    is evicted,


    Kubernetes restarts it, and the agent picks up exactly where it left off.


    The checkpoint directory becomes a valuable debugging tool as well. You can inspect


    the intermediate states to understand what the agent was thinking at each step.
    If the


    final output is unexpected, you can trace back through the checkpoints to identify


    where the reasoning went astray. This visibility is crucial for complex agents
    where


    the decision chain might involve dozens of steps.


    With MCP for tool integration, A2A for agent coordination, and state management


    patterns for persistence, you have the foundational components for deploying agentic


    applications on Kubernetes. These building blocks address the core operational
    chal‐


    lenges: secure communication between agents and tools, standardized inter-agent


    protocols, and stateful conversation management across distributed pods.


    **Lessons Learned**


    Running agentic applications in production requires treating them as autonomous


    systems that reason, iterate, and make decisions based on natural language input.


    Unlike deterministic microservices with predictable failure modes, agents exhibit


    unique characteristics: nondeterminism, multihop reasoning flows, and emergent


    behaviors that demand different operational approaches.


    Understanding MCP and A2A at the wire level—not just as framework abstrac‐


    tions—gives you the power to debug production issues, implement custom security


    policies, and build platform services that enforce organization-wide controls.


    Several operational principles will save you pain in production:


    *Choose security patterns based on compliance requirements, not convenience*


    If you need user-level attribution, use agent impersonation or token exchange


    regardless of complexity. For zero-trust environments, invest in SPIFFE/SPIRE


    even though the learning curve is steep. Use service account delegation only


    when you control both the agent and API, and your compliance posture allows it.



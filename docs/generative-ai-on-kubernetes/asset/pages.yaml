  img_proc: true
- pgno: 32
  md: '(CPU or GPU in this case). It is memory-bound when the amount of free memory


    and the speed to access (aka bandwidth) memory are the primary factors that drive


    the completion time. This implies that you need a faster processing unit to speed


    up a compute-bound problem, while you need more or faster memory in the case


    of a memory-bound scenario. Figure I-4 represents resource utilization in the
    two


    different cases.


    ![](img/3a93443ca88ca3c8ef163f48ebd612bc_32_0.png)


    *Figure I-4. Compute-bound and memory-bound resource utilization*


    As shown in Figure I-4, compute-bound workloads max out processing capacity,


    while memory-bound workloads are limited by memory bandwidth.


    Now let’s dive into the prefill and decode phases in more detail.


    **Prefill**


    The prefill phase works as an initialization phase where the input prompt is processed


    and the first token is produced. The first step to load the prompt is to convert
    the text


    to numbers using *tokenizer* and *embedding*.


    The last step of the prefill is the execution of the model (aka forward pass)
    to generate


    the first token.


    The prefill phase has two operational characteristics worth noting: it is compute-bound


    and the tokenizer runs entirely on CPU. Modern CPUs and GPUs are very fast, and


    tokenizer implementation is highly optimized, so the prefill is rarely a throughput


    bottleneck—but it does directly affect time to first token. Some models are now
    able


    to handle inputs of about one million tokens. For reference, the complete *Lord
    of the*


    *Rings* trilogy contains about half a million words (approximately 600,000 tokens).


    **Introduction **


    **| **


    **xxxi**'

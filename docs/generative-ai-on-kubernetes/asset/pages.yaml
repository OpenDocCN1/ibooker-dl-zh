  md: '*Self-contained formats*


    Self-contained formats store both the weights and the model architecture, along


    with hyperparameters and other metadata. They allow the model to be loaded


    and run without requiring prior knowledge of the network structure, making


    them easier to deploy as standalone artifacts.


    The boundary between both categories is gradual. Some formats that seem self-


    contained may still require external components, such as tokenizer files for language


    models.


    For LLMs, the trend is moving toward *mostly self-contained* formats like GGUF


    and Safetensors. These formats simplify distribution but remain tightly coupled
    to


    specialized runtimes. True runtime independence where a model could be loaded
    and


    run in any compatible environment, regardless of the model’s training framework,


    remains a work in progress. The CNCF ModelPack specification described in “CNCF


    ModelPack Specification” on page 67 is a standardization attempt in this direction.


    In this approach, model data is packed in Open Container Initiative (OCI) container


    images (see “What Is OCI?” on page 57).


    In an ideal world, much like OCI container images abstract application internals,


    model storage formats would draw a clear boundary between model data (produced


    by data scientists) and model execution (managed by MLOps/DevOps engineers


    in production). However, today’s landscape prioritizes getting models operational


    quickly rather than standardizing runtime compatibility. As the field matures,
    expect


    stronger separation between model creation and deployment concerns.


    **Weight-Only Formats**


    *Weight-only* model formats store the numerical parameters (weights and biases)
    of a


    trained neural network without including the model’s architecture or preprocessing


    components. These formats are commonly used during the development and experi‐


    mentation phases, where flexibility and minimal overhead are more important.


    Since weight-only formats lack architectural details, the runtime must already
    know


    the network structure. This knowledge allows the runtime to correctly reconstruct


    the model and apply the stored weights. Weight-only formats are tightly coupled

  md: 'Kubeflow Trainer provides Kubernetes-native APIs for managing fine-tuning jobs.


    The TrainJob custom resource handles distributed training coordination, while
    inte‐


    gration with TRL’s SFTTrainer and the Hugging Face PEFT library enables declarative


    configuration of training parameters. This separation allows platform teams to
    man‐


    age job scheduling and resource allocation while data scientists focus on dataset


    preparation and hyperparameter tuning.


    The handover workflow is straightforward: platform engineers pre-configure Train‐


    ingRuntimes (container images, cluster policies, available resources) as cluster-wide


    templates, while data scientists use the Kubeflow Python SDK to submit jobs by


    providing their training function, dataset references, hyperparameters, and resource


    requests. The SDK translates these Python API calls into TrainJob custom resources


    without requiring data scientists to write YAML manifests or understand Kubernetes


    primitives directly. Platform teams monitor job execution, manage cluster capacity,


    and handle infrastructure concerns like storage provisioning and network optimi‐


    zation, while the SDK-based workflow abstracts these complexities from the data


    science workflow.


    Training job management requires different operational patterns than inference
    serv‐


    ing. Jobs are batch workloads with defined completion criteria, not long-running


    services. Resource allocation favors throughput over latency, checkpoint management


    enables recovery from preemption, and gang scheduling prevents partial resource


    allocation from blocking expensive GPU nodes.


    The next chapter explores how to address these operational patterns at production


    scale, from gang scheduling and topology-aware placement to quota management


    and network optimization.



- pgno: 133
  md: '*Kubernetes device plug-in for GPUs*


    The operator deploys the NVIDIA device plug-in as a DaemonSet on GPU


    nodes. We already covered the Kubernetes device plug-in architecture in “Kuber‐


    netes GPU Device Plug-Ins” on page 86 and how it introduces a new exten‐


    ded resource `nvidia.com/gpu` that can be used for resource-level scheduling,


    described in “Resource-Based Scheduling” on page 91. The NVIDIA Kubernetes


    device plug-ins also allow for sub-GPU allocation, as we will see later in “Sub-


    GPU Allocation” on page 98. The NVIDIA device plug-in is a critical component;


    if it’s not running or not working, your pods will be stuck pending because


    Kubernetes thinks no resources are available.


    *NVIDIA Container Toolkit (runtime)*


    For containers to actually use the GPU, they need the NVIDIA container runtime


    (which is part of the NVIDIA Container Toolkit). The GPU Operator deploys


    this toolkit on the nodes. The container runtime is essentially an extension to


    CRI-O and containerd that knows how to inject GPU drivers and device files into


    containers when a GPU is requested. The operator manages the container run‐


    time automatically, eliminating the need to manually configure NVIDIA support.


    The result is that any container that requests a GPU will have the necessary `/dev/`


    `nvidia0` device and GPU drivers available. However, the container image must


    still include the CUDA libraries that the application requires.


    *Multi-Instance GPU (MIG) Manager*


    On systems with MIG-capable GPUs (e.g., NVIDIA A100 or H100 cards), the


    operator includes a MIG Manager component. This service monitors the node’s


    MIG configuration and can reconfigure the GPU’s MIG partitions according


    to a desired state. By default it runs on MIG-capable nodes and will apply the


    MIG strategy you configure in the ClusterPolicy, as we explore in “Sub-GPU


    Allocation” on page 98 when we describe GPU sharing options. The MIG Man‐


    ager ensures that if a node should be in MIG mode with certain profiles carved


    out, it does so automatically on boot or when changes occur. Without it, an


    administrator would have to log in remotely to the node and use `nvidia-smi` to


    set up MIG partitions manually. The GPU Operator takes care of this, keeping


    MIG setups declarative.


    *GPU monitoring with DCGM Exporter*


    For completeness, the GPU Operator also typically deploys the Data Center


    GPU Manager (DCGM) Exporter as a DaemonSet. DCGM polls every GPU


    for utilization, memory pressure, ECC errors, temperature, power draw, and a


    wealth of other counters, translating them into Prometheus metrics. Most users


    scrape the Exporter with the cluster’s Prometheus stack and surface graphs in


    Grafana. If you follow the observability guidance in Chapter 5, you already have


    everything in place; the operator merely wires the GPU side.


    **96 **



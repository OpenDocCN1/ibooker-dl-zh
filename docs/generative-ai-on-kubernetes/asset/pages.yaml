  md: '*GPU sharing and consolidation*


    Aim to keep GPUs busy—an idle GPU is wasted money. If your LLM uses


    only 30% of a GPU’s compute and memory, consider running multiple model


    instances or other workloads on the same GPU. This can be done with MIG on


    supported hardware for clear separation (for example, two 6B-parameter models


    on one 80-GB A100, each in a 40-GB MIG slice) or time slicing. For more


    details, see “Sub-GPU Allocation” on page 98. Another approach is to run a


    multimodel server that loads several models onto one GPU and routes requests


    (if they all fit in memory). Some serving frameworks like NVIDIA Triton or AWS


    Multi-Model Server support multiple models per GPU, dynamically unloading


    less-used models if needed. The best practice is to profile your usage: if a model


    only uses, say, 50% of GPU memory, that remaining 50% could host another


    smaller model or a second copy to double throughput. Just be cautious to not


    overload memory—leave some margin since driver overhead and fragmentation


    can eat a few percent. Kubernetes doesn’t natively know if a GPU is “only half


    used”—it’s up to you to bin-pack wisely using MIG or by deploying multiple


    pods to the same node.


    *Quantization and compilation*


    Optimizing the model itself can reduce GPU needs. Techniques like 4-bit or


    8-bit quantization of weights dramatically cut memory per model copy (at some


    accuracy cost). If an LLM can be quantized from 16-bit to 8-bit with negligible


    quality loss, you potentially halve the number of GPUs needed. Many open


    models have 8-bit or 4-bit quantized versions available. These allow, for instance,


    a 70B model to fit on a single 48-GB GPU in 4-bit mode. In full precision,


    this would require 280 GB (70B × 4 bytes/param), but in 4-bit mode only ~35


    GB (70B × 0.5 byte/param). The vLLM and TGI servers support loading such


    quantized models. Additionally, consider using optimized runtimes to improve


    inference speed per GPU. Faster models mean you can handle more load with the


    same hardware, improving utilization.


    *Autoscale*


    Autoscaling multi-GPU deployments can be tricky if they are model-parallel.


    When a model is split across four GPUs, you cannot scale down to two GPUs


    or scale up to six GPUs. You must scale in whole replica units: either remove


    all four GPUs or add another complete four GPU group. But for throughput


    scaling, Kubernetes-based autoscaling (like with KEDA, the Horizontal Pod


    Autoscaled \[HPA\] or Knative) on RPS, concurrency or latency is effective. For


    comprehensive coverage of Kubernetes autoscaling patterns and best practices,


    see the *Elastic Scale* pattern in *Kubernetes Patterns*.



- pgno: 180
  md: 'Extension (GIE) project designed to optimize the routing and efficiency of
    LLM


    serving.


    The project is also sometimes referred to as the Inference Gateway. It extends


    the Kubernetes Gateway API to bring awareness of the inference workload (for


    background on the Gateway API, see the following sidebar). Before exploring the


    technical details of GIE, it’s important to first understand what distinguishes
    AI


    gateways from traditional API gateways and the unique capabilities they provide
    for


    LLM workloads.


    **Gateway API**


    The Gateway API project is a very large, complex project focused on L4 and L7


    routing in Kubernetes. The final goal of this official Kubernetes project is defining


    the next-generation API and implementing Kubernetes ingress, load balancing, and


    service mesh.


    It is role oriented and defines a different set of APIs to represent all the aspects
    of net‐


    work configuration, from the infrastructure provider, to expose a single application.


    The Gateway API describes how traffic can be translated to services within the
    cluster,


    but it is just the *intent*, not the actual endpoint or full specification. The
    creation of a


    route is protocol-specific like HTTPRoute, attached to a gateway, and defines
    the rule


    to forward a request to a service.


    Many other objects and concepts are part of the full specification but are not
    critical


    to explain the Inference Extension and thus are not covered here. For more detailed


    information, see the API Overview page of the Gateway API website.


    **From API Gateway to AI Gateway**


    Traditional API gateways were designed for stateless microservices where requests


    are independent and resource consumption is roughly uniform across endpoints.


    AI gateway architectures extend this foundation with capabilities specific to
    LLM


    workloads, addressing fundamentally different operational challenges.


    AI gateways enable *Model as a Service* (MaaS) architectures, where LLM inference


    capabilities are exposed as managed APIs to multiple users or teams. Similar to
    how


    software as a service (SaaS) provides software capabilities over the internet,
    MaaS


    delivers model inference as a service by configuring resource quotas, access controls,


    and usage tracking to ensure fair resource allocation across tenants.


    **LLM-Aware Routing **


    **| **


    **143**'

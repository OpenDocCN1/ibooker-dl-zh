    **Ray**


    While Kubeflow Trainer’s flexibility is sufficient for most model customization
    tech‐


    niques, it is not the only framework for distributed computation on Kubernetes;
    the


    Ray project is a valid alternative. Ray provides an entire ecosystem of components


    for AI platforms and was previously introduced in “Ray Serve and KubeRay” on


    page 27. Its core concepts, like the RayCluster (Figure 1-5), are generic and
    apply



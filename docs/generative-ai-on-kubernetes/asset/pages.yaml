- pgno: 160
  md: 'Model selection happens early in the project lifecycle, but evaluation doesn’t
    stop


    there. The same evaluation techniques become critical when optimizing the model


    for production. Data scientists and AI engineers initially select the model, but
    before


    running it at scale, you need to optimize it. A model can be compressed using


    quantization techniques, or you can collect production data and use it to distill
    the


    model into a smaller one.


    Both compression techniques modify the model weights, which impacts overall


    accuracy. This requires performing the evaluation again to measure the impact.


    The application of similar techniques can produce a model that is less than half
    of


    the original size, doubling or tripling the throughput of the runtime on the same


    hardware with essentially the same accuracy of the original model. When properly


    applied, the compressed model can recover more than 99% of the original accuracy.


    **Language Model Compression**


    An LLM like Meta-Llama-3.1-8B-Instruct has eight billion parameters. This means


    that there are eight billion floating point values and each of them is used as
    weight


    (multiplier) for the corresponding input of the neural network.


    Each floating point value is represented with 16 bits, so the minimal memory require‐


    ment to load the model is 16 GB (16 bits x 8 billion). Such neural networks might


    have numerous layers (say, 32), with each neuron’s output feeding into the subsequent


    layer, increasing the overall memory footprint of the model. This is called activation,


    and it is another 16-bit floating point value.


    Finally, both the KV cache values and the intermediate output results are represented


    using 16-bit precision. For more details on this topic, see “Understanding LLM


    Fundamentals” on page xxv.


    All of these floating point numbers add up to the total memory footprint of an
    LLM


    for the GPU memory. The technique to compress the model is called quantization


    (see the following sidebar).


    **Quantization**


    Quantization is the name of a set of techniques that aims to reduce the total
    memory


    footprint using a less precise representation, like an 8-bit floating point (FP8)
    or an


    integer representation (INT8). These techniques go beyond simply rounding floating


    points or reducing decimals. Instead, they involve mechanisms specifically designed


    to compensate for errors during execution.


    **Model and Runtime Tuning **


    **| **


    **123**'

  md: '**Multi-GPU Inference**


    In the previous section we learned how to divide a single physical GPU among many


    workloads. For LLMs, serving the inverse situation is far more common. Running


    inference for LLMs often demands more GPU memory and compute than a single


    GPU can provide.


    When using multiple GPUs for LLM inference, there are two fundamental


    approaches, each serving different needs. Figure 3-1 shows the taxonomy of multi-


    GPU parallelism strategies.


    ![](img/3a93443ca88ca3c8ef163f48ebd612bc_141_0.png)


    *Figure 3-1. Multi-GPU parallelism taxonomy*


    *Data parallelism* uses multiple GPUs to host replicas of the same model, serving


    different requests in parallel to increase overall queries per second (QPS). In
    contrast,


    *model parallelism* is required when a single model is too large to fit into one
    GPU’s


    memory—the model is split across GPUs so that each GPU holds part of the model


    and collectively they handle one inference request. Model parallelism can be further


    divided into *tensor parallelism*, which splits individual model layers across
    GPUs on


    a single node, and *pipeline parallelism*, which distributes entire model layers
    across


    multiple nodes.


    Let’s examine each approach in detail, starting with data parallelism.


    **Data Parallelism**


    Data parallelism increases overall throughput by running multiple complete copies


    of the model. In this scenario, each GPU holds the full model and serves different


    requests concurrently. When a model is too large for one GPU, each group of GPUs


    working together via model parallelism can also run an independent replica. This


    approach does not accelerate any single query’s latency, but it allows more queries
    to


    be processed in parallel, thereby boosting QPS. For example, if you have four
    GPUs


    and a moderate-sized LLM that fits in one GPU, you can deploy four separate model


    instances with each GPU running one instance to handle four times the traffic.
    The


    Kubernetes-native approach is to run multiple replica pods, each requesting one
    GPU



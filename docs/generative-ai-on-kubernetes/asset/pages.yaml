- pgno: 404
  md: '**About the Authors**


    **Dr. Roland Huß** is a Distinguished Engineer at Red Hat with over 25 years of


    programming experience. Currently architecting platforms that enable developers


    to integrate AI services on Kubernetes, he previously led OpenShift Serverless
    and


    served on the Knative Technical Oversight Committee. Roland is the creator of


    Jolokia and popular developer tools for Kubernetes. He is the coauthor of *Kubernetes*


    *Patterns*. An advocate of open source, Roland is a frequent speaker at tech conferen‐


    ces and enjoys growing chili peppers in his free time.


    **Daniele Zonca** is a Chief Architect at Red Hat AI Engineering, responsible
    for the


    technical vision and strategy of Red Hat AI offerings on Kubernetes environments.


    He is a founder of the TrustyAI project, which provides AI safety and trustworthiness


    capabilities for predictive and generative AI deployments. Daniele actively contrib‐


    utes to open source projects, including KServe, vLLM, llm-d, and Kubeflow. Before


    joining Red Hat, he led the Big Data development team at UniCredit, where he


    designed and implemented large-scale analytical engines. He is passionate about


    making AI accessible, safe, and reliable for enterprise deployments, and is a
    frequent


    speaker at tech conferences.


    **Colophon**


    The animal on the cover of *Generative AI on Kubernetes* is the yellow-billed
    hornbill.


    Yellow-billed hornbills are divided into two primary species: the Eastern yellow-billed


    hornbill (*Tockus **flavirostris*) and the Southern yellow-billed hornbill (*Tockus
    leucome‐*


    *las*). The main difference between the two (besides their native habitats in
    Eastern


    versus Southern Africa) is the coloration around their eyes: the Eastern has black


    around the eyes while the Southern has pinkish-red.


    As their name suggests, their most prominent feature is their beak, which can
    be


    as much as one sixth of their body length and requires a strong neck to support.


    The beak is also topped with a casque, a helmet-like structure present in some
    birds


    and reptiles. In the case of the yellow-billed hornbill, the casque is modest
    in size


    compared to that of other hornbills or birds. Their beak helps them consume a
    diet


    consisting of insects, fruits, seeds, and small rodents.


    Within a mating season, yellow-billed hornbills are monogamous, remaining with


    their mate until the chicks are grown. The female stays with the eggs (two to
    six in


    a clutch) in a tree-hollow nest. She seals the nest off with mud and droppings
    (with


    the help of her mate) so that only a small vertical slit is open to the outside
    world.


    While the eggs incubate (about 24 days) and after the chicks hatch, the male feeds


    the female (and chicks) through the slit, and droppings of both chicks and female
    are


    expelled. During this time, the female also takes the opportunity to furnish herself'
  merge: -1
  img_proc: true
- pgno: 405
  md: 'with a new coat, shedding and regrowing her feathers. When the chicks are half


    grown, the female joins the male in the outside world and the chicks rebuild the
    nest.


    The parents continue to feed their young until the chicks are fully grown and
    break


    out into the world for the first time.


    Both species are considered of Least Concern according to their IUCN conservation


    status. Many of the animals on O’Reilly covers are endangered; all of them are


    important to the world.


    The cover illustration is by Monica Kamsvaag, based on an antique line engraving


    from Lydekker’s *Royal Natural History*. The series design is by Edie Freedman,
    Ellie


    Volckhausen, and Karen Montgomery. The cover fonts are Gilroy Semibold and


    Guardian Sans. The text font is Adobe Minion Pro; the heading font is Adobe Myriad


    Condensed; and the code font is Dalton Maag’s Ubuntu Mono.'

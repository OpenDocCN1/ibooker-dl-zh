    The InferencePool resource uses the stable v1 API with the `inference.network`


    `ing.k8s.io` group.


    The `targetPorts` field is an array that defines the ports exposed by the model


    server pods, supporting up to eight ports.


    The `selector` field specifies which pods belong to this pool using label matching.


    The pods running vLLM are configured to serve both base and LoRA models


    using the `\--enable-lora` flag (see Example 4-6).


    The `endpointPickerRef` references the Endpoint Picker service that implements


    intelligent routing logic using custom algorithms to select the best pod for each


    request.


    InferenceObjective defines serving objectives and priorities for routing decisions.


    This resource is currently in alpha (v1alpha2).


    The `priority` field specifies the serving priority, where higher values indicate


    more critical requests that should be handled preferentially.


    The Endpoint Picker service that implements the routing logic using the Envoy


    External Processing protocol.


    The concept of an InferencePool is flexible and represents a set of inference-focused


    pods. The routing logic can use information from different sources (like vLLM
    met‐


    rics) to decide which pod should process the request or even refuse requests based



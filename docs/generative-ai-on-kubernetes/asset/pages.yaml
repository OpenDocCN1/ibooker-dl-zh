  md: 'The format’s structure and focus on secure serialization have made it increasingly


    popular, especially for LLM storage and sharing. Safetensors is now the default
    weight


    format for many large-scale models distributed on Hugging Face.


    Next, we will explore GGUF, a more specialized format for LLMs that is optimized
    for


    CPU-based inference and designed for efficient deployment of LLMs.


    **GGUF and GGML**


    The GPT-Generated Unified Format (GGUF) and its predecessor GPT-Generated


    Model Language (GGML) are specialized formats developed for optimizing the stor‐


    age and execution of LLMs on resource-constrained hardware such as CPUs and edge


    devices. Originating from the llama.cpp project led by Georgi Gerganov, both formats


    focus on efficient inference with minimal hardware requirements. While GGML was


    an important first step, GGUF represents a significant refinement, addressing
    many


    of its predecessor’s limitations.


    A defining feature of GGUF and GGML is their focus on quantization, a technique


    that reduces the precision of model weights from floating-point values to lower-bit


    representations such as 8-bit, 4-bit, or even 2-bit integers. By lowering precision,


    both the memory footprint and computational overhead are significantly reduced.


    This allows models to run effectively without dedicated GPUs while maintaining


    acceptable inference accuracy.


    A key improvement in GGUF is its focus on backward compatibility. As LLMs evolve


    and their architectures become more complex, maintaining compatibility with exist‐


    ing tools can be challenging. GGUF’s modular design allows newer models to retain


    compatibility with older runtime versions, provided the core components remain


    unchanged. This helps prevent the need for frequent format conversions when


    updating models. The backward compatibility design also minimizes the impact


    of transitions between versions. When GGUF is updated to support new features,


    existing models remain functional without requiring conversion.


    Unlike ONNX, which was designed as a general-purpose format for a wide range


    of machine learning tasks, GGUF is specialized for LLM inference. While originally


    designed for CPU-based inference, GGUF is now widely supported across both CPU


    and GPU execution by runtimes like llama.cpp and vLLM.


    When compared to Safetensors, GGUF attempts to bundle more metadata directly


    within the model file itself, including basic tokenizer information and runtime
    meta‐


    data. While Safetensors focuses primarily on weight storage with minimal metadata


    and relies on external files for tokenizer definitions and model configurations,
    GGUF


    stores token mappings and model parameters in a single file. GGUF still depends
    on


    specific external runtimes for complete inference, keeping it in the category
    of mostly


    self-contained formats.



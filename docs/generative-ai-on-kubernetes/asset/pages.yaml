  md: '**Making the right choice**


    Figure 7-4 illustrates the complete network stack showing how GPUs connect via


    NVLink/NVSwitch within nodes and how nodes communicate via InfiniBand, RoCE,


    or standard Ethernet for multinode training.


    ![](img/3a93443ca88ca3c8ef163f48ebd612bc_279_0.png)


    *Figure 7-4. GPU network stack: intra-node NVLink/NVSwitch and inter-node*


    *InfiniBand/RoCE/Ethernet** options*


    Platform administrators must balance performance requirements against infrastruc‐


    ture costs and operational complexity when selecting network technologies, with


    parallelism strategy (see “Model Parallelism” on page 106) being a key consideration


    in the decision-making process:


    *For data parallelism workloads*


    This is the most common strategy for distributed training. Organizations train‐


    ing large models across dozens of nodes should seriously consider InfiniBand


    with GPUDirect RDMA for its superior bandwidth characteristics that acceler‐


    ate gradient all-reduce operations, while those with existing high-performance


    Ethernet infrastructure can leverage RoCE with GPUDirect RDMA to approach


    InfiniBand performance without wholesale network replacement. For smaller


    data-parallel training jobs (2–8 nodes), optimizing standard Ethernet configu‐


    rations with 100 GBps adapters and proper Kubernetes networking provides


    meaningful improvements without requiring specialized networking expertise.



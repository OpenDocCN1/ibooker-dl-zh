  md: 'Discovery (GFD) enable automatic detection and labeling of GPU capabilities,
    allow‐


    ing workload-specific scheduling based on GPU model, driver version, and hardware


    features. This discovery layer provides the foundation for both simple resource-based


    scheduling and sophisticated topology-aware placement.


    GPU scheduling requires different strategies than traditional workloads. Resource-


    based scheduling allocates GPUs as countable units, while label-based scheduling


    with node selectors, affinity rules, and taints enables precise placement based
    on GPU


    characteristics. The emerging Dynamic Resource Allocation (DRA) API promises


    more flexible resource handling, although device plug-ins remain the production-


    ready standard for most deployments.


    Sub-GPU allocation techniques maximize hardware utilization when full GPU alloca‐


    tion exceeds workload requirements. Time slicing enables temporal sharing where


    multiple workloads alternate GPU access, suitable for inference workloads with
    inter‐


    mittent GPU usage. Multi-Instance GPU (MIG) provides hardware-level partitioning


    with memory isolation, creating dedicated GPU slices with guaranteed resources
    and


    performance isolation. Each approach involves trade-offs among isolation, overhead,


    and scheduling complexity.


    Multi-GPU inference becomes necessary when models exceed single-GPU memory


    capacity. Tensor parallelism distributes individual operations across GPUs, requiring


    high-bandwidth interconnects and tight synchronization. Pipeline parallelism splits


    model layers across GPUs, balancing computation distribution with bubble overhead


    from sequential dependencies. Data parallelism replicates the entire model across


    GPUs, processing different batches simultaneously. These strategies demand careful


    orchestration across pods and nodes, with Kubernetes providing scheduling primi‐


    tives, while runtime frameworks handle the coordination logic.


    The NVIDIA GPU Operator consolidates GPU management through a single opera‐


    tor that deploys device plug-ins, feature discovery, monitoring (DCGM), and runtime


    components. This declarative approach via ClusterPolicy resources simplifies GPU


    cluster configuration and ensures consistent GPU stack deployment across nodes,


    reducing operational complexity compared to manual component installation.


    In the next chapter, we’ll build on these GPU and infrastructure foundations to


    explore production readiness—covering deployment strategies, scaling patterns,
    per‐


    formance optimization, and operational best practices for running LLM workloads


    reliably at scale.



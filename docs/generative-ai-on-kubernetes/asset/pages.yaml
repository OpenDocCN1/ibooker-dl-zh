  md: '(global explanation) or a single prediction (local explanation). Sometimes
    it is called


    *interpretability* because some models can be directly interpreted.


    From a Kubernetes perspective, KServe supports the ability to attach an explainer
    to


    an InferenceService to perform local explanations, but this is usually not suggested
    in


    a production environment because it is expensive to compute the explanation at

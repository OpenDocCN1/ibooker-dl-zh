    Beyond choosing the right parallelism strategy and deployment architecture, max‐


    imizing the efficiency of your GPU infrastructure requires careful attention to


    resource management and optimization.


    **GPU Resource Optimizations**


    This section consolidates key GPU optimization strategies for production deploy‐


    ments, including techniques like MIG and time slicing discussed earlier in this


    chapter, along with additional best practices.


    Maximizing GPU utilization and avoiding unused memory is key in production LLM


    inference, since GPUs are expensive resources. Here are some best practices and


    considerations for optimizing GPU usage in a Kubernetes environment:


    *GPU memory defragmentation*


    As models load and unload, or as dynamic inference workloads allocate mem‐


    ory (for example, varying sequence lengths), the GPU’s memory allocator can


    become fragmented. This means that free memory exists in many small chunks


    rather than one contiguous block. This can prevent large models from being


    loaded, or lead to out-of-memory errors even when enough total memory is free,


    just not in a contiguous block. It’s often best to pre-allocate large blocks (e.g.,


    load all model weights on startup, and use memory pools for scratch space) to


    avoid heap fragmentation. Frameworks like PyTorch have a caching allocator


    that helps, but long-running pods might still suffer fragmentation over time.
    If


    you notice GPU memory increasing or OOMs after many requests, a strategy


    is to periodically restart the pod to clear fragmentation. PyTorch provides an


    “expandable segments” feature that reduces fragmentation by allowing the alloca‐


    tor to expand existing memory segments rather than create new ones.³ On the


    inference side, vLLM’s PagedAttention is essentially a defragmentation technique


    for the KV cache. In order to detect memory fragmentation, a proper monitoring


    setup is essential. If you see that after serving many requests the available
    mem‐


    ory decreases, it’s probably because of memory defragmentation.



    **SGLang**


    SGLang is an open source high-performance serving framework for large lan‐


    guage models and vision-language models, designed to deliver low-latency, high-


    throughput inference. The project has gained significant industry adoption and
    is


    notable for its advanced optimization techniques.


    Many performance improvements have been driven by the SGLang project, for


    example, RadixAttention, a sophisticated caching mechanism that stores key-value


    (KV) caches in a radix tree structure. This enables efficient prefix search and
    cache


    reuse across requests, which is particularly beneficial for workloads with common


    prompt prefixes or multiturn conversations where previous context can be reused.


    SGLang supports continuous batching, speculative decoding, and various quantiza‐


    tion techniques.


    Like vLLM and TGI, SGLang exposes an OpenAI-compatible API and supports most


    LLM model architectures.


    Starting an SGLang server follows a similar pattern to other model servers. See


    Example 1-7 for an example.



  md: 'Regardless of the mitigation action that will apply to the system, the prerequisite
    is


    to measure the overall system behavior under different conditions and with different


    workloads.


    To measure system behavior effectively, you need specialized tools. The LLM commu‐


    nity has developed several comprehensive benchmarking tools, which we’ll explore


    next.


    Performance and capacity testing isn’t new to software development. Every mature


    release pipeline should include it, and a served model from an end-to-end perspective


    is very similar: it’s an endpoint that accepts requests and generates responses.


    Various tools are available for performance testings, allowing you to invoke an
    end‐


    point. A runtime can be tested with traditional load generators. This is how LLM


    performance testing has been done, and it is still sometimes used. Over time,
    more


    specialized tools have been developed that can compute more specialized metrics
    and


    mix performance testing and model evaluation, combining different scenarios and


    datasets.


    The LLM community is very active and many different tools are available. Some
    of


    the most comprehensive are:


    *GuideLLM*


    The GuideLLM project was created specifically as a tool to evaluate a model and


    optimize the deployment of LLMs. It simulates different types of workloads to


    be equivalent to a real-world scenario. GuideLLM can be used as an interactive


    tool to gauge performance and use of resources with a specific hardware configu‐


    ration. The tool covers a large set of rate scenarios that can be configured,
    from


    a synchronous scenario, where every request is chained one after the other, to


    more advanced scenarios with fixed concurrency or even Poisson distribution


    with the mean at a specified rate. After the benchmark, GuideLLM produces a


    report with the latency distribution and other useful information. Example 4-2


    shows how to call GuideLLM from the command line, resulting in an output


    shown in Figure 4-2.


    *Example 4-2. Run a benchmark with GuideLLM*


    `guidellm`` ``benchmark`` ``**\\**`


    ` ``\--target`` ``http://127.0.0.1:8000`` ``**\\ **`` `


    ` ``\--model`` ``mistralai/Mistral-7B-Instruct-v0.2`` ``**\\**`


    ` ``\--output-path`` ``output\_file.json`` ``**\\ **`` `


    ` ``\--rate-type`` ``sweep`` ``**\\ **`` `


    ` ``\--data`` ``''prompt\_tokens=256,output\_tokens=128''`` ``**\\ **`` `


    ` ``\--max-seconds`` ``400`


    ` ``\--warmup-percent`` ``0``.2`



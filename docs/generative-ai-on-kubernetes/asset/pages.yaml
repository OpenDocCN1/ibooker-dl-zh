    The rest of the memory is assigned to the KV cache.


    During model execution, this log is produced when the KV cache memory is not


    enough, so the vLLM has to swap some of the value outside the VRAM.


    The log explicitly reports the information when the size allocated to the KV cache


    is not big enough. A single entry of this log is probably not critical, but when


    this happens multiple times, it is probably better to consider applying some tuning.


    Fortunately, the log is very detailed, so the log message includes some suggestions
    to


    try to address the problem. The following parameters are important to consider:


    `gpu-memory-utilization`


    The parameter’s default value is `0.9`, indicating the percentage of available
    mem‐


    ory vLLM can use. This setting limits the vLLM memory consumption, prevent‐


    ing the Out-Of-Memory (OOM) errors that occurred in earlier versions when


    vLLM exceeded assigned GPU memory. While `0.9` serves as a safety threshold,


    the vLLM stability has improved. Consequently, it’s now often safe to increase


    this value closer to `1.0`, allowing access to that extra 10% of memory.


    `max-model-len`


    This parameter is crucial and must be configured based on the specific LLM use


    case or task. The KV cache size directly corresponds to the context size (input


    prompt plus generated text). While tuning this value directly impacts memory


    usage, an overly aggressive limit on context size could result in responses lacking


    enough tokens to address the use case. For instance, RAG patterns often require
    a


    substantial context.


    `max-num-seqs`* or *`max-num-batched-tokens`


    The vLLM engine batches the input to increase GPU usage and increase the


    throughput. This might have some latency implications, but in highly concurrent


    production scenarios, the impact is usually very limited. At the same time, the


    bigger the batch size, the larger the KV cache space, so it is possible to reduce
    this


    value to save some memory.


    `tensor-parallel-size`


    Unlike previous parameters, increasing tensor parallel size necessitates additional


    hardware. This process shards the model weights, providing more available



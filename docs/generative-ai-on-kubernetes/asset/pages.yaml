- pgno: 245
  md: '![](img/3a93443ca88ca3c8ef163f48ebd612bc_245_0.png)


    *Figure 7-1. Kubernetes scheduler*


    **Resource Bin Packing Strategy**


    While the default Kubernetes scheduler spreads pods across nodes to improve avail‐


    ability, GPU training platforms often benefit from the opposite approach: packing


    pods tightly onto fewer nodes to maximize utilization and enable cost-effective


    cluster autoscaling. This is particularly valuable for GPU clusters where nodes
    can


    cost $10–30 per hour, and consolidating workloads onto fully-utilized nodes creates


    “empty” nodes that autoscalers can safely drain and remove.


    The *resource bin packing* strategy implements tight pod consolidation through
    the


    scheduler’s NodeResourcesFit scoring plug-in. The MostAllocated strategy scores


    nodes higher when they already have greater resource allocation, favoring consolida‐


    tion over the default LeastAllocated spreading behavior (see Example 7-1).


    **208 **


    **| **



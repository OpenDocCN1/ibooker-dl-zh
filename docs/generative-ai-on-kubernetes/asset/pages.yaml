  md: '**Safetensors**


    Safetensors, developed by Hugging Face in 2021, is a modern model serialization


    format designed to securely store and share machine learning model weights while


    addressing security vulnerabilities and performance limitations of earlier formats
    like


    PyTorch’s `.pt` and `pickle`. The pickle format, often used in PyTorch, can execute


    arbitrary Python code when deserializing models, posing significant security risks


    when sharing models. In contrast, Safetensors prevents code execution vulnerabilities


    by focusing strictly on storing tensor data, making it a safer and more efficient
    choice


    for model serialization.


    Safetensors files follow a simple yet efficient structure, as shown in Figure
    2-3.


    ![](img/3a93443ca88ca3c8ef163f48ebd612bc_79_0.png)


    *Figure 2-3. Internal structure of a Safetensors model*


    Each *.safetensors* file begins with a header containing metadata, including a
    serialized


    JSON object describing each tensor stored in the file. The header includes details


    such as the tensor’s data type, shape, and the byte offsets where the tensor data


    resides within the file. This structure allows for zero-copy loading, where tensor
    data


    can be directly mapped to memory without unnecessary CPU overhead, improving


    inference speed, especially when working with LLMs.


    Safetensors supports sharding, which allows large models to be split across multiple


    smaller files. Each shard contains a portion of the model’s tensors and is accompanied


    by an index file (e.g., *model.safetensors.index.json*). The index file maps the
    names of


    tensors in the different layers to their respective shard files. For example,
    Llama 4.1



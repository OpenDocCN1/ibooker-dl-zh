    *long-term memory*


    **Choosing Between Key-Value Stores and Databases**


    Production systems often combine both KV stores and databases, mapping them


    to the two types of agent memory. KV stores handle short-term memory (active


    session state), while databases handle long-term memory (historical patterns and


    audit trails). Understanding when to use which storage layer prevents both over-


    engineering (adding a database when you do not need one) and under-engineering


    (hitting KV store limitations as requirements evolve).


    This part is already explained in very similar wording in the previous subsection.


    For pure conversational agents where each session is independent and you do not


    need to query across sessions, a KV store for short-term memory alone is sufficient.


    Databases become necessary when you need long-term memory capabilities beyond


    single-session retrieval. SQL databases let you write queries that span sessions:
    “Show


    me all conversations where users mentioned pricing concerns in the last week”


    or “What percentage of sessions escalated to human support?” This cross-session


    analysis is impossible with a KV store’s key-value model. Databases also provide
    the


    durability and immutability required for compliance and audit trails. When you
    need


    to prove what recommendations your agent made six months ago for regulatory


    purposes, that data must live in a backed-up database that can be queried and
    that has


    proper retention policies.


    The pattern that works in production combines both layers. Every request reads
    and


    writes short-term memory (session state) through your KV store. When you need


    to persist something to long-term memory—audit logs, user preferences, or insights


    for analytics—you write that to a database, typically asynchronously so it does
    not


    block the user response. When an agent needs context from past sessions stored
    in


    long-term memory—perhaps user preferences or historical patterns—you query the


    database during session initialization and cache the results in short-term memory.


    **334 **


    **| **



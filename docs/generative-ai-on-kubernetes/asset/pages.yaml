- pgno: 221
  md: 'The same principle applies to model size: a small, specialized model (potentially


    created through distillation from a larger model) can be as effective as or even


    more effective than a larger, untuned model. This is particularly relevant with
    Small


    Language Models (SLMs) that require fewer resources to be served. An SLM usually


    has between 8 and 16 billion parameters, making it a good candidate to be tuned
    with


    constrained time and resources.


    Model distillation is another approach, where a large teacher model is used to
    train


    a smaller, more efficient SLM that inherits the teacher’s knowledge while requiring


    fewer computational resources.


    Now that we understand when to use model customization, let’s look at the actual


    training techniques available.


    **Tuning a Model**


    The possibility to continually train a model, also known as *post-training*, is
    not new


    to machine learning. In traditional predictive AI, models are often fine-tuned
    in a


    second phase to update them with new data. In the context of generative AI, this


    activity is usually performed to specialize a model and improve the performance
    in


    a specific domain, as well as to reduce the overall cost of the solution by leveraging


    specialized smaller models instead of one of the bigger and more expensive alterna‐


    tives. Figure 6-3 shows the high-level process to fine-tune a model to embed new


    knowledge in the original model.


    ![](img/3a93443ca88ca3c8ef163f48ebd612bc_221_0.png)


    *Figure 6-3. Fine-tuning concept*


    While *fine-tuning* is less complex and costly than pre-training by an order of
    magni‐


    tude, it can still take many hours or even days to run. Sometimes, however, full


    fine-tuning is unnecessary; for example, the user might want to reduce the domain


    areas that the model should be able to answer, similar to the prompt engineering
    use


    case described before but as a built-in feature in the model and less affected
    by exter‐


    nal attacks. These simpler options fall under a category named *Parameter-Efficient*


    *Fine-Tuning (PEFT)*.


    **184 **


    **| **


    **Chapter 6: Model Customization**'

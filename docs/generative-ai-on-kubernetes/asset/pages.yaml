  img_proc: true
- pgno: 26
  md: '**Kubernetes for AI Workloads**


    Kubernetes is an open source container orchestration platform originally developed


    by Google, now part of the Cloud Native Computing Foundation (CNCF). It was


    designed to automate the deployment, scaling, and management of containerized


    applications, which are packaged as OCI-compliant container images. Kubernetes


    abstracts the underlying infrastructure, allowing developers and operators to
    focus on


    deploying and managing applications without worrying about the complexities of
    the


    underlying hardware.


    Initially, Kubernetes was optimized for distributed stateless workloads that can
    scale


    horizontally with ease. However, Kubernetes quickly learned how to support stateful


    workloads, like databases and messaging systems. This evolution made Kubernetes
    a


    good platform for running a full stack of applications, from simple web services
    to


    complex, state-dependent systems.


    In the context of AI, Kubernetes presents both opportunities and challenges. AI


    workloads have unique infrastructure requirements that differ significantly from


    typical business applications. This is especially true for workloads involving
    LLMs


    or other generative AI models. These workloads often demand high-performance


    computing resources and specialized hardware, such as GPUs. The challenge lies


    in extending Kubernetes to handle these demands effectively while maintaining
    its


    strengths in managing business applications.


    This book explores how to use Kubernetes to operationalize generative AI models.


    We address the specific challenges of running these workloads on a platform origi‐


    nally designed for traditional applications. While we assume some Kubernetes skills,


    we will delve into how Kubernetes’ features can be used to support AI workloads


    and how additional Kubernetes add-ons and platforms like Kubeflow can help fill
    the


    gaps, particularly in areas like inference and model customization.


    Before diving into the rest of the book, it’s helpful to understand some LLM funda‐


    mentals. The next section provides an optional primer on these concepts.


    **Understanding LLM Fundamentals**


    Throughout this book, we treat LLMs as operational “dark-gray boxes.” We manage


    their infrastructure, resources, and lifecycle without diving deep into neural
    network


    architectures or training mathematics. This approach is sufficient for most opera‐


    tional tasks.


    However, understanding some LLM fundamentals helps when you encounter speci‐


    alized concepts like Time To First Token (TTFT), token throughput, or key-value


    (KV) cache management. These operational metrics are rooted in how LLMs actually


    **Introduction **


    **| **



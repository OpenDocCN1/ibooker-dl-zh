  md: 'While KServe takes a Kubernetes-native approach, Ray offers a different philosophy,


    one that prioritizes Python-first development and brings its own orchestration
    layer.


    **Ray Serve and KubeRay**


    The Ray project, compared to KServe, is a newer project with a broader scope.
    It is an


    open source framework designed to build and scale ML applications easily. It is
    very


    Pythonic, making it user-friendly for those with Python experience, and it allows
    you


    to configure all activities directly within your Python codebase.


    Ray is not specific for model serving but instead defines a set of core concepts
    that are


    quite generic: Task, Actor, Object, Placement Group, and Environment Dependency.


    These core concepts, in addition to the Ray Cluster, define the execution model
    that


    is used to build and scale all the other features. Figure 1-5 represents the topology
    of a


    Ray cluster with head node and worker nodes.


    If you need a more comprehensive foundation on Ray, we suggest *Learning Ray*
    by


    Max Pumperla et al. (O’Reilly, 2023).


    ![](img/3a93443ca88ca3c8ef163f48ebd612bc_64_0.png)


    *Figure 1-5. Ray Cluster topology*


    In Figure 1-5, you can see that a Ray Cluster wasn’t designed with Kubernetes
    in


    mind. It has a standalone infrastructure to manage the scheduling and orchestration


    of jobs that you can usually do with the Kubernetes API and the different worker


    nodes. There is the concept of a head node that acts as the entry point for the
    jobs


    that are then dispatched to one or more worker nodes where the execution will


    happen.


    The set of features that Ray offers covers most of the ML use cases; Ray Train,
    Ray


    Tune, and Ray Serve are just a subset of them. Ray Serve is the component that
    we


    need to use to serve a model, the deployment is defined in Python, and is the
    same



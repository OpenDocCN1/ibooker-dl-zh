- pgno: 43
  md: 'The next step is to expose the model with an endpoint so that the prompt is
    dynamic


    and multiple users can invoke it. One simple way to do this is to use Python’s


    ecosystem, in particular, FastAPI and Pydantic. See Example 1-2.


    *Example 1-2. FastAPI generate endpoint*


    `**from**`` ``**fastapi**`` ``**import**`` ``FastAPI`


    `**from**`` ``**pydantic**`` ``**import**`` ``BaseModel`


    `**import**`` ``**transformers**`


    `app`` ``\=`` ``FastAPI``()`


    `**class**`` ``**InputText**``(``BaseModel``):`


    ` ``text``: ``str`


    `**class**`` ``**OutputText**``(``BaseModel``):`


    ` ``text``: ``str`


    `**def**`` ``get\_pipeline``():`


    ` ``model\_id`` ``\=`` ``"meta-llama/Llama-3.2-1B-Instruct"`


    ` ``**return**`` ``transformers``.``pipeline``(`


    ` ``"text-generation"``,`


    ` ``model``\=``model\_id``,`


    ` ``device\_map``\=``"auto"`


    ` )`


    `pipeline`` ``\=`` ``get\_pipeline``()`


    `@app``.``post``(``"/generate"``, ``response\_model``\=``OutputText``)`


    `**async**`` ``**def**`` ``generate\_func``(``prompt``: ``InputText``):`


    ` ``output`` ``\=`` ``pipeline``(``prompt``.``text``)`


    ` ``**return**`` {``"text"``: ``output``\[``0``\]\[``"generated\_text"``\]}`


    Creating a container image and deploying it on Kubernetes is possible, but produc‐


    tion workloads require more consideration. Scalability, throughput, reproducibility,


    and monitoring are critical for production deployments.


    At the same time, the example isn’t really model-specific. This suggests we’re
    already


    creating something generic that might be generalized even more. Essentially, we’re


    recreating a model server.


    **Model Server**


    A *model server* (or serving runtime) is a component that includes one or more


    runtimes. It can be distributed to use multiple GPUs simultaneously and execute


    various types of models. The models are exposed via an API (REST or gRPC) and


    optimized to maximize throughput and minimize latency (Figure 1-1).



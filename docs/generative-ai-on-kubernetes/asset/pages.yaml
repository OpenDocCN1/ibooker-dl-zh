  md: 'apply to distributed training workloads, which require sophisticated scheduling


    strategies like gang scheduling and quota management, covered in Chapter 7. The


    main options for autoscaling are:


    *Horizontal Pod Autoscaler (HPA)*


    While the default HPA works out of the box and requires no additional depen‐


    dencies, it primarily monitors CPU and memory. This makes it less suitable


    for LLM workloads, which predominantly impact GPUs, thus requiring a more


    flexible autoscaling solution.


    *Knative Pod Autoscaler (KPA)*


    The Knative Serving project offers KPA, a more flexible autoscaler that bases
    its


    decisions on the number of requests. Its default “stable” mode uses a time-based


    window for concurrency calculations to scale. A “panic” mode is also available,


    employing a much shorter window for faster reactions to workload changes.


    While KPA is a better fit for LLMs than HPA and integrates natively with KServe


    (using Knative deployment mode), it was designed for microservices where pod


    scaling is rapid. Unfortunately, LLMs are complex, GPU-dependent deployments


    that can take many minutes to load based on model size. This makes dynamic


    workload scaling less practical without significant tuning (refer to “Optimize


    vLLM Startup Time” on page 136). More importantly, a request-based approach


    like KPA’s fails to consider that the number of requests doesn’t directly correlate


    with runtime workload. One request could generate many tokens, while the next


    generates only a few.


    *Kubernetes Event-driven Autoscaling (KEDA)*


    KEDA is a project created to scale event-driven workloads where the request


    is not an HTTP request but a message from (usually) a queue. The challenge


    that KEDA creators had to solve is similar to the challenge of LLM scaling:


    there are many different technologies to implement event-driven architectures,


    and it is necessary to have a flexible API to configure how to retrieve the


    information to measure the overall pressure on the system. The solution that


    has been implemented enables the ability to configure a query based on metrics


    to guide the scaling. This is because every queue system publishes indicators


    like the number of messages in the queue to be processed, but every technol‐


    ogy has a different approach (i.e., push-based versus poll-based) and different


    naming conventions. This flexibility works well with vLLM too because the


    runtime publishes metrics like `vllm:num\_requests\_waiting` that measure how


    many requests are still waiting to be processed, or `vllm:time\_to\_first\_token\_`


    `seconds`/`vllm:time\_per\_output\_token\_seconds` to keep track of the time to


    produce every token. KServe natively supports KPA using Knative deployment


    mode, but it also supports KEDA via the Standard deployment mode. Go back to


    “KServe” on page 20 for more information on the different deployment modes of


    **Autoscaling **


    **| **


    **133**'

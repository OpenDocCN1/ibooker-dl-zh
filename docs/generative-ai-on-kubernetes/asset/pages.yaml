  md: '![](img/3a93443ca88ca3c8ef163f48ebd612bc_281_0.png)


    CNI is a Cloud Native Computing Foundation specification that


    defines a standardized interface between container runtimes and


    network plug-ins for configuring network interfaces in Linux con‐


    tainers.


    CNI plug-ins implement the Kubernetes network model by provid‐


    ing pod-to-pod and pod-to-external communication, with each


    plug-in responsible for creating network interfaces, assigning IP


    addresses, and establishing connectivity according to cluster net‐


    working requirements.


    The pluggable architecture allows Kubernetes clusters to use differ‐


    ent CNI implementations, such as Calico, Cilium, or Flannel, each


    providing the same core networking functionality while potentially


    offering additional features like network policies, encryption, or


    optimized data paths for specific use cases.


    Multus CNI operates as a meta-plug-in that delegates network interface creation


    to other CNI plug-ins based on NetworkAttachmentDefinition (NAD) custom


    resources that specify how secondary interfaces should be configured.


    For example, in the case of InfiniBand, the NAD configures secondary interfaces


    attached to the ib0 InfiniBand device on each node, assigning IP addresses and


    enabling direct RDMA access via the `rdmaIsolation: false` setting for scenarios


    like GPUDirect (see Example 7-10).



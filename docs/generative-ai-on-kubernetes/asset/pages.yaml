  md: '*Batch ingestion jobs*


    Document ingestion is not a one-time event but an ongoing process, and Kuber‐


    netes is well suited to running this work in the background. You can schedule


    ingestion with CronJobs that periodically fetch new or updated sources; parse,


    chunk, and embed them; and then upsert results into the vector database. For


    near-real-time pipelines, event-driven jobs can be triggered by file uploads or


    database updates. Document ingestion can also be modeled nicely as an endpoint


    of an Event Mesh as offered by Knative Eventing. Use resource requests and


    limits so that ingestion workloads do not starve user-facing services, and separate


    the namespaces or node pools if you need stricter isolation. By treating ingestion


    as a first-class workload, with monitoring and retries, you ensure that the vector


    database is fresh and your RAG system reflects the latest state of your domain.


    Technical details can be found in the *Batch Job* and *Periodic Job* patterns.


    With RAG we saw how to ground LLMs in trusted knowledge and operate the


    supporting components on Kubernetes. We now turn to agentic workflows, where the


    model not only consumes context but also plans actions, chooses tools, and iterates


    toward goals in short think-act-observe loops.


    **Agentic ****Workflows**


    Agentic apps wrap the inference calls to a model in a small control loop that
    can plan,


    call tools, observe results, and iterate until a goal is met.


    In general, the control loops looks like Figure 8-10 and contains the following
    steps:


    *Perceive*


    Read new signals: user input, tool output, and conversation state.


    *Think*


    Plan the next step, decide whether a tool is needed, and shape the next prompt


    turn.


    *Act*


    Execute an action: call a tool, run code, fetch data, or draft a candidate answer.


    *Observe*


    Capture the tool result or user follow-up and normalize it to the working context.


    *Reflect*


    Check progress against the goal, revise plan, and decide to stop or continue.


    *Remember*


    Store short-term scratchpad items and long-term facts in external memory.



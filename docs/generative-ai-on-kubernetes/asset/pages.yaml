- pgno: 280
  md: '*For tensor parallelism workloads*


    NVLink and NVSwitch become essential rather than optional, as the latency-


    sensitive nature of per-layer all-gather and reduce-scatter operations makes these


    workloads impractical on standard Ethernet and challenging even on InfiniBand


    for multinode configurations. Tensor parallelism typically remains within a sin‐


    gle node (8–16 GPUs with NVSwitch) or in small 2–4 node clusters with Infini‐


    Band, where the submicrosecond latency requirements can be met.


    *For pipeline parallelism workloads*


    The sequential nature of stage-to-stage communication benefits more from


    topology-aware scheduling that co-locates adjacent pipeline stages (minimizing


    communication hops) than from raw network bandwidth. RoCE or even opti‐


    mized Ethernet can suffice for pipeline parallelism, as point-to-point communi‐


    cation between stages represents moderate bandwidth requirements and can


    tolerate higher latency than tensor parallelism.


    *For hybrid parallelism combining multiple strategies*


    For data + tensor + pipeline, InfiniBand with GPUDirect RDMA becomes


    the practical choice, as these workloads require both high bandwidth (for data-


    parallel gradient synchronization) and low latency (for tensor-parallel layer
    com‐


    munication), with careful topology-aware scheduling for group tensor-parallel


    GPUs on NVSwitch domains and data-parallel replicas across InfiniBand fabric.


    Regardless of which network technology you choose (InfiniBand, RoCE, or opti‐


    mized Ethernet), implementing these high-performance fabrics in Kubernetes


    requires configuring secondary network interfaces beyond the cluster’s standard


    Container Network Interface (CNI) networking.


    **Using Secondary Network Interfaces in Kubernetes**


    Kubernetes originally designed its networking around a single network interface


    per pod, providing connectivity through the cluster’s CNI plug-in, but distributed


    training workloads require dedicated additional network interfaces and specialized


    fabrics like InfiniBand or RoCE.


    Multus CNI addresses this limitation by enabling pods to attach multiple network


    interfaces simultaneously so that the primary interface continues to use the cluster’s


    standard CNI, while secondary interfaces provide dedicated paths for training
    frame‐


    work communication over specialized networks.


    **Network Optimization for Distributed Training **



    106.


    Distributed training frameworks like PyTorch FSDP and DeepSpeed execute collec‐


    tive communication operations like all-reduce, all-gather, reduce-scatter, and
    point-


    to-point transfers during each training iteration, creating network traffic patterns
    that


    differ fundamentally from traditional application workloads.


    Understanding these communication patterns and their network requirements ena‐


    bles platform administrators to make informed infrastructure decisions that match


    network topology to workload characteristics.


    **Collective Communication Operations**


    Distributed training relies on three fundamental collective communication patterns:


    *All-reduce*


    Each worker computes gradients locally, then all workers combine (typically sum


    or average) their gradients and distribute the result back to all workers. This
    is


    the most common operation in data-parallel training, ensuring all workers have


    identical gradient updates before applying optimizer steps.


    *All-gather*


    Each worker contributes its data, and all workers receive the complete concaten‐


    ated dataset from all participants. Used in model-parallel training where different


    workers hold different model shards and need to exchange activation tensors or


    partial results.


    *Broadcast*


    One worker (typically rank-0) sends identical data to all other workers. Used
    for


    distributing initial model weights, hyperparameters, or checkpoint data from the


    rank-0 node to all workers.


    These operations execute synchronously, stopping the work on all the workers.
    This


    makes network latency and bandwidth critical bottlenecks that directly impact
    train‐


    ing throughput.


    A typical LLM training job with 8 nodes and 64 GPUs might synchronize billions


    of parameters every few seconds, generating sustained network traffic measured
    in


    hundreds of gigabits per second, with communication latency directly impacting


    training throughput as GPUs idle while waiting for synchronization to complete.


    Hardware vendors typically sell specialized “AI nodes” (such as NVIDIA DGX sys‐


    tems, Dell PowerEdge XE servers, or HPE Cray EX systems) that bundle high-end


    GPUs, up to eight per node, with CPUs, memory, and optimized intra-node inter‐


    connects like NVLink that provide hundreds of gigabytes per second of bandwidth



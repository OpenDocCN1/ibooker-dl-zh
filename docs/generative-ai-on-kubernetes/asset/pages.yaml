  md: '*Nonuniform startup times*


    Depending on whether the model OCI image has already been loaded in the


    Kubernetes’ node OCI runtime, the actual serving runtime can either start


    quickly or might take several minutes until a potentially large model OCI image


    is downloaded from a registry. To make the startup times more predictable,


    which is especially important in scale-to-zero scenarios, optimization techniques


    like image prefetching can be leveraged.


    *Multiarchitecture support*


    Modelcars require an active process to keep the sidecar alive. This process is


    specific to a certain CPU architecture, so if you want to use modelcar images
    in


    a multiarchitecture setup, then you need to create copies of modelcars, one for


    each supported CPU architecture. Those images contain the same ML model,


    thus wasting resources. However, tools like BuildKit, umoci, or skopeo can miti‐


    gate this duplication by creating multiarchitecture images with manifest lists
    that


    share architecture-independent layers (like model data) across platforms, while


    duplicating only the architecture-specific executable layers. This approach lever‐


    ages OCI’s content-addressable storage to deduplicate shared layers automatically


    when pushed to registries.


    All of these drawbacks can be overcome by *real* OCI image volume mounts. Luckily,


    Kubernetes 1.35 offers OCI image sources for volumes as a beta feature. It will


    still take some time until this mount type is generally available; in the meantime,


    modelcars are a good bridging technology with a smooth upgrade path until OCI


    image volume mounts arrive for everyone.


    **OCI Image Volume Mounts**


    Starting with Kubernetes 1.31, pods can directly mount OCI container images as


    volumes without the need to copy model data first. This feature provides an efficient


    way to access large model artifacts stored in OCI images, reducing both initialization


    time and storage overhead.


    The benefit of direct image mounts over the modelcar approach (see “Modelcars”
    on


    page 68) is that it avoids the need for symbolic links or process namespace sharing.


    Instead, model data can be directly read from the image layers as a mounted volume,


    benefiting from the underlying OCI image layer cache.


    Example 2-18 shows how to use an OCI image volume mount to serve a model


    directly with vLLM.



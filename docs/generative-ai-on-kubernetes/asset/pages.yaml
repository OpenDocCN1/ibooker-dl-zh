  md: '*PyTorch State Dict (*`.pt`*, *`.pth`*)*


    PyTorch’s native format for serializing weight tensors using the `state\_dict`


    method of `torch.nn.Module`. It is widely used for LLMs such as Llama, GPT,


    and BLOOM during development and fine-tuning stages.


    *TensorFlow checkpoints (*`.ckpt`*)*


    A format primarily used in TensorFlow’s ecosystem for storing model weights.


    While it was historically used for models like BERT, its relevance for modern


    LLMs has declined as PyTorch, which uses its own format, gained dominance in


    the GenAI space.


    *NumPy arrays (*`.npy`*, *`.npz`*)*


    NumPy’s native serialization format for numerical arrays. While still useful for


    storing smaller models or individual weight matrices, it lacks the structure and


    metadata needed for modern LLM deployments.


    These formats primarily store raw tensor data with minimal metadata, making them


    highly compact but dependent on external runtime code.


    As illustrated in Figure 2-1, a model stored in a weight-only format requires
    the


    same network architecture to be reconstructed during inference. You must manually


    replicate the training architecture in the inference environment, ensuring that
    both


    sides can correctly interpret the stored weight tensors.



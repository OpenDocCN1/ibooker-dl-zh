    tiple turns. Production deployments require persistent storage patterns that sur‐


    vive pod restarts and support horizontal scaling.


    This chapter covers two protocols that emerged as de facto standards in late 2024


    when it comes to agent communication. The Model Context Protocol (MCP) stand‐


    ardizes agent-to-tool communication, while Agent-to-Agent (A2A) standardizes



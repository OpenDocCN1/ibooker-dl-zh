- pgno: 16
  md: 'We have organized the content as follows:


    The book opens with the Introduction, which examines the operational challenges


    of running generative AI at scale and includes an optional technical primer on
    LLM


    fundamentals: tokenization, embeddings, and the two-phase inference process. This


    primer helps you understand operational metrics without requiring deep machine


    learning expertise, though you can skip it and treat LLMs as pure black boxes.


    The four parts that follow are:


    • Part I, “Inference”, establishes the foundation for deploying and serving LLMs.


    •


    You’ll learn how model size, storage requirements, and initialization time cre‐


    ate unique challenges compared to traditional workloads. These chapters cover


    packaging models in containers, managing multigigabyte model weights in per‐


    sistent storage, and handling workloads that require minutes to become ready.


    The focus is on getting your first generative AI service running reliably.


    • Part II, “Production Readiness”, addresses what happens after successful deploy‐


    •


    ment. GPU resource management becomes critical as you learn to schedule


    scarce accelerators efficiently and maximize their utilization. You’ll then explore


    scaling strategies that account for model warm-up times, rolling updates that


    maintain service availability, and optimization techniques that balance perfor‐


    mance with cost. The final chapter covers LLM observability, showing how to


    track metrics beyond CPU and memory: token throughput, prompt latency,


    inference costs, and model accuracy.


    • Part III, “Tuning”, shifts focus to model customization. Fine-tuning adapts
    pre-


    •


    trained models to specific domains or tasks, but introduces intense resource


    demands. A single tuning job may require multiple GPUs working in concert,


    consuming significant cluster resources. You’ll explore techniques like LoRA and


    PEFT that make customization more efficient, along with the operational chal‐


    lenges of managing tuning jobs on Kubernetes: job scheduling, quota allocation,


    resource management, and GPU configuration optimization.


    • Part IV, “AI-Driven Apps”, shows how to build complete applications around


    •


    LLM services. These chapters present architectural patterns for AI-driven sys‐


    tems, from chat interfaces and event-driven backends to retrieval-augmented


    generation that enhances model responses with domain-specific knowledge.


    You’ll explore agentic workflows where models coordinate tool invocation and


    multistep reasoning, then tackle the production challenges unique to agentic


    systems: security, state management, observability, cost control, and reliability.



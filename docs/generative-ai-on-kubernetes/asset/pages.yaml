    **Lessons Learned**


    In this chapter we explored the operational foundations required to run production-


    scale AI training workloads on Kubernetes, from scheduling and networking to


    storage and security.


    Operating production-scale AI training platforms requires fundamentally different


    approaches than traditional stateless application deployments. Network requirements


    must be considered during cluster provisioning, with choices strictly related
    to GPU


    models and interconnect topology.


    Gang scheduling and topology-aware scheduling become nonnegotiable because the


    default scheduler’s per-pod model creates resource fragmentation when jobs receive


    partial allocations, wasting expensive GPU resources.


    Security and storage represent operational foundations that cannot be retrofitted
    after


    deployment. Storage requires tiered solutions: object storage for datasets, distributed


    filesystems for shared checkpoints with RWX access enabling job resumption after


    preemption, and optionally, local NVMe for staging.


    Platform administrators should treat infrastructure design as product thinking,
    meas‐


    uring success by training job success rate and time-to-result rather than infrastruc‐


    ture uptime. The scheduling, security, storage, and observability choices documented


    in this chapter collectively define the developer experience for data scientists,
    treating


    them as customers whose workflow efficiency directly impacts the organization’s


    ability to iterate on model development and deliver AI capabilities to production.



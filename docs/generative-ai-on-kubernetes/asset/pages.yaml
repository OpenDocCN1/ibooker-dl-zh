    Figure 3-2 shows how to fan out to multiple replicas of the same model for many


    concurrent requests.


    ![](img/3a93443ca88ca3c8ef163f48ebd612bc_142_0.png)


    *Figure 3-2. Data parallelism: throughput scaling*


    Data parallelism is ideal when you need to serve many simultaneous users or API


    requests and the model fits in a single GPU’s memory. For instance, an LLM with
    7B


    parameters can often be quantized to 8 GB of memory, fitting on a 16-GB GPU—you


    might run 8 replicas on 8 GPUs to handle lots of chats in parallel. The limitation


    is that this does nothing to reduce the latency of a single query. Each query
    is still


    processed by one GPU from start to finish when the model is not parallelized,
    so


    if you have a single very large request that one GPU would take 10 seconds to


    handle, adding more GPUs for data parallelism won’t speed up that one request—it


    will just allow handling other requests concurrently. In fact, serving a single
    request


    on multiple model replicas would be wasteful because it consumes multiple GPUs


    to process the same input without reducing latency—instead, *model parallelism*,
    as


    described in “Model Parallelism” on page 106, is needed for that case.


    Another limitation is resource usage: running *N* replicas means storing *N* copies
    of


    the model weights in memory. This can be inefficient if the model is large and
    mem‐


    ory is limited. Some frameworks support multistream batching on a single model


    instance to improve utilization (e.g. vLLM, described in “vLLM” on page 8, can


    dynamically batch multiple incoming queries on one GPU to improve throughput),


    which is an alternative to full replication. In summary, data parallelism via
    multiple


    GPUs is straightforward, typically implemented as horizontal scaling of pods,
    but


    be mindful that it increases memory footprint linearly and saturates overall GPU


    compute only if you indeed have enough concurrent load. If request rate is low,



  md: 'From a Kubernetes platform perspective, many parameters are used to configure
    how


    the runtime loads and executes the model, but this is relatively transparent from
    a


    deployment standpoint. Optimizations such as PagedAttention, FlashAttention, and


    speculative decoding focus on efficient attention management and faster execution.


    While they don’t impact deployment directly, they do affect scalability and resource


    optimization.


    For a deeper dive into these optimization techniques and their implications, see
    the


    following sidebar.


    **LLM Inference Optimization**


    The optimization of LLM execution is a rapidly evolving field with continuous


    advancements. Academia and engine implementation are closely coupled in this


    domain.


    New optimization techniques emerge frequently, and proper evaluation requires
    time


    to assess their practical benefits.


    In this scenario we already mentioned some key optimizations like PagedAttention


    and Flash Attention, which specifically make self-attention faster given the quadratic


    time and memory complexity of this phase when optimizing memory management.


    Another investment area is to reduce the size of the model minimizing performance


    loss using multiple quantization techniques; this reduces the floating point size
    of the


    weights of the model.


    Beyond runtime optimizations, model distillation offers another path to faster
    infer‐


    ence by training a smaller “student” model to approximate a larger “teacher” model’s


    behavior. This model creation technique can reduce model size significantly while


    retaining much of the original capability.


    Speculative decoding is an optimization technique that leverages a two-model


    approach: a small, fast “draft” model predicts several tokens ahead, and the large


    model verifies those predictions in a single pass. By running the expensive large


    model less frequently while maintaining the same output quality, speculative decod‐


    ing can improve throughput by 1.5 to 3 times, depending on how predictable the


    sequence is.


    For more on model customization techniques, see Chapter 6.


    There are many different ways to optimize the execution of an LLM. This book


    doesn’t aim to explain all of them. Fortunately, from an MLOps engineer perspective,


    you don’t need to be an expert in LLM optimization internals. Use a model server


    that is actively developed with a large community so that every new optimization


    is included. The configuration of vLLM, for example, is usually limited to changing


    the startup parameters of the runtime, and the project is getting better and better
    at



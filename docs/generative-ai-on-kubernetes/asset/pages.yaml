  md: '2 As of early 2026, MCP has added asynchronous task execution, further narrowing
    the functional gap with


    A2A. With both protocols now under Linux Foundation governance, they are positioned
    as complementary


    layers, but it is not implausible that MCP’s adoption advantage will eventually
    absorb A2A’s functionality.


    **Agent-to-Agent Protocol**


    In “Multiagent Systems” on page 295 we introduced multiagent systems where speci‐


    alized agents collaborate on complex tasks. A planner agent might break down a


    feature request into smaller steps, delegate code generation to a coder agent,
    and


    send the resulting implementation to a tester agent for validation. Each agent
    brings


    domain expertise, but without a standard way to communicate, these systems become


    brittle and framework locked.


    As of early 2026, most multiagent frameworks still use their own internal coordina‐


    tion mechanisms. LangGraph uses in-process Python function calls to pass control


    between agents. CrewAI implements custom REST endpoints for agent communica‐


    tion. This fragmentation creates operational challenges when you need distributed


    agents to work across cluster boundaries, when different teams use different frame‐


    works, or when compliance requires auditable communication between agents. You


    cannot easily connect a LangGraph planner to a CrewAI coder, and you cannot mon‐


    itor or enforce policies on agent interactions that happen inside framework-specific


    abstractions.


    The Agent-to-Agent (A2A) protocol emerged to solve this coordination problem.


    A2A standardizes how agents discover each other’s capabilities, delegate tasks,
    track


    progress, and stream results. It provides a common language for multiagent systems,


    much like HTTP provides a common language for web services. In August 2025,


    IBM’s Agent Communication Protocol (ACP) merged into A2A under the Linux


    Foundation, consolidating the two major agent-to-agent communication initiatives.


    ACP brought a RESTful approach to agent communication (complementing MCP’s


    JSON-RPC), and its integration into A2A strengthens the protocol as the unified


    standard for agent interoperability.


    **A2A complements MCP**


    Before diving into A2A itself, we should clarify how it relates to MCP, covered
    in the


    previous section. Both are standards for connecting AI components, but they serve


    different purposes and operate at different levels of abstraction.


    MCP connects agents to tools and data sources, and it follows a synchronous request-


    response pattern:² the agent sends a typed request, the tool performs an operation,


    and the tool returns a result. This makes MCP ideal for integrating agents with
    the


    operational environment around them.


    **Agent-to-Agent Protocol **


    **| **



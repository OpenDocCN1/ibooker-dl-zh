    ple—you can combine SPIFFE for workload authentication with the user identity
    in


    request headers or JWT claims. The agent runtime establishes mTLS via its SPIFFE


    ID, like `spiffe://example.com/ns/agents/sa/agent-runtime`, while passing user


    context in an `X-User-ID` header. The MCP server validates the SPIFFE ID to trust
    the


    workload, then uses the user ID for authorization and audit logs.


    SPIFFE eliminates secret sprawl entirely—no API keys, tokens, or client secrets
    to


    manage. SPIRE handles credential issuance and automatic hourly rotation without


    application restarts. If you already use a service mesh, you can configure them
    to use



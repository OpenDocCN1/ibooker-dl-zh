- pgno: 374
  md: '*Externalize state from the beginning*


    In-memory state will fail the moment you scale horizontally or survive a pod


    restart. Use a KV store for session state, and implement checkpointing for long-


    running workflows. Retrofitting state management after scaling to production is


    painful.


    *Leverage Kubernetes primitives*


    Deployments, Services, NetworkPolicies, RBAC, StatefulSets, and Jobs are battle-


    tested patterns that work just as well for agentic workloads as they do for tradi‐


    tional microservices.


    *Start simple*


    Deploy agents as standard Kubernetes deployments before introducing service


    meshes or custom operators. Layer complexity only when you hit concrete


    limitations, not because the architecture looks elegant on a whiteboard. The


    operational rigor you build now will remain essential regardless of how the


    technology evolves.


    The protocols may change, but the need for secure communication, standardized


    coordination, and persistent state will remain constant.


    **Lessons Learned **


    **| **



    **Parameter-Efficient**** Fine-Tuning**


    Parameter-Efficient Fine-Tuning (PEFT) is a group of techniques that takes a differ‐


    ent approach to tuning a model. The original model remains unchanged; instead,
    it


    is composed with new layers that influence its behavior at runtime during inference.


    While conceptually similar to prompt engineering in that both influence model


    behavior without full retraining, PEFT embeds learned parameters directly into
    the


    model architecture rather than relying on text-based prompts at runtime. From
    a


    Kubernetes platform perspective, PEFT is much easier to manage for both training


    and serving. The training phase requires fewer data samples (between 100 and 1,000


    labeled examples), making the training job shorter and less hardware intensive.
    Serv‐


    ing these fine-tuned models is also more efficient. The base model can be dynamically


    composed with one or more tuned layers at runtime in the same deployment, thanks


    to support in modern inference engines. We cover efficient model storage in “OCI


    Image for Storing Model Data” on page 65 and inference routing in “LLM-Aware


    Routing” on page 139. The main drawback of PEFT is that it has a more limited



  md: 'Although the default vLLM configuration is usually a valid starting point,
    you need to


    perform some sizing analysis to calculate how much VRAM memory the GPU needs


    (see the following sidebar for detailed calculation guidelines).


    **How to Calculate Model Memory Requirements**


    Many different factors contribute to the definition of the memory requirements.
    Most


    of them are related to the model architecture and the model size, together with
    the


    number of concurrent requests.


    The main driver of a model’s memory requirements is the number of parameters:
    a


    model with 8 billion (8B) parameters requires way less memory compared to very


    large models that can reach more than 400 billion parameters.


    Each parameter in a full-size model typically occupies 2 bytes (16 bits, `float16`
    or


    `bfloat16`) of memory. Through compression techniques, this can be reduced to
    1


    byte (8 bits, `FP8` or `INT8`) per parameter. Multiplying the number of parameters
    with


    the size of each produces the baseline memory requirement.


    In addition to this baseline, some infrastructure space related to the optimized
    ker‐


    nels is loaded to the GPU, usually between 300 MB and 2 GB.


    The cost of the activations that represent the intermediate status during the
    execution


    should also be considered. It is directly related to the hidden size value and
    the


    number of layers. Both of these values can be found in the *config.json* file
    for the


    model (i.e., 40 layers). Activation memory requirements might be limited to 200–300


    MB when the sequence length is small (i.e., 512), but this changes dramatically
    with


    larger sequences because the cost grows quadratically.


    Finally, the output generation requires an output tensor with a cost that is directly


    related to the vocabulary size, the sequence length, and the batch size.


    For a full example with a 8B model that uses parameters of `float16` format, 2048


    context size, and batch size 1: the baseline memory requirement is about 16 GB
    (8


    billion x 2 bytes). It is usually necessary to consider about 1 GB of additional
    memory


    for the infrastructure, activation space of about 900 MB (assuming 4096 as the
    hidden


    size), and finally about 400 MB for the output layer.


    The total VRAM requirement is about 17.3 GB, which seems reasonable. However,


    simply increasing the batch size to 10 for processing multiple requests simultaneously


    almost doubles this requirement, pushing it to over 28 GB of VRAM.


    This topic is much larger than this simplified example. New techniques and model


    architectures are defined frequently, changing the memory implications. For example,


    there are ongoing evolutions like the Mamba LLM architecture that should dramati‐


    cally reduce the size requirements for the KV cache.


    **Model and Runtime Tuning **


    **| **



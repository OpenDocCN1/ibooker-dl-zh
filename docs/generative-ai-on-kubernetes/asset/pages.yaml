  md: '**What Is NCCL and RDMA?**


    NCCL is a high-performance library designed for efficient GPU-to-GPU communi‐


    cation in multi-GPU and multinode environments. It provides optimized collective


    communication primitives such as *all-reduce*, *broadcast*, *reduce-scatter*,
    and *all-gather*,


    which are essential for synchronizing model parameters or intermediate results
    dur‐


    ing tensor and pipeline parallelism. NCCL is typically not used directly by end


    users; instead, it is leveraged under the hood by inference runtimes like vLLM,
    and


    frameworks such as PyTorch, which abstract its complexity behind higher-level
    APIs.


    However, in distributed Kubernetes deployments, advanced users may need to tune


    NCCL-related settings (e.g., `NCCL\_SOCKET\_IFNAME`) to ensure optimal performance


    over specific network interfaces. When available, RDMA can be used by NCCL to


    bypass the CPU and directly access GPU memory on remote nodes, significantly


    reducing latency and improving bandwidth in multinode inference setups. RDMA


    typically requires specialized accelerated networking devices, such as InfiniBand
    or


    RoCE-capable network adapters. Properly configured, NCCL with RDMA plays a


    crucial role in achieving scalable, high-throughput inference for LLMs across
    multiple


    GPUs and nodes.


    For multinode inference, the typical approach is to run one pod per node and


    coordinate them externally. Popular inference runtimes often leverage orchestration


    frameworks to simplify this process. For instance, in multinode deployments vLLM


    uses Ray, a distributed computing framework with its own scheduler, to orchestrate


    inference across multiple nodes. On Kubernetes, Ray runs inside pods managed by


    the KubeRay operator. Kubernetes still schedules and restarts pods, while Ray’s
    run‐


    time coordinates distributed vLLM workers across nodes, handling task placement,


    node discovery, and some fault-tolerance concerns. Other runtimes, such as Hugging


    Face’s TGI, rely on Kubernetes-native constructs like StatefulSets or deployments,


    where one pod acts as a coordinator (commonly referred to as “rank-0”) and man‐


    ages communication between model partitions on different pods.


    Figure 3-6 illustrates this multinode architecture, showing multiple nodes, each
    host‐


    ing multiple GPUs orchestrated by vLLM for inference.



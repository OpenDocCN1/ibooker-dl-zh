  - 表 7.3 跨越 13 个分子目标的 QM9 基准比较。行列出预测属性：偶极矩 (mu)、极化率 (alpha)、HOMO、LUMO、能隙、电子空间范围 (R2)、零点振动能
    (ZPVE)、原子化能目标 (`U[0]`)、U、H、G、热容 (Cv) 和最高振动频率 (Omega)。列比较了手工设计的描述符方法、先前的基于图的基线以及论文的最佳消息传递模型。每个单元格报告的误差与目标的化学精度阈值的比值，因此低于
    1.0 的值表示化学精度。带有显式氢的边网络（“enn”）+ `set2set`（“s2s”）模型（“`enn-s2s`”）是所有目标中最佳的单模型，而五模型集成（“`enn
    -s2s-ens5`”）进一步提高了性能。

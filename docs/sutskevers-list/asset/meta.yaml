  - 图 5.1 Transformer 架构的简化示意图。模型由一个编码器（左）和一个解码器（右）组成，每个都由重复的子层堆叠而成，包括多头注意力机制、前馈神经网络以及残差连接和层归一化等后处理步骤。位置编码（表示为圆圈交叉）被添加到输入嵌入中以显式表示词元顺序。该图强调了交叉注意力操作（虚线框标为“Cross-attention”），其中解码器的查询（`Q`）与编码器的键（`K`）和值（`V`）交互。在交叉注意力期间，每个解码步骤计算注意力分数以确定编码输入表示的相关性，产生引导词元生成的上下文向量。这种选择性对齐使解码器能够整合来自编码器的上下文信息，从而提高输出序列的准确性和连贯性。

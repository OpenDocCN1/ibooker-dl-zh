  - 图 7.6 (a) RMC 接收先前的记忆矩阵和当前输入，并应用标记为 A 的多头点积注意力 (MHDPA) 模块，使记忆槽能够相互之间以及与输入交换信息。然后，它使用一个小型前馈网络
    (MLP) 细化每个槽，并通过门控写入结果，以产生该步的输出和下一个记忆状态。(b) 对于每个记忆槽和输入，模型形成 *查询、键,* 和 *值*，使多个“头”能够从不同视角查看关系。(c)
    *查询* 和 *键* 之间的相似性产生归一化的注意力权重，用于计算值的加权组合。结果更新记忆矩阵，使每个槽整合来自其他槽的最相关信息。MLP 和门控然后确定下一步保留的内容。*经主要作者
    (Adam Santoro) 许可使用。*
